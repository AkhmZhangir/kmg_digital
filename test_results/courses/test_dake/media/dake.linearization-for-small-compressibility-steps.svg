<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-label="Схема шагов: Линеаризация уравнения для жидкостей малой сжимаемости"><style>
.bg{fill:#ffffff}.box{fill:#eef3f1;stroke:#56625d;stroke-width:1.2}.obs{fill:#e3f1e8;stroke:#2c8350}.inf{fill:#e4ecf7;stroke:#2f65a8}
.ass{fill:#f7e6ee;stroke:#b83a72}.t{font:14px system-ui,sans-serif;fill:#17211e}.s{font:12px system-ui,sans-serif;fill:#56625d}
.h{font:600 15px system-ui,sans-serif;fill:#17211e}.ar{stroke:#0c6b6b;stroke-width:2;fill:none;marker-end:url(#a)}.ax{stroke:#56625d;stroke-width:1}
.c1{stroke:#0c6b6b;stroke-width:2.2;fill:none}.c2{stroke:#9c6c12;stroke-width:2.2;fill:none}.c3{stroke:#b23a3a;stroke-width:2.2;fill:none}
.tag{font:11px ui-monospace,monospace;fill:#56625d}
@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="640" height="350" rx="10"/><text x="20" y="26" class="h">Линеаризация уравнения для жидкостей малой сжимаемости</text><rect class="box" x="20" y="40" width="600" height="52" rx="8"/><text x="34" y="62" class="h">1</text><text x="58" y="62" class="t">Раскрыть левую часть исходного уравнения через цепное правило</text><text x="58" y="80" class="t">(уравнение 5.16).</text><path class="ar" d="M320 94 L320 112"/><rect class="box" x="20" y="116" width="600" height="52" rx="8"/><text x="34" y="138" class="h">2</text><text x="58" y="138" class="t">Подставить производную из соотношения (5.17) в уравнение (5.16) для</text><text x="58" y="156" class="t">получения промежуточного уравнения (5.18).</text><path class="ar" d="M320 170 L320 188"/><rect class="box" x="20" y="192" width="600" height="52" rx="8"/><text x="34" y="214" class="h">3</text><text x="58" y="214" class="t">Исключить нелинейные слагаемые, учитывая независимость вязкости от</text><text x="58" y="232" class="t">давления и малость квадрата градиента давления.</text><path class="ar" d="M320 246 L320 264"/><rect class="box" x="20" y="268" width="600" height="52" rx="8"/><text x="34" y="290" class="h">4</text><text x="58" y="290" class="t">Записать итоговое линейное уравнение пьезопроводности (5.20),</text><text x="58" y="308" class="t">предполагая постоянство сжимаемости жидкости.</text><text x="630" y="342" text-anchor="end" class="tag">схема · по тексту книги</text></svg>
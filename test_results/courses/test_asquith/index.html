"kind": "observation", "text": "Для водоносного случая водонасыщенность равна единице.", "quote": "If the water-bearing case is considered, where Sw = 1, the equation reduces to:", "unit": "u130-24", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity-basis.c4", "kind": "observation", "text": "Rt заменяется на сопротивление водоносного пласта Ro.", "quote": "Where the formation is actually water filled, Rt reverts to the water-bearing resistivity (Ro).", "unit": "u130-26", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity-basis.c5", "kind": "observation", "text": "Рассчитанная пористость близка к реальной при правильных параметрах.", "quote": "The porosity calculated from this equation is close to the actual formation porosity, assuming that the parameters in the equation are close to the actual formation parameters.", "unit": "u130-26", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity-basis.c6", "kind": "observation", "text": "В нефтенасыщенном пласте Rt больше Ro, а расчетная пористость занижена.", "quote": "When the formation contains hydrocarbons, Rt is greater than Ro, and the calculated porosity is less than the actual formation porosity.", "unit": "u130-26", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity-basis.c7", "kind": "observation", "text": "Кривая сопротивленческой пористости сравнивается с SP или кривой пористости для поиска углеводородов.", "quote": "Traditionally this curve has been plotted in the same log track as the SP curve, and its movement compared to the SP. It can also be plotted in the same track as a porosity curve from one of the porosity tools, where decreases in conductivity-derived porosity with respect to the porosity curve indicate the presence of hydrocarbons.", "unit": "u130-27", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity-basis.c8", "kind": "observation", "text": "Водонасыщенность оценивается через отношение пористостей.", "quote": "Water saturation can be estimated by the following equation:", "unit": "u130-28", "page": 130, "by": "model", "verified": true}], "term_ids": ["t-conductivity-derived-porosity-x"], "units": ["u130-21", "u130-22", "u130-23", "u130-24", "u130-25", "u130-26", "u130-27", "u130-28", "u130-29"], "video_criteria": ["cause_effect", "invisible_visible"], "fallback": false}, {"id": "asquith.wet-resistivity-ro-curve", "order": 10, "part_id": "p9", "minutes": 3, "title": "Экспресс-анализ по кривой Ro (wet resistivity)", "book_title": "Wet resistivity (Ro)", "pages": [131, 131], "difficulty": {"primary": "Пр", "secondary": "И"}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критерии видеоёмкости: невидимое становится видимым. Текст содержит четкую пошаговую процедуру экспресс-анализа и визуальные паттерны поведения кривых, что идеально подходит для текстового формата с интерактивными иллюстрациями.", "scene_template": "step-flow"}, "summary": [{"text": "Кривая Ro представляет собой один из старейших экспресс-методов интерпретации, который накладывается прямо на кривую сопротивления для поиска углеводородов.", "claims": ["wet-resistivity-ro-curve.c1"], "page": 131, "by": "model"}, {"text": "Метод основан на сопоставлении расчетного сопротивления полностью водонасыщенной породы с глубоким измерением сопротивления пласта.", "claims": ["wet-resistivity-ro-curve.c2"], "page": 131, "by": "model"}], "how_it_works": [{"text": "Кривая Ro рассчитывается из пористости и оценки удельного сопротивления пластовой воды.", "claims": ["wet-resistivity-ro-curve.c3"], "page": 131, "by": "model"}, {"text": "Для расчета Ro обычно используют акустический или плотностный метод измерения пористости вместе с параметрами a, m и Rw.", "claims": ["wet-resistivity-ro-curve.c4"], "page": 131, "by": "model"}, {"text": "Полученную кривую Ro выводят в том же масштабе, что и кривые сопротивления, прямо во время геофизических исследований скважин.", "claims": ["wet-resistivity-ro-curve.c5"], "page": 131, "by": "model"}, {"text": "В водоносных интервалах кривая Ro и кривое глубокого сопротивления должны полностью совпадать.", "claims": ["wet-resistivity-ro-curve.c6"], "page": 131, "by": "model"}, {"text": "В нефтегазонасыщенных интервалах глубокое сопротивление выше Ro, и величина расхождения растет с увеличением насыщенности углеводородами.", "claims": ["wet-resistivity-ro-curve.c7"], "page": 131, "by": "model"}, {"text": "Если для расчета Ro задать неверное значение сопротивления воды Rw, кривые не совпадут в водоносных интервалах.", "claims": ["wet-resistivity-ro-curve.c8"], "page": 131, "by": "model"}, {"text": "При необходимости можно рассчитать водонасыщенность по формуле Арчи для любой зоны, используя значения Ro и глубокого сопротивления.", "claims": ["wet-resistivity-ro-curve.c9"], "page": 131, "by": "model"}], "steps": [{"text": "Рассчитать Ro из пористости и оценки удельного сопротивления пластовой воды.", "claims": ["wet-resistivity-ro-curve.c10"], "page": 131, "by": "model"}, {"text": "Построить Ro в виде кривой в том же масштабе, что и кривые сопротивления, и сравнить значения с глубоким сопротивлением.", "claims": ["wet-resistivity-ro-curve.c11"], "page": 131, "by": "model"}, {"text": "При желании можно рассчитать водонасыщенность по Арчи для любой зоны по значениям Ro и глубокого сопротивления.", "claims": ["wet-resistivity-ro-curve.c12"], "page": 131, "by": "model"}], "examples": [], "numbers": [], "formulas": [{"latex": "R_o = F \\times R_w = \\frac{a \\times R_w}{\\phi^m}", "page": 131, "vars": [{"sym": "R_o", "meaning": "удельное сопротивление породы, полностью заполненной водой", "unit": "ом·м"}, {"sym": "F", "meaning": "формационный фактор (коэффициент пористости)", "unit": "безразмерный"}, {"sym": "R_w", "meaning": "удельное сопротивление пластовой воды", "unit": "ом·м"}, {"sym": "a", "meaning": "параметр уравнения Арчи (коэффициент извилистости)", "unit": "безразмерный"}, {"sym": "\\phi", "meaning": "пористость", "unit": "доли единицы или проценты"}, {"sym": "m", "meaning": "индекс цементации", "unit": "безразмерный"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Кривая пористости (акустическая или плотностная), оценка удельного сопротивления пластовой воды Rw, параметры a и m, а также кривая глубокого удельного сопротивления.", "output": "Кривая Ro для визуального наложения на сопротивление и возможность расчета водонасыщенности.", "breaks": [{"text": "Если значение Rw выбрано неверно, кривые Ro и глубокого сопротивления не сойдутся в водоносных зонах.", "claims": ["wet-resistivity-ro-curve.c8"], "page": 131, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Неверный выбор параметров a или m также может привести к расхождению кривых в водоносных зонах.", "claims": [], "page": 131, "by": "model"}]}, "analogy": {"text": "Наложение расчетного базового профиля на реальный метрик в мониторинге производительности ИТ-системы для поиска аномалий.", "breaks_where": "В ИТ пороги обычно статические или динамические тренды, а в геологии кривая Ro жестко физически завязана на уравнение Арчи и пористость породы."}, "now_practice": [], "layers": {"mechanism": [{"text": "Метод завязан на расчет сопротивления воображаемого 100% водонасыщенного коллектора с последующим сравнением с фактом.", "claims": ["wet-resistivity-ro-curve.c3", "wet-resistivity-ro-curve.c6"], "page": 131, "by": "model"}], "practice": [{"text": "Кривая генерируется прямо в процессе каротажа для оперативной оценки характера насыщения.", "claims": ["wet-resistivity-ro-curve.c5"], "page": 131, "by": "model"}], "nuances": [{"text": "Главный риск метода — ошибка в задании сопротивления пластовой воды Rw, ломающая сходимость в воде.", "claims": ["wet-resistivity-ro-curve.c8"], "page": 131, "by": "model"}], "deeper": [{"text": "Основой метода служат уравнения Арчи, связывающие пористость, структуру порового пространства через параметры a и m с проводимостью воды.", "claims": ["wet-resistivity-ro-curve.c13"], "page": 131, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.wet-resistivity-ro-curve.ill1", "class": "B", "src": "media/asquith.wet-resistivity-ro-curve-steps.svg", "alt": "Порядок действий по тексту автора: Экспресс-анализ по кривой Ro (wet resistivity)", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.wet-resistivity-ro-curve.ill2", "class": "B", "src": "media/asquith.wet-resistivity-ro-curve-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Экспресс-анализ по кривой Ro (wet resistivity)", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.conductivity-derived-porosity-basis", "type": "prerequisite"}], "claims": [{"id": "wet-resistivity-ro-curve.c1", "kind": "observation", "text": "Кривая Ro — это старый экспресс-метод, который накладывается на кривую сопротивления.", "quote": "The wet-resistivity curve ($R_o$) is one of the oldest quick-look techniques. Unlike the other curves, which tend to be compared to the SP curve, it is plotted as an overlay on the resistivity curve.", "unit": "u131-04", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c2", "kind": "inference", "text": "Метод основан на сопоставлении расчетного Ro для воды с глубоким измерением сопротивления.", "quote": "Calculate $R_o$ from the porosity and an estimate of formation water resistivity ($R_w$). Plot $R_o$ as a curve at the same scale as the resistivity curves and compare the values to the value of the deep-resistivity measurement.", "unit": "u131-06", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c3", "kind": "observation", "text": "Ro рассчитывается из пористости и оценки Rw.", "quote": "Calculate $R_o$ from the porosity and an estimate of formation water resistivity ($R_w$).", "unit": "u131-06", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c4", "kind": "observation", "text": "Для расчета используется пористость (акустическая или плотностная) и параметры Rw, a, m.", "quote": "$R_o$ is then calculated from a porosity measurement, usually the sonic or density, with an estimate of $R_w$, $a$, and $m$.", "unit": "u131-14", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c5", "kind": "observation", "text": "Кривая может генерироваться и отображаться прямо во время каротажа.", "quote": "The curve can be generated and displayed during the logging job.", "unit": "u131-14", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c6", "kind": "observation", "text": "В водоносных зонах Ro и глубокое сопротивление совпадают (overlay).", "quote": "In water-bearing zones, $R_o$ and the deep resistivity should overlay.", "unit": "u131-08", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c7", "kind": "observation", "text": "В нефтенасыщенных зонах глубокое сопротивление выше Ro, расхождение растет с ростом насыщенности.", "quote": "In hydrocarbon-bearing zones, the deep resistivity is higher than $R_o$, with the separation increasing with increasing hydrocarbon saturation.", "unit": "u131-08", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c8", "kind": "observation", "text": "При неверном Rw кривые не сойдутся в водоносных интервалах.", "quote": "If the value of $R_w$ chosen to calculate $R_o$ is incorrect, the curves would not align in water-bearing zones.", "unit": "u131-10", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c9", "kind": "observation", "text": "Можно рассчитать водонасыщенность по Арчи из Ro и глубокого сопротивления.", "quote": "If desired, an Archie water saturation can be calculated in any zone from the values of $R_o$ and the deep resistivity measurement.", "unit": "u131-06", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c10", "kind": "observation", "text": "Шаг 1: расчет Ro из пористости и Rw.", "quote": "1. Calculate $R_o$ from the porosity and an estimate of formation water resistivity ($R_w$).", "unit": "u131-06", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c11", "kind": "observation", "text": "Шаг 2: построение Ro в том же масштабе и сравнение с глубоким сопротивлением.", "quote": "2. Plot $R_o$ as a curve at the same scale as the resistivity curves and compare the values to the value of the deep-resistivity measurement.", "unit": "u131-06", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c12", "kind": "observation", "text": "Шаг 3: расчет водонасыщенности по Арчи при желании.", "quote": "3. If desired, an Archie water saturation can be calculated in any zone from the values of $R_o$ and the deep resistivity measurement.", "unit": "u131-06", "page": 131, "by": "model", "verified": true}, {"id": "wet-resistivity-ro-curve.c13", "kind": "observation", "text": "Формула для расчета Ro через пористость и параметры.", "quote": "$$R_o = F \\times R_w = \\frac{a \\times R_w}{\\phi^m} \\tag{7.21}$$", "unit": "u131-13", "page": 131, "by": "model", "verified": false}], "term_ids": ["t-wet-resistivity-ro", "t-quick-look-technique"], "units": ["u131-03", "u131-04", "u131-05", "u131-06", "u131-07", "u131-08", "u131-09", "u131-10", "u131-11", "u131-12", "u131-13", "u131-14"], "video_criteria": ["invisible_visible"], "fallback": false}, {"id": "asquith.bulk-volume-water-bvw", "order": 11, "part_id": "p10", "minutes": 4, "title": "Объемная вода в пласте (BVW) и график Бакклза", "book_title": "BULK VOLUME WATER", "pages": [131, 131], "difficulty": {"primary": "Р", "secondary": "Ф"}, "threshold": true, "format": {"primary": "cards", "reason": "Тип «распознавание»; критерии видеоёмкости: цепочка «причина → следствие», скачок масштаба. Текст содержит формулы, таблицы и графические концепции, которые отлично подходят для комбинации текста, формульного редактора и интерактивных графиков.", "scene_template": "feature-gallery"}, "summary": [{"text": "Объемная вода в пласте (BVW) вычисляется как произведение водонасыщенности и пористости.", "claims": ["bulk-volume-water-bvw.c1"], "page": 131, "by": "model"}, {"text": "Постоянные значения BVW по глубине указывают на единый тип породы и достижение остаточной водонасыщенности.", "claims": ["bulk-volume-water-bvw.c2"], "page": 131, "by": "model"}, {"text": "График Бакклза сопоставляет пористость и водонасыщенность, помогая оценить характер насыщения пласта.", "claims": ["bulk-volume-water-bvw.c3"], "page": 131, "by": "model"}], "how_it_works": [{"text": "Объемная вода в пласте ($BVW$) представляет собой произведение водонасыщенности нетронутой зоны ($S_w$) на пористость ($\\phi$).", "claims": ["bulk-volume-water-bvw.c1"], "page": 131, "by": "model"}, {"text": "Если расчетные значения $BVW$ на разных глубинах постоянны или близки к постоянным, зона сложена единым типом породы и находится при остаточной водонасыщенности ($S_{w\\ irr}$).", "claims": ["bulk-volume-water-bvw.c2"], "page": 131, "by": "model"}, {"text": "В зоне с остаточной водонасыщенностью вода в нетронутой зоне не движется из-за удержания на зернах капиллярным давлением.", "claims": ["bulk-volume-water-bvw.c4"], "page": 131, "by": "model"}, {"text": "Добыча углеводородов из зоны с остаточной водонасыщенностью должна быть безводной.", "claims": ["bulk-volume-water-bvw.c5"], "page": 131, "by": "model"}, {"text": "Формация не в состоянии остаточной водонасыщенности демонстрирует широкий разброс значений $BVW$.", "claims": ["bulk-volume-water-bvw.c6"], "page": 131, "by": "model"}, {"text": "График Бакклза — это график зависимости пористости от $S_w$, на котором точки с равным $BVW$ образуют гиперболические кривые.", "claims": ["bulk-volume-water-bvw.c7"], "page": 131, "by": "model"}, {"text": "Для формации при остаточной водонасыщенности точки на графике Бакклза ложатся на одну гиперболическую кривую.", "claims": ["bulk-volume-water-bvw.c8"], "page": 131, "by": "model"}, {"text": "Если данные поступают из резервуаров с большими процентами производимой воды, точки на графике рассеяны сильнее.", "claims": ["bulk-volume-water-bvw.c9"], "page": 131, "by": "model"}, {"text": "Объемная вода увеличивается с уменьшением размера зерен, так как капиллярное удержание воды зернами растет при уменьшении их размера.", "claims": ["bulk-volume-water-bvw.c10"], "page": 131, "by": "model"}, {"text": "Значения $BVW$ для карбонатов следует использовать только как очень общий ориентир для различных типов пористости.", "claims": ["bulk-volume-water-bvw.c11"], "page": 131, "by": "model"}], "steps": [{"text": "Рассчитайте $BVW$ как произведение $S_w$ и $\\phi$ для различных глубин пласта.", "claims": ["bulk-volume-water-bvw.c1"], "page": 131, "by": "model"}, {"text": "Постройте график Бакклза ($\\phi$ против $S_w$) и проанализируйте положение точек относительно гиперболических кривых постоянного $BVW$.", "claims": ["bulk-volume-water-bvw.c7"], "page": 131, "by": "model"}, {"text": "Сопоставьте полученные значения $BVW$ с литологией и размером зерен по табличным данным для оценки характера пористости и наличия остаточной воды.", "claims": ["bulk-volume-water-bvw.c10", "bulk-volume-water-bvw.c11"], "page": 131, "by": "model"}], "examples": [], "numbers": [{"text": "В таблице 7.1 для кластических пород указаны размеры зерен от 1.0 до 0.5 мм (coarse) до менее 0.062 мм (silt), а для карбонатов выделены вуговая, межкристаллическая и другие типы пористости.", "claims": ["bulk-volume-water-bvw.c12"], "page": 131, "by": "model"}], "formulas": [{"latex": "BVW = S_w \\times \\phi", "page": 131, "vars": [{"sym": "BVW", "meaning": "объемная вода в пласте", "unit": "u131-19"}, {"sym": "S_w", "meaning": "водонасыщенность нетронутой зоны", "unit": "u131-20"}, {"sym": "\\phi", "meaning": "пористость", "unit": "u131-21"}]}], "tables": [{"caption": "", "page": 131, "markdown": "|  Lithology | Grain Size (millimeters) | Bulk Volume Water ($BVW$)  |\n| --- | --- | --- |\n|  *Clastics*  |   |   |\n|  Coarse | 1.0 to 0.5 | 0.02 to 0.025  |\n|  Medium | 0.5 to 0.25 | 0.025 to 0.035  |\n|  Fine | 0.25 to 0.125 | 0.035 to 0.05  |\n|  Very Fine | 0.125 to 0.062 | 0.05 to 0.07  |\n|  Silt | \u003c 0.062 | 0.07 to 0.09  |\n|  *Carbonates*  |   |   |\n|  Vuggy |   | 0.005 to 0.015  |\n|  Vuggy and intercrystalline (intergranular) |   | 0.015 to 0.025  |\n|  Intercrystalline |   | 0.025 to 0.04  |\n|  Chalky |   | 0.05  |", "ocr_fixes": []}], "misconception": null, "data_meaning": {"input": "Профили пористости и водонасыщенности по глубине скважины.", "output": "Значения объемной воды в пласте ($BVW$) и оценка достижения остаточной водонасыщенности.", "breaks": [{"text": "Разброс значений $BVW$ и отклонение от единой гиперболы на графике Бакклза ломают интерпретацию безводной добычи.", "claims": ["bulk-volume-water-bvw.c6", "bulk-volume-water-bvw.c9"], "page": 131, "by": "model"}], "hypotheses": [{"text": "Гипотеза: График Бакклза можно использовать как двухмерный scatter-plot для автоматической кластеризации типов пород и выделения зон с неизменным $BVW$ с помощью алгоритмов ML.", "claims": ["bulk-volume-water-bvw.c7"], "page": 131, "by": "model"}]}, "analogy": {"text": "График Бакклза похож на калибровочный scatter-plot в ML, где точки, лежащие на единой кривой уровня, соответствуют объектам с одинаковым соотношением признаков.", "breaks_where": "Физические процессы капиллярного удержания воды и смачиваемости пород не сводятся к простым статистическим зависимостям признаков."}, "now_practice": [{"text": "Сегодня расчет $BVW$ и построение графиков Бакклза обычно выполняются в автоматизированном ПО петрофизической интерпретации.", "claims": ["bulk-volume-water-bvw.c7"], "page": 131, "by": "model"}], "layers": {"mechanism": [{"text": "Объемная вода определяется произведением пористости на водонасыщенность и зависит от капиллярных сил и размера зерен породы.", "claims": ["bulk-volume-water-bvw.c1", "bulk-volume-water-bvw.c10"], "page": 131, "by": "model"}], "practice": [{"text": "Постоянство $BVW$ по разрезу указывает на единый литотип и отсутствие попутной воды при добыче.", "claims": ["bulk-volume-water-bvw.c2", "bulk-volume-water-bvw.c5"], "page": 131, "by": "model"}], "nuances": [{"text": "Значения $BVW$ для карбонатов служат лишь общим ориентиром из-за сложности порового пространства.", "claims": ["bulk-volume-water-bvw.c11"], "page": 131, "by": "model"}], "deeper": [{"text": "Анализ рассеяния точек на графике Бакклза позволяет отличать зоны на остаточной водонасыщенности от зон с повышенным содержанием воды.", "claims": ["bulk-volume-water-bvw.c8", "bulk-volume-water-bvw.c9"], "page": 131, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.bulk-volume-water-bvw.ill1", "class": "B", "src": "media/asquith.bulk-volume-water-bvw-steps.svg", "alt": "Порядок действий по тексту автора: Объемная вода в пласте (BVW) и график Бакклза", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.bulk-volume-water-bvw.ill2", "class": "B", "src": "media/asquith.bulk-volume-water-bvw-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Объемная вода в пласте (BVW) и график Бакклза", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.conductivity-derived-porosity-basis", "type": "prerequisite"}], "claims": [{"id": "bulk-volume-water-bvw.c1", "kind": "observation", "text": "BVW равен произведению Sw и пористости.", "quote": "The product of a formation's water saturation ($S_w$) and its porosity ($\\phi$) is the bulk volume of water ($BVW$).", "unit": "u131-16", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c2", "kind": "observation", "text": "Постоянные значения BVW указывают на единый тип породы и Swirr.", "quote": "If values for bulk volume water, calculated at several depths in a formation, are constant or very close to constant, they indicate that the zone is of a single rock type and at irreducible water saturation ($S_{w\\ irr}$).", "unit": "u131-22", "page": 131, "by": "model", "verified": false}, {"id": "bulk-volume-water-bvw.c3", "kind": "inference", "text": "График Бакклза сопоставляет пористость и Sw для оценки насыщения.", "quote": "The Buckles plot (Buckles, 1965) is a graph of porosity ($\\phi$) versus $S_w$.", "unit": "u131-24", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c4", "kind": "observation", "text": "При Swirr вода не движется из-за капиллярного давления.", "quote": "When a zone is at irreducible water saturation, water in the uninvaded zone ($S_w$) does not move because it is held on grains by capillary pressure.", "unit": "u131-23", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c5", "kind": "inference", "text": "Добыча из зоны с Swirr должна быть безводной.", "quote": "Therefore, hydrocarbon production from a zone at irreducible water saturation should be water free (Morris and Biggs, 1967).", "unit": "u131-23", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c6", "kind": "observation", "text": "Формация не при Swirr имеет широкий разброс BVW.", "quote": "A formation not at irreducible water saturation ($S_{w\\ irr}$) exhibits wide variations in bulk volume water values.", "unit": "u131-24", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c7", "kind": "observation", "text": "На графике Бакклза точки равного BVW формируют гиперболы.", "quote": "Points of equal $BVW$ form hyperbolic curves across this plot.", "unit": "u131-24", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c8", "kind": "observation", "text": "При Swirr точки ложатся на одну гиперболическую кривую.", "quote": "If $BVW$ is plotted using data from a formation at irreducible water saturation, the points fall along a single hyperbolic curve", "unit": "u131-24", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c9", "kind": "observation", "text": "При высоком содержании воды точки более рассеяны.", "quote": "If the data come from reservoirs with higher percentages of produced water, the points are more scattered", "unit": "u131-24", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c10", "kind": "observation", "text": "BVW увеличивается с уменьшением размера зерен из-за капиллярного давления.", "quote": "Because the amount of water a formation can hold by capillary pressure increases with decreasing grain size, the bulk volume water also increases with decreasing grain size.", "unit": "u131-25", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c11", "kind": "observation", "text": "BVW для карбонатов — общий ориентир для типов пористости.", "quote": "The bulk volume water values for carbonates should be used only as a very general guide to different types of porosity.", "unit": "u131-28", "page": 131, "by": "model", "verified": true}, {"id": "bulk-volume-water-bvw.c12", "kind": "observation", "text": "Таблица 7.1 приводит значения BVW для разных размеров зерен и литологий.", "quote": "| Lithology | Grain Size (millimeters) | Bulk Volume Water ($BVW$) |", "unit": "u131-27", "page": 131, "by": "model", "verified": true}], "term_ids": ["t-bulk-volume-water-bvw", "t-buckles-plot", "t-irreducible-water-saturation-swirr"], "units": ["u131-15", "u131-16", "u131-17", "u131-18", "u131-19", "u131-20", "u131-21", "u131-22", "u131-23", "u131-24", "u131-25", "u131-26", "u131-27", "u131-28"], "video_criteria": ["cause_effect", "scale_jump"], "fallback": false}, {"id": "asquith.pickett-crossplot-method", "order": 12, "part_id": "p11", "minutes": 4, "title": "Кроссплот Пикетта для определения насыщения и параметров", "book_title": "Pickett Crossplot Method", "pages": [132, 133], "difficulty": {"primary": "И", "secondary": "Пр"}, "threshold": true, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». Текст с формулами и описанием графического метода отлично подходит для текстового объяснения с элементами интерактивных шагов построения.", "scene_template": "tool-in-well"}, "summary": [{"text": "Кроссплот Пикетта — это графическое решение уравнения Арчи в логарифмических координатах для оценки водонасыщения и параметров пласта.", "claims": ["pickett-crossplot-method.c2", "pickett-crossplot-method.c3"], "page": 132, "by": "model"}, {"text": "Метод позволяет определять сопротивление пластовой воды, индекс цементации и матричные параметры по данным геофизических исследований скважин.", "claims": ["pickett-crossplot-method.c1"], "page": 132, "by": "model"}], "how_it_works": [{"text": "Метод основан на зависимости истинного удельного сопротивления от пористости, водонасыщения и индекса цементации.", "claims": ["pickett-crossplot-method.c3"], "page": 132, "by": "model"}, {"text": "Логарифмирование уравнения Арчи для водоносного интервала дает линейную зависимость между логарифмом сопротивления и логарифмом пористости.", "claims": ["pickett-crossplot-method.c4", "pickett-crossplot-method.c5"], "page": 132, "by": "model"}, {"text": "На графике водоносные точки образуют линию с наклоном минус один деленный на m и пересечением a умноженное на Rw.", "claims": ["pickett-crossplot-method.c6"], "page": 132, "by": "model"}, {"text": "Нефтегазонасыщенные точки смещаются вправо от линии водоносного пласта пропорционально величине водонасыщения.", "claims": ["pickett-crossplot-method.c7"], "page": 132, "by": "model"}, {"text": "Использование разности плотности или интервального времени вместо пористости позволяет подбирать матричные параметры подбором до выпрямления линии.", "claims": ["pickett-crossplot-method.c8", "pickett-crossplot-method.c9"], "page": 133, "by": "model"}], "steps": [{"text": "Постройте логарифмический график истинного сопротивления и пористости с рекомендуемым охватом в три и два декада.", "claims": ["pickett-crossplot-method.c10"], "page": 132, "by": "model"}, {"text": "Проведите линию через водоносные точки для определения индекса цементации по наклону и произведения коэффициента tortuosity на Rw по пересечению.", "claims": ["pickett-crossplot-method.c6"], "page": 132, "by": "model"}, {"text": "Рассчитайте водонасыщение точек, лежащих в стороне от линии, используя отношение сопротивлений и показатель насыщения.", "claims": ["pickett-crossplot-method.c7", "pickett-crossplot-method.c11"], "page": 132, "by": "model"}], "examples": [], "numbers": [{"text": "Для наилучшего разрешения данных рекомендуется использовать два декада для пористости от 0.01 до 1.0 и три декада для сопротивления от 0.1 до 100.", "claims": ["pickett-crossplot-method.c10"], "page": 132, "by": "model"}], "formulas": [{"latex": "Rt = \\frac{a \\times R_o}{\\phi^m \\times S_w^n}", "page": 132, "vars": [{"sym": "Rt", "meaning": "истинное удельное сопротивление", "unit": ""}, {"sym": "a", "meaning": "коэффициент извилистости", "unit": ""}, {"sym": "Ro", "meaning": "сопротивление водоносной породы", "unit": ""}, {"sym": "\\phi", "meaning": "пористость", "unit": ""}, {"sym": "m", "meaning": "индекс цементации", "unit": ""}, {"sym": "S_w", "meaning": "водонасыщенность", "unit": ""}, {"sym": "n", "meaning": "показатель насыщения", "unit": ""}]}, {"latex": "\\log(R_t) = \\log(a \\times R_w) - m \\log(\\phi) - n \\log(S_w)", "page": 132, "vars": [{"sym": "Rw", "meaning": "удельное сопротивление пластовой воды", "unit": ""}]}, {"latex": "S_w = \\left(\\frac{R_o}{R_t}\\right)^{\\frac{1}{n}}", "page": 133, "vars": []}], "tables": [{"caption": "", "page": 133, "markdown": "|  Multiplier | $$S_w$$ (for n = 2.0)  |\n| --- | --- |\n|  1.56 | 0.80  |\n|  2.04 | 0.70  |\n|  2.78 | 0.60  |\n|  4 | 0.50  |\n|  6.25 | 0.40  |\n|  11.11 | 0.30  |\n|  25 | 0.20  |", "ocr_fixes": []}], "misconception": null, "data_meaning": {"input": "Данные ГИС: истинное удельное сопротивление (Rt) и пористость (или члены разности плотности и интервального времени).", "output": "Оценки водонасыщения (Sw), сопротивления пластовой воды (Rw), индекса цементации (m) и матричных параметров.", "breaks": [{"text": "Главное допущение метода заключается в том, что в сравниваемых зонах параметры матрицы, a, m, n и Rw остаются постоянными.", "claims": ["pickett-crossplot-method.c12"], "page": 133, "by": "model"}], "hypotheses": []}, "analogy": {"text": "Кроссплот работает как метод главных компонент или кластеризация в логарифмическом пространстве признаков, где чистая вода задает опорную линейную границу (маифолд), а углеводороды отклоняют точки перпендикулярно ей.", "breaks_where": "В отличие от абстрактных фич в ML, оси кроссплота жестко фиксированы физическими уравнениями Арчи и параметрами породы."}, "now_practice": [{"text": "Сегодня построение кроссплотов и подбор параметров выполняются в специализированном ПО интерпретации геофизических данных с интерактивной визуализацией.", "claims": [], "page": 132, "by": "model"}], "layers": {"mechanism": [{"text": "Логарифмирование уравнения Арчи преобразует нелинейную степенную зависимость в прямую линию на логарифмическом графике.", "claims": ["pickett-crossplot-method.c4", "pickett-crossplot-method.c5"], "page": 132, "by": "model"}], "practice": [{"text": "Исторический выбор осей был обусловлен доступностью двухдекадной и трехдекадной миллиметровой бумаги определенного формата.", "claims": ["pickett-crossplot-method.c13"], "page": 132, "by": "model"}], "nuances": [{"text": "Неправильно выбранное значение матрицы приводит к искривлению линии водоносного пласта вместо ее выпрямления.", "claims": ["pickett-crossplot-method.c9"], "page": 133, "by": "model"}], "deeper": [{"text": "Метод позволяет избежать использования дорогостоящих лабораторных исследований керна или локальных исторических данных для определения Rw и m.", "claims": ["pickett-crossplot-method.c14"], "page": 132, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.pickett-crossplot-method.ill1", "class": "B", "src": "media/asquith.pickett-crossplot-method-steps.svg", "alt": "Порядок действий по тексту автора: Кроссплот Пикетта для определения насыщения и параметров", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.pickett-crossplot-method.ill2", "class": "B", "src": "media/asquith.pickett-crossplot-method-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Кроссплот Пикетта для определения насыщения и параметров", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.conductivity-derived-porosity-basis", "type": "prerequisite"}], "claims": [{"id": "pickett-crossplot-method.c1", "kind": "observation", "text": "Метод оценивает водонасыщение и помогает определить Rw, m, а также матричные параметры sonic и density логов.", "quote": "This technique estimates water saturation and can also help determine:", "unit": "u132-05", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c2", "kind": "observation", "text": "Кроссплот Пикетта является одним из простейших и эффективнейших методов кроссплотов.", "quote": "The Pickett plot (Pickett, 1966, 1973) is one of the simplest and most effective crossplot methods in use.", "unit": "u132-05", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c3", "kind": "inference", "text": "Метод основан на том, что Rt является функцией пористости, Sw и m, представляя графическое решение уравнения Арчи.", "quote": "The Pickett method is based on the observation that true resistivity (Rt) is a function of porosity (phi), water saturation (Sw), and cementation exponent (m). It is actually a graphical solution of Archie's equation", "unit": "u132-07", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c4", "kind": "observation", "text": "Взятие логарифма от уравнения Арчи для удельного сопротивления приводит к линейному виду.", "quote": "Taking the logarithm of the equation produces:", "unit": "u132-09", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c5", "kind": "observation", "text": "Для водоносной зоны Sw равно единице, логарифм Sw равен нулю, и уравнение упрощается.", "quote": "If the zone is water-bearing, $S_w = 1$, $\\log(S_w) = 0$, and the equation reduces to:", "unit": "u132-11", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c6", "kind": "observation", "text": "Водоносные точки разной пористости образуют прямую линию с наклоном минус один деленный на m и пересечением a умноженное на Rw.", "quote": "Water-bearing points of different porosities plot along a straight line with a slope of (-1/m) and an intercept (at porosity = 1.0) of (a * Rw). From this line, the cementation exponent (m) can be determined", "unit": "u132-18", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c7", "kind": "observation", "text": "Углеводородоносные точки лежат в стороне от линии, смещенные вправо по горизонтали за счет увеличенного сопротивления.", "quote": "Hydrocarbon-bearing points lie away from the line, moved horizontally to the right from the water-bearing line by their increased resistivity.", "unit": "u132-18", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c8", "kind": "observation", "text": "Выражения rho_b минус rho_ma и delta_t минус delta_t_ma являются числителями в уравнениях пористости и используются как ярлыки для избежания вычисления пористости.", "quote": "Both quantities are the numerators in porosity equations $$(\\rho_b - \\rho_{ma})$$ from the density porosity equation (Chapter 4, Equation 4.7), and $$(\\Delta t - \\Delta t_{ma})$$ from the Wyllie time-average sonic equation (Chapter 4, Equation 4.1). The quantities are plotting shortcuts to avoid the calculation of porosity", "unit": "u133-06", "page": 133, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c9", "kind": "observation", "text": "Если матричное значение выбрано верно, линия прямая; если слишком высоко или низко — линия искривляется.", "quote": "If there is a range of porosities in the zones defining the water-bearing line on the Pickett plot, and if the matrix value is chosen correctly, the line is straight. If the chosen matrix value is either too high or too low, the line is curved.", "unit": "u133-06", "page": 133, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c10", "kind": "observation", "text": "Лучший формат для разрешения данных — два декада для пористости от 0.01 до 1.0 и три декада для сопротивления от 0.1 до 100.", "quote": "The best format to use (for the best data resolution) is two decades for porosity (0.01 to 1.0, or 1% to 100%) and three decades for the resistivity (0.1 to 100, or 1 to 1000).", "unit": "u132-14", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c11", "kind": "observation", "text": "Водонасыщение точки определяется через отношение сопротивления водоносной линии Ro к сопротивлению точки Rt в степени единицы на n.", "quote": "The water saturation of a point plotting away from the water-bearing line can be determined by the equation: Sw = (Ro / Rt)^(1/n)", "unit": "u133-07", "page": 133, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c12", "kind": "assumption", "text": "Главное допущение интерпретации заключается в постоянстве всех параметров матрицы, a, m, n и Rw в сравниваемых зонах.", "quote": "The prime assumption is that in the zones being compared, all the parameters (matrix value, a, m, n, and Rw) do not change.", "unit": "u133-12", "page": 133, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c13", "kind": "observation", "text": "Конвенция построения с сопротивлением на оси x и пористостью на оси y возникла из-за доступности логарифмической бумаги в момент разработки метода.", "quote": "In practice, the resistivity (Rt) is usually plotted on the x-axis and the porosity (phi) on the y-axis (Figure 7.4). This convention stems from the availability of full-logarithmic graph paper ... at the time Pickett developed the technique.", "unit": "u132-14", "page": 132, "by": "model", "verified": true}, {"id": "pickett-crossplot-method.c14", "kind": "inference", "text": "Сила кроссплота Пикетта в том, что Rw и m можно оценить из данных, избегая локальных знаний или дорогих замеров керна.", "quote": "The power in the Pickett plot is that water resistivity (Rw) and cementation exponent (m) can be estimated from the data, rather than having to be derived from local knowledge or from expensive core measurements.", "unit": "u132-19", "page": 132, "by": "model", "verified": true}], "term_ids": ["t-pickett-plot", "t-water-bearing-line"], "units": ["u132-04", "u132-05", "u132-06", "u132-07", "u132-08", "u132-09", "u132-10", "u132-11", "u132-12", "u132-13", "u132-14", "u132-15", "u132-16", "u132-17", "u132-18", "u132-19", "u132-20", "u132-21", "u132-22", "u132-23", "u132-24", "u133-01", "u133-02", "u133-03", "u133-04", "u133-05", "u133-06", "u133-07", "u133-08", "u133-09", "u133-10", "u133-11", "u133-12", "u133-13", "u133-14"], "video_criteria": ["invisible_visible", "cause_effect"], "fallback": false}, {"id": "asquith.hinge-crossplot-method", "order": 13, "part_id": "p12", "minutes": 4, "title": "Кроссплот Хингла для графической интерпретации", "book_title": "Hingle Crossplot Method", "pages": [133, 134], "difficulty": {"primary": "И", "secondary": "Пр"}, "threshold": false, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». текст с элементами формул и пошагового описания графического метода лучше всего воспринимается в текстово-иллюстративном формате", "scene_template": "tool-in-well"}, "summary": [{"text": "Кроссплот Хингла — это метод графической интерпретации каротажа для определения водонасыщенности пласта без необходимости знать свойства матрицы породы или сопротивление воды.", "claims": ["hinge-crossplot-method.c1"], "page": 133, "by": "model"}, {"text": "На графике сопротивление откладывается по нелинейной шкале, а пористость или плотность — по линейной, что позволяет проводить линии водоносности и линии равной насыщенности.", "claims": ["hinge-crossplot-method.c2", "hinge-crossplot-method.c3"], "page": 133, "by": "model"}], "how_it_works": [{"text": "Метод Хингла основан на преобразовании уравнения Арчи в линейную форму для построения прямых линий на кроссплоте.", "claims": ["hinge-crossplot-method.c4"], "page": 133, "by": "model"}, {"text": "По шкале сопротивления сетка строится под конкретные значения коэффициента извилистости и индекса цементации: для песчаников берут a=1.0 и m=2.0, а для карбонатов — a=0.62 и m=2.15.", "claims": ["hinge-crossplot-method.c5"], "page": 133, "by": "model"}, {"text": "Водоносные точки с разной пористостью лежат на прямой линии, пересекающей ось x в точке нулевой пористости или матричного значения.", "claims": ["hinge-crossplot-method.c6", "hinge-crossplot-method.c7"], "page": 133, "by": "model"}, {"text": "Нефтегазонасыщенные точки лежат ниже линии 100% водонасыщенности из-за повышенного сопротивления, а линии снижения водонасыщенности расходятся веером.", "claims": ["hinge-crossplot-method.c8"], "page": 134, "by": "model"}, {"text": "По графику можно оценить сопротивление пластовой воды, параметры матрицы и посчитать водонасыщенность для точек, лежащих вне линии водоносности.", "claims": ["hinge-crossplot-method.c9", "hinge-crossplot-method.c10", "hinge-crossplot-method.c11"], "page": 134, "by": "model"}], "steps": [{"text": "Выберите значение пористости, например 0.10, и найдите значение сопротивления на линии Ro.", "claims": ["hinge-crossplot-method.c12"], "page": 134, "by": "model"}, {"text": "Умножьте это сопротивление на коэффициенты из таблицы 7.2 и отложите полученные значения на кроссплоте при той же пористости.", "claims": ["hinge-crossplot-method.c13"], "page": 134, "by": "model"}, {"text": "Проведите линии насыщения так, чтобы они пересекали линию водоносности в точке нулевой пористости на оси x.", "claims": ["hinge-crossplot-method.c14"], "page": 134, "by": "model"}], "examples": [], "numbers": [{"text": "Используются параметры сетки a = 1.0 и m = 2.0 для песчаников, и a = 0.62 и m = 2.15 для карбонатов.", "claims": ["hinge-crossplot-method.c5"], "page": 133, "by": "model"}, {"text": "Для построения линий насыщения часто удобно использовать значение пористости 0.10.", "claims": ["hinge-crossplot-method.c12"], "page": 134, "by": "model"}], "formulas": [{"latex": "\\left(\\frac{a}{R_t}\\right)^{\\frac{1}{m}} = \\left(\\frac{S_w^n}{R_w}\\right)^{\\frac{1}{m}} \\times \\phi \\tag{7.28}", "page": 133, "vars": [{"sym": "a", "meaning": "коэффициент извилистости", "unit": "безразмерный"}, {"sym": "R_t", "meaning": "истинное удельное сопротивление", "unit": "ом·м"}, {"sym": "m", "meaning": "индекс цементации", "unit": "безразмерный"}, {"sym": "S_w", "meaning": "водонасыщенность", "unit": "доли единицы"}, {"sym": "n", "meaning": "показатель насыщения", "unit": "безразмерный"}, {"sym": "R_w", "meaning": "удельное сопротивление пластовой воды", "unit": "ом·м"}, {"sym": "\\phi", "meaning": "пористость", "unit": "доли единицы"}]}, {"latex": "R_w = \\frac{R_o \\times \\phi^m}{a} \\tag{7.29}", "page": 134, "vars": [{"sym": "R_w", "meaning": "удельное сопротивление пластовой воды", "unit": "ом·м"}, {"sym": "R_o", "meaning": "сопротивление породы, полностью заполненной водой", "unit": "ом·м"}, {"sym": "\\phi", "meaning": "пористость", "unit": "доли единицы"}, {"sym": "m", "meaning": "индекс цементации", "unit": "безразмерный"}, {"sym": "a", "meaning": "коэффициент извилистости", "unit": "безразмерный"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Данные каротажа пористости (или плотности, акустического времени) и истинного удельного сопротивления R_t.", "output": "Значения водонасыщенности S_w, удельного сопротивления пластовой воды R_w и параметров матрицы породы.", "breaks": [{"text": "Метод может давать неверные результаты при неправильном выборе или неизвестных параметрах цементации и извилистости.", "claims": ["hinge-crossplot-method.c5", "hinge-crossplot-method.c9"], "page": 133, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Графическое построение кроссплота Хингла эквивалентно процедуре подгонки линейной регрессии в логарифмическом пространстве для кластеризации точек с разной насыщенностью.", "claims": ["hinge-crossplot-method.c4"], "page": 133, "by": "model"}]}, "analogy": {"text": "Кроссплот похож на двухмерную scatter-диаграмму в ML, где оси масштабированы специальным нелинейным образом для линеаризации решающей границы.", "breaks_where": "В отличие от абстрактных фич в ML, оси кроссплота жестко привязаны к физическим уравнениям петрофизики (уравнению Арчи)."}, "now_practice": [{"text": "Сегодня построение подобных кроссплотов и расчет параметров пласта обычно выполняются автоматически в специализированном ПО интерпретации каротажа.", "claims": ["hinge-crossplot-method.c1"], "page": 133, "by": "model"}], "layers": {"mechanism": [{"text": "Преобразование уравнения Арчи позволяет представить зависимость сопротивления от пористости в виде прямых линий на сетке с нелинейной шкалой.", "claims": ["hinge-crossplot-method.c4", "hinge-crossplot-method.c5"], "page": 133, "by": "model"}], "practice": [{"text": "Интерпретатор наносит данные на специальную сетку, проводит линию водоносности и графически определяет насыщенность и свойства воды.", "claims": ["hinge-crossplot-method.c11", "hinge-crossplot-method.c13", "hinge-crossplot-method.c14"], "page": 134, "by": "model"}], "nuances": [{"text": "Положение нулевой точки пористости на оси x может быть смещено, если реальные свойства матрицы отличаются от ожидаемых.", "claims": ["hinge-crossplot-method.c7"], "page": 134, "by": "model"}], "deeper": [{"text": "Метод Хингла является исторически первым методом резистивно-пористостных кроссплотов, предложенным в 1959 году.", "claims": ["hinge-crossplot-method.c1"], "page": 133, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.hinge-crossplot-method.ill1", "class": "B", "src": "media/asquith.hinge-crossplot-method-steps.svg", "alt": "Порядок действий по тексту автора: Кроссплот Хингла для графической интерпретации", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.hinge-crossplot-method.ill2", "class": "B", "src": "media/asquith.hinge-crossplot-method-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Кроссплот Хингла для графической интерпретации", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.pickett-crossplot-method", "type": "prerequisite"}], "claims": [{"id": "hinge-crossplot-method.c1", "kind": "observation", "text": "Метод Хингла (1959) является старейшим методом кроссплотов сопротивления и пористости для определения водонасыщенности.", "quote": "The oldest of the resistivity-porosity crossplot methods that can be used to determine water saturation (Sw) is the Hingle (1959) plot.", "unit": "u133-16", "page": 133, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c2", "kind": "observation", "text": "Кроссплот Хингла отображает сопротивление против пористости.", "quote": "As with the Pickett plot, the Hingle plot seeks to plot resistivity against porosity.", "unit": "u133-17", "page": 133, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c3", "kind": "observation", "text": "Пористость отображается на линейной шкале, а сопротивление — на очень нелинейной шкале.", "quote": "While porosity is plotted on a linear scale, the resistivity is plotted on a very nonlinear scale.", "unit": "u133-19", "page": 133, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c4", "kind": "inference", "text": "Путем решения уравнения Арчи в определенной форме нелинейные тренды превращаются в прямые линии.", "quote": "By solving Archie's equation (Equation 7.1) in the following form, the nonlinear trends become straight lines", "unit": "u133-17", "page": 133, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c5", "kind": "observation", "text": "Для песчаников используется сетка с a = 1.0 и m = 2.0, а для карбонатов — с a = 0.62 и m = 2.15.", "quote": "The grid constructed using a = 1.0 and m = 2.0 is usually used for sandstones (Figure 7.5), and the grid constructed using a = 0.62 and m = 2.15 is used for carbonates (Figure 7.6).", "unit": "u133-19", "page": 133, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c6", "kind": "observation", "text": "Водоносные точки с разной пористостью лежат вдоль прямой линии.", "quote": "Water-bearing points of different porosities plot along a straight line.", "unit": "u133-21", "page": 133, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c7", "kind": "observation", "text": "X-интерсект прямой линии находится в точке нулевой пористости, а при использовании плотности или акустического времени предсказывает матричное значение.", "quote": "If the bulk density or acoustic travel time of the formation, instead of the porosity, is plotted along the x-axis, the x-intercept predicts the matrix value (matrix density or matrix travel time) of the formation.", "unit": "u134-03", "page": 134, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c8", "kind": "observation", "text": "Нефтегазонасыщенные точки лежат ниже линии 100% водонасыщенности, смещаясь вниз из-за повышенного сопротивления.", "quote": "Hydrocarbon-bearing points lie below the line of 100% water saturation, moved downward from the water-bearing line by their increased resistivity.", "unit": "u134-04", "page": 134, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c9", "kind": "observation", "text": "Удельное сопротивление пластовой воды можно оценить, выбрав любую точку вдоль линии водоносности.", "quote": "The formation water resistivity (Rw) can be estimated by choosing any point along the water-bearing line.", "unit": "u134-05", "page": 134, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c10", "kind": "observation", "text": "Плотность матрицы или время пробега могут быть оценены путем построения значений на оси x и экстраполяции линии к нулевой проводимости.", "quote": "By plotting the bulk density (\\rho_b) or sonic travel time (\\Delta t) values on the x-axis, rather than the porosity, the matrix density or matrix travel time (\\rho_{ma} or \\Delta t_{ma}) can be estimated.", "unit": "u134-07", "page": 134, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c11", "kind": "inference", "text": "Водонасыщенность точки, лежащей в стороне от линии водоносности, определяется через ее сопротивление и сопротивление линии водоносности при той же пористости.", "quote": "The water saturation of a point plotting away from the water-bearing line can be determined by Equation 7.26. In practice, this means reading the resistivity of the point (Rt) and the resistivity of the water-bearing line (Ro) at the same porosity value", "unit": "u134-08", "page": 134, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c12", "kind": "observation", "text": "При определенном значении пористости (например, 0.10) фиксируется значение сопротивления линии Ro.", "quote": "At some value of porosity (0.10 is often convenient), note the resistivity value of the Ro line.", "unit": "u134-11", "page": 134, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c13", "kind": "observation", "text": "Значение сопротивления умножается на факторы из таблицы 7.2 и откладывается на кроссплоте при той же пористости.", "quote": "Multiply that resistivity value by the factors in Table 7.2, and plot those values on the Hingle plot at the same porosity.", "unit": "u134-11", "page": 134, "by": "model", "verified": true}, {"id": "hinge-crossplot-method.c14", "kind": "observation", "text": "Линии насыщения проводятся так, чтобы пересекать линию водоносности в точке нулевой пористости на оси x.", "quote": "Draw the saturation lines to intersect the water-bearing line at the zero porosity point on the x-axis, with each line going through the calculated points.", "unit": "u134-11", "page": 134, "by": "model", "verified": true}], "term_ids": ["t-hingle-plot"], "units": ["u133-15", "u133-16", "u133-17", "u133-18", "u133-19", "u133-20", "u133-21", "u134-01", "u134-02", "u134-03", "u134-04", "u134-05", "u134-06", "u134-07", "u134-08", "u134-09", "u134-10", "u134-11"], "video_criteria": ["invisible_visible", "cause_effect"], "fallback": false}, {"id": "asquith.log-interpretation-workflow", "order": 14, "part_id": "p13", "minutes": 3, "title": "Обзор и сканирование каротажных диаграмм", "book_title": "Clastics / Carbonates", "pages": [140, 140], "difficulty": {"primary": "Р", "secondary": "Пр"}, "threshold": true, "format": {"primary": "cards", "reason": "Тип «распознавание»; критерии видеоёмкости: скачок масштаба, невидимое становится видимым. Текст оптимален для объяснения логики блок-схем и различий подходов для разных типов пород.", "scene_template": "feature-gallery"}, "summary": [{"text": "Обзор каротажных диаграмм начинается с поиска чистых зон по разным алгоритмам для терригенных пород и карбонатов.", "claims": ["log-interpretation-workflow.c1"], "page": 140, "by": "model"}, {"text": "Для терригенных пород ключевым методом первичной разведки является кривая сопротивления из-за контраста между коллектором и глинами.", "claims": ["log-interpretation-workflow.c2"], "page": 140, "by": "model"}, {"text": "Для карбонатов из-за изменчивости литологии первичным методом выступает кривая пористости, помогающая найти емкость для флюидов.", "claims": ["log-interpretation-workflow.c3"], "page": 140, "by": "model"}], "how_it_works": [{"text": "В терригенных отложениях сопротивление пластов выделяется на фоне относительно постоянного сопротивления окружающих глинистых пород.", "claims": ["log-interpretation-workflow.c2"], "page": 140, "by": "model"}, {"text": "В карбонатах сопротивление пород сильно меняется при смене типов пород, а глинистых прослоек для сравнения обычно мало.", "claims": ["log-interpretation-workflow.c4"], "page": 140, "by": "model"}, {"text": "Связка метода сканирования с экспресс-методом нейтронного и плотностного каротажа позволяет определить литологию и состав флюида.", "claims": ["log-interpretation-workflow.c5"], "page": 140, "by": "model"}, {"text": "Некоторые зоны, похожие на глины, могут оказаться радиоактивными продуктивными пластами, а глинистые интервалы — давать нефть или газ при низком сопротивлении.", "claims": ["log-interpretation-workflow.c6"], "page": 140, "by": "model"}], "steps": [{"text": "Сначала ищут чистые зоны, разделяя ветку процесса на терригенные породы и карбонаты.", "claims": ["log-interpretation-workflow.c1"], "page": 140, "by": "model"}, {"text": "Для терригенных пород анализируют сопротивление: низкое указывает на водяную зону для базового сравнения, высокое отправляет на проверку пористости.", "claims": ["log-interpretation-workflow.c7"], "page": 140, "by": "model"}, {"text": "Для карбонатов проверяют пористость: низкая означает плотную породу, высокая направляет на анализ сопротивления.", "claims": ["log-interpretation-workflow.c8"], "page": 140, "by": "model"}, {"text": "После прохождения всех ветвлений алгоритма переходят к детальному анализу интервалов интереса.", "claims": ["log-interpretation-workflow.c9"], "page": 140, "by": "model"}], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Глинистые зоны могут давать нефть или газ даже при низком сопротивлении.", "claims": ["log-interpretation-workflow.c10"], "page": 140, "by": "model"}]}, "data_meaning": {"input": "Сырые данные каротажа (глубинное сопротивление, поверхностное сопротивление, плотность, нейтронный метод, акустический метод, ЯМР, ПС, гамма-каротаж, скважинные и лабораторные измерения, локальные знания).", "output": "Промежуточные параметры (пористость, объем глин, сопротивление пластовой воды) и итоговые величины (водонасыщенность, подвижные углеводороды, проницаемость, запасы).", "breaks": [{"text": "Поиск может давать сбои в радиоактивных продуктивных зонах, выглядящих как глины, или в глинистых продуктивных интервалах с низким сопротивлением.", "claims": ["log-interpretation-workflow.c6"], "page": 140, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Схему сканирования каротажа можно реализовать в виде дерева решений для автоматического отбора кандидатов в продуктивные интервалы.", "claims": ["log-interpretation-workflow.c1"], "page": 140, "by": "model"}]}, "analogy": {"text": "Сканирование каротажных диаграмм похоже на работу каскадного классификатора в машинном обучении, где на первом этапе отсекаются очевидно нерелевантные объекты по ключевым признакам.", "breaks_where": "Классификатор выдает вероятности на основе обучающей выборки, а геологическая схема опирается на физические пороги сопротивления и пористости, которые сильно зависят от литологического контекста."}, "now_practice": [{"text": "Сегодня первичное сканирование и выделение интервалов интереса на каротаже выполняются в специализированном ПО интерпретации с автоматизированными скриптами и интерактивными кроссплотами.", "claims": ["log-interpretation-workflow.c1"], "page": 140, "by": "model"}], "layers": {"mechanism": [{"text": "Первичная разведка в терригенных разрезах строится на контрасте сопротивления коллекторов и вмещающих глин.", "claims": ["log-interpretation-workflow.c2"], "page": 140, "by": "model"}, {"text": "В карбонатах из-за разнообразия литологии базовым инструментом выступает пористость, выявляющая емкость для флюидов.", "claims": ["log-interpretation-workflow.c3"], "page": 140, "by": "model"}], "practice": [{"text": "Алгоритм сканирования разделяет ветви на терригенные породы и карбонаты для поэтапной проверки сопротивления и пористости.", "claims": ["log-interpretation-workflow.c1"], "page": 140, "by": "model"}], "nuances": [{"text": "Внешне похожие на глины интервалы могут оказаться продуктивными из-за радиоактивности или давать углеводороды при низком сопротивлении.", "claims": ["log-interpretation-workflow.c6"], "page": 140, "by": "model"}], "deeper": [{"text": "Потоки данных связывают сырые кривые каротажа через промежуточные параметры с итоговыми петрофизическими свойствами пласта.", "claims": ["log-interpretation-workflow.c11"], "page": 140, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.log-interpretation-workflow.ill1", "class": "B", "src": "media/asquith.log-interpretation-workflow-steps.svg", "alt": "Порядок действий по тексту автора: Обзор и сканирование каротажных диаграмм", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "log-interpretation-workflow.c1", "kind": "observation", "text": "Процесс сканирования каротажа начинается с поиска чистых зон по разным веткам для терригенных пород и карбонатов.", "quote": "The scanning flowchart has two paths, one for clastics and one for carbonates.", "unit": "u140-05", "page": 140, "by": "model", "verified": true}, {"id": "log-interpretation-workflow.c2", "kind": "observation", "text": "Кривая сопротивления является первичной для терригенных пород из-за контраста между коллекторами и глинами.", "quote": "The resistivity log is the primary reconnaissance measurement because clastics tend to consist of reservoirs surrounded by shales whose resistivities vary gradually with depth.", "unit": "u140-07", "page": 140, "by": "model", "verified": true}, {"id": "log-interpretation-workflow.c3", "kind": "observation", "text": "Для карбонатов первичным измерением выступает пористость, так как сопротивление сильно меняется, а глинистых пластов мало.", "quote": "In this case, the porosity log is the primary reconnaissance measurement. By first finding the porous zones, the zones with the capacity to hold fluids (of any type) can be identified.", "unit": "u140-09", "page": 140, "by": "model", "verified": true}, {"id": "log-interpretation-workflow.c4", "kind": "observation", "text": "В карбонатах сопротивление меняется широко, а опорных глин для сравнения мало.", "quote": "Formation resistivities tend to vary widely with changing rock types, and commonly there are few shales against which to measure changes.", "unit": "u140-09", "page": 140, "by": "model", "verified": true}, {"id": "log-interpretation-workflow.c5", "kind": "observation", "text": "Сканирование в сочетании с нейтрон-плотностным методом позволяет определить литологию и тип флюида.", "quote": "Using this scanning technique in combination with the neutron-density quick-look technique discussed in Chapter 4 (if those logs are available) allows one to identify lithology (and sometimes fluid type)", "unit": "u140-10", "page": 140, "by": "model", "verified": true}, {"id": "log-interpretation-workflow.c6", "kind": "observation", "text": "Зоны, похожие на глины, могут быть радиоактивными продуктивными интервалами, а глинистые зоны могут содержать нефть или газ при низком сопротивлении.", "quote": "Zones that appear to be shales might be radioactive productive zones. Shaly zones might produce oil or gas even if they have low resistivity.", "unit": "u140-11", "page": 140, "by": "model", "verified": true}, {"id": "log-interpretation-workflow.c7", "kind": "observation", "text": "В терригенных породах при низком сопротивлении выделяют водяную зону для базового сравнения, а при высоком проверяют пористость.", "quote": "Look for resistivity ... LOW Water zone ... HIGH Check porosity", "unit": "u140-03", "page": 140, "by": "model", "verified": false}, {"id": "log-interpretation-workflow.c8", "kind": "observation", "text": "В карбонатах при низкой пористости фиксируют плотный пласт, а при высокой проверяют сопротивление.", "quote": "Look for porosity ... LOW Tight. Unlikely pay. ... HIGH Check resistivity", "unit": "u140-03", "page": 140, "by": "model", "verified": false}, {"id": "log-interpretation-workflow.c9", "kind": "observation", "text": "После этапов проверки переходят к детальному анализу.", "quote": "Begin detailed analysis", "unit": "u140-03", "page": 140, "by": "model", "verified": false}, {"id": "log-interpretation-workflow.c10", "kind": "observation", "text": "Глинистые интервалы могут давать нефть или газ даже при низком сопротивлении.", "quote": "Shaly zones might produce oil or gas even if they have low resistivity.", "unit": "u140-11", "page": 140, "by": "model", "verified": true}, {"id": "log-interpretation-workflow.c11", "kind": "observation", "text": "Сырые данные каротажа преобразуются через промежуточные параметры в итоговые величины интереса.", "quote": "the information generated from that raw data (shown in the center column) is used in computations to produce the quantities of interest (shown in the right column).", "unit": "u140-15", "page": 140, "by": "model", "verified": true}], "term_ids": ["t-clean-zone", "t-zone-of-interest"], "units": ["u140-03", "u140-04", "u140-05", "u140-06", "u140-07", "u140-08", "u140-09", "u140-10", "u140-11", "u140-12", "u140-13", "u140-14", "u140-15", "u140-16", "u140-17"], "video_criteria": ["scale_jump", "invisible_visible"], "fallback": false}, {"id": "asquith.pickett-hingle-comparison", "order": 15, "part_id": "p14", "minutes": 5, "title": "Методы кроссплотов Пикетта и Хингла для интерпретации", "book_title": "Hingle Crossplot Method", "pages": [134, 142], "difficulty": {"primary": "И", "secondary": "Ф"}, "threshold": true, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». текст", "scene_template": "tool-in-well"}, "summary": [{"text": "Кроссплоты Пикетта и Хингла позволяют оценивать водонасыщенность и параметры пласта по данным ГИС.", "claims": ["pickett-hingle-comparison.c1"], "page": 135, "by": "model"}, {"text": "Для точного подбора параметров матрицы и индекса цементации в условиях неопределенности применяют итеративную технику.", "claims": ["pickett-hingle-comparison.c2"], "page": 134, "by": "model"}], "how_it_works": [{"text": "Метод Пикетта требует знания или предположения матричных плотностей, а кроссплот Хингла требует задания факторов цементации и извилистости.", "claims": ["pickett-hingle-comparison.c3"], "page": 135, "by": "model"}, {"text": "Для корректного построения линии водоносного пласта необходим широкий диапазон пористости.", "claims": ["pickett-hingle-comparison.c4"], "page": 135, "by": "model"}, {"text": "Литология формации и удельное сопротивление воды должны оставаться постоянными в сравниваемых интервалах.", "claims": ["pickett-hingle-comparison.c5"], "page": 135, "by": "model"}], "steps": [{"text": "На кроссплоте Пикетта по оси X откладывается истинное сопротивление R_t, а по Y — пористость, используя логарифмические шкалы.", "claims": ["pickett-hingle-comparison.c6"], "page": 142, "by": "model"}, {"text": "Линия 100-процентной водонасыщенности проводится через скопление точек с наклоном -1/2 для индекса цементации m = 2.", "claims": ["pickett-hingle-comparison.c7"], "page": 142, "by": "model"}, {"text": "Сопротивление пластовой воды R_w вычисляется через коэффициент извилистости a, пористость и сопротивление на линии водоносного пласта R_a.", "claims": ["pickett-hingle-comparison.c8"], "page": 142, "by": "model"}, {"text": "Линии постоянной водонасыщенности строятся с использованием множителей из таблиц для выбранного показателя насыщения n.", "claims": ["pickett-hingle-comparison.c9"], "page": 142, "by": "model"}], "examples": [{"title": "Расчет удельного сопротивления воды и водонасыщенности для песчаника Морроу", "page": 142, "figure": "Figure 7.4", "condition": [{"text": "Исходные данные взяты из пласта Морроу, округ Симарон, Оклахома, при значении пористости DPHI = 0.10, R_a = 4.6 ом-м, a = 1.0, m = 3.0 (в тексте формулы расчета), n = 2.0.", "claims": ["pickett-hingle-comparison.c10"], "page": 142, "by": "model"}], "solution": [{"text": "Вычисление сопротивления воды по формуле R_w = (R_a * phi^m) / a.", "claims": ["pickett-hingle-comparison.c11"], "page": 142, "by": "model"}, {"text": "Подстановка значений: R_w = (4.6 * 0.10^3.0) / 1.0 = 0.046 ом-м.", "claims": ["pickett-hingle-comparison.c12"], "page": 142, "by": "model"}, {"text": "Расчет водонасыщенности аномальной точки с сопротивлением R_r = 40 ом-м и R_a = 0.8 ом-м по формуле S_w = (R_a / R_r)^(1/n).", "claims": ["pickett-hingle-comparison.c13"], "page": 142, "by": "model"}, {"text": "Подстановка значений: S_w = (0.8 / 40)^(1/2.0) = 0.14.", "claims": ["pickett-hingle-comparison.c14"], "page": 142, "by": "model"}], "result": [{"text": "Сопротивление воды R_w составляет 0.046 ом-м при пластовой температуре, а водонасыщенность аномальной точки равна 0.14.", "claims": ["pickett-hingle-comparison.c15"], "page": 142, "by": "model"}]}], "numbers": [{"text": "В примере используются значения пористости 0.163, 0.127, 0.181, 0.139, 0.194, 0.212, глубины от 4400 до 4546 ft, плотности матрицы 2.65 g/cm³ и флюида 1.0 g/cm³.", "claims": ["pickett-hingle-comparison.c16"], "page": 135, "by": "model"}], "formulas": [{"latex": "R_{w} = \\frac{R_{a} \\times \\phi^{m}}{a}", "page": 142, "vars": [{"sym": "R_w", "meaning": "удельное сопротивление пластовой воды", "unit": "ohm-m"}, {"sym": "R_a", "meaning": "сопротивление в нетронутой водоносной зоне", "unit": "ohm-m"}, {"sym": "phi", "meaning": "пористость", "unit": "fractional"}, {"sym": "m", "meaning": "индекс цементации", "unit": "dimensionless"}, {"sym": "a", "meaning": "коэффициент извилистости", "unit": "dimensionless"}]}, {"latex": "S_{w} = \\left(\\frac{R_{a}}{R_{r}}\\right)^{\\frac{1}{n}}", "page": 142, "vars": [{"sym": "S_w", "meaning": "водонасыщенность", "unit": "fractional"}, {"sym": "R_a", "meaning": "сопротивление на линии водоносного пласта при той же пористости", "unit": "ohm-m"}, {"sym": "R_r", "meaning": "истинное сопротивление точки интереса", "unit": "ohm-m"}, {"sym": "n", "meaning": "показатель насыщения", "unit": "dimensionless"}]}], "tables": [{"caption": "", "page": 135, "markdown": "|   | *Pickett plots* | *Hingle plots*  |\n| --- | --- | --- |\n|  Advantages | Water saturation can be predicted without prior knowledge of $R_w$, $a$, or $m$. $R_w$ is directly predicted (if tortuosity factor ($a$) is known or estimated) from the intercept of the water-bearing line at a porosity of 1 ($\\phi = 100\\%$). Cementation exponent ($m$) is directly predicted from the slope of the water-bearing line. When using the plot by hand, the graph paper to be used (full logarithmic) is readily available. | Water saturation can be predicted without prior knowledge of $R_w$, $\\rho_{ma}$ or $\\Delta t_{ma}$, $\\rho_{ma}$ or $\\Delta t_{ma}$ can be directly predicted from the intercept of the water-bearing line at a conductivity of zero (a resistivity of infinity).  |\n|  Limitations | Values for $\\rho_{ma}$ and $\\Delta t_{ma}$ must be assumed (although in cases with a wide range of porosities in the water-bearing zone, the matrix values can be estimated from the water-bearing line). | Values for tortuosity factor ($a$) and cementation exponent ($m$) must be assumed. To use t-hingle-comparison.c19"], "page": 135, "by": "model"}], "layers": {"mechanism": [{"text": "Графическое представление логарифмических зависимостей параметров пористости и сопротивления для выделения линий 100% водонасыщенности.", "claims": ["pickett-hingle-comparison.c20"], "page": 142, "by": "model"}], "practice": [{"text": "Сравнение преимуществ и ограничений методов Пикетта и Хингла при анализе песчаников и карбонатов.", "claims": ["pickett-hingle-comparison.c21"], "page": 135, "by": "model"}], "nuances": [{"text": "Необходимость задания допущений по матричной плотности и коэффициентам при недостатке данных.", "claims": ["pickett-hingle-comparison.c22"], "page": 135, "by": "model"}], "deeper": [{"text": "Использование итеративных техник Bassiouni для уточнения неизвестных параметров матрицы и цементации.", "claims": ["pickett-hingle-comparison.c23"], "page": 134, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.pickett-hingle-comparison.ill1", "class": "B", "src": "media/asquith.pickett-hingle-comparison-steps.svg", "alt": "Порядок действий по тексту автора: Методы кроссплотов Пикетта и Хингла для интерпретации", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.pickett-hingle-comparison.ill2", "class": "B", "src": "media/asquith.pickett-hingle-comparison-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Методы кроссплотов Пикетта и Хингла для интерпретации", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.log-interpretation-workflow", "type": "prerequisite"}], "claims": [{"id": "pickett-hingle-comparison.c1", "kind": "observation", "text": "Методы кроссплотов Пикетта и Хингла используются для интерпретации данных.", "quote": "Table 7.3. Advantages and Limitations of Pickett and Hingle plots", "unit": "u135-03", "page": 135, "by": "model", "verified": true}, {" false}, {"id": "pickett-hingle-comparison.c15", "kind": "observation", "text": "Итоговое значение S_w равно 0.14.", "quote": "S _ {w} = 0. 1 4", "unit": "u142-22", "page": 142, "by": "model", "verified": false}, {"id": "pickett-hingle-comparison.c16", "kind": "observation", "text": "В таблице 7.4 приведены численные значения глубин, плотностей и сопротивлений.", "quote": "Zone number | Depth (ft) | \\rho_b (g/cm³) | \\phi_D (decimal) | R_t (ohm-m)", "unit": "u135-06", "page": 135, "by": "model", "verified": true}, {"id": "pickett-hingle-comparison.c17", "kind": "observation", "text": "Ограничения техники связаны с необходимостью широкого диапазона пористости и постоянства литологии.", "quote": "A wide range of porosity must be present to positively determine a water-bearing line. Formation lithology and water resistivity must be constant", "unit": "u135-04", "page": 135, "by": "model", "verified": true}, {"id": "pickett-hingle-comparison.c18", "kind": "inference", "text": "Гипотеза: итеративный процесс подбора параметров кроссплотов может быть представлен как оптимизационная задача.", "quote": "Bassiouni (1994), however, describes an iterative technique using both plots to refine the estimates", "unit": "u134-12", "page": 134, "by": "model", "verified": true}, {"id": "pickett-hingle-comparison.c19", "kind": "inference", "text": "Сегодня расчеты кроссплотов автоматизированы.", "quote": "When using the plot by hand, the graph paper to be used (full logarithmic) is readily available.", "unit": "u135-04", "page": 135, "by": "model", "verified": true}, {"id": "pickett-hingle-comparison.c20", "kind": "observation", "text": "Кроссплоты строятся для графической оценки связи параметров.", "quote": "Figure 7.4. Pickett plot (saturation crossplot or resistivity-porosity crossplot)", "unit": "u142-04", "page": 142, "by": "model", "verified": true}, {"id": "pickett-hingle-comparison.c21", "kind": "observation", "text": "Сравниваются преимущества и ограничения обоих графических м

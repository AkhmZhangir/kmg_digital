а Rw; при нарушении этого условия минимальное Rwa может привести к ошибочной оценке насыщенности.", "claims": ["apparent-water-resistivity.c15"], "page": 129, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.apparent-water-resistivity.ill1", "class": "B", "src": "media/asquith.apparent-water-resistivity-steps.svg", "alt": "Порядок действий по тексту автора: Метод кажущегося удельного сопротивления воды (Rwa)", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.apparent-water-resistivity.ill2", "class": "B", "src": "media/asquith.apparent-water-resistivity-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Метод кажущегося удельного сопротивления воды (Rwa)", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.archie-water-saturation", "type": "prerequisite"}], "claims": [{"id": "apparent-water-resistivity.c1", "kind": "observation", "text": "Техника Rwa основана на сравнении расчетных значений сопротивления воды между интервалами.", "quote": "The Rwa technique relies on the comparison of calculated values of water resistivity between intervals in a well.", "unit": "u129-14", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c2", "kind": "inference", "text": "Минимальное значение Rwa считается истинным сопротивлением воды, а превышающие его значения указывают на углеводороды.", "quote": "The assumption is that this lowest value of Rwa is the closest approximation to the true formation water resistivity (Rw) and that values of Rwa greater than the minimum value are indicative of the presence of hydrocarbons.", "unit": "u129-14", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c3", "kind": "observation", "text": "Процедура включает расчет Rwa, поиск минимального значения и сравнение с другими зонами.", "quote": "1. Calculate an apparent water resistivity (Rwa) from the porosity and uninvaded zone resistivity measurements.\n2. Look for the lowest value of Rwa in a porous and permeable zone and compare it to the values of Rwa calculated in the other zones.", "unit": "u129-16", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c4", "kind": "observation", "text": "Формула Rwa определяется через Rt, пористость и параметры литологии.", "quote": "$$R_{wa} = \\frac{R_t \\times \\phi^m}{a} \\tag{7.16}$$", "unit": "u129-30", "page": 129, "by": "model", "verified": false}, {"id": "apparent-water-resistivity.c5", "kind": "inference", "text": "В воде Rwa равен Rw, а в нефтегазонасыщенной зоне Rwa больше Rw из-за высокого Rt.", "quote": "When a given zone is water bearing, Rt reverts to the water-bearing resistivity (Ro) and Rwa equals Rw. If the zone contains hydrocarbons, Rt is greater than Ro, and Rwa is greater than Rw.", "unit": "u129-31", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c6", "kind": "observation", "text": "Для простоты при каротаже принимаются значения a = 1.0 и m = 2.0.", "quote": "In practice, especially when calculated and displayed as a curve during a logging job, the following values are used for simplicity: a = 1.0, m = 2.0.", "unit": "u130-04", "page": 130, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c7", "kind": "observation", "text": "Для Rt берут глубокий индукционный или боковой каротаж, а пористость берут по акустическому, плотностному или нейтронно-плотностному кроссплоту.", "quote": "The deep induction log or deep laterolog is used as $R_t$, usually without any environmental corrections. Porosity is usually derived from the sonic or density log using the proper matrix and fluid parameters for the formations to be encountered. If available in real time during logging, the neutron-density crossplot porosity should be used for the best estimate of porosity.", "unit": "u130-04", "page": 130, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c8", "kind": "observation", "text": "В низкопористых зонах менее 10% пористости значение Rwa оказывается ниже истинного Rw.", "quote": "In low-porosity zones (less than about 10% porosity), the Rwa value is lower than the actual Rw value.", "unit": "u129-21", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c9", "kind": "observation", "text": "Первый шаг процедуры — расчет Rwa по пористости и сопротивлению непромытой зоны.", "quote": "1. Calculate an apparent water resistivity (Rwa) from the porosity and uninvaded zone resistivity measurements.", "unit": "u129-16", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c10", "kind": "observation", "text": "Второй шаг — поиск минимального значения Rwa в пористом и проницаемом интервале и сравнение с другими.", "quote": "2. Look for the lowest value of Rwa in a porous and permeable zone and compare it to the values of Rwa calculated in the other zones.", "unit": "u129-16", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c11", "kind": "observation", "text": "Третий шаг — расчет водонасыщенности по Арчи по значениям Rwa.", "quote": "3. If desired, an Archie water saturation can be calculated from the Rwa values in the compared zones.", "unit": "u129-16", "page": 129, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c12", "kind": "observation", "text": "Формула экспресс-оценки Sw использует отношение минимального Rwa к Rwa зоны при n = 2.", "quote": "$$S_w = \\sqrt{\\frac{R_{wa\\ minimum}}{R_{wa\\ zone}}} \\tag{7.17}$$", "unit": "u130-06", "page": 130, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c13", "kind": "observation", "text": "Шорткат расчета насыщения использует отношения Rwa_zone к Rwa_minimum равные 3, 4 и 5.", "quote": "- (Rwa zone/Rwa minimum) = 3 yields Sw = 0.58;\n- (Rwa zone/Rwa minimum) = 4 yields Sw = 0.50;\n- (Rwa zone/Rwa minimum) = 5 yields Sw = 0.45.", "unit": "u130-09", "page": 130, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c14", "kind": "observation", "text": "Соотношения 3, 4 и 5 дают значения водонасыщенности 0.58, 0.50 и 0.45.", "quote": "- (Rwa zone/Rwa minimum) = 3 yields Sw = 0.58;\n- (Rwa zone/Rwa minimum) = 4 yields Sw = 0.50;\n- (Rwa zone/Rwa minimum) = 5 yields Sw = 0.45.", "unit": "u130-09", "page": 130, "by": "model", "verified": true}, {"id": "apparent-water-resistivity.c15", "kind": "assumption", "text": "Предполагается, что значения Rw в сравниваемых зонах одинаковы.", "quote": "The Rw values in the zones that are compared are assumed to be the same.", "unit": "u129-20", "page": 129, "by": "model", "verified": true}], "term_ids": ["t-apparent-water-resistivity-rwa"], "units": ["u129-13", "u129-14", "u129-15", "u129-16", "u129-17", "u129-18", "u129-19", "u129-20", "u129-21", "u129-22", "u129-23", "u129-24", "u129-25", "u129-26", "u129-27", "u129-28", "u129-29", "u129-30", "u129-31", "u130-03", "u130-04", "u130-05", "u130-06", "u130-07", "u130-08", "u130-09", "u130-10"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "asquith.conductivity-derived-porosity", "order": 8, "part_id": "p7", "minutes": 3, "title": "Расчет пористости по проводимости и сопротивлению", "book_title": "Conductivity-derived porosity (also referred to as resistivity-porosity)", "pages": [130, 130], "difficulty": {"primary": "И", "secondary": "Ф"}, "threshold": false, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие», контринтуитивность. текст подходит для объяснения алгоритма расчета по формуле и визуальных паттернов на планшете скважины", "scene_template": "tool-in-well"}, "summary": [{"text": "Расчет пористости по проводимости или сопротивлению основан на формуле Арчи для полностью водонасыщенных зон.", "claims": ["conductivity-derived-porosity.c1"], "page": 130, "by": "model"}, {"text": "В водоносных интервалах получаемая кривая показывает высокую пористость, близкую к истинной, а в нефтегазоносных — заниженную.", "claims": ["conductivity-derived-porosity.c2"], "page": 130, "by": "model"}], "how_it_works": [{"text": "Техника зародилась с использованием кривой проводимости, но сегодня обычно применяется измерение сопротивления.", "claims": ["conductivity-derived-porosity.c3"], "page": 130, "by": "model"}, {"text": "Пористость вычисляется по формуле Арчи в предположении единичной водонасыщенности Sw равной 1.", "claims": ["conductivity-derived-porosity.c1"], "page": 130, "by": "model"}, {"text": "Расчет выполняется с использованием измерения сопротивления в нетронутой зоне пласта.", "claims": ["conductivity-derived-porosity.c4"], "page": 130, "by": "model"}, {"text": "Полученные значения выводятся в виде кривой, отображаемой в том же треке, что и потенциал собственной поляризации.", "claims": ["conductivity-derived-porosity.c5"], "page": 130, "by": "model"}, {"text": "Шкала трека размечается от высоких значений пористости слева до низких значений справа.", "claims": ["conductivity-derived-porosity.c6"], "page": 130, "by": "model"}, {"text": "В зонах с водой расчетная пористость высока и примерно равна истинной пористости формации.", "claims": ["conductivity-derived-porosity.c7"], "page": 130, "by": "model"}, {"text": "В зонах с углеводородами расчетная пористость оказывается низкой и меньше истинной пористости формации.", "claims": ["conductivity-derived-porosity.c8"], "page": 130, "by": "model"}], "steps": [{"text": "Рассчитать пористость по формуле Арчи, приняв Sw равным 1.0, используя сопротивление нетронутой зоны.", "claims": ["conductivity-derived-porosity.c9"], "page": 130, "by": "model"}, {"text": "Сопоставить значения кривой и ее относительное положение в пористых и проницаемых интервалах.", "claims": ["conductivity-derived-porosity.c10"], "page": 130, "by": "model"}, {"text": "При необходимости вычислить водонасыщенность по Арчи, сравнив полученную пористость с пористостью по акустическому, плотностному или нейтронному методам.", "claims": ["conductivity-derived-porosity.c11"], "page": 130, "by": "model"}], "examples": [], "numbers": [{"text": "В расчете по формуле Арчи используется допущение о водонасыщенности Sw равной 1 или 1.0.", "claims": ["conductivity-derived-porosity.c1", "conductivity-derived-porosity.c9"], "page": 130, "by": "model"}], "formulas": [{"latex": "S_w = 1", "page": 130, "vars": [{"sym": "S_w", "meaning": "водонасыщенность", "unit": "доли единицы"}]}], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Высокое сопротивление не всегда однозначно означает чистую нефть, а расчетная пористость по сопротивлению в нефтенасыщенных зонах искусственно занижается.", "claims": ["conductivity-derived-porosity.c8"], "page": 130, "by": "model"}]}, "data_meaning": {"input": "Данные сопротивления в нетронутой зоне пласта.", "output": "Кривая расчетной пористости в том же треке, что и потенциал собственной поляризации (SP), со шкалой от высокой пористости слева до низкой справа.", "breaks": [{"text": "Метод ломается в зонах, содержащих углеводороды, так как получаемая кривая дает заниженное значение пористости относительно истинной.", "claims": ["conductivity-derived-porosity.c8"], "page": 130, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Занижение пористости по сопротивлению в нефтегазовых зонах можно использовать как признак наличия углеводородов при сравнении с независимыми методами пористости.", "claims": ["conductivity-derived-porosity.c11", "conductivity-derived-porosity.c8"], "page": 130, "by": "model"}]}, "analogy": {"text": "Расчет фичи в модели машинного обучения на основе базового физического закона при заведомо неверном упрощающем предположении.", "breaks_where": "В отличие от чисто математических признаков, здесь отклонение предсказания от независимых сенсоров ной.", "quote": "In water-bearing zones, the conductivity-derived porosity is high and approximately equal to the true formation porosity.", "unit": "u130-18", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity.c8", "kind": "observation", "text": "В углеводородных зонах пористость по проводимости низкая и меньше истинной пористости.", "quote": "In zones that contain hydrocarbons, the conductivity-derived porosity is low, lower than the true formation porosity.", "unit": "u130-18", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity.c9", "kind": "observation", "text": "Первый шаг процедур — расчет пористости из уравнения Арчи при Sw равном 1.0.", "quote": "Calculate the porosity from Archie's equation (assuming Sw = 1.0), using the uninvaded zone resistivity measurement.", "unit": "u130-15", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity.c10", "kind": "observation", "text": "Второй шаг — сравнение значений кривой и ее относительного положения в пористых и проницаемых зонах.", "quote": "Compare the curve values and the relative position of the curve in porous and permeable zones.", "unit": "u130-15", "page": 130, "by": "model", "verified": true}, {"id": "conductivity-derived-porosity.c11", "kind": "observation", "text": "Третий шаг — вычисление водонасыщенности через сравнение с пористостью по акустическому, плотностному или нейтронному методам.", "quote": "If desired, an Archie water saturation can be calculated by comparing the conductivity-derived porosity", "unit": "u130-15", "page": 130, "by": "model", "verified": true}], "term_ids": ["t-conductivity-derived-porosity", "t-resistivity-porosity"], "units": ["u130-11", "u130-12", "u130-13", "u130-14", "u130-15", "u130-16", "u130-17", "u130-18"], "video_criteria": ["cause_effect", "counterintuitive"], "fallback": false}, {"id": "asquith.conductivity-derived-porosity-basis", "order": 9, "part_id": "p8", "minutes":

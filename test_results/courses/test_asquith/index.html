 "permeability-coates-dumanoir.c6", "question": "Заполните пропуск в описании первого шага метода: перед расчетом итоговой проницаемости в модели Коутса и Думануаре вычисляются значения двух констант — C и {{1}}.", "text": "Первым шагом в формуле проницаемости Коутса и Думануаре является вычисление значений двух констант: C и {{1}}.", "answers": [["W", "w"]], "explanation": "Алгоритм расчета требует предварительного определения промежуточных констант C и W."}, {"id": "asquith.shaly-sand-effects-models.q1", "node_id": "asquith.shaly-sand-effects-models", "type": "cloze", "claim_id": "shaly-sand-effects-models.c3", "question": "Заполните пропуск в описании модели двойной воды.", "text": "Модель двойной воды разделяет воду на неподвижный связанный слой у поверхности глины и подвижную {{1}} воду.", "answers": [["свободную", "свободная"]], "explanation": "Модель выделяет неподвижную связанную воду и подвижную свободную воду, способную вытесняться углеводородами."}, {"id": "asquith.shaly-sand-effects-models.q3", "node_id": "asquith.shaly-sand-effects-models", "type": "multi", "claim_id": "shaly-sand-effects-models.c4", "question": "В каких типах пород присутствие глин или сланцев может вызывать ошибки в оценке пористости и водонасыщенности по данным каротажа? (Выберите все верные варианты)", "options": ["Песчаники", "Известняки", "Доломиты", "Магматические граниты"], "answer": [0, 1, 2], "explanation": "Ошибки каротажа из-за глин и сланцев возникают в песчаниках, известняках и доломитах."}, {"id": "asquith.hingle-plot-sandstones-carbonates.q1", "node_id": "asquith.hingle-plot-sandstones-carbonates", "type": "multi", "claim_id": "hingle-plot-sandstones-carbonates.c1", "question": "Какие параметры и зависимости лежат в основе построения кроссплота Хингла?", "options": ["Зависимость удельного сопротивления от пористости", "Зависимость проницаемости от глинистости", "Оценка водонасыщенности пласта", "Определение абсолютного возраста пород"], "answer": [0, 2], "explanation": "Кроссплот Хингла представляет собой график зависимости сопротивления от пористости и используется для оценки водонасыщенности."}, {"id": "asquith.hingle-plot-sandstones-carbonates.q2", "node_id": "asquith.hingle-plot-sandstones-carbonates", "type": "calc", "claim_id": "hingle-plot-sandstones-carbonates.c1", "question": "Чему равен стандартный индекс цементации (m) для карбонатов, согласно тексту?", "answer": 2.15, "tolerance": 0.01, "unit": "", "explanation": "Для карбонатов в тексте указаны стандартные параметры a = 0.62 и m = 2.15."}, {"id": "asquith.hingle-plot-rw-sw-calculation.q1", "node_id": "asquith.hingle-plot-rw-sw-calculation", "type": "single", "claim_id": "hingle-plot-rw-sw-calculation.c3", "question": "Где пересекает ось Y линия водоносного пласта при проведении через кластер точек на графике Хингла?", "options": ["На значении 2.65 г/см³, соответствующем плотности матрицы", "На значении 1.0 г/см³, соответствующем плотности воды", "На нулевой отметке для абсолютного нуля сопротивления"], "answer": 0, "explanation": "Линия водоносного пласта проводится через кластер точек и пересекает ось Y именно на значении 2.65 г/см³, отражающем плотность матрицы породы."}, {"id": "asquith.hingle-plot-rw-sw-calculation.q2", "node_id": "asquith.hingle-plot-rw-sw-calculation", "type": "cloze", "claim_id": "hingle-plot-rw-sw-calculation.c1", "question": "Заполните пропуск в параметрах сетки Хингла для песчаников", "text": "Для песчаников обычно выбирают сетку Хингла с параметрами a = 1.0 и m = {{1}}.", "answers": [["2.0", "2"]], "explanation": "В тексте указано, что для песчаников стандартно выбираются параметры сетки a = 1.0 и m = 2.0."}, {"id": "asquith.hingle-plot-rw-sw-calculation.q3", "node_id": "asquith.hingle-plot-rw-sw-calculation", "type": "order", "claim_id": "hingle-plot-rw-sw-calculation.c2", "question": "Расставьте по порядку шаги определения параметров по графику Хингла", "items": ["Построить кроссплот с объемной плотностью по оси X и нанести точки", "Провести линию водоносного пласта до пересечения с осью Y для определения плотности матрицы", "Считать сопротивление R_a с линии водоносного пласта для выбранного значения пористости", "Рассчитать удельное сопротивление воды R_w или водонасыщенность S_w по формулам"], "explanation": "Сначала строится кроссплот и находится плотность матрицы, затем считывается базовое сопротивление R_a, после чего выполняются конечные расчеты по формулам."}], "cards": [{"id": "asquith.log-interpretation-overview.card", "node_id": "asquith.log-interpretation-overview", "front": "Можно ли полагаться только на геофизические исследования скважин (каротаж) при принятии решения о спуске обсадной колонны?", "back": "Нет, интерпретацию нельзя применять обособленно; необходимо учитывать данные испытаний пластов, шлам и соседнюю добычу."}, {"id": "asquith.reconnaissance-scanning.card", "node_id": "asquith.reconnaissance-scanning", "front": "От чего зависит выбор главного метода при экспресс-сканировании разреза?", "back": "От литологии: для обломочных пород используют каротаж сопротивления, а для карбонатов — каротаж пористости."}, {"id": "asquith.archie-water-saturation.card", "node_id": "asquith.archie-water-saturation", "front": "Достаточно ли знать только водонасыщенность (Sw) по формуле Арчи для оценки продуктивности зоны?", "back": "Нет, помимо низкой водонасыщенности нужно проверить подвижность углеводородов, проницаемость и коммерческий объем запасов."}, {"id": "asquith.flushed-zone-saturation.card", "node_id": "asquith.flushed-zone-saturation", "front": "Как используется водонасыщенность промытой зоны S_xo для оценки углеводородов?", "back": "ее сравнение с общей водонасыщенностью S_w служит индикатором подвижности углеводородов и их вытеснения буровым раствором."}, {"id": "asquith.ratio-method.card", "node_id": "asquith.ratio-method", "front": "Каким образом метод отношений позволяет оценить водонасыщенность и подвижные углеводороды без знания пористости пласта?", "back": "За счет математического сокращения формующего фактора (пористости) при делении уравнения Арчи для непромытой зоны на уравнение для промытой зоны."}, {"id": "asquith.quick-look-rxo-rt.card", "node_id": "asquith.quick-look-rxo-rt", "front": "В чем заключается идея экспресс-метода анализа Rxo/Rt совместно со спонтанной поляризацией (SP)?", "back": "Метод сопоставляет кривую отношения сопротивлений промытой и неизведанной зон с кривой SP: в водоносных пластах они совпадают поведением, а в нефтегазоносных — расходятся из-за роста Rt."}, {"id": "asquith.apparent-water-resistivity.card", "node_id": "asquith.apparent-water-resistivity", "front": "Какую главную задачу решает метод кажущегося удельного сопротивления воды (Rwa)?", "back": "Метод позволяет выявлять зоны с углеводородами и оценивать водонасыщенность путем сравнения расчетных значений Rwa, принимая минимальное значение за истинное сопротивление пластовой воды."}, {"id": "asquith.conductivity-derived-porosity.card", "node_id": "asquith.conductivity-derived-porosity", "front": "Как ведет себя расчетная пористость по сопротивлению в водоносных и нефтегазоносных зонах?", "back": "В водоносных зонах она высокая и близка к истинной, а в нефтегазоносных — занижена."}, {"id": "asquith.conductivity-derived-porosity-basis.card", "node_id": "asquith.conductivity-derived-porosity-basis", "front": "Как присутствие углеводородов влияет на результат расчета пористости по методу сопротивления?", "back": "При наличии углеводородов расчетная пористость оказывается заниженной по сравнению с реальной."}, {"id": "asquith.wet-resistivity-ro-curve.card", "node_id": "asquith.wet-resistivity-ro-curve", "front": "Как с помощью кривой Ro (wet resistivity) определить наличие углеводородов в пласте?", "back": "Кривую Ro накладывают на кривую глубокого сопротивления в одном масштабе: в водоносных зонах они совпадают, а в нефтегазонасыщенных глубокое сопротивление оказывается выше Ro."}, {"id": "asquith.bulk-volume-water-bvw.card", "node_id": "asquith.bulk-volume-water-bvw", "front": "Что такое BVW (объемная вода в пласте) и о чем говорит ее постоянство на графике Бакклза?", "back": "BVW — это произведение водонасыщенности на пористость. Постоянство BVW указывает на единый тип породы и нахождение пласта в состоянии остаточной водонасыщенности, что гарантирует безводную добычу."}, {"id": "asquith.pickett-crossplot-method.card", "node_id": "asquith.pickett-crossplot-method", "front": "В чем суть кроссплота Пикетта и что он позволяет определить?", "back": "Это графическое решение уравнения Арчи в логарифмических координатах, которое позволяет оценить водонасыщение пласта, сопротивление воды и индекс цементации по данным геофизики."}, {"id": "asquith.hinge-crossplot-method.card", "node_id": "asquith.hinge-crossplot-method", "front": "Что позволяет определить кроссплот Хингла и на каком законе он основан?", "back": "Метод позволяет определять водонасыщенность пласта, сопротивление воды и параметры матрицы без предварительного знания их свойств, основываясь на преобразовании уравнения Арчи в линейную форму на специальной сетке."}, {"id": "asquith.log-interpretation-workflow.card", "node_id": "asquith.log-interpretation-workflow", "front": "С каких шагов начинается обзор каротажных диаграмм и в чем главное отличие подходов для терригенных пород и карбонатов?", "back": "Обзор начинается с поиска чистых зон. Для терригенных пород базовым методом является кривая сопротивления (из-за контраста с глинами), а для карбонатов — кривая пористости (из-за изменчивости литологии и дефицита опорных глин)."}, {"id": "asquith.pickett-hingle-comparison.card", "node_id": "asquith.pickett-hingle-comparison", "front": "Какие основные требования предъявляются к геологическому разрезу для успешного применения кроссплотов Пикетта и Хингла?", "back": "Постоянство литологии и удельного сопротивления воды, а также наличие широкого диапазона пористости."}, {"id": "asquith.buckles-plot-bvw.card", "node_id": "asquith.buckles-plot-bvw", "front": "О чём говорит сильный разброс значений объёма связанной воды (BVW) на графике Баклза?", "back": "О том, что в пласте появилась подвижная вода, водонасыщенность не является неуменьшаемой, а оценки проницаемости вызывают сомнения."}, {"id": "asquith.permeability-wyllie-rose-timur.card", "node_id": "asquith.permeability-wyllie-rose-timur", "front": "Что связывают эмпирические формулы Вилли-Роуза и Тимура?", "back": "Проницаемость с пористостью и остаточной водонасыщенностью."}, {"id": "asquith.permeability-coates-dumanoir.card", "node_id": "asquith.permeability-coates-dumanoir", "front": "Какая главная особенность модели Коутса и Думануаре для расчета проницаемости?", "back": "Плотность углеводородов учитывается в уравнении явно через предварительный расчет промежуточных констант C и W."}, {"id": "asquith.shaly-sand-effects-models.card", "node_id": "asquith.shaly-sand-effects-models", "front": "Почему важно учитывать электрофизические свойства глин, а не просто объем сланца при интерпретации каротажа?", "back": "Потому что сланцы и глины не тождественны, а их электрические свойства (связанная вода и проводимость) существенно влияют на расчет водонасыщенности и предотвращают ложные выводы о нефтеносности."}, {"id": "asquith.hingle-plot-sandstones-carbonates.card", "node_id": "asquith.hingle-plot-sandstones-carbonates", "front": "Что такое кроссплот Хингла и для чего он применяется?", "back": "Это график зависимости удельного сопротивления от пористости, который используется для визуальной оценки и разделения водоносных и углеводородонасыщенных зон."}, {"id": "asquith.hingle-plot-rw-sw-calculation.card", "node_id": "asquith.hingle-plot-rw-sw-calculation", "front": "Что позволяет определять график Хингла в петрофизике?", "back": "Удельное сопротивление пластовой воды и водонасыщенность."}], "glossary": [{"id": "t-water-saturation", "term": "Водонасыщенность", "en": "Water saturation", "definition": "Доля порового пространства, занятая пластовой водой.", "node_id": "asquith.log-interpretation-overview", "page": 126}, {"id": "t-true-resistivity", "term": "Истинное удельное сопротивление", "en": "True resistivity", "definition": "Параметр пласта, используемый для оценки насыщения совместно с пористостью.", "node_id": "asquith.log-interpretation-overview", "page": 126}, {"id": "t-permeability", "term": "Проницаемость", "en": "Permeability", "definition": "Способность породы пропускать флюиды, оцениваемая по данным каротажа.", "node_id": "asquith.log-interpretation-overview", "page": 126}, {"id": "t-reservoir", "term": "коллектор", "en": "reservoir", "definition": "Горная порода, способная вмещать и пропускать флюиды.", "node_id": "asquith.reconnaissance-scanning", "page": 126}, {"id": "t-nonreservoir", "term": "неколлектор", "en": "nonreservoir", "definition": "Порода, не обладающая достаточной емкостью или проницаемостью для движения флюидов.", "node_id": "asquith.reconnaissance-scanning", "page": 126}, {"id": "t-clastics", "term": "обломочные породы", "en": "clastics", "definition": "Осадочные горные породы, состоящие из обломков минералов и пород (например, песчаники).", "node_id": "asquith.reconnaissance-scanning", "page": 126}, {"id": "t-carbonates", "term": "карбонаты", "en": "carbonates", "definition": "Осадочные породы, состоящие преимущественно из карбонатов кальция и магния (известняки, доломиты).", "node_id": "asquith.reconnaissance-scanning", "page": 126}, {"id": "t-water-saturation-of-the-uninvaded-zone-sw", "term": "водонасыщенность неизмененной зоны", "en": "water saturation of the uninvaded zone (Sw)", "definition": "Доля порового пространства неизмененной зоны пласта, занятая пластовой водой.", "node_id": "asquith.archie-water-saturation", "page": 126}, {"id": "t-true-formation-resistivity-rt", "term": "истинное удельное сопротивление пласта", "en": "true formation resistivity (Rt)", "definition": "Удельное сопротивление пласта, не искаженное зоной проникновения бурового раствора.", "node_id": "asquith.archie-water-saturation", "page": 126}, {"id": "t-resistivity-of-formation-water-rw", "term": "удельное сопротивление пластовой воды", "en": "resistivity of formation water (Rw)", "definition": "Сопротивление воды, заполняющей поровое пространство, при температуре пласта.", "node_id": "asquith.archie-water-saturation", "page": 126}, {"id": "t-tortuosity-factor-a", "term": "коэффициент извилистости", "en": "tortuosity factor (a)", "definition": "Эмпирический коэффициент в формуле Арчи, отражающий извилистость пор.", "node_id": "asquith.archie-water-saturation", "page": 126}, {"id": "t-cementation-exponent-m", "term": "показатель цементации", "en": "cementation exponent (m)", "definition": "Параметр, характеризующий степень цементации породы.", "node_id": "asquith.archie-water-saturation", "page": 126}, {"id": "t-saturation-exponent-n", "term": "показатель насыщения", "en": "saturation exponent (n)", "definition": "Параметр, учитывающий влияние насыщения породы флюидами на ее сопротивление.", "node_id": "asquith.archie-water-saturation", "page": 126}, {"id": "t-flushed-zone-water-saturation-s-xo", "term": "водонасыщенность промытой зоны", "en": "flushed zone water saturation (S_xo)", "definition": "Доля объема пор в промытой зоне, занятая водой.", "node_id": "asquith.flushed-zone-saturation", "page": 127}, {"id": "t-mud-filtrate-resistivity-r-mf", "term": "сопротивление фильтрата бурового раствора", "en": "mud filtrate resistivity (R_mf)", "definition": "Удельное электрическое сопротивление фильтрата бурового раствора при пластовой температуре.", "node_id": "asquith.flushed-zone-saturation", "page": 127}, {"id": "t-flushed-zone-resistivity-r-xo", "term": "сопротивление промытой зоны", "en": "flushed zone resistivity (R_xo)", "definition": "Удельное электрическое сопротивление зоны проникновения, измеренное мелкофокусными приборами.", "node_id": "asquith.flushed-zone-saturation", "page": 127}, {"id": "t-moveable-hydrocarbon-index", "term": "индекс подвижных углеводородов", "en": "moveable hydro

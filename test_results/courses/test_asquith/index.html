, {"id": "p15", "title": "Permeability from logs", "node_ids": ["asquith.buckles-plot-bvw"]}, {"id": "p16", "title": "Wyllie and Rose (1950)", "node_ids": ["asquith.permeability-wyllie-rose-timur"]}, {"id": "p17", "title": "Coates and Dumanoir (1973)", "node_ids": ["asquith.permeability-coates-dumanoir"]}, {"id": "p18", "title": "Shaly sand analysis", "node_ids": ["asquith.shaly-sand-effects-models"]}, {"id": "p19", "title": "Carbonates:", "node_ids": ["asquith.hingle-plot-sandstones-carbonates", "asquith.hingle-plot-rw-sw-calculation"]}], "nodes": [{"id": "asquith.log-interpretation-overview", "order": 1, "part_id": "p1", "minutes": 2, "title": "Обзор интерпретации геофизических исследований скважин", "book_title": "Log Interpretation", "pages": [126, 126], "difficulty": {"primary": "И", "secondary": null}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». текст", "scene_template": "tool-in-well"}, "summary": [{"text": "Определение пористости и истинного удельного сопротивления служит первым шагом перевода сырых данных каротажа в оценки нефти, газа и воды.", "claims": ["log-interpretation-overview.c1"], "page": 126, "by": "model"}, {"text": "Полученные оценки помогают оценить зону пласта и решить вопрос о целесообразности спуска обсадной колонны.", "claims": ["log-interpretation-overview.c2"], "page": 126, "by": "model"}, {"text": "Интерпретацию нельзя применять без учета других данных, таких как испытания пластов и шлам.", "claims": ["log-interpretation-overview.c3"], "page": 126, "by": "model"}], "how_it_works": [{"text": "Определение пористости и истинного сопротивления является начальным шагом перевода сырых данных каротажа в оценки углеводородов и воды.", "claims": ["log-interpretation-overview.c1"], "page": 126, "by": "model"}, {"text": "Эти оценки применяются для оценки зоны и принятия решения о необходимости попытки окончания скважины.", "claims": ["log-interpretation-overview.c2"], "page": 126, "by": "model"}, {"text": "Глава охватывает методы расчета водонасыщенности по Арчи, метод отношений, экспресс-методы, объемную воду и кроссплоты.", "claims": ["log-interpretation-overview.c4"], "page": 126, "by": "model"}, {"text": "Также рассматриваются определение проницаемости и анализ глинистых песков.", "claims": ["log-interpretation-overview.c5"], "page": 126, "by": "model"}, {"text": "Логические данные нельзя применять обособленно без включения прочих данных.", "claims": ["log-interpretation-overview.c3"], "page": 126, "by": "model"}, {"text": "Геологу следует учитывать испытания буровым инструментом, проявления в шламе и соседнюю добычу перед решением о спуске труб.", "claims": ["log-interpretation-overview.c6"], "page": 126, "by": "model"}], "steps": [], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Сырые данные каротажа, пористость и истинное удельное сопротивление зоны.", "output": "Оценки объемов нефти, газа и воды, водонасыщенность, проницаемость и решение о спуске труб.", "breaks": [{"text": "Интерпретация ломается, если применяется в отрыве от геологических данных и смежных анализов.", "claims": ["log-interpretation-overview.c3"], "page": 126, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Сырые данные каротажа можно рассматривать как матрицу признаков на входе модели оценки насыщенности.", "claims": [], "page": 126, "by": "model"}]}, "analogy": {"text": "Каротаж и его методы похожи на ансамбль сенсоров и ансамбль моделей машинного обучения, где сырые сигналы преобразуются в целевые метрики.", "breaks_where": "Модели машинного обучения обучаются на больших выборках с явными метками, тогда как петрофизические методы опираются на физические уравнения и эмпирические зависимости."}, "now_practice": [], "layers": {"mechanism": [{"text": "Перевод сырых данных каротажа в запасы через расчет пористости и сопротивления.", "claims": ["log-interpretation-overview.c1"], "page": 126, "by": "model"}], "practice": [{"text": "Использование методов Арчи, кроссплотов, экспресс-оценок и анализа проницаемости.", "claims": ["log-interpretation-overview.c4", "log-interpretation-overview.c5"], "page": 126, "by": "model"}], "nuances": [{"text": "Необходимость комплексного привлечения данных испытаний и шлама перед спуском труб.", "claims": ["log-interpretation-overview.c3", "log-interpretation-overview.c6"], "page": 126, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "asquith.log-interpretation-overview.ill1", "class": "B", "src": "media/asquith.log-interpretation-overview-links.svg", "alt": "Карта шага: на что он опирается и куда ведёт: Обзор интерпретации геофизических исследований скважин", "caption": "Карта шага: на что он опирается и куда ведёт", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "log-interpretation-overview.c1", "kind": "observation", "text": "Определение пористости и истинного сопротивления — первый шаг перевода сырых данных каротажа в оценки нефти, газа и воды.", "quote": "determining the porosity and true resistivity of a zone is the first step in converting the raw log data into estimated quantities of oil, gas, and water in a formation", "unit": "u126-05", "page": 126, "by": "model", "verified": true}, {"id": "log-interpretation-overview.c2", "kind": "observation", "text": "Оценки используются для оценки зоны и решения о целесообразности окончания скважины.", "quote": "These estimated quantities are used to evaluate a zone and to determine whether a well completion attempt is warranted.", "unit": "u126-05", "page": 126, "by": "model", "verified": true}, {"id": "log-interpretation-overview.c3", "kind": "observation", "text": "Интерпретацию нельзя применять без других данных.", "quote": "it should not be applied without the inclusion of other data.", "unit": "u126-06", "page": 126, "by": "model", "verified": true}, {"id": "log-interpretation-overview.c4", "kind": "observation", "text": "Глава охватывает методы Арчи, метод отношений, экспресс-метод, объемную воду и кроссплоты.", "quote": "The methods discussed are: Archie water saturations ($S_w$ and $S_{xo}$) and the ratio method, quick-look technique, bulk volume water ($BVW$), and saturation crossplots (Pickett plots and Hingle plots).", "unit": "u126-05", "page": 126, "by": "model", "verified": true}, {"id": "log-interpretation-overview.c5", "kind": "observation", "text": "Обсуждается определение проницаемости и анализ глинистых песков.", "quote": "Determination of log-derived permeability ($K_e$) and shaly sand analysis are also discussed.", "unit": "u126-05", "page": 126, "by": "model", "verified": true}, {"id": "log-interpretation-overview.c6", "kind": "observation", "text": "Геолог должен учитывать испытания, шлам и соседнюю добычу перед спуском труб.", "quote": "A geologist should always consider every item of relevant data, such as drill stem tests, sample shows, mud-log analysis, nearby production, etc., before making a decision to set pipe.", "unit": "u126-06", "page": 126, "by": "model", "verified": true}], "term_ids": ["t-water-saturation", "t-true-resistivity", "t-permeability"], "units": ["u126-05", "u126-06"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "asquith.reconnaissance-scanning", "order": 2, "part_id": "p2", "minutes": 2, "title": "Экспресс-сканирование разреза для поиска коллекторов", "book_title": "SCANNING THE LOGS: A RECONNAISSANCE TECHNIQUE", "pages": [126, 126], "difficulty": {"primary": "Р", "secondary": "И"}, "threshold": false, "format": {"primary": "cards", "reason": "Тип «распознавание»; критерии видеоёмкости: невидимое становится видимым, контринтуитивность. текст", "scene_template": "feature-gallery"}, "summary": [{"text": "Экспресс-сканирование разреза помогает быстро выделить коллекторы и различить нефтеносные и водяные зоны в незнакомых районах.", "claims": ["reconnaissance-scanning.c1"], "page": 126, "by": "model"}, {"text": "Выбор главного метода сканирования зависит от литологии: для обломочных пород используется кривая сопротивления, а для карбонатов — кривая пористости.", "claims": ["reconnaissance-scanning.c2"], "page": 126, "by": "model"}], "how_it_works": [{"text": "Большинство разрезов содержат больше неколлекторов, чем коллекторов, поэтому для первичной разведки применяется экспресс-сканирование.", "claims": ["reconnaissance-scanning.c1"], "page": 126, "by": "model"}, {"text": "Хорошая техника сканирования находит коллекторы и дает геологу подсказки о потенциальных продуктивных и водяных зонах.", "claims": ["reconnaissance-scanning.c3"], "page": 126, "by": "model"}, {"text": "Сравнение продуктивных и водяных зон важно, так как оно позволяет четко определить наличие и объем углеводородов.", "claims": ["reconnaissance-scanning.c4"], "page": 126, "by": "model"}, {"text": "Для обломочных пород первичным измерением служит каротаж сопротивления, поскольку они окружены глинами с медленно меняющимся сопротивлением.", "claims": ["reconnaissance-scanning.c5"], "page": 126, "by": "model"}, {"text": "В карбонатах сопротивление сильно меняется из-за смены типов пород и отсутствия стабильного фона глин, поэтому главным методом становится каротаж пористости.", "claims": ["reconnaissance-scanning.c6"], "page": 126, "by": "model"}], "steps": [{"text": "Определить литологический тип разреза: обломочные породы или карбонаты.", "claims": ["reconnaissance-scanning.c2"], "page": 126, "by": "model"}, {"text": "Для обломочных пород применить кривую сопротивления для поиска контрастных изменений сопротивления флюидов.", "claims": ["reconnaissance-scanning.c5"], "page": 126, "by": "model"}, {"text": "Для карбонатов применить кривую пористости для выявления зон, способных удерживать флюиды.", "claims": ["reconnaissance-scanning.c6"], "page": 126, "by": "model"}, {"text": "Сопоставить потенциально продуктивные и водные зоны для оценки объема углеводородов.", "claims": ["reconnaissance-scanning.c4"], "page": 126, "by": "model"}], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Данные каротажа сопротивления (для обломочных пород) или пористости (для карбонатов).", "output": "Выделенные зоны коллекторов, подсказки по потенциально продуктивным и водяным зонам.", "breaks": [{"text": "В карбонатах сопротивление сильно варьируется из-за смены литологии, поэтому метод сопротивления как первичный признак там не работает.", "claims": ["reconnaissance-scanning.c6"], "page": 126, "by": "model"}], "hypotheses": [{"text": "Гипотеза: алгоритм экспресс-сканирования можно реализовать как автоматическую классификацию с адаптивным порогом в зависимости от литологической ветки.", "claims": [], "page": 126, "by": "model"}]}, "analogy": {"text": "Экспресс-сканирование похоже на предварительную фильтрацию признаков в датасете перед построением тяжелой модели.", "breaks_where": "В отличие от датасета, геологическая обстановка меняется по разрезу, требуя разветвления логики на разные типы пород."}, "now_practice": [], "layers": {"mechanism": [{"text": "Разделение алгоритма сканирования на две ветки обусловлено физическими свойствами вмещающих пород.", "claims": ["reconnaissance-scanning.c2", "reconnaissance-scanning.c5", "reconnaissance-scanning.c6"], "page": 126, "by": "model"}], "practice": [{"text": "Применение экспресс-метода экономит время при первичном анализе новых скважин.", "claims": ["reconnaissance-scanning.c1"], "page": 126, "by": "model"}], "nuances": [{"text": "Выявление водных зон критически важно для корректной оценки запасов углеводородов.", "claims": ["reconnaissance-scanning.c4"], "page": 126, "by": "model"}], "deeper": [{"text": "Фоновые глины в обломочных отложениях создают стабильный базовый уровень для поиска аномалий по сопротивлению.", "claims": ["reconnaissance-scanning.c5"], "page": 126, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.reconnaissance-scanning.ill1", "class": "B", "src": "media/asquith.reconnaissance-scanning-steps.svg", "alt": "Порядок действий по тексту автора: Экспресс-сканирование разреза для поиска коллекторов", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.log-interpretation-overview", "type": "prerequisite"}], "claims": [{"id": "reconnaissance-scanning.c1", "kind": "observation", "text": "Редко в каком разрезе коллекторов больше, чем неколлекторов, поэтому сканирование помогает при незнакомой обстановке.", "quote": "It is an exceedingly rare log that contains more reservoir than nonreservoir, and when one is unfamiliar with an area or wants to broadly reconnoiter an area, a scanning technique that sorts reservoir from nonreservoir can be helpful", "unit": "u126-08", "page": 126, "by": "model", "verified": true}, {"id": "reconnaissance-scanning.c2", "kind": "observation", "text": "Блок-схема сканирования имеет две ветки: одну для обломочных пород, другую для карбонатов.", "quote": "Figure 7.1 is a flowchart for one such scanning technique. Note that it has two paths, one for clastics and one for carbonates.", "unit": "u126-10", "page": 126, "by": "model", "verified": true}, {"id": "reconnaissance-scanning.c3", "kind": "observation", "text": "Хорошая техника сканирования не только находит коллекторы, но и указывает на потенциальные продуктивные и водяные зоны.", "quote": "A good scanning technique not only identifies the reservoirs, but can also give the geologist hints as to potential pay and wet zones.", "unit": "u126-08", "page": 126, "by": "model", "verified": true}, {"id": "reconnaissance-scanning.c4", "kind": "observation", "text": "Идентификация водных зон важна так же, как и открытие углеводородов, так как их сравнение выявляет присутствие и объем нефти или газа.", "quote": "comparison of the two helps clearly identify both the presence and amount of the hydrocarbons.", "unit": "u126-09", "page": 126, "by": "model", "verified": true}, {"id": "reconnaissance-scanning.c5", "kind": "observation", "text": "В обломочных породах кривая сопротивления является главным измерением, так как коллекторы окружены глинами с медленно меняющимся сопротивлением.", "quote": "In the clastic case, the resistivity log is the primary reconnaissance measurement because clastics tend to consist of reservoirs surrounded by shales of slowly varying resistivity.", "unit": "u126-10", "page": 126, "by": "model", "verified": true}, {"id": "reconnaissance-scanning.c6", "kind": "observation", "text": "В карбонатах сопротивление сильно меняется из-за смены типов пород и отсутствия глин, поэтому основным методом является каротаж пористости.", "quote": "On the carbonate path, on the other hand, formation resistivities tend to vary widely with changing rock types, and commonly there are few shales against which to measure changes. In this case, the porosity log is the primary reconnaissance measurement.", "unit": "u126-10", "page": 126, "by": "model", "verified": true}], "term_ids": ["t-reservoir", "t-nonreservoir", "t-clastics", "t-carbonates"], "units": ["u126-08", "u126-09", "u126-10", "u126-11"], "video_criteria": ["invisible_visible", "counterintuitive"], "fallback": false}, {"id": "asquith.archie-water-saturation", "order": 3, "part_id": "p3", "minutes": 3, "title": "Расчет водонасыщенности по формуле Арчи", "book_title": "ARCHIE WATER SATURATIONS: S_W AND S_XO", "pages": [126, 127], "difficulty": {"primary": "И", "secondary": "Ф"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». Текст с формулой и списком условий оптимально разбирать в формате структурированного текста с формульным блоком для инженеров цифровой трансформации.", "scene_template": "tool-in-well"}, "summary": [{"text": "Водонасыщенность неизмененной зоны пласта $S_w$ вычисляется по классической формуле Арчи 1942 года.", "claims": ["archie-water-saturation.c1"], "page": 126, "by": "model"}, {"text": "Расчет базируется на удельном сопротивлении пластовой воды, истинном сопротивлении пласта, пористости и эмпирических коэффициентах.", "claims": ["archie-water-saturation.c2", "archie-water-saturation.c3", "archie-water-saturation.c4", "archie-water-saturation.c5", "archie-water-saturation.c6", "archie-water-saturation.c7"], "page": 126, "by": "model"}, {"text": "Значение $S_w$ фундаментально для оценки, но само по себе не гарантирует промышленную продуктивность зоны.", "claims": ["archie-water-saturation.c8", "archie-water-saturation.c9"], "page": 127, "by": "model"}], "how_it_works": [{"text": "Водонасыщенность ($S_w$) неизмененной зоны рассчитывается по формуле Арчи 1942 года с использованием параметров сопротивления и пористости.", "claims": ["archie-water-saturation.c1", "archie-water-saturation.c2", "archie-water-saturation.c3", "archie-water-saturation.c4", "archie-water-saturation.c5", "archie-water-saturation.c6", "archie-water-saturation.c7"], "page": 126, "by": "model"}, {"text": "$R_w$ — это удельное сопротивление пластовой воды при температуре пласта, а $R_t$ — истинное сопротивление.", "claims": ["archie-water-saturation.c2", "archie-water-saturation.c3"], "page": 126, "by": "model"}, {"text": "Параметр $R_t$ определяется по данным глубокого индукционного каротажа или глубокого бокового каротажа с поправкой на проникновение.", "claims": ["archie-water-saturation.c3"], "page": 126, "by": "model"}, {"text": "В формулу входят пористость $\\phi$, коэффициент извилистости каналов $a$, показатель цементации $m$ и показатель насыщения $n$.", "claims": ["archie-water-saturation.c4", "archie-water-saturation.c5", "archie-water-saturation.c6", "archie-water-saturation.c7"], "page": 126, "by": "model"}, {"text": "Одного знания $S_w$ недостаточно для оценки потенциала: нужно проверить низкую водонасыщенность для безводной добычи.", "claims": ["archie-water-saturation.c8", "archie-water-saturation.c9", "archie-water-saturation.c10"], "page": 127, "by": "model"}, {"text": "Также необходимо определить подвижность углеводородов, проницаемость зоны и наличие коммерческого объема извлекаемых запасов.", "claims": ["archie-water-saturation.c11", "archie-water-saturation.c12", "archie-water-saturation.c13"], "page": 127, "by": "model"}], "steps": [{"text": "Собрать входные параметры: $R_w$, $R_t$, $\\phi$, коэффициенты $a$, $m$ и $n$.", "claims": ["archie-water-saturation.c2", "archie-water-saturation.c3", "archie-water-saturation.c4", "archie-water-saturation.c5", "archie-water-saturation.c6", "archie-water-saturation.c7"], "page": 126, "by": "model"}, {"text": "Подставить значения в формулу Арчи для вычисления водонасыщенности неизмененной зоны $S_w$.", "claims": ["archie-water-saturation.c1"], "page": 126, "by": "model"}, {"text": "Проверить дополнительные условия по продуктивности: подвижность углеводородов, проницаемость и коммерческий объем запасов.", "claims": ["archie-water-saturation.c10", "archie-water-saturation.c11", "archie-water-saturation.c12", "archie-water-saturation.c13"], "page": 127, "by": "model"}], "examples": [], "numbers": [{"text": "В формуле Арчи используется год создания модели — 1942.", "claims": ["archie-water-saturation.c1"], "page": 126, "by": "model"}, {"text": "В тексте источника на странице 126 упоминаются условные номера страниц 115 и 116.", "claims": ["archie-water-saturation.c14"], "page": 126, "by": "model"}], "formulas": [{"latex": "S_w = \\left( \\frac{a \\times R_w}{R_t \\times \\phi^m} \\right)^{\\frac{1}{n}}", "page": 126, "vars": [{"sym": "S_w", "meaning": "water saturation of the uninvaded zone", "unit": "u126-16"}, {"sym": "a", "meaning": "tortuosity factor", "unit": "u126-20"}, {"sym": "R_w", "meaning": "resistivity of formation water at formation temperature", "unit": "u126-17"}, {"sym": "R_t", "meaning": "true formation resistivity", "unit": "u126-18"}, {"sym": "\\phi", "meaning": "porosity", "unit": "u126-19"}, {"sym": "m", "meaning": "cementation exponent", "unit": "u127-02"}, {"sym": "n", "meaning": "saturation exponent", "unit": "u127-03"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Удельное сопротивление пластовой воды (R_w), истинное сопротивление пласта (R_t), пористость (phi), коэффициент извилистости (a), показатель цементации (m), показатель насыщения (n).", "output": "Водонасыщенность неизмененной зоны (S_w).", "breaks": [{"text": "Знание одной лишь водонасыщенности S_w не дает достаточной информации для полной оценки потенциальной продуктивности зоны.", "claims": ["archie-water-saturation.c9"], "page": 127, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Формулу Арчи можно рассматривать как аналитическую функцию активации в нейросети, где весами выступают эмпирические коэффициенты m и n.", "claims": ["archie-water-saturation.c1"], "page": 126, "by": "model"}]}, "analogy": {"text": "Формула Арчи похожа на расчетную математическую модель (формулу тарифа), куда подставляются входные признаки для вычисления целевой переменной.", "breaks_where": "Модель не учитывает все физические и химические особенности реальной породы автоматически, требуя подбора эмпирических коэффициентов."}, "now_practice": [{"text": "Сегодня расчет по формуле Арчи обычно автоматизирован в специализированном программном обеспечении для интерпретации данных геофизических исследований скважин.", "claims": ["archie-water-saturation.c1"], "page": 126, "by": "model"}], "layers": {"mechanism": [{"text": "Формула Арчи связывает электропроводность породы с ее пористостью и количеством содержащейся в ней воды.", "claims": ["archie-water-saturation.c1", "archie-water-saturation.c4"], "page": 126, "by": "model"}], "practice": [{"text": "Для расчета необходимо скорректировать измерения сопротивления на зону проникновения и использовать табличные коэффициенты.", "claims": ["archie-water-saturation.c3", "archie-water-saturation.c6", "archie-water-saturation.c7"], "page": 126, "by": "model"}], "nuances": [{"text": "Низкое значение S_w — это лишь один из критериев, наряду с подвижностью углеводородов, проницаемостью и коммерческим объемом запасов.", "claims": ["archie-water-saturation.c10", "archie-water-saturation.c11", "archie-water-saturation.c12", "archie-water-saturation.c13"], "page": 127, "by": "model"}], "deeper": [{"text": "Параметры a, m и n зависят от литологии и структуры порового пространства, что отсылает к первой главе книги.", "claims": ["archie-water-saturation.c5", "archie-water-saturation.c6", "archie-water-saturation.c7"], "page": 126, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.archie-water-saturation.ill1", "class": "B", "src": "media/asquith.archie-water-saturation-steps.svg", "alt": "Порядок действий по тексту автора: Расчет водонасыщенности по формуле Арчи", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.log-interpretation-overview", "type": "prerequisite"}], "claims": [{"id": "archie-water-saturation.c1", "kind": "observation", "text": "Водонасыщенность неизмененной зоны пласта рассчитывается по формуле Арчи 1942 года.", "quote": "Water saturation (Sw) of a reservoir's uninvaded zone is calculated by the Archie (1942) formula:", "unit": "u126-13", "page": 126, "by": "model", "verified": true}, {"id": "archie-water-saturation.c2", "kind": "observation", "text": "Rw — это сопротивление пластовой воды при температуре пласта.", "quote": "Rw = resistivity of formation water at formation temperature", "unit": "u126-17", "page": 126, "by": "model", "verified": true}, {"id": "archie-water-saturation.c3", "kind": "observation", "text": "Rt — это истинное сопротивление пласта, скорректированное на проникновение.", "quote": "Rt = true formation resistivity (i.e., deep induction or deep laterolog corrected for invasion)", "unit": "u126-18", "page": 126, "by": "model", "verified": true}, {"id": "archie-water-saturation.c4", "kind": "observation", "text": "phi обозначает пористость.", "quote": "phi = porosity", "unit": "u126-19", "page": 126, "by": "model", "verified": false}, {"id": "archie-water-saturation.c5", "kind": "observation", "text": "a — коэффициент извилистости каналов.", "quote": "a = tortuosity factor (Table 1.1; Chapter 1)", "unit": "u126-20", "page": 126, "by": "model", "verified": true}, {"id": "archie-water-saturation.c6", "kind": "observation", "text": "m — показатель цементации.", "quote": "m = cementation exponent (Table 1.1; Chapter 1)", "unit": "u127-02", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c7", "kind": "observation", "text": "n — показатель насыщения.", "quote": "n = saturation exponent", "unit": "u127-03", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c8", "kind": "observation", "text": "Водонасыщенность неизмененной зоны является фундаментальным количеством в оценке по каротажу.", "quote": "The uninvaded zone's water saturation (Sw), determined by the Archie equation, is the most fundamental quantity used in log evaluation.", "unit": "u127-04", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c9", "kind": "observation", "text": "Знание одной только водонасыщенности не дает достаточно информации для оценки потенциальной продуктивности.", "quote": "But merely knowing a zone's water saturation (Sw) does not provide enough information to completely evaluate a zone's potential productivity.", "unit": "u127-04", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c10", "kind": "observation", "text": "Необходимо проверить, является ли водонасыщенность достаточно низкой для безводной добычи.", "quote": "- the water saturation is low enough for a water-free completion", "unit": "u127-05", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c11", "kind": "observation", "text": "Необходимо определить, являются ли углеводороды подвижными.", "quote": "the hydrocarbons are moveable", "unit": "u127-05", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c12", "kind": "observation", "text": "Необходимо определить, является ли зона проницаемой.", "quote": "the zone is permeable", "unit": "u127-05", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c13", "kind": "observation", "text": "Необходимо убедиться в наличии коммерческого объема извлекаемых запасов углеводородов.", "quote": "- there is an commercial volume of recoverable hydrocarbon reserves", "unit": "u127-05", "page": 127, "by": "model", "verified": true}, {"id": "archie-water-saturation.c14", "kind": "observation", "text": "В источнике присутствуют технологические метки страниц 115 и 116.", "quote": "115 116", "unit": "u126-21", "page": 126, "by": "model", "verified": false}], "term_ids": ["t-water-saturation-of-the-uninvaded-zone-sw", "t-true-formation-resistivity-rt", "t-resistivity-of-formation-water-rw", "t-tortuosity-factor-a", "t-cementation-exponent-m", "t-saturation-exponent-n"], "units": ["u126-13", "u126-14", "u126-15", "u126-16", "u126-17", "u126-18", "u126-19", "u126-20", "u126-21", "u127-02", "u127-03", "u127-04", "u127-05"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "asquith.flushed-zone-saturation", "order": 4, "part_id": "p3", "minutes": 3, "title": "Водонасыщенность промытой зоны и подвижность углеводородов", "book_title": "ARCHIE WATER SATURATIONS: S_W AND S_XO", "pages": [127, 127], "difficulty": {"primary": "И", "secondary": "М"}, "threshold": false, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». Текст содержит формулу и логические условия для оценки подвижности флюидов, что удобно для изучения через структурированные блоки и формульный аппарат.", "scene_template": "tool-in-well"}, "summary": [{"text": "Водонасыщенность промытой зоны S_xo рассчитывается по формуле Арчи, где вместо сопротивления воды и пласта используются сопротивление фильтрата бурового раствора и сопротивление промытой зоны.", "claims": ["flushed-zone-saturation.c1"], "page": 127, "by": "model"}, {"text": "Сравнение S_xo с общей водонасыщенностью S_w служит индикатором подвижности углеводородов, показывая их вытеснение буровым раствором.", "claims": ["flushed-zone-saturation.c2"], "page": 127, "by": "model"}], "how_it_works": [{"text": "Водонасыщенность промытой зоны S_xo базируется на уравнении Арчи с заменой двух переменных.", "claims": ["flushed-zone-saturation.c1"], "page": 127, "by": "model"}, {"text": "Вместо удельного сопротивления пластовой воды R_w применяется удельное сопротивление фильтрата бурового раствора R_mf.", "claims": ["flushed-zone-saturation.c3"], "page": 127, "by": "model"}, {"text": "Вместо удельного сопротивления нетронутой зоны R_t используется удельное сопротивление промытой зоны R_xo.", "claims": ["flushed-zone-saturation.c4"], "page": 127, "by": "model"}, {"text": "Для расчета S_xo используется формула 7.2, включающая коэффициент извилистости a, пористость phi, показатель цементации m и показатель насыщения n.", "claims": ["flushed-zone-saturation.c5"], "page": 127, "by": "model"}, {"text": "R_mf измеряется при пластовой температуре.", "claims": ["flushed-zone-saturation.c6"], "page": 127, "by": "model"}, {"text": "R_xo определяется приборами очень мелкофокусного чтения, такими как Laterolog-8, microspherically focused log или microlaterolog.", "claims": ["flushed-zone-saturation.c7"], "page": 127, "by": "model"}, {"text": "Если значение S_xo значительно превышает S_w, это указывает на то, что углеводороды вблизи скважины были вытеснены буровым раствором.", "claims": ["flushed-zone-saturation.c2"], "page": 127, "by": "model"}], "steps": [{"text": "Подставить в формулу Арчи R_mf вместо R_w и R_xo вместо R_t.", "claims": ["flushed-zone-saturation.c1", "flushed-zone-saturation.c3", "flushed-zone-saturation.c4"], "page": 127, "by": "model"}, {"text": "Вычислить S_xo по формуле 7.2 с учетом пористости, коэффициента извилистости и степенных коэффициентов.", "claims": ["flushed-zone-saturation.c5"], "page": 127, "by": "model"}, {"text": "Сопоставить полученное значение S_xo со значением S_w для оценки подвижности углеводородов.", "claims": ["flushed-zone-saturation.c2"], "page": 127, "by": "model"}], "examples": [], "numbers": [{"text": "Формула 7.2 определяет расчет водонасыщенности промытой зоны S_xo.", "claims": ["flushed-zone-saturation.c5"], "page": 127, "by": "model"}], "formulas": [{"latex": "S_{xo} = \\left( \\frac{a \\times R_{mf}}{R_{xo} \\times \\phi^m} \\right)^{\\frac{1}{n}}", "page": 127, "vars": [{"sym": "S_{xo}", "meaning": "водонасыщенность промытой зоны", "unit": "u127-09"}, {"sym": "a", "meaning": "коэффициент извилистости", "unit": "u127-13"}, {"sym": "R_{mf}", "meaning": "удельное сопротивление фильтрата бурового раствора при пластовой температуре", "unit": "u127-10"}, {"sym": "R_{xo}", "meaning": "удельное сопротивление промытой зоны по данным мелкофокусных приборов", "unit": "u127-11"}, {"sym": "\\phi", "meaning": "пористость", "unit": "u127-12"}, {"sym": "m", "meaning": "индекс цементации", "unit": "u127-14"}, {"sym": "n", "meaning": "показатель насыщения", "unit": "u127-15"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Значения сопротивления фильтрата бурового раствора R_mf, мелкофокусного сопротивления R_xo, пористости phi, коэффициента извилистости a, показателей m и n.", "output": "Водонасыщенность промытой зоны S_xo и оценка подвижности углеводородов.", "breaks": [{"text": "При некорректном определении R_mf или R_xo расчет S_xo и оценка подвижности углеводородов будут ошибочными.", "claims": ["flushed-zone-saturation.c3", "flushed-zone-saturation.c4", "flushed-zone-saturation.c7"], "page": 127, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Сравнение S_xo и S_w в анализе данных можно реализовать как пороговое решающее правило для поиска мобильных флюидов.", "claims": ["flushed-zone-saturation.c2"], "page": 127, "by": "model"}]}, "analogy": {"text": "Расчет S_xo через замену параметров в базовой формуле похож на применение нормализованных фичей в модели машинного обучения, где базовый пайплайн переиспользуется с подменкой инпут-метрик.", "breaks_where": "Физические законы фильтрации и электропроводности жестко детерминированы, в отличие от эвристик машинного обучения."}, "now_practice": [], "layers": {"mechanism": [{"text": "Замена параметров R_w на R_mf и R_t на R_xo позволяет адаптировать формулу Арчи для зоны проникновения бурового раствора.", "claims": ["flushed-zone-saturation.c1", "flushed-zone-saturation.c3", "flushed-zone-saturation.c4"], "page": 127, "by": "model"}], "practice": [{"text": "Измерение R_xo выполняется специальными мелкофокусными приборами (Laterolog-8, MSFL, microlaterolog).", "claims": ["flushed-zone-saturation.c7"], "page": 127, "by": "model"}], "nuances": [{"text": "R_mf берется обязательно при пластовой температуре.", "claims": ["flushed-zone-saturation.c6"], "page": 127, "by": "model"}], "deeper": [{"text": "Превышение S_xo над S_w используется как индикатор подвижности углеводородов, вытесненных фильтратом.", "claims": ["flushed-zone-saturation.c2"], "page": 127, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.flushed-zone-saturation.ill1", "class": "B", "src": "media/asquith.flushed-zone-saturation-steps.svg", "alt": "Порядок действий по тексту автора: Водонасыщенность промытой зоны и подвижность углеводородов", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.archie-water-saturation", "type": "prerequisite"}], "claims": [{"id": "flushed-zone-saturation.c1", "kind": "observation", "text": "Водонасыщенность промытой зоны S_xo базируется на уравнении Арчи с заменой R_w на R_mf и R_t на R_xo.", "quote": "Water saturation of a formation's flushed zone ($S_{xo}$) is also based on the Archie equation, but two variables are changed: mud filtrate resistivity ($R_{mf}$) in place of formation water resistivity ($R_w$) and flushed zone resistivity ($R_{xo}$) in place of uninvaded zone resistivity ($R_t$).", "unit": "u127-06", "page": 127, "by": "model", "verified": true}, {"id": "flushed-zone-saturation.c2", "kind": "observation", "text": "S_xo может использоваться как индикатор подвижности углеводородов при сравнении с S_w.", "quote": "Water saturation of the flushed zone ($S_{xo}$) can be used as an *indicator of hydrocarbon moveability*. For example, if the value of $S_{xo}$ is much larger than $S_w$, then hydrocarbons in the flushed zone have probably been moved or flushed out of the zone nearest the borehole by the invading drilling fluids ($R_{mf}$).", "unit": "u127-16", "page": 127, "by": "model", "verified": true}, {"id": "flushed-zone-saturation.c3", "kind": "observation", "text": "Вместо удельного сопротивления пластовой воды R_w используется удельное сопротивление фильтрата бурового раствора R_mf.", "quote": "mud filtrate resistivity ($R_{mf}$) in place of formation water resistivity ($R_w$)", "unit": "u127-06", "page": 127, "by": "model", "verified": true}, {"id": "flushed-zone-saturation.c4", "kind": "observation", "text": "Вместо удельного сопротивления нетронутой зоны R_t используется удельное сопротивление промытой зоны R_xo.", "quote": "flushed zone resistivity ($R_{xo}$) in place of uninvaded zone resistivity ($R_t$)", "unit": "u127-06", "page": 127, "by": "model", "verified": true}, {"id": "flushed-zone-saturation.c5", "kind": "observation", "text": "Формула 7.2 определяет расчет S_xo через переменные a, R_mf, R_xo, phi, m и n.", "quote": "S_{xo} = \\left( \\frac{a \\times R_{mf}}{R_{xo} \\times \\phi^m} \\right)^{\\frac{1}{n}}", "unit": "u127-07", "page": 127, "by": "model", "verified": false}, {"id": "flushed-zone-saturation.c6", "kind": "observation", "text": "R_mf — это сопротивление фильтрата бурового раствора при пластовой температуре.", "quote": "R_{mf} =$ resistivity of the mud filtrate at formation temperature", "unit": "u127-10", "page": 127, "by": "model", "verified": true}, {"id": "flushed-zone-saturation.c7", "kind": "observation", "text": "R_xo измеряется очень мелкофокусными приборами вроде Laterolog-8, MSFL или microlaterolog.", "quote": "R_{xo} =$ shallow resistivity from a very shallow reading device, such as laterolog-8, microspherically focused log, or microlaterolog", "unit": "u127-11", "page": 127, "by": "model", "verified": true}], "term_ids": ["t-flushed-zone-water-saturation-s-xo", "t-mud-filtrate-resistivity-r-mf", "t-flushed-zone-resistivity-r-xo"], "units": ["u127-06", "u127-07", "u127-08", "u127-09", "u127-10", "u127-11", "u127-12", "u127-13", "u127-14", "u127-15", "u127-16"], "video_criteria": ["invisible_visible", "cause_effect"], "fallback": false}, {"id": "asquith.ratio-method", "order": 5, "part_id": "p4", "minutes": 6, "title": "Метод отношений для оценки подвижных углеводородов", "book_title": "Ratio Method", "pages": [127, 128], "difficulty": {"primary": "Пр", "secondary": "И"}, "threshold": false, "format": {"primary": "long", "reason": "Тип «процедура»; критерии видеоёмкости: цепочка «причина → следствие», скачок масштаба. Текст и формулы оптимальны для объяснения математического вывода метода отношений и логики проверки качества данных.", "scene_template": "step-flow"}, "summary": [{"text": "Метод отношений позволяет оценивать подвижные углеводороды и водонасыщенность по сопротивлениям без необходимости знать пористость пласта.", "claims": ["ratio-method.c1"], "page": 127, "by": "model"}, {"text": "Путем деления формулы Арчи для непромытой зоны на формулу для промытой зоны коэффициент пористости сокращается, что упрощает интерпретацию.", "claims": ["ratio-method.c2"], "page": 127, "by": "model"}], "how_it_works": [{"text": "Метод идентифицирует углеводороды по разнице между водонасыщенностью в промытой зоне ($S_{xo}$) и в непромытой зоне ($S_w$).", "claims": ["ratio-method.c3"], "page": 127, "by": "model"}, {"text": "При делении уравнения Арчи для непромытой зоны (уравнение 7.1) на формулу для промытой зоны (уравнение 7.2) получается отношение квадратов водонасыщенностей.", "claims": ["ratio-method.c4"], "page": 127, "by": "model"}, {"text": "Формирующий фактор (коэффициент пористости) сокращается, так как используется одинаковый для расчета $S_w$ и $S_{xo}$.", "claims": ["ratio-method.c5"], "page": 127, "by": "model"}, {"text": "Индекс подвижных углеводородов рассчитывается через отношение сопротивлений глубокого и мелководного каротажа и сопротивлений фильтрата и воды.", "claims": ["ratio-method.c6"], "page": 127, "by": "model"}, {"text": "Показатель цементации ($n$) в методе принимается равным 2.0.", "claims": ["ratio-method.c7"], "page": 127, "by": "model"}, {"text": "Если отношение $S_w/S_{xo}$ больше или равно 1.0, углеводороды при вторжении не смещались.", "claims": ["ratio-method.c8"], "page": 127, "by": "model"}, {"text": "Если отношение $S_w/S_{xo}$ меньше 0.7 для песчаников или меньше 0.6 для карбонатов, фиксируются подвижные углеводороды.", "claims": ["ratio-method.c9"], "page": 127, "by": "model"}, {"text": "Для расчета водонасыщенности методом отношений ($S_{wr}$) используется связь $S_{xo} = (S_w)^{1/2}$, что дает показатель мощности 5/8 или 0.625.", "claims": ["ratio-method.c10"], "page": 128, "by": "model"}, {"text": "Сравнение $S_{wa}$ (по формуле Арчи) и $S_{wr}$ (методом отношений) позволяет диагностировать тип профиля вторжения (ступенчатый, переходный, кольцевой).", "claims": ["ratio-method.c11"], "page": 128, "by": "model"}], "steps": [{"text": "Определить сопротивление промытой зоны ($R_{xo}$), истинное сопротивление ($R_t$), сопротивление фильтрата ($R_{mf}$) и воды ($R_w$).", "claims": ["ratio-method.c12"], "page": 127, "by": "model"}, {"text": "Вычислить индекс подвижных углеводородов $S_w/S_{xo}$ по формуле 7.4.", "claims": ["ratio-method.c13"], "page": 127, "by": "model"}, {"text": "Рассчитать водонасыщенность методом отношений $S_{wr}$ с использованием степенного коэффициента 0.625.", "claims": ["ratio-method.c14"], "page": 128, "by": "model"}, {"text": "Сравнить полученные значения $S_{wa}$ и $S_{wr}$ для проверки характера вторжения и необходимости коррекции.", "claims": ["ratio-method.c15"], "page": 128, "by": "model"}], "examples": [], "numbers": [{"text": "Показатель цементации $n$ принимается равным 2.0.", "claims": ["ratio-method.c16"], "page": 127, "by": "model"}, {"text": "Порог для песчаников составляет 0.7, а для карбонатов — 0.6.", "claims": ["ratio-method.c17"], "page": 127, "by": "model"}, {"text": "Показатель степени в итоговой формуле водонасыщенности равен 5/8 или 0.625.", "claims": ["ratio-method.c18"], "page": 128, "by": "model"}], "formulas": [{"latex": "\\left( \\frac{S_w}{S_{xo}} \\right)^2 = \\frac{R_{xo} / R_t}{R_{mf} / R_w}", "page": 127, "vars": [{"sym": "S_w", "meaning": "water saturation in the uninvaded zone", "unit": "u127-21"}, {"sym": "S_{xo}", "meaning": "water saturation in the flushed zone", "unit": "u127-22"}, {"sym": "R_{xo}", "meaning": "formation's shallow resistivity", "unit": "u127-23"}, {"sym": "R_t", "meaning": "true formation resistivity", "unit": "u127-24"}, {"sym": "R_{mf}", "meaning": "resistivity of the mud filtrate", "unit": "u127-25"}, {"sym": "R_w", "meaning": "resistivity of formation water", "unit": "u127-26"}]}, {"latex": "\\frac{S_w}{S_{xo}} = \\left( \\frac{R_{xo} / R_t}{R_{mf} / R_w} \\right)^{\\frac{1}{2}}", "page": 127, "vars": [{"sym": "S_w/S_{xo}", "meaning": "moveable hydrocarbon index", "unit": "u127-31"}]}, {"latex": "S_{xo} = (S_w)^{\\frac{1}{2}}", "page": 128, "vars": [{"sym": "S_{xo}", "meaning": "water saturation of the flushed zone", "unit": "u128-05"}, {"sym": "S_w", "meaning": "water saturation of the uninvaded zone", "unit": "u128-06"}]}, {"latex": "S_{wr} = \\left( \\frac{R_{xo} / R_t}{R_{mf} / R_w} \\right)^{\\frac{5}{8}}", "page": 128, "vars": [{"sym": "S_{wr}", "meaning": "moveable hydrocarbon index", "unit": "u128-12"}]}, {"latex": "(S_w)_{COR} = S_{wa} \\times \\left( \\frac{S_{wa}}{S_{wr}} \\right)^{0.25}", "page": 128, "vars": [{"sym": "(S_w)_{COR}", "meaning": "corrected water saturation of the uninvaded zone", "unit": "u128-24"}, {"sym": "S_{wa}", "meaning": "water saturation of the uninvaded zone (Archie method)", "unit": "u128-25"}, {"sym": "S_{wr}", "meaning": "water saturation of the uninvaded zone (ratio method)", "unit": "u128-26"}]}], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть, а для оценки насыщения обязательно нужна точная пористость.", "right": [{"text": "Метод отношений позволяет оценивать водонасыщенность и подвижность углеводородов без знания пористости за счет математического сокращения коэффициента пористости.", "claims": ["ratio-method.c19"], "page": 127, "by": "model"}]}, "data_meaning": {"input": "Данные глубокого ($R_t$) и мелководного ($R_{xo}$) электрического каротажа, а также удельные сопротивления фильтрата бурового раствора ($R_{mf}$) и пластовой воды ($R_w$).", "output": "Индекс подвижных углеводородов ($S_w/S_{xo}$) и водонасыщенность методом отношений ($S_{wr}$), позволяющие выявить зоны с подвижной нефтью.", "breaks": [{"text": "Метод может давать искажения при сложных профилях вторжения (например, кольцевом типе) или влиянии соседних высокоомных пластов, что требует коррекции.", "claims": ["ratio-method.c20"], "page": 128, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Соотношение сопротивлений в формулах можно рассматривать как признак для классификации типа насыщения в автоматизированных пайплайнах обработки данных.", "claims": ["ratio-method.c21"], "page": 127, "by": "model"}]}, "analogy": {"text": "Формула отношения сопротивлений похожа на нормирование признаков в машинном обучении, где деление на базовую величину позволяет избавиться от общего масштабного коэффициента (пористости).", "breaks_where": "Аналогия перестает работать, когда физические процессы вторжения фильтрата начинают нарушать допущения о ступенчатом контакте фаз в пласте."}, "now_practice": [{"text": "Сегодня расчеты по формулам отношений часто интегрированы в современные программные комплексы петрофизической интерпретации в виде автоматизированных расчетных модулей.", "claims": ["ratio-method.c22"], "page": 128, "by": "model"}], "layers": {"mechanism": [{"text": "Исключение пористости достигается за счет деления уравнений Арчи для разных зон пласта, где коэффициент пористости сокращается.", "claims": ["ratio-method.c23"], "page": 127, "by": "model"}], "practice": [{"text": "Сравнение $S_{wa}$ и $S_{wr}$ служит инструментом контроля качества исходных данных каротажа и модели вторжения фильтрата.", "claims": ["ratio-method.c24"], "page": 128, "by": "model"}], "nuances": [{"text": "Пороги для определения подвижных углеводородов различаются для литологии: 0.7 для песчаников и 0.6 для карбонатов.", "claims": ["ratio-method.c25"], "page": 127, "by": "model"}], "deeper": [{"text": "При несовпадении $S_{wa}$ и $S_{wr}$ применяются эмпирические формулы коррекции, учитывающие тип профиля вторжения.", "claims": ["ratio-method.c26"], "page": 128, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.ratio-method.ill1", "class": "B", "src": "media/asquith.ratio-method-steps.svg", "alt": "Порядок действий по тексту автора: Метод отношений для оценки подвижных углеводородов", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.ratio-method.ill2", "class": "B", "src": "media/asquith.ratio-method-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Метод отношений для оценки подвижных углеводородов", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.flushed-zone-saturation", "type": "prerequisite"}], "claims": [{"id": "ratio-method.c1", "kind": "observation", "text": "Метод отношений оценивает подвижные углеводороды без знания пористости.", "quote": "without knowing porosity. Therefore, a geologist can still derive useful formation evaluation log parameters even though porosity logs are unavailable.", "unit": "u127-27", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c2", "kind": "observation", "text": "Формирующий фактор сокращается при делении формул.", "quote": "the formation factor (F = a/\\phi^m) is cancelled out of the equation because the same formation factor is used to calculate both Sw and Sxo.", "unit": "u127-27", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c3", "kind": "observation", "text": "Метод идентифицирует углеводороды по разнице водонасыщенностей.", "quote": "The ratio method identifies hydrocarbons from the difference between water saturations in the flushed zone (Sxo) and the uninvaded zone (Sw).", "unit": "u127-18", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c4", "kind": "observation", "text": "Уравнение 7.3 получается делением уравнения Арчи для непромытой зоны на промытую.", "quote": "When the uninvaded zone form of Archie's equation (Equation 7.1) is divided by the flushed zone form (Equation 7.2), the following results:", "unit": "u127-18", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c5", "kind": "observation", "text": "Формирующий фактор сокращается.", "quote": "the formation factor (F = a/\\phi^m) is cancelled out of the equation because the same formation factor is used to calculate both Sw and Sxo.", "unit": "u127-27", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c6", "kind": "observation", "text": "Индекс подвижных углеводородов определяется через отношение сопротивлений.", "quote": "from the ratio (Rxo/Rt)/(Rmf/Rw), the geologist can determine a value for both the moveable hydrocarbon index (Sw/Sxo) and water saturation by the ratio method without knowing porosity.", "unit": "u127-27", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c7", "kind": "assumption", "text": "Показатель цементации принимается равным 2.0.", "quote": "The cementation exponent (n) is assumed to be 2.0", "unit": "u127-36", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c8", "kind": "observation", "text": "Если отношение больше или равно 1.0, углеводороды не смещались.", "quote": "If the ratio Sw/Sxo is equal to or greater than 1.0, then hydrocarbons were not moved during invasion.", "unit": "u127-37", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c9", "kind": "observation", "text": "Пороги для подвижных углеводородов составляют 0.7 для песчаников и 0.6 для карбонатов.", "quote": "Whenever the ratio Sw/Sxo is less than 0.7 for sandstones or less than 0.6 for carbonates, moveable hydrocarbons are indicated", "unit": "u127-37", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c10", "kind": "observation", "text": "Водонасыщенность методом отношений рассчитывается через степень 5/8 или 0.625.", "quote": "Swr = \\left( \\frac{R_{xo} / R_t}{R_{mf} / R_w} \\right)^{\\frac{5}{8}}", "unit": "u128-08", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c11", "kind": "inference", "text": "Сравнение Swa и Swr позволяет диагностировать тип профиля вторжения.", "quote": "1. If $S_{wa} \\sim S_{wr}$, the assumption of a step-contact invasion profile is indicated to be correct, and all values determined ($S_w$, $R_t$, $R_{xo}$, and $d_t$) are correct.", "unit": "u128-18", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c12", "kind": "observation", "text": "Необходимы параметры Rxo, Rt, Rmf, Rw.", "quote": "$R_{xo} =$ formation's shallow resistivity from a measurement such as laterolog-8, microspherically focused log, or microlaterolog", "unit": "u127-23", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c13", "kind": "observation", "text": "Индекс подвижных углеводородов рассчитывается по формуле 7.4.", "quote": "The moveable hydrocarbon index by the ratio method is:", "unit": "u127-28", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c14", "kind": "observation", "text": "Водонасыщенность рассчитывается по формуле 7.6 или 7.7.", "quote": "Swr = \\left( \\frac{R_{xo} / R_t}{R_{mf} / R_w} \\right)^{\\frac{5}{8}}", "unit": "u128-08", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c15", "kind": "inference", "text": "Сравнение Swa и Swr проверяет корректность исходных допущений.", "quote": "To use the ratio method in an interpretation process, the water saturation of the uninvaded zone should be calculated by both the Archie equation (Swa) and the ratio method (Swr).", "unit": "u128-17", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c16", "kind": "assumption", "text": "Показатель цементации n равен 2.0.", "quote": "The cementation exponent (n) is assumed to be 2.0", "unit": "u127-36", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c17", "kind": "observation", "text": "Пороговые значения составляют 0.7 и 0.6.", "quote": "less than 0.7 for sandstones or less than 0.6 for carbonates", "unit": "u127-37", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c18", "kind": "observation", "text": "Показатель степени равен 5/8 или 0.625.", "quote": "$$S_{wr} = \\left( \\frac{R_{xo} / R_t}{R_{mf} / R_w} \\right)^{\\frac{5}{8}} \\tag{7.6}$$", "unit": "u128-08", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c19", "kind": "inference", "text": "Метод позволяет оценить водонасыщенность без пористости.", "quote": "determine a value for both the moveable hydrocarbon index (Sw/Sxo) and water saturation by the ratio method without knowing porosity.", "unit": "u127-27", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c20", "kind": "observation", "text": "При Swa \u003c Swr возможны проблемы с Rxo или Rt из-за соседних пластов или типа вторжения.", "quote": "If Swa \u003c Swr, then the value for Rxo/Rt is too high. Rxo is too high because of the effect of adjacent, high-resistivity beds", "unit": "u128-20", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c21", "kind": "assumption", "text": "Гипотеза: Отношение сопротивлений может использоваться как ML-признак.", "quote": "where the geologist can determine a value for both the moveable hydrocarbon index", "unit": "u127-27", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c22", "kind": "observation", "text": "Метод применяется в процессе интерпретации данных.", "quote": "To use the ratio method in an interpretation process", "unit": "u128-17", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c23", "kind": "observation", "text": "Коэффициент пористости сокращается.", "quote": "the formation factor (F = a/\\phi^m) is cancelled out of the equation", "unit": "u127-27", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c24", "kind": "inference", "text": "Сравнение Swa и Swr проверяет корректность модели вторжения.", "quote": "the assumption of a step-contact invasion profile is indicated to be correct, and all values determined (Sw, Rt, Rxo, and dt) are correct.", "unit": "u128-18", "page": 128, "by": "model", "verified": true}, {"id": "ratio-method.c25", "kind": "observation", "text": "Пороги зависят от литологии пород.", "quote": "less than 0.7 for sandstones or less than 0.6 for carbonates", "unit": "u127-37", "page": 127, "by": "model", "verified": true}, {"id": "ratio-method.c26", "kind": "observation", "text": "Для коррекции используется уравнение 7.8.", "quote": "(Sw)COR = Swa \\times (Swa / Swr)^{0.25}", "unit": "u128-22", "page": 128, "by": "model", "verified": true}], "term_ids": ["t-moveable-hydrocarbon-index", "t-flushed-zone", "t-uninvaded-zone"], "units": ["u127-17", "u127-18", "u127-19", "u127-20", "u127-21", "u127-22", "u127-23", "u127-24", "u127-25", "u127-26", "u127-27", "u127-28", "u127-29", "u127-30", "u127-31", "u127-32", "u127-33", "u127-34", "u127-35", "u127-36", "u127-37", "u128-02", "u128-03", "u128-04", "u128-05", "u128-06", "u128-07", "u128-08", "u128-09", "u128-10", "u128-11", "u128-12", "u128-13", "u128-14", "u128-15", "u128-16", "u128-17", "u128-18", "u128-19", "u128-20", "u128-21", "u128-22", "u128-23", "u128-24", "u128-25", "u128-26", "u128-27"], "video_criteria": ["cause_effect", "scale_jump"], "fallback": false}, {"id": "asquith.quick-look-rxo-rt", "order": 6, "part_id": "p5", "minutes": 6, "title": "Экспресс-метод анализа отношения сопротивлений Rxo/Rt и ПС", "book_title": "QUICK-LOOK METHODS", "pages": [128, 129], "difficulty": {"primary": "Р", "secondary": "И"}, "threshold": false, "format": {"primary": "cards", "reason": "Тип «распознавание»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». Текст оптимален для объяснения последовательности шагов экспресс-анализа каротажа и математических выкладок формул.", "scene_template": "feature-gallery"}, "summary": [{"text": "Экспресс-методы служат индикаторами для поиска возможных зон скопления углеводородов, требующих дальнейшего изучения.", "claims": ["quick-look-rxo-rt.c1"], "page": 128, "by": "model"}, {"text": "Один из методов основан на сравнении кривой отношения сопротивлений промытой и неизведанной зон к кривой спонтанной поляризации.", "claims": ["quick-look-rxo-rt.c2"], "page": 128, "by": "model"}], "how_it_works": [{"text": "Экспресс-методы помогают геологам быстро находить перспективные углеводородные зоны для детального анализа.", "claims": ["quick-look-rxo-rt.c1"], "page": 128, "by": "model"}, {"text": "Рассматриваются четыре экспресс-метода: отношение сопротивлений Rxo/Rt, кажущееся удельное сопротивление воды Rwa, пористость по проводимости и сопротивление чисто водяного пласта Ro.", "claims": ["quick-look-rxo-rt.c3"], "page": 128, "by": "model"}, {"text": "Метод Rxo/Rt сопоставляет кривую отношения сопротивлений с кривой спонтанной поляризации на планшете каротажа.", "claims": ["quick-look-rxo-rt.c2"], "page": 128, "by": "model"}, {"text": "Сначала вычисляется отношение Rxo/Rt по данным глубоких и мелкопогруженных измерений сопротивления, затем оно накладывается в тот же трек с кривой спонтанной поляризации для поиска закономерностей.", "claims": ["quick-look-rxo-rt.c4"], "page": 128, "by": "model"}, {"text": "В глинах отношение Rxo/Rt держится относительно стабильно, как и спонтанная поляризация, и обычно близко к 1.", "claims": ["quick-look-rxo-rt.c5"], "page": 128, "by": "model"}, {"text": "В водоносном интервале отношение Rxo/Rt повторяет поведение кривой спонтанной поляризации.", "claims": ["quick-look-rxo-rt.c6"], "page": 128, "by": "model"}, {"text": "В нефтегазонасыщенном интервале отношение Rxo/Rt отклоняется от спонтанной поляризации, уходя вправо при нормальной отрицательной спонтанной поляризации из-за роста Rt.", "claims": ["quick-look-rxo-rt.c7"], "page": 128, "by": "model"}, {"text": "Теоретическая база метода опирается на уравнение связи спонтанной поляризации с сопротивлениями фильтрата и пластовой воды SP = -K * log(Rmf / Rw).", "claims": ["quick-look-rxo-rt.c8"], "page": 129, "by": "model"}, {"text": "Для промытой зоны Rxo = F * Rmf, а для зоны неизведанной водоносной Ro = F * Rw.", "claims": ["quick-look-rxo-rt.c9"], "page": 129, "by": "model"}, {"text": "Подстановка выражений для Rmf и Rw дает формулу SP = -K * log(Rxo / Ro).", "claims": ["quick-look-rxo-rt.c10"], "page": 129, "by": "model"}, {"text": "Поскольку Ro представляет частный случай Rt для водоносной зоны, в общем случае Rt заменяет Ro.", "claims": ["quick-look-rxo-rt.c11"], "page": 129, "by": "model"}, {"text": "В водоносных пластах Rxo/Rt следует за спонтанной поляризацией, а в нефтегазоносных Rxo/Rt падает из-за роста Rt, расходясь с кривой спонтанной поляризации.", "claims": ["quick-look-rxo-rt.c12"], "page": 129, "by": "model"}, {"text": "Для Rxo берут мелкопогруженные измерения вроде микросферического каротажа или микробокового каротажа, а для Rt — глубокие вроде глубокого индукционного или бокового каротажа.", "claims": ["quick-look-rxo-rt.c13"], "page": 129, "by": "model"}, {"text": "На практике при формировании кривой в процессе каротажа измерения обычно используют без внесения поправок за окружающую среду.", "claims": ["quick-look-rxo-rt.c14"], "page": 129, "by": "model"}], "steps": [{"text": "Рассчитать отношение Rxo/Rt по данным глубоких и мелкопогруженных измерений сопротивления.", "claims": ["quick-look-rxo-rt.c15"], "page": 128, "by": "model"}, {"text": "Построить полученное отношение в том же треке, где отображается спонтанная поляризация.", "claims": ["quick-look-rxo-rt.c16"], "page": 128, "by": "model"}, {"text": "Проанализировать паттерны поведения кривых для глинистых, водоносных и нефтегазоносных интервалов.", "claims": ["quick-look-rxo-rt.c17"], "page": 128, "by": "model"}], "examples": [], "numbers": [{"text": "Перечислены четыре экспресс-метода анализа.", "claims": ["quick-look-rxo-rt.c3"], "page": 128, "by": "model"}], "formulas": [{"latex": "SP = -K \\times \\log\\left(\\frac{R_{mf}}{R_w}\\right)", "page": 129, "vars": [{"sym": "SP", "meaning": "спонтанная поляризация", "unit": "u129-05"}, {"sym": "K", "meaning": "константа", "unit": "u129-05"}, {"sym": "R_{mf}", "meaning": "удельное сопротивление фильтрата бурового раствора", "unit": "u129-05"}, {"sym": "R_w", "meaning": "удельное сопротивление пластовой воды", "unit": "u129-05"}]}, {"latex": "R_{xo} = F \\times R_{mf}", "page": 129, "vars": [{"sym": "R_{xo}", "meaning": "удельное сопротивление промытой зоны", "unit": "u129-07"}, {"sym": "F", "meaning": "коэффициент пористости/формирования", "unit": "u129-07"}, {"sym": "R_{mf}", "meaning": "удельное сопротивление фильтрата бурового раствора", "unit": "u129-07"}]}, {"latex": "R_o = F \\times R_w", "page": 129, "vars": [{"sym": "R_o", "meaning": "удельное сопротивление в неизведанной водоносной зоне", "unit": "u129-08"}, {"sym": "F", "meaning": "коэффициент", "unit": "u129-08"}, {"sym": "R_w", "meaning": "удельное сопротивление пластовой воды", "unit": "u129-08"}]}, {"latex": "SP = -K \\times \\log\\left(\\frac{R_{xo}}{R_o}\\right)", "page": 129, "vars": [{"sym": "SP", "meaning": "спонтанная поляризация", "unit": "u129-10"}, {"sym": "K", "meaning": "константа", "unit": "u129-10"}, {"sym": "R_{xo}", "meaning": "удельное сопротивление промытой зоны", "unit": "u129-10"}, {"sym": "R_o", "meaning": "удельное сопротивление неизведанной водоносной зоны", "unit": "u129-10"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Кривые глубокого и мелкопогруженного измерения сопротивления, а также кривая спонтанной поляризации (SP).", "output": "Индикаторы (флаги) возможных зон скопления углеводородов на планшете каротажа.", "breaks": [{"text": "Применяются измерения без поправок за окружающую среду, что может снижать точность при сложных условиях в скважине.", "claims": ["quick-look-rxo-rt.c14"], "page": 129, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Сопоставление кривых Rxo/Rt и SP на планшете можно автоматизировать как эвристическое правило классификации аномалий.", "claims": ["quick-look-rxo-rt.c2"], "page": 128, "by": "model"}]}, "analogy": {"text": "Сравнение двух метрик на одном графике похоже на мониторинг расхождения двух коррелирующих системных метрик в логах (например, RPS и задержки), где отклонение тренда сигнализирует об инциденте.", "breaks_where": "Физические законы фильтрации флюидов и электромагнитного отклика пород гораздо строже детерминированы, чем случайные паттерны ИТ-логов."}, "now_practice": [{"text": "Сегодня расчет отношений сопротивлений и сопоставление с кривыми спонтанной поляризации обычно выполняется автоматически в специализированном ПО интерпретации данных каротажа.", "claims": ["quick-look-rxo-rt.c14"], "page": 129, "by": "model"}], "layers": {"mechanism": [{"text": "Метод основан на математическом объединении уравнений спонтанной поляризации и формул для промытой и неизведанной зон через коэффициент F.", "claims": ["quick-look-rxo-rt.c8", "quick-look-rxo-rt.c9", "quick-look-rxo-rt.c10"], "page": 129, "by": "model"}], "practice": [{"text": "Для расчета используют данные микросферического или микробокового каротажа для мелкопогруженной зоны и глубокого индукционного или бокового каротажа для глубокой зоны.", "claims": ["quick-look-rxo-rt.c13"], "page": 129, "by": "model"}], "nuances": [{"text": "В глинах отношение Rxo/Rt сохраняет постоянное значение около 1, в воде следует за спонтанной поляризацией, а в углеводородах отклоняется из-за роста Rt.", "claims": ["quick-look-rxo-rt.c5", "quick-look-rxo-rt.c6", "quick-look-rxo-rt.c7", "quick-look-rxo-rt.c12"], "page": 128, "by": "model"}], "deeper": [{"text": "Замена Ro на Rt позволяет применять соотношение для общего случая неизведанного пласта.", "claims": ["quick-look-rxo-rt.c11"], "page": 129, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.quick-look-rxo-rt.ill1", "class": "B", "src": "media/asquith.quick-look-rxo-rt-steps.svg", "alt": "Порядок действий по тексту автора: Экспресс-метод анализа отношения сопротивлений Rxo/Rt и ПС", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.quick-look-rxo-rt.ill2", "class": "B", "src": "media/asquith.quick-look-rxo-rt-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Экспресс-метод анализа отношения сопротивлений Rxo/Rt и ПС", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.flushed-zone-saturation", "type": "prerequisite"}], "claims": [{"id": "quick-look-rxo-rt.c1", "kind": "observation", "text": "Экспресс-методы помогают геологам находить перспективные зоны углеводородов для дальнейшего изучения.", "quote": "Quick-look methods are helpful to the geologist because they provide flags, or indicators, that point to possible hydrocarbon zones requiring further investigation.", "unit": "u128-30", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c2", "kind": "observation", "text": "Метод Rxo/Rt основан на сравнении кривой отношения сопротивлений с кривой спонтанной поляризации.", "quote": "The $R_{xo}/R_t$ technique relies on the comparison of the resistivity ratio, plotted as a curve on the log display, to the SP curve.", "unit": "u128-33", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c3", "kind": "observation", "text": "Рассматриваются четыре экспресс-метода, включая Rxo/Rt, Rwa, пористость по проводимости и Ro.", "quote": "- $R_{xo}/R_t$\n- apparent water resistivity ($R_{wa}$)\n- conductivity-derived porosity\n- Wet resistivity ($R_o$)", "unit": "u128-31", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c4", "kind": "observation", "text": "Процедура включает расчет Rxo/Rt по глубоким и мелкопогруженным измерениям и построение отношения в треке со спонтанной поляризацией.", "quote": "1. Calculate the $R_{xo}/R_t$ ratio from the deep and shallow reading resistivity measurements; 2. Plot the ratio in the same track as the SP, and look for the following patterns.", "unit": "u128-35", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c5", "kind": "observation", "text": "В глинах отношение Rxo/Rt относительно постоянно и обычно близко к 1.", "quote": "1. In a shale, the ratio is relatively constant, like the SP, and usually close to 1.", "unit": "u128-37", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c6", "kind": "observation", "text": "В водоносной зоне отношение Rxo/Rt повторяет ход спонтанной поляризации.", "quote": "2. In a water-bearing zone, the $R_{xo}/R_t$ ratio tracks the SP.", "unit": "u128-37", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c7", "kind": "observation", "text": "В углеводородной зоне отношение Rxo/Rt отходит от спонтанной поляризации с отклонением вправо при нормальной отрицательной спонтанной поляризации.", "quote": "3. In a hydrocarbon-bearing zone, the $R_{xo}/R_t$ ratio moves away from the SP [a deflection to the right for the case of a normal (negative) SP].", "unit": "u128-37", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c8", "kind": "observation", "text": "Уравнение связи спонтанной поляризации с сопротивлениями флюидов имеет вид SP = -K * log(Rmf / Rw).", "quote": "From Chapter 2, the equation relating the SP to fluid resistivities is: $$SP = -K \\times \\log\\left(\\frac{R_{mf}}{R_w}\\right) \\tag{7.9}$$", "unit": "u129-04", "page": 129, "by": "model", "verified": false}, {"id": "quick-look-rxo-rt.c9", "kind": "observation", "text": "Для водоносных зон Rxo = F * Rmf и Ro = F * Rw.", "quote": "$$R_{xo} = F \\times R_{mf} \\quad (\\text{flushed zone}) \\tag{7.10}$$", "unit": "u129-07", "page": 129, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c10", "kind": "observation", "text": "Подстановка Rmf и Rw в уравнение спонтанной поляризации дает SP = -K * log(Rxo / Ro).", "quote": "Solving Equations 7.2 and 7.3 for $R_{mf}$ and $R_w$ respectively, and substituting the results in Equation 7.1 yields:", "unit": "u129-09", "page": 129, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c11", "kind": "observation", "text": "Так как Ro является частным случаем Rt для водоносной зоны, Rt подставляется для общего случая.", "quote": "Since $R_o$ is just a special case of $R_t$ ($R_o$ is the resistivity in the undisturbed, water-bearing zone), $R_t$ can be substituted for $R_o$ for the more general case.", "unit": "u129-11", "page": 129, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c12", "kind": "observation", "text": "В воде Rxo/Rt следует за спонтанной поляризацией, а в углеводородах отношение падает из-за роста Rt.", "quote": "In water-bearing intervals, the $R_{xo}/R_t$ ratio parallels the response of the SP, and both curves move in the same direction from their respective baseline values. In a hydrocarbon-bearing interval, while the SP still responds to the differences in connate water and mud filtrate resistivities and moves accordingly, the $R_{xo}/R_t$ ratio decreases (because of increasing $R_t$) and the $R_{xo}/R_t$ curve moves away from the SP.", "unit": "u129-11", "page": 129, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c13", "kind": "observation", "text": "Кривая Rxo берется из мелкопогруженных измерений, а Rt из глубоких.", "quote": "The $R_{xo}$ curve usually used for the ratio is derived from a shallow-reading measurement, such as a microspherically focused log or a microlaterolog. The $R_t$ curve is derived from a deep-reading measurement such as the deep induction log or deep laterolog.", "unit": "u129-12", "page": 129, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c14", "kind": "observation", "text": "На практике измерения обычно используют без поправок за окружающую среду.", "quote": "In practice, especially when the ratio is calculated and displayed as part of the logging job, the measurements are normally used without any environmental corrections being applied.", "unit": "u129-12", "page": 129, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c15", "kind": "inference", "text": "Первым шагом рассчитывается отношение Rxo/Rt.", "quote": "1. Calculate the $R_{xo}/R_t$ ratio from the deep and shallow reading resistivity measurements;", "unit": "u128-35", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c16", "kind": "inference", "text": "Вторым шагом отношение строится в одном треке со спонтанной поляризацией.", "quote": "2. Plot the ratio in the same track as the SP, and look for the following patterns.", "unit": "u128-35", "page": 128, "by": "model", "verified": true}, {"id": "quick-look-rxo-rt.c17", "kind": "inference", "text": "Анализируются паттерны для глин, воды и углеводородов.", "quote": "1. In a shale, the ratio is relatively constant, like the SP, and usually close to 1. 2. In a water-bearing zone, the $R_{xo}/R_t$ ratio tracks the SP. 3. In a hydrocarbon-bearing zone, the $R_{xo}/R_t$ ratio moves away from the SP", "unit": "u128-37", "page": 128, "by": "model", "verified": true}], "term_ids": ["t-quick-look-method", "t-sp-spontaneous-potential", "t-uninvaded-zone-r-t"], "units": ["u128-28", "u128-29", "u128-30", "u128-31", "u128-32", "u128-33", "u128-34", "u128-35", "u128-36", "u128-37", "u129-03", "u129-04", "u129-05", "u129-06", "u129-07", "u129-08", "u129-09", "u129-10", "u129-11", "u129-12"], "video_criteria": ["invisible_visible", "cause_effect"], "fallback": false}, {"id": "asquith.apparent-water-resistivity", "order": 7, "part_id": "p6", "minutes": 8, "title": "Метод кажущегося удельного сопротивления воды (Rwa)", "book_title": "Apparent water resistivity (Rwa)", "pages": [129, 130], "difficulty": {"primary": "И", "secondary": "Н"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». Текст содержит формулы, алгоритм шагов и правила интерпретации, что оптимально для текстового учебного модуля с элементами справочника.", "scene_template": "tool-in-well"}, "summary": [{"text": "Метод кажущегося удельного сопротивления воды позволяет выявлять зоны с углеводородами и оценивать водонасыщенность путем сравнения расчетных значений Rwa.", "claims": ["apparent-water-resistivity.c1"], "page": 129, "by": "model"}, {"text": "Минимальное значение Rwa принимается за истинное сопротивление пластовой воды, а превышающие его значения указывают на нефть или газ.", "claims": ["apparent-water-resistivity.c2"], "page": 129, "by": "model"}], "how_it_works": [{"text": "Техника Rwa основана на сопоставлении расчетных значений сопротивления воды между интервалами в скважине в разных зонах или внутри одной зоны.", "claims": ["apparent-water-resistivity.c1"], "page": 129, "by": "model"}, {"text": "Предполагается, что минимальное значение Rwa является наилучшим приближением к истинному сопротивлению пластовой воды, а более высокие значения указывают на углеводороды.", "claims": ["apparent-water-resistivity.c2"], "page": 129, "by": "model"}, {"text": "Процедура включает расчет Rwa по пористости и сопротивлению непромытой зоны, поиск минимального значения в пористом и проницаемом пласте и сравнение с другими зонами.", "claims": ["apparent-water-resistivity.c3"], "page": 129, "by": "model"}, {"text": "Формула кажущегося удельного сопротивления воды выглядит как Rwa = (Rt * phi^m) / a.", "claims": ["apparent-water-resistivity.c4"], "page": 129, "by": "model"}, {"text": "В водоносном пласте Rt становится равным Ro, а Rwa равно Rw. При наличии углеводородов Rt больше Ro, и Rwa больше Rw.", "claims": ["apparent-water-resistivity.c5"], "page": 129, "by": "model"}, {"text": "Для простоты при расчете кривых в процессе бурения принимаются a = 1.0 и m = 2.0.", "claims": ["apparent-water-resistivity.c6"], "page": 130, "by": "model"}, {"text": "В качестве Rt используют глубокий индукционный каротаж или глубокий боковой каротаж без поправок за环境, а пористость берут по акустическому или плотностному методу.", "claims": ["apparent-water-resistivity.c7"], "page": 130, "by": "model"}, {"text": "В низкопористых зонах с пористостью менее примерно 10% значение Rwa оказывается ниже фактического Rw.", "claims": ["apparent-water-resistivity.c8"], "page": 129, "by": "model"}], "steps": [{"text": "Рассчитать кажущееся удельное сопротивление воды по измерениям пористости и сопротивления непромытой зоны.", "claims": ["apparent-water-resistivity.c9"], "page": 129, "by": "model"}, {"text": "Найти минимальное значение Rwa в пористом и проницаемом интервале и сравнить его с другими зонами.", "claims": ["apparent-water-resistivity.c10"], "page": 129, "by": "model"}, {"text": "При необходимости рассчитать водонасыщенность по Арчи на основе сравнения значений Rwa.", "claims": ["apparent-water-resistivity.c11"], "page": 129, "by": "model"}], "examples": [{"title": "Экспресс-оценка водонасыщенности по отношению Rwa", "page": 130, "figure": null, "condition": [{"text": "Используется отношение Rwa зоны к минимальному Rwa в качестве экспресс-метода для оценки Sw при a = 1.0 и m = 2.0.", "claims": ["apparent-water-resistivity.c12"], "page": 130, "by": "model"}], "solution": [{"text": "Вычисляется отношение Rwa_zone / Rwa_minimum, равное 3, 4 или 5, для подстановки в формулу Sw.", "claims": ["apparent-water-resistivity.c13"], "page": 130, "by": "model"}], "result": [{"text": "Отношение 3 дает Sw = 0.58, отношение 4 дает Sw = 0.50, а отношение 5 дает Sw = 0.45.", "claims": ["apparent-water-resistivity.c14"], "page": 130, "by": "model"}]}], "numbers": [{"text": "В низкопористых зонах порог составляет менее около 10% пористости, при которых Rwa занижается относительно реального Rw.", "claims": ["apparent-water-resistivity.c8"], "page": 129, "by": "model"}, {"text": "Для экспресс-оценки используются соотношения Rwa_zone к Rwa_minimum, равные 3, 4 и 5, дающие водонасыщенность 0.58, 0.50 и 0.45 соответственно.", "claims": ["apparent-water-resistivity.c14"], "page": 130, "by": "model"}], "formulas": [{"latex": "R_o = F \\times R_w", "page": 129, "vars": [{"sym": "Ro", "meaning": "сопротивление полностью водоносной породы", "unit": "u129-24"}, {"sym": "F", "meaning": "коэффициент извилистости", "unit": "u129-24"}, {"sym": "Rw", "meaning": "сопротивление пластовой воды", "unit": "u129-24"}]}, {"latex": "F = \\frac{a}{\\phi^m}", "page": 129, "vars": [{"sym": "F", "meaning": "коэффициент извилистости", "unit": "u129-26"}, {"sym": "a", "meaning": "параметр литологии", "unit": "u129-26"}, {"sym": "phi", "meaning": "пористость", "unit": "u129-26"}, {"sym": "m", "meaning": "индекс цементации", "unit": "u129-26"}]}, {"latex": "R_w = \\frac{R_o \\times \\phi^m}{a}", "page": 129, "vars": [{"sym": "Rw", "meaning": "сопротивление пластовой воды", "unit": "u129-28"}, {"sym": "Ro", "meaning": "сопротивление водоносной породы", "unit": "u129-28"}, {"sym": "phi", "meaning": "пористость", "unit": "u129-28"}, {"sym": "m", "meaning": "индекс цементации", "unit": "u129-28"}, {"sym": "a", "meaning": "параметр литологии", "unit": "u129-28"}]}, {"latex": "R_{wa} = \\frac{R_t \\times \\phi^m}{a}", "page": 129, "vars": [{"sym": "Rwa", "meaning": "кажущееся удельное сопротивление воды", "unit": "u129-30"}, {"sym": "Rt", "meaning": "истинное удельное сопротивление", "unit": "u129-30"}, {"sym": "phi", "meaning": "пористость", "unit": "u129-30"}, {"sym": "m", "meaning": "индекс цементации", "unit": "u129-30"}, {"sym": "a", "meaning": "параметр литологии", "unit": "u129-30"}]}, {"latex": "S_w = \\sqrt{\\frac{R_{wa\\ minimum}}{R_{wa\\ zone}}}", "page": 130, "vars": [{"sym": "Sw", "meaning": "водонасыщенность", "unit": "u130-06"}, {"sym": "Rwa_minimum", "meaning": "минимальное значение кажущегося сопротивления воды", "unit": "u130-06"}, {"sym": "Rwa_zone", "meaning": "кажущееся сопротивление воды в выбранной зоне", "unit": "u130-06"}]}], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда однозначно означает наличие нефти без сравнения с минерализацией воды и пористостью.", "right": [{"text": "Сопротивление зависит от пористости и минерализации воды; метод Rwa нормализует эти параметры через расчет кажущегося сопротивления воды для поиска углеводородов.", "claims": ["apparent-water-resistivity.c2", "apparent-water-resistivity.c5"], "page": 129, "by": "model"}]}, "data_meaning": {"input": "Кривые истинного сопротивления (Rt) и пористости (phi), а также константы a = 1.0 и m = 2.0.", "output": "Расчетная кривая кажущегося сопротивления воды (Rwa) и оценки водонасыщенности (Sw).", "breaks": [{"text": "Метод дает сбой и занижает Rwa в низкопористых зонах с пористостью менее 10%.", "claims": ["apparent-water-resistivity.c8"], "page": 129, "by": "model"}, {"text": "Метод основан на допущении, что истинное сопротивление воды одинаково во всех сравниваемых зонах, и если зона с минимальным Rwa содержит углеводороды, остальные зоны содержат их еще больше.", "claims": ["apparent-water-resistivity.c15"], "page": 129, "by": "model"}], "hypotheses": [{"text": "Гипотеза: отклонения Rwa от минимума можно использовать в автоматизированных алгоритмах классификации интервалов на нефтеносные и водоносные.", "claims": ["apparent-water-resistivity.c2"], "page": 129, "by": "model"}]}, "analogy": {"text": "Поиск минимального Rwa похож на поиск базовой линии шума в сигнале, относительно которой калибруются аномалии.", "breaks_where": "В отличие от статичного шума в IT, пластовые свойства меняются по разрезу из-за литологии."}, "now_practice": [{"text": "Сегодня расчет Rwa и экспресс-оценка Sw часто выполняются автоматически в реальном времени специализированным программным обеспечением интерпретации каротажа.", "claims": ["apparent-water-resistivity.c6", "apparent-water-resistivity.c7"], "page": 130, "by": "model"}], "layers": {"mechanism": [{"text": "Формула Rwa математически обращает уравнение Арчи для оценки изменения минерализации воды или появления непроводящих углеводородов.", "claims": ["apparent-water-resistivity.c4", "apparent-water-resistivity.c5"], "page": 129, "by": "model"}], "practice": [{"text": "На практике для упрощения расчетов берут фиксированные параметры a=1.0 и m=2.0, а в качестве пористости используют нейтронно-плотностной кроссплот.", "claims": ["apparent-water-resistivity.c6", "apparent-water-resistivity.c7"], "page": 130, "by": "model"}], "nuances": [{"text": "Применение метода требует осторожности в плотных коллекторах с пористостью ниже 10%, где расчет дает искаженные заниженные результаты.", "claims": ["apparent-water-resistivity.c8"], "page": 129, "by": "model"}], "deeper": [{"text": "Сравнение зон опирается на допущение постоянств

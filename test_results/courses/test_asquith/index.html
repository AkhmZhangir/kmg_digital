ёма воды на графике указывают на отсутствие добычи воды, тогда как их разброс свидетельствует о наличии подвижной воды.", "claims": ["buckles-plot-bvw.c3", "buckles-plot-bvw.c4"], "page": 134, "by": "model"}], "how_it_works": [{"text": "Формулы проницаемости по данным каротажа применимы только для пластов при неуменьшаемой водонасыщенности.", "claims": ["buckles-plot-bvw.c1"], "page": 134, "by": "model"}, {"text": "Объём связанной воды вычисляется как произведение водонасыщенности и пористости ($BVW = S_w \\times \\phi$).", "claims": ["buckles-plot-bvw.c2"], "page": 134, "by": "model"}, {"text": "Если значения объёма воды постоянны на графике Баклза (пористость против водонасыщенности в линейных шкалах), зона находится на неуменьшаемой водонасыщенности.", "claims": ["buckles-plot-bvw.c3", "buckles-plot-bvw.c5"], "page": 134, "by": "model"}, {"text": "При непостоянных значениях зона не находится на неуменьшаемой водонасыщенности, а оценки проницаемости вызывают сомнения.", "claims": ["buckles-plot-bvw.c4"], "page": 134, "by": "model"}, {"text": "На графике Баклза точки с одинаковым объемом воды образуют гиперболические кривые при построении в линейных шкалах.", "claims": ["buckles-plot-bvw.c5"], "page": 141, "by": "model"}, {"text": "Разброс значений объёма воды от гиперболических кривых означает, что вода превышает капилярное удержание, водонасыщенность не равна неуменьшаемой, и скважина дает больше воды относительно нефти.", "claims": ["buckles-plot-bvw.c6"], "page": 141, "by": "model"}], "steps": [{"text": "Определить по данным каротаж значения пористости и водонасыщенности для интервала.", "claims": ["buckles-plot-bvw.c5"], "page": 141, "by": "model"}, {"text": "Построить график Баклза в линейных шкалах для сопоставления точек с гиперболическими кривыми постоянного объёма воды.", "claims": ["buckles-plot-bvw.c5"], "page": 141, "by": "model"}, {"text": "Оценить постоянство значений объёма воды: кучность точек на одной кривой говорит о неуменьшаемой водонасыщенности, а сильный разброс — о наличии подвижной воды.", "claims": ["buckles-plot-bvw.c3", "buckles-plot-bvw.c4", "buckles-plot-bvw.c6"], "page": 134, "by": "model"}], "examples": [{"title": "Пример анализа пласта с постоянным BVW", "page": 141, "figure": "Figure 7.3a", "condition": [{"text": "Точки на графике Баклза построены в линейных шкалах для пласта из скважины.", "claims": ["buckles-plot-bvw.c5", "buckles-plot-bvw.c7"], "page": 141, "by": "model"}], "solution": [{"text": "Проверка положения точек на графике относительно кривых постоянного объема воды.", "claims": ["buckles-plot-bvw.c5", "buckles-plot-bvw.c7"], "page": 141, "by": "model"}], "result": [{"text": "Все точки располагаются в диапазоне от 0.04 до 0.05 BVW, пласт близок к неуменьшаемой водонасыщенности и дает 96% нефти.", "claims": ["buckles-plot-bvw.c7"], "page": 141, "by": "model"}]}, {"title": "Пример анализа пласта с частичным разбросом BVW", "page": 141, "figure": "Figure 7.3b", "condition": [{"text": "Точки водонасыщенности и пористости нанесены на график для скважины с добычей 68% нефти.", "claims": ["buckles-plot-bvw.c5", "buckles-plot-bvw.c8"], "page": 141, "by": "model"}], "solution": [{"text": "Оценка распределения значений объёма воды относительно гипербол.", "claims": ["buckles-plot-bvw.c5", "buckles-plot-bvw.c8"], "page": 141, "by": "model"}], "result": [{"text": "Около половины точек сгруппированы около BVW равного 0.04, а остальные имеют более высокие значения, что указывает на подвижную воду.", "claims": ["buckles-plot-bvw.c8"], "page": 141, "by": "model"}]}, {"title": "Пример анализа водяного пласта", "page": 141, "figure": "Figure 7.3c", "condition": [{"text": "Построение графика Баклза для интервала, дающего 100% воды (без нефти).", "claims": ["buckles-plot-bvw.c5", "buckles-plot-bvw.c9"], "page": 141, "by": "model"}], "solution": [{"text": "Анализ разброса точек на предмет отклонения от линий постоянного BVW.", "claims": ["buckles-plot-bvw.c5", "buckles-plot-bvw.c9"], "page": 141, "by": "model"}], "result": [{"text": "Наблюдается сильный разброс значений BVW от гиперболических кривых, пласт не находится на неуменьшаемой водонасыщенности.", "claims": ["buckles-plot-bvw.c9"], "page": 141, "by": "model"}]}], "numbers": [{"text": "В примере 7.3a значения объёма связанной воды лежат в диапазоне от 0.04 до 0.05, а добыча нефти составляет 96%.", "claims": ["buckles-plot-bvw.c7"], "page": 141, "by": "model"}, {"text": "В примере 7.3b около половины точек сгруппированы у значения BVW 0.04, а скважина дает 68% нефти.", "claims": ["buckles-plot-bvw.c8"], "page": 141, "by": "model"}], "formulas": [{"latex": "BVW = S_w \\times \\phi", "page": 134, "vars": [{"sym": "BVW", "meaning": "объем связанной воды", "unit": "u134-15"}, {"sym": "S_w", "meaning": "водонасыщенность", "unit": "u134-15"}, {"sym": "\\phi", "meaning": "пористость", "unit": "u134-15"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Кривые пористости и водонасыщенности, полученные по данным каротажа.", "output": "Оценка постоянства объёма связанной воды и заключение о достижении неуменьшаемой водонасыщенности.", "breaks": [{"text": "Наличие сильного разброса значений BVW делает оценки проницаемости по формулам ненадёжными.", "claims": ["buckles-plot-bvw.c4", "buckles-plot-bvw.c6"], "page": 134, "by": "model"}], "hypotheses": [{"text": "Гипотеза: График Баклза можно автоматизировать как кластеризационный признак для поиска зон безводной добычи.", "claims": [], "page": 134, "by": "model"}]}, "analogy": {"text": "График Баклза похож на диаграмму разброса (scatter plot) с изолиниями целевой переменной для проверки стабильности кластера.", "breaks_where": "В отличие от датасетных признаков, физика графика жестко завязана на капиллярные силы и смачиваемость пород."}, "now_practice": [{"text": "Сегодня построение графиков Баклза и оценка неуменьшаемой водонасыщенности выполняются в специализированном программном обеспечении интерпретации данных каротажа.", "claims": ["buckles-plot-bvw.c5"], "page": 141, "by": "model"}], "layers": {"mechanism": [{"text": "Постоянство произведения водонасыщенности и пористости отражает капиллярно-равновесное состояние пласта.", "claims": ["buckles-plot-bvw.c3", "buckles-plot-bvw.c6"], "page": 134, "by": "model"}], "practice": [{"text": "Геолог сравнивает расчетные проницаемости с соседними скважинами с разной историей добычи, не опираясь на абсолютные значения.", "claims": ["buckles-plot-bvw.c1"], "page": 134, "by": "model"}], "nuances": [{"text": "Появление мобильной воды приводит к отклонению точек от гиперболических кривых на графике.", "claims": ["buckles-plot-bvw.c6"], "page": 141, "by": "model"}], "deeper": [{"text": "Знание объёма связанной воды критически важно, так как добыча попутной воды напрямую влияет на экономику проекта.", "claims": ["buckles-plot-bvw.c4"], "page": 134, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.buckles-plot-bvw.ill1", "class": "B", "src": "media/asquith.buckles-plot-bvw-steps.svg", "alt": "Порядок действий по тексту автора: Оценка неуменьшаемой водонасыщенности по графику Баклза (BVW)", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.log-interpretation-workflow", "type": "prerequisite"}], "claims": [{"id": "buckles-plot-bvw.c1", "kind": "observation", "text": "Формулы проницаемости по каротажу применимы только при неуменьшаемой водонасыщенности.", "quote": "Log-derived permeability formulas are only valid for estimating permeability in formations at irreducible water saturation", "unit": "u134-14", "page": 134, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c2", "kind": "observation", "text": "Объём связанной воды рассчитывается как произведение водонасыщенности на пористость.", "quote": "Whether or not a formation is at irreducible water saturation depends upon bulk volume water values (BVW = Sw x phi).", "unit": "u134-15", "page": 134, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c3", "kind": "observation", "text": "Постоянные значения BVW означают, что зона находится в состоянии неуменьшаемой водонасыщенности.", "quote": "When the bulk volume water values of a formation are constant (Figure 7.3a), the zone is at irreducible water saturation.", "unit": "u134-15", "page": 134, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c4", "kind": "observation", "text": "Непостоянные значения BVW указывают на то, что зона не находится на неуменьшаемой водонасыщенности, а оценки проницаемости сомнительны.", "quote": "If the values are not constant, a zone is not at irreducible water saturation (Figures 7.3b and 7.3c), and the estimates of permeability are suspect.", "unit": "u134-15", "page": 134, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c5", "kind": "observation", "text": "При построении водонасыщенности и пористости в линейных шкалах одинаковые значения BVW образуют гиперболические кривые.", "quote": "With SW and porosity plotted on linear scales, points of equal bulk volume water (BVW) plot as hyperbolic curves.", "unit": "u141-06", "page": 141, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c6", "kind": "observation", "text": "При увеличении количества воды значения BVW рассеиваются от гипербол, вода становится подвижной и добывается больше воды.", "quote": "As the amount of formation water increases, the bulk volume water values become scattered from the hyperbolic curves and the formation has more water than it can hold by capillary pressure. The water saturation is no longer at, or near, irreducible, so more water is produced relative to oil.", "unit": "u141-06", "page": 141, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c7", "kind": "observation", "text": "На графике 7.3a точки лежат между 0.04 и 0.05 BVW, пласт дает 96% нефти.", "quote": "Figure 7.3a is an example of nearly constant BVW. The formation shown produces 96% oil. Note that all the points plot between 0.04 and 0.05 BVW.", "unit": "u141-07", "page": 141, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c8", "kind": "observation", "text": "На графике 7.3b скважина дает 68% нефти, часть точек около 0.04 BVW, а другие выше из-за подвижной воды.", "quote": "Figure 7.3b shows a well producing 68% oil. About half the points cluster around a BVW value of 0.04, but the other half have higher values of BVW, indicating moveable water.", "unit": "u141-08", "page": 141, "by": "model", "verified": true}, {"id": "buckles-plot-bvw.c9", "kind": "observation", "text": "На графике 7.3c скважина дает только воду, наблюдается сильный разброс точек от гипербол.", "quote": "Figure 7.3c shows a well producing no oil (all water). Note the scatter of BVW values from the hyperbolic curves, indicating that the formation is not at irreducible water saturation.", "unit": "u141-09", "page": 141, "by": "model", "verified": true}], "term_ids": ["t-bulk-volume-water-bvw-x", "t-irreducible-water-saturation-swirr-x", "t-buckles-plot-x"], "units": ["u134-14", "u134-15", "u141-03", "u141-04", "u141-05", "u141-06", "u141-07", "u141-08", "u141-09", "u142-01", "u142-02"], "video_criteria": ["cause_effect", "counterintuitive"], "fallback": false}, {"id": "asquith.permeability-wyllie-rose-timur", "order": 17, "part_id": "p16", "minutes": 3, "title": "Эмпирические формулы Вилли-Роуза и Тимура для оценки проницаемости", "book_title": "Wyllie and Rose (1950) / Timur (1968)", "pages": [135, 135], "difficulty": {"primary": "Ф", "secondary": "И"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: цепочка «причина → следствие». текст", "scene_template": "parametric-plot"}, "summary": [{"text": "Эмпирические формулы Вилли-Роуза и Тимура связывают проницаемость с пористостью и остаточной водонасыщенностью.", "claims": ["permeability-wyllie-rose-timur.c1", "permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c3"], "page": 135, "by": "model"}, {"text": "Для расчета используются номограммы или расчетные уравнения с коэффициентами для разных типов флюидов.", "claims": ["permeability-wyllie-rose-timur.c1", "permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c3"], "page": 135, "by": "model"}], "how_it_works": [{"text": "Метод Вилли-Роуза использует график (рисунок 7.8) или формулы для оценки проницаемости.", "claims": ["permeability-wyllie-rose-timur.c1"], "page": 135, "by": "model"}, {"text": "Формула 7.30 применяется для нефти средней плотности.", "claims": ["permeability-wyllie-rose-timur.c2"], "page": 135, "by": "model"}, {"text": "Формула 7.31 применяется для сухого газа.", "claims": ["permeability-wyllie-rose-timur.c3"], "page": 135, "by": "model"}, {"text": "Формула Тимура (7.32) предлагает иную эмпирическую зависимость с показателем степени 2.2 для пористости.", "claims": ["permeability-wyllie-rose-timur.c4"], "page": 135, "by": "model"}], "steps": [{"text": "Определить пористость породы и остаточную водонасыщенность зоны.", "claims": ["permeability-wyllie-rose-timur.c5", "permeability-wyllie-rose-timur.c6"], "page": 135, "by": "model"}, {"text": "Выбрать формулу в зависимости от типа флюида (нефть средней плотности или сухой газ) либо использовать график.", "claims": ["permeability-wyllie-rose-timur.c1", "permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c3"], "page": 135, "by": "model"}, {"text": "Вычислить проницаемость в миллидарси.", "claims": ["permeability-wyllie-rose-timur.c5"], "page": 135, "by": "model"}], "examples": [], "numbers": [{"text": "В формуле Вилли-Роуза для нефти используется множитель 250, а для сухого газа — 79.", "claims": ["permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c3"], "page": 135, "by": "model"}, {"text": "В формуле Тимура используется коэффициент 93, а пористость возводится в степень 2.2.", "claims": ["permeability-wyllie-rose-timur.c4"], "page": 135, "by": "model"}], "formulas": [{"latex": "K = \\left( 250 \\times \\frac{\\phi^3}{S_{\\text{wirr}}} \\right)^2", "page": 135, "vars": [{"sym": "K", "meaning": "проницаемость", "unit": "миллидарси"}, {"sym": "\\phi", "meaning": "пористость", "unit": ""}, {"sym": "S_{\\text{wirr}}", "meaning": "остаточная водонасыщенность", "unit": ""}]}, {"latex": "K = \\left( 79 \\times \\frac{\\phi^3}{S_{\\text{wirr}}} \\right)^2", "page": 135, "vars": [{"sym": "K", "meaning": "проницаемость", "unit": "миллидарси"}, {"sym": "\\phi", "meaning": "пористость", "unit": ""}, {"sym": "S_{\\text{wirr}}", "meaning": "остаточная водонасыщенность", "unit": ""}]}, {"latex": "K = \\left( \\frac{93 \\times \\phi^{2.2}}{S_{\\text{wirr}}} \\right)^2", "page": 135, "vars": [{"sym": "K", "meaning": "проницаемость", "unit": "миллидарси"}, {"sym": "\\phi", "meaning": "пористость", "unit": ""}, {"sym": "S_{\\text{wirr}}", "meaning": "остаточная водонасыщенность", "unit": ""}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Пористость (\\phi) и остаточная водонасыщенность (S_wirr)", "output": "Проницаемость в миллидарси (K)", "breaks": [{"text": "Формулы эмпирические и могут давать погрешность при применении вне условий конкретного региона или типа пород, для которых они выведены.", "claims": ["permeability-wyllie-rose-timur.c1", "permeability-wyllie-rose-timur.c4"], "page": 135, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Коэффициенты (250, 79, 93) подобраны статистически по результатам лабораторных измерений на керне для конкретных месторождений.", "claims": ["permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c3", "permeability-wyllie-rose-timur.c4"], "page": 135, "by": "model"}]}, "analogy": {"text": "Эмпирическая формула похожа на эвристическую регрессионную модель в ML, где признаки (пористость и насыщение) преобразуются через веса и степени для предсказания целевой переменной.", "breaks_where": "Модель ML обучается на данных и может переобучаться, а классические эмпирические формулы фиксированы авторами и отражают усбредненную физику конкретных типов коллекторов."}, "now_practice": [], "layers": {"mechanism": [{"text": "Связь проницаемости с пористостью и остаточной водой выражается через степенные функции.", "claims": ["permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c3", "permeability-wyllie-rose-timur.c4"], "page": 135, "by": "model"}], "practice": [{"text": "Интерпретаторы используют графики (например, рисунок 7.8) или расчетные модули для быстрого получения проницаемости из данных каротажа.", "claims": ["permeability-wyllie-rose-timur.c1"], "page": 135, "by": "model"}], "nuances": [{"text": "Существуют разные варианты уравнений для нефти средней плотности и для сухого газа.", "claims": ["permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c3"], "page": 135, "by": "model"}], "deeper": [{"text": "Формула Тимура использует показатель степени пористости 2.2 вместо 3 в формуле Вилли-Роуза.", "claims": ["permeability-wyllie-rose-timur.c2", "permeability-wyllie-rose-timur.c4"], "page": 135, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.permeability-wyllie-rose-timur.ill1", "class": "B", "src": "media/asquith.permeability-wyllie-rose-timur-steps.svg", "alt": "Порядок действий по тексту автора: Эмпирические формулы Вилли-Роуза и Тимура для оценки проницаемости", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.buckles-plot-bvw", "type": "prerequisite"}], "claims": [{"id": "permeability-wyllie-rose-timur.c1", "kind": "observation", "text": "Метод Вилли-Роуза использует график или две формы формулы для определения проницаемости.", "quote": "This method for determining permeability utilizes a chart (Figure 7.8) or the two forms of the following formula:", "unit": "u135-08", "page": 135, "by": "model", "verified": true}, {"id": "permeability-wyllie-rose-timur.c2", "kind": "observation", "text": "Формула Вилли-Роуза для нефти средней плотности использует коэффициент 250.", "quote": "K = \\left( 250 \\times \\frac{\\phi^3}{S_{\\text{wirr}}} \\right)^2 \\text{ (medium-gravity oils)}", "unit": "u135-09", "page": 135, "by": "model", "verified": true}, {"id": "permeability-wyllie-rose-timur.c3", "kind": "observation", "text": "Формула Вилли-Роуза для сухого газа использует коэффициент 79.", "quote": "K = \\left( 79 \\times \\frac{\\phi^3}{S_{\\text{wirr}}} \\right)^2 \\text{ dry gas)", "unit": "u135-10", "page": 135, "by": "model", "verified": true}, {"id": "permeability-wyllie-rose-timur.c4", "kind": "observation", "text": "Формула Тимура использует коэффициент 93 и степень 2.2 для пористости.", "quote": "K = \\left( \\frac{93 \\times \\phi^{2.2}}{S_{\\text{wirr}}} \\right)^2", "unit": "u135-16", "page": 135, "by": "model", "verified": false}, {"id": "permeability-wyllie-rose-timur.c5", "kind": "observation", "text": "K обозначает проницаемость в миллидарси.", "quote": "K = permeability in millidarcys", "unit": "u135-12", "page": 135, "by": "model", "verified": true}, {"id": "permeability-wyllie-rose-timur.c6", "kind": "observation", "text": "S_wirr обозначает водонасыщенность зоны при остаточной водонасыщенности.", "quote": "S_{\\text{wirr}} = water saturation (S_w) of a zone at irreducible water saturation", "unit": "u135-14", "page": 135, "by": "model", "verified": true}], "term_ids": ["t-porosity"], "units": ["u135-07", "u135-08", "u135-09", "u135-10", "u135-11", "u135-12", "u135-13", "u135-14", "u135-15", "u135-16"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "asquith.permeability-coates-dumanoir", "order": 18, "part_id": "p17", "minutes": 4, "title": "Усложненная модель Коутса и Думануаре для расчета проницаемости", "book_title": "Coates and Dumanoir (1973)", "pages": [135, 136], "difficulty": {"primary": "Ф", "secondary": "Пр"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: цепочка «причина → следствие». текст", "scene_template": "parametric-plot"}, "summary": [{"text": "Модель Коутса и Думануаре рассчитывает проницаемость сложным методом, где плотность углеводородов учитывается явно.", "claims": ["permeability-coates-dumanoir.c1"], "page": 135, "by": "model"}, {"text": "Для расчетов требуются удельное сопротивление пластовой воды, истинное удельное сопротивление при неизменяемой воде, плотность углеводородов и пористость.", "claims": ["permeability-coates-dumanoir.c2", "permeability-coates-dumanoir.c3", "permeability-coates-dumanoir.c4", "permeability-coates-dumanoir.c5"], "page": 135, "by": "model"}], "how_it_works": [{"text": "Метод Коутса и Думануаре 1973 года вычисляет проницаемость сложным способом, где плотность углеводородов входит в уравнение напрямую, а не через изменение константы.", "claims": ["permeability-coates-dumanoir.c1"], "page": 135, "by": "model"}, {"text": "Первым шагом вычисляются константы C и W.", "claims": ["permeability-coates-dumanoir.c6"], "page": 136, "by": "model"}, {"text": "Константа C рассчитывается по формуле через плотность углеводородов.", "claims": ["permeability-coates-dumanoir.c7"], "page": 136, "by": "model"}, {"text": "Константа W рассчитывается через пористость, логарифм отношения удельного сопротивления воды к истинному сопротивлению в зоне неизменяемой водонасыщенности.", "claims": ["permeability-coates-dumanoir.c8"], "page": 136, "by": "model"}, {"text": "После определения констант C и W они применяются для расчета проницаемости K в миллидарси.", "claims": ["permeability-coates-dumanoir.c9", "permeability-coates-dumanoir.c10"], "page": 136, "by": "model"}], "steps": [{"text": "Соберите входные данные: удельное сопротивление воды, истинное сопротивление при неизменяемой воде, плотность углеводородов и пористость.", "claims": ["permeability-coates-dumanoir.c2", "permeability-coates-dumanoir.c3", "permeability-coates-dumanoir.c4", "permeability-coates-dumanoir.c5"], "page": 135, "by": "model"}, {"text": "Рассчитайте константу C с использованием плотности углеводородов.", "claims": ["permeability-coates-dumanoir.c6", "permeability-coates-dumanoir.c7"], "page": 136, "by": "model"}, {"text": "Рассчитайте константу W с использованием пористости и отношения сопротивлений.", "claims": ["permeability-coates-dumanoir.c6", "permeability-coates-dumanoir.c8"], "page": 136, "by": "model"}, {"text": "Подставьте найденные константы C и W, пористость и сопротивления в итоговую формулу для расчета проницаемости K.", "claims": ["permeability-coates-dumanoir.c9", "permeability-coates-dumanoir.c10"], "page": 136, "by": "model"}], "examples": [], "numbers": [{"text": "В формуле константы C используются коэффициенты 23, 465 и 188.", "claims": ["permeability-coates-dumanoir.c7"], "page": 136, "by": "model"}, {"text": "В формуле константы W используются числа 3.75, 2.2 и 2.0.", "claims": ["permeability-coates-dumanoir.c8"], "page": 136, "by": "model"}], "formulas": [{"latex": "C = 23 + 465 \\times \\rho_{h} - 188 \\times \\rho_{h}^{2}", "page": 136, "vars": [{"sym": "C", "meaning": "константа в формуле проницаемости Коутса и Думануаре", "unit": "u136-08"}, {"sym": "\\rho_{h}", "meaning": "плотность углеводородов", "unit": "u136-09"}]}, {"latex": "W = \\left\\{(3.75 - \\phi) + \\left[ \\frac{(\\log(R_{w} / R_{t \\text{ irr}}) + 2.2)^{2}}{2.0} \\right] \\right\\}^{\\frac{1}{2}}", "page": 136, "vars": [{"sym": "W", "meaning": "константа в формуле проницаемости Коутса и Думануаре", "unit": "u136-12"}, {"sym": "\\phi", "meaning": "пористость", "unit": "u136-13"}, {"sym": "R_{w}", "meaning": "удельное сопротивление пластовой воды при пластовой температуре", "unit": "u136-14"}, {"sym": "R_{t \\text{ irr}}", "meaning": "глубинное сопротивление зоны с неизменяемой водонасыщенностью", "unit": "u136-15"}]}, {"latex": "K = \\left[ \\frac{C \\times \\phi^{2W}}{W^{4} \\times (R_{w} / R_{t \\text{ irr}})} \\right]^{2}", "page": 136, "vars": [{"sym": "K", "meaning": "проницаемость", "unit": "u136-19"}, {"sym": "C", "meaning": "константа на основе плотности углеводородов", "unit": "u136-20"}, {"sym": "W", "meaning": "константа", "unit": "u136-21"}, {"sym": "\\phi", "meaning": "пористость", "unit": "u136-22"}, {"sym": "R_{t \\text{ irr}}", "meaning": "глубинное сопротивление зоны с неизменяемой водонасыщенностью", "unit": "u136-23"}, {"sym": "R_{w}", "meaning": "удельное сопротивление пластовой воды при пластовой температуре", "unit": "u136-24"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Удельное сопротивление пластовой воды (Rw), истинное удельное сопротивление при неизменяемой воде (Rt irr), плотность углеводородов (ρh) и пористость (φ).", "output": "Проницаемость в миллидарси (md).", "breaks": [], "hypotheses": [{"text": "Гипотеза: Ошибки в определении плотности углеводородов или сопротивлений приводят к нели искажениям промежуточных констант C и W, что критически снижает точность итогового расчета проницаемости.", "claims": [], "page": 135, "by": "model"}]}, "analogy": {"text": "Многошаговая функция преобразования признаков (feature engineering) с промежуточными коэффициентами.", "breaks_where": "В отличие от стандартных моделей машинного обучения, формулы жестко зафиксированы авторами метода и не подлежат оптимизации на обучающей выборке."}, "now_practice": [{"text": "Сегодня расчеты сложных эмпирических моделей вроде Коутса и Думануаре полностью автоматизированы в специализированном ПО интерпретации данных геофизических исследований скважин.", "claims": [], "page": 135, "by": "model"}], "layers": {"mechanism": [{"text": "Метод рассчитывает проницаемость через последовательное вычисление промежуточных констант C и W с последующим возведением в степени.", "claims": ["permeability-coates-dumanoir.c6", "permeability-coates-dumanoir.c9", "permeability-coates-dumanoir.c10"], "page": 136, "by": "model"}], "practice": [{"text": "Для расчетов необходим набор параметров из электрометрии скважин и лабораторных данных по флюидам.", "claims": ["permeability-coates-dumanoir.c2", "permeability-coates-dumanoir.c3", "permeability-coates-dumanoir.c4", "permeability-coates-dumanoir.c5"], "page": 135, "by": "model"}], "nuances": [{"text": "Плотность углеводородов введена в уравнение напрямую, в отличие от более ранних подходов.", "claims": ["permeability-coates-dumanoir.c1"], "page": 135, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "asquith.permeability-coates-dumanoir.ill1", "class": "B", "src": "media/asquith.permeability-coates-dumanoir-steps.svg", "alt": "Порядок действий по тексту автора: Усложненная модель Коутса и Думануаре для расчета проницаемости", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.permeability-wyllie-rose-timur", "type": "prerequisite"}], "claims": [{"id": "permeability-coates-dumanoir.c1", "kind": "observation", "text": "Метод Коутса и Думануаре является более сложным способом расчета проницаемости, где плотность углеводородов учтена явно, в отличие от формул Вилли-Роуза.", "quote": "A more complex method for calculating permeability is the Coates and Dumanoir (1973) formula. Unlike the Wyllie and Rose (1950) formulas, hydrocarbon density is explicitly part of the equation, instead of being indirectly accounted for by changing a constant.", "unit": "u135-18", "page": 135, "by": "model", "verified": true}, {"id": "permeability-coates-dumanoir.c2", "kind": "observation", "text": "Для расчета по формуле Коутса и Думануаре требуется удельное сопротивление пластовой воды при пластовой температуре.", "quote": "Rw = formation water resistivity at formation temperature", "unit": "u135-19", "page": 135, "by": "model", "verified": true}, {"id": "permeability-coates-dumanoir.c3", "kind": "observation", "text": "Требуется истинное удельное сопротивление пласта в зоне с неизменяемой водонасыщенностью.", "quote": "Rt irr = true formation resistivity from a formation at irreducible water saturation", "unit": "u135-20", "page": 135, "by": "model", "verified": true}, {"id": "permeability-coates-dumanoir.c4", "kind": "observation", "text": "Требуется плотность углеводородов в г/см3.", "quote": "ρh = hydrocarbon density in g / cm^3", "unit": "u136-03", "page": 136, "by": "model", "verified": true}, {"id": "permeability-coates-dumanoir.c5", "kind": "observation", "text": "Требуется пористость.", "quote": "ϕ = porosity", "unit": "u136-04", "page": 136, "by": "model", "verified": false}, {"id": "permeability-coates-dumanoir.c6", "kind": "observation", "text": "Первым шагом в формуле проницаемости Коутса и Думануаре является вычисление значений двух констант: C и W.", "quote": "A first step in the Coates and Dumanoir permeability formula is calculation of values for two constants: C and W.", "unit": "u136-05", "page": 136, "by": "model", "verified": true}, {"id": "permeability-coates-dumanoir.c7", "kind": "observation", "text": "Константа C рассчитывается по формуле через плотность углеводородов.", "quote": "C = 23 + 465 \\times \\rho_{h} - 188 \\times \\rho_{h}^{2}", "unit": "u136-06", "page": 136, "by": "model", "verified": false}, {"id": "permeability-coates-dumanoir.c8", "kind": "observation", "text": "Константа W рассчитывается через пористость и логарифмическое отношение сопротивлений.", "quote": "W = \\left\\{(3.75 - \\phi) + \\left[ \\frac{(\\log(R_{w} / R_{t \\text{ irr}}) + 2.2)^{2}}{2.0} \\right] \\right\\}^{\\frac{1}{2}}", "unit": "u136-10", "page": 136, "by": "model", "verified": true}, {"id": "permeability-coates-dumanoir.c9", "kind": "observation", "text": "После определения константы C и W могут быть использованы для расчета проницаемости.", "quote": "Once determined, the constants C and W can be used to calculate permeability.", "unit": "u136-16", "page": 136, "by": "model", "verified": true}, {"id": "permeability-coates-dumanoir.c10", "kind": "observation", "text": "Проницаемость K рассчитывается по итоговой формуле в миллидарси.", "quote": "$$\\nK = \\left[ \\frac{C \\times \\phi^{2W}}{W^{4} \\times (R_{w} / R_{t \\text{ irr}})} \\right]^{2} \\tag{7.35}\n$$", "unit": "u136-17", "page": 136, "by": "model", "verified": true}], "term_ids": ["t-hydrocarbon-density"], "units": ["u135-17", "u135-18", "u135-19", "u135-20", "u136-03", "u136-04", "u136-05", "u136-06", "u136-07", "u136-08", "u136-09", "u136-10", "u136-11", "u136-12", "u136-13", "u136-14", "u136-15", "u136-16", "u136-17", "u136-18", "u136-19", "u136-20", "u136-21", "u136-22", "u136-23", "u136-24"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "asquith.shaly-sand-effects-models", "order": 19, "part_id": "p18", "minutes": 3, "title": "Влияние глинистости на результаты интерпретации и модели глинистых песчаников", "book_title": "SHALY SAND ANALYSIS", "pages": [136, 136], "difficulty": {"primary": "Н", "secondary": "Ф"}, "threshold": true, "format": {"primary": "long", "reason": "Тип «неопределённость, решение»; критерии видеоёмкости: контринтуитивность, цепочка «причина → следствие». текст подходит лучше всего, так как материал содержит концептуальное описание физических моделей и историческое развитие подходов к интерпретации каротажа без сложных пошаговых расчетных алгоритмов.", "scene_template": "decision-scale"}, "summary": [{"text": "Присутствие глин и сланцев в коллекторах приводит к ошибочным значениям пористости и водонасыщенности по данным каротажа.", "claims": ["shaly-sand-effects-models.c4"], "page": 136, "by": "model"}, {"text": "Для устранения этих эффектов применяются специальные модели, такие как методы Ваксмана-Смитса и двойной воды.", "claims": ["shaly-sand-effects-models.c2", "shaly-sand-effects-models.c3"], "page": 136, "by": "model"}], "how_it_works": [{"text": "Ранняя литература и методы интерпретации часто использовали термины объем сланца и объем глины как взаимозаменяемые.", "claims": ["shaly-sand-effects-models.c1"], "page": 136, "by": "model"}, {"text": "Геологические исследования показали, что сланцы и глины различны, а глинистые песчаники содержат именно глины, которые могут отличаться от окружающих сланцев.", "claims": ["shaly-sand-effects-models.c5"], "page": 136, "by": "model"}, {"text": "Большинство методов для глинистых песчаников ориентированы на объем сланца, но методы Ваксмана-Смитса и двойной воды используют электрические свойства глин.", "claims": ["shaly-sand-effects-models.c2", "shaly-sand-effects-models.c6"], "page": 136, "by": "model"}, {"text": "Модель двойной воды разделяет воду на неподвижный связанный слой у поверхности глины и подвижную свободную воду.", "claims": ["shaly-sand-effects-models.c3"], "page": 136, "by": "model"}, {"text": "Погрешности из-за глин и сланцев возникают не только в песчаниках, но также в известняках и доломитах.", "claims": ["shaly-sand-effects-models.c4"], "page": 136, "by": "model"}, {"text": "Наиболее значительный эффект сланца заключается в снижении контраста сопротивлений между нефтью или газом и водой.", "claims": ["shaly-sand-effects-models.c7"], "page": 136, "by": "model"}, {"text": "Хилчи отмечает, что для существенного влияния на водонасыщенность содержание сланца должно превышать 10-15%.", "claims": ["shaly-sand-effects-models.c8", "shaly-sand-effects-models.c9"], "page": 136, "by": "model"}, {"text": "Все формулы для глинистых песчаников снижают рассчитанную водонасыщенность по сравнению с игнорированием эффекта сланца.", "claims": ["shaly-sand-effects-models.c10"], "page": 136, "by": "model"}, {"text": "Переоценка содержания сланца может привести к тому, что водоносный интервал будет ошибочно выглядеть как нефтенасыщенный.", "claims": ["shaly-sand-effects-models.c11"], "page": 136, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Хилчи указывает пороговое значение содержания сланца более 10 до 15 процентов для существенного влияния на водонасыщенность.", "claims": ["shaly-sand-effects-models.c9"], "page": 136, "by": "model"}], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Данные каротажа в разрезах с содержанием глин и сланцев (песчаники, известняки, доломиты).", "output": "Скорректированные значения пористости и водонасыщенности пласта.", "breaks": [{"text": "При содержании сланца менее 10-15% эффект на водонасыщенность может быть незначительным, а при чрезмерной переоценке сланца водоносный интервал ошибочно принимается за продуктивный.", "claims": ["shaly-sand-effects-models.c9", "shaly-sand-effects-models.c11"], "page": 136, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Путаница между объемом сланца и объемом глины в алгоритмах обработки данных приводит к систематической ошибке предсказания насыщенности.", "claims": ["shaly-sand-effects-models.c1"], "page": 136, "by": "model"}]}, "analogy": {"text": "Учет глинистости похож на калибровку модели машинного обучения при наличии фонового шума сенсоров, искажающего полезный сигнал.", "breaks_where": "Физические связи между электропроводностью глины и связанной водой сложнее простых аддитивных поправок."}, "now_practice": [{"text": "Сегодня различие между типами глин и расчет их объемных долей обычно автоматизированы в специализированном ПО интерпретации с использованием многомерных стохастических моделей.", "claims": ["shaly-sand-effects-models.c1", "shaly-sand-effects-models.c5"], "page": 136, "by": "model"}], "layers": {"mechanism": [{"text": "Присутствие глин создает дополнительную проводимость за счет связанной воды и меняет электропроводность породы.", "claims": ["shaly-sand-effects-models.c3", "shaly-sand-effects-models.c7"], "page": 136, "by": "model"}], "practice": [{"text": "Ошибки в оценке глинистости напрямую транслируются в неверные запасы углеводородов из-за ложного занижения водонасыщенности.", "claims": ["shaly-sand-effects-models.c10", "shaly-sand-effects-models.c11"], "page": 136, "by": "model"}], "nuances": [{"text": "Сланец и глина не тождественны, а свойства глинистой составляющей зависят от конкретного минералогического состава.", "claims": ["shaly-sand-effects-models.c5"], "page": 136, "by": "model"}], "deeper": [{"text": "Развитие моделей от поправок по объему сланца к методам Ваксмана-Смитса и двойной воды отражает переход к учету электрохимии глинистых минералов.", "claims": ["shaly-sand-effects-models.c2", "shaly-sand-effects-models.c3"], "page": 136, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.shaly-sand-effects-models.ill1", "class": "B", "src": "media/asquith.shaly-sand-effects-models-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Влияние глинистости на результаты интерпретации и модели глинистых песчаников", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.pickett-hingle-comparison", "type": "prerequisite"}], "claims": [{"id": "shaly-sand-effects-models.c1", "kind": "observation", "text": "В ранней литературе и на практике термины объем сланца и объем глины часто использовались взаимозаменяемо.", "quote": "the literature and our interpretive techniques commonly use the terms shale volume and clay volume interchangeably.", "unit": "u136-27", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c2", "kind": "observation", "text": "Методы Ваксмана-Смитса и двойной воды используют электрические свойства глинистых минералов для прогноза водонасыщенности.", "quote": "the Waxman-Smits and dual water methods, seek to use the electrical properties of the clays in the formations to predict an accurate water saturation.", "unit": "u136-27", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c3", "kind": "observation", "text": "Модель двойной воды выделяет неподвижную связанную воду у поверхности глины и свободную воду.", "quote": "the dual water model postulates two different types of water in a shaly formation, a immovable water layer next to the clay surfaces (bound water) and movable water that can be displaced by hydrocarbons (free water).", "unit": "u136-28", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c4", "kind": "observation", "text": "Глины и сланцы вызывают ошибки пористости и водонасыщенности не только в песчаниках, но и в карбонатах.", "quote": "The presence of shale or clay minerals in a reservoir can cause erroneous values for water saturation and porosity derived from logs. These erroneous values are not limited to sandstones but also occur in limestones and dolomites.", "unit": "u136-29", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c5", "kind": "inference", "text": "Сланцы и глины различаются, и глинистые песчаники содержат специфические глины, отличающиеся от соседних сланцев.", "quote": "As our understanding of geological processes matured, it became understood that shale and clay are different and that shaly sands are usually not just sands with shales mixed in but sands that contain clays. These clays could be very different from the clays present in the shales near those sands of interest.", "unit": "u136-27", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c6", "kind": "observation", "text": "Большинство ранних техник концентрировались на учете объема сланца.", "quote": "Most of the shaly sand techniques developed over the years concern themselves with shale volume", "unit": "u136-27", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c7", "kind": "observation", "text": "Главный эффект сланца заключается в уменьшении контраста удельного сопротивления между углеводородами и водой.", "quote": "Hilchie (1978) notes that the most significant effect of shale in a formation is to reduce the resistivity contrast between oil or gas, and water.", "unit": "u136-30", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c8", "kind": "observation", "text": "При достаточном количестве сланца определение продуктивности зоны может быть затруднено или невозможно.", "quote": "The net result is that if enough shale is present in a reservoir, it may be very difficult, or perhaps impossible, to determine if a zone is productive.", "unit": "u136-30", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c9", "kind": "observation", "text": "Содержание сланца должно превышать 10-15 процентов, чтобы существенно повлиять на водонасыщенность по каротажу.", "quote": "Hilchie (1978) suggests that for shale to significantly affect log-derived water saturations, shale content must be greater than 10 to 15%.", "unit": "u136-30", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c10", "kind": "observation", "text": "Формулы для глинистых песчаников дают меньшую водонасыщенность по сравнению с расчетом без учета сланца.", "quote": "Remember that all shaly sandstone formulas reduce the water saturation value from the value that would be calculated if shale effect were ignored.", "unit": "u136-31", "page": 136, "by": "model", "verified": true}, {"id": "shaly-sand-effects-models.c11", "kind": "inference", "text": "Переоценка содержания сланца может создать ложное впечатление о нефтенасыщенности водоносного пласта.", "quote": "However, this lowering of water saturation can be a problem in log evaluation, because, if a geologist overestimates shale content, a water-bearing zone might appear to be a hydrocarbon-bearing zone.", "unit": "u136-31", "page": 136, "by": "model", "verified": true}], "term_ids": ["t-shaly-sand", "t-dual-water-model"], "units": ["u136-25", "u136-26", "u136-27", "u136-28", "u136-29", "u136-30", "u136-31"], "video_criteria": ["counterintuitive", "cause_effect"], "fallback": false}, {"id": "asquith.hingle-plot-sandstones-carbonates", "order": 20, "part_id": "p19", "minutes": 4, "title": "Построение и применение кроссплота Хингла для песчаников и карбонатов", "book_title": "Carbonates: Hingle plot", "pages": [143, 145], "difficulty": {"primary": "И", "secondary": "Ф"}, "threshold": true, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». Текст с примерами и числами, так как важно показать разницу параметров для разных пород.", "scene_template": "tool-in-well"}, "summary": [{"text": "Кроссплот Хингла — это график зависимости удельного сопротивления от пористости, используемый для оценки водонасыщенности.", "claims": ["hingle-plot-sandstones-carbonates.c1"], "page": 143, "by": "model"}, {"text": "Для песчаников и карбонатов используются разные параметры построения осей: коэффициент извилистости и индекс цементации.", "claims": [], "page": 143, "by": "model"}, {"text": "Позиция точки на графике относительно линии водоносного пласта указывает на наличие воды или углеводородов.", "claims": [], "page": 143, "by": "model"}], "how_it_works": [{"text": "Кроссплот Хингла строится как зависимость удельного сопротивления от пористости.", "claims": ["hingle-plot-sandstones-carbonates.c1"], "page": 143, "by": "model"}, {"text": "Ось ординат (сопротивление) рассчитывается с использованием коэффициента извилистости (a) и индекса цементации (m).", "claims": [], "page": 143, "by": "model"}, {"text": "Для песчаников стандартные параметры: a = 1.0 и m = 2.0.", "claims": [], "page": 143, "by": "model"}, {"text": "Для карбонатов стандартные параметры: a = 0.62 и m = 2.15.", "claims": [], "page": 143, "by": "model"}, {"text": "График позволяет визуально различать водоносные и углеводородонасыщенные зоны.", "claims": [], "page": 143, "by": "model"}, {"text": "Данные для построения берутся из каротажа скважины, например, из песчаника Морроу.", "claims": [], "page": 143, "by": "model"}], "steps": [{"text": "Определить тип породы (песчаник или карбонат).", "claims": [], "page": 143, "by": "model"}, {"text": "Выбрать соответствующие параметры a и m для построения оси ординат.", "claims": [], "page": 143, "by": "model"}, {"text": "Нанести точки данных (пористость, сопротивление) на график.", "claims": ["hingle-plot-sandstones-carbonates.c1"], "page": 143, "by": "model"}, {"text": "Сравнить положение точек с линией водоносного пласта.", "claims": [], "page": 143, "by": "model"}], "examples": [{"title": "Пример 7.7", "page": 145, "figure": "рис. 7.7", "condition": [{"text": "Данные из песчаника Морроу, округ Симаррон, Оклахома.", "claims": [], "page": 143, "by": "model"}], "solution": [{"text": "Построение кроссплота Хингла для иллюстрации водоносных и углеводородонасыщенных зон.", "claims": [], "page": 143, "by": "model"}], "result": [{"text": "Визуальное разделение зон на водоносные и углеводородонасыщенные.", "claims": [], "page": 143, "by": "model"}]}], "numbers": [{"text": "Для песчаников: a = 1.0, m = 2.0.", "claims": [], "page": 143, "by": "model"}, {"text": "Для карбонатов: a = 0.62, m = 2.15.", "claims": [], "page": 143, "by": "model"}], "formulas": [], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Сопротивление зависит от пористости и насыщения. Кроссплот Хингла учитывает пористость, чтобы отличить сухую породу от углеводородонасыщенной.", "claims": ["hingle-plot-sandstones-carbonates.c1"], "page": 143, "by": "model"}]}, "data_meaning": {"input": "Пористость (φ) и удельное сопротивление (R) из каротажа.", "output": "Оценка водонасыщенности или наличие углеводородов.", "breaks": [{"text": "Метод не работает, если параметры a и m не соответствуют реальной геологии.", "claims": [], "page": 143, "by": "model"}], "hypotheses": [{"text": "Гипотеза: В ИТ-системе это выглядит как классификатор, где фичи — φ и R, а метка — тип насыщения.", "claims": [], "page": 143, "by": "model"}]}, "analogy": {"text": "Кроссплот Хингла — это калибровочная кривая (lookup-таблица), которая связывает два косвенных измерения (R и φ) с целевой переменной (насыщение).", "breaks_where": "Аналогия ломает ty": {"primary": "Пр", "secondary": "И"}, "threshold": true, "format": {"primary": "long", "reason": "Тип «процедура»; критерии видеоёмкости: цепочка «причина → следствие», скачок масштаба. Текст с формулами и кроссплотами оптимально разбирать в текстовом формате с интерактивными элементами для шагов расчета.", "scene_template": "step-flow"}, "summary": [{"text": "График Хингла позволяет определять удельное сопротивление пластовой воды и водонасыщенность по данным плотности и сопротивления породы.", "claims": ["hingle-plot-rw-sw-calculation.c1", "hingle-plot-rw-sw-calculation.c2"], "page": 145, "by": "model"}, {"text": "Метод использует специализированную сетку кроссплота, связывая объемные свойства с электрическими характеристиками пласта.", "claims": ["hingle-plot-rw-sw-calculation.c1"], "page": 145, "by": "model"}], "how_it_works": [{"text": "Для песчаников обычно выбирают сетку Хингла с параметрами a = 1.0 и m = 2.0.", "claims": ["hingle-plot-rw-sw-calculation.c1"], "page": 145, "by": "model"}, {"text": "Ось X масштабируется по объемной плотности породы, на которую наносятся измеренные точки.", "claims": ["hingle-plot-rw-sw-calculation.c2"], "page": 145, "by": "model"}, {"text": "Линия водоносного пласта проводится через кластер точек и пересекает ось Y на значении 2.65 г/см³, соответствующем плотности матрицы.", "claims": ["hingle-plot-rw-sw-calculation.c3"], "page": 145, "by": "model"}, {"text": "Из-за ограниченного диапазона пористости и разброса точек другие значения плотности матрицы также могут быть обоснованы.", "claims": ["hingle-plot-rw-sw-calculation.c4"], "page": 145, "by": "model"}, {"text": "Удельное сопротивление воды R_w определяется по формуле 7.28 через сопротивление породы, пористость и параметры a и m.", "claims": ["hingle-plot-rw-sw-calculation.c5", "hingle-plot-rw-sw-calculation.c6"], "page": 145, "by": "model"}, {"text": "Значения фактора извилистости (a) и индекса цементации (m) задаются выбором конкретной сетки кроссплота.", "claims": ["hingle-plot-rw-sw-calculation.c7"], "page": 145, "by": "model"}, {"text": "Линии водонасыщенности строятся с использованием значения R_a и множителей из таблицы 7.2 для показателя насыщения n = 2.0.", "claims": ["hingle-plot-rw-sw-calculation.c8"], "page": 145, "by": "model"}, {"text": "Каждая линия насыщения строится так, чтобы пересекать линию водоносного пласта при бесконечном удельном сопротивлении.", "claims": ["hingle-plot-rw-sw-calculation.c9"], "page": 145, "by": "model"}, {"text": "Для точного определения водонасыщенности аномальных точек применяется расчетная формула с использованием R_a и R_s.", "claims": ["hingle-plot-rw-sw-calculation.c10"], "page": 145, "by": "model"}], "steps": [{"text": "Постройте кроссплот с объемной плотностью по оси X и нанесите точки.", "claims": ["hingle-plot-rw-sw-calculation.c2"], "page": 145, "by": "model"}, {"text": "Проведите линию водоносного пласта через точки до пересечения с осью Y для определения плотности матрицы.", "claims": ["hingle-plot-rw-sw-calculation.c3"], "page": 145, "by": "model"}, {"text": "Считайте сопротивление R_a с линии водоносного пласта для выбранного значения пористости.", "claims": ["hingle-plot-rw-sw-calculation.c11"], "page": 145, "by": "model"}, {"text": "Рассчитайте удельное сопротивление воды R_w или водонасыщенность S_w по формулам.", "claims": ["hingle-plot-rw-sw-calculation.c6", "hingle-plot-rw-sw-calculation.c10"], "page": 145, "by": "model"}], "examples": [{"title": "Расчет удельного сопротивления воды по графику Хингла", "page": 145, "figure": "график Хингла", "condition": [{"text": "Задана пористость 10% (объемная плотность 2.485 г/см³) и сопротивление R_a = 4.1 ом·м, параметры a = 1.0, m = 2.0.", "claims": ["hingle-plot-rw-sw-calculation.c11", "hingle-plot-rw-sw-calculation.c12"], "page": 145, "by": "model"}], "solution": [{"text": "Подставим значения в формулу: R_w = (4.1 * 0.10^2.0) / 1.0.", "claims": ["hingle-plot-rw-sw-calculation.c13"], "page": 145, "by": "model"}], "result": [{"text": "Получено значение R_w = 0.041 ом·м при пластовой температуре.", "claims": ["hingle-plot-rw-sw-calculation.c14"], "page": 145, "by": "model"}]}, {"title": "Расчет водонасыщенности для аномальной точки", "page": 145, "figure": "график Хингла", "condition": [{"text": "Для заданной пористости значение R_a составляет 0.83 ом·м, а сопротивление точки R_s равно 40 ом·м при n = 2.0.", "claims": ["hingle-plot-rw-sw-calculation.c15", "hingle-plot-rw-sw-calculation.c16"], "page": 145, "by": "model"}], "solution": [{"text": "Вычисляется корень квадратный из отношения 0.83 к 40.", "claims": ["hingle-plot-rw-sw-calculation.c17"], "page": 145, "by": "model"}], "result": [{"text": "Водонасыщенность S_w составляет 0.144.", "claims": ["hingle-plot-rw-sw-calculation.c18"], "page": 145, "by": "model"}]}], "numbers": [{"text": "Параметры сетки: a = 1.0, m = 2.0.", "claims": ["hingle-plot-rw-sw-calculation.c1"], "page": 145, "by": "model"}, {"text": "Плотность матрицы на пересечении с осью Y: 2.65 г/см³.", "claims": ["hingle-plot-rw-sw-calculation.c3"], "page": 145, "by": "model"}, {"text": "Пример для пористости 10% (объемная плотность 2.485 г/см³) дает R_a = 4.1 ом·м и R_w = 0.041 ом·м.", "claims": ["hingle-plot-rw-sw-calculation.c11", "hingle-plot-rw-sw-calculation.c12", "hingle-plot-rw-sw-calculation.c14"], "page": 145, "by": "model"}, {"text": "Интерсепт для линии 50% водонасыщенности при плотности 2.485 г/см³ равен 16.4.", "claims": ["hingle-plot-rw-sw-calculation.c19"], "page": 145, "by": "model"}, {"text": "При расчете S_w для R_a = 0.83 ом·м и R_s = 40 ом·м результат равен 0.144.", "claims": ["hingle-plot-rw-sw-calculation.c15", "hingle-plot-rw-sw-calculation.c16", "hingle-plot-rw-sw-calculation.c18"], "page": 145, "by": "model"}], "formulas": [{"latex": "R_w = \\frac{R_c \\times \\phi^m}{a}", "page": 145, "vars": [{"sym": "R_w", "meaning": "удельное сопротивление воды", "unit": "ом·м"}, {"sym": "R_c", "meaning": "сопротивление породы", "unit": "ом·м"}, {"sym": "\\phi", "m w-sw-calculation.c1", "hingle-plot-rw-sw-calculation.c9"], "page": 145, "by": "model"}], "practice": [{"text": "Практическое чтение параметров с осей кроссплота и подстановка в расчетные формулы для контроля насыщения.", "claims": ["hingle-plot-rw-sw-calculation.c8", "hingle-plot-rw-sw-calculation.c10"], "page": 145, "by": "model"}], "nuances": [{"text": "Возможность обоснования иных значений плотности матрицы из-за разброса данных.", "claims": ["hingle-plot-rw-sw-calculation.c4"], "page": 145, "by": "model"}], "deeper": [{"text": "Сравнение результатов интерпретации с кроссплотом Пикетта для перекрестной проверки.", "claims": ["hingle-plot-rw-sw-calculation.c20"], "page": 145, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "asquith.hingle-plot-rw-sw-calculation.ill1", "class": "B", "src": "media/asquith.hingle-plot-rw-sw-calculation-steps.svg", "alt": "Порядок действий по тексту автора: Расчет удельного сопротивления воды и водонасыщенности по графику Хингла", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "asquith.hingle-plot-rw-sw-calculation.ill2", "class": "B", "src": "media/asquith.hingle-plot-rw-sw-calculation-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Расчет удельного сопротивления воды и водонасыщенности по графику Хингла", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "asquith.hingle-plot-sandstones-carbonates", "type": "prerequisite"}], "claims": [{"id": "hingle-plot-rw-sw-calculation.c1", "kind": "observation", "text": "Для песчаников выбрана сетка Хингла с a = 1.0 и m = 2.0.", "quote": "The Hingle grid using a = 1.0 and m = 2.0 was chosen as the common parameters for sandstones.", "unit": "u145-04", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c2", "kind": "observation", "text": "Ось X масштабирована в объемной плотности, точки нанесены на график.", "quote": "The x-axis has been scaled in bulk density, and the points plotted accordingly.", "unit": "u145-05", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c3", "kind": "observation", "text": "Линия водоносного пласта пересекает ось Y на 2.65 г/см³.", "quote": "The water-bearing line drawn through the cluster of points intersects the y-axis at 2.65 g/cm³, the matrix-density value for the formation.", "unit": "u145-05", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c4", "kind": "inference", "text": "Из-за разброса точек другие значения плотности матрицы также обоснованы.", "quote": "Given the limited porosity range and the scatter of those points, other values for matrix density could also be justified.", "unit": "u145-05", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c5", "kind": "observation", "text": "R_w определяется по уравнению 7.28.", "quote": "R_w is determined using Equation 7.28:", "unit": "u145-06", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c6", "kind": "observation", "text": "Формула R_w = (R_c * phi^m) / a.", "quote": "$$R_w = \\frac{R_c \\times \\phi^m}{a}$$", "unit": "u145-07", "page": 145, "by": "model", "verified": false}, {"id": "hingle-plot-rw-sw-calculation.c7", "kind": "observation", "text": "Значения tortuosity factor (a) и cementation exponent (m) заданы выбором сетки.", "quote": "The values of tortuosity factor (a) and cementation exponent (m) were assumed by choice of the particular crossplot grid.", "unit": "u145-09", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c8", "kind": "observation", "text": "Линии водонасыщенности строятся из R_a и множителей для n = 2.0.", "quote": "The water saturation lines are constructed on the plot from the value for R_a and the multipliers from Table 7.2. The multipliers are for a saturation exponent (n) of 2.0.", "unit": "u145-13", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c9", "kind": "observation", "text": "Линии строятся так, чтобы пересекать линию водоносного пласта при бесконечном сопротивлении.", "quote": "For each line to be plotted, multiply R_a by the multiplier and plot that line so that it intersects the water-bearing line at infinite resistivity.", "unit": "u145-15", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c10", "kind": "observation", "text": "Для точного определения водонасыщенности используется уравнение.", "quote": "To determine the water saturation of the anomalous points (with more accuracy than estimating the values from the crossplot), the following equation can be used:", "unit": "u145-16", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c11", "kind": "observation", "text": "Для пористости 10% (плотность 2.485 г/см³) R_a = 4.1 ом·м.", "quote": "In this case, for a porosity of 10% (bulk density = 2.485 g/cm³), R_a = 4.1 ohm-m.", "unit": "u145-08", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c12", "kind": "observation", "text": "Пористость равна 10%, плотность равна 2.485 г/см³.", "quote": "for a porosity of 10% (bulk density = 2.485 g/cm³)", "unit": "u145-08", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c13", "kind": "observation", "text": "Подстановка в уравнение дает R_w = (4.1 * 0.10^2.0) / 1.0.", "quote": "$$R_w = \\frac{4.1 \\times 0.10^{2.0}}{1.0}$$", "unit": "u145-11", "page": 145, "by": "model", "verified": false}, {"id": "hingle-plot-rw-sw-calculation.c14", "kind": "observation", "text": "R_w = 0.041 ом·м при пластовой температуре.", "quote": "R_w = 0.041 ohm-m at formation temperature", "unit": "u145-12", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c15", "kind": "observation", "text": "Для точек интереса R_a = 0.83 ом·м.", "quote": "For the two points of interest (both having the same porosity), R_a = 0.83 ohm-m.", "unit": "u145-18", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c16", "kind": "observation", "text": "Для точки с сопротивлением 40 ом·м водонасыщенность рассчитывается формулой.", "quote": "For the point who's resistivity is 40 ohm-m, the saturation is found by:", "unit": "u145-18", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c17", "kind": "observation", "text": "Расчет S_w через степень 1/2.0 от отношения 0.83 к 40.", "quote": "$$S_w = \\left(\\frac{0.83}{40}\\right)^{\\frac{1}{2.0}}$$", "unit": "u145-19", "page": 145, "by": "model", "verified": false}, {"id": "hingle-plot-rw-sw-calculation.c18", "kind": "observation", "text": "Результат расчета S_w равен 0.144.", "quote": "$$S_w = 0.144$$", "unit": "u145-20", "page": 145, "by": "model", "verified": false}, {"id": "hingle-plot-rw-sw-calculation.c19", "kind": "observation", "text": "Интерсепт для 50% линии при плотности 2.485 г/см³ равен 16.4.", "quote": "The intercept for the 50% water-saturation line (at bulk density = 2.485 g/cm³) is 16.4.", "unit": "u145-15", "page": 145, "by": "model", "verified": true}, {"id": "hingle-plot-rw-sw-calculation.c20", "kind": "observation", "text": "Для сравнения интерпретации на рисунке 7.4 показан кроссплот Пикетта.", "quote": "For comparison of interpretation, Figure 7.4 is a Pickett plot with the same data shown.", "unit": "u145-21", "page": 145, "by": "model", "verified": true}], "term_ids": ["t-hingle-plot-x-x"], "units": ["u145-04", "u145-05", "u145-06", "u145-07", "u145-08", "u145-09", "u145-10", "u145-11", "u145-12", "u145-13", "u145-14", "u145-15", "u145-16", "u145-17", "u145-18", "u145-19", "u145-20", "u145-21", "u146-01", "u146-02", "u146-03"], "video_criteria": ["cause_effect", "scale_jump"], "fallback": false}], "tasks": [{"id": "asquith.log-interpretation-overview.q1", "node_id": "asquith.log-interpretation-overview", "type": "single", "claim_id": "log-interpretation-overview.c1", "question": "Что является самым первым шагом при переводе сырых данных каротажа в оценки содержания нефти, газа и воды?", "options": ["Определение пористости и истинного удельного сопротивления", "Расчет водонасыщенности по методу Арчи", "Анализ шлама и результатов испытания пластов", "Оценка проницаемости коллектора"], "answer": 0, "explanation": "Определение пористости и истинного сопротивления служит отправной точкой для перевода сырых данных в оценки флюидов."}, {"id": "asquith.log-interpretation-overview.q2", "node_id": "asquith.log-interpretation-overview", "type": "cloze", "claim_id": "log-interpretation-overview.c3", "question": "Заполните пропуск в правиле интерпретации геофизических данных:", "text": "Интерпретацию данных каротажа нельзя применять обособленно, без включения прочих данных, таких как испытания пластов и {{1}}.", "answers": [["шлам", "шлама", "анализ шлама", "проявления в шламе"]], "explanation": "В тексте прямо указано на недопустимость применения интерпретации без шлама и других смежных данных."}, {"id": "asquith.log-interpretation-overview.q3", "node_id": "asquith.log-interpretation-overview", "type": "order", "claim_id": "log-interpretation-overview.c6", "question": "Расставьте по порядку действия геолога перед принятием решения о спуске обсадной колонны (обзор смежных данных):", "items": ["Изучить данные испытаний буровым инструментом", "Проанализировать данные по шламу", "Оценить информацию о соседней добыче", "Принять окончательное решение о спуске труб"], "explanation": "Геолог обязан комплексно рассмотреть все релевантные данные (испытания, шлам, соседнюю добычу) перед спуском труб."}, {"id": "asquith.reconnaissance-scanning.q1", "node_id": "asquith.reconnaissance-scanning", "type": "order", "claim_id": "reconnaissance-scanning.c2", "question": "Расставьте этапы экспресс-сканирования разреза по порядку для поиска коллекторов", "items": ["Определить литологический тип разреза (обломочные породы или карбонаты)", "Для обломочных пород применить кривую сопротивления", "Для карбонатов применить кривую пористости", "Сопоставить потенциально продуктивные и водные зоны"], "explanation": "Сначала определяют литологию, затем выбирают профильный метод для каждого типа пород и в конце сравнивают зоны."}, {"id": "asquith.reconnaissance-scanning.q2", "node_id": "asquith.reconnaissance-scanning", "type": "multi", "claim_id": "reconnaissance-scanning.c3", "question": "Какие задачи решает хорошая техника экспресс-сканирования разреза?", "options": ["Находит коллекторы в разрезе", "Дает подсказки о потенциальных продуктивных зонах", "Указывает на водяные зоны", "Точно рассчитывает абсолютный тоннаж нефти без бурения"], "answer": [0, 1, 2], "explanation": "Экспресс-сканирование выделяет коллекторы и помогает наметить продуктивные и водяные зоны, но не заменяет полный подсчет запасов."}, {"id": "asquith.reconnaissance-scanning.q3", "node_id": "asquith.reconnaissance-scanning", "type": "single", "claim_id": "reconnaissance-scanning.c5", "question": "Почему для обломочных пород в качестве первичного измерения используют кривую сопротивления?", "options": ["Потому что обломочные породы обычно окружены глинами с медленно меняющимся сопротивлением", "Потому что карбонаты всегда имеют нулевую пористость", "Потому что у обломочных пород сопротивление вообще никогда не меняется", "Потому что кривую пористости для них измерить технически невозможно"], "answer": 0, "explanation": "В обломочных разрезах фоновые глины создают стабильный фон с медленно меняющимся сопротивлением, на котором легко заметить аномалии."}, {"id": "asquith.archie-water-saturation.q1", "node_id": "asquith.archie-water-saturation", "type": "calc", "claim_id": "archie-water-saturation.c1", "question": "В каком году была предложена классическая формула Арчи для расчета водонасыщенности?", "answer": 1942.0, "tolerance": 0.0, "unit": "год", "explanation": "Формула Арчи была опубликована в 1942 году."}, {"id": "asquith.archie-water-saturation.q2", "node_id": "asquith.archie-water-saturation", "type": "single", "claim_id": "archie-water-saturation.c9", "question": "Что можно утверждать о зоне пласта на основе знания одной лишь ее водонасыщенности (Sw)?", "options": ["Этого достаточно для полной оценки промышленной продуктивности зоны", "Этого недостаточно для полной оценки потенциальной продуктивности зоны", "Это гарантирует стопроцентную безводную добычу углеводородов", "Это позволяет сразу определить коммерческий объем извлекаемых запасов"], "answer": 1, "explanation": "Знание одной только водонасыщенности не дает достаточной информации для полной оценки потенциальной продуктивности."}, {"id": "asquith.archie-water-saturation.q3", "node_id": "asquith.archie-water-saturation", "type": "cloze", "claim_id": "archie-water-saturation.c3", "question": "Заполните пропуск в названии параметра истинного сопротивления пласта", "text": "Для расчета по формуле Арчи используется истинное сопротивление пласта, обозначаемое как {{1}}.", "answers": [["Rt", "RT", "рт"]], "explanation": "Истинное сопротивление пласта обозначается латинской буквой Rt."}, {"id": "asquith.flushed-zone-saturation.q1", "node_id": "asquith.flushed-zone-saturation", "type": "cloze", "claim_id": "flushed-zone-saturation.c1", "question": "Заполните пропуск в названии параметра формулы Арчи для промытой зоны.", "text": "Для расчета водонасыщенности промытой зоны в формуле Арчи вместо сопротивления пластовой воды используется сопротивление {{1}} бурового раствора.", "answers": [["фильтрата"]], "explanation": "В формуле для промытой зоны удельное сопротивление пластовой воды заменяется на сопротивление фильтрата бурового раствора (R_mf)."}, {"id": "asquith.flushed-zone-saturation.q2", "node_id": "asquith.flushed-zone-saturation", "type": "order", "claim_id": "flushed-zone-saturation.c2", "question": "Расставьте по порядку шаги

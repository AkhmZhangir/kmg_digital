<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Курс по главе</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6ef;color:#20332f;font:17px/1.58 system-ui}main{max-width:850px;margin:auto;padding:32px 22px 80px}header{border-bottom:1px solid #b6c4b7;padding-bottom:18px}h1{font:600 clamp(1.8rem,5vw,3rem)/1.12 Georgia}h2{font:600 1.55rem/1.3 Georgia}button,select,input{max-width:100%;font:inherit;padding:.4em .7em}button,summary,select{cursor:pointer}button{background:white;color:#20332f;border:1px solid #83978f;border-radius:4px}button:focus-visible,a:focus-visible{outline:3px solid #bb7431}p{overflow-wrap:anywhere;white-space:pre-wrap}a{color:#006657}article,section{margin:24px 0}small{color:#495e55}label{display:block}nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px}select{width:100%}output{display:block;font-weight:bold}details{margin:12px 0}blockquote{border-left:3px solid #7c9d8d;margin-left:0;padding-left:1em;white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%;accent-color:#126854}
</style><main><header><small id="mode"></small><h1 id="title"></h1><label>Перейти к шагу <select id="steps"></select></label><progress id="progress"></progress><small id="status"></small></header><article><h2 id="topic"></h2><a id="source" target="_blank" rel="noopener"></a><div id="claims"></div></article><section id="practice"></section><section id="card"></section><nav><button id="prev">Назад</button><button id="done">Шаг пройден</button><button id="next">Дальше</button></nav></main>
<script id="data" type="application/json">__COURSE_JSON__</script><script>
const course=JSON.parse(document.querySelector('#data').textContent);
const el=id=>document.getElementById(id);
function add(parent,tag,text){const item=document.createElement(tag);item.textContent=text;parent.append(item);return item}
const key='chapter-course:'+course.nodes[0].id+':'+course.nodes.at(-1).id;
let state={at:0,done:[]};
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.done)&&Number.isInteger(saved.at)&&course.nodes[saved.at])state=saved}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
el('title').textContent=document.title=course.title;
el('mode').textContent=course.mode;
course.nodes.forEach((n,i)=>add(el('steps'),'option',(i+1)+'. '+n.title.slice(0,85)).value=i);
function show(i){
 state.at=i;save();const n=course.nodes[i];el('steps').value=i;
 el('progress').max=course.nodes.length;el('progress').value=state.done.length;
 el('status').textContent='Пройдено '+state.done.length+' из '+course.nodes.length+' · '+n.format;
 el('topic').textContent=n.title;el('source').textContent='Оригинал · PDF-стр. '+n.page;
 if(course.pdf)el('source').href=course.pdf+'#page='+n.page;
 for(const id of ['claims','practice','card'])el(id).replaceChildren();
 for(const c of n.claims){add(el('claims'),'p',c.text);if(c.quote!==c.text){const d=add(el('claims'),'details','');add(d,'summary','Цитата · стр. '+n.page);add(d,'blockquote',c.quote)}}
 const q=n.quiz;if(q){const section=el('practice');add(section,'h2','Проверь себя');add(section,'p',q.question);const form=add(section,'form','');let field;
 if(q.options){field=add(form,'select','');add(field,'option','Выберите ответ').value='';q.options.forEach((v,j)=>add(field,'option',v).value=j)}else field=add(form,'input','');
 field.required=true;field.setAttribute('aria-label','Ответ');add(form,'button','Проверить');const out=add(form,'output','');out.setAttribute('aria-live','polite');form.onsubmit=e=>{e.preventDefault();const ok=field.value.trim().toLocaleLowerCase('ru')===String(q.answer).toLocaleLowerCase('ru');out.textContent=(ok?'Верно. ':'Ответ: '+(q.options?q.options[q.answer]:q.answer)+'. ')+q.why}}
 if(n.card){add(el('card'),'h2','Карточка для повторения');const d=add(el('card'),'details','');add(d,'summary',n.card.front);add(d,'p',n.card.back)}
 el('prev').disabled=i===0;el('next').disabled=i===course.nodes.length-1;el('done').disabled=state.done.includes(n.id);
}
el('steps').onchange=e=>show(Number(e.target.value));el('prev').onclick=()=>show(state.at-1);el('next').onclick=()=>show(state.at+1);el('done').onclick=()=>{state.done.push(course.nodes[state.at].id);show(state.at)};show(state.at);
</script></html>

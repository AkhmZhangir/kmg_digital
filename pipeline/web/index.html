<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QABAT</title>
  <link rel="stylesheet" href="web/vendor/katex.min.css">
  <link rel="stylesheet" href="web/style.css?v=7">
</head>
<body>
  <a class="skip" href="#reader">К учебному материалу</a>
  <header class="topbar">
    <a class="brand" href="/"><i aria-hidden="true"></i>QABAT</a>
    <a class="homeLink" href="/">На главную</a>
    <div class="topActions">
      <button id="toggleSources" aria-controls="sourcesPanel" aria-expanded="true">Источники</button>
      <button id="toggleStudio" aria-controls="studioPanel" aria-expanded="true">Студия</button>
      <button id="theme" aria-pressed="false">Тёмная тема</button>
    </div>
  </header>
  <main>
    <section class="cover">
      <canvas aria-hidden="true"></canvas>
      <div>
        <small id="author"></small>
        <h1 id="title"></h1>
        <span id="meta"></span>
      </div>
    </section>
    <nav id="mobileNav" aria-label="Панели тетради"></nav>
    <div class="columns" id="workspace">
      <aside id="sourcesPanel" aria-labelledby="sourcesTitle" tabindex="-1">
        <div class="panelContents">
          <div class="panelHeader"><h2 id="sourcesTitle">Источники</h2></div>
          <section id="libraryNav" class="libraryNav" aria-labelledby="libraryTitle" hidden>
            <div class="panelHeader"><h3 id="libraryTitle">Библиотеки</h3><button id="newLibrary">＋ Создать</button></div>
            <ul id="libraryList" class="libraryList"></ul>
            <p id="libraryStatus" class="muted" role="status"></p>
          </section>
          <section id="documentsNav" class="documentsNav" aria-labelledby="documentsTitle" hidden>
            <h3 id="documentsTitle">Документы</h3>
            <div id="documentsLink"></div>
          </section>
          <div class="sourceActions">
            <button id="addSource">＋ Добавить источник</button>
            <button id="addFolder" hidden>▱ Создать папку</button>
          </div>
          <input id="sourceFiles" type="file" accept=".pdf,.docx,.txt,.md" multiple hidden>
          <p id="sourceStatus" class="muted" role="status"></p>
          <div id="book" class="book"></div>
          <div id="localSources"></div>
          <div id="sourcePreview" hidden tabindex="-1"></div>
          <h3 id="routeTitle">Маршрут</h3>
          <nav id="route" aria-label="Шаги урока"></nav>
          <label for="progress" id="progressLabel"></label>
          <progress id="progress"></progress>
        </div>
        <div class="panelGrip" id="resizeSources" role="separator" aria-label="Ширина панели источников" aria-controls="sourcesPanel" aria-orientation="vertical" tabindex="0"></div>
      </aside>

      <section class="paper" id="reader" tabindex="-1" aria-label="Учебное пространство">
        <div class="tutorHeader">
          <h2>ИИ-тьютор</h2>
          <div class="workspaceTabs" role="group" aria-label="Учебное пространство">
            <button id="showLesson" aria-pressed="true" aria-controls="lessonPane">Учебник</button>
            <button id="showChat" aria-pressed="false" aria-controls="chatPane">Чаты</button>
          </div>
        </div>
        <div id="lessonPane">
          <div class="tools" id="toolbar"></div>
          <div id="content"></div>
        </div>
        <section id="chatPane" aria-label="Чаты" hidden>
          <div id="chatModes" class="modeControls" role="group" aria-label="Режим тьютора"></div>
          <div class="chatContext"><small id="chatLesson"></small><small id="chatSources"></small></div>
          <div class="chatIntro">
            <h3 id="chatHeading"></h3>
            <p id="chatHelp"></p>
            <div id="chatSuggestions" class="modeControls" aria-label="Подсказки для вопроса"></div>
          </div>
          <div id="chatLog" aria-live="polite"></div>
          <form id="chatForm">
            <label for="chatDraft">Вопрос тьютору</label>
            <textarea id="chatDraft" maxlength="4000" rows="3" placeholder="Напиши вопрос по материалам…" aria-describedby="chatStatus"></textarea>
            <div class="composerFooter">
              <small id="chatStatus" role="status">Модель пока не подключена. Черновик можно сохранить.</small>
              <button class="primary" type="submit" disabled>Отправить</button>
            </div>
          </form>
        </section>
      </section>

      <aside class="lab" id="studioPanel" aria-labelledby="studioTitle" tabindex="-1">
        <div class="panelContents">
          <div class="panelHeader"><h2 id="studioTitle">Учебная студия</h2></div>
          <div id="tools"></div>
          <details class="studioExtra">
            <summary>Поиск по главам</summary>
            <form id="search">
              <label class="sr" for="query">Термин или фраза</label>
              <input id="query" type="search" maxlength="120" placeholder="Термин или фраза" required>
              <button>Найти</button>
            </form>
            <div id="results" aria-live="polite"></div>
          </details>
          <details class="studioExtra">
            <summary>Моя заметка</summary>
            <label class="sr" for="note">Заметка к текущему шагу</label>
            <textarea id="note" rows="4" placeholder="Что важно запомнить?"></textarea>
            <small id="saved" role="status"></small>
          </details>
        </div>
        <div class="panelGrip" id="resizeStudio" role="separator" aria-label="Ширина панели студии" aria-controls="studioPanel" aria-orientation="vertical" tabindex="0"></div>
      </aside>
    </div>
  </main>
  <script type="application/json" id="layer">__LAYER__</script>
  <script src="web/vendor/katex.min.js"></script>
  <script src="web/cover.js"></script>
  <script src="web/space-dialog.js"></script>
  <script src="web/app.js?v=4"></script>
  <script src="web/lab-viewer.js?v=2"></script>
  <script src="web/laboratory.js"></script>
  <script src="web/lab-workspace.js"></script>
  <script src="web/lab-models.js"></script>
  <script src="web/source-tree.js?v=3"></script>
  <script src="web/assessment.js?v=2"></script>
  <script src="web/workspace.js?v=3"></script>
  <script src="web/video.js"></script>
</body>
</html>

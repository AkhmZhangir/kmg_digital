 25, "by": "model"}, {"text": "Информативность испытаний снижается при неблагоприятном факторе времени и нарушении режима бурения, вызывая глубокое проникновение и изоляцию.", "claims": ["part3-1.c12"], "page": 25, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "В текстах главы числовые значения параметров не приводятся, используются формульные индексы и ссылки на литературу.", "claims": ["part3-1.c8"], "page": 25, "by": "model"}], "formulas": [{"latex": "\\frac{K_{up}h_{\\phi}}{\\mu}", "page": 25, "vars": [{"sym": "K_{up}", "meaning": "коэффициент проницаемости", "unit": ""}, {"sym": "h_{\\phi}", "meaning": "эффективная толщина / мощность", "unit": ""}, {"sym": "\\mu", "meaning": "вязкость жидкости", "unit": ""}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Диаграммы газометрии (содержание тяжелых углеводородов и метана, люминесценция), данные испытателей пластов на трубах и кабеле (КИИ, ОПТ), комплексные геофизические данные.", "output": "Характер насыщения коллекторов, гидродинамические параметры, профиль проницаемости по мощности, тип коллектора, положение газовых шапок, нефтяных оторочек и переходных зон.", "breaks": [{"text": "Аномалии газометрии пропадают при высокой проницаемости с репрессией или тяжелой вязкой нефти; возникают ложные аномалии метана в покрышках и водоносных пластах.", "claims": ["part3-1.c5", "part3-1.c6"], "page": 25, "by": "model"}, {"text": "Информативность испытаний резко падает при неблагоприятном факторе времени и нарушении режима бурения из-за глубокого проникновения.", "claims": ["part3-1.c12"], "page": 25, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Данные газометрии и испытателей пластов можно использовать как независимые признаки в ансамбле моделей машинного обучения для верификации геофизических прогнозов насыщения.", "claims": ["part3-1.c1", "part3-1.c7"], "page": 25, "by": "model"}]}, "analogy": {"text": "Прямые методы газометрии и испытателей пластов работают как независимые датчики или проверочные тест-кейсы (юнит-тесты), которые запускаются, когда основной пайплайн классификации (геофизика) дает сбой или неопределенный результат.", "breaks_where": "В отличие от программных тестов, физические тесты в скважине (испытатели пластов) меняют состояние самой системы и зависят от механических факторов бурения и времени."}, "now_practice": [], "layers": {"mechanism": [{"text": "Газометрия фиксирует состав газа и люминесценцию в буровом растворе, а испытатели пластов измеряют гидродинамические характеристики в разрезе.", "claims": ["part3-1.c2", "part3-1.c4", "part3-1.c7"], "page": 25, "by": "model"}], "practice": [{"text": "Методы применяются в комплексе с промысловой геофизикой для оперативной интерпретации и подсчета запасов.", "claims": ["part3-1.c8", "part3-1.c11"], "page": 25, "by": "model"}], "nuances": [{"text": "Существуют факторы маскировки аномалий (репрессия, вязкая нефть) и факторы появления ложных аномалий (покрышки, растворенный газ).", "claims": ["part3-1.c5", "part3-1.c6"], "page": 25, "by": "model"}], "deeper": [{"text": "Неблагоприятный фактор времени и нарушение режима бурения приводят к глубокому проникновению фильтраца и гидродинамической изоляции пласта.", "claims": ["part3-1.c12"], "page": 25, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part3-1.ill1", "class": "B", "src": "media/vendelshtein.part3-1-links.svg", "alt": "Карта шага: на что он опирается и куда ведёт: Оценка характера насыщения коллектора", "caption": "Карта шага: на что он опирается и куда ведёт", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "part3-1.c1", "kind": "observation", "text": "Для установления продуктивности при сбое геофизики используют газометрию и испытатели пластов.", "quote": "Если определить характер насыщения отдельных коллекторов в разрезе данной скважины по геофизическим материалам не удается, для установления продуктивности коллекторов используют данные прямых методов — газометрии, испытателей пластов на трубах и кабеле", "unit": "u025-05", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c2", "kind": "observation", "text": "Нефтеносные коллекторы на газометрии отмечаются аномалией тяжелых углеводородов в растворе.", "quote": "На диаграммах газометрии скважин нефтеносные коллекторы отмечаются аномалией повышенного содержания в глинистом растворе тяжелых компонентов углеводородов", "unit": "u025-06", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c3", "kind": "observation", "text": "Газоносные коллекторы на газометрии отмечаются аномалией метановой фракции.", "quote": "газоносные же коллекторы — аномалией повышенного содержания метановой фракции.", "unit": "u025-06", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c4", "kind": "observation", "text": "Для нефтеносных коллекторов характерна люминесценция раствора и шлама без нефтяных добавок в рецептуре.", "quote": "Для нефтеносных коллекторов характерна также люминесценция глинистого раствора и шлама, если она не обусловлена присутствием в растворе добавок нефти в соответствии с его рецептурой.", "unit": "u025-06", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c5", "kind": "observation", "text": "Аномалии газометрии отсутствуют или малы при высокой проницаемости с репрессией и вязкой нефти.", "quote": "Аномалии на диаграммах газометрии могут отсутствовать или быть незначительными: 1) при бурении высокопроницаемых нефтеносных и газоносных коллекторов со значительной репрессией; 2) при вскрытии нефтеносных коллекторов с тяжелой вязкой нефтью.", "unit": "u025-06", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c6", "kind": "observation", "text": "Ложные аномалии метана бывают в покрышках над газом и водоносных пластах с растворенным газом.", "quote": "Ложные аномалии метановой фракции, не соответствующие газоносному коллектору, наблюдаются: а) в породах-покрышках, расположенных непосредственно над газовой залежью; б) в водоносных коллекторах с высоким содержанием растворенных углеводородных газов", "unit": "u025-06", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c7", "kind": "observation", "text": "Испытатели пластов определяют характер насыщения и решают сложные задачи в открытом стволе.", "quote": "Эти весьма эффективные методы изучения коллекторов позволяют при благоприятных условиях не только определять характер насыщения коллектора в открытом стволе, но и решать более сложные задачи.", "unit": "u025-07", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c8", "kind": "observation", "text": "Аппаратура КИИ определяет гидродинамический параметр K_{up}h_{\\phi}/\\mu, а с геофизикой — K_{up} и тип.", "quote": "По данным испытаний аппаратурой КИИ определяют гидродинамический параметр  \\( K_{up}h_{\\phi}/\\mu \\)  (где  \\( \\mu \\)  - вязкость жидкости), а в комплексе с геофизическими- данными рассчитывают коэффициенты проницаемости  \\( K_{up} \\)  и устанавливают тип коллектора.", "unit": "u025-07", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c9", "kind": "observation", "text": "Приборы ОПТ дают детальный профиль проницаемости по мощности.", "quote": "На основании результатов исследований приборами ОПТ получают детальный профиль проницаемости (по мощности) коллектора.", "unit": "u025-08", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c10", "kind": "observation", "text": "КИИ и ОПТ уточняют насыщение, газовые шапки, оторочки и переходные зоны.", "quote": "По данным КИИ и ОПТ уточняют характер насыщения коллектора по всему этажу нефтегазоносности, устанавливают положение газовой шапки в нефтяной залежи, нефтяной оторочки в газовой залежи, переходную зону в водоплавающей части залежи и т. п.", "unit": "u025-08", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c11", "kind": "observation", "text": "Эффективность испытателей обеспечивается объектами по геофизике и совместным анализом.", "quote": "Эффективность использования испытателей пластов при решении задач оперативной интерпретации, и особенно при подсчете запасов, обеспечивается при условии, если объекты испытания намечаются по данным промысловой геофизики, а результаты испытаний анализируются совместно с материалами полного комплекса геофизических исследований", "unit": "u025-08", "page": 25, "by": "model", "verified": true}, {"id": "part3-1.c12", "kind": "observation", "text": "Информативность испытаний падает при плохом времени и режиме бурения, вызывая проникновение и изоляцию.", "quote": "Информативность испытаний, как и при геофизических исследованиях скважин, резко снижается при неблагоприятном факторе времени и несоблюдении условий оптимального режима бурения, в результате чего возникают глубокие проникновения в коллектор и практически полная его гидродинамическая изоляция от скважины.", "unit": "u025-09", "page": 25, "by": "model", "verified": true}], "term_ids": ["t-gas-logging-mud-logging", "t-drill-stem-tester-wireline-formation-tester", "t-formation-tester-equipment", "t-permeability-profiling-equipment"], "units": ["u025-05", "u025-06", "u025-07", "u025-08", "u025-09"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "vendelshtein.part3-2", "order": 19, "part_id": "p3", "minutes": 3, "title": "Определение эффективной мощности коллекторов. установление в", "book_title": "ОПРЕДЕЛЕНИЕ ЭФФЕКТИВНОЙ МОЩНОСТИ КОЛЛЕКТОРОВ. УСТАНОВЛЕНИЕ ВОДОНЕФТЯНОГО И ГАЗОЖИДКОСТНОГО КОНТАКТОВ", "pages": [25, 26], "difficulty": {"primary": "Пр", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет. Текст содержит строгие определения процедур и геофизических зависимостей, которые удобно представить в виде структурированного описания алгоритма.", "scene_template": "step-flow"}, "summary": [{"text": "Эффективная мощность коллектора определяется по материалам геофизики, причем для тонких и неоднородных пластов применяются специальные расчетные методики.", "claims": ["part3-2.c1", "part3-2.c2"], "page": 25, "by": "model"}, {"text": "Положение водонефтяного контакта устанавливается по методу сопротивлений, учитывая переходную зону из-за влияния капиллярных сил.", "claims": ["part3-2.c3"], "page": 26, "by": "model"}], "how_it_works": [{"text": "Эффективная мощность продуктивного коллектора h_ф находится по материалам промысловой геофизики.", "claims": ["part3-2.c1"], "page": 25, "by": "model"}, {"text": "В однородном пласте границы h_ф устанавливаются по диаграммам геофизических методов по известным правилам.", "claims": ["part3-2.c2"], "page": 25, "by": "model"}, {"text": "Для тонких однородных пластов истинная мощность h получается по зависимостям между фиктивной h_ф и истинной мощностью.", "claims": ["part3-2.c4"], "page": 25, "by": "model"}, {"text": "В неоднородном пласте из общей мощности исключают прослои-неколлекторы, выделяемые по микроэлектрическим методам и комплексу геофизики.", "claims": ["part3-2.c5"], "page": 25, "by": "model"}, {"text": "Прослои глин отмечают по диаграммам СП, ГМ и каверномера.", "claims": ["part3-2.c6"], "page": 25, "by": "model"}, {"text": "В переслаиваниях очень тонких прослоев эффективная мощность определяется одновременно с коэффициентом нефтегазонасыщения по методике анизотропина.", "claims": ["part3-2.c7"], "page": 25, "by": "model"}, {"text": "Эффективную мощность слоистых глинистых коллекторов оценивают по связи площади аномалии СП (Ω_СП) и относительного содержания глинистых прослоев (χ_r).", "claims": ["part3-2.c8"], "page": 25, "by": "model"}, {"text": "Способ наиболее эффективен при сходстве удельных сопротивлений прослоев, вмещающих пород и глинистого раствора.", "claims": ["part3-2.c9"], "page": 25, "by": "model"}, {"text": "Положение водонефтяного контакта (ВНК) определяют по методу сопротивлений для водоплавающих нефтяных залежей.", "claims": ["part3-2.c3"], "page": 26, "by": "model"}, {"text": "Переходная зона обусловлена влиянием капиллярных сил на распределение воды в нижней части нефтенасыщенного коллектора.", "claims": ["part3-2.c10"], "page": 26, "by": "model"}, {"text": "Для водонефтяной части характерны зона максимального нефтенасыщения и переходная зона с меняющимися параметрами.", "claims": ["part3-2.c11"], "page": 26, "by": "model"}], "steps": [{"text": "Выделение границ пласта-коллектора по диаграммам геофизических методов.", "claims": ["part3-2.c2"], "page": 25, "by": "model"}, {"text": "Исключение прослоев-неколлекторов в неоднородных пластах на основе микроэлектрических методов и комплекса ГИС.", "claims": ["part3-2.c5"], "page": 25, "by": "model"}, {"text": "Расчет истинной мощности для тонких пластов по палеточным зависимостям или определение параметров через методику анизотропина.", "claims": ["part3-2.c4", "part3-2.c7"], "page": 25, "by": "model"}], "examples": [], "numbers": [{"text": "Для тонких пластов используются зависимости между фиктивной h_ф и истинной h мощностью (рис. 30, 31).", "claims": ["part3-2.c4"], "page": 25, "by": "model"}], "formulas": [{"latex": "H_{\\phi} = H(1 - \\chi_Э)", "page": 25, "vars": [{"sym": "H_{\\phi}", "meaning": "эффективная мощность", "unit": "м"}, {"sym": "H", "meaning": "общая мощность", "unit": "м"}, {"sym": "\\chi_Э", "meaning": "относительное содержание глинистых прослоев", "unit": "доли единицы"}]}], "tables": [], "misconception": {"wrong": "Водонефтяной контакт всегда резкая плоская граница.", "right": [{"text": "Переход между нефтенасыщенным коллектором и водоносной частью является постепенным из-за влияния капиллярных сил.", "claims": ["part3-2.c10"], "page": 26, "by": "model"}]}, "data_meaning": {"input": "Диаграммы промысловой геофизики (КС, микроэлектрические методы, СП, ГМ, каверномер).", "output": "Значения эффективной мощности (h_ф), положение водонефтяного контакта (ВНК).", "breaks": [{"text": "Методы могут давать сбои в разрезах с ультратонкими переслаиваниями неколлекторов или при сильном влиянии глинистости.", "claims": ["part3-2.c7"], "page": 25, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Алгоритмы автоматического выделения h_ф можно построить на пороговой фильтрации кривых каротажа аналогично обработке сигналов временных рядов.", "claims": ["part3-2.c2"], "page": 25, "by": "model"}]}, "analogy": {"text": "Определение эффективной мощности по кривым каротажа похоже на пороговую фильтрацию зашумленного сигнала в электронике для выделения полезных импульсов.", "breaks_where": "Физическая природа сигналов под землей обусловлена сложным распределением пористости и насыщения, а не электрическими цепями."}, "now_practice": [{"text": "Сегодня ручной анализ диаграмм для оценки h_ф и ВНК полностью автоматизирован в специализированных программных пакетах петрофизической интерпретации.", "claims": ["part3-2.c1", "part3-2.c2"], "page": 25, "by": "model"}], "layers": {"mechanism": [{"text": "Капиллярные силы удерживают воду в порах нижней части нефтенасыщенного коллектора, формируя переходную зону.", "claims": ["part3-2.c10"], "page": 26, "by": "model"}], "practice": [{"text": "Для оценки мощности слоистых глинистых коллекторов используют площадь аномалии СП.", "claims": ["part3-2.c8"], "page": 25, "by": "model"}], "nuances": [{"text": "В тонких пластах фиктивная мощность отличается от истинной, что требует применения специальных переводных графиков.", "claims": ["part3-2.c4"], "page": 25, "by": "model"}], "deeper": [{"text": "При наличии ультратонкого переслаивания применяют расчетную методику анизотропина одновременно с оценкой нефтегазонасыщения.", "claims": ["part3-2.c7"], "page": 25, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part3-2.ill1", "class": "B", "src": "media/vendelshtein.part3-2-steps.svg", "alt": "Порядок действий по тексту автора: Определение эффективной мощности коллекторов. установление в", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "vendelshtein.part3-2.ill2", "class": "B", "src": "media/vendelshtein.part3-2-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Определение эффективной мощности коллекторов. установление в", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "vendelshtein.part3-1", "type": "prerequisite"}], "claims": [{"id": "part3-2.c1", "kind": "observation", "text": "Эффективная мощность h_ф находится по материалам промысловой геофизики.", "quote": "Эффективная мощность продуктивного коллектора \\( h_{\\phi} \\)  — один из подсчетных параметров, который при подсчете запасов месторождений нефти и газа находят по материалам промысловой геофизики.", "unit": "u025-11", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c2", "kind": "observation", "text": "В однородном пласте границы h_ф устанавливаются по диаграммам по известным правилам.", "quote": "Величина  \\( h_{\\phi} \\)  в однородном пласте-коллекторе определяется как мощность этого пласта, границы которого устанавливаются по диаграммам геофизических методов на основании известных правил", "unit": "u025-11", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c3", "kind": "observation", "text": "Положение водонефтяного контакта определяют по методу сопротивлений.", "quote": "по данным метода сопротивлений определяют положение водонефтяного контакта (ВНК)", "unit": "u026-01", "page": 26, "by": "model", "verified": true}, {"id": "part3-2.c4", "kind": "observation", "text": "Для тонких пластов истинная мощность находится по фиктивной мощности.", "quote": "Для тонких однородных пластов истинную мощность h получают на основании зависимостей между фиктивной  \\( h_{\\phi} \\)  и истинной h мощностью по заданной величине  \\( h_{\\phi} \\)", "unit": "u025-11", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c5", "kind": "observation", "text": "В неоднородном пласте из общей мощности исключают прослои-неколлекторы.", "quote": "В неоднородном пласте-коллекторе, содержащем прослои неколлектора, для расчета  \\( h_{\\phi} \\)  из общей мощности пласта исключают мощность прослоев-неколлекторов.", "unit": "u025-12", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c6", "kind": "observation", "text": "Прослои глин отмечают по СП, ГМ и каверномеру.", "quote": "Прослои глин отмечают по диаграммам СП, ГМ и каверномера.", "unit": "u025-12", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c7", "kind": "observation", "text": "Эффективная мощность тонких переслаиваний определяется по методу анизотропина.", "quote": "Эффективная мощность таких объектов, равная суммарной мощности всех нефтегазонасыщенных прослоев коллектора, определяется расчетным путем одновременно с коэффициентом нефтегазонасыщения по специальной методике (анизотропин)", "unit": "u025-13", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c8", "kind": "observation", "text": "Мощность слоистых глинистых коллекторов оценивают по площади аномалии СП.", "quote": "Эффективную мощность слоистых глинистых коллекторов можно оценить, используя связь между площадью аномалии СП ( \\( \\Omega_{СП} \\) ) в пачке и относительным содержанием по мощности глинистых прослоев  \\( \\chi_{r} \\)", "unit": "u025-14", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c9", "kind": "observation", "text": "Способ эффективен при сходстве удельных сопротивлений прослоев и растворов.", "quote": "Применение способа наиболее эффективно при сходстве удельных сопротивлений переслаивающихся  \\( \\rho_{m} \\) ,  \\( \\rho_{r} \\) , вмещающих ρин пород и глинистого раствора ρр", "unit": "u025-14", "page": 25, "by": "model", "verified": true}, {"id": "part3-2.c10", "kind": "inference", "text": "Переходная зона объясняется влиянием капиллярных сил.", "quote": "Это объясняется влиянием капиллярных сил на распределение воды в порах нижней части нефтенасыщенного коллектора.", "unit": "u026-01", "page": 26, "by": "model", "verified": true}, {"id": "part3-2.c11", "kind": "observation", "text": "Для водонефтяной части характеры зоны максимального нефтенасыщения и переходная.", "quote": "Таким образом, в коллекторе для водонефтяной части залежи характерно наличие зоны максимального нефтенасыщения (максимальные значения ρп и Кп, минимальные - Кв), переходная зона", "unit": "u026-01", "page": 26, "by": "model", "verified": true}], "term_ids": ["t-net-pay-thickness"], "units": ["u025-11", "u025-12", "u025-13", "u025-14", "u026-01", "u026-02", "u026-03", "u026-04"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.part3-3", "order": 20, "part_id": "p3", "minutes": 3, "title": "Определение эффективной мощности коллекторов. установление в", "book_title": "ОПРЕДЕЛЕНИЕ ЭФФЕКТИВНОЙ МОЩНОСТИ КОЛЛЕКТОРОВ. УСТАНОВЛЕНИЕ ВОДОНЕФТЯНОГО И ГАЗОЖИДКОСТНОГО КОНТАКТОВ", "pages": [26, 27], "difficulty": {"primary": "Н", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «неопределённость, решение»; критериев видеоёмкости нет. текст с элементами схем и таблиц оптимален для объяснения инженерных методик интерпретации каротажа и работы с палетками.", "scene_template": "decision-scale"}, "summary": [{"text": "Для определения истинной мощности пласта по каротажным данным используют палетки В. Н. Дахнова, учитывающие геометрию и физические свойства пород.", "claims": ["part3-3.c1"], "page": 26, "by": "model"}, {"text": "Положение водонефтяного контакта определяют с учетом переходной зоны, верхняя граница которой дает безводную нефть, а нижняя служит зеркалом воды.", "claims": ["part3-3.c2"], "page": 27, "by": "model"}], "how_it_works": [{"text": "Палетки В. Н. Дахнова связывают фиктивную мощность пласта с истинной через зависимости для различных зон и методов исследования.", "claims": ["part3-3.c1", "part3-3.c3"], "page": 26, "by": "model"}, {"text": "Границами переходной зоны являются подошва зоны предельного нефтенасыщения вверху и зеркало воды внизу.", "claims": ["part3-3.c4"], "page": 27, "by": "model"}, {"text": "В верхней части переходной зоны получают приток нефти с водой, а границу промышленного притока принимают за водонефтяной контакт.", "claims": ["part3-3.c5", "part3-3.c6"], "page": 27, "by": "model"}, {"text": "Мощность коллектора между ВНК и кровлей переходной зоны включают в эффективную мощность для подсчета запасов.", "claims": ["part3-3.c7"], "page": 27, "by": "model"}], "steps": [{"text": "Определить фиктивную мощность пласта по геофизическим диаграммам.", "claims": ["part3-3.c1", "part3-3.c3"], "page": 26, "by": "model"}, {"text": "Использовать палетки В. Н. Дахнова для перехода к истинной мощности пласта.", "claims": ["part3-3.c1", "part3-3.c3"], "page": 26, "by": "model"}, {"text": "Установить границы переходной зоны по данным сопротивлений и характеру притоков.", "claims": ["part3-3.c4", "part3-3.c5", "part3-3.c6"], "page": 27, "by": "model"}, {"text": "Выделить эффективную мощность коллектора от кровли переходной зоны до ВНК для подсчета запасов.", "claims": ["part3-3.c7"], "page": 27, "by": "model"}], "examples": [], "numbers": [{"text": "В материалах приведены шифры кривых и параметры для палеток ВК-3, ВК-7, 6Ф1, 5Ф1,2, а также для аномалий U_СП и радиоактивных методов.", "claims": ["part3-3.c3", "part3-3.c8"], "page": 26, "by": "model"}], "formulas": [], "tables": [], "misconception": {"wrong": "Водонефтяной контакт всегда резкая плоская граница.", "right": [{"text": "Между нефтенасыщенной и водоносной частями существует переходная зона с переменным насыщением, а ВНК принимается по уровню промышленного притока нефти с водой.", "claims": ["part3-3.c4", "part3-3.c5", "part3-3.c6"], "page": 27, "by": "model"}]}, "data_meaning": {"input": "Каротажные кривые сопротивлений, спонтанной поляризации и радиоактивных методов, а также результаты испытаний скважин.", "output": "Истинная мощность пласта, положение водонефтяного контакта и эффективная мощность коллектора.", "breaks": [{"text": "Модель может давать сбои в сложных переходных зонах, при размытых границах аномалий или несоответствии параметров палеток реальным геофизическим условиям скважины.", "claims": ["part3-3.c3", "part3-3.c6"], "page": 26, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Палетки Дахнова можно автоматизировать в виде lookup-таблиц или нейросетевых интерполяторов для массовой обработки кривых каротажа.", "claims": ["part3-3.c3"], "page": 26, "by": "model"}]}, "analogy": {"text": "Палетка работает как калибровочная кривая или lookup-таблица в ML, переводящая зашумленные «сырые» фичи (фиктивную мощность) в целевой бизнес-показатель (истинную мощность).", "breaks_where": "Физические законы фильтрации и растекания токов в породе сложнее простых математических табличных соответствий, поэтому палетка имеет ограничения применимости."}, "now_practice": [{"text": "Сегодня сопоставление фиктивных и истинных мощностей, а также расчет эффективных толщин и ВНК выполняются в специализированном ПО интерпретации геофизических данных с использованием цифровых палеток и алгоритмов оптимизации.", "claims": ["part3-3.c1", "part3-3.c3", "part3-3.c7"], "page": 26, "by": "model"}], "layers": {"mechanism": [{"text": "Геофизические приборы регистрируют аномалии поля с искажениями, зависящими от геометрии пласта и скважины, что требует пересчета фиктивной мощности в истинную.", "claims": ["part3-3.c1", "part3-3.c3"], "page": 26, "by": "model"}], "practice": [{"text": "На практике геологи выделяют переходную зону между нефтью и водой, сопоставляя кривые сопротивлений и данные испытаний пластов.", "claims": ["part3-3.c4", "part3-3.c5", "part3-3.c6"], "page": 27, "by": "model"}], "nuances": [{"text": "Верхняя граница переходной зоны дает безводную нефть, а нижняя — зеркало воды, но для подсчета запасов критически важно правильно провести ВНК по порогу промышленного притока.", "claims": ["part3-3.c5", "part3-3.c6", "part3-3.c7"], "page": 27, "by": "model"}], "deeper": [{"text": "Методики В. Н. Дахнова учитывают соотношения удельных сопротивлений и параметры зон проникновения для точной оценки емкостных свойств коллекторов.", "claims": ["part3-3.c1", "part3-3.c3", "part3-3.c8"], "page": 26, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part3-3.ill1", "class": "B", "src": "media/vendelshtein.part3-3-steps.svg", "alt": "Порядок действий по тексту автора: Определение эффективной мощности коллекторов. установление в", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "vendelshtein.part3-2", "type": "prerequisite"}], "claims": [{"id": "part3-3.c1", "kind": "observation", "text": "Палетка Дахнова определяет истинную мощность h по фиктивной h_ф.", "quote": "Палетка для определения истинной мощности h пласта по ее фиктивному значению hф (по В. Н. Дахнову)", "unit": "u026-05", "page": 26, "by": "model", "verified": true}, {"id": "part3-3.c2", "kind": "observation", "text": "Границами переходной зоны являются подошва и зеркало воды.", "quote": "Границами переходной зоны являются: вверху – подош внизу – зеркало воды", "unit": "u027-03", "page": 27, "by": "model", "verified": true}, {"id": "part3-3.c3", "kind": "observation", "text": "Приведены зависимости для различных зондов ВК и радиоактивных методов.", "quote": "3aBnCIMocTH: \\(1 - \\mathrm{h}_{\\phi} / \\mathrm{h} = \\mathrm{f}(\\mathrm{h} / \\mathrm{d}_{\\mathrm{c}})\\) IJIa BK-3 \\((\\mathrm{d}_{\\mathrm{c}} / \\mathrm{d}_{\\mathrm{c}} > 0,5;10 \u003c   \\rho_{\\mathrm{r}} / \\rho_{\\mathrm{f}} \u003c   1000)\\)\n\\(2 - \\mathrm{h}\\phi /\\mathrm{l}_{0} = \\mathrm{f}(\\mathrm{h} / \\mathrm{l}_{0})\\) IJIa BK-7; \\(3 - \\mathrm{h}_{\\phi} / \\mathrm{l}_{\\mathrm{a}} = \\mathrm{f}(\\mathrm{h}_{\\phi} / \\mathrm{l}_{\\mathrm{a}})\\) IJIa 6Φ1;\n4-TO JKe, IJIa 5Φ1,2", "unit": "u026-06", "page": 26, "by": "model", "verified": true}, {"id": "part3-3.c4", "kind": "observation", "text": "Выделены зона предельного нефтенасыщения, переходная зона и водоносный коллектор.", "quote": "1 – зона предельного нефтенасыщения; 2 – зона недонасыщения (переходная); 3 – водоносный коллектор", "unit": "u027-04", "page": 27, "by": "model", "verified": true}, {"id": "part3-3.c5", "kind": "observation", "text": "При испытании переходной зоны получают приток нефти с водой или эмульсию.", "quote": "При испытании переходной зоны в верхней части получают приток нефти с различным процентным содержанием воды, в нижней части – водонефтяную эмульсию или воду с пленкой нефти.", "unit": "u027-06", "page": 27, "by": "model", "verified": true}, {"id": "part3-3.c6", "kind": "observation", "text": "За водонефтяной контакт принимают границу возможного промышленного притока нефти с водой.", "quote": "Границу в переходной зоне, выше которой при испытании возможен промышленный приток нефти с водой, принимают за водонефтяной контакт", "unit": "u027-06", "page": 27, "by": "model", "verified": true}, {"id": "part3-3.c7", "kind": "observation", "text": "Мощность между ВНК и кровлей переходной зоны включают в эффективную.", "quote": "мощность коллектора, заключенную между ВНК и кровлей переходной зоны, включают в эффективную и учитывают при подсчете запасов.", "unit": "u027-06", "page": 27, "by": "model", "verified": true}, {"id": "part3-3.c8", "kind": "observation", "text": "Для аномалий U_СП и радиоактивных методов используются соответствующие зависимости.", "quote": "палетки для определения истинной мощности h по ее фиктивному значению h_0 пласта, отмечаемого аномалиями U_CII (a) и радиоактивных методов (б)", "unit": "u027-01", "page": 27, "by": "model", "verified": true}], "term_ids": ["t-interpretation-chart", "t-transition-zone"], "units": ["u026-05", "u026-06", "u027-01", "u027-02", "u027-03", "u027-04", "u027-05", "u027-06"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.part3-4", "order": 21, "part_id": "p3", "minutes": 3, "title": "Определение эффективной мощности коллекторов. установление в", "book_title": "ОПРЕДЕЛЕНИЕ ЭФФЕКТИВНОЙ МОЩНОСТИ КОЛЛЕКТОРОВ. УСТАНОВЛЕНИЕ ВОДОНЕФТЯНОГО И ГАЗОЖИДКОСТНОГО КОНТАКТОВ", "pages": [27, 28], "difficulty": {"primary": "И", "secondary": null}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». Текст с описанием алгоритма и физических ограничений метода лучше всего подходит для объяснения логики интерпретации данных.", "scene_template": "tool-in-well"}, "summary": [{"text": "Определение водонефтяного контакта (ВНК) базируется на анализе изменения удельного электрического сопротивления пород по глубине. Метод требует учета критических порогов насыщения и специфики литологии для исключения ошибок, вызванных влиянием фильтрата бурового раствора.", "claims": ["part3-4.c1", "part3-4.c2"], "page": 27, "by": "model"}], "how_it_works": [{"text": "Положение ВНК определяют через график зависимости удельного сопротивления от глубины ρm = f(H). Для этого находят значения сопротивления в зоне максимального нефтенасыщения (ρmax) и в водоносном коллекторе (ρm).", "claims": ["part3-4.c1"], "page": 27, "by": "model"}, {"text": "Критическое значение сопротивления ρ*n и проницаемости K*k устанавливают на основе опробований. Они разделяют область промышленного притока нефти и область притока водонефтяной эмульсии или воды с пленкой нефти.", "claims": ["part3-4.c2"], "page": 27, "by": "model"}, {"text": "ВНК фиксируется на глубине, где текущее сопротивление ρm равно критическому значению ρ*n. Мощность переходной зоны варьируется от долей метра в чистых кварцевых песчаниках до 20–30 м в глинистых коллекторах.", "claims": ["part3-4.c3", "part3-4.c4"], "page": 27, "by": "model"}], "steps": [{"text": "1. Определение границ переходной зоны. 2. Построение графика ρm = f(H) на основе ρmax и ρm. 3. Определение критических порогов ρ*n и K*k. 4. Фиксация глубины ВНК как точки пересечения графика с порогом ρ*n.", "claims": ["part3-4.c1", "part3-4.c2"], "page": 27, "by": "model"}], "examples": [], "numbers": [{"text": "Мощность переходной зоны составляет от долей метра до 20–30 м. Расстояние между зеркалом воды и ВНК колеблется от долей метра до 5 м и более. Ошибка при определении ВНК без учета гравитационного перераспределения флюидов может достигать 1–1,5 м.", "claims": ["part3-4.c4", "part3-4.c5"], "page": 27, "by": "model"}], "formulas": [{"latex": "\\rho_{m} = f(H)", "page": 27, "vars": [{"sym": "\\rho_{m}", "meaning": "удельное сопротивление в переходной зоне", "unit": "Ом·м"}, {"sym": "H", "meaning": "глубина", "unit": "м"}]}], "tables": [], "misconception": {"wrong": "Водонефтяной контакт всегда резкая плоская граница.", "right": [{"text": "ВНК — это не точка, а переходная зона, мощность которой зависит от типа коллектора и может достигать 30 метров.", "claims": ["part3-4.c4"], "page": 27, "by": "model"}]}, "data_meaning": {"input": "Кривые удельного электрического сопротивления (КС).", "output": "Глубина ВНК.", "breaks": [{"text": "В коллекторах с высокой вертикальной проницаемостью фильтрат бурового раствора может искажать показания сопротивления под ВНК, имитируя нефтенасыщенную породу.", "claims": ["part3-4.c5"], "page": 28, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Использование данных радиометрии в обсаженной скважине позволяет отфильтровать артефакты, вызванные проникновением фильтрата, которые не видны на методах сопротивления.", "claims": ["part3-4.c5"], "page": 28, "by": "model"}]}, "analogy": {"text": "Определение ВНК через порог ρ*n аналогично классификации данных по порогу (thresholding) в машинном обучении.", "breaks_where": "В отличие от статического порога в ИТ, критическое значение ρ*n зависит от типа коллектора и физико-химических свойств флюидов, которые меняются в пространстве."}, "now_practice": [{"text": "Сегодня для уточнения положения ВНК и исключения влияния зоны проникновения фильтрата предпочтительно использовать комплекс методов, включая радиометрию в обсаженной колонне.", "claims": ["part3-4.c5"], "page": 28, "by": "model"}], "layers": {"mechanism": [{"text": "Гравитационное перераспределение флюидов приводит к тому, что пресный фильтрат перемещается в слой под ВНК, выравнивая сопротивление с нефтенасыщенной зоной.", "claims": ["part3-4.c5"], "page": 28, "by": "model"}], "practice": [], "nuances": [], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part3-4.ill1", "class": "B", "src": "media/vendelshtein.part3-4-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Определение эффективной мощности коллекторов. установление в", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "vendelshtein.part3-3", "type": "prerequisite"}], "claims": [{"id": "part3-4.c1", "kind": "observation", "text": "Положение ВНК определяется через график зависимости сопротивления от глубины.", "quote": "Исходя из полученных значений \\( \\rho_{max} \\) ,  \\( \\rho_{m} \\) , а также линейного закона изменения удельного сопротивления  \\( \\rho_{m} \\)  переходной зоны, составляют график  \\( \\rho_{m} = f(H) \\)", "unit": "u027-07", "page": 27, "by": "model", "verified": true}, {"id": "part3-4.c2", "kind": "inference", "text": "Критические значения сопротивления определяют границу промышленного притока нефти.", "quote": "устанавливают критические значения  \\( \\rho^{*}_{n} \\)  и  \\( K^{*}_{k} \\)  для коллектора данного типа, которые соответствуют границе между областью промышленного притока нефти с различным процентным содержанием воды и областью притока водонефтяной эмульсии", "unit": "u027-07", "page": 27, "by": "model", "verified": true}, {"id": "part3-4.c3", "kind": "observation", "text": "ВНК проводят на глубине, соответствующей критическому сопротивлению.", "quote": "ВНК проводят на глубине, которой соответствует величина  \\( \\rho_{m} = \\rho^{*}_{n} \\)  на графике  \\( \\rho_{m} = f(H) \\) .", "unit": "u027-07", "page": 27, "by": "model", "verified": true}, {"id": "part3-4.c4", "kind": "observation", "text": "Мощность переходной зоны сильно зависит от типа коллектора.", "quote": "Мощность переходной зоны изменяется от долей метра для чистых кварцевых терригенных коллекторов с высокой проницаемостью (основные продуктивные горизонты месторождений Волго-Урала) до 20-30 м для глинистых полимиктовых коллекторов (Западная Сибирь)", "unit": "u027-11", "page": 27, "by": "model", "verified": true}, {"id": "part3-4.c5", "kind": "observation", "text": "Проникновение фильтрата может привести к ошибке определения ВНК на 1–1,5 м.", "quote": "Сотрудниками ТатНИИ показано, что для коллекторов основных продуктивных пластов Ромашкинского месторождения при исследовании методом сопротивлений без учета указанного явления можно понизить ВНК на 1 – 1,5 м по сравнению с истинным его положением.", "unit": "u028-01", "page": 28, "by": "model", "verified": true}], "term_ids": [], "units": ["u027-07", "u027-08", "u027-09", "u027-10", "u027-11", "u027-12", "u027-13", "u028-01"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "vendelshtein.part3-5", "order": 22, "part_id": "p3", "minutes": 3, "title": "Определение эффективной мощности коллекторов. установление в", "book_title": "ОПРЕДЕЛЕНИЕ ЭФФЕКТИВНОЙ МОЩНОСТИ КОЛЛЕКТОРОВ. УСТАНОВЛЕНИЕ ВОДОНЕФТЯНОГО И ГАЗОЖИДКОСТНОГО КОНТАКТОВ", "pages": [28, 29], "difficulty": {"primary": "Пр", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет. Текст подходит для объяснения логики статистического разделения пластов, так как требует последовательного описания условий применимости и вероятностного подхода.", "scene_template": "step-flow"}, "summary": [{"text": "Нейтронные методы в обсаженных скважинах позволяют определять характер насыщения пластов (нефть, вода, газ) и границы контактов (ВНК, ГВК) там, где электрометрия невозможна или неэффективна.", "claims": ["part3-5.c1"], "page": 28, "by": "model"}, {"text": "Для разделения водоносных и нефтеносных пластов используется статистический анализ декремента затухания тепловых нейтронов с выбором порогового значения λ*.", "claims": ["part3-5.c4"], "page": 28, "by": "model"}], "how_it_works": [{"text": "Нейтронные методы применяются в обсаженных скважинах, когда электрометрия не проводилась или имеет низкое качество, особенно при доразведке горизонтов.", "claims": ["part3-5.c1"], "page": 28, "by": "model"}, {"text": "Для корректной работы методов требуется практически полное расформирование зоны проникновения фильтрата, так как радиус исследования нейтронными методами невелик.", "claims": ["part3-5.c2"], "page": 28, "by": "model"}, {"text": "Разделение нефтеносных и водоносных пластов по нейтронным методам требует высокой минерализации поровых вод: более 20 г/л в высокопористых и значительно выше в низкопористых или глинистых коллекторах.", "claims": ["part3-5.c3"], "page": 28, "by": "model"}, {"text": "В высокопористых коллекторах (Kп > 20%) при минерализации свыше 150 г/л для разделения применяют комплекс импульсного нейтронного (ИНМ) и нейтронного гамма-метода (НГМ).", "claims": ["part3-5.c4"], "page": 28, "by": "model"}, {"text": "При статистическом подходе строится распределение декремента затухания λ. Пороговое значение λ* выбирается в зоне неоднозначности исходя из допустимого соотношения ошибок первого и второго рода.", "claims": ["part3-5.c5"], "page": 28, "by": "model"}], "steps": [{"text": "Сбор данных по скважинам с надежно установленным характером насыщения (например, по опробованию).", "claims": ["part3-5.c5"], "page": 28, "by": "model"}, {"text": "Построение кривых распределения декремента затухания λ для водоносных и нефтеносных пластов.", "claims": ["part3-5.c5"], "page": 28, "by": "model"}, {"text": "Определение области неоднозначности путем сопоставления распределений.", "claims": ["part3-5.c5"], "page": 28, "by": "model"}, {"text": "Выбор порогового значения λ* и классификация пластов: при λ > λ* пласт считается водоносным, иначе — нефтеносным.", "claims": ["part3-5.c5"], "page": 28, "by": "model"}], "examples": [], "numbers": [{"text": "Минерализация вод для разделения пластов должна быть более 20 г/л, а в специфических случаях — свыше 150 г/л. Пористость Kп > 20% считается высокой. Время задержки для визуального разделения составляет более 0,6—0,7 мс.", "claims": ["part3-5.c3", "part3-5.c4"], "page": 28, "by": "model"}], "formulas": [], "tables": [], "misconception": {"wrong": "Водонефтяной контакт всегда резкая плоская граница.", "right": [{"text": "Определение контактов часто происходит в условиях статистической неоднозначности, где пласты классифицируются на основе вероятностных распределений, а не четкой геометрической линии.", "claims": ["part3-5.c5"], "page": 28, "by": "model"}]}, "data_meaning": {"input": "Данные нейтронного каротажа (декремент затухания λ), коэффициент пористости Kп, данные опробования (метки классов).", "output": "Классификация пласта (нефтеносный/водоносный) или вероятность принадлежности к классу.", "breaks": [{"text": "Метод ломается при низкой минерализации вод, наличии нерасформированной зоны проникновения, а также при близких значениях пористости и глинистости, если данные недостаточно репрезентативны.", "claims": ["part3-5.c2", "part3-5.c3"], "page": 28, "by": "model"}], "hypotheses": [{"text": "Гипотеза: λ* можно рассматривать как порог классификатора, а область неоднозначности — как зону низкой уверенности модели (low confidence interval).", "claims": ["part3-5.c5"], "page": 28, "by": "model"}]}, "analogy": {"text": "Выбор λ* аналогичен настройке порога классификации (thresholding) в бинарной классификации, где мы балансируем между Precision и Recall (ошибками I и II рода).", "breaks_where": "В ИТ-системах порог часто фиксирован или адаптивен, тогда как в геологии он зависит от физико-химических свойств пласта (минерализация, пористость), которые могут меняться по латерали."}, "now_practice": [{"text": "Сегодня статистический анализ распределений и выбор порогов λ* обычно автоматизированы в специализированном ПО для петрофизической интерпретации, позволяющем учитывать большее количество параметров одновременно.", "claims": ["part3-5.c5"], "page": 28, "by": "model"}], "layers": {"mechanism": [{"text": "Нейтронные методы измеряют взаимодействие нейтронов с ядрами атомов среды, что позволяет косвенно оценить содержание хлора (связанного с минерализацией воды) и водородосодержание.", "claims": ["part3-5.c3"], "page": 28, "by": "model"}], "practice": [], "nuances": [{"text": "При отсутствии данных опробования для построения распределений можно использовать результаты анализа керна и расчетные значения λ для твердой фазы.", "claims": ["part3-5.c6", "part3-5.c7"], "page": 29, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part3-5.ill1", "class": "B", "src": "media/vendelshtein.part3-5-steps.svg", "alt": "Порядок действий по тексту автора: Определение эффективной мощности коллекторов. установление в", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "vendelshtein.part3-5.ill2", "class": "B", "src": "media/vendelshtein.part3-5-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Определение эффективной мощности коллекторов. установление в", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "vendelshtein.part3-4", "type": "prerequisite"}], "claims": [{"id": "part3-5.c1", "kind": "observation", "text": "Нейтронные методы в обсаженных скважинах необходимы для выделения пластов и контактов при отсутствии или низком качестве электрометрии.", "quote": "Использование измерений нейтронными методами в обсаженных трубами скважинах для выделения продуктивных пластов и определения положения ВНК и ГВК становится необходимым в случаях, когда скважина была закреплена без проведения электрометрии или результаты электрометрии невысокого ка , "text": "Декремент затухания можно рассчитать по данным химического анализа.", "quote": "По данным химического анализа следует рассчитать декремент затухания  \\( \\lambda_{ск} \\)  для твердой фазы, а зная  \\( K_{н} \\)  и  \\( K_{вог} \\)  - значения  \\( \\lambda_{вн} \\)  и  \\( \\lambda_{нн} \\)  для водоносного и нефтеносного пластов согласно формулам (III.30) и (III.30, а).", "unit": "u029-02", "page": 29, "by": "model", "verified": true}], "term_ids": ["t-thermal-neutron-decay-constant"], "units": ["u028-02", "u028-03", "u028-04", "u028-05", "u028-06", "u028-07", "u029-01", "u029-02"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.part3-6", "order": 23, "part_id": "p3", "minutes": 3, "title": "Определение эффективной мощности коллекторов. установление в", "book_title": "ОПРЕДЕЛЕНИЕ ЭФФЕКТИВНОЙ МОЩНОСТИ КОЛЛЕКТОРОВ. УСТАНОВЛЕНИЕ ВОДОНЕФТЯНОГО И ГАЗОЖИДКОСТНОГО КОНТАКТОВ", "pages": [29, 29], "difficulty": {"primary": "Н", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «неопределённость, решение»; критериев видеоёмкости нет. Текст подходит для объяснения логики коррекции данных, так как требует последовательного разбора формул и условий их применения.", "scene_template": "decision-scale"}, "summary": [{"text": "Для разделения нефтеносных и водоносных пластов при перекрывающихся значениях параметра λ применяют методы коррекции на глинистость и пористость. Надежность классификации повышается через построение графиков сопоставления λ с параметрами, чувствительными к составу породы.", "claims": ["part3-6.c1"], "page": 29, "by": "model"}], "how_it_works": [{"text": "Если диапазоны λ для разных типов насыщения пересекаются, необходимо учитывать коэффициенты глинистости (Kгл) и пористости (Kн). В простых случаях, когда один параметр стабилен или они коррелируют, используют графики сопоставления λ с показаниями метода, чувствительного к пористости или глинистости.", "claims": ["part3-6.c1"], "page": 29, "by": "model"}, {"text": "На таких графиках точки для пластов разного насыщения разделяются линией. В системе координат λ и Kн (или Kгл) разделяющая линия и линия водоносных пластов близки к прямой.", "claims": ["part3-6.c2"], "page": 29, "by": "model"}, {"text": "При независимом изменении Kн и Kгл в широких пределах, влияние одного параметра учитывают поправками, а второго — через двухмерное сопоставление λ с методом, зависящим от этого параметра.", "claims": ["part3-6.c3"], "page": 29, "by": "model"}], "steps": [{"text": "Для исправления влияния глинистости из λ вычитают поправку Δλгл, рассчитанную через Kгл и разность декрементов затухания в глинистой фракции и чистом скелете.", "claims": ["part3-6.c4", "part3-6.c5"], "page": 29, "by": "model"}, {"text": "Поправку за пористость Δλн рассчитывают аналогично, приводя значения λ к некоторому типичному значению Kн.", "claims": ["part3-6.c6", "part3-6.c7"], "page": 29, "by": "model"}], "examples": [], "numbers": [{"text": "В тексте упоминается рис. 35, иллюстрирующий линейный характер разделяющей линии в выбранной системе координат.", "claims": ["part3-6.c2"], "page": 29, "by": "model"}], "formulas": [{"latex": "\\Delta \\lambda_ {\\mathrm{гл}} = \\mathrm{K} _ {\\mathrm{гл}} (\\lambda_ {\\mathrm{гл}} - \\lambda_ {\\mathrm{гв}})", "page": 29, "vars": [{"sym": "\\Delta \\lambda_ {\\mathrm{гл}}", "meaning": "поправка за влияние глинистости", "unit": "u029-06"}, {"sym": "K_{гл}", "meaning": "коэффициент глинистости", "unit": "u029-06"}]}, {"latex": "\\Delta \\lambda_ {\\mathrm{н}} = (\\mathrm{K} _ {\\mathrm{н}} - \\mathrm{K} _ {\\mathrm{н}}) (\\lambda_ {\\mathrm{н}} - \\lambda_ {\\mathrm{гв}})", "page": 29, "vars": [{"sym": "\\Delta \\lambda_ {\\mathrm{н}}", "meaning": "поправка за влияние пористости", "unit": "u029-08"}]}], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Высокое сопротивление или другие параметры (λ) могут быть обусловлены глинистостью или пористостью, поэтому требуется комплексная интерпретация с поправками на литологию.", "claims": ["part3-6.c1"], "page": 29, "by": "model"}]}, "data_meaning": {"input": "Значения λ, Kгл, Kн.", "output": "Классификация пласта (нефтеносный/водоносный).", "breaks": [{"text": "Метод ломается, если параметры Kгл и Kн изменяются непредсказуемо и независимо, а также при выходе за пределы применимости линейной аппроксимации.", "claims": ["part3-6.c3"], "page": 29, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Использование графиков сопоставления — это ручной аналог построения решающей границы в пространстве признаков (feature space).", "claims": [], "page": 29, "by": "model"}]}, "analogy": {"text": "Поправки — это нормализация данных (feature scaling/normalization), а разделяющая линия — это линейный классификатор.", "breaks_where": "В реальности зависимости могут быть нелинейными, а «линейность» — лишь упрощение для конкретных условий."}, "now_practice": [{"text": "Сегодня подобные графические методы и ручные поправки обычно автоматизированы в ПО для интерпретации ГИС, где используются многомерные алгоритмы классификации.", "claims": [], "page": 29, "by": "model"}], "layers": {"mechanism": [{"text": "Коррекция косвенных измерений через вычитание влияния мешающих факторов (глинистость, пористость).", "claims": ["part3-6.c4"], "page": 29, "by": "model"}], "practice": [{"text": "Построение кросс-плотов для визуального разделения классов.", "claims": ["part3-6.c1"], "page": 29, "by": "model"}], "nuances": [{"text": "Необходимость приведения значений к «типичным» коэффициентам для корректного сравнения.", "claims": ["part3-6.c7"], "page": 29, "by": "model"}], "deeper": [{"text": "При независимом влиянии нескольких факторов требуется многомерный подход, а не простое вычитание поправок.", "claims": ["part3-6.c3"], "page": 29, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part3-6.ill1", "class": "B", "src": "media/vendelshtein.part3-6-steps.svg", "alt": "Поряд  29, "by": "model", "verified": false}, {"id": "part3-6.c6", "kind": "observation", "text": "Поправка за пористость рассчитывается аналогично.", "quote": "Аналогично поправку за влияние пористости (условно считая, что пласт водоносный) определяют по формуле", "unit": "u029-07", "page": 29, "by": "model", "verified": true}, {"id": "part3-6.c7", "kind": "observation", "text": "Значения λ приводятся к типичному значению Kн.", "quote": "где  \\( \\lambda_{гл}, \\lambda_{гв}, \\lambda_{в} \\)  — декремент затухания в глинистой фракции, чистом скелете и пластовой воде;  \\( K_{н} \\)  - некоторое произвольное, но типичное значение  \\( K_{н} \\) , к которому «приводятся» значения  \\( \\lambda \\) .", "unit": "u029-09", "page": 29, "by": "model", "verified": true}], "term_ids": [], "units": ["u029-03", "u029-04", "u029-05", "u029-06", "u029-07", "u029-08", "u029-09"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.wnl-detection-pulsed-neutron", "order": 24, "part_id": "p3", "minutes": 2, "title": "Обнаружение ВНК импульсным нейтронным методом", "book_title": "Определение эффективной мощности коллекторов. Установление водонефтяного и газожидкостного контактов", "pages": [29, 29], "difficulty": {"primary": "И", "secondary": "Н"}, "threshold": false, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие», контринтуитивность. Текст подходит для объяснения физического принципа метода и условий его применимости, так как требует акцента на логических связях между давлением, насыщением и показаниями прибора.", "scene_template": "tool-in-well"}, "summary": [{"text": "Импульсный нейтронный метод (ИНМ) позволяет определять водонефтяной контакт (ВНК) в высокопористых коллекторах, используя различия в водородосодержании и сечении поглощения нейтронов.", "claims": ["wnl-detection-pulsed-neutron.c1"], "page": 29, "by": "model"}, {"text": "Надежность метода зависит от учета глинистости и коэффициента нефте Определение эффективной мощности коллекторов. Установление водонефтяного и газожидкостного контактов", "pages": [29, 29], "difficulty": {"primary": "Пр", "secondary": "И"}, "threshold": false, "format": {"primary": "long", "reason": "Тип «процедура»; критерии видеоёмкости: изменение во времени, невидимое становится видимым. Текст подходит для описания алгоритмической процедуры, где важна последовательность действий и условия (время ожидания).", "scene_template": "step-flow"}, "summary": [{"text": "Метод двукратных замеров позволяет выявить свободный газ в пласте, сравнивая показания нейтронного метода в работающей и остановленной скважине. Это исключает влияние фоновых факторов, таких как глинистость и нефтенасыщенность.", "claims": ["dual-measurement-gas-correction.c1"], "page": 29, "by": "model"}], "how_it_works": [{"text": "Для исключения влияния изменений коэффициента нефтенасыщенности и глинистости на показания приборов применяется методика двукратных замеров. Первый замер выполняется при работающей скважине, второй — через 5—10 ч после ее остановки.", "claims": ["dual-measurement-gas-correction.c1"], "page": 29, "by": "model"}, {"text": "В водоносных коллекторах диаграммы совмещают для исключения влияния свободного газа, находящегося в стволе работающей скважины. Против нефтеотдающих интервалов с давлением насыщения выше забойного наблюдаются приращения показаний нейтронного метода в работающей скважине относительно остановленной.", "claims": ["dual-measurement-gas-correction.c1"], "page": 29, "by": "model"}], "steps": [{"text": "1. Провести замер нейтронным методом в работающей скважине. 2. Остановить скважину и выждать 5—10 ч. 3. Провести повторный замер. 4. Совместить диаграммы для выявления приращений, указывающих на свободный газ в пласте.", "claims": ["dual-measurement-gas-correction.c1"], "page": 29, "by": "model"}], "examples": [{"title": "Выделение нефтеносных пластов", "page": 29, "figure": "рис. 36", "condition": [{"text": "Сравнение диаграмм нейтро

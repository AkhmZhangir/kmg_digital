ированных списков.", "scene_template": "step-flow"}, "summary": [{"text": "Граничные значения параметров определяются через корреляционные связи с проницаемостью и зависят от текущего уровня экономики разработки.", "claims": ["part0-2.c1"], "page": 10, "by": "model"}, {"text": "Ни в одном районе величина проницаемости не равна традиционному значению 1 мД, ранее принимавшемуся за нижний предел.", "claims": ["part0-2.c2"], "page": 10, "by": "model"}], "how_it_works": [{"text": "Полученное граничное значение проницаемости является условным и соответствует современному техническому уровню разработки и состоянию экономики.", "claims": ["part0-2.c1"], "page": 10, "by": "model"}, {"text": "С развитием методов разработки и изменением экономических критериев граничные значения будут изменяться.", "claims": ["part0-2.c3"], "page": 10, "by": "model"}, {"text": "Для конкретных геологических объектов в различных районах эти значения можно для ближайших 3—5 лет принять постоянными.", "claims": ["part0-2.c4"], "page": 10, "by": "model"}, {"text": "Оценка показала, что значения проницаемости существенно различаются приблизительно на порядок для нефтеносных и газоносных объектов.", "claims": ["part0-2.c5"], "page": 10, "by": "model"}, {"text": "Для нефтеносных коллекторов различных районов величина составляет 3—5 мД, для мезозойских отложений Западной Сибири — 3—8 мД, Южного Мангышлака — 10 мД.", "claims": ["part0-2.c6"], "page": 10, "by": "model"}, {"text": "Ни в одном районе установленная величина не равна традиционному значению 1 мД, которое ранее безоговорочно принималось в качестве нижнего предела.", "claims": ["part0-2.c2"], "page": 10, "by": "model"}, {"text": "Граничные значения параметров находят, используя корреляционные связи каждого из этих параметров с коэффициентом проницаемости.", "claims": ["part0-2.c7"], "page": 10, "by": "model"}, {"text": "Граничные значения геофизических параметров устанавливаются на основе корреляционных связей между этим параметром и свойствами  районах эти значения можно для ближайших 3—5 лет принять постоянными.", "quote": "Однако для конкретных геологических объектов в различных районах эти значения можно для ближайших -3—5 лет принять постоянными.", "unit": "u010-04", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c5", "kind": "observation", "text": "Значения проницаемости существенно различаются приблизительно на порядок для нефтеносных и газоносных объектов.", "quote": "Оценка величины $K_{\\mathrm{np}}^{*}$, выполненная таким образом для продуктивных отложений нефтегазодобывающих районов, показала, что значения $\\mathrm{K}_{\\mathrm{np}}^{*}$ существенно (приблизительно на порядок) различаются для нефтеносных и газоносных объектов.", "unit": "u010-04", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c6", "kind": "observation", "text": "Для нефтеносных коллекторов величина проницаемости составляет 3—5 мД, для Западной Сибири — 3—8 мД, Южного Мангышлака — 10 мД.", "quote": "Для нефтеносных коллекторов различных районов величина $\\mathrm{K}_{\\mathrm{np}}^{*}$ составляет 3—5 мД, для мезозойских отложений месторождений Западной Сибири — 3—8 мД, Южного Мангышлака — 10 мД.", "unit": "u010-04", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c7", "kind": "observation", "text": "Граничные значения параметров находят, используя корреляционные связи каждого из этих параметров с коэффициентом проницаемости.", "quote": "Граничные значения параметров $\\mathrm{K}_{\\mathrm{n}}^{*}, \\mathrm{C}_{\\mathrm{гл}}^{*}, \\mathrm{K}_{\\mathrm{гл}}^{*}, \\eta_{\\mathrm{гл}}^{*}$ и других находят, используя корреляционные связи каждого из этих параметров с коэффициентом проницаемости $\\mathrm{K}_{\\mathrm{np}}$", "unit": "u010-06", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c8", "kind": "observation", "text": "Граничные значения геофизических параметров устанавливаются на основе корреляционных связей между ними и свойствами коллектора или глинистостью.", "quote": "Граничные значения геофизических параметров $\\alpha^{*}_{\\mathrm{CII}}, \\Delta \\mathrm{J}_{\\mathrm{T}}^{*}$ и других устанавливаются на основе корреляционных связей между этим параметром и соответствующим ему параметром, характеризующим коллекторские свойства ($\\mathrm{K}_{\\mathrm{np}}, \\mathrm{K}_{\\mathrm{n}}$) или глинистость ($\\mathrm{C}_{\\mathrm{гл}}, \\mathrm{K}_{\\mathrm{гл}}, \\eta_{\\mathrm{гл}}$).", "unit": "u010-09", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c9", "kind": "observation", "text": "Корреляционную связь устанавливают, сопоставляя по интервалам испытаний значения проницаемости по гидродинамическим данным и геофизические параметры.", "quote": "Корреляционную связь между геофизическими параметрами $\\mathrm{P}_{\\mathrm{n}}, \\alpha_{\\mathrm{CII}}, \\Delta \\mathrm{J}_{\\mathrm{T}}$ и коэффициентом проницаемости для продуктивных отложений устанавливают, сопоставляя по интервалам испытаний (или пробной эксплуатации), для которых величина $\\mathrm{K}_{\\mathrm{np}}$ рассчитана по данным гидродинамических исследований (по кривой восстановления давления), значение $\\mathrm{K}_{\\mathrm{np}}$ и усредненное для этого интервала значение геофизического параметра.", "unit": "u010-10", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c10", "kind": "observation", "text": "Интервалы должны быть достаточно однородными по геофизической характеристике.", "quote": "Интервалы должны быть достаточно однородными по геофизической характеристике.", "unit": "u010-10", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c11", "kind": "observation", "text": "В соответствии с уравнением регрессии для заданного значения проницаемости определяют величину геофизических параметров.", "quote": "в соответствии с уравнением регрессии для заданного значения $\\mathrm{K}_{\\mathrm{np}}^{*}$ определяют величину $\\mathrm{P}_{\\mathrm{n}}^{*}, \\alpha_{\\mathrm{CII}}^{*}$ и т.п.", "unit": "u010-10", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c12", "kind": "observation", "text": "Для нефтеносных коллекторов различных районов величина проницаемости составляет 3—5 мД.", "quote": "Для нефтеносных коллекторов различных районов величина $\\mathrm{K}_{\\mathrm{np}}^{*}$ составляет 3—5 мД", "unit": "u010-04", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c13", "kind": "observation", "text": "Для мезозойских отложений месторождений Западной Сибири проницаемость составляет 3—8 мД, Южного Мангышлака — 10 мД.", "quote": "для мезозойских отложений месторождений Западной Сибири — 3—8 мД, Южного Мангышлака — 10 мД.", "unit": "u010-04", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c14", "kind": "observation", "text": "Традиционное значение проницаемости ранее составляло 1 мД.", "quote": "традиционному значению 1 мД, которое ранее безоговорочно принималось в качестве нижнего предела проницаемости нефтеносного коллектора.", "unit": "u010-05", "page": 10, "by": "model", "verified": true}, {"id": "part0-2.c15", "kind": "observation", "text": "Граничному значению проницаемости 1 мД соответствует граничное значение пористости 16% при диапазоне изменения 1%.", "quote": "граничному значению $\\mathrm{K}_{\\mathrm{np}}^{*} = 1$ мД в соответствии с уравнением регрессии, характеризующим связь между параметрами $\\mathrm{K}_{\\mathrm{np}}$ и $\\mathrm{K}_{\\mathrm{n}}$, соответствует граничное значение $\\mathrm{K}_{\\mathrm{n}} = 16\\%$ при вероятном диапазоне изменения $\\mathrm{K}_{\\mathrm{n}} = +1\\%$ с учетом дисперсии связи.", "unit": "u010-06", "page": 10, "by": "model", "verified": true}], "term_ids": ["t-drainage-radius", "t-wellbore-radius"], "units": ["u010-03", "u010-04", "u010-05", "u010-06", "u010-07", "u010-08", "u010-09", "u010-10"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.part0-3", "order": 3, "part_id": "p1", "minutes": 4, "title": "Введение", "book_title": "Введение", "pages": [10, 11], "difficulty": {"primary": "Н", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «неопределённость, решение»; критериев видеоёмкости нет. Текст оптимален для объяснения базовых принципов петрофизической интерпретации и классификации пластов сотрудникам ИТ.", "scene_template": "decision-scale"}, "summary": [{"text": "Коллекторы в разрезах выделяются с помощью геофизических методов на основе граничных значений параметров пористости и глинистости.", "claims": ["part0-3.c1", "part0-3.c2"], "page": 10, "by": "model"}, {"text": "Выбор метода зависит от типа разреза: для карбонатных и плотных пород применяют методы пористости, а для терригенных — методы самопроизвольной поляризации и гамма-метода.", "claims": ["part0-3.c3", "part0-3.c4"], "page": 11, "by": "model"}], "how_it_works": [{"text": "По диаграммам акустического, нейтронного гамма-метода и плотностного гамма-гамма-метода коллекторы выделяют исходя из граничного значения $\\mathrm{K}_{\\mathrm{n}}$ и соответствующих ему граничных значений $\\Delta \\mathrm{T}^{*}$, относительной амплитуды $\\Delta \\mathrm{J}_{\\mathrm{ny}}^{*}$ и объемной плотности $\\delta^{*}_{\\mathrm{n}}$.", "claims": ["part0-3.c1"], "page": 10, "by": "model"}, {"text": "Значения параметров находят по корреляционным связям между $\\Delta \\mathrm{T}$ и $\\mathrm{K}_{\\mathrm{n}}$, $\\Delta \\mathrm{J}_{\\mathrm{ny}}$ и объемным водосодержанием с учетом глинистости, а также $\\delta_{\\mathrm{n}}$ и $\\mathrm{K}_{\\mathrm{n}}$.", "claims": ["part0-3.c5"], "page": 10, "by": "model"}, {"text": "На диаграмме метода пористости проводят линию, параллельную оси глубин, соответствующую граничному значению, которая делит пласты на коллекторы (где $\\Delta \\mathrm{T} > \\Delta \\mathrm{T}^{*}$, $\\Delta \\mathrm{J}_{\\mathrm{ny}} \u003c \\Delta \\mathrm{J}_{\\mathrm{ny}}^{*}$, $\\delta_{\\mathrm{n}} \u003c \\delta_{\\mathrm{n}}^{*}$) и неколлекторы.", "claims": ["part0-3.c2", "part0-3.c6"], "page": 10, "by": "model"}, {"text": "Выделение по критической величине $\\mathrm{K}_{\\mathrm{n}}$ распространено для карбонатных разрезов и терригенных уплотненных пород с низким содержанием глинистого материала, но редко применяется для типичных терригенных разрезов из-за трудностей учета глинистости.", "claims": ["part0-3.c3", "part0-3.c7"], "page": 11, "by": "model"}, {"text": "Для терригенных разрезов широко применяют диаграммы самопроизвольной поляризации и гамма-метода, где отрицательная аномалия СП и низкие показания ГМ служат признаками коллектора.", "claims": ["part0-3.c4", "part0-3.c8"], "page": 11, "by": "model"}, {"text": "При бурении на пресном глинистом растворе ($\\rho_{\\mathrm{g}} > \\rho_{\\mathrm{a}}$) песчаники и алевролиты выделяются пониженными значениями СП по сравнению с максимальными значениями линии глин.", "claims": ["part0-3.c9"], "page": 11, "by": "model"}, {"text": "Величина аномалии $\\Delta U_{\\mathrm{СП}}$ тем больше, чем сильнее различаются минерализация и удельное сопротивление вод и раствора, а также содержание глины в коллекторе и неколлекторе.", "claims": ["part0-3.c10"], "page": 11, "by": "model"}, {"text": "При постоянстве минерализации и литологии вмещающих пород аномалия СП отражает относительную глинистость $\\eta_{\\mathrm{гл}}$.", "claims": ["part0-3.c11"], "page": 11, "by": "model"}], "steps": [{"text": "Шаг 1: построение корреляционных связей между параметрами геофизических методов и свойствами пород (пористостью, водосодержанием).", "claims": ["part0-3.c5"], "page": 10, "by": "model"}, {"text": "Шаг 2: определение граничных значений $\\Delta \\mathrm{T}^{*}$, $\\Delta \\mathrm{J}_{\\mathrm{ny}}^{*}$ и $\\delta^{*}_{\\mathrm{n}}$ по критическому значению $\\mathrm{K}_{\\mathrm{n}}$.", "claims": ["part0-3.c1", "part0-3.c5"], "page": 10, "by": "model"}, {"text": "Шаг 3: проведение линии, параллельной оси глубин на диаграмме пористости, для разделения пластов на коллекторы и неколлекторы.", "claims": ["part0-3.c2"], "page": 10, "by": "model"}, {"text": "Шаг 4: анализ диаграмм самопроизвольной поляризации и гамма-метода для выделения коллекторов в терригенном разрезе по отрицательным аномалиям.", "claims": ["part0-3.c4", "part0-3.c8", "part0-3.c9"], "page": 11, "by": "model"}], "examples": [], "numbers": [{"text": "В тексте главы приводятся обозначения формул и параметров (например, формула 1.3 для относительной глинистости), но числовые значения физических величин в рассматриваемых параграфах не заданы.", "claims": ["part0-3.c12"], "page": 11, "by": "model"}], "formulas": [{"latex": "\\eta_{\\mathrm{гл}} = \\mathrm{K}_{\\mathrm{гл}} / (\\mathrm{K}_{\\mathrm{гл}} + \\mathrm{K}_{\\mathrm{н}})", "page": 11, "vars": [{"sym": "\\eta_{\\mathrm{гл}}", "meaning": "относительная глинистость", "unit": "u011-06"}, {"sym": "\\mathrm{K}_{\\mathrm{гл}}", "meaning": "параметр или коэффициент, связанный с глинистостью", "unit": "u011-07"}, {"sym": "\\mathrm{K}_{\\mathrm{н}}", "meaning": "параметр или коэффициент", "unit": "u011-07"}]}], "tables": [], "misconception": {"wrong": "Гамма-каротаж измеряет глинистость напрямую без учета особенностей разреза.", "right": [{"text": "Методы геофизики дают косвенные признаки, а выделение коллекторов требует учета литологического типа разреза и влияния глинистости.", "claims": ["part0-3.c3", "part0-3.c7"], "page": 11, "by": "model"}]}, "data_meaning": {"input": "Данные геофизических исследований скважин: диаграммы интервального времени $\\Delta \\mathrm{T}$, нейтронного гамма-метода, плотностного гамма-гамма-метода, самопроизвольной поляризации (СП) и гамма-метода (ГМ).", "output": "Выделенные интервалы коллекторов и значения относительной глинистости $\\eta_{\\mathrm{гл}}$.", "breaks": [{"text": "Ломается в типичных терригенных разрезах при попытке прямого применения критических значений пористости без учета влияния глинистости.", "claims": ["part0-3.c7"], "page": 11, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Порог разделения на коллекторы и неколлекторы аналогичен порогу классификации (decision threshold) в моделях машинного обучения.", "claims": ["part0-3.c2"], "page": 10, "by": "model"}]}, "analogy": {"text": "Граничное значение параметра на каротажной диаграмме работает как порог решающего правила (threshold) в бинарной классификации данных.", "breaks_where": "Перестает работать, когда свойства породы меняются по разрезу плавно, а не дискретно, и фиксированный порог приводит к высокой доле ложноположительных или ложноотрицательных результатов."}, "now_practice": [{"text": "Сегодня выделение коллекторов и расчет глинистости редко выполняются вручную по бумажным палеткам — эти операции автоматизированы в специализированном программном обеспечении петрофизической интерпретации.", "claims": ["part0-3.c1", "part0-3.c2"], "page": 10, "by": "model"}], "layers": {"mechanism": [{"text": "Физический механизм основан на связи показаний геофизических приборов с емкостными свойствами пород и содержанием глинистого материала.", "claims": ["part0-3.c1", "part0-3.c6"], "page": 10, "by": "model"}], "practice": [{"text": "На практике выбор метода интерпретации жестко привязан к литологическому типу разреза — карбонатному или терригенному.", "claims": ["part0-3.c3", "part0-3.c4"], "page": 11, "by": "model"}], "nuances": [{"text": "Условия бурения (например, минерализация глинистого раствора $\\rho_{\\mathrm{g}} > \\rho_{\\mathrm{a}}$) существенно влияют на вид аномалий на диаграммах СП.", "claims": ["part0-3.c9", "part0-3.c10"], "page": 11, "by": "model"}], "deeper": [{"text": "Относительная глинистость $\\eta_{\\mathrm{гл}}$ рассчитывается через соотношение параметров и отражает долю глинистого материала при постоянстве минерализации и литологии.", "claims": ["part0-3.c10", "part0-3.c11"], "page": 11, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part0-3.ill1", "class": "B", "src": "media/vendelshtein.part0-3-steps.svg", "alt": "Порядок действий по тексту автора: Введение", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "vendelshtein.part0-3.ill2", "class": "B", "src": "media/vendelshtein.part0-3-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Введение", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "vendelshtein.part0-2", "type": "prerequisite"}], "claims": [{"id": "part0-3.c1", "kind": "observation", "text": "Коллекторы выделяют по диаграммам акустического, нейтронного и плотностного методов исходя из граничного значения $\\mathrm{K}_{\\mathrm{n}}$ и соответствующих параметров.", "quote": "По диаграммам геофизических методов — интервального времени \\Delta \\mathrm{T} акустического метода, нейтронного гамма-метода и плотностного гамма-гамма-метода — коллекторы в исследуемом интервале разреза выделяют исходя из граничного значения \\mathrm{K}_{\\mathrm{n}} и соответствующих ему граничных значений \\Delta \\mathrm{T}^{*}, относительной амплитуды \\Delta \\mathrm{J}_{\\mathrm{ny}}^{*}, объемной плотности \\delta^{*}_{\\mathrm{n}}.", "unit": "u010-11", "page": 10, "by": "model", "verified": true}, {"id": "part0-3.c2", "kind": "observation", "text": "На диаграмме пористости проводят линию, разделяющую пласты на коллекторы и неколлекторы по граничным значениям.", "quote": "На диаграмме метода пористости в пределах исследуемого интервала разреза проводят линию, параллельную оси глубин, соответствующую граничному значению \\Delta \\mathrm{T}^{*}, \\Delta \\mathrm{J}_{\\mathrm{ny}}^{*} или \\delta_{\\mathrm{n}}^{*}, которая разделяет всю совокупность пластов в разрезе на коллекторы", "unit": "u010-11", "page": 10, "by": "model", "verified": true}, {"id": "part0-3.c3", "kind": "observation", "text": "Выделение по критической величине \\( K_{n} \\) распространено для карбонатных разрезов и уплотненных терригенных пород.", "quote": "Выделение коллекторов по диаграммам методов пористости по критической величине  \\( K_{n} \\)  получило распространение главным образом для карбонатных разрезов и для разновидностей терригенного разреза, представленного уплотненными породами с низким содержанием глинистого материала.", "unit": "u011-01", "page": 11, "by": "model", "verified": true}, {"id": "part0-3.c4", "kind": "observation", "text": "Диаграммы самопроизвольной поляризации и гамма-метода широко применяются для выделения коллекторов в терригенном разрезе.", "quote": "Диаграммы геофизических методов глинистости — самопроизвольной поляризации, гамма-метода — напротив, широко применяют для выделения коллекторов в терригенном разрезе.", "unit": "u011-02", "page": 11, "by": "model", "verified": true}, {"id": "part0-3.c5", "kind": "observation", "text": "Граничные значения параметров находят по корреляционным связям между геофизическими показателями и пористостью с водосодержанием.", "quote": "Значения \\Delta \\mathrm{T}^{*}, \\Delta \\mathrm{J}_{\\mathrm{ny}}^{*}, \\delta^{*}_{\\mathrm{n}} находят соответственно по корреляционным связям между \\Delta \\mathrm{T} и \\mathrm{K}_{\\mathrm{n}}, \\Delta \\mathrm{J}_{\\mathrm{ny}} и объемным водосодержанием (с учетом глинистости), \\delta_{\\mathrm{n}} и \\mathrm{K}_{\\mathrm{n}}.", "unit": "u010-11", "page": 10, "by": "model", "verified": true}, {"id": "part0-3.c6", "kind": "observation", "text": "Для коллекторов выполняются неравенства \\Delta \\mathrm{T} > \\Delta \\mathrm{T}^{*}, \\Delta \\mathrm{J}_{\\mathrm{ny}} \u003c \\Delta \\mathrm{J}_{\\mathrm{ny}}^{*}, \\delta_{\\mathrm{n}} \u003c \\delta_{\\mathrm{n}}^{*}.", "quote": "(для них \\Delta \\mathrm{T} > \\Delta \\mathrm{T}^{*}, \\Delta \\mathrm{J}_{\\mathrm{ny}} \u003c \\Delta \\mathrm{J}_{\\mathrm{ny}}^{*}, \\delta_{\\mathrm{n}} \u003c \\delta_{\\mathrm{n}}^{*})", "unit": "u010-11", "page": 10, "by": "model", "verified": true}, {"id": "part0-3.c7", "kind": "inference", "text": "Для типичных терригенных разрезов этот способ применяют редко из-за трудностей учета глинистости.", "quote": "Для типичных терригенных разрезов этот способ выделения коллекторов применяют редко, так как при учете влияния глинистости на показания перечисленных методов возникают трудности.", "unit": "u011-01", "page": 11, "by": "model", "verified": true}, {"id": "part0-3.c8", "kind": "observation", "text": "Отрицательная аномалия СП и низкие показания ГМ использовались как признаки коллектора.", "quote": "отрицательная аномалия на кривой СП и низкие показания на диаграмме ГМ использовались как признаки коллектора в терригенном разрезе.", "unit": "u011-02", "page": 11, "by": "model", "verified": true}, {"id": "part0-3.c9", "kind": "observation", "text": "При бурении на пресном глинистом растворе пласты-коллекторы выделяются пониженными значениями СП относительно линии глин.", "quote": "При буренин скважин на пресном глинистом растворе  \\( (\\rho_{\\mathrm{g}} > \\rho_{\\mathrm{a}}) \\)  пласты-коллекторы (песчаники и алевролиты) выделяются в терригенном разрезе на диаграмме СП пониженными значениями (отрицательной аномалией) по сравнению с устойчивыми максимальными значениями СП (линия глин)", "unit": "u011-04", "page": 11, "by": "model", "verified": true}, {"id": "part0-3.c10", "kind": "observation", "text": "Величина аномалии \\Delta U_{\\mathrm{СП}} зависит от различия минерализации, сопротивлений и содержания глинистого материала.", "quote": "Величина аномалии  \\( \\Delta U_{\\mathrm{СП}} \\)  тем больше, чем больше различие в минерализации и электрическом удельном сопротивлении пластовых вод и глинистого раствора, а также чем больше различаются по содержанию глинистого материала коллектор и вмещающая порода — неколлектор.", "unit": "u011-06", "page": 11, "by": "model", "verified": true}, {"id": "part0-3.c11", "kind": "observation", "text": "При постоянстве минерализации и литологии аномалия СП отражает относительную глинистость \\eta_{\\mathrm{гл}}.", "quote": "При постоянстве минерализации пластовых вод и литологии вмещающих пород в изучаемом участке разреза аномалия СП отражает относительное содержание в породе глинистого материала — относительную глинистость  \\( \\eta_{\\mathrm{гл}} \\) :", "unit": "u011-06", "page": 11, "by": "model", "verified": true}, {"id": "part0-3.c12", "kind": "observation", "text": "В тексте приводится формула 1.3 для расчета относительной глинистости.", "quote": "\\eta_ {\\mathrm{гл}} = \\mathrm{K} _ {\\mathrm{гл}} / (\\mathrm{K} _ {\\mathrm{гл}} + \\mathrm{K} _ {\\mathrm{н}}), \\tag {1.3}", "unit": "u011-07", "page": 11, "by": "model", "verified": false}], "term_ids": ["t-spontaneous-potential-sp", "t-relative-clay-content"], "units": ["u010-11", "u011-01", "u011-02", "u011-03", "u011-04", "u011-05", "u011-06", "u011-07"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.part0-4", "order": 4, "part_id": "p1", "minutes": 5, "title": "Введение", "book_title": "Введение", "pages": [11, 12], "difficulty": {"primary": "И", "secondary": null}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». текст", "scene_template": "tool-in-well"}, "summary": [{"text": "Комплексный параметр η_гл объединяет пористость и глинистость, разделяя породы на коллекторы и неколлекторы. Относительная амплитуда СП (α_СП) исключает побочные погрешности за счёт нормировки на максимум в разрезе.", "claims": ["part0-4.c1", "part0-4.c2"], "page": 11, "by": "model"}, {"text": "Связь между α_СП и η_гл зависит от минерализации пластовых вод и активности глинистого цемента, позволяя находить пороговые значения для фильтрационно-емкостных свойств.", "claims": ["part0-4.c3"], "page": 12, "by": "model"}], "how_it_works": [{"text": "Параметр η_гл объединяет пористость K_n и глинистость K_гл пород.", "claims": ["part0-4.c1"], "page": 11, "by": "model"}, {"text": "Линии постоянных значений η_гл делят совокупность точек разреза на коллекторы и неколлекторы, а коллекторы — на хорошие и плохие.", "claims": ["part0-4.c4"], "page": 11, "by": "model"}, {"text": "Связь между проницаемостью K_np и η_гл теснее, чем с K_n или K_гл по отдельности.", "claims": ["part0-4.c5"], "page": 11, "by": "model"}, {"text": "Граничное значение η_гл* используется как четкий критерий коллектора.", "claims": ["part0-4.c6"], "page": 11, "by": "model"}, {"text": "Благоприятные условия для применения η_гл*: отсутствие другого цемента (кроме глинистого) и однородный минеральный состав глинистого цемента.", "claims": ["part0-4.c7"], "page": 11, "by": "model"}, {"text": "Величина η_гл колеблется от 0,3 до 0,6 и возрастает при уменьшении активности глинистого цемента и росте эпигенетических преобразований.", "claims": ["part0-4.c8"], "page": 11, "by": "model"}, {"text": "Для кайнозойских отложений с монтмориллонитом η_гл = 0,3–0,4; для мезозоя и верхнего палеозоя на глубинах до 3-4 км η_гл = 0,4–0,5; для глубокозалегающих пород более 4 км η_гл = 0,5–0,6.", "claims": ["part0-4.c9", "part0-4.c10"], "page": 11, "by": "model"}, {"text": "При интерпретации диаграмм СП используют относительную амплитуду α_СП вместо абсолютной ΔU_СП.", "claims": ["part0-4.c2", "part0-4.c11"], "page": 12, "by": "model"}, {"text": "Относительная амплитуда α_СП рассчитывается как отношение амплитуды в пласте к максимальной амплитуде в наименее глинистых коллекторах участка.", "claims": ["part0-4.c12"], "page": 12, "by": "model"}, {"text": "Использование α_СП исключает погрешности масштаба диаграммы и различия в минерализации глинистого раствора.", "claims": ["part0-4.c13"], "page": 12, "by": "model"}, {"text": "Характер связи α_СП и η_гл зависит от минерализации вод и активности цемента.", "claims": ["part0-4.c3"], "page": 12, "by": "model"}, {"text": "При высокой минерализации (>100–150 г/л) и низкой активности цемента зависимость выполаживается в области малых η_гл и крутеет для неколлекторов.", "claims": ["part0-4.c14"], "page": 12, "by": "model"}, {"text": "При уменьшении минерализации и росте активности зависимость спрямляется (Западная Сибирь), а при дальнейшем снижении становится вогнутой с крутизной у коллекторов (Сахалин).", "claims": ["part0-4.c15", "part0-4.c16"], "page": 12, "by": "model"}, {"text": "Зная критическое η_гл*, по графику находят граничное значение α_СП*.", "claims": ["part0-4.c17"], "page": 12, "by": "model"}], "steps": [{"text": "Рассчитать относительную амплитуду СП (α_СП) путем деления локальной амплитуды на максимальную амплитуду чистых коллекторов участка.", "claims": ["part0-4.c12"], "page": 12, "by": "model"}, {"text": "Определить критическое значение комплексного параметра η_гл* для изучаемых отложений с учетом их возраста, глубины и состава глинистого цемента.", "claims": ["part0-4.c6", "part0-4.c9", "part0-4.c10"], "page": 11, "by": "model"}, {"text": "По региональной зависимости α_СП = f(η_гл), соответствующей минерализации вод и типу цемента, найти пороговое граничное значение α_СП*.", "claims": ["part0-4.c3", "part0-4.c17"], "page": 12, "by": "model"}], "examples": [], "numbers": [{"text": "Величина η_гл колеблется от 0,3 до 0,6.", "claims": ["part0-4.c8"], "page": 11, "by": "model"}, {"text": "Для кайнозойских отложений Северного Кавказа η_гл = 0,3 + 0,4.", "claims": ["part0-4.c9"], "page": 11, "by": "model"}, {"text": "Для мезозоя и верхнего палеозоя Волго-Урала, Западной Сибири и Мангышлака при глубине до 3-4 км η_гл = 0,4 + 0,5.", "claims": ["part0-4.c10"], "page": 11, "by": "model"}, {"text": "Для глубокозалегающих пород более 4 км η_гл = 0,5 + 0,6.", "claims": ["part0-4.c10"], "page": 11, "by": "model"}, {"text": "Высокая минерализация пластовых вод составляет более 100 + 150 г/л.", "claims": ["part0-4.c14"], "page": 12, "by": "model"}], "formulas": [{"latex": "\\alpha_ {\\mathrm{CII}} = \\Delta \\mathrm{U} _ {\\mathrm{CII}} / \\mathrm{E} _ {\\text {max}}", "page": 12, "vars": [{"sym": "\\alpha_ {\\mathrm{CII}}", "meaning": "относительная амплитуда СП", "unit": "u012-02"}, {"sym": "\\Delta \\mathrm{U} _ {\\mathrm{CII}}", "meaning": "амплитуда СП в интерпретируемом пласте", "unit": "u012-02"}, {"sym": "\\mathrm{E} _ {\\text {max}}", "meaning": "максимальная амплитуда СП в исследуемом участке разреза", "unit": "u012-02"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Амплитуда СП в пласте, максимальная амплитуда СП по разрезу, пористость, глинистость, минерализация пластовых вод.", "output": "Относительная амплитуда α_СП и порог α_СП*, разделяющие коллекторы и неколлекторы.", "breaks": [{"text": "Модель ломается при появлении в коллекторах другого вида цемента помимо глинистого или при неоднородном минеральном составе глинистого цемента.", "claims": ["part0-4.c7"], "page": 11, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Нормировка α_СП аналогична min-max нормализации признаков в машинном обучении для устранения масштабных сдвигов.", "claims": ["part0-4.c13"], "page": 12, "by": "model"}]}, "analogy": {"text": "Нормировка амплитуды СП делением на максимальное значение похожа на min-max скалирование признака в датасете для приведения к диапазону [0, 1] и избавления от системных смещений датчиков.", "breaks_where": "Физическая природа сигнала СП нелинейно зависит от электрохимических свойств глин и пластовых вод, в то время как стандартное скалирование линейно."}, "now_practice": [{"text": "Сегодня расчет относительных параметров каротажа и построение кросс-плотов для автоматизированного выделения коллекторов выполняются в специализированных программных пакетах петрофизической интерпретации.", "claims": ["part0-4.c4", "part0-4.c17"], "page": 11, "by": "model"}], "layers": {"mechanism": [{"text": "Параметр η_гл синтезирует пористость и глинистость в единый комплексный признак, тесно связанный с проницаемостью.", "claims": ["part0-4.c1", "part0-4.c5"], "page": 11, "by": "model"}], "practice": [{"text": "Использование α_СП вместо абсолютной величины нивелирует технические погрешности каротажа и разницу свойств бурового раствора.", "claims": ["part0-4.c13"], "page": 12, "by": "model"}], "nuances": [{"text": "Форма связи α_СП с η_гл меняется от выпуклой до вогнутой в зависимости от минерализации воды и активности глинистого цемента.", "claims": ["part0-4.c14", "part0-4.c15", "part0-4.c16"], "page": 12, "by": "model"}], "deeper": [{"text": "Значения η_гл растут с уменьшением активности глинистого цемента и увеличением глубины из-за эпигенетических преобразований пород.", "claims": ["part0-4.c8", "part0-4.c9", "part0-4.c10"], "page": 11, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.part0-4.ill1", "class": "B", "src": "media/vendelshtein.part0-4-steps.svg", "alt": "Порядок действий по тексту автора: Введение", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "vendelshtein.part0-3", "type": "prerequisite"}], "claims": [{"id": "part0-4.c1", "kind": "observation", "text": "Комплексный параметр η_гл объединяет пористость K_n и глинистость K_гл.", "quote": "где \\( \\eta_{гл} \\) - комплексный параметр, объединяющий величины, характеризующие пористость \\( K_{n} \\) и глинистость \\( K_{гл} \\)", "unit": "u011-08", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c2", "kind": "observation", "text": "При интерпретации диаграмм СП используют относительную амплитуду α_СП.", "quote": "При интерпретации диаграмм СП предпочитают использовать не абсолютную \\( \\Delta U_{СП} \\), а относительную \\( \\alpha_{СП} \\) амплитуду СП", "unit": "u012-01", "page": 12, "by": "model", "verified": true}, {"id": "part0-4.c3", "kind": "observation", "text": "Характер связи α_СП и η_гл зависит от минерализации пластовых вод и активности глинистого цемента.", "quote": "Характер их связи зависит от минерализации пластовых вод и активности глинистого цемента.", "unit": "u012-04", "page": 12, "by": "model", "verified": true}, {"id": "part0-4.c4", "kind": "observation", "text": "Линии постоянных η_гл делят разрез на коллекторы и неколлекторы, а также на хорошие и плохие коллекторы.", "quote": "линии постоянных значений \\( \\eta_{гл} \\) делят совокупность точек для всех пород в разрезе на коллекторы и неколлекторы, а область, соответствующую коллекторам, — на участки плохих и хороших коллекторов", "unit": "u011-09", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c5", "kind": "observation", "text": "Связь между K_np и η_гл теснее, чем с K_n или K_гл по отдельности.", "quote": "Связь между параметрами \\( K_{np} \\) и \\( \\eta_{гл} \\) обычно теснее, чем между \\( K_{np} \\) и \\( K_{n} \\) или \\( K_{np} \\) и \\( K_{гл} \\)", "unit": "u011-09", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c6", "kind": "observation", "text": "Граничное значение η_гл* служит четким критерием коллектора.", "quote": "что позволяет использовать граничное значение \\( \\eta_{гл}^{*} \\), соответствующее \\( k_{np}^{*} \\) для данных отложений, как четкий критерий коллектора", "unit": "u011-09", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c7", "kind": "observation", "text": "Условия применения η_гл* — отсутствие другого цемента и однородный состав глинистого цемента.", "quote": "Наиболее благоприятные условия применения \\( \\eta_{гл}^{*} \\) для разделения по- род на коллекторы и неколлекторы — отсутствие или незначительное присутствие в изучаемых коллекторах другого вида цемента (кроме глинистого), а также однородный минеральный состав глинистого цемента.", "unit": "u011-09", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c8", "kind": "observation", "text": "Величина η_гл колеблется от 0,3 до 0,6, возрастая при снижении активности цемента и росте эпигенеза.", "quote": "Величина \\( \\eta_{гл} \\) для отложений различного возраста колеблется от 0,3 до 0,6, возрастая с уменьшением активности глинистого цемента и ростом степени эпигенетических преобразований пород.", "unit": "u011-09", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c9", "kind": "observation", "text": "Для кайнозойских отложений с монтмориллонитом η_гл = 0,3–0,4.", "quote": "Для большинства кайнозойских продуктивных отложений со значительным содержанием монтмориллонитового цемента \\( \\eta_{гл} = 0,3 + 0,4 \\) (Северный Кавказ)", "unit": "u011-09", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c10", "kind": "observation", "text": "Для мезозоя и палеозоя на глубинах до 4 км η_гл = 0,4–0,5, а глубже 4 км η_гл = 0,5–0,6.", "quote": "для большей части продуктивных отложений мезозоя и верхнего палеозоя \\( \\eta_{гл} = 0,4 + 0,5 \\) (Волго-Урал, Западная Сибирь, Мангышлак) при глубине залегания коллекторов не более 3—4 км; для глубоко-залегающих пород (более 4 км) палеозоя и мезозоя \\( \\eta_{гл} = 0,5 + 0,6 \\) (Днепровско-Донецкая впадина, Северный Кавказ, Прикаспий).", "unit": "u011-09", "page": 11, "by": "model", "verified": true}, {"id": "part0-4.c11", "kind": "observation", "text": "Формула расчета α_СП задана через отношение амплитуд.", "quote": "\\[ \\alpha_ {\\mathrm{CII}} = \\Delta \\mathrm{U} _ {\\mathrm{CII}} / \\mathrm{E} _ {\\text {max}}, \\tag {1.4} \\]", "unit": "u012-02", "page": 12, "by": "model", "verified": false}, {"id": "part0-4.c12", "kind": "observation", "text": "α_СП рассчитывается как отношение амплитуды пласта к максимальной в наименее глинистых коллекторах.", "quote": "которую рассчитывают как отношение амплитуды в интерпретируемом пласте \\( \\Delta U_{СП} \\) к максимальной амплитуде \\( E_{v\\ max} \\) в исследуемом участке разреза, соответствующей наименее глинистым коллекторам.", "unit": "u012-03", "page": 12, "by": "model", "verified": true}, {"id": "part0-4.c13", "kind": "observation", "text": "Использование α_СП исключает погрешности масштаба и разницу минерализации глинистого раствора.", "quote": "Использование \\( \\alpha_{СП} \\) вместо \\( \\Delta U_{СП} \\) позволяет исключить влияние на результаты интерпретации СП различных сторонних факторов — погрешности в масштабе диаграммы СП, различия в минерализации глинистого раствора в скважинах месторождения и др.", "unit": "u012-03", "page": 12, "by": "model", "verified": true}, {"id": "part0-4.c14", "kind": "observation", "text": "При минерализации >100-150 г/л зависимость выполаживается у коллекторов и крутеет у неколлекторов.", "quote": "Для отложений с высокой минерализацией пластовых вод ( \\( C_{s} > 100 + 150 \\) г/л) и незначительной активностью глинистого материала (цемент каолинитово-гидрослюдистый) характерно выполаживание зависимости \\( \\alpha_{\\mathrm{сп}} = f(\\eta_{\\mathrm{гл}}) \\) для коллекторов в области небольших значений \\( \\eta_{\\Omega} \\) и увеличение се крутизны в области неколлекторов", "unit": "u012-04", "page": 12, "by": "model", "verified": true}, {"id": "part0-4.c15", "kind": "observation", "text": "С уменьшением минерализации зависимость спрямляется (Западная Сибирь).", "quote": "С уменьшением минерализации пластовых вод и ростом активности глинистого материала зависимость \\( \\alpha_{\\mathrm{сп}} = f(\\eta_{\\mathrm{гл}}) \\) спрямляется, имеет примерно одинаковый наклон во всем диапазоне значений \\( \\eta_{\\mathrm{гл}} \\) (большинство месторождений нефти и газа Западной Сибири).", "unit": "u012-05", "page": 12, "by": "model", "verified": true}, {"id": "part0-4.c16", "kind": "observation", "text": "При дальнейшем падении минерализации зависимость становится вогнутой (Сахалин).", "quote": "При дальнейшем снижении минерализации вод и повышении активности глинистого материала (нефтяные месторождения о-ва Сахалин) зависимость \\( \\alpha_{\\mathrm{сп}} = f(\\eta_{\\mathrm{гл}}) \\) становится вогнутой с ростом крутизны в области коллекторов", "unit": "u012-05", "page": 12, "by": "model", "verified": true}, {"id": "part0-4.c17", "kind": "observation", "text": "Зная критическое η_гл*, по графику находят α_СП*.", "quote": "Зная критическое значение \\( \\eta_{\\mathrm{гл}}^{*} \\) для изучаемых отложений, по соответствующему графику \\( \\alpha_{\\mathrm{сп}} = f(\\eta_{\\mathrm{гл}}) \\) находят граничное значение \\( \\alpha_{\\mathrm{СП}}^{*} \\).", "unit": "u012-05", "page": 12, "by": "model", "verified": true}], "term_ids": ["t-complex-clay-porosity-parameter", "t-relative-sp-amplitude"], "units": ["u011-08", "u011-09", "u012-01", "u012-02", "u012-03", "u012-04", "u012-05", "u012-06"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "vendelshtein.part0-5", "order": 5, "part_id": "p1", "minutes": 2, "title": "Введение", "book_title": "Введение", "pages": [12, 13], "difficulty": {"primary": "Пр", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет", "scene_template": "step-flow"}, "summary": [{"text": "Коллектор определяется не просто аномалией сопротивления, а превышением критического порога αₔₚ.", "claims": [], "page": 12, "by": "model"}, {"text": "Порог αₔₚ* зависит от типа флюида: выше для нефти, ниже для газа.", "claims": [], "page": 12, "by": "model"}, {"text": "Плотные породы с высоким сопротивлением ошибочно принимаются за коллекторы без сверки с пористостью.", "claims": [], "page": 12, "by": "model"}], "how_it_works": [{"text": "Коллекторам соответствуют области, где αₔₚ больше критического αₔₚ* и ηₓₛ меньше ηₓₛ*.", "claims": [], "page": 12, "by": "model"}, {"text": "Величина αₔₚ для терригенных коллекторов с рассеянной глинистостью варьируется в пределах 0,3—0,8.", "claims": [], "page": 12, "by": "model"}, {"text": "При прочих равных αₔₚ* для нефтеносных коллекторов выше, чем для газоносных.", "claims": [], "page": 12, "by": "model"}, {"text": "Для крупных провинций αₔₚ* ≥ 0,5 в нефтеносных и ≥ 0,4 в газоносных коллекторах.", "claims": [], "page": 12, "by": "model"}, {"text": "При слоистой глинистости αₔₚ* снижается до 0,2 (газ) и 0,3 (нефть).", "claims": [], "page": 12, "by": "model"}, {"text": "Отрицательная аномалия СП при Cₛ > Cₖ не является признаком коллектора.", "claims": [], "page": 12, "by": "model"}, {"text": "К коллекторам относят лишь пласты, где αₔₚ > αₔₚ*.", "claims": [], "page": 12, "by": "model"}, {"text": "Исключение: песчаники/алевролиты с карбонатным/силикатным цементом.", "claims": [], "page": 12, "by": "model"}, {"text": "Эти породы имеют максимальные ΔUₔₚ и αₔₚ, но являются неколлекторами.", "claims": [], "page": 12, "by": "model"}, {"text": "Ошибочное отнесение характерно для Волго-Урала, Западной Сибири, Мангышлака.", "claims": [], "page": 12, "by": "model"}, {"text": "Такие пласты исключают по микрозонтам и пористости как плотные породы.", "claims": [], "page": 12, "by": "model"}, {"text": "Критическое αₔₚ* можно найти без ηₓₛ* и зависимости αₔₚ = f(ηₓₛ).", "claims": [], "page": 12, "by": "model"}], "steps": [{"text": "Определить тип глинистости (рассеянная или слоистая) и флюид (нефть/газ).", "claims": [], "page": 12, "by": "model"}, {"text": "Выбрать порог αₔₚ* (0,5/0,4 для крупных провинций, 0,3/0,2 для слоистой).", "claims": [], "page": 12, "by": "model"}, {"text": "Сравнить измеренное αₔₚ с порогом: коллектор, если αₔₚ > αₔₚ*.", "claims": [], "page": 12, "by": "model"}, {"text": "Проверить на ложные срабатывания: плотные породы с высоким αₔₚ.", "claims": [], "page": 12, "by": "model"}, {"text": "Исключить ложные срабатывания по данным пористости и микрозондов.", "claims": [], "page": 12, "by": "model"}], "examples": [], "numbers": [{"text": "Диапазон αₔₚ для терригенных коллекторов: 0,3—0,8.", "claims": [], "page": 12, "by": "model"}, {"text": "Порог αₔₚ* для крупных провинций: ≥ 0,5 (нефть), ≥ 0,4 (газ).", "claims": [], "page": 12, "by": "model"}, {"text": "Порог αₔₚ* для слоистой глинистости: до 0,2 (газ), до 0,3 (нефть).", "claims": [], "page": 12, "by": "model"}], "formulas": [], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Высокое αₔₚ может быть у плотных неколлекторов с карбонатным цементом.", "claims": [], "page": 12, "by": "model"}, {"text": "Коллектор определяется превышением порога αₔₚ*, а не абсолютным значением.", "claims": [], "page": 12, "by": "model"}]},  разработке.", "claims": ["sp-critical-value-determination.c2"], "page": 13, "by": "model"}], "how_it_works": [{"text": "Сопоставляют величину альфа СП с удельным коэффициентом продуктивности для испытанных объектов.", "claims": ["sp-critical-value-determination.c3"], "page": 13, "by": "model"}, {"text": "Для заданного значения находят альфа СП по полученной зависимости.", "claims": ["sp-critical-value-determination.c4"], "page": 13, "by": "model"}, {"text": "Если нижний предел не определен, график продолжают до пересечения с осью ординат для нулевого значения.", "claims": ["sp-critical-value-determination.c5"], "page": 13, "by": "model"}, {"text": "Альтернативный способ: накладывают диаграмму распределения альфа СП для коллекторов на диаграмму для неколлекторов.", "claims": ["sp-critical-value-determination.c6"], "page": 13, "by": "model"}, {"text": "Абсцисса точки пересечения распределений соответствует искомой величине альфа СП.", "claims": ["sp-critical-value-determination.c7"], "page": 13, "by": "model"}, {"text": "Необходимо располагать результатами опробования большого числа объектов.", "claims": ["sp-critical-value-determination.c8"], "page": 13, "by": "model"}, {"text": "Это возможно лишь на поздней стадии разведки или на стадии разработки месторождения.", "claims": ["sp-critical-value-determination.c9"], "page": 13, "by": "model"}, {"text": "Преимущество: определение непосредственно путем анализа данных опробования без промежуточных параметров и петрофизических связей.", "claims": ["sp-critical-value-determination.c10"], "page": 13, "by": "model"}], "steps": [], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Результаты опробования большого числа объектов, значения альфа СП и удельного коэффициента продуктивности.", "output": "Критическое значение альфа СП.", "breaks": [{"text": "Методы не работают при отсутствии результатов опробования большого числа объектов.", "claims": ["sp-critical-value-determination.c8"], "page": 13, "by": "model"}], "hypotheses": [{"text": "Гипотеза: пересечение распределений в данных можно автоматизировать алгоритмами классификации.", "claims": ["sp-critical-value-determination.c6", "sp-critical-value-determination.c7"], "page": 13, "by": "model"}]}, "analogy": {"text": "Поиск порогового значения через пересечение двух распределений аналогичен подбору порога классификации (threshold tuning) по ROC-кривой для разделения классов.", "breaks_where": "В геологии распределения строятся по физическим измерениям скважин, а не по искусственным признакам выборки ML."}, "now_practice": [], "layers": {"mechanism": [{"text": "Определение порогов через прямой анализ данных опробования без промежуточных петрофизических связей.", "claims": ["sp-critical-value-determination.c10"], "page": 13, "by": "model"}], "practice": [{"text": "Применяется на поздней стадии разведки или стадии разработки месторождения.", "claims": ["sp-critical-value-determination.c9"], "page": 13, "by": "model"}], "nuances": [{"text": "При неопределенном нижнем прейделе график продлевается до пересечения с осью ординат при нулевом продуктивном коэффициенте.", "claims": ["sp-critical-value-determination.c5"], "page": 13, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.sp-critical-value-determination.ill1", "class": "B", "src": "media/vendelshtein.sp-critical-value-determination-links.svg", "alt": "Карта шага: на что он опирается и куда ведёт: Определение критического значения метода СП", "caption": "Карта шага: на что он опирается и куда ведёт", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "sp-critical-value-determination.c1", "kind": "observation", "text": "Критическое значение находят сопоставлением с коэффициентом продуктивности или пересечением распределений.", "quote": "В этом случае для испытанных объектов сопоставляют величину  \\( \\alpha_{СП} \\)   с удельным коэффициентом п ри неопределенном нижнем пределе график продолжают до оси ординат для нулевого коэффициента.", "quote": "если нижний предел  \\( \\eta_{пр}^{*} \\)  для данного геологического объекта не определен, величину  \\( \\alpha_{СП}^{*} \\)  находят, продолжая график  \\( \\alpha_{СП} = f(\\eta_{пр}) \\)  до пересечения с осью ординат, т. е. для  \\( \\eta_{пр} = 0 \\)", "unit": "u013-01", "page": 13, "by": "model", "verified": true}, {"id": "sp-critical-value-determination.c6", "kind": "observation", "text": "Диаграмму распределения для коллекторов накладывают на диаграмму для неколлекторов.", "quote": "накладывают диаграмму статистического распределения  \\( \\alpha_{СП} \\)  для коллекторов на диаграмму распределения  \\( \\alpha_{СП} \\)  для неколлекторов", "unit": "u013-01", "page": 13, "by": "model", "verified": true}, {"id": "sp-critical-value-determination.c7", "kind": "observation", "text": "Абсцисса точки пересечения распределений соответствует искомой величине.", "quote": "при этом абсцисса точки пересечения распределений соответствует величине  \\( \\alpha_{СП} \\)", "unit": "u013-01", "page": 13, "by": "model", "verified": true}, {"id": "sp-critical-value-determination.c8", "kind": "observation", "text": "Необходимо располагать результатами опробования большого числа объектов.", "quote": "необходимо располагать результатами опробования большого числа объектов", "unit": "u013-02", "page": 13, "by": "model", "verified": true}, {"id": "sp-critical-value-determination.c9", "kind": "observation", "text": "Способы возможны лишь на поздней стадии разведки или разработки.", "quote": "что возможно лишь на поздней стадии разведки или на стадии разработки месторождения.", "unit": "u013-02", "page": 13, "by": "model", "verified": true}, {"id": "sp-critical-value-determination.c10", "kind": "observation", "text": "Преимущество — анализ данных опробования без промежуточных параметров.", "quote": "Преимущество этих способов — возможность определения  \\( \\alpha_{СП}^{*} \\)  непосредственно путем анализа данных опробования без каких-либо промежуточных параметров и петрофизических связей.", "unit": "u013-02", "page": 13, "by": "model", "verified": true}], "term_ids": ["t-sp-method", "t-productivity-coefficient"], "units": ["u013-01", "u013-02", "u013-07", "u013-08"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "vendelshtein.gamma-ray-method-limitations", "order": 7, "part_id": "p1", "minutes": 4, "title": "Гамма-метод выделения коллекторов и его ограничения", "book_title": "Косвенные количественные признаки. Характер насыщения, эффективная мощность, положение ВНК и ГЖК", "pages": [13, 14], "difficulty": {"primary": "И", "secondary": "Н"}, "threshold": true, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». Текст содержит формулу расчета, перечисления ограничений и методологические шаги, требующие структурированного изложения для ИТ-специалистов.", "scene_template": "tool-in-well"}, "summary": [{"text": "Гамма-метод позволяет выделять коллекторы там, где метод собственных потенциалов неприменим, но требует порогового значения относительной амплитуды.", "claims": ["gamma-ray-method-limitations.c1", "gamma-ray-method-limitations.c2"], "page": 13, "by": "model"}, {"text": "Метод имеет ряд ограничений в полимиктовых, вулканогенных и геохимически измененных породах, требуя комплексной интерпретации с другими методами.", "claims": ["gamma-ray-method-limitations.c3", "gamma-ray-method-limitations.c4"], "page": 13, "by": "model"}], "how_it_works": [{"text": "Диаграммы СП нельзя применять в скважинах с соленым глинистым раствором, нефильтрующимся раствором на нефтяной основе и в обсаженных трубах.", "claims": ["gamma-ray-method-limitations.c1"], "page": 13, "by": "model"}, {"text": "Гамма-метод применяется для выделения коллекторов в интервалах минимальных значений естественной радиоактивности.", "claims": ["gamma-ray-method-limitations.c2"], "page": 13, "by": "model"}, {"text": "Для надежного выделения коллекторов необходимо иметь критическое значение относительной амплитуды.", "claims": ["gamma-ray-method-limitations.c3"], "page": 13, "by": "model"}, {"text": "Относительная амплитуда гамма-метода рассчитывается через регистрируемые интенсивности в пласте и породах с минимальной и максимальной радиоактивностью.", "claims": ["gamma-ray-method-limitations.c4", "gamma-ray-method-limitations.c5"], "page": 13, "by": "model"}, {"text": "Минимальные показания соответствуют наименее глинистым породам, максимальные — чистым глинам или высокой глинистости.", "claims": ["gamma-ray-method-limitations.c6"], "page": 13, "by": "model"}, {"text": "Критическое значение находят по корреляционной связи с глинистостью, сопоставлением с коэффициентом продуктивности или сравнением распределений.", "claims": ["gamma-ray-method-limitations.c7"], "page": 13, "by": "model"}, {"text": "Связь параметра пористости с глинистостью теснее, поэтому диаграмму СП используют в первую очередь, а ГМ — как вспомогательную.", "claims": ["gamma-ray-method-limitations.c8"], "page": 13, "by": "model"}, {"text": "По диаграмме ГМ можно ошибочно выделить плотные песчаники и алевролиты с карбонатным цементом, что требует данных микрозондов, НГМ и акустического метода.", "claims": ["gamma-ray-method-limitations.c9"], "page": 13, "by": "model"}, {"text": "В полимиктовых песчаниках, алевролитах с полевым шпатом и глауконитом ГМ не дает однозначного выделения из-за повышенной радиоактивности.", "claims": ["gamma-ray-method-limitations.c10"], "page": 14, "by": "model"}, {"text": "В вулканогенных отложениях выделить коллекторы по ГМ невозможно из-за высокой радиоактивности независимо от глинистости.", "claims": ["gamma-ray-method-limitations.c11"], "page": 14, "by": "model"}, {"text": "Трудности возникают в породах с радиоактивностью, повышенной из-за геохимических условий или радиогеохимического эффекта у ВНК.", "claims": ["gamma-ray-method-limitations.c12"], "page": 14, "by": "model"}, {"text": "Наиболее надежное выделение межзерновых коллекторов достигается комплексной интерпретацией методов пористости и глинистости.", "claims": ["gamma-ray-method-limitations.c13"], "page": 14, "by": "model"}, {"text": "Математические методы комплексной интерпретации разделяют породы на классы и строят литологическую колонку с коллекторами.", "claims": ["gamma-ray-method-limitations.c14"], "page": 14, "by": "model"}], "steps": [{"text": "Рассчитать относительную амплитуду J_gamma по формуле с минимальными и максимальными значениями интенсивности.", "claims": ["gamma-ray-method-limitations.c4", "gamma-ray-method-limitations.c5"], "page": 13, "by": "model"}, {"text": "Определить критическое значение относительной амплитуды через связь с глинистостью или продуктивностью.", "claims": ["gamma-ray-method-limitations.c7"], "page": 13, "by": "model"}, {"text": "Сопоставить полученные интервалы с данными других методов для исключения ложных срабатываний на плотных породах.", "claims": ["gamma-ray-method-limitations.c9", "gamma-ray-method-limitations.c13"], "page": 13, "by": "model"}], "examples": [], "numbers": [{"text": "Формула 1.5 определяет относительную амплитуду гамма-метода через три значения интенсивности излучения.", "claims": ["gamma-ray-method-limitations.c4", "gamma-ray-method-limitations.c5"], "page": 13, "by": "model"}], "formulas": [{"latex": "\\Delta \\mathrm{J} _ {\\gamma} = \\left(\\mathrm{I} _ {\\gamma \\mathrm{x}} - \\mathrm{I} _ {\\gamma \\min}\\right) / \\left(\\mathrm{I} _ {\\gamma \\max} - \\mathrm{I} _ {\\gamma \\min}\\right)", "page": 13, "vars": [{"sym": "I_{\\gamma x}", "meaning": "регистрируемая интенсивность в изучаемом пласте", "unit": "условные единицы"}, {"sym": "I_{\\gamma min}", "meaning": "минимальная интенсивность в разрезе", "unit": "условные единицы"}, {"sym": "I_{\\gamma max}", "meaning": "максимальная интенсивность в разрезе", "unit": "условные единицы"}]}], "tables": [], "misconception": {"wrong": "Гамма-каротаж измеряет глинистость напрямую.", "right": [{"text": "Гамма-метод измеряет естественную радиоактивность, которая лишь косвенно связана с глинистостью, и дает сбои в полимиктовых и вулканогенных породах.", "claims": ["gamma-ray-method-limitations.c10", "gamma-ray-method-limitations.c11"], "page": 14, "by": "model"}]}, "data_meaning": {"input": "Значения регистрируемых интенсивностей гамма-излучения по стволу скважины (I_gamma_x, I_gamma_min, I_gamma_max).", "output": "Выделенные интервалы пластов-коллекторов и литологическая колонка.", "breaks": [{"text": "Модель ломается на соленых глинистых растворах (для СП), полимиктовых песчаниках, глауконите, вулканитах и зонах с радиогеохимическими аномалиями у ВНК.", "claims": ["gamma-ray-method-limitations.c1", "gamma-ray-method-limitations.c10", "gamma-ray-method-limitations.c11", "gamma-ray-method-limitations.c12"], "page": 13, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Порог J_gamma* можно рассматривать как динамический порог классификатора, настраиваемый по историческим данным испытаний скважин.", "claims": ["gamma-ray-method-limitations.c7"], "page": 13, "by": "model"}]}, "analogy": {"text": "Ансамбль сенсоров в IoT или мультимодальный классификатор: один датчик может врать из-за помех (раствор, минералогия), но комбинация признаков дает надежный результат.", "breaks_where": "Физические законы радиоактивности минералов сложнее простых эмпирических весов в моделях машинного обучения."}, "now_practice": [{"text": "Сегодня разделение пород на классы и построение литологических колонок с выделением коллекторов автоматизировано в специализированном ПО комплексной интерпретации геофизических данных.", "claims": ["gamma-ray-method-limitations.c14"], "page": 14, "by": "model"}], "layers": {"mechanism": [{"text": "Гамма-метод регистрирует естественную радиоактивность пород, где минимум соответствует чистым песчаникам, а максимум — глинам.", "claims": ["gamma-ray-method-limitations.c2", "gamma-ray-method-limitations.c6"], "page": 13, "by": "model"}], "practice": [{"text": "Метод применяется как вспомогательный или основной при невозможности использования метода СП из-за типа бурового раствора.", "claims": ["gamma-ray-method-limitations.c1", "gamma-ray-method-limitations.c4", "gamma-ray-method-limitations.c12"], "page": 13, "by": "model"}], "nuances": [{"text": "Карбонатный цемент, полевые шпаты, глауконит, вулканиты и геохимические эффекты у ВНК создают ложные аномалии радиоактивности.", "claims": ["gamma-ray-method-limitations.c9", "gamma-ray-method-limitations.c10", "gamma-ray-method-limitations.c11", "gamma-ray-method-limitations.c12"], "page": 13, "by": "model"}], "deeper": [{"text": "Комплексирование методов пористости и глинистости позволяет взаимно корректировать результаты и повышать надежность выделения коллекторов.", "claims": ["gamma-ray-method-limitations.c13", "gamma-ray-method-limitations.c14"], "page": 14, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.gamma-ray-method-limitations.ill1", "class": "B", "src": "media/vendelshtein.gamma-ray-method-limitations-steps.svg", "alt": "Порядок действий по тексту автора: Гамма-метод выделения коллекторов и его ограничения", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "vendelshtein.gamma-ray-method-limitations.ill2", "class": "B", "src": "media/vendelshtein.gamma-ray-method-limitations-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Гамма-метод выделения коллекторов и его ограничения", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "vendelshtein.sp-critical-value-determination", "type": "prerequisite"}], "claims": [{"id": "gamma-ray-method-limitations.c1", "kind": "observation", "text": "Диаграммы СП нельзя применять в скважинах с соленым глинистым раствором, нефильтрующимся раствором на нефтяной основе и в обсаженных трубах.", "quote": "Диаграммы СП для выделения коллекторов в терригенном разрезе нельзя применять в скважинах, пробуренных с соленым глинистым раствором, с нефильтрующимся раствором на нефтяной основе и в обсаженных трубами скважинах.", "unit": "u013-03", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c2", "kind": "observation", "text": "Гамма-метод используется для выделения коллекторов там, где СП неприменим, в интервалах минимальной радиоактивности.", "quote": "Преимущество другого метода глинистости — гамма-метода — заключается в возможности использования его для выделения коллекторов в тех условиях, когда метод собственных потенциалов не может быть применен для решения этой задачи. Диаграммы ГМ, как и СП, давно используют для качественного выделения коллекторов в интервалах минимальных значений естественной радиоактивности", "unit": "u013-04", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c3", "kind": "inference", "text": "Для надежного выделения коллекторов по ГМ нужно критическое значение относительной амплитуды.", "quote": "стало очевидно, что для надежного выделения коллекторов по диаграммам ГМ (как и по СП) необходимо для каждого конкретного разреза иметь критическое значение относительной амплитуды", "unit": "u013-04", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c4", "kind": "observation", "text": "Относительная амплитуда гамма-метода рассчитывается через интенсивности в пласте и экстремальные значения по разрезу.", "quote": "\\Delta \\mathrm{J} _ {\\gamma} = \\left(\\mathrm{I} _ {\\gamma \\mathrm{x}} - \\mathrm{I} _ {\\gamma \\min}\\right) / \\left(\\mathrm{I} _ {\\gamma \\max} - \\mathrm{I} _ {\\gamma \\min}\\right)", "unit": "u013-05", "page": 13, "by": "model", "verified": false}, {"id": "gamma-ray-method-limitations.c5", "kind": "observation", "text": "Интенсивности регистрируются в изучаемом пласте и породах с минимальной и максимальной радиоактивностью.", "quote": "значения регистрируемых интенсивностей в изучаемом пласте и породах с минимальной и максимальной для данного разреза радиоактивностью.", "unit": "u013-06", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c6", "kind": "observation", "text": "Минимум соответствует наименее глинистым породам, максимум — чистым глинам.", "quote": "Уровень минимальных показаний I_\\gamma min соответствует в терригенном разрезе наименее глинистым породам, уровень максимальных показаний I_\\gamma max — чистым глинам или породам с высокой глинистостью.", "unit": "u013-09", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c7", "kind": "inference", "text": "Критическое значение находят через связь с глинистостью, продуктивностью или сравнение распределений.", "quote": "Величину \\Delta J\\gamma^{*} находят: а) используя критическое значение K_{гл}^{*} на основе корреляционной связи между \\Delta J\\gamma^{*} и K_{гл} ; б) сопоставляя \\Delta J\\gamma^{*} с удельным коэффициентом продуктивности \\eta_{пр} для испытанных объектов; в) сравнивая распределение \\Delta J\\gamma для коллекторов и неколлекторов.", "unit": "u013-10", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c8", "kind": "inference", "text": "СП предпочтительнее для выделения коллекторов из-за более тесной связи параметров, а ГМ — вспомогательный метод.", "quote": "связь параметра K_{пр} с \\eta_{гл} для терригенных пород значительно теснее, поэтому более целесообразно находить K_{пр}^{*} по критическому значению \\eta_{гл}^{*} и, следовательно, выделять коллекторы в первую очередь по диаграмме СП при использовании диаграммы ГМ в качестве вспомогательной", "unit": "u013-12", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c9", "kind": "observation", "text": "Плотные песчаники с карбонатным цементом могут ошибочно выделяться как коллекторы, что проверяется микрозондами, НГМ и акустикой.", "quote": "По диаграмме ГМ, как и по диаграмме СП, можно ошибочно выделить в качестве коллекторов плотные песчаники и алевролиты с карбонатным цементом; избежать этой ошибки можно только при учете дна- грамм микрозондов, нейтронного гамма-метода и акустического метода", "unit": "u013-14", "page": 13, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c10", "kind": "observation", "text": "В полимиктовых песчаниках, алевролитах с полевым шпатом и глауконитом ГМ дает сбои из-за повышенной радиоактивности.", "quote": "В разрезах с распространением полимиктовых песчаников и алевролитов диаграмма ГМ не обеспечивает однозначного выделения коллекторов (Западная Сибирь, Мангышлак), поскольку коллекторы с повышенным содержанием частиц полевого шпата и обломков пород характеризуются повышенной радиоактивностью... То же замечание можно отнести к разрезам с повышенным содержанием глауконита.", "unit": "u014-01", "page": 14, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c11", "kind": "observation", "text": "В вулканогенных отложениях выделить коллекторы по ГМ невозможно из-за высокой радиоактивности.", "quote": "Совершенно невозможно выделить коллекторы по диаграмме ГМ в вулканогенных отложениях, характеризующихся повышенной радиоактивностью независимо от содержания глинистого материала.", "unit": "u014-01", "page": 14, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c12", "kind": "observation", "text": "Геохимические условия и радиогеохимический эффект у ВНК создают трудности для ГМ.", "quote": "Трудно надежно выделить коллекторы в разрезах, содержащих породы-коллекторы, радиоактивность которых повышена вследствие геохимических условий, связанных с палеогеографической обстановкой в бассейне осадконакопления или возникших в процессе разработки месторождения (например, радиогеохимический эффект, приуроченный к зоне ВНК).", "unit": "u014-02", "page": 14, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c13", "kind": "inference", "text": "Комплексирование методов пористости и глинистости обеспечивает наиболее надежное выделение межзерновых коллекторов.", "quote": "Наиболее надежное выделение межзерновых коллекторов в терригенном разрезе обеспечивается при комплексной интерпретации диаграмм методов пористости и глинистости", "unit": "u014-03", "page": 14, "by": "model", "verified": true}, {"id": "gamma-ray-method-limitations.c14", "kind": "observation", "text": "Математические методы комплексной интерпретации разделяют породы на классы и строят литологическую колонку.", "quote": "В настоящее время разработаны математические методы комплексной интерпретации диаграмм промыслово-геофизических методов, обеспечивающие разделение на классы пород, содержащихся в изучаемом разрезе, составление литологической колонки, в которой указываются положение в разрезе и мощность пластов-коллекторов", "unit": "u014-04", "page": 14, "by": "model", "verified": true}], "term_ids": ["t-relative-gamma-ray-amplitude", "t-spontaneous-potential-method"], "units": ["u013-03", "u013-04", "u013-05", "u013-06", "u013-09", "u013-10", "u013-11", "u013-12", "u013-13", "u013-14", "u014-01", "u014-02", "u014-03", "u014-04"], "video_criteria": ["invisible_visible", "cause_effect"], "fallback": false}, {"id": "vendelshtein.nmr-reservoir-detection", "order": 8, "part_id": "p1", "minutes": 3, "title": "Ядерно-магнитный резонанс для выделения коллекторов", "book_title": "Косвенные количественные признаки. Характер насыщения, эффективная мощность, положение ВНК и ГЖК", "pages": [14, 14], "difficulty": {"primary": "И", "secondary": "М"}, "threshold": false, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, скачок масштаба. текст с формулами и ограничениями оптимален для объяснения физического метода и его границ применимости специалистам по данным", "scene_template": "tool-in-well"}, "summary": [{"text": "Метод ядерно-магнитного резонанса (ЯМР) в варианте сигнала свободной прецессии регистрирует три кривые сигнала U от ядер водорода. Метод позволяет однозначно выделять межзерновые коллекторы в терригенном разрезе и оценивать их эффективную пористость.", "claims": ["nmr-reservoir-detection.c1", "nmr-reservoir-detection.c2"], "page": 14, "by": "model"}, {"text": "Аномалия на кривых U выше уровня помех при эффективной пористости не менее 1% соответствует коллектору. Метод неприменим в вулканогенных отложениях, при глубокой кольматации и использовании нефтяных добавок в глинистый раствор.", "claims": ["nmr-reservoir-detection.c3", "nmr-reservoir-detection.c4"], "page": 14, "by": "model"}], "how_it_works": [{"text": "Метод ЯМР в варианте измерения сигнала свободной прецессии регистрирует три кривые величины U сигнала свободной прецессии ядер водорода.", "claims": ["nmr-reservoir-detection.c1"], "page": 14, "by": "model"}, {"text": "Кривые регистрируются через различное время t после выключения поляризующего магнитного поля, причем время возрастает как t1 меньше t2 меньше t3.", "claims": ["nmr-reservoir-detection.c5", "nmr-reservoir-detection.c6"], "page": 14, "by": "model"}, {"text": "Запись ведется в масштабе индекса свободного флюида ИСФ в процентах коэффициента эффективной пористости.", "claims": ["nmr-reservoir-detection.c7"], "page": 14, "by": "model"}, {"text": "Каждая аномалия на кривых U выше уровня помех при пороговом значении коэффициента эффективной пористости не менее 1% соответствует коллектору.", "claims": ["nmr-reservoir-detection.c3"], "page": 14, "by": "model"}, {"text": "Метод неприменим в разрезах с ферро- и парамагнитными минералами, особенно в вулканогенных отложениях.", "claims": ["nmr-reservoir-detection.c8"], "page": 14, "by": "model"}, {"text": "Метод неприменим при наличии глубоких зон кольматации более 2-3 см, характерных для высокопроницаемых коллекторов, которые на диаграмме ЯМР практически не выделяются.", "claims": ["nmr-reservoir-detection.c9"], "page": 14, "by": "model"}, {"text": "Метод неприменим при использовании нефтяных добавок в глинистый раствор.", "claims": ["nmr-reservoir-detection.c10"], "page": 14, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Порог выделения коллектора на кривых U составляет не менее 1% коэффициента эффективной пористости.", "claims": ["nmr-reservoir-detection.c3"], "page": 14, "by": "model"}, {"text": "Глубина зоны кольматации, при которой метод неприменим, составляет более 2-3 см.", "claims": ["nmr-reservoir-detection.c9"], "page": 14, "by": "model"}], "formulas": [{"latex": "K_{\\alpha\\phi} \\geqslant 1\\%", "page": 14, "vars": [{"sym": "K_{\\alpha\\phi}", "meaning": "коэффициент эффективной пористости", "unit": "%"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Входные данные — три кривые сигнала свободной прецессии U1, U2, U3, записанные через возрастающие интервалы времени t1, t2, t3 после выключения поляризующего поля в масштабе индекса свободного флюида.", "output": "Выходные данные — бинарный признак наличия межзернового коллектора (аномалия выше уровня помех) и оценка его эффективной пористости.", "breaks": [{"text": "Модель данных ломается в вулканогенных отложениях с ферро- и парамагнитными минералами, при кольматации глубиной более 2-3 см и при добавлении нефти в глинистый раствор.", "claims": ["nmr-reservoir-detection.c8", "nmr-reservoir-detection.c9", "nmr-reservoir-detection.c10"], "page": 14, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Кривые сигнала ЯМР можно рассматривать как временной ряд затухания сигнала, где порог решающего правила по амплитуде равен 1%.", "claims": ["nmr-reservoir-detection.c3"], "page": 14, "by": "model"}]}, "analogy": {"text": "ИТ-аналогия: Метод работает как сенсор с пороговым фильтром (порог 1%), который отсекает шумы и выделяет целевой сигнал, но слепнет при наличии магнитных помех в среде.", "breaks_where": "Физическая природа затухания ядерной намагниченности водорода не имеет прямого аналога в стандартных ИТ-сигналах."}, "now_practice": [{"text": "Сегодня оцифровка и анализ кривых ЯМР и расчет индекса свободного флюида выполняются в специализированном ПО интерпретации данных геофизических исследований скважин.", "claims": ["nmr-reservoir-detection.c1", "nmr-reservoir-detection.c7"], "page": 14, "by": "model"}], "layers": {"mechanism": [{"text": "Регистрация сигнала свободной прецессии ядер водорода во времени после выключения поляризующего магнитного поля.", "claims": ["nmr-reservoir-detection.c1", "nmr-reservoir-detection.c5"], "page": 14, "by": "model"}], "practice": [{"text": "Выделение межзерновых коллекторов в терригенном разрезе и оценка их эффективной пористости по диаграммам ЯМР.", "claims": ["nmr-reservoir-detection.c1", "nmr-reservoir-detection.c2"], "page": 14, "by": "model"}], "nuances": [{"text": "Ограничения метода включают вулканогенные породы, зоны кольматации более 2-3 см и нефтяные добавки в буровой раствор.", "claims": ["nmr-reservoir-detection.c8", "nmr-reservoir-detection.c9", "nmr-reservoir-detection.c10"], "page": 14, "by": "model"}], "deeper": [{"text": "Использование трех кривых U1, U2, U3 для анализа времени релаксации свободных флюидов в поровом пространстве.", "claims": ["nmr-reservoir-detection.c5", "nmr-reservoir-detection.c10"], "page": 14, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.nmr-reservoir-detection.ill1", "class": "B", "src": "media/vendelshtein.nmr-reservoir-detection-links.svg", "alt": "Карта шага: на что он опирается и куда ведёт: Ядерно-магнитный резонанс для выделения коллекторов", "caption": "Карта шага: на что он опирается и куда ведёт", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "nmr-reservoir-detection.c1", "kind": "observation", "text": "Метод ядерно-магнитного резонанса в варианте сигнала свободной прецессии регистрирует три кривые величины U сигнала свободной прецессии ядер

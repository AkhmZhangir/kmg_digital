laim_id": "part0-1.c1", "question": "Заполните пропуск в описании перехода к новым методам оценки.", "text": "Прямые качественные методы выделения коллекторов имеют ряд недостатков, поэтому в последние годы активно внедряются способы, основанные на использовании {{1}} критериев.", "answers": [["количественных"]], "explanation": "Текст прямо указывает, что для устранения недостатков качественных методов были разработаны способы с использованием количественных критериев."}, {"id": "vendelshtein.part0-1.q3", "node_id": "vendelshtein.part0-1", "type": "order", "claim_id": "part0-1.c5", "question": "Расставьте этапы определения критической величины проницаемости в логическом порядке:", "items": ["Определение нижнего предела экономически рентабельного дебита для района", "Расчет граничного значения удельного коэффициента продуктивности", "Учет вязкости флюида в пластовых условиях", "Расчет критической величины проницаемости"], "explanation": "Сначала определяется экономический порог, затем на его основе рассчитывается коэффициент продуктивности, и в конце, с учетом вязкости, вычисляется проницаемость."}, {"id": "vendelshtein.part0-2.q1", "node_id": "vendelshtein.part0-2", "type": "order", "claim_id": "part0-2.c9", "question": "Расставьте по порядку этапы определения граничных значений геофизических параметров:", "items": ["Выбор однородных интервалов испытаний", "Расчет проницаемости по гидродинамическим данным", "Усреднение геофизических параметров для выбранных интервалов", "Построение корреляционной связи между проницаемостью и геофизическими параметрами", "Определение граничных значений через уравнение регрессии"], "explanation": "Процесс начинается с подготовки данных (интервалы), их количественной оценки, статистического анализа и завершается расчетом порогов."}, {"id": "vendelshtein.part0-2.q2", "node_id": "vendelshtein.part0-2", "type": "multi", "claim_id": "part0-2.c3", "question": "Почему граничные значения проницаемости не являются неизменными константами? Выберите все верные утверждения:", "options": ["Они зависят от текущего технического уровня разработки месторождений", "Они определяются только физическими свойствами породы, которые не меняются", "Они зависят от экономических критериев отрасли", "Они жестко зафиксированы международными стандартами"], "answer": [0, 2], "explanation": "Граничные значения — это условные величины, которые адаптируются под текущие экономические условия и возможности технологий добычи."}, {"id": "vendelshtein.part0-2.q3", "node_id": "vendelshtein.part0-2", "type": "calc", "claim_id": "part0-2.c15", "question": "Если граничному значению проницаемости 1 мД соответствует пористость 16%, то какой будет верхняя граница пористости при учете диапазона изменения в 1%?", "answer": 17.0, "tolerance": 0.1, "unit": "%", "explanation": "Согласно тексту, диапазон изменения составляет 1%, поэтому 16% + 1% = 17%."}, {"id": "vendelshtein.part0-3.q1", "node_id": "vendelshtein.part0-3", "type": "calc", "claim_id": "part0-3.c12", "question": "В тексте главы указано, что числовые значения физических величин для расчетов в данных параграфах:", "answer": 0, "tolerance": 0, "unit": "шт", "explanation": "В тексте прямо сказано, что числовые значения физических величин в рассматриваемых параграфах не заданы."}, {"id": "vendelshtein.part0-3.q2", "node_id": "vendelshtein.part0-3", "type": "single", "claim_id": "part0-3.c7", "question": "Почему методы пористости редко применяются для выделения коллекторов в типичных терригенных разрезах?", "options": ["Из-за высокой стоимости проведения акустического и нейтронного методов.", "Из-за сложности учета влияния глинистости на показания приборов.", "Потому что терригенные породы слишком плотные для данных методов.", "Потому что методы пористости работают только в карбонатных породах."], "answer": 1, "explanation": "В тексте указано, что для типичных терригенных разрезов этот способ применяют редко, так как возникают трудности при учете влияния глинистости."}, {"id": "vendelshtein.part0-3.q3", "node_id": "vendelshtein.part0-3", "type": "cloze", "claim_id": "part0-3.c11", "question": "Заполните пропуск в описании метода СП", "text": "При условии постоянства минерализации вод и литологии вмещающих пород, аномалия СП позволяет оценить {{1}}.", "answers": [["относительную глинистость", "глинистость"]], "explanation": "Согласно тексту, при постоянстве минерализации и литологии аномалия СП отражает относительную глинистость породы."}, {"id": "vendelshtein.part0-4.q1", "node_id": "vendelshtein.part0-4", "type": "cloze", "claim_id": "part0-4.c13", "question": "Заполните пропуск", "text": "Использование относительной амплитуды {{1}} вместо абсолютной позволяет исключить технические погрешности масштаба диаграммы и влияние различий в минерализации бурового раствора.", "answers": [["α_СП", "альфа_СП"]], "explanation": "Относительная амплитуда α_СП нормирует данные, что нивелирует влияние внешних факторов и погрешностей измерений."}, {"id": "vendelshtein.part0-4.q2", "node_id": "vendelshtein.part0-4", "type": "order", "claim_id": "part0-4.c9", "question": "Расставьте типы отложений по порядку возрастания их типичного значения η_гл", "items": ["Кайнозойские отложения с монтмориллонитом", "Мезозой и верхний палеозой (глубина до 3-4 км)", "Глубокозалегающие породы (более 4 км)"], "explanation": "Значения η_гл увеличиваются от 0,3–0,4 для кайнозоя до 0,5–0,6 для глубокозалегающих пород."}, {"id": "vendelshtein.part0-4.q3", "node_id": "vendelshtein.part0-4", "type": "multi", "claim_id": "part0-4.c7", "question": "В каких случаях применение параметра η_гл* для разделения пород на коллекторы и неколлекторы будет наиболее эффективным?", "options": ["При наличии в породе нескольких видов цемента разного состава", "При отсутствии в коллекторах других видов цемента, кроме глинистого", "При однородном минеральном составе глинистого цемента", "При высокой неоднородности минерального состава глинистого цемента"], "answer": [1, 2], "explanation": "Модель η_гл наиболее надежна при отсутствии посторонних примесей в цементе и его однородности."}, {"id": "vendelshtein.sp-critical-value-determination.q1", "node_id": "vendelshtein.sp-critical-value-determination", "type": "single", "claim_id": "sp-critical-value-determination.c2", "question": "Почему методы определения критического значения СП не применяются на ранних этапах разведки месторождения?", "options": ["Из-за отсутствия необходимых петрофизических формул.", "Из-за необходимости иметь результаты опробования большого числа объектов.", "Из-за высокой погрешности измерений на ранних стадиях.", "Из-за невозможности построить график зависимости от коэффициента продуктивности."], "answer": 1, "explanation": "Методы требуют статистической базы данных опробования, которая накапливается только на поздних стадиях разведки или разработки."}, {"id": "vendelshtein.sp-critical-value-determination.q2", "node_id": "vendelshtein.sp-critical-value-determination", "type": "cloze", "claim_id": "sp-critical-value-determination.c7", "question": "Заполните пропуск в описании графического метода", "text": "При наложении диаграмм распределения коллекторов и неколлекторов, искомое критическое значение альфа СП соответствует {{1}} точки их пересечения.", "answers": [["абсциссе", "абсцисса"]], "explanation": "Согласно тексту, именно абсцисса точки пересечения распределений указывает на искомую величину."}, {"id": "vendelshtein.sp-critical-value-determination.q3", "node_id": "vendelshtein.sp-critical-value-determination", "type": "order", "claim_id": "sp-critical-value-determination.c5", "question": "Расставьте по порядку действия при определении критического значения, если нижний предел коэффициента продуктивности не определен:", "items": ["Построение зависимости альфа СП от коэффициента продуктивности", "Продление графика до пересечения с осью ординат", "Определение критического значения при нулевом коэффициенте продуктивности"], "explanation": "Логика метода заключается в экстраполяции имеющейся зависимости до нулевого значения продуктивности."}, {"id": "vendelshtein.gamma-ray-method-limitations.q1", "node_id": "vendelshtein.gamma-ray-method-limitations", "type": "order", "claim_id": "gamma-ray-method-limitations.c7", "question": "Расставьте этапы определения критического значения относительной амплитуды (ΔJγ*) по порядку:", "items": ["Анализ корреляционной связи между амплитудой и глинистостью", "Сопоставление амплитуды с коэффициентом продуктивности испытанных объектов", "Сравнение распределений амплитуд для коллекторов и неколлекторов"], "explanation": "Порядок соответствует методам определения критического порога, описанным в тексте."}, {"id": "vendelshtein.gamma-ray-method-limitations.q2", "node_id": "vendelshtein.gamma-ray-method-limitations", "type": "multi", "claim_id": "gamma-ray-method-limitations.c10", "question": "В каких случаях гамма-метод может дать ошибочные результаты при выделении коллекторов? Выберите все верные варианты:", "options": ["В разрезах с высоким содержанием глауконита", "В чистых песчаниках с минимальной радиоактивностью", "В вулканогенных отложениях", "В полимиктовых песчаниках с полевым шпатом"], "answer": [0, 2, 3], "explanation": "Глауконит, вулканиты и полевые шпаты повышают радиоактивность, что маскирует коллекторы, делая их похожими на глины."}, {"id": "vendelshtein.gamma-ray-method-limitations.q3", "node_id": "vendelshtein.gamma-ray-method-limitations", "type": "calc", "claim_id": "gamma-ray-method-limitations.c5", "question": "Для расчета относительной амплитуды Jγ используются три значения интенсивности. Какие из них необходимы для формулы?", "answer": 3, "tolerance": 0, "unit": "параметра", "explanation": "Для расчета нужны интенсивность в пласте, а также минимальная и максимальная интенсивности для данного разреза (всего 3 значения)."}, {"id": "vendelshtein.nmr-reservoir-detection.q1", "node_id": "vendelshtein.nmr-reservoir-detection", "type": "calc", "claim_id": "nmr-reservoir-detection.c9", "question": "При какой глубине зоны кольматации (в см) метод ЯМР становится неприменимым для выделения высокопроницаемых коллекторов?", "answer": 2.5, "tolerance": 0.5, "unit": "см", "explanation": "Согласно тексту, метод неприменим при наличии глубоких зон кольматации более 2-3 см."}, {"id": "vendelshtein.nmr-reservoir-detection.q2", "node_id": "vendelshtein.nmr-reservoir-detection", "type": "single", "claim_id": "nmr-reservoir-detection.c3", "question": "Что из перечисленного является необходимым условием для того, чтобы аномалия на кривых U была признана коллектором?", "options": ["Аномалия должна быть выше уровня помех и соответствовать эффективной пористости не менее 1%.", "Аномалия должна быть зафиксирована только на первой кривой U1.", "Аномалия должна быть зафиксирована в вулканогенных отложениях.", "Аномалия должна быть получена при использовании нефтяных добавок в раствор."], "answer": 0, "explanation": "Текст прямо указывает, что аномалия выше уровня помех при эффективной пористости не менее 1% соответствует коллектору."}, {"id": "vendelshtein.nmr-reservoir-detection.q3", "node_id": "vendelshtein.nmr-reservoir-detection", "type": "cloze", "claim_id": "nmr-reservoir-detection.c1", "question": "Заполните пропуск в описании метода", "text": "Метод ЯМР в варианте сигнала свободной прецессии регистрирует три кривые величины U сигнала свободной прецессии {{1}}.", "answers": [["ядер водорода"]], "explanation": "Метод ЯМР основан на регистрации сигнала от ядер водорода."}, {"id": "vendelshtein.drilling-and-mud-logging-methods.q1", "node_id": "vendelshtein.drilling-and-mud-logging-methods", "type": "cloze", "claim_id": "drilling-and-mud-logging-methods.c3", "question": "Заполните пропуск в описании фильтрационного метода", "text": "Фильтрационный метод позволяет оценить коллекторские свойства пород путем фиксации объема {{1}}, который поглощается пластом в процессе бурения.", "answers": [["жидкости", "промывочной жидкости", "раствора"]], "explanation": "Фильтрационный метод основан на измерении поглощения промывочной жидкости, которая уходит в проницаемые пласты (коллекторы)."}, {"id": "vendelshtein.drilling-and-mud-logging-methods.q2", "node_id": "vendelshtein.drilling-and-mud-logging-methods", "type": "order", "claim_id": "drilling-and-mud-logging-methods.c7", "question": "Расставьте этапы изменения условий бурения по мере увеличения глубины", "items": ["Бурение на пресном глинистом растворе", "Уплотнение пород и рост глубины свыше 4—5 км", "Переход на использование технической или минерализованной воды", "Применение методов для сложных карбонатных коллекторов"], "explanation": "С увеличением глубины (более 4-5 км) меняется тип промывочной жидкости и характер пород, что требует смены методики интерпретации."}, {"id": "vendelshtein.drilling-and-mud-logging-methods.q3", "node_id": "vendelshtein.drilling-and-mud-logging-methods", "type": "multi", "claim_id": "drilling-and-mud-logging-methods.c6", "question": "В каких условиях стандартные методы выделения межзерновых коллекторов (по данным АСПБ) наиболее эффективны?", "options": ["На глубинах до 4—5 км", "При использовании минерализованной воды", "В терригенных разрезах со слабой и средней уплотненностью", "В сильно уплотненных карбонатных породах"], "answer": [0, 2], "explanation": "Метод эффективен для терригенных пород слабой/средней уплотненности на глубинах до 4-5 км при использовании пресного глинистого раствора."}, {"id": "vendelshtein.mud-activation-and-time-studies.q1", "node_id": "vendelshtein.mud-activation-and-time-studies", "type": "multi", "claim_id": "mud-activation-and-time-studies.c2", "question": "Почему метод временных исследований с активацией глинистого раствора не применяется повсеместно в любых скважинах?", "options": ["Он требует длительного простоя скважины.", "Он неэффективен для трещинно-кавернозных коллекторов.", "Он требует дополнительных финансовых затрат на активированный раствор.", "Он дает неточные результаты при высокой пористости."], "answer": [0, 2], "explanation": "Метод ограничен параметрическими скважинами именно из-за необходимости простоя и затрат на материалы."}, {"id": "vendelshtein.mud-activation-and-time-studies.q2", "node_id": "vendelshtein.mud-activation-and-time-studies", "type": "calc", "claim_id": "mud-activation-and-time-studies.c6", "question": "Какова минимальная разница в концентрации NaCl (в г/л), необходимая для обнаружения пласта с эффективной пористостью более 3% при нефтенасыщенности менее 5%?", "answer": 150, "tolerance": 50, "unit": "г/л", "explanation": "Согласно тексту, для обнаружения таких пластов достаточно разницы в 150-200 г/л."}, {"id": "vendelshtein.mud-activation-and-time-studies.q3", "node_id": "vendelshtein.mud-activation-and-time-studies", "type": "single", "claim_id": "mud-activation-and-time-studies.c3", "question": "Для каких целей применяются нейтронные методы в уже обсаженных скважинах?", "options": ["Для первичного бурения и вскрытия пласта.", "Для контроля за перемещением водонефтяного и газожидкостного контактов.", "Для активации глинистого раствора в открытом стволе.", "Для замены стандартных методов каротажа при бурении."], "answer": 1, "explanation": "В обсаженных скважинах нейтронные методы используются для оценки насыщения и мониторинга контактов флюидов в процессе разработки."}, {"id": "vendelshtein.saturation-evaluation-resistivity.q1", "node_id": "vendelshtein.saturation-evaluation-resistivity", "type": "single", "claim_id": "saturation-evaluation-resistivity.c12", "question": "Что произойдет, если глубина зоны проникновения бурового раствора окажется больше глубины исследования используемых зондов?", "options": ["Метод станет более точным за счет увеличения объема исследуемой породы.", "Разделить коллекторы на продуктивные и водоносные без дополнительных данных будет невозможно.", "Результаты измерений автоматически скорректируются с помощью палеток.", "Это никак не повлияет на достоверность оценки характера насыщения."], "answer": 1, "explanation": "Согласно тексту, при несоблюдении условия глубины зоны проникновения однозначное разделение коллекторов без дополнительных сведений невозможно."}, {"id": "vendelshtein.saturation-evaluation-resistivity.q2", "node_id": "vendelshtein.saturation-evaluation-resistivity", "type": "cloze", "claim_id": "saturation-evaluation-resistivity.c3", "question": "Заполните пропуск", "text": "Оценка характера насыщения пласта необходима для принятия решения о целесообразности {{1}} колонны и последующего опробования объектов.", "answers": [["спуска"]], "explanation": "Текст прямо указывает, что оценка используется для решения вопроса о целесообразности спуска колонны."}, {"id": "vendelshtein.saturation-evaluation-resistivity.q3", "node_id": "vendelshtein.saturation-evaluation-resistivity", "type": "order", "claim_id": "saturation-evaluation-resistivity.c2", "question": "Расставьте этапы оценки характера насыщения пласта по порядку:", "items": ["Определение электрического удельного сопротивления породы в неизмененной части", "Вычисление параметра насыщения P_n с учетом коэффициента пористости", "Сравнение полученных значений с критическими величинами", "Формирование вывода о промышленной нефтегазоносности объекта"], "explanation": "Процесс последовательно идет от получения первичных данных сопротивления к вычислениям, сравнению с порогами и итоговому заключению."}, {"id": "vendelshtein.part2-1.q1", "node_id": "vendelshtein.part2-1", "type": "order", "claim_id": "part2-1.c3", "question": "Расставьте факторы в порядке возрастания критического значения водонасыщения (от меньшего к большему):", "items": ["Низкая глинистость, крупные каналы", "Средняя глинистость, средние каналы", "Высокая глинистость, мелкие каналы"], "explanation": "Критическое значение водонасыщения увеличивается при росте глинистости и уменьшении размера каналов."}, {"id": "vendelshtein.part2-1.q2", "node_id": "vendelshtein.part2-1", "type": "multi", "claim_id": "part2-1.c9", "question": "Какие факторы могут привести к ложному признаку продуктивности (отскоку точки вверх) в водоносном коллекторе?", "options": ["Глубокое проникновение фильтрата глинистого раствора", "Высокая пористость пласта", "Неблагоприятные условия исследования", "Низкая глинистость коллектора"], "answer": [0, 2], "explanation": "Глубокое проникновение фильтрата повышает измеренное сопротивление, что имитирует продуктивный пласт."}, {"id": "vendelshtein.part2-2.q2", "node_id": "vendelshtein.part2-2", "type": "single", "claim_id": "part2-2.c2", "question": "Что означает ситуация, когда показания микроэкранированного зонда (МК) выше показаний экранированного зонда (МКК) в терригенном коллекторе?", "options": ["Пласт является водоносным", "Пласт является продуктивным", "Зона проникновения полностью расформирована", "Пласт обладает низкой пористостью"], "answer": 1, "explanation": "В терригенных и высокопористых карбонатных отложениях условие ρМК > ρМКК прямо указывает на продуктивный коллектор."}, {"id": "vendelshtein.part2-2.q3", "node_id": "vendelshtein.part2-2", "type": "cloze", "claim_id": "part2-2.c9", "question": "Заполните пропуск в зависимости выбора метода от условий пласта", "text": "При высокой глинистости и минерализации пластовых вод для получения более надежных результатов предпочтительнее использовать {{1}} нейтронные методы.", "answers": [["импульсные"]], "explanation": "Текст указывает, что с ростом минерализации и глинистости преимущество переходит именно к импульсным нейтронным методам."}, {"id": "vendelshtein.part2-3.q1", "node_id": "vendelshtein.part2-3", "type": "cloze", "claim_id": "part2-3.c4", "question": "Заполните пропуск", "text": "Для эффективного применения метода при пористости 10% контрастность времен жизни нейтронов в пластовом флюиде и фильтрате должна составлять не менее {{1}} раз.", "answers": [["2,5", "2.5"]], "explanation": "Согласно тексту, при пористости 10% требуется контрастность не менее чем в 2,5 раза."}, {"id": "vendelshtein.part2-3.q2", "node_id": "vendelshtein.part2-3", "type": "order", "claim_id": "part2-3.c6", "question": "Расставьте по порядку этапы обработки данных для выявления изменения насыщения:", "items": ["Выполнение фонового и повторных замеров", "Исправление показаний на аппаратурные эффекты и фон", "Построение корреляционного графика замеров", "Проведение линии регрессии для выделения отклоняющихся пластов"], "explanation": "Алгоритм предполагает сначала сбор данных, затем их очистку, визуализацию в виде графика и последующий статистический анализ."}, {"id": "vendelshtein.part2-3.q3", "node_id": "vendelshtein.part2-3", "type": "multi", "claim_id": "part2-3.c3", "question": "Какие условия критически важны для корректного сравнения результатов замеров?", "options": ["Использование идентичных приборов и источников излучения", "Проведение всех замеров в один и тот же день", "Одинаковые режимы работы оборудования при каждом замере", "Обязательное эталонирование приборов перед каждым исследованием"], "answer": [0, 2, 3], "explanation": "Текст требует идентичности приборов, режимов и обязательного эталонирования, но не требует проведения всех замеров в один день (напротив, интервалы увеличиваются)."}, {"id": "vendelshtein.part2-4.q1", "node_id": "vendelshtein.part2-4", "type": "multi", "claim_id": "part2-4.c6", "question": "Какие изменения в показаниях ИНМ и декременте затухания λ произойдут при вытеснении соленого фильтрата нефтью?", "options": ["Показания ИНМ увеличатся", "Показания ИНМ уменьшатся", "Декремент затухания λ увеличится", "Декремент затухания λ уменьшится"], "answer": [0, 3], "explanation": "Согласно тексту, вытеснение соленого фильтрата нефтью способствует увеличению показаний ИНМ и уменьшению λ."}, {"id": "vendelshtein.part2-4.q2", "node_id": "vendelshtein.part2-4", "type": "calc", "claim_id": "part2-4.c4", "question": "Если среднеквадратическое отклонение σ равно 5, то в каких пределах (±σ) от линии регрессии y = ax + b будут находиться точки, соответствующие неизменным пластам?", "answer": 10, "tolerance": 0.1, "unit": "единиц", "explanation": "По тексту пласты считаются неизменными, если их точки попадают в полосу ±2σ, что при σ=5 составляет ±10."}, {"id": "vendelshtein.part2-4.q3", "node_id": "vendelshtein.part2-4", "type": "single", "claim_id": "part2-4.c4", "question": "Что означает выход точки пласта за пределы полосы ±2σ на корреляционном графике?", "options": ["Пласт обладает высокой проницаемостью", "Произошло изменение нейтронных свойств прискважинной зоны", "Прибор для замера был неисправен", "Фильтрат бурового раствора полностью отсутствует"], "answer": 1, "explanation": "Выход точки за пределы полосы ±2σ указывает на изменение нейтронных свойств прискважинной зоны из-за замещения фильтрата пластовым флюидом."}, {"id": "vendelshtein.part2-5.q1", "node_id": "vendelshtein.part2-5", "type": "single", "claim_id": "part2-5.c3", "question": "В чем заключается главное преимущество метода ИНМ-КВ при оценке характера насыщения?", "options": ["Возможность работы только в открытом стволе скважины", "Определение вида флюида по результатам однократных замеров", "Необходимость обязательного комплексирования с другими методами", "Использование исключительно повторных замеров через длительные промежутки времени"], "answer": 1, "explanation": "ИНМ-КВ позволяет установить вид флюида в прискважинной части по однократным замерам, что отличает его от традиционных методов."}, {"id": "vendelshtein.part2-5.q2", "node_id": "vendelshtein.part2-5", "type": "cloze", "claim_id": "part2-5.c4", "question": "Заполните пропуск в описании акустического метода", "text": "Для увеличения радиуса исследования в обсаженной скважине в широкополосной модификации акустического метода используется {{1}} частота излучения.", "answers": [["низкая"]], "explanation": "Согласно тексту, для увеличения радиуса исследования применяется именно низкая частота (1 – 5 сигма_кв)."}, {"id": "vendelshtein.part2-5.q3", "node_id": "vendelshtein.part2-5", "type": "order", "claim_id": "part2-5.c7", "question": "Расставьте этапы анализа сигнала при переходе от водонасыщенного коллектора к нефтенасыщенному (при ВНК)", "items": ["Фиксация исходного сигнала в водонасыщенном коллекторе", "Наблюдение снижения сигнала альфа_f", "Наблюдение увеличения сигнала альфа_s", "Определение нефтенасыщенной части пласта"], "explanation": "Нефтенасыщенная часть характеризуется одновременным снижением сигнала альфа_f и увеличением сигнала альфа_s по сравнению с водонасыщенным коллектором."}, {"id": "vendelshtein.part2-6.q1", "node_id": "vendelshtein.part2-6", "type": "multi", "claim_id": "part2-6.c1", "question": "Какие утверждения верно описывают методику изучения характера насыщения коллекторов в обсаженной скважине?", "options": ["Акустический метод в обсаженной скважине требует уникальной схемы, отличной от всех других методов.", "Временные исследования акустическим методом опираются на схему, принятую в радиометрических методах.", "Для оценки насыщения в обсаженной скважине применяются временные исследования.", "Радиометрические методы не подходят для временных исследований в обсаженных скважинах."], "answer": [1, 2], "explanation": "Текст прямо указывает на использование схемы радиометрических исследований для проведения временных акустических исследований в обсаженных скважинах."}, {"id": "vendelshtein.part2-6.q2", "node_id": "vendelshtein.part2-6", "type": "single", "claim_id": "part2-6.c1", "question": "Почему для акустического метода в обсаженной скважине выбрана именно схема радиометрических исследований?", "options": ["Потому что акустический метод физически идентичен радиометрическому.", "Потому что эта схема уже отработана и эффективна для проведения временных исследований в обсаженных скважинах.", "Потому что акустический метод не может работать без радиоактивного источника.", "Потому что это единственный способ измерения, доступный в обсаженной скважине."], "answer": 1, "explanation": "Методика заимствована из радиометрии как проверенный способ проведения временных исследований для оценки характера насыщения."}, {"id": "vendelshtein.part3-1.q2", "node_id": "vendelshtein.part3-1", "type": "single", "claim_id": "part3-1.c5", "question": "Почему при бурении высокопроницаемых коллекторов с большой репрессией аномалии газометрии могут не проявиться?", "options": ["Из-за слишком высокой скорости бурения.", "Из-за глубокого проникновения фильтрата, блокирующего выход газа в скважину.", "Из-за того, что газ в таких пластах состоит только из метана.", "Из-за химической реакции глинистого раствора с породой."], "answer": 1, "explanation": "Значительная репрессия при высокой проницаемости способствует глубокому проникновению фильтрата, что препятствует фиксации газовых аномалий."}, {"id": "vendelshtein.part3-1.q3", "node_id": "vendelshtein.part3-1", "type": "cloze", "claim_id": "part3-1.c3", "question": "Заполните пропуск в описании газометрии", "text": "На диаграммах газометрии нефтеносные коллекторы выделяются аномалией тяжелых углеводородов, а газоносные — аномалией {{1}} фракции.", "answers": [["метановой"]], "explanation": "Согласно тексту, именно метановая фракция является индикатором газоносных коллекторов."}, {"id": "vendelshtein.part3-2.q1", "node_id": "vendelshtein.part3-2", "type": "cloze", "claim_id": "part3-2.c10", "question": "Заполните пропуск", "text": "Наличие переходной зоны в нижней части нефтенасыщенного коллектора обусловлено влиянием {{1}} сил на распределение воды в порах.", "answers": [["капиллярных"]], "explanation": "Переходная зона формируется именно из-за капиллярных сил, удерживающих воду в порах коллектора."}, {"id": "vendelshtein.part3-2.q2", "node_id": "vendelshtein.part3-2", "type": "order", "claim_id": "part3-2.c5", "question": "Расставьте по порядку действия при определении эффективной мощности неоднородного пласта", "items": ["Определение общей мощности пласта", "Выделение прослоев-неколлекторов по комплексу ГИС", "Исключение мощности прослоев-неколлекторов из общей мощности", "Получение итоговой эффективной мощности"], "explanation": "Эффективная мощность в неоднородном пласте получается путем вычитания неколлекторов из общей мощности пласта."}, {"id": "vendelshtein.part3-2.q3", "node_id": "vendelshtein.part3-2", "type": "multi", "claim_id": "part3-2.c7", "question": "В каких случаях для определения эффективной мощности применяют методику анизотропина?", "options": ["При работе с однородными пластами большой мощности", "При наличии ультратонких переслаиваний коллекторов и неколлекторов", "Когда необходимо одновременно оценить коэффициент нефтегазонасыщения", "Для определения положения водонефтяного контакта"], "answer": [1, 2], "explanation": "Методика анизотропина разработана специально для тонких переслаиваний и позволяет определять мощность вместе с нефтегазонасыщением."}, {"id": "vendelshtein.part3-3.q1", "node_id": "vendelshtein.part3-3", "type": "multi", "claim_id": "part3-3.c6", "question": "Что из перечисленного верно характеризует водонефтяной контакт (ВНК) и переходную зону?", "options": ["ВНК всегда совпадает с зеркалом воды в нижней части переходной зоны.", "ВНК устанавливается по уровню, где возможен промышленный приток нефти с водой.", "Переходная зона характеризуется постоянным нефтенасыщением по всей своей мощности.", "При испытании верхней части переходной зоны можно получить приток безводной нефти."], "answer": [1, 3], "explanation": "ВНК определяется по порогу промышленного притока, а верхняя граница переходной зоны дает безводную нефть."}, {"id": "vendelshtein.part3-3.q3", "node_id": "vendelshtein.part3-3", "type": "single", "claim_id": "part3-3.c7", "question": "Какую часть разреза скважины геологи включают в эффективную мощность для подсчета запасов нефти?", "options": ["Весь интервал от зеркала воды до кровли пласта.", "Только интервал зоны предельного нефтенасыщения.", "Интервал от водонефтяного контакта (ВНК) до кровли переходной зоны.", "Интервал от зеркала воды до подошвы зоны предельного нефтенасыщения."], "answer": 2, "explanation": "Согласно тексту, эффективная мощность для подсчета запасов включает интервал от ВНК до кровли переходной зоны."}, {"id": "vendelshtein.part3-4.q1", "node_id": "vendelshtein.part3-4", "type": "single", "claim_id": "part3-4.c5", "question": "Почему при определении ВНК методом сопротивлений без учета влияния фильтрата бурового раствора возможна ошибка?", "options": ["Фильтрат вымывает нефть, делая породу полностью водонасыщенной.", "Фильтрат проникает в пласт и искажает показания сопротивления, имитируя нефтенасыщенную породу.", "Метод сопротивлений не работает в обсаженных скважинах из-за влияния металла.", "Гравитационное перераспределение флюидов полностью уничтожает переходную зону."], "answer": 1, "explanation": "Проникновение фильтрата бурового раствора в пласт может искажать данные сопротивления, создавая ложное впечатление о наличии нефти там, где её нет."}, {"id": "vendelshtein.part3-4.q2", "node_id": "vendelshtein.part3-4", "type": "cloze", "claim_id": "part3-4.c4", "question": "Заполните пропуск в описании переходной зоны", "text": "Мощность переходной зоны существенно зависит от литологии: в чистых кварцевых песчаниках она составляет доли метра, тогда как в глинистых коллекторах может достигать {{1}} метров.", "answers": [["20-30", "20–30"]], "explanation": "Согласно тексту, мощность переходной зоны в глинистых коллекторах варьируется от 20 до 30 метров."}, {"id": "vendelshtein.part3-4.q3", "node_id": "vendelshtein.part3-4", "type": "order", "claim_id": "part3-4.c1", "question": "Расставьте этапы определения ВНК в правильном порядке", "items": ["Определение границ переходной зоны", "Построение графика зависимости сопротивления от глубины", "Установление критических порогов сопротивления и проницаемости", "Фиксация глубины ВНК как точки пересечения графика с критическим порогом"], "explanation": "Логическая последовательность начинается с анализа границ, построения модели, выбора критериев и завершается определением искомой глубины."}, {"id": "vendelshtein.part3-5.q1", "node_id": "vendelshtein.part3-5", "type": "order", "claim_id": "part3-5.c5", "question": "Расставьте по порядку этапы статистического определения порогового значения λ* для классификации пластов:", "items": ["Сбор данных по скважинам с надежно установленным характером насыщения", "Построение кривых распределения декремента затухания λ для водоносных и нефтеносных пластов", "Определение области неоднозначности путем сопоставления распределений", "Выбор порогового значения λ* для классификации пластов"], "explanation": "Алгоритм предполагает сначала накопление достоверных данных, затем визуализацию распределений, поиск зоны пересечения и, наконец, выбор порога для принятия решения."}, {"id": "vendelshtein.part3-5.q2", "node_id": "vendelshtein.part3-5", "type": "multi", "claim_id": "part3-5.c2", "question": "Какие факторы могут привести к некорректной работе нейтронных методов в обсаженных скважинах?", "options": ["Наличие нерасформированной зоны проникновения фильтрата", "Слишком высокая минерализация поровых вод", "Низкая пористость коллектора при низкой минерализации вод", "Использование комплекса ИНМ и НГМ в высокопористых пластах"], "answer": [0, 2], "explanation": "Малый радиус исследования требует расформирования зоны проникновения, а низкая минерализация делает пласты неразличимыми для нейтронных методов."}, {"id": "vendelshtein.part3-5.q3", "node_id": "vendelshtein.part3-5", "type": "calc", "claim_id": "part3-5.c3", "question": "Минимально допустимая минерализация поровых вод (г/л) для разделения пластов в чистых высокопористых коллекторах согласно тексту:", "answer": 20, "tolerance": 0, "unit": "г/л", "explanation": "В тексте прямо указано, что для чистых относительно-высокопористых коллекторов требуется минерализация более 20 г/л."}, {"id": "vendelshtein.part3-6.q1", "node_id": "vendelshtein.part3-6", "type": "single", "claim_id": "part3-6.c1", "question": "Почему при определении нефтеносности пласта недостаточно использовать только параметр λ?", "options": ["Параметр λ не связан с физическими свойствами породы.", "Диапазоны значений λ для разных типов насыщения могут пересекаться.", "Параметр λ всегда равен нулю в водоносных пластах.", "Методы измерения λ слишком неточные для практического применения."], "answer": 1, "explanation": "Если диапазоны значений λ для водоносных и нефтеносных пластов перекрываются, требуется дополнительный учет глинистости и пористости для корректной классификации."}, {"id": "vendelshtein.part3-6.q2", "node_id": "vendelshtein.part3-6", "type": "cloze", "claim_id": "part3-6.c4", "question": "Заполните пропуск в описании метода коррекции", "text": "Для устранения влияния глинистости из измеренного значения λ необходимо {{1}} величину поправки Δλгл.", "answers": [["вычесть", "вычитание"]], "explanation": "Согласно тексту, исправление за влияние глинистости сводится к вычитанию из λ величины Δλгл."}, {"id": "vendelshtein.part3-6.q3", "node_id": "vendelshtein.part3-6", "type": "calc", "claim_id": "part3-6.c7", "question": "Если приведение значений λ к типичному коэффициенту пористости (Kн) требует вычисления поправки Δλн, то что происходит с исходным значением λ в процессе этой операции?", "answer": 0, "tolerance": 0, "unit": "единиц", "explanation": "Поправка Δλн рассчитывается для приведения λ к типичному значению Kн, что подразумевает математическую корректировку исходного показателя."}, {"id": "vendelshtein.wnl-detection-pulsed-neutron.q1", "node_id": "vendelshtein.wnl-detection-pulsed-neutron", "type": "cloze", "claim_id": "wnl-detection-pulsed-neutron.c3", "question": "Заполните пропуск", "text": "Для корректного определения ВНК замеры ИНМ рекомендуется проводить только после {{1}} зоны проникновения бурового раствора.", "answers": [["расформирования"]], "explanation": "Замеры в зоне проникновения могут дать искаженные результаты, так как буровой раствор замещает пластовый флюид."}, {"id": "vendelshtein.wnl-detection-pulsed-neutron.q2", "node_id": "vendelshtein.wnl-detection-pulsed-neutron", "type": "order", "claim_id": "wnl-detection-pulsed-neutron.c4", "question": "Расставьте по порядку процессы, приводящие к повышению чувствительности ИНМ при работе скважины:", "items": ["Снижение забойного давления ниже давления насыщения", "Выделение свободного газа в прискважинной зоне", "Повышение показаний прибора ИНМ"], "explanation": "Снижение давления вызывает газовыделение, которое меняет физические свойства среды, что фиксируется прибором как повышение показаний."}, {"id": "vendelshtein.wnl-detection-pulsed-neutron.q3", "node_id": "vendelshtein.wnl-detection-pulsed-neutron", "type": "multi", "claim_id": "wnl-detection-pulsed-neutron.c2", "question": "Какие факторы необходимо учитывать для повышения надежности результатов ИНМ?", "options": ["Коэффициент глинистости (kгл)", "Атмосферное давление на поверхности", "Коэффициент нефтенасыщенности (kн)", "Цвет бурового раствора"], "answer": [0, 2], "explanation": "Глинистость и нефтенасыщенность напрямую влияют на нейтронные свойства пласта, поэтому их учет критически важен для интерпретации данных."}, {"id": "vendelshtein.dual-measurement-gas-correction.q1", "node_id": "vendelshtein.dual-measurement-gas-correction", "type": "multi", "claim_id": "dual-measurement-gas-correction.c1", "question": "Почему необходимо выдерживать паузу в 5—10 часов после остановки скважины перед вторым замером?", "options": ["Чтобы накопить достаточное количество газа в пласте для точного замера", "Для стабилизации условий в стволе скважины и исключения влияния нестабильного газа", "Чтобы приборы нейтронного метода успели остыть после работы в скважине", "Для того чтобы глинистость пласта перестала влиять на показания приборов"], "answer": [1], "explanation": "Пауза необходима для стабилизации условий в стволе скважины, так как нестабильный газовый фактор искажает данные."}, {"id": "vendelshtein.gnl-detection-conditions.q1", "node_id": "vendelshtein.gnl-detection-conditions", "type": "single", "claim_id": "gnl-detection-conditions.c1", "question": "Почему при низких пластовых давлениях (менее 200–300 кгс/см²) важно отсутствие зоны проникновения для работы нейтронных методов?", "options": ["Зона проникновения искажает плотность водородсодержащих флюидов, на которые реагируют нейтронные методы.", "При низком давлении нейтронные методы работают только в условиях вакуума.", "Зона проникновения делает пластовое давление выше 500 кгс/см², что запрещено для этих методов.", "Нейтронные методы не могут работать, если в пласте есть хоть какая-то жидкость."], "answer": 0, "explanation": "Нейтронные методы реагируют на изменение плотности водородсодержащих флюидов, а зона проникновения нарушает естественное распределение этих флюидов в поровом пространстве."}, {"id": "vendelshtein.neutron-decay-gas-formula.q1", "node_id": "vendelshtein.neutron-decay-gas-formula", "type": "multi", "claim_id": "neutron-decay-gas-formula.c1", "question": "Почему важно уметь рассчитывать декремент затухания поля нейтронов в газе?", "options": ["Чтобы математически выделить вклад газа из общего процесса затухания нейтронного поля.", "Чтобы напрямую измерить общую мощность коллектора без учета других фаз.", "Чтобы оценить насыщение пласта в импульсных нейтронных методах.", "Чтобы полностью исключить влияние инструментальных шумов прибора."], "answer": [0, 2], "explanation": "Расчет декремента позволяет отделить влияние газа от общей картины затухания, что необходимо для оценки насыщения пласта."}, {"id": "vendelshtein.apparent-porosity-correction.q2", "node_id": "vendelshtein.apparent-porosity-correction", "type": "single", "claim_id": "apparent-porosity-correction.c1", "question": "Почему нейтронные методы требуют коррекции на глинистость при определении пористости?", "options": ["Глина поглощает нейтроны, что приводит к занижению пористости.", "Связанная вода в глине воспринимается прибором как пористость, завышая показания.", "Глинистые минералы полностью блокируют работу нейтронного прибора.", "Нейтронные методы измеряют только плотность, а не пористость."], "answer": 1, "explanation": "Нейтронные методы чувствительны к водороду, а связанная вода в глине искажает показания, завышая кажущуюся пористость."}, {"id": "vendelshtein.porosity-clay-correlation.q2", "node_id": "vendelshtein.porosity-clay-correlation", "type": "order", "claim_id": "porosity-clay-correlation.c2", "question": "Расставьте этапы оценки пласта при использовании двухмерного сопоставления:", "items": ["Анализ данных нейтронных методов", "Оценка степени дифференциации показаний между типами флюидов", "Принятие решения о необходимости введения дополнительных поправок"], "explanation": "Сначала анализируются данные, затем оценивается их дифференциация, что определяет необходимость поправок."}], "cards": [{"id": "vendelshtein.part0-1.card", "node_id": "vendelshtein.part0-1", "front": "На чем основывается выбор граничных значений параметров при выделении коллекторов?", "back": "На представлении о нижнем пределе экономически рентабельного дебита нефти или газа для конкретного района."}, {"id": "vendelshtein.part0-2.card", "node_id": "vendelshtein.part0-2", "front": "Является ли значение проницаемости 1 мД универсальным нижним пределом для всех месторождений?", "back": "Нет, это условная величина, которая зависит от экономики, технологий и конкретного типа объекта."}, {"id": "vendelshtein.part0-3.card", "node_id": "vendelshtein.part0-3", "front": "Как выбирают метод выделения коллекторов в разрезе?", "back": "Выбор зависит от типа разреза: для карбонатных и плотных пород используют методы пористости, для терригенных — методы самопроизвольной поляризации (СП) и гамма-методы."}, {"id": "vendelshtein.part0-4.card", "node_id": "vendelshtein.part0-4", "front": "Что такое параметр η_гл и зачем он нужен?", "back": "Это комплексный параметр, объединяющий пористость и глинистость для четкого разделения пород на коллекторы и неколлекторы."}, {"id": "vendelshtein.part0-5.card", "node_id": "vendelshtein.part0-5", "front": "Введение", "back": "Коллектор определяется не просто аномалией сопротивления, а превышением критического порога αₔₚ."}, {"id": "vendelshtein.sp-critical-value-determination.card", "node_id": "vendelshtein.sp-critical-value-determination", "front": "В чем заключается главное преимущество методов определения критического значения СП, описанных в тексте?", "back": "Возможность определения значения напрямую из данных опробования без использования промежуточных петрофизических связей."}, {"id": "vendelshtein.gamma-ray-method-limitations.card", "node_id": "vendelshtein.gamma-ray-method-limitations", "front": "Почему гамма-метод не всегда позволяет однозначно выделить коллектор?", "back": "Из-за влияния неголинистых факторов: радиоактивных минералов (полевой шпат, глауконит), вулканитов, карбонатного цемента и геохимических аномалий."}, {"id": "vendelshtein.nmr-reservoir-detection.card", "node_id": "vendelshtein.nmr-reservoir-detection", "front": "Какое минимальное значение эффективной пористости необходимо для выделения коллектора методом ЯМР?", "back": "Не менее 1%."}, {"id": "vendelshtein.drilling-and-mud-logging-methods.card", "node_id": "vendelshtein.drilling-and-mud-logging-methods", "front": "Почему на глубинах свыше 4—5 км стандартные методы выделения межзерновых коллекторов становятся неэффективными?", "back": "Из-за высокой уплотненности пород и использования минерализованной промывочной жидкости, что требует применения методов для сложных карбонатных коллекторов."}, {"id": "vendelshtein.mud-activation-and-time-studies.card", "node_id": "vendelshtein.mud-activation-and-time-studies", "front": "В чем заключается основное ограничение применения метода временных исследований с активацией раствора?", "back": "Высокая стоимость и необходимость простоя скважины ограничивают его использование только специальными параметрическими скважинами."}, {"id": "vendelshtein.saturation-evaluation-resistivity.card", "node_id": "vendelshtein.saturation-evaluation-resistivity", "front": "Зачем в геофизике сравнивают измеренные параметры ρ и P_n с критическими значениями ρ*_n и P*_n?", "back": "Чтобы разделить коллекторы на промышленно-продуктивные и непромышленные."}, {"id": "vendelshtein.part2-1.card", "node_id": "vendelshtein.part2-1", "front": "Как определить характер насыщения коллектора, если его глинистость и пористость сильно меняются?", "back": "Необходимо использовать комплексный подход, сопоставляя данные методов сопротивлений, глинистости и пористости на кросс-плотах."}, {"id": "vendelshtein.part2-2.card", "node_id": "vendelshtein.part2-2", "front": "Как оценивают характер насыщения коллектора в обсаженных скважинах?", "back": "Через временные нейтронные или акустические исследования, отслеживающие расформирование зоны проникновения фильтрата."}, {"id": "vendelshtein.part2-3.card", "node_id": "vendelshtein.part2-3", "front": "На чем основан метод оценки характера насыщения коллектора в обсаженных скважинах?", "back": "На сравнении повторных нейтронных замеров и выявлении пластов, изменивших свойства из-за расформирования зоны проникновения фильтрата."}, {"id": "vendelshtein.part2-4.card", "node_id": "vendelshtein.part2-4", "front": "Как по методу двух замеров определить, что в пласте произошло замещение фильтрата на нефть?", "back": "Построить корреляционный график: если точка вышла за пределы полосы ±2σ и при этом показания ИНМ выросли, а декремент затухания λ уменьшился, значит произошло вытеснение соленого фильтрата нефтью."}, {"id": "vendelshtein.part2-5.card", "node_id": "vendelshtein.part2-5", "front": "Какие два основных метода используются для оценки характера насыщения в обсаженных скважинах?", "back": "Методы ИНМ-КВ и акустический метод (включая широкополосную низкочастотную модификацию)."}, {"id": "vendelshtein.part2-6.card", "node_id": "vendelshtein.part2-6", "front": "Как проводят временные исследования акустическим методом в обсаженной скважине?", "back": "По схеме, принятой для радиометрических исследований."}, {"id": "vendelshtein.part3-1.card", "node_id": "vendelshtein.part3-1", "front": "Что делать, если геофизические методы не позволяют однозначно определить характер насыщения коллектора?", "back": "Применять прямые методы: газометрию и испытатели пластов на трубах или кабеле."}, {"id": "vendelshtein.part3-2.card", "node_id": "vendelshtein.part3-2", "front": "Что такое эффективная мощность коллектора и как она учитывает неоднородность пласта?", "back": "Это суммарная мощность всех продуктивных прослоев; в неоднородных пластах она определяется путем исключения из общей мощности прослоев-неколлекторов."}, {"id": "vendelshtein.part3-3.card", "node_id": "vendelshtein.part3-3", "front": "Зачем при интерпретации каротажных данных используют палетки В. Н. Дахнова?", "back": "Для пересчета фиктивной мощности пласта, зарегистрированной приборами, в его истинную мощность с учетом геометрии и физических свойств."}, {"id": "vendelshtein.part3-4.card", "node_id": "vendelshtein.part3-4", "front": "Что такое ВНК с точки зрения петрофизики и как его определяют?", "back": "ВНК — это не четкая линия, а переходная зона, положение которой определяют по графику зависимости сопротивления от глубины, сравнивая его с критическим порогом сопротивления."}, {"id": "vendelshtein.part3-5.card", "node_id": "vendelshtein.part3-5", "front": "Почему нейтронные методы в обсаженных скважинах требуют высокой минерализации поровых вод?", "back": "Нейтронные методы косвенно оценивают содержание хлора, связанного с минерализацией воды, что позволяет отличить водоносные пласты от нефтеносных."}, {"id": "vendelshtein.part3-6.card", "node_id": "vendelshtein.part3-6", "front": "Что делать, если диапазоны параметра λ для нефтеносных и водоносных пластов пересекаются?", "back": "Использовать методы коррекции на глинистость и пористость, применяя поправки или графики сопоставления."}, {"id": "vendelshtein.wnl-detection-pulsed-neutron.card", "node_id": "vendelshtein.wnl-detection-pulsed-neutron", "front": "Почему при определении ВНК импульсным нейтронным методом важно учитывать глинистость и нефтенасыщенность?", "back": "Эти параметры влияют на водородосодержание и сечение поглощения нейтронов, искажая показания прибора."}, {"id": "vendelshtein.dual-measurement-gas-correction.card", "node_id": "vendelshtein.dual-measurement-gas-correction", "front": "В чем заключается суть метода двукратных замеров для учета газа?", "back": "Сравнение показаний нейтронного метода в работающей и остановленной (через 5-10 ч) скважине для исключения влияния глинистости и газа в стволе."}, {"id": "vendelshtein.gnl-detection-conditions.card", "node_id": "vendelshtein.gnl-detection-conditions", "front": "От чего зависит успешность выделения газоносных пластов нейтронными методами?", "back": "От пластового давления, глинистости пород, минерализации пластовых вод и отсутствия зоны проникновения."}, {"id": "vendelshtein.neutron-decay-gas-formula.card", "node_id": "vendelshtein.neutron-decay-gas-formula", "front": "Что такое декремент затухания поля нейтронов в газе (λr) и как он рассчитывается?", "back": "Это величина, характеризующая скорость поглощения нейтронов газом; рассчитывается как λr = 4,75 * wr."}, {"id": "vendelshtein.apparent-porosity-correction.card", "node_id": "vendelshtein.apparent-porosity-correction", "front": "Зачем вводить поправку за глинистость при использовании нейтронных методов для определения пористости?", "back": "Чтобы исключить влияние связанной воды в глинах, которая ошибочно принимается прибором за пористость."}, {"id": "vendelshtein.porosity-clay-correlation.card", "node_id": "vendelshtein.porosity-clay-correlation", "front": "Почему в терригенных коллекторах при интерпретации нейтронных методов важно учитывать глинистость?", "back": "Глинистые минералы содержат водород, который искажает показания нейтронных методов, реагирующих на пористость (флюид)."}], "glossary": [{"id": "t-reservoir", "term": "Коллектор", "en": "Reservoir", "definition": "Горная порода, способная вмещать и пропускать нефть, газ или воду.", "node_id": "vendelshtein.part0-1", "page": 9}, {"id": "t-permeability-coefficient", "term": "Коэффициент проницаемости", "en": "Permeability coefficient", "definition": "Параметр, характеризующий способность породы пропускать флюиды.", "node_id": "vendelshtein.part0-1", "page": 9}, {"id": "t-drawdown-pressure", "term": "Депрессия", "en": "Drawdown pressure", "definition": "Разность между пластовым давлением и давлением на забое скважины.", "node_id": "vendelshtein.part0-1", "page": 9}, {"id": "t-drainage-radius", "term": "Радиус контура питания скважины", "en": "Drainage radius", "definition": "Радиус контура питания скважины, обозначаемый как Rs.", "node_id": "vendelshtein.part0-2", "page": 10}, {"id": "t-wellbore-radius", "term": "Радиус скважины", "en": "Wellbore radius", "definition": "Радиус скважины, обозначаемый как rc.", "node_id": "vendelshtein.part0-2", "page": 10}, {"id": "t-spontaneous-potential-sp", "term": "Самопроизвольная поляризация", "en": "Spontaneous Potential (SP)", "definition": "Метод геофизических исследований скважин, основанный на регистрации естественных электрических полей в скважине.", "node_id": "vendelshtein.part0-3", "page": 10}, {"id": "t-relative-clay-content", "term": "Относительная глинистость", "en": "Relative clay content", "definition": "Относительное содержание глинистого материала в породе, определяемое по геофизическим данным.", "node_id": "vendelshtein.part0-3", "page": 10}, {"id": "t-complex-clay-porosity-parameter", "term": "Комплексный параметр η_гл", "en": "Complex clay-porosity parameter", "definition": "Параметр, объединяющий величины пористости и глинистости пород для разделения их на коллекторы и неколлекторы.", "node_id": "vendelshtein.part0-4", "page": 11}, {"id": "t-relative-sp-amplitude", "term": "Относительная амплитуда СП", "en": "Relative SP amplitude", "definition": "Отношение амплитуды СП в пласте к максимальной амплитуде в наименее глинистых коллекторах участка.", "node_id": "vendelshtein.part0-4", "page": 11}, {"id": "t-sp-method", "term": "метод СП", "en": "SP method", "definition": "Геофизический метод исследования скважин.", "node_id": "vendelshtein.sp-critical-value-determination", "page": 13}, {"id": "t-productivity-coefficient", "term": "коэффициент продуктивности", "en": "productivity coefficient", "definition": "Параметр, характеризующий способность объекта выдавать продукцию.", "node_id": "vendelshtein.sp-critical-value-determination", "page": 13}, {"id": "t-relative-gamma-ray-amplitude", "term": "относительная амплитуда гамма-метода", "en": "relative gamma ray amplitude", "definition": "Нормализованное значение интенсивности гамма-излучения пласта относительно минимального и максимального уровней в разрезе.", "node_id": "vendelshtein.gamma-ray-method-limitations", "page": 13}, {"id": "t-spontaneous-potential-method", "term": "метод собственных потенциалов (СП)", "en": "spontaneous potential method", "definition": "Геофизический метод, использующий естественные электрические поля в скважине для выделения пластов-коллекторов.", "node_id": "vendelshtein.gamma-ray-method-limitations", "page": 13}, {"id": "t-free-induction-decay", "term": "Сигнал свободной прецессии", "en": "Free Induction Decay", "definition": "Сигнал ядер водорода, регистрируемый после выключения поляризующего магнитного поля в методе ЯМР.", "node_id": "vendelshtein.nmr-reservoir-detection", "page": 14}, {"id": "t-free-fluid-index", "term": "Индекс свободного флюида", "en": "Free Fluid Index", "definition": "Параметр, записываемый в процентах коэффициента эффективной пористости.", "node_id": "vendelshtein.nmr-reservoir-detection", "page": 14}, {"id": "t-clogging-mud-filtrate-invasion", "term": "Кольматация", "en": "Clogging / Mud filtrate invasion", "definition": "Закупорка пор породы буровым раствором на глубину более 2-3 см.", "node_id": "vendelshtein.nmr-reservoir-detection", "page": 14}, {"id": "t-acpb", "term": "станция контроля параметров бурения", "en": "ACPB", "definition": "Специальная автоматическая станция для регистрации параметров технологического процесса бурения, включая продолжительность бурения и поглощение жидкости.", "node_id": "vendelshtein.drilling-and-mud-logging-methods", "page": 14}, {"id": "t-time-lapse-tracer-logging-with-mud-activation", "term": "временные исследования с активацией раствора", "en": "time-lapse tracer logging with mud activation", "definition": "Метод выделения коллекторов в открытом стволе с помощью закачки меченой жидкости и оценки ее проникновения.", "node_id": "vendelshtein.mud-activation-and-time-studies", "page": 20}, {"id": "t-effective-porosity", "term": "эффективная пористость", "en": "effective porosity", "definition": "Доля объема пор, доступная для движения флюидов.", "node_id": "vendelshtein.mud-activation-and-time-studies", "page": 20}, {"id": "t-water-oil-contact", "term": "водонефтяной контакт", "en": "water-oil contact", "definition": "Поверхность раздела между нефтью и водой в залежи.", "node_id": "vendelshtein.mud-activation-and-time-studies", "page": 20}, {"id": "t-electrical-resistivity", "term": "удельное электрическое сопротивление ρ", "en": "electrical resistivity", "definition": "Электрическое сопротивление породы в её неизменённой части, используемое для оценки характера насыщения.", "node_id": "vendelshtein.saturation-evaluation-resistivity", "page": 20}, {"id": "t-resistivity-index", "term": "параметр насыщения P_n", "en": "resistivity index", "definition": "Параметр, используемый совместно с сопротивлением для оценки характера насыщения коллектора.", "node_id": "vendelshtein.saturation-evaluation-resistivity", "page": 20}, {"id": "t-invasion-zone", "term": "зона проникновения", "en": "invasion zone", "definition": "Область вокруг скважины, куда проник фильтрат бурового раствора, изменяя исходные свойства пласта.", "node_id": "vendelshtein.saturation-evaluation-resistivity", "page": 20}, {"id": "t-critical-water-saturation", "term": "критическое значение водонасыщения", "en": "critical water saturation", "definition": "Максимальное содержание воды в порах, при котором фазовая проницаемость по воде равна нулю, а фильтруется только нефть.", "node_id": "vendelshtein.part2-1", "page": 21}, {"id": "t-saturation-parameter", "term": "параметр насыщения", "en": "saturation parameter", "definition": "Величина, используемая совместно с показателями пористости для разделения коллекторов на продуктивные и водоносные.", "node_id": "vendelshtein.part2-1", "page": 21}, {"id": "t-shielded-probe", "term": "экранированный зонд", "en": "shielded probe", "definition": "Устройство электрического каротажа для измерения удельного сопротивления пород.", "node_id": "vendelshtein.part2-2", "page": 22}, {"id": "t-decay-constant", "term": "Декремент затухания", "en": "Decay constant", "definition": "Параметр, характеризующий скорость уменьшения плотности потока тепловых нейтронов во времени.", "node_id": "vendelshtein.part2-3", "page": 23}, {"id": "t-pulsed-neutron-logging", "term": "ИНМ", "en": "Pulsed Neutron Logging", "definition": "Импульсный нейтронный метод, используемый для оценки характера насыщения пласта.", "node_id": "vendelshtein.part2-4", "page": 23}, {"id": "t-ifnm-kv", "term": "ИНМ-КВ", "en": "IFNM-KV", "definition": "Метод исследования скважин, позволяющий устанавливать вид флюида по результатам однократных замеров.", "node_id": "vendelshtein.part2-5", "page": 24}, {"id": "t-fluid-saturation-type", "term": "характер насыщения", "en": "fluid saturation type", "definition": "Оценка того, чем заполнен коллектор (нефть, газ или вода).", "node_id": "vendelshtein.part2-6", "page": 25}, {"id": "t-gas-logging-mud-logging", "term": "газометрия", "en": "gas logging / mud logging", "definition": "Метод анализа состава газов в глинистом растворе для выявления нефте- и газоносных интервалов.", "node_id": "vendelshtein.part3-1", "page": 25}, {"id": "t-drill-stem-tester-wireline-formation-tester", "term": "испытатель пластов на трубах и кабеле", "en": "drill stem tester / wireline formation tester", "definition": "Аппаратура для прямой проверки продуктивности и отбора проб флюидов из пласта в открытом стволе скважины.", "node_id": "vendelshtein.part3-1", "page": 25}, {"id": "t-formation-tester-equipment", "term": "аппаратура КИИ", "en": "formation tester equipment", "definition": "Специализированная аппаратура для гидродинамических исследований и определения параметра K_{up}h_{\\phi}/\\mu.", "node_id": "vendelshtein.part3-1", "page": 25}, {"id": "t-permeability-profiling-equipment", "term": "аппаратура ОПТ", "en": "permeability profiling equipment", "definition": "Аппаратура для получения детального профиля проницаемости коллектора.", "node_id": "vendelshtein.part3-1", "page": 25}, {"id": "t-net-pay-thickness", "term": "эффективная мощность коллектора", "en": "net pay thickness", "definition": "Мощность продуктивного пласта-коллектора, определяемая по геофизическим данным с исключением неэффективных прослоев.", "node_id": "vendelshtein.part3-2", "page": 25}, {"id": "t-interpretation-chart", "term": "физическая палетка", "en": "interpretation chart", "definition": "График для определения истинных параметров пласта по их фиктивным значениям, измеренным в скважине.", "node_id": "vendelshtein.part3-3", "page": 26}, {"id": "t-transition-zone", "term": "переходная зона", "en": "transition zone", "definition": "Интервал пласта между зоной предельного нефтенасыщения и водоносным коллектором, где пласт содержит и нефть, и воду.", "node_id": "vendelshtein.part3-3", "page": 26}, {"id": "t-thermal-neutron-decay-constant", "term": "Декремент затухания поля тепловых нейтронов (λ)", "en": "Thermal neutron decay constant", "definition": "Параметр, характеризующий скорость поглощения тепловых нейтронов средой, зависящий от состава флюидов и минерализации воды.", "node_id": "vendelshtein.part3-5", "page": 28}, {"id": "t-pulsed-neutron-logging-x", "term": "Импульсный нейтронный метод (ИНМ)", "en": "Pulsed Neutron Logging", "definition": "Геофизический метод исследования скважин, основанный на облучении пласта импульсами быстрых нейтронов и регистрации вторичного гамма-излучения или тепловых нейтронов.", "node_id": "vendelshtein.wnl-detection-pulsed-neutron", "page": 29}, {"id": "t-apparent-porosity", "term": "Кажущаяся пористость", "en": "Apparent porosity", "definition": "Значение пористости, измеренное прибором без учета влияния глинистости и других минеральных факторов.", "node_id": "vendelshtein.apparent-porosity-correction", "page": 30}, {"id": "t-terrigenous-reservoirs", "term": "Терригенные коллекторы", "en": "Terrigenous reservoirs", "definition": "Коллекторы, сложенные обломочными породами (песчаники, алевролиты).", "node_id": "vendelshtein.porosity-clay-correlation", "page": 30}], "course_audit": {"report": {"nodes": 29, "tasks": 69, "task_types": {"single": 16, "cloze": 15, "order": 15, "multi": 15, "calc": 8}, "cards": 29, "coverage": {"units": 178, "linked": 176, "skipped_with_reason": 2, "uncovered": 0}, "claims": 249, "claims_ok": 239, "paras": 528, "paras_number_issues": 11, "claims_verified_share": 0.96, "requirements": {"tasks>=15": true, "task_types>=4": true, "cards_all_nodes": true, "coverage_100": true}, "issues": [{"node_id": "vendelshtein.part0-1", "message": "числа без опоры в цитате: 1.1", "text": "Рассчитать граничное значение удельного коэффициента продуктивности по формуле (1.1)."}, {"node_id": "vendelshtein.part0-1", "message": "числа без опоры в цитате: 1.2", "text": "Рассчитать критическую величину проницаемости по формуле (1.2) с учетом вязкости нефти или газа."}, {"node_id": "vendelshtein.part0-1", "message": "числа без опоры в цитате: 1.1, 1.2", "text": "Использование формул (1.1) и (1.2) для расчета граничных параметров продуктивности и проницаемости."}, {"node_id": "vendelshtein.part0-3", "claim": "part0-3.c12", "message": "цитата не найдена в u011-07 (совпадение 0%)"}, {"node_id": "vendelshtein.part0-4", "claim": "part0-4.c11", "message": "цитата не найдена в u012-02 (с

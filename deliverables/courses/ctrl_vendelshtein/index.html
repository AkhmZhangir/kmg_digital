ation", "text": "Времена t1, t2, t3 соотносятся как t1 меньше t2 меньше t3.", "quote": "t_{1}, t_{2}, t_{3} – кривые сигнала свободной прецессии, соответствующие времени t_{1}, t_{2}, t_{3} после выключения поляризующего поля ( t_{1} \u003c t_{2} \u003c t_{3} )", "unit": "u014-10", "page": 14, "by": "model", "verified": true}, {"id": "nmr-reservoir-detection.c7", "kind": "observation", "text": "Кривые записываются в масштабе индекса свободного флюида в процентах коэффициента эффективной пористости.", "quote": "Кривые записывают в масштабе значений индекса свободного флюида ИСФ, т. е. в процентах коэффициента эффективной пористости K_{\\alpha\\phi}", "unit": "u014-05", "page": 14, "by": "model", "verified": true}, {"id": "nmr-reservoir-detection.c8", "kind": "observation", "text": "Метод неприменим в разрезах с ферро- и парамагнитными минералами и вулканогенными отложениями.", "quote": "в разрезах, содержащих ферро- и парамагнитные минералы (в первую очередь в вулканогенных отложениях)", "unit": "u014-06", "page": 14, "by": "model", "verified": true}, {"id": "nmr-reservoir-detection.c9", "kind": "observation", "text": "Метод неприменим при наличии глубоких зон кольматации более 2-3 см в высокопроницаемых коллекторах.", "quote": "при наличии глубоких (более 2—3 см) зон кольматации, характерных обычно для высокопроницаемых коллекторов: последние на диаграмме ЯМР практически не выделяются", "unit": "u014-06", "page": 14, "by": "model", "verified": true}, {"id": "nmr-reservoir-detection.c10", "kind": "observation", "text": "Метод неприменим при использовании нефтяных добавок в глинистый раствор.", "quote": "при использовании нефтяных добавок в глинистый раствор", "unit": "u014-06", "page": 14, "by": "model", "verified": true}], "term_ids": ["t-free-induction-decay", "t-free-fluid-index", "t-clogging-mud-filtrate-invasion"], "units": ["u014-05", "u014-06", "u014-09", "u014-10"], "video_criteria": ["invisible_visible", "scale_jump"], "fallback": false}, {"id": "vendelshtein.drilling-and-mud-logging-methods", "order": 9, "part_id": "p1", "minutes": 2, "title": "Буровые и технологические методы выделения коллекторов", "book_title": "Косвенные количественные признаки. Характер насыщения, эффективная мощность, положение ВНК и ГЖК", "pages": [14, 14], "difficulty": {"primary": "И", "secondary": "Пр"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: изменение во времени. Текстовый формат оптимален для детального описания технологических методов, условий их применимости и ограничений по глубине и типу растворов.", "scene_template": "tool-in-well"}, "summary": [{"text": "Для выделения коллекторов применяются диаграммы продолжительности бурения и фильтрационный метод через автоматические станции контроля.", "claims": ["drilling-and-mud-logging-methods.c1"], "page": 14, "by": "model"}, {"text": "Приемы эффективны для терригенных разрезов со слабой и средней уплотненностью на глубине до 4—5 км на пресном растворе.", "claims": ["drilling-and-mud-logging-methods.c2"], "page": 14, "by": "model"}], "how_it_works": [{"text": "Помимо геофизических методов для выделения коллекторов используют диаграммы продолжительности бурения и фильтрационный метод.", "claims": ["drilling-and-mud-logging-methods.c1"], "page": 14, "by": "model"}, {"text": "Фильтрационный метод заключается в фиксировании количества жидкости, поглощаемого в процессе бурения породами.", "claims": ["drilling-and-mud-logging-methods.c3"], "page": 14, "by": "model"}, {"text": "Параметры регистрируются специальными автоматическими станциями контроля параметров бурения АСПБ.", "claims": ["drilling-and-mud-logging-methods.c4"], "page": 14, "by": "model"}, {"text": "Положительный опыт накоплен трестом Тюменьнефтегеофизика в нижнем мелу Среднеобской нефтегазоносной провинции.", "claims": ["drilling-and-mud-logging-methods.c5"], "page": 14, "by": "model"}, {"text": "Межзерновые коллекторы эффективно изучаются при слабой и средней уплотненности пород на глубине до 4—5 км на пресном глинистом растворе.", "claims": ["drilling-and-mud-logging-methods.c6"], "page": 14, "by": "model"}, {"text": "На глубине свыше 4—5 км породы уплотненные и часто не содержат межзерновых коллекторов, а скважины бурят на технической или минерализованной воде.", "claims": ["drilling-and-mud-logging-methods.c7"], "page": 14, "by": "model"}, {"text": "В сложных условиях задачу выделения коллекторов усложняют, используя способы для карбонатных коллекторов сложных типов.", "claims": ["drilling-and-mud-logging-methods.c8"], "page": 14, "by": "model"}], "steps": [{"text": "Регистрация параметров бурения автоматическими станциями АСПБ (продолжительность бурения и поглощение жидкости).", "claims": ["drilling-and-mud-logging-methods.c1", "drilling-and-mud-logging-methods.c3", "drilling-and-mud-logging-methods.c4"], "page": 14, "by": "model"}, {"text": "Оценка характера разреза с учетом глубины до 4—5 км и типа промывочной жидкости (пресный глинистый раствор).", "claims": ["drilling-and-mud-logging-methods.c6"], "page": 14, "by": "model"}, {"text": "Применение усложненных подходов карбонатного типа при глубинах более 4—5 км и использовании технической воды.", "claims": ["drilling-and-mud-logging-methods.c7", "drilling-and-mud-logging-methods.c8"], "page": 14, "by": "model"}], "examples": [], "numbers": [{"text": "Глубина залегания пород составляет до 4—5 км или свыше 4—5 км.", "claims": ["drilling-and-mud-logging-methods.c6", "drilling-and-mud-logging-methods.c7"], "page": 14, "by": "model"}], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Данные АСПБ: диаграммы продолжительности бурения и объемы поглощаемой в процессе бурения жидкости, глубина, тип бурового раствора.", "output": "Выделенные интервалы коллекторов в разрезе скважины.", "breaks": [{"text": "На глубинах свыше 4—5 км при использовании технической или минерализованной воды стандартные признаки межзерновых коллекторов не работают.", "claims": ["drilling-and-mud-logging-methods.c7", "drilling-and-mud-logging-methods.c8"], "page": 14, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Данные АСПБ можно подавать в предиктивные модели машинного обучения как временные ряды или числовые фичи наряду с ГИС для авторазметки интервалов.", "claims": [], "page": 14, "by": "model"}]}, "analogy": {"text": "Автоматическая станция контроля параметров бурения (АСПБ) работает как система логирования телеметрии сервера или датчиков IoT, фиксирующая косвенные аномалии нагрузки и потребления ресурса в процессе выполнения операции.", "breaks_where": "Серверные метрики отражают цифровую нагрузку мгновенно, а физическое бурение завязано на сложные геологические и механические свойства горных пород с большой инерцией."}, "now_practice": [{"text": "Сегодня параметры бурения и поглощения интегрируются в единые программные комплексы геолого-технологических исследований (ГТИ) и оперативной литологической интерпретации.", "claims": [], "page": 14, "by": "model"}], "layers": {"mechanism": [{"text": "Регистрация механической скорости бурения и поглощения промывочной жидкости специальной автоматической станцией АСПБ.", "claims": ["drilling-and-mud-logging-methods.c1", "drilling-and-mud-logging-methods.c3", "drilling-and-mud-logging-methods.c4"], "page": 14, "by": "model"}], "practice": [{"text": "Применение метода в терригенных отложениях нижнего мела Среднеобской провинции на глубинах до 4—5 км с пресным глинистым раствором.", "claims": ["drilling-and-mud-logging-methods.c5", "drilling-and-mud-logging-methods.c6"], "page": 14, "by": "model"}], "nuances": [{"text": "Условия глубин свыше 4—5 км, уплотненных пород и минерализованной или технической воды требуют перехода на методы для сложных карбонатных коллекторов.", "claims": ["drilling-and-mud-logging-methods.c7", "drilling-and-mud-logging-methods.c8"], "page": 14, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.drilling-and-mud-logging-methods.ill1", "class": "B", "src": "media/vendelshtein.drilling-and-mud-logging-methods-steps.svg", "alt": "Порядок действий по тексту автора: Буровые и технологические методы выделения коллекторов", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "vendelshtein.drilling-and-mud-logging-methods.ill2", "class": "B", "src": "media/vendelshtein.drilling-and-mud-logging-methods-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Буровые и технологические методы выделения коллекторов", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "drilling-and-mud-logging-methods.c1", "kind": "observation", "text": "Для выделения коллекторов используют диаграммы продолжительности бурения и фильтрационный метод.", "quote": "Для выделения коллекторов помимо геофизических методов можно использовать диаграммы продолжительности бурения и «фильтрационного метода»", "unit": "u014-07", "page": 14, "by": "model", "verified": true}, {"id": "drilling-and-mud-logging-methods.c2", "kind": "inference", "text": "Существуют альтернативные методы выделения коллекторов помимо стандартной геофизики.", "quote": "Для выделения коллекторов помимо геофизических методов можно использовать диаграммы продолжительности бурения и «фильтрационного метода»", "unit": "u014-07", "page": 14, "by": "model", "verified": true}, {"id": "drilling-and-mud-logging-methods.c3", "kind": "observation", "text": "Фильтрационный метод фиксирует количество жидкости, поглощаемой породами при бурении.", "quote": "«фильтрационного метода» (фиксирование количества жидкости, поглощаемого в процессе бурения породами)", "unit": "u014-07", "page": 14, "by": "model", "verified": true}, {"id": "drilling-and-mud-logging-methods.c4", "kind": "observation", "text": "Параметры регистрируются автоматическими станциями АСПБ.", "quote": "регистрируемые специальными автоматическими станциями контроля параметров бурения (АСПБ)", "unit": "u014-07", "page": 14, "by": "model", "verified": true}, {"id": "drilling-and-mud-logging-methods.c5", "kind": "observation", "text": "Метод успешно применялся в тресте Тюменьнефтегеофизика в нижнем мелу Среднеобской провинции.", "quote": "Положительный опыт применения этих способов выделения коллекторов накоплен в тресте Тюменьнефтегеофизика при изучении терригенных продуктивных отложений нижнего мела Среднеобской нефтегазоносной провинции", "unit": "u014-07", "page": 14, "by": "model", "verified": true}, {"id": "drilling-and-mud-logging-methods.c6", "kind": "observation", "text": "Приемы эффективны для межзерновых коллекторов на глубине до 4—5 км на пресном глинистом растворе.", "quote": "Рассмотренные приемы выделения межзернового коллектора эффективны при изучении терригенных разрезов со слабой и средней уплотненностью пород на глубине до 4—5 км при бурении на пресном глинистом растворе.", "unit": "u014-08", "page": 14, "by": "model", "verified": true}, {"id": "drilling-and-mud-logging-methods.c7", "kind": "observation", "text": "На глубинах свыше 4—5 км породы уплотненные, часто без межзерновых коллекторов, а бурение идет на технической или минерализованной воде.", "quote": "В практике все чаще приходится изучать терригенные отложения, залегающие на глубине свыше 4—5 км, уплотненные, часто не содержащие межзерновых коллекторов. Определенную часть скважин бурят с использованием в качестве промывочной жидкости технической воды, нередко минерализованной.", "unit": "u014-08", "page": 14, "by": "model", "verified": true}, {"id": "drilling-and-mud-logging-methods.c8", "kind": "inference", "text": "В сложных условиях глубины и соленой воды задачи решаются способами для сложных карбонатных коллекторов.", "quote": "В этих условиях задача выделения коллекторов, в частности межзерновых, существенно усложняется. Основные способы выделения коллекторов в этих условиях по существу аналогичны тем, которые разработаны для выделения и изучения карбонатных коллекторов сложных типов", "unit": "u014-08", "page": 14, "by": "model", "verified": true}], "term_ids": ["t-acpb"], "units": ["u014-07", "u014-08"], "video_criteria": ["time_change"], "fallback": false}, {"id": "vendelshtein.mud-activation-and-time-studies", "order": 10, "part_id": "p1", "minutes": 2, "title": "Временные исследования с активацией раствора", "book_title": "Косвенные количественные признаки. Характер насыщения, эффективная мощность, положение ВНК и ГЖК", "pages": [20, 20], "difficulty": {"primary": "Пр", "secondary": "И"}, "threshold": false, "format": {"primary": "long", "reason": "Тип «процедура»; критерии видеоёмкости: изменение во времени, цепочка «причина → следствие». Текст подходит для текстового урока с элементами интерактивных таблиц порогов концентраций.", "scene_template": "step-flow"}, "summary": [{"text": "Временные исследования с активацией глинистого раствора позволяют выделить коллекторы любого типа в открытом стволе, включая сложные трещинно-кавернозные и трещинно-поровые пласты.", "claims": ["mud-activation-and-time-studies.c1"], "page": 20, "by": "model"}, {"text": "Метод требует простоя скважин и затрат на активированный раствор, поэтому применяется в специальных параметрических скважинах.", "claims": ["mud-activation-and-time-studies.c2"], "page": 20, "by": "model"}, {"text": "В обсаженных скважинах нейтронные методы применяют для оценки насыщения и контроля за перемещением водонефтяного и газожидкостного контактов.", "claims": ["mud-activation-and-time-studies.c3"], "page": 20, "by": "model"}], "how_it_works": [{"text": "При высокой эффективной пористости более 3-4% в качестве меченой жидкости используют соленую или пресную воду.", "claims": ["mud-activation-and-time-studies.c4"], "page": 20, "by": "model"}, {"text": "Требуемые концентрации уменьшают обратно пропорционально эффективной пористости.", "claims": ["mud-activation-and-time-studies.c5"], "page": 20, "by": "model"}, {"text": "Различие в концентрациях NaCl на 150-200 г/л воды достаточно для обнаружения пластов с эффективной пористостью более 3% при нефтенасыщенности менее 5%, а также пластов с пористостью 8-10% при нефтенасыщенности 20%.", "claims": ["mud-activation-and-time-studies.c6"], "page": 20, "by": "model"}], "steps": [{"text": "Провести временные исследования в открытом стволе с активацией глинистого раствора для выделения коллектора.", "claims": ["mud-activation-and-time-studies.c7"], "page": 20, "by": "model"}, {"text": "Провести временные исследования нейтронными методами в обсаженных скважинах для оценки характера насыщения коллекторов, выделенных до спуска колонны.", "claims": ["mud-activation-and-time-studies.c8"], "page": 20, "by": "model"}, {"text": "Контролировать перемещение водонефтяного и газожидкостного контактов в ходе разработки эксплуатационных скважин.", "claims": ["mud-activation-and-time-studies.c9"], "page": 20, "by": "model"}], "examples": [], "numbers": [{"text": "При высокой эффективной пористости более 3-4% возможно использование меченой жидкости.", "claims": ["mud-activation-and-time-studies.c10"], "page": 20, "by": "model"}, {"text": "Различие в концентрациях NaCl на 150-200 г/л воды достаточно для обнаружения пластов с K_n.п.ф > 3% при K_н \u003c 5% и пластов с K_n.п.ф = 8 + 10% при K_н = 20%.", "claims": ["mud-activation-and-time-studies.c11"], "page": 20, "by": "model"}], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Данные временных исследований с активацией раствора, концентрации NaCl, значения эффективной пористости и нефтенасыщенности.", "output": "Выделенные коллекторы любого типа, оценка характера насыщения и положение контактов флюидов.", "breaks": [{"text": "Метод требует простоя скважин и дополнительных затрат, из-за чего ограничен параметрическими скважинами.", "claims": [], "page": 20, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Разница концентраций NaCl может быть оцифрована в виде признака для автоматического выделения коллекторов по порогам решающего правила.", "claims": [], "page": 20, "by": "model"}]}, "analogy": {"text": "Метод аналогичен инъекции контрастного вещества в медицинском сканировании для выделения аномальных зон.", "breaks_where": "Контраст в скважине требует механического простоя бурения и изменения состава раствора, что гораздо дороже и дольше медицинских процедур."}, "now_practice": [{"text": "Сегодня подобные геохимические и радиоактивные технологические эксперименты со специальной активацией раствора применяются реже и точечно, уступая место комплексу стандартных быстроголосовых методов каротажа в открытом стволе.", "claims": [], "page": 20, "by": "model"}], "layers": {"mechanism": [{"text": "Использование контрастирования раствора соленой или пресной водой для фиксации изменений в пластах с разной эффективной пористостью.", "claims": ["mud-activation-and-time-studies.c12"], "page": 20, "by": "model"}], "practice": [{"text": "Применение в специальных параметрических скважинах из-за простоя и затрат.", "claims": ["mud-activation-and-time-studies.c13"], "page": 20, "by": "model"}], "nuances": [{"text": "Пороговые значения концентрации NaCl зависят от эффективной пористости и нефтенасыщенности.", "claims": ["mud-activation-and-time-studies.c14"], "page": 20, "by": "model"}], "deeper": [{"text": "Нейтронные методы в обсаженных скважинах для мониторинга разработки и контактов.", "claims": ["mud-activation-and-time-studies.c15"], "page": 20, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "vendelshtein.mud-activation-and-time-studies.ill1", "class": "B", "src": "media/vendelshtein.mud-activation-and-time-studies-steps.svg", "alt": "Порядок действий по тексту автора: Временные исследования с активацией раствора", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "vendelshtein.mud-activation-and-time-studies.ill2", "class": "B", "src": "media/vendelshtein.mud-activation-and-time-studies-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Временные исследования с активацией раствора", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "mud-activation-and-time-studies.c1", "kind": "observation", "text": "Временные исследования с активацией глинистого раствора выделяют коллекторы любого типа, включая трещинно-кавернозные и трещинно-поровые.", "quote": "Временные исследования с активацией глинистого раствора — весьма эффективный способ выделения в открытом стволе коллектора любого типа, в частности наиболее сложных типов коллекторов — трещинно-кавернозных, трещинно-поровых и т. п.", "unit": "u020-02", "page": 20, "by": "model", "verified": true}, {"id": "mud-activation-and-time-studies.c2", "kind": "observation", "text": "Недостаток метода — простой скважин и затраты, поэтому он используется в специальных параметрических скважинах.", "quote": "Существенный недостаток этих исследований — необходимость дополнительного простоя скважин и затрат на изготовление активированного раствора, что позволяет использовать этот весьма эффективный способ выделения коллекторов любого типа только при исследованиях специальных параметрических скважин.", "unit": "u020-02", "page": 20, "by": "model", "verified": true}, {"id": "mud-activation-and-time-studies.c3", "kind": "observation", "text": "В обсаженных скважинах нейтронные методы применяют для оценки насыщения и контроля перемещения водонефтяного и газожидкостного контактов.", "quote": "Временные исследования в обсаженных скважинах нейтронными методами проводят для оценки характера насыщения коллекторов, выделенных геофизическими методами до спуска колонны, а также в эксплуатационных скважинах нефтяных и газовых месторождений для контроля за перемещением в ходе разработки водонефтяного и газожидкостного контактов.", "unit": "u020-03", "page": 20, "by": "model", "verified": true}, {"id": "mud-activation-and-time-studies.c4", "kind": "observation", "text": "При высокой эффективной пористости более 3-4% используют соленую или пресную воду как меченую жидкость.", "quote": "При высокой эффективной пористости (более 3—4%) возможно использование в качестве меченой жидкости соленой (при пресных пластовых водах) или пресной (при соленых глинистых растворах) воды.", "unit": "u020-01", "page": 20, "by": "model", "verified": true}, {"id": "mud-activation-and-time-studies.c5", "kind": "observation", "text": "Требуемые концентрации уменьшают обратно пропорционально величине эффективной пористости.", "quote": "ше. При большей величине эффективной пористости требуемые концентрации уменьшают обратно пропорционально величине  \\( K_{n\\nu\\phi} \\) .", "unit": "u020-01", "page": 20, "by": "model", "verified": true}, {"id": "mud-activation-and-time-studies.c6", "kind": "observation", "text": "Различие в концентрациях NaCl на 150-200 г/л достаточно для обнаружения пластов с K_n.п.ф > 3% при K_н \u003c 5% и пластов с K_n.п.ф = 8-10% при K_н = 20%.", "quote": "При этом различие в концентрациях NaCl на 150—200 г/л воды достаточно для обнаружения пластов с  \\( K_{n\\nu\\phi} > 3\\% \\)  при  \\( K_{n} \u003c 5\\% \\)  и пластов с  \\( K_{n\\nu\\phi} = 8 + 10\\% \\)  при  \\( K_{n} = 20\\% \\) .", "unit": "u020-01", "page": 20, "by": "model", "verified": true}, {"id": "mud-activation-and-time-studies.c7", "kind": "inference", "text": "Исследования в открытом стволе с активацией раствора проводятся для поиска и выделения коллекторов.", "quote": "Временные исследования с активацией глинистого раствора — весьма эффективный способ выделения в открытом стволе коллектора любого типа", "unit": "u020-02", "page": 20, "by": "model", "verified": true}, {"id": "mud-activation-and-time-studies.c8", "kind": "inference", "text": "Нейтронные методы в обсаженных скважинах оценивают насыщение ранее выделенных коллекторов.", "quote": "Временные исследования в обсаженных скважинах нейт P_n с критическими значениями ρ*_n и P*_n для разделения коллекторов.", "claims": ["saturation-evaluation-resistivity.c2"], "page": 20, "by": "model"}], "how_it_works": [{"text": "Характер насыщения породы-коллектора оценивают, как правило, на основе материалов промысловой геофизики, полученных в необсаженной трубами скважине.", "claims": ["saturation-evaluation-resistivity.c1"], "page": 20, "by": "model"}, {"text": "Оценка используется для решения вопроса о целесообразности спуска колонны и опробования промышленных нефте- и газоносных объектов.", "claims": ["saturation-evaluation-resistivity.c3"], "page": 20, "by": "model"}, {"text": "Метод основан на определении электрического удельного сопротивления ρ породы в её неизменённой части.", "claims": ["saturation-evaluation-resistivity.c4"], "page": 20, "by": "model"}, {"text": "Полученные значения ρ и вычисленные значения P_n сравнивают с критическими величинами ρ*_n и P*_n.", "claims": ["saturation-evaluation-resistivity.c2"], "page": 20, "by": "model"}, {"text": "Критические величины характеризуют для исследуемого типа коллектора границу между коллекторами промышленно-продуктивными и непромышленными.", "claims": ["saturation-evaluation-resistivity.c5"], "page": 20, "by": "model"}, {"text": "Эффективность решения задачи определяется надёжностью установления удельного сопротивления ρ_n, соответствием вычисленного значения параметра насыщения P_n истинному и соответствием используемых граничных значений данному типу коллектора.", "claims": ["saturation-evaluation-resistivity.c6"], "page": 20, "by": "model"}, {"text": "Надёжность определения ρ_n зависит от комплекса зондов и условий получения диаграмм электрометрии в скважине.", "claims": ["saturation-evaluation-resistivity.c7"], "page": 20, "by": "model"}, {"text": "Надёжное установление ρ_n по диаграммам БЭЗ возможно лишь в достаточно мощных и однородных объектах.", "claims": ["saturation-evaluation-resistivity.c8"], "page": 20, "by": "model"}, {"text": "При наличии плотных высокоомных прослоев неколлектора величину P_n необходимо определять по диаграммам ρ_ф индукционных и экранированных зондов с использованием палеток.", "claims": ["saturation-evaluation-resistivity.c9"], "page": 20, "by": "model"}, {"text": "Диаграммы p_n больших зондов БЭЗ с AO > 2 м искажаются экранными эффектами при наличии плотных прослоев.", "claims": ["saturation-evaluation-resistivity.c10"], "page": 20, "by": "model"}, {"text": "Важнейшее благоприятное условие определения ρ_n — наличие зоны проникновения, глубина которой меньше глубины исследования для используемого комплекта зондов.", "claims": ["saturation-evaluation-resistivity.c11"], "page": 20, "by": "model"}, {"text": "При несоблюдении условия зоны проникновения разделить коллекторы на продуктивные и водоносные без дополнительных сведений однозначно нельзя.", "claims": ["saturation-evaluation-resistivity.c12"], "page": 20, "by": "model"}, {"text": "Глубокие проникновения являются следствием нарушения технологии бурения и геофизических исследований и существенно сказываются на глубине более 4 км.", "claims": ["saturation-evaluation-resistivity.c13"], "page": 20, "by": "model"}, {"text": "Для получения истинного значения параметра P_n необходимо знать коэффициент пористости K_n, определяемый геофизическими методами или по керну.", "claims": ["saturation-evaluation-resistivity.c14"], "page": 20, "by": "model"}, {"text": "Критические значения ρ*_n и P*_n устанавливают статистическим методом по большому числу испытанных коллекторов или на основе петрофизических связей из лаборатории.", "claims": ["saturation-evaluation-resistivity.c15"], "page": 20, "by": "model"}, {"text": "Статистический способ составления распределений применим только на стадии завершения разведки месторождения при наличии результатов испытаний по нескольким десяткам пластов.", "claims": ["saturation-evaluation-resistivity.c16"], "page": 20, "by": "model"}, {"text": "Для первых разведочных скважин используют значения ρ_п или P_п, установленные ранее для аналогичных коллекторов на соседних месторождениях в том же бассейне.", "claims": ["saturation-evaluation-resistivity.c17"], "page": 20, "by": "model"}, {"text": "Развитием первого способа стало использование программ распознавания для оценки продуктивности с применением ЭВМ.", "claims": ["saturation-evaluation-resistivity.c18"], "page": 20, "by": "model"}, {"text": "Второй способ основан на применении критического значения коэффициента водонасыщения K*_п, устанавливаемого по данным лабораторного изучения относительной проницаемости.", "claims": ["saturation-evaluation-resistivity.c19"], "page": 21, "by": "model"}], "steps": [{"text": "Определить электрическое удельное сопротивление ρ породы в её неизменённой части по комплексу зондов.", "claims": ["saturation-evaluation-resistivity.c4", "saturation-evaluation-resistivity.c7"], "page": 20, "by": "model"}, {"text": "Вычислить параметр насыщения P_n с учётом коэффициента пористости K_n.", "claims": ["saturation-evaluation-resistivity.c2", "saturation-evaluation-resistivity.c14"], "page": 20, "by": "model"}, {"text": "Сравнить полученные значения с критическими величинами ρ*_n и P*_n для данного типа коллектора.", "claims": ["saturation-evaluation-resistivity.c2", "saturation-evaluation-resistivity.c5"], "page": 20, "by": "model"}, {"text": "Сделать вывод о промышленной нефтегазоносности объекта.", "claims": ["saturation-evaluation-resistivity.c3"], "page": 20, "by": "model"}], "examples": [], "numbers": [{"text": "Для больших зондов БЭЗ используется размерность AO > 2 м.", "claims": ["saturation-evaluation-resistivity.c20"], "page": 20, "by": "model"}, {"text": "Факторы глубокого проникновения существенно сказываются при проведении геофизических исследований в сверхглубоких скважинах на глубине более 4 км.", "claims": ["saturation-evaluation-resistivity.c21"], "page": 20, "by": "model"}], "formulas": [], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "ri ики в необсаженной скважине.", "quote": "Характер насыщения породы-коллектора оценивают, как правило, на основе материалов промысловой геофизики, полученных в необсаженной трубами скважине", "unit": "u020-05", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c2", "kind": "observation", "text": "Оценка основана на определении электрического сопротивления и сравнении значений ρ и P_n с критическими величинами ρ*_n и P*_n.", "quote": "основаны на определении электрического удельного сопротивления ρ породы в ее неизмененной части и сравнении полученных ρ и вычисленных P_n значений с критическими величинами ρ*_{n} и P*_{n} этих параметров", "unit": "u020-07", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c3", "kind": "observation", "text": "Оценка характера насыщения нужна для решения вопроса о целесообразности спуска колонны и опробования объектов.", "quote": "для решения вопроса о целесообразности спуска колонны и опробования промышленных нефте- и газоносных объектов.", "unit": "u020-05", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c4", "kind": "observation", "text": "Метод использует удельное сопротивление ρ породы в её неизменённой части.", "quote": "определении электрического удельного сопротивления ρ породы в ее неизмененной части", "unit": "u020-07", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c5", "kind": "observation", "text": "Критические величины характеризуют границу между промышленно-продуктивными и непромышленными коллекторами.", "quote": "характеризующих для исследуемого типа коллектора границу между коллекторами промышленно-продуктивными и непромышленными.", "unit": "u020-07", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c6", "kind": "observation", "text": "Эффективность задачи определяется надёжностью ρ_n, соответствием P_n истинному и соответств }, {"id": "saturation-evaluation-resistivity.c11", "kind": "observation", "text": "Благоприятное условие — глубина зоны проникновения меньше глубины исследования комплекта зондов.", "quote": "Важнейшее благоприятное условие определения ρ_{n} — наличие зоны проникновения, глубина которой меньше глубины исследования (для используемого комплекта зондов).", "unit": "u020-08", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c12", "kind": "observation", "text": "Если условие зоны проникновения не соблюдено, разделить коллекторы однозначно нельзя без дополнительных сведений.", "quote": "Если это условие не соблюдается, разделить коллекторы на продуктивные и водоносные по данным электрометрии без дополнительных сведений (данные испытаний и др.) однозначно нельзя.", "unit": "u020-08", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c13", "kind": "observation", "text": "Глубокие проникновения вызваны нарушением технологии бурения и геофизики и сказываются на глубине более 4 км.", "quote": "Глубокие проникновения, делающие неразрешимой задачу однозначной оценки характера насыщения коллектора, являются обычно следствием нарушения технологии бурения (недопустимо большие репрессии на пласт, применение глинистого раствора низкого качества с большой водоотдачей) и технология геофизических исследований (несоблюдение оптимального времени исследования). Наиболее существенно эти факторы сказываются при проведении геофизических исследований в сверхглубоких скважинах на глубине более 4 км.", "unit": "u020-08", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c14", "kind": "observation", "text": "Для истинного P_n необходимо знать коэффициент пористости K_n из геофизики или по керну.", "quote": "Для получения истинного значения параметра P_{n} необходимо знать коэффициент пористости K_{n}, который определяют геофизическими методами или по керну.", "unit": "u020-09", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c15", "kind": "observation", "text": "Критические значения устанавливают статистическим анализом или петрофизическими связями в лаборатории.", "quote": "Критические значения ρ*_{n} и P*_{n} для коллектора данного типа устанавливают: а) на основе статистического анализа ρ_{n} и P_{n} по большему числу испытанных коллекторов; б) на основе петрофизических связей, полученных в лаборатории", "unit": "u020-10", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c16", "kind": "observation", "text": "Статистический способ применим на стадии завершения разведки при наличии испытаний по нескольким десяткам пластов.", "quote": "Описанный способ можно применять только на стадии завершения разведки месторождения, поскольку для его реализации необходимо иметь результаты испытания хотя бы по нескольким десяткам пластов.", "unit": "u020-11", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c17", "kind": "observation", "text": "Для первых разведочных скважин используют значения с соседних месторождений того же бассейна.", "quote": "В качестве критериев продуктивности коллектора для первых разведочных скважин данного месторождения используют значения ρ_{n} или P_{n}, установленные ранее для аналогичных коллекторов на соседних месторождениях в этом же нефтегазоносном бассейне.", "unit": "u020-11", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c18", "kind": "observation", "text": "Развитием первого способа стало использование программ распознавания на ЭВМ.", "quote": "Развитием первого способа явилось использование программ распознавания для оценки продуктивности коллектора с применением ЭВМ", "unit": "u020-11", "page": 20, "by": "model", "verified": true}, {"id": "saturation-evaluation-resistivity.c19", "kind": "observation", "text": "Второй способ основан на критическом значении водонас ется отскок точки вверх от линии зависимости на полулогарифмическом бланке.", "quote": "Признаком продуктивности коллектора яв- ляется отскок точки, соответствующей данному коллектору, вверх от линии или семейства линий", "unit": "u021-06", "page": 21, "by": "model", "verified": true}, {"id": "part2-1.c8", "kind": "observation", "text": "В карбонатных разрезах сопоставляют удельное сопротивление и параметр, характеризующий пористость.", "quote": "вычисляют параметр ΔJm, характеризующий пористость. Далее на полулогарифмическом бланке в системе координат lg ρп - ΔJm наносят точки соответствующими координатами", "unit": "u022-01", "page": 22, "by": "model", "verified": true}, {"id": "part2-1.c9", "kind": "observation", "text": "Глубокое проникновение фильтрата глинистого раствора приводит к ложному отскоку точек для водоносных коллекторов.", "quote": "отскок точек наблюдается не только для продуктивных, но и для водоносных коллекторов, поскольку используемое значение ρп для них значительно выше ρм ввиду влияния проникновения", "unit": "u022-01", "page": 22, "by": "model", "verified": true}, {"id": "part2-1.c10", "kind": "observation", "text": "Удельные сопротивления продуктивных и водоносных пластов в глинистых терригенных коллекторах могут различаться не более чем в 2-3 раза.", "quote": "удельные сопротивления которых для продуктивных и водоносных пластов могут различаться не более чем в 2-3 раза", "unit": "u021-06", "page": 21, "by": "model", "verified": true}], "term_ids": ["t-critical-water-saturation", "t-saturation-parameter"], "units": ["u021-04", "u021-05", "u021-06", "u022-01", "u022-02", "u022-03", "u022-04", "u022-05"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "vendelshtein.part2-2", "order": 13, "part_id": "p2", "minutes": 3, "title": "Оценка характера насыщения коллектора", "book_title": "ОЦЕНКА ХАРАКТЕРА НАСЫЩЕНИЯ КОЛЛЕКТОРА", "pages": [22, 23], "difficulty": {"primary": "Пр", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет. Текст содержит четкие процедурные шаги и условия применимости методов, поэтому лучше всего подходит для структурированного текстового урока с элементами интерактивного чек-листа.", "scene_template": "step-flow"}, "summary": [{"text": "Оценка характера насыщения коллектора выполняется совмещением кривых сопротивлений, повторными измерениями сопротивлений и временными нейтронными или акустическими исследованиями обсаженных скважин.", "claims": ["part2-2.c1", "part2-2.c2", "part2-2.c3"], "page": 22, "by": "model"}], "how_it_works": [{"text": "В терригенных и высокопористых карбонатных отложениях продуктивные коллекторы выделяют сопоставлением кривых удельного электрического сопротивления \\( \\rho_{\\phi} \\) экранированного и микроэкранированного зондов.", "claims": ["part2-2.c1"], "page": 22, "by": "model"}, {"text": "Продуктивным интервалам соответствуют участки, где показания микроэкранированного зонда выше показаний экранированного: \\( \\rho_{\\phi MK} > \\rho_{\\phi MKK} \\).", "claims": ["part2-2.c2"], "page": 22, "by": "model"}, {"text": "Для большинства продуктивных коллекторов характерно снижение во времени показаний зондов со средним и большим радиусами исследования.", "claims": ["part2-2.c3"], "page": 22, "by": "model"}, {"text": "По методике «исследование — испытание — исследование» продуктивный пласт выделяется по значительному росту \\( \\rho_{\\phi} \\) после испытания зондами на трубах.", "claims": ["part2-2.c4"], "page": 22, "by": "model"}, {"text": "Временные исследования обсаженных скважин нейтронными и акустическими методами выделяют пласты по расформированию зоны проникновения.", "claims": ["part2-2.c5"], "page": 22, "by": "model"}, {"text": "Нейтронные методы разделяют пласты по свойствам воды, нефти и газа, различающимся поглощающими и замедляющими свойствами.", "claims": ["part2-2.c6"], "page": 22, "by": "model"}, {"text": "Исключение составляют пресные пластовые воды менее 20—25 г/л при давлении свыше 400—500 кгс/см².", "claims": ["part2-2.c7"], "page": 22, "by": "model"}, {"text": "При низких давлениях до 150—200 кгс/см², глинистости и минерализации вод менее 50 г/л применимы все нейтронные методы, но простые стационарные методы предпочтительнее.", "claims": ["part2-2.c8"], "page": 22, "by": "model"}, {"text": "С ростом минерализации и глинистости преимущество переходит к импульсным нейтронным методам.", "claims": ["part2-2.c9"], "page": 22, "by": "model"}, {"text": "Нейтронные свойства пресной воды и нефти близки, поэтому надежное разделение требует минерализации выше 100—150 г/л для стационарных и 30—50 г/л для импульсных методов.", "claims": ["part2-2.c10"], "page": 22, "by": "model"}, {"text": "Для разделения по расформированию зоны проникновения целесообразно применять импульсные нейтронные методы.", "claims": ["part2-2.c11"], "page": 22, "by": "model"}, {"text": "Первый замер выполняют сразу после крепления скважины, а для особо проницаемых пластов — в необсаженной скважине.", "claims": ["part2-2.c12"], "page": 23, "by": "model"}, {"text": "Сопоставление замеров после крепления наиболее надежно, так как скважинные условия остаются постоянными.", "claims": ["part2-2.c13"], "page": 23, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Пороги минерализации пластовых вод составляют менее 20—25 г/л для пресных вод, до 50 г/л, 30—50 г/л для импульсных методов и 100—150 г/л для стационарных методов.", "claims": ["part2-2.c7", "part2-2.c8", "part2-2.c10"], "page": 22, "by": "model"}, {"text": "Пороги пластового давления составляют свыше 400—500 кгс/см² и до 150—200 кгс/см².", "claims": ["part2-2.c7", "part2-2.c8"], "page": 22, "by": "model"}], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Кривые электрического сопротивления \\( \\rho_{\\phi} \\), \\( \\rho_{\\phi MK} \\), \\( \\rho_{\\phi MKK} \\), повторные замеры сопротивлений, данные нейтронных и акустических методов во времени.", " ию зоны проникновения.", "quote": "Временные исследования обсаженных скважин нейтронными и низкочастотными акустическими методами позволяют выделить продуктивные коллекторы на основе изучения процесса расформирования зоны проникновения в коллекторах.", "unit": "u022-08", "page": 22, "by": "model", "verified": true}, {"id": "part2-2.c6", "kind": "observation", "text": "Нейтронные методы разделяют пласты благодаря различию свойств воды, нефти и газа.", "quote": "если фильтрат и пластовые воды по свойствам отличаются от нефти, такие исследования одновременно позволяют отделить продуктивные пласты от водоносных. Наиболее резко различаются нейтронные свойства воды и природного газа.", "unit": "u022-09", "page": 22, "by": "model", "verified": true}, {"id": "part2-2.c7", "kind": "observation", "text": "Исключение составляют пресные воды менее 20-25 г/л при давлениях свыше 400-500 кгс/см².", "quote": "Исключение составляют почти не встречающиеся на практике пресные пластовые воды (менее 20—25 г/л) при одновременно высоком значении пластового давления (свыше 400—500 кгс/см²).", "unit": "u022-09", "page": 22, "by": "model", "verified": true}, {"id": "part2-2.c8", "kind": "observation", "text": "При низких давлениях до 150-200 кгс/см² и минерализации менее 50 г/л целесообразны стационарные методы.", "quote": "При низких значениях пластового давления (до 150—200 кгс/см²), глинистости пластов и минерализации пластовых вод (менее 50 г/л) для отделения газоносных пластов от водоносных могут применяться все модификации нейтронных методов (ННМ, НГМ, ИНМ), однако наиболее целесообразно использовать более простые стационарные методы", "unit": "u022-09", "page": 22, "by": "model", "verified": true}, {"id": "part2-2.c9", "kind": "observation", "text": "С ростом минерализации и глинистости преимущество переходит к импульсным методам.", "quote": "С увеличением минерализации вод и глинистости пластов преимущество приобретают импульсные методы.", "unit": "u022-09", "page": 22, "by": "model", "verified": true}, {"id": "part2-2.c10", "kind": "observation", "text": "Надежное разделение требует минерализации выше 100-150 г/л для стационарных и 30-50 г/л для импульсных методов.", "quote": "поэтому надежное разделение нефтеносных и водо- носных пластов возможно лишь при не слишком малой минерализации пластовых вод (выше 100—150 г/л для стационарных и 30—50 г/л для импульсных методов).", "unit": "u022-10", "page": 22, "by": "model", "verified": true}, {"id": "part2-2.c11", "kind": "observation", "text": "Для разделения по расформированию зоны проникновения целесообразно применять импульсные нейтронные методы.", "quote": "В связи с этим для разделения водоносных и нефтеносных коллекторов по расформированию зоны проникновения целесообразно применять импульсные нейтронные методы.", "unit": "u022-10", "page": 22, "by": "model", "verified": true}, {"id": "part2-2.c12", "kind": "observation", "text": "Первый замер проводят сразу после крепления, а для особо проницаемых пластов — в необсаженной скважине.", "quote": "Первый замер должен быть проведен сразу после крепления исследуемого интервала. Для выделения особо проницаемых пластов, расформирование зоны проникновения фильтрата в которых может заканчиваться за несколько десятков часов, следует также выполнять замер в необсаженной трубами скважине.", "unit": "u023-02", "page": 23, "by": "model", "verified": true}, {"id": "part2-2.c13", "kind": "observation", "text": "Сопоставление замеров после крепления скважины наиболее надежно из-за постоянства условий.", "quote": "Наиболее целесообразно сопоставление замеров, выполненных после крепления скважины, поскольку здесь скважинные условия остаются постоянными и легче уловить изменения в прискважинной части пласта.", "unit": "u023-02", "page": 23, "by": "model", "verified": true}], "term_ids": ["t-shielded-probe"], "units": ["u022-06", "u022-07", "u022-08", "u022-09", "u022-10", "u023-01", "u023-02", "u023-03"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.part2-3", "order": 14, "part_id": "p2", "minutes": 5, "title": "Оценка характера насыщения коллектора", "book_title": "ОЦЕНКА ХАРАКТЕРА НАСЫЩЕНИЯ КОЛЛЕКТОРА", "pages": [23, 23], "difficulty": {"primary": "Н", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «неопределённость, решение»; критериев видеоёмкости нет. Текст подходит для описания алгоритмической последовательности обработки данных и математических условий применимости метода.", "scene_template": "decision-scale"}, "summary": [{"text": "Оценка характера насыщения коллектора в обсаженных скважинах базируется на сравнении результатов повторных замеров нейтронными методами. Ключевым инструментом является построение корреляционной зависимости между замерами для выделения пластов, изменивших свои свойства из-за расформирования зоны проникновения.", "claims": ["part2-3.c1"], "page": 23, "by": "model"}], "how_it_works": [{"text": "Для оценки насыщения проводят фоновый замер и серию последующих. Второй замер выполняется через 1–5 суток, а время каждого следующего увеличивается в 2–3 раза. Важно использовать идентичные приборы, режимы работы и эталонировать оборудование перед каждым исследованием.", "claims": ["part2-3.c2", "part2-3.c3"], "page": 23, "by": "model"}, {"text": "Применимость метода зависит от контрастности времен жизни нейтронов в пластовом флюиде и фильтрате. При эффективной пористости 20% различие должно быть не менее чем в 1,5 раза, а при 10% — не менее чем в 2,5 раза.", "claims": ["part2-3.c4"], "page": 23, "by": "model"}, {"text": "Данные обрабатываются путем разбиения разреза на однородные участки (1–1,5 м). Показания корректируются на фон, влияние интегрирующей ячейки и нелинейность аппаратуры. Для ИНМ вычисляется декремент затухания λ или макроскопическое сечение поглощения Σs = λ/v, где v = 2,2·10⁵ см/с.", "claims": ["part2-3.c5"], "page": 23, "by": "model"}], "steps": [{"text": "1. Выполнить фоновый и повторные замеры. 2. Выбрать неизмененные пласты для калибровки. 3. Исправить показания на аппаратурные эффекты. 4. Построить корреляционный график (x — первый замер, y — второй). 5. Провести линию регрессии y = ax + b.", "claims": ["part2-3.c6", "part2-3.c7"], "page": 23, "by": "model"}], "examples": [{"title": "Построение линии регрессии", "page": 23, "figure": "рис. 26", "condition": [{"text": "Имеются пары замеров (первый и последующий) в виде значений временного декремента затухания λ1 и λ2.", "claims": ["part2-3.c7"], "page": 23, "by": "model"}], "solution": [{"text": "Коэффициенты прямой регрессии y = ax + b вычисляются через средние значения Mx, My и ковариацию kxy, деленную на дисперсию Dxx.", "claims": ["part2-3.c8", "part2-3.c9", "part2-3.c10", "part2-3.c11"], "page": 23, "by": "model"}], "result": [{"text": "Полученная прямая позволяет выявить пласты, отклоняющиеся от корреляционной связи, что указывает на изменение характера насыщения.", "claims": ["part2-3.c7"], "page": 23, "by": "model"}]}], "numbers": [{"text": "Временной интервал второго замера составляет 1–5 суток. Скорость тепловых нейтронов v = 2,2·10⁵ см/с. Участки для анализа имеют мощность 1–1,5 м.", "claims": ["part2-3.c2", "part2-3.c5"], "page": 23, "by": "model"}], "formulas": [{"latex": "a = k_{xy} / D_{xx}; b = M_{y} - aM_{x}", "page": 23, "vars": [{"sym": "a", "meaning": "коэффициент наклона прямой", "unit": "безразмерная"}, {"sym": "b", "meaning": "свободный член уравнения", "unit": "безразмерная"}]}], "tables": [], "misconception": {"wrong": "Анализ данных каротажа — это просто считывание абсолютных значений с прибора.", "right": [{"text": "Абсолютные значения зависят от множества факторов (фон, аппаратура). Важна относительная динамика изменений во времени, которая выделяется через корреляцию неизмененных пластов.", "claims": ["part2-3.c5", "part2-3.c7"], "page": 23, "by": "model"}]}, "data_meaning": {"input": "Временные ряды показаний нейтронных методов (первый замер и последующие).", "output": "Коэффициенты регрессии, характеризующ , "u023-06", "u023-07", "u023-08", "u023-09", "u023-10", "u023-11"], "video_criteria": [], "fallback": false}, {"id": "vendelshtein.part2-4", "order": 15, "part_id": "p2", "minutes": 4, "title": "Оценка характера насыщения коллектора", "book_title": "ОЦЕНКА ХАРАКТЕРА НАСЫЩЕНИЯ КОЛЛЕКТОРА", "pages": [23, 24], "difficulty": {"primary": "И", "secondary": null}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». Текст подходит для объяснения алгоритмической логики (регрессия, доверительный интервал), так как требует последовательного изложения математических шагов.", "scene_template": "tool-in-well"}, "summary": [{"text": "Оценка характера насыщения коллектора выполняется через анализ динамики изменений нейтронных свойств пласта во времени. Метод основан на сравнении двух замеров и выявлении отклонений от линии регрессии, что позволяет судить о замещении фильтрата бурового раствора пластовым флюидом.", "claims": ["part2-4.c1"], "page": 23, "by": "model"}], "how_it_works": [{"text": "Для анализа строят корреляционный график зависимости показаний двух замеров. Сначала вычисляют линию регрессии y = ax + b, затем определяют среднеквадратическое отклонение σ.", "claims": ["part2-4.c2", "part2-4.c3"], "page": 23, "by": "model"}, {"text": "Вокруг линии регрессии строят полосу ±2σ. Пласты, точки которых попадают в эту полосу, считаются неизменными. Выход точки за пределы полосы указывает на изменение нейтронных свойств прискважинной зоны.", "claims": ["part2-4.c4"], "page": 24, "by": "model"}, {"text": "Характер насыщения определяют по знаку изменения показаний ИНМ (импульсного нейтронного метода) и декремента затухания λ. Замещение пресного фильтрата соленой водой снижает показания ИНМ и увеличивает λ.", "claims": ["part2-4.c5"], "page": 24, "by": "model"}, {"text": "Вытеснение соленого фильтрата пресной водой или нефтью увеличивает показания ИНМ и уменьшает λ. Замещение фильтрата газом всегда ведет к росту показаний ИНМ и уменьшению λ.", "claims": ["part2-4.c6", "part2-4.c7"], "page": 24, "by": "model"}], "steps": [{"text": "1. Провести два замера нейтронными методами. 2. Построить корреляционный график. 3. Рассчитать коэффициенты регрессии a и b. 4. Вычислить среднеквадратическое отклонение σ. 5. Построить доверительный интервал ±2σ. 6. Нанести точки остальных пластов и интерпретировать их положение.", "claims": ["part2-4.c2", "part2-4.c3", "part2-4.c4"], "page": 23, "by": "model"}], "examples": [], "numbers": [{"text": "Для оценки стабильности свойств используется порог отклонения в 2σ от линии регрессии.", "claims": ["part2-4.c4"], "page": 24, "by": "model"}], "formulas": [{"latex": "D_x = [\\Sigma (x_i - M_x)]^2 / n", "page": 23, "vars": [{"sym": "D_x", "meaning": "дисперсия", "unit": "u023-12"}, {"sym": "x_i", "meaning": "значения параметров пластов", "unit": "u023-13"}, {"sym": "n", "meaning": "число неизмененных пластов", "unit": "u023-13"}]}, {"latex": "\\sigma = [\\Sigma(y_i - ax_i - b)^2]^{1/2} / (n-2)", "page": 24, "vars": [{"sym": "σ", "meaning": "среднеквадратическое отклонение", "unit": "u024-01"}, {"sym": "y_i, x_i", "meaning": "показания замеров", "unit": "u024-03"}]}], "tables": [], "misconception": {"wrong": "Каротажная кривая — это и есть порода, а не косвенное измерение.", "right": [{"text": "Каротажная кривая является лишь косвенным индикатором. Оценка насыщения требует статистического анализа отклонений (регрессии) между двумя замерами, а не прямого считывания значений.", "claims": ["part2-4.c4"], "page": 24, "by": "model"}]}, "data_meaning": {"input": "Показания нейтронных методов (ИНМ) в двух временных точках.", "output": "Классификация пласта: «изменен» (смена флюида) или «неизменен».", "breaks": [{"text": "Метод ломается, если чувствительность прибора ниже пористости пласта или если происходит наложение факторов (например, неоднородность пористости).", "claims": ["part2-4.c8"], "page": 24, "by": "model"}], "hypothe ивает показания ИНМ.", "quote": "Вытеснение соленого фильтрата более пресной пластовой водой или нефтью способствует увеличению показаний и уменьшению $\\lambda$.", "unit": "u024-03", "page": 24, "by": "model", "verified": true}, {"id": "part2-4.c7", "kind": "observation", "text": "Газ всегда увеличивает показания ИНМ.", "quote": "замещение фильтрата (независимо от его минерализации) газом приводит к росту показаний любого из нейтронных методов и уменьшению $\\lambda$.", "unit": "u024-03", "page": 24, "by": "model", "verified": true}, {"id": "part2-4.c8", "kind": "inference", "text": "Расформирование зоны проникновения связано с проницаемостью.", "quote": "Изучение расформирования зоны проникновения позволяет качественно судить и о проницаемости пласта: обычно чем выше проницаемость, тем меньше время расформирования.", "unit": "u024-05", "page": 24, "by": "model", "verified": true}, {"id": "part2-4.c9", "kind": "observation", "text": "ИНМ-КВ позволяет компенсировать влияние водородосодержания.", "quote": "В неоднородных по пористости разрезах проследить зону проникновения фильтрата можно более просто и наглядно при использовании специальной модификации ИНМ — импульсного нейтронного метода с компенсацией влияния водородосодержания (ИНМ-КВ)", "unit": "u024-05", "page": 24, "by": "model", "verified": true}], "term_ids": ["t-pulsed-neutron-logging"], "units": ["u023-12", "u023-13", "u023-14", "u024-01", "u024-02", "u024-03", "u024-04", "u024-05"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "vendelshtein.part2-5", "order": 16, "part_id": "p2", "minutes": 3, "title": "Оценка характера насыщения коллектора", "book_title": "ОЦЕНКА ХАРАКТЕРА НАСЫЩЕНИЯ КОЛЛЕКТОРА", "pages": [24, 25], "difficulty": {"primary": "Пр", "secondary": null}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет. Текстово-графический формат оптимален, так как разбираются специфические геофизические методы каротажа с опорой на схем

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="Схема шагов: Введение"><style>
.bg{fill:#ffffff}.box{fill:#eef3f1;stroke:#56625d;stroke-width:1.2}.obs{fill:#e3f1e8;stroke:#2c8350}.inf{fill:#e4ecf7;stroke:#2f65a8}
.ass{fill:#f7e6ee;stroke:#b83a72}.t{font:14px system-ui,sans-serif;fill:#17211e}.s{font:12px system-ui,sans-serif;fill:#56625d}
.h{font:600 15px system-ui,sans-serif;fill:#17211e}.ar{stroke:#0c6b6b;stroke-width:2;fill:none;marker-end:url(#a)}.ax{stroke:#56625d;stroke-width:1}
.c1{stroke:#0c6b6b;stroke-width:2.2;fill:none}.c2{stroke:#9c6c12;stroke-width:2.2;fill:none}.c3{stroke:#b23a3a;stroke-width:2.2;fill:none}
.tag{font:11px ui-monospace,monospace;fill:#56625d}
@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="640" height="310" rx="10"/><text x="20" y="26" class="h">Введение</text><rect class="box" x="20" y="40" width="600" height="52" rx="8"/><text x="34" y="62" class="h">1</text><text x="58" y="62" class="t">Рассчитать относительную амплитуду СП (α_СП) путем деления локальной</text><text x="58" y="80" class="t">амплитуды на максимальную амплитуду чистых коллекторов участка.</text><path class="ar" d="M320 94 L320 112"/><rect class="box" x="20" y="116" width="600" height="70" rx="8"/><text x="34" y="138" class="h">2</text><text x="58" y="138" class="t">Определить критическое значение комплексного параметра η_гл* для</text><text x="58" y="156" class="t">изучаемых отложений с учетом их возраста, глубины и состава глинистого</text><text x="58" y="174" class="t">цемента.</text><path class="ar" d="M320 188 L320 206"/><rect class="box" x="20" y="210" width="600" height="70" rx="8"/><text x="34" y="232" class="h">3</text><text x="58" y="232" class="t">По региональной зависимости α_СП = f(η_гл), соответствующей</text><text x="58" y="250" class="t">минерализации вод и типу цемента, найти пороговое граничное значение</text><text x="58" y="268" class="t">α_СП*.</text><text x="630" y="302" text-anchor="end" class="tag">схема · по тексту книги</text></svg>
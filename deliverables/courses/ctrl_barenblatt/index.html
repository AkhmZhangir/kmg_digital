ation.c4", "kind": "observation", "text": "Область поиска распределения давления — пористый пласт с непроницаемыми границами и границами, сообщающимися со скважинами и соседними пластами.", "quote": "Область, в которой ищется распределение давления в жидкости, та же, что рассматривалась для стационарных течений: пористый пласт, часть границ которого непроницаема, а другая часть сообщается с вскрывающими пласт скважинами и соседними пластами.", "unit": "u039-03", "page": 39, "by": "model", "verified": true}, {"id": "piezoconductivity-equation.c5", "kind": "observation", "text": "Граничные условия задаются на тех же типах границ и могут быть функциями времени.", "quote": "Граничные условия в задачах линейной нестационарной фильтрации задаются на границах того же типа, что и в задачах напорной стационарной фильтрации", "unit": "u039-04", "page": 39, "by": "model", "verified": true}, {"id": "piezoconductivity-equation.c6", "kind": "observation", "text": "Общая форма граничных условий выражается через соотношение (ap + b\\partial p/\\partial n) = f(x, y, z, t).", "quote": "(ap + b\\partial p/\\partial n) = f(x, y, z, t), a^2 + b^2 \\neq 0; b/a \\geqslant 0.", "unit": "u039-06", "page": 39, "by": "model", "verified": true}, {"id": "piezoconductivity-equation.c7", "kind": "observation", "text": "Начальное условие задается в момент времени t=0.", "quote": "а в начальный момент времени $t=0$ условие", "unit": "u039-07", "page": 39, "by": "model", "verified": true}, {"id": "piezoconductivity-equation.c8", "kind": "observation", "text": "Решение единственно и непрерывно в замкнутой области на конечном интервале времени.", "quote": "то существует единственное распределение давления p(x, y, z, t), удовлетворяющее уравнению (II.83) и условиям (II.84), (II.85), непрерывное в замкнутой области D, включая границу, на любом конечном интервале времени 0 \\leqslant t \\leqslant T.", "unit": "u039-09", "page": 39, "by": "model", "verified": true}, {"id": "piezoconductivity-equation.c9", l"}], "how_it_works": [{"text": "Давление при этом удовлетворяет уравнению", "claims": ["linear-1d-flow.c3"], "page": 40, "by": "model"}, {"text": "Наиболее интересны случаи, для которых в начальный момент времени движение в пласте стационарно.", "claims": ["linear-1d-flow.c4"], "page": 40, "by": "model"}, {"text": "Поскольку стационарное распределение давления также удовлетворяет уравнению (II.86), удобно отсчитывать давление в каждой точке от стационарного значения $P_0(x)$.", "claims": ["linear-1d-flow.c5"], "page": 40, "by": "model"}, {"text": "Таким образом, разность $P=p-P_0$ удовлетворяет уравнению (II.84) с нулевым начальным условием $P(x,0) = 0$.", "claims": ["linear-1d-flow.c6"], "page": 40, "by": "model"}, {"text": "Пусть при $x=L$ (на контуре питания) давление сохраняет постоянное значение, равное начальному, а через сечение $x=0$ отбирается жидкость, и давление в нем меняется по закону $p=f(t)$.", "claims": ["linear-1d-flow.c7"], "page": 40, "by": "model"}, {"text": "Чтобы получить решение при указанных начальных и краевых условиях, применим преобразование Лапласа, т. е. введем функцию", "claims": ["linear-1d-flow.c8"], "page": 40, "by": "model"}, {"text": "Для $\\bar{P}$ получим задачу", "claims": ["linear-1d-flow.c9"], "page": 40, "by": "model"}, {"text": "Чтобы перейти от изображения к функции $P(x, t)$, предположим вначале, что в сечении $x=0$ давление мгновенно принимает фиксированное значение $P=p^0 \\neq 0$.", "claims": ["linear-1d-flow.c10"], "page": 40, "by": "model"}, {"text": "Тогда $F(\\sigma) = p^0/\\sigma$.", "claims": ["linear-1d-flow.c11"], "page": 40, "by": "model"}, {"text": "Выразим в (II.90) гиперболические функции через показательные и, считая $2L \\sqrt{\\frac{\\sigma}{\\varkappa}} \\gg 1$, разложим это выражение в ряд по степеням $\\exp(-2L \\sqrt{\\sigma/\\varkappa})$, т. е.", "claims": ["linear-1d-flow.c12"], "page": 40, "by": "model"}, {"text": "Производя почленное обращение ряда (II.91), с помощью формул обращения, выведенных, например, в [25], имеем", "claims": ["linear-1d-flow.c13"], "page": 40, "by": "model"}, {"text": "Ряд (II.92) сходится при всех $t$ и $x$.", "claims": ["linear-1d-flow.c14"], "page": 41, "by": "model"}, {"text": "Рассмотрим вначале асимптотику при условии $L^2/\\varkappa t \\gg 1$.", "claims": ["linear-1d-flow.c15"], "page": 41, "by": "model"}, {"text": "Тогда в выражении для $P(x, t)$ можно все значения $\\text{erfc}$ заменить их предельными $\\text{erfc}(\\infty) = 0$, за исключением члена ряда $\\text{erfc} \\frac{x}{2\\sqrt{\\varkappa t}}$.", "claims": ["linear-1d-flow.c16"], "page": 41, "by": "model"}, {"text": "Полученное решение (II.93) имеет двоякий смысл.", "claims": ["linear-1d-flow.c17"], "page": 41, "by": "model"}, {"text": "С одной стороны, оно списывает распределение давления в пласте конечной длины $L$ при малых временах $\\varkappa t \\ll L^2$.", "claims": ["linear-1d-flow.c18"], "page": 41, "by": "model"}, {"text": "С другой стороны, оно дает распределение давления в пласте бесконечной протяженности $L \\to \\infty$.", "claims": ["linear-1d-flow.c19"], "page": 41, "by": "model"}, {"text": "В силу линейности уравнения (II.86) решение для случая произвольного вида функции $P(0, t) = f(t)$ можно получить с помощью принципа суперпозиции с использованием интеграла Дюамеля", "claims": ["linear-1d-flow.c20"], "page": 41, "by": "model"}, {"text": "где $P_1(x, t)$ — решение (II.92) или (II.93) для случая скачкообразного изменения давления при $x = 0$.", "claims": ["linear-1d-flow.c21"], "page": 41, "by": "model"}, {"text": "Рассмотрим теперь противоположную асимптотику $t \\gg L^2/\\varkappa$.", "claims": ["linear-1d-flow.c22"], "page": 41, "by": "model"}, {"text": "В этом случае выражение (II.92) неудобно тем, что приходится суммировать много членов ряда.", "claims": ["linear-1d-flow.c23"], "page": 41, "by": "model"}, {"text": "где сумма вычетов берется по всем особым точкам $\\sigma_k$ функции $F(\\sigma)$ в порядке неубывания их модулей.", "claims": ["linear-1d-flow.c24"], "page": 41, "by": "model"}, {"text": "Тогда для $F(\\sigma)$, выражаемого формулой (II.90), получим разложение", "claims": ["linear-1d-flow.c25"], "page": 41, "by": "model"}, {"text": "Из формулы (II. 96) видно, что приближение к стационарному линейному распределению давления происходит экспоненциально, причем характерное время выхода на стационарный режим имеет порядок", "claims": ["linear-1d-flow.c26"], "page": 41, "by": "model"}, {"text": "Для типичных условий фильтрации маловязкой нефти или воды в коллекторах с высокой проницаемостью $\\varkappa$ имеет порядок", "claims": ["linear-1d-flow.c27"], "page": 41, "by": "model"}, {"text": "В коллекторах с высоковязкой нефтью и низкой проницаемостью значение x может оказаться на один-два порядка меньше.", "claims": ["linear-1d-flow.c28"], "page": 41, "by": "model"}, {"text": "Тогда соответственно на один-два порядка увеличиваются значения характерных времен.", "claims": ["linear-1d-flow.c29"], "page": 41, "by": "model"}, {"text": "В практических задачах часто приходится рассматривать нестационарные процессы в сложных системах, в которые входят элементы с различными собственными временами.", "claims": ["linear-1d-flow.c30"], "page": 42, "by": "model"}, {"text": "Оценивая время установления стационарного течения для каждого элемента, мы упростим задачу, отделив те элементы, движение в которых можно считать стационарным, и те, в которых нестационарный процесс находится в начальной стадии.", "claims": ["linear-1d-flow.c31"], "page": 42, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Поскольку стационарное распределение давления также удовлетворяет уравнению (II.86), удобно отсчитывать давление в каждой точке от стационарного значения $P_0(x)$.", "claims": ["linear-1d-flow.c5"], "page": 40, "by": "model"}, {"text": "Таким образом, разность $P=p-P_0$ удовлетворяет уравнению (II.84) с нулевым начальным условием $P(x,0) = 0$.", "claims": ["linear-1d-flow.c6"], "page": 40, "by": "model"}, {"text": "Пусть при $x=L$ (на контуре питания) давление сохраняет постоянное значение, равное начальному, а через сечение $x=0$ отбирается жидкость, и давление в нем меняется по закону $p=f(t)$.", "claims": ["linear-1d-flow.c7"], "page": 40, "by": "model"}], "formulas": [{"latex": "\\partial p / \\partial t = \\varkappa \\partial^2 p / \\partial x^2 \\quad 0 \\leqslant x \\leqslant L. \\tag{II.85}", "page": 40, "vars": []}, {"latex": "L \\{P(x, t)\\} = \\bar{P}(x, \\sigma) = \\int_0^\\infty e^{-t\\sigma} P(x, t) dt. \\tag{II.87}", "page": 40, "vars": []}, {"latex": "d^2 \\bar{P} / dx^2 - \\nu^2 \\bar{P} = 0; \\quad \\begin{array}{l} \\bar{P}(0) = L \\{f(t)\\} = F(\\sigma); \\\\ \\bar{P}(L) = 0; \\quad \\nu^2 = \\sigma/\\varkappa, \\end{array} \\tag{II.88}", "page": 40, "vars": []}, {"latex": "\\bar{P} = F(\\sigma) \\operatorname{sh}[(L-x)\\nu] / \\operatorname{sh}(L\\nu). \\tag{II.89}", "page": 40, "vars": []}], "tables": [], "misconception": null, "data_meaning": null, "analogy": null, "now_practice": [], "layers": {"mechanism": [], "practice": [], "nuances": [], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "barenblatt.linear-1d-flow.ill1", "class": "B", "src": "media/barenblatt.linear-1d-flow-pressure.svg", "alt": "Расчёт: как понижение давления расходится по пласту: Одномерное плоскопараллельное нестационарное течение", "caption": "Расчёт: как понижение давления расходится по пласту", "provenance": "симуляция", "redrawn_from": null, "source_url": null}], "links": [{"to": "barenblatt.piezoconductivity-equation", "type": "prerequisite"}], "claims": [{"id": "linear-1d-flow.c1", "kind": "observation", "text": "Плоскопараллельное одномерное движение.", "quote": "Плоскопараллельное одномерное движение.", "unit": "u040-01", "page": 40, "by": "model", "verified": true}, {"id": "linear-1d-flow.c2", "kind": "observation", "text": "Пусть скорость течения параллельна оси $x$ не зависит от координат $y$ и $z$.", "quote": "Пусть скорость течения параллельна оси $ eps": [{"text": "Перейти в уравнении к изображениям по Лапласу для получения общего решения через модифицированные функции Бесселя.", "claims": [], "page": 42, "by": "model"}, {"text": "Удовлетворить граничным условиям постоянного дебита на скважине и нулевого давления на внешней границе пласта.", "claims": [], "page": 42, "by": "model"}, {"text": "Использовать асимптотические формулы при выполнении промежуточной асимптотики для упрощения выражения.", "claims": [], "page": 42, "by": "model"}, {"text": "Применить таблицы преобразований Лапласа для перехода к пространственно-временному решению через интегральную экспоненту.", "claims": [], "page": 42, "by": "model"}, {"text": "Построить график в координатах p и ln t по данным восстановления давления для нахождения параметров пласта из параметров асимптоты.", "claims": [], "page": 42, "by": "model"}], "examples": [], "numbers": [{"text": "Радиус скважины ρ обычно равен 10 см или менее.", "claims": [], "page": 42, "by": "model"}, {"text": "Расстояние между скважинами R > 300 м позволяет применять промежуточную асимптотику.", "claims": [], "page": 42, "by": "model"}, {"text": "Постоянная Эйлера C равна 0,7772.", "claims": [], "page": 42, "by": "model"}, {"text": "В точке касания кривой Δp(t) с прямой из начала координат r^2 / (4π t_1) = 0,44, откуда π = 0,57r^2 / t_1.", "claims": [], "page": 42, "by": "model"}], "formulas": [{"latex": "\\partial p/\\partial t = (x/r) \\partial [r\\partial p/\\partial r]/\\partial r", "page": 42, "vars": [{"sym": "p", "meaning": "давление", "unit": ""}, {"sym": "t", "meaning": "время", "unit": ""}, {"sym": "r", "meaning": "радиус", "unit": ""}]}, {"latex": "r^{-1} d [r\\overline{dp}(r, \\sigma)/dr]/dr = \\nu^2 \\overline{P}(r, \\sigma), \\quad \\nu^2 = \\sigma/\\varkappa", "page": 42, "vars": [{"sym": "\\overline{P}", "meaning": "изображение давления по Лапласу", "unit": ""}, {"sym": "\\sigma", "meaning": "параметр преобразования Лапласа", "unit": ""}, {"sym": "\\varkappa", "meaning": "пь ной $\\tau = 1 / \\sigma$, полагая $P(\\tau) = \\int_0^\\infty p(t) e^{-t / \\tau} dt$.", "claims": ["laplace-pressure-transient-analysis.c8"], "page": 46, "by": "model"}, {"text": "Значения $\\tau$ не следует брать меньше 1—2 мин.", "claims": ["laplace-pressure-transient-analysis.c9"], "page": 46, "by": "model"}, {"text": "Поэтому, учитывая порядок $\\varkappa$ и $\\rho$, видим, что значения $\\rho \\sqrt{\\sigma / \\varkappa} = \\rho / \\sqrt{\\varkappa \\tau}$ достаточно малы, чтобы можно было использовать представление функций $K_0$ и $K_1$ для малых значений аргумента.", "claims": ["laplace-pressure-transient-analysis.c10"], "page": 46, "by": "model"}, {"text": "Параметры пласта — коэффициенты в формуле (II.115) — определяются по графику $\\Psi (\\ln t)$ точно так же, как и по графику $p(\\ln t)$ при мгновенной остановке скважины.", "claims": ["laplace-pressure-transient-analysis.c11"], "page": 46, "by": "model"}, {"text": "То, что зависимость $\\Psi (\\ln \\tau)$ прямолинейна, позволяет ограничиться вычислением интегралов при трех — четырех значениях $\\tau$.", "claims": ["laplace-pressure-transient-analysis.c12"], "page": 46, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Положим $U = \\bar{P}(x, y, z, \\sigma) / \\bar{P}_1(\\sigma)$.", "claims": ["laplace-pressure-transient-analysis.c1"], "page": 45, "by": "model"}, {"text": "Функция $U$ удовлетворяет уравнению (II.110) и однородным условиям на внешних границах пласта (на скважине $U = 1$).", "claims": ["laplace-pressure-transient-analysis.c2"], "page": 45, "by": "model"}, {"text": "Из формулы (II.111) следует, что отношение", "claims": ["laplace-pressure-transient-analysis.c4"], "page": 46, "by": "model"}], "formulas": [{"latex": "\\begin{array}{l} Q (\\sigma) = 2 \\pi (k h / \\mu) \\rho \\int_ {0} ^ {\\infty} e ^ {- \\sigma t} (\\partial p / \\partial r) _ {r = \\rho} d t = \\\\ = 2 \\pi (k h / \\mu) \\rho \\bar {P} _ {1} (\\sigma) (\\partial U / \\partial r) _ {r = \\rho}. \\tag {II.1 c9", "kind": "observation", "text": "Значения $\\tau$ не следует брать меньше 1—2 мин.", "quote": "Значения $\\tau$ не следует брать меньше 1—2 мин.", "unit": "u046-08", "page": 46, "by": "model", "verified": true}, {"id": "laplace-pressure-transient-analysis.c10", "kind": "observation", "text": "Поэтому, учитывая порядок $\\varkappa$ и $\\rho$, видим, что значения $\\rho \\sqrt{\\sigma / \\varkappa} = \\rho / \\sqrt{\\varkappa \\tau}$ достаточно малы, чтобы можно было использовать представление функций $K_0$ и $K_1$ для малых значений аргумента.", "quote": "Поэтому, учитывая порядок $\\varkappa$ и $\\rho$, видим, что значения $\\rho \\sqrt{\\sigma / \\varkappa} = \\rho / \\sqrt{\\varkappa \\tau}$ достаточно малы, чтобы можно было использовать представление функций $K_0$ и $K_1$ для малых значений аргумента.", "unit": "u046-09", "page": 46, "by": "model", "verified": true}, {"id": "laplace-pressure-transient-analysis.c11", "kind": "observation", "text": "Параметры пласта — коэффициенты в формуле (II.115) — определяются по графику $\\Psi (\\ln t)$ точно так же, как и по графику $p(\\ln t)$ при мгновенной остановке скважины.", "quote": "Параметры пласта — коэффициенты в формуле (II.115) — определяются по графику $\\Psi (\\ln t)$ точно так же, как и по графику $p(\\ln t)$ при мгновенной остановке скважины.", "unit": "u046-11", "page": 46, "by": "model", "verified": true}, {"id": "laplace-pressure-transient-analysis.c12", "kind": "observation", "text": "То, что зависимость $\\Psi (\\ln \\tau)$ прямолинейна, позволяет ограничиться вычислением интегралов при трех — четырех значениях $\\tau$.", "quote": "То, что зависимость $\\Psi (\\ln \\tau)$ прямолинейна, позволяет ограничиться вычислением интегралов при трех — четырех значениях $\\tau$.", "unit": "u046-11", "page": 46, "by": "model", "verified": true}], "term_ids": [], "units": ["u045-05", "u046-01", "u046-02", "u046-03", "u046-04", "u046-05", "u046-06", "u046-07", "u046-08", "u046-09", "u046-10", "u046-11"], "video_criteria": ["cause_effect", "scale_jump"], "fallback": true}, {"id": "barenblatt.equivalent-well-radius-in-methods", "order": 5, "part_id": "p1", "minutes": 3, "title": "Оценка неоднородности пласта через эквивалентный радиус скважины", "book_title": "§ 4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория", "pages": [46, 47], "difficulty": {"primary": "И", "secondary": "М"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». заглушка mock", "scene_template": "tool-in-well"}, "summary": [{"text": "Описанный общий подход позволяет получать методом восстановления давления некоторые параметры неоднородного пласта.", "claims": ["equivalent-well-radius-in-methods.c1"], "page": 46, "by": "model"}, {"text": "Пусть скважина радиусом $\\rho$ расположена в центре круговой зоны радиуса $R$ в бесконечном пласте.", "claims": ["equivalent-well-radius-in-methods.c2"], "page": 46, "by": "model"}], "how_it_works": [{"text": "Проницаемость зоны $k_1$ и пьезопроводность $\\varkappa_1$ отличаются от проницаемости $k_2$ и пьезопроводности $\\varkappa_2$ во внешней зоне пласта.", "claims": ["equivalent-well-radius-in-methods.c3"], "page": 46, "by": "model"}, {"text": "Функция $\\Psi (\\tau)$ для этого случая может быть получена с использованием решения вида (II.101) и асимптотических формул (II.104).", "claims": ["equivalent-well-radius-in-methods.c4"], "page": 46, "by": "model"}, {"text": "46 где эквивалентный радиус скважины $\\rho^*$ тот же, что и для стационарного притока (см.", "claims": ["equivalent-well-radius-in-methods.c5"], "page": 46, "by": "model"}, {"text": "Сравнивая формулы (II.115) и (II.116), видим, что формула (II.117) описывает преобразованную кривую восстановления давления в скважине радиуса $\\rho^*$ в однородном пласте с параметрами внешней зоны.", "claims": ["equivalent-well-radius-in-methods.c6"], "page": 47, "by": "model"}, {"text": "Точно так же можно показать, что эквивалентный радиус скважины, определяемый по данным о нестационарном притоке при горизонтальных или вертикальных трещинах, таков же, как и определяемый для стационарного течения при тех же условиях.", "claims": ["equivalent-well-radius-in-methods.c7"], "page": 47, "by": "model"}, {"text": "Из этого примера видно, что исследование скважин методом восстановления давления позволяет определить степень загрязнения призабойной зоны и оценить эффективность работ по интенсификации притока.", "claims": ["equivalent-well-radius-in-methods.c8"], "page": 47, "by": "model"}, {"text": "Описанный метод обработки кривых восстановления давления можно использовать и для определения других параметров неоднородности пласта: расстояния до непроницаемого или проводящего экрана, радиуса трещин и т. д.", "claims": ["equivalent-well-radius-in-methods.c9"], "page": 47, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Проницаемость зоны $k_1$ и пьезопроводность $\\varkappa_1$ отличаются от проницаемости $k_2$ и пьезопроводности $\\varkappa_2$ во внешней зоне пласта.", "claims": ["equivalent-well-radius-in-methods.c3"], "page": 46, "by": "model"}, {"text": "Функция $\\Psi (\\tau)$ для этого случая может быть получена с использованием решения вида (II.101) и асимптотических формул (II.104).", "claims": ["equivalent-well-radius-in-methods.c4"], "page": 46, "by": "model"}, {"text": "46 где эквивалентный радиус скважины $\\rho^*$ тот же, что и для стационарного притока (см.", "claims": ["equivalent-well-radius-in-methods.c5"], "page": 46, "by": "model"}], "formulas": [{"latex": "\\Psi (\\tau) = \\mu (4 \\pi k _ {2} h) ^ {- 1} \\ln \\tau + \\mu (4 \\pi k _ {2} h) ^ {- 1} \\ln (4 \\varkappa^ {2} / \\gamma^ {2} \\rho^ {\\varkappa^ {2}}), \\tag {II.116}", "page": 46, "vars": []}, {"latex": "\\rho^* = R (\\rho/R)^\\gamma = \\rho (\\rho/R)^{\\gamma-1}, \\quad \\gamma = k_2/k_1. \\quad (II.117)", "page": 47, "vars": []}], "tables": [], "misconception": null, "data_m лить степень загрязнения призабойной зоны и оценить эффективность работ по интенсификации притока.", "quote": "Из этого примера видно, что исследование скважин методом восстановления давления позволяет определить степень загрязнения призабойной зоны и оценить эффективность работ по интенсификации притока.", "unit": "u047-02", "page": 47, "by": "model", "verified": true}, {"id": "equivalent-well-radius-in-methods.c9", "kind": "observation", "text": "Описанный метод обработки кривых восстановления давления можно использовать и для определения других параметров неоднородности пласта: расстояния до непроницаемого или проводящего экрана, радиуса трещин и т. д.", "quote": "Описанный метод обработки кривых восстановления давления можно использовать и для определения других параметров неоднородности пласта: расстояния до непроницаемого или проводящего экрана, радиуса трещин и т. д.", "unit": "u047-03", "page": 47, "by": "model", "verified": true}], "term_ids": [], "units": ["u046-12", "u046-13", "u046-14", "u046-15", "u047-01", "u047-02", "u047-03"], "video_criteria": ["cause_effect"], "fallback": true}, {"id": "barenblatt.integral-relations-method", "order": 6, "part_id": "p1", "minutes": 5, "title": "Метод интегральных соотношений в задачах фильтрации", "book_title": "§ 4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория", "pages": [47, 48], "difficulty": {"primary": "Ф", "secondary": "М"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». заглушка mock", "scene_template": "parametric-plot"}, "summary": [{"text": "Метод интегральных соотношений.", "claims": ["integral-relations-method.c1"], "page": 47, "by": "model"}, {"text": "Хорошо разработанная теория уравнений математической физики позволяет получить в принципе точные решения широкого класса задач нестационарной фильтрации.", "claims": ["integral-relations-method.c2"], "page": 47, "by": "model"}], "how_it_works": [{"text": "Однако эти решения не всегда удовлетворяют требованиям простоты и обозримости.", "claims": ["integral-relations-method.c3"], "page": 47, "by": "model"}, {"text": "Возможность успешного применения приближенных методов в теории нестационарной фильтрации связана со следующими особенностями рассматриваемых задач.", "claims": ["integral-relations-method.c4"], "page": 47, "by": "model"}, {"text": "Во-первых, большинство задач нестационарной фильтрации однородной жидкости сводится к решению уравнений параболического типа, для которых характерно сглаживание начальных возмущений искомых величин со временем и по мере продвижения внутрь области от источника возмущений.", "claims": ["integral-relations-method.c5"], "page": 47, "by": "model"}, {"text": "Во-вторых, в ряде задач, представляющих практический интерес, искомое решение имеет в некоторых точках области (скважины, галереи) известные особенности.", "claims": ["integral-relations-method.c6"], "page": 47, "by": "model"}, {"text": "В ряде приближенных методов используется понятие области влияния или области возмущения, вне которой течение можно считать невозмущенным, т. е. сохраняются начальные значения $p$ или $u$.", "claims": ["integral-relations-method.c7"], "page": 47, "by": "model"}, {"text": "Возможность введения такой области следует из анализа точных решений, приведенных в настоящем параграфе.", "claims": ["integral-relations-method.c8"], "page": 47, "by": "model"}, {"text": "Например, из формулы (II.93) следует, что отклонение от начального убывает с ростом $x$ как $\\exp(-x^2/4xt)$.", "claims": ["integral-relations-method.c9"], "page": 47, "by": "model"}, {"text": "47 общих приближенных методов в теории фильтрации является метод интегральных соотношений [3].", "claims": ["integral-relations-method.c10"], "page": 47, "by": "model"}, {"text": "Сущность его заключается в том, что исходное дифференциальное уравнение (II.86) или (II.98) в области возмущения скважины заменяется системой интегральных соотношений вида", "claims": ["integral-relations-method.c11"], "page": 48, "by": "model"}, {"text": "где $f_i(x, t)$, $i = 0, 1, \\dots, n$ образуют полную систему как функции от $x$ на отрезке $[L_1(t), L_2(t)]$.", "claims": ["integral-relations-method.c12"], "page": 48, "by": "model"}, {"text": "Если $p(x, t)$, представить в виде разложения в ряд по функциям $f_i(x, t)$, то из (II.118) получим систему уравнений для коэффициентов этого ряда.", "claims": ["integral-relations-method.c13"], "page": 48, "by": "model"}, {"text": "Рассмотрим задачу о возмущении первоначального стационарного движения в пласте.", "claims": ["integral-relations-method.c14"], "page": 48, "by": "model"}, {"text": "Возьмем простейшую систему функций — последовательные степени пространственной переменной", "claims": ["integral-relations-method.c15"], "page": 48, "by": "model"}, {"text": "Пусть в момент $t = 0$ происходит отбор жидкости из пласта с расходом — $kb/\\mu HG$.", "claims": ["integral-relations-method.c16"], "page": 48, "by": "model"}, {"text": "Давление в этом случае распределено по линейному закону", "claims": ["integral-relations-method.c17"], "page": 48, "by": "model"}, {"text": "Будем искать приближенное решение задачи в виде многочлена", "claims": ["integral-relations-method.c18"], "page": 48, "by": "model"}, {"text": "В таком виде задача имеет $n + 2$ неизвестных: $P_i(t)$ и $l(t)$.", "claims": ["integral-relations-method.c19"], "page": 48, "by": "model"}, {"text": "Для их определения можно составить систему уравнений, состоящую из некоторого числа интегральных соотношений, граничного условия при $x = 0$ и условия при $x = l$.", "claims": ["integral-relations-method.c20"], "page": 48, "by": "model"}, {"text": "При $x = l$ должны выполняться условия непрерывности давления $p(l, t) = P + Gl$ и некоторой степени гладкости функции $p(x, t)$:", "claims": ["integral-relations-method.c21"], "page": 48, "by": "model"}, {"text": "Выбор наилучшего приближенного метода расчета $p(x, t)$ связан с тем, насколько удачно подобрано число используемых интегральных соотношений и условий гладкости.", "claims": ["integral-relations-method.c22"], "page": 48, "by": "model"}, {"text": "Используя интегрирование по частям и теорему о дифференцировании определенного интеграла, приведем систему (II.118) к виду", "claims": ["integral-relations-method.c23"], "page": 48, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Например, из формулы (II.93) следует, что отклонение от начального убывает с ростом $x$ как $\\exp(-x^2/4xt)$.", "claims": ["integral-relations-method.c9"], "page": 47, "by": "model"}, {"text": "47 общих приближенных методов в теории фильтрации является метод интегральных соотношений [3].", "claims": ["integral-relations-method.c10"], "page": 47, "by": "model"}, {"text": "Сущность его заключается в том, что исходное дифференциальное уравнение (II.86) или (II.98) в области возмущения скважины заменяется системой интегральных соотношений вида", "claims": ["integral-relations-method.c11"], "page": 48, "by": "model"}], "formulas": [{"latex": "\\int_{L_1(t)}^{L_2(t)} \\partial p / \\partial t f_i(x, t) dx = \\varkappa \\int_{L_1(t)}^{L_2(t)} \\partial^2 p / \\partial x^2 f_i(x, t) dx, \\quad i = 0, 1, \\dots, n, \\tag{II.118}", "page": 48, "vars": []}, {"latex": "1, x, x^2, \\dots, x^n, \\dots", "page": 48, "vars": []}, {"latex": "p(x, 0) = P + Gx. \\tag{II.119}", "page": 48, "vars": []}, {"latex": "\\begin{array}{l} p(x, t) = P_0(t) + P_1(t) x/l + \\dots + P_n(t) x^n/l^n \\quad (0 \\leqslant x \\leqslant l), \\\\ p(x, t) = p(x, 0) \\quad (x \\geqslant l). \\tag{II.120} \\end{array}", "page": 48, "vars": []}], "tables": [], "misconception": null, "data_meaning": null, "analogy": null, "now_practice": [], "layers": {"mechanism": [], "practice": [], "nuances": [], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "barenblatt.integral-relations-method.ill1", "class": "B", "src": "media/barenblatt.int

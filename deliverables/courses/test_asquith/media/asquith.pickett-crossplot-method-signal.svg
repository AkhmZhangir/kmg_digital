<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" role="img" aria-label="Схема «сигнал → вывод»: Кроссплот Пикетта для определения насыщения и параметров"><style>
.bg{fill:#ffffff}.box{fill:#eef3f1;stroke:#56625d;stroke-width:1.2}.obs{fill:#e3f1e8;stroke:#2c8350}.inf{fill:#e4ecf7;stroke:#2f65a8}
.ass{fill:#f7e6ee;stroke:#b83a72}.t{font:14px system-ui,sans-serif;fill:#17211e}.s{font:12px system-ui,sans-serif;fill:#56625d}
.h{font:600 15px system-ui,sans-serif;fill:#17211e}.ar{stroke:#0c6b6b;stroke-width:2;fill:none;marker-end:url(#a)}.ax{stroke:#56625d;stroke-width:1}
.c1{stroke:#0c6b6b;stroke-width:2.2;fill:none}.c2{stroke:#9c6c12;stroke-width:2.2;fill:none}.c3{stroke:#b23a3a;stroke-width:2.2;fill:none}
.tag{font:11px ui-monospace,monospace;fill:#56625d}
@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="760" height="468" rx="10"/><text x="20" y="26" class="h">Кроссплот Пикетта для определения насыщения и параметров</text><text x="20" y="54" class="s">наблюдение (что видно в данных)</text><text x="420" y="54" class="s">вывод (интерпретация)</text><rect class="obs" x="20" y="66" width="320" height="68" rx="8"/><text x="32" y="86" class="t">Метод оценивает водонасыщение и помогает</text><text x="32" y="104" class="t">определить Rw, m, а также матричные</text><text x="32" y="122" class="t">параметры sonic и density логов.</text><rect class="obs" x="20" y="144" width="320" height="68" rx="8"/><text x="32" y="164" class="t">Кроссплот Пикетта является одним из</text><text x="32" y="182" class="t">простейших и эффективнейших методов</text><text x="32" y="200" class="t">кроссплотов.</text><rect class="obs" x="20" y="222" width="320" height="68" rx="8"/><text x="32" y="242" class="t">Взятие логарифма от уравнения Арчи для</text><text x="32" y="260" class="t">удельного сопротивления приводит к</text><text x="32" y="278" class="t">линейному виду.</text><rect class="obs" x="20" y="300" width="320" height="68" rx="8"/><text x="32" y="320" class="t">Для водоносной зоны Sw равно единице,</text><text x="32" y="338" class="t">логарифм Sw равен нулю, и уравнение</text><text x="32" y="356" class="t">упрощается.</text><rect class="inf" x="420" y="66" width="320" height="68" rx="8"/><text x="432" y="86" class="t">Метод основан на том, что Rt является</text><text x="432" y="104" class="t">функцией пористости, Sw и m, представляя</text><text x="432" y="122" class="t">графическое решение уравнения Арчи.</text><rect class="inf" x="420" y="144" width="320" height="68" rx="8"/><text x="432" y="164" class="t">Сила кроссплота Пикетта в том, что Rw и</text><text x="432" y="182" class="t">m можно оценить из данных, избегая</text><text x="432" y="200" class="t">локальных знаний или дорогих замеров</text><path class="ar" d="M346 144.0 L414 144.0"/><rect class="ass" x="20" y="384" width="720" height="50" rx="8"/><text x="32" y="404" class="t">Допущение: Главное допущение интерпретации заключается в постоянстве всех параметров матрицы, a, m, n</text><text x="32" y="422" class="t">и Rw в сравниваемых зонах.</text><text x="750" y="460" text-anchor="end" class="tag">схема · наблюдение отделено от вывода</text></svg>
}{4 \\kappa t} \\leq 0,01;$$", "unit": "u491-12", "page": 491, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c5", "kind": "observation", "text": "Погрешность аппроксимации не превосходит 5,7% при x \u003c= 0,1.", "quote": "$$5,7\\%, \\quad \\text{если } x \\leq 0,1;$$", "unit": "u491-13", "page": 491, "by": "model", "verified": false}, {"id": "pressure-formula-approximation.c6", "kind": "observation", "text": "Погрешность аппроксимации не превосходит 9,7% при x \u003c= 0,14.", "quote": "$$9,7\\%, \\quad \\text{если } x \\leq 0,14.$$", "unit": "u491-14", "page": 491, "by": "model", "verified": false}, {"id": "pressure-formula-approximation.c7", "kind": "observation", "text": "Для значений r^2 / (4 kappa t) \u003c= 1 давление определяется по формуле (23.53).", "quote": "Следовательно, для значений $r^2/(4 \\kappa t) \\leq 1$ давление можно определять по формуле", "unit": "u491-15", "page": 491, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c8", "kind": "observation", "text": "Для расчетов пластового давления в открытом круговом пласте можно пользоваться формулой для бесконечного пласта с точностью до 0,2% при R_k >= 10^5 r_c и F_0 \u003c= 0,2.", "quote": "Для расчетов пластового давления в любой точке открытого кругового пласта в случае r ≤ 0,1 Rк, можно с высокой степенью точности (до 0,2%) пользоваться формулой (23.52) для бесконечного пласта, если при этом Rк ≥ 10⁵ rc, Fo ≤ 0,2.", "unit": "u493-04", "page": 493, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c9", "kind": "observation", "text": "Градиент давления для значений r^2 \u003c= 0,03 * 4 kappa t практически не зависит от времени.", "quote": "Из этой формулы следует, что градиент давления для значений r, удовлетворяющих неравенству r² ≤ 0,03 · 4κt, практически не зависит от времени", "unit": "u493-10", "page": 493, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c10", "kind": "observation", "text": "Для указанных значений r пьезометрические кривые представляют собой логарифмические линии.", "quote": "Для указанных значений r пьезометрические кривые представляют собой логарифмические линии (рис. 23.4).", "unit": "u493-10", "page": 493, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c11", "kind": "observation", "text": "Постоянная Эйлера принимается равной 0,5772.", "quote": "$\\gamma$ – постоянная Эйлера – иррациональное число, приближенное значение которого при вычислениях в подземной гидромеханике принимается равным 0,5772.", "unit": "u491-08", "page": 491, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c12", "kind": "observation", "text": "Погрешность расчетов давления по формуле точечного стока составляет 0,6% при f_0 = 100; 2,3% при f_0 = 25, 5% при f_0 = 10, 9,4% при f_0 = 5.", "quote": "В.Н.Щелкачев установил, что погрешность подсчетов давления по формуле (23.52) составляет 0,6% при $f_0 = 100$; 2,3% при $f_0 = 25$, 5% при $f_0 = 10$, 9,4%; при $f_0 = 5$", "unit": "u492-11", "page": 492, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c13", "kind": "observation", "text": "Погрешность в подсчетах забойного давления не превзойдет 0,08% при Fo \u003c= 0,2; 1% при Fo \u003c= 0,35; 1,9% при Fo \u003c= 0,5.", "quote": "При этом погрешность в подсчетах забойного давления не превзойдет 0,08% при Fo ≤ 0,2; 1% при Fo ≤ 0,35; 1,9% при Fo ≤ 0,5.", "unit": "u493-03", "page": 493, "by": "model", "verified": true}, {"id": "pressure-formula-approximation.c14", "kind": "observation", "text": "Решения дифференциального уравнения Фурье для ограниченных пластов представляются бесконечными рядами по функциям Бесселя.", "quote": "Решения дифференциального уравнения Фурье (23.40) для различных случаев фильтрации упругой жидкости в ограниченных открытых и закрытых пластах представляются бесконечными рядами по специальным функциям Бесселя.", "unit": "u493-06", "page": 493, "by": "model", "verified": true}], "term_ids": ["t-euler-s-constant-gamma", "t-fourier-parameter-for-filtration"], "units": ["u491-08", "u491-09", "u491-10", "u491-11", "u491-12", "u491-13", "u491-14", "u491-15", "u491-16", "u491-17", "u491-18", "u492-01", "u492-02", "u492-03", "u492-04", "u492-05", "u492-06", "u492-07", "u492-08", "u492-09", "u492-10", "u492-11", "u492-12", "u492-13", "u492-14", "u492-15", "u493-01", "u493-02", "u493-03", "u493-04", "u493-05", "u493-06", "u493-07", "u493-08", "u493-09", "u493-10"], "video_criteria": ["time_change", "counterintuitive"], "fallback": false}, {"id": "basniev.psss-method-concept", "order": 23, "part_id": "p8", "minutes": 3, "title": "Суть метода последовательной смены стационарных состояний", "book_title": "Нефтегазовая гидромеханика", "pages": [494, 495], "difficulty": {"primary": "М", "secondary": "Н"}, "threshold": true, "format": {"primary": "short", "reason": "Тип «механизм, процесс»; критерии видеоёмкости: контринтуитивность, цепочка «причина → следствие». Текстовый формат с четким разделением на механизм и шаги, так как метод описывает алгоритмический подход к упрощению математической модели, что близко ИТ-специалистам (аппроксимация, дискретизация по времени).", "scene_template": "process-1d"}, "summary": [{"text": "Метод последовательной смены стационарных состояний (ПССС) — это приближенный способ решения задач неустановившейся фильтрации, разработанный И.А. Чарным.", "claims": ["psss-method-concept.c1"], "page": 494, "by": "model"}, {"text": "Он основан на допущении, что давление меняется во времени медленнее, чем по координатам, что позволяет в каждый момент времени считать процесс стационарным.", "claims": ["psss-method-concept.c2"], "page": 494, "by": "model"}], "how_it_works": [{"text": "Метод применяется для задач теории упругого режима фильтрации упругой жидкости в упругой пористой среде.", "claims": ["psss-method-concept.c3"], "page": 494, "by": "model"}, {"text": "В основе метода лежит предположение, что производная давления по времени значительно меньше пространственных градиентов.", "claims": ["psss-method-concept.c4"], "page": 494, "by": "model"}, {"text": "Это позволяет в первом приближении отбросить производную по времени в уравнении пьезопроводности.", "claims": ["psss-method-concept.c5"], "page": 494, "by": "model"}, {"text": "В результате уравнение сводится к уравнению Лапласа, описывающему стационарный процесс.", "claims": ["psss-method-concept.c6"], "page": 494, "by": "model"}, {"text": "В каждый момент времени пласт условно разделяется на две области: возмущенную и невозмущенную.", "claims": ["psss-method-concept.c7"], "page": 494, "by": "model"}, {"text": "Возмущенная область начинается от стенки скважины и распространяется наружу.", "claims": ["psss-method-concept.c8"], "page": 494, "by": "model"}, {"text": "В невозмущенной области давление постоянно и равно начальному контурному давлению.", "claims": ["psss-method-concept.c9"], "page": 494, "by": "model"}, {"text": "В возмущенной области давление распределяется так, как будто движение установившееся.", "claims": ["psss-method-concept.c10"], "page": 494, "by": "model"}, {"text": "Внешняя граница возмущенной области в данный момент служит контуром питания для этой области.", "claims": ["psss-method-concept.c11"], "page": 494, "by": "model"}, {"text": "Закон движения границы между областями определяется через уравнение материального баланса.", "claims": ["psss-method-concept.c12"], "page": 494, "by": "model"}, {"text": "Также для определения границы используются граничные условия.", "claims": ["psss-method-concept.c13"], "page": 494, "by": "model"}], "steps": [{"text": "Разделить пласт на возмущенную и невозмущенную области.", "claims": ["psss-method-concept.c7"], "page": 494, "by": "model"}, {"text": "Рассчитать распределение давления в возмущенной области, используя уравнение Лапласа (стационарный процесс).", "claims": ["psss-method-concept.c6", "psss-method-concept.c10"], "page": 494, "by": "model"}, {"text": "Принять внешнюю границу возмущенной области за контур питания.", "claims": ["psss-method-concept.c11"], "page": 494, "by": "model"}, {"text": "Определить положение границы, решая уравнение материального баланса с граничными условиями.", "claims": ["psss-method-concept.c12", "psss-method-concept.c13"], "page": 494, "by": "model"}], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Начальное давление, параметры скважины, свойства пласта.", "output": "Распределение давления в пространстве и положение движущейся границы возмущения во времени.", "breaks": [{"text": "Метод предполагает, что временные изменения медленнее пространственных. Если это условие нарушается, точность падает.", "claims": [], "page": 494, "by": "model"}], "hypotheses": [{"text": "Гипотеза: В IT-аналогии это похоже на кэширование состояния системы, которое обновляется дискретно, пока внутренние параметры не требуют пересчета всей модели.", "claims": [], "page": 494, "by": "model"}]}, "analogy": {"text": "Представьте, что вы фотографируете движущийся объект. Вместо того чтобы снимать видео (непрерывное изменение), вы делаете серию снимков (стационарные состояния). На каждом снимке объект зафиксирован, но его положение меняется от кадра к кадру.", "breaks_where": "Аналогия ломается, потому что в методе ПССС «снимок» — это не просто фиксация, а пересчет всего поля давления на основе уравнения Лапласа для новой границы, а не просто сдвиг картинки."}, "now_practice": [], "layers": {"mechanism": [{"text": "Метод заменяет сложное дифференциальное уравнение в частных производных (уравнение пьезопроводности) на серию простых уравнений Лапласа.", "claims": ["psss-method-concept.c5", "psss-method-concept.c6"], "page": 494, "by": "model"}, {"text": "Граница между областями движется, расширяясь от скважины.", "claims": ["psss-method-concept.c8"], "page": 494, "by": "model"}], "practice": [{"text": "Метод широко применяется в практических расчетах теории упругого режима.", "claims": ["psss-method-concept.c1"], "page": 494, "by": "model"}], "nuances": [{"text": "Процесс перераспределения давления протекает в две фазы.", "claims": ["psss-method-concept.c14"], "page": 495, "by": "model"}, {"text": "Первая фаза: граница возмущенной области непрерывно расширяется.", "claims": ["psss-method-concept.c15"], "page": 495, "by": "model"}, {"text": "Вторая фаза начинается, когда граница достигает естественной границы пласта.", "claims": ["psss-method-concept.c16"], "page": 495, "by": "model"}, {"text": "Для бесконечного пласта рассматривается только первая фаза.", "claims": ["psss-method-concept.c17"], "page": 495, "by": "model"}], "deeper": [{"text": "Точные решения часто представляют собой громоздкие бесконечные ряды или интегралы.", "claims": ["psss-method-concept.c18"], "page": 494, "by": "model"}, {"text": "ПССС предлагает более простое приближение, избегая специальных функций.", "claims": ["psss-method-concept.c19"], "page": 494, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "basniev.psss-method-concept.ill1", "class": "B", "src": "media/basniev.psss-method-concept-steps.svg", "alt": "Порядок действий по тексту автора: Суть метода последовательной смены стационарных состояний", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "basniev.psss-method-concept.ill2", "class": "B", "src": "media/basniev.psss-method-concept-pressure.svg", "alt": "Расчёт: как понижение давления расходится по пласту: Суть метода последовательной смены стационарных состояний", "caption": "Расчёт: как понижение давления расходится по пласту", "provenance": "симуляция", "redrawn_from": null, "source_url": null}], "links": [{"to": "basniev.pressure-formula-approximation", "type": "prerequisite"}], "claims": [{"id": "psss-method-concept.c1", "kind": "observation", "text": "Метод ПССС, разработанный И.А. Чарным, является одним из наиболее простых приближенных методов решения задач теории упругого режима и широко применяется на практике.", "quote": "Одним из наиболее простых по своей идее приближенных методов решения задач теории упругого режима является метод последовательной смены стационарных состояний (ПССС), развитый И.А.Чарным и широко применяющийся в практических расчетах.", "unit": "u494-05", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c2", "kind": "assumption", "text": "Метод основан на предположении, что давление в пласте меняется во времени значительно медленнее, чем по координатам.", "quote": "Метод основан на предположении, что давление в пласте меняется во времени значительно медленнее, чем по координатам.", "unit": "u494-05", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c3", "kind": "observation", "text": "Метод применяется для решения задач неустановившейся фильтрации упругой жидкости в упругой пористой среде.", "quote": "В связи с этим были предприняты поиски приближенных эффективных решений задач неустановившейся фильтрации упругой жидкости в упругой пористой среде. Рассмотрим здесь некоторые из разработанных приближенных методов, получивших широкое применение при решении задач теории упругого режима.", "unit": "u494-03", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c4", "kind": "inference", "text": "Из-за медленности временных изменений производную по времени можно отбросить в первом приближении.", "quote": "Поэтому производную по времени можно в первом приближении отбросить", "unit": "u494-05", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c5", "kind": "inference", "text": "Отбрасывание производной по времени приводит к получению уравнения Лапласа для давления.", "quote": "в результате чего для давления получается уравнение Лапласа, описывающее стационарный процесс.", "unit": "u494-05", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c6", "kind": "assumption", "text": "Уравнение Лапласа описывает стационарный процесс.", "quote": "уравнение Лапласа, описывающее стационарный процесс.", "unit": "u494-05", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c7", "kind": "assumption", "text": "В каждый момент времени пласт разделяется на возмущенную и невозмущенную области.", "quote": "В каждый момент времени весь пласт условно разделяется на две области – возмущенную и невозмущенную.", "unit": "u494-06", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c8", "kind": "observation", "text": "Возмущенная область начинается от стенки скважины.", "quote": "При этом предполагается, что в возмущенной области пласта, начинающейся от стенки скважины", "unit": "u494-06", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c9", "kind": "assumption", "text": "В невозмущенной области давление постоянно и равно начальному контурному давлению.", "quote": "В невозмущенной области пласта давление всюду постоянно и равно начальному контурному давлению.", "unit": "u494-06", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c10", "kind": "assumption", "text": "В возмущенной области давление распределяется как при установившемся движении.", "quote": "давление распределяется так, как будто бы движение жидкости в ней установившееся", "unit": "u494-06", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c11", "kind": "assumption", "text": "Внешняя граница возмущенной области служит контуром питания.", "quote": "внешняя граница этой области служит в данный момент контуром питания.", "unit": "u494-06", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c12", "kind": "inference", "text": "Закон движения границы определяется уравнением материального баланса.", "quote": "Закон движения подвижной границы, разделяющей возмущенную и невозмущенную области, определяется при помощи уравнения материального баланса", "unit": "u494-06", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c13", "kind": "inference", "text": "Закон движения границы также определяется граничными условиями.", "quote": "и граничных условий.", "unit": "u494-06", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c14", "kind": "inference", "text": "Разделение на две области означает, что процесс перераспределения давления протекает в две фазы.", "quote": "Разделение фильтрационного потока на две области – возмущенную и невозмущенную – вызывает необходимость рассматривать процесс перераспределения пластового давления протекающим в две фазы.", "unit": "u495-03", "page": 495, "by": "model", "verified": true}, {"id": "psss-method-concept.c15", "kind": "observation", "text": "В первой фазе граница возмущенной области непрерывно расширяется.", "quote": "В течение первой фазы граница возмущенной области непрерывно расширяется.", "unit": "u495-03", "page": 495, "by": "model", "verified": true}, {"id": "psss-method-concept.c16", "kind": "observation", "text": "Вторая фаза начинается, когда граница достигает естественной границы пласта.", "quote": "И в тот момент, когда она достигает естественной границы пласта, начинается вторая фаза.", "unit": "u495-03", "page": 495, "by": "model", "verified": true}, {"id": "psss-method-concept.c17", "kind": "inference", "text": "Для бесконечного пласта рассматривается только первая фаза, так как граница не достигает естественных пределов.", "quote": "При теоретическом исследовании процесса в условиях бесконечного пласта приходится, естественно, иметь дело только с первой фазой, продолжительность которой не ограничивается.", "unit": "u495-03", "page": 495, "by": "model", "verified": true}, {"id": "psss-method-concept.c18", "kind": "observation", "text": "Точные решения краевых задач часто представляют собой громоздкие формулы в виде бесконечных медленно сходящихся рядов или несобственных интегралов со специальными функциями.", "quote": "Однако во многих случаях эти решения представляются громоздкими формулами в виде бесконечного медленно сходящегося ряда или несобственного интеграла, содержащего специальные функции.", "unit": "u494-03", "page": 494, "by": "model", "verified": true}, {"id": "psss-method-concept.c19", "kind": "inference", "text": "Приближенные методы, такие как ПССС, были разработаны для получения эффективных решений, избегая сложности точных.", "quote": "В связи с этим были предприняты поиски приближенных эффективных решений задач неустановившейся фильтрации упругой жидкости в упругой пористой среде.", "unit": "u494-03", "page": 494, "by": "model", "verified": true}], "term_ids": ["t-method-of-successive-change-of-stationary-states", "t-laplace-equation", "t-disturbed-zone", "t-undisturbed-zone"], "units": ["u494-03", "u494-04", "u494-05", "u494-06", "u495-01", "u495-02", "u495-03", "u495-04"], "video_criteria": ["counterintuitive", "cause_effect"], "fallback": false}, {"id": "basniev.psss-linear-flow", "order": 24, "part_id": "p9", "minutes": 8, "title": "Применение метода ПССС к линейному потоку", "book_title": "Нефтегазовая гидромеханика", "pages": [495, 497], "difficulty": {"primary": "Пр", "secondary": "Ф"}, "threshold": false, "format": {"primary": "long", "reason": "Тип «процедура»; критерии видеоёмкости: изменение во времени, скачок масштаба. Текст подходит для изучения формул и алгоритмов вывода, так как узел содержит строгие математические выкладки и сравнение погрешностей.", "scene_template": "step-flow"}, "summary": [{"text": "Метод ПССС аппроксимирует неустановившийся поток линейным профилем давления в движущейся зоне.", "claims": ["psss-linear-flow.c1"], "page": 495, "by": "model"}, {"text": "При постоянном дебите погрешность составляет 25%, при постоянном давлении — 11%.", "claims": ["psss-linear-flow.c2", "psss-linear-flow.c3"], "page": 496, "by": "model"}], "how_it_works": [{"text": "Рассматривается прямолинейно-параллельный поток упругой жидкости.", "claims": ["psss-linear-flow.c4"], "page": 495, "by": "model"}, {"text": "В момент пуска галереи давление во всем пласте равно $p_к$.", "claims": ["psss-linear-flow.c5"], "page": 495, "by": "model"}, {"text": "К моменту $t$ возмущение распространяется на длину $l(t)$.", "claims": ["psss-linear-flow.c6"], "page": 495, "by": "model"}, {"text": "В зоне $0 \\leq x \\leq l(t)$ давление считается установившимся.", "claims": ["psss-linear-flow.c7"], "page": 495, "by": "model"}, {"text": "Распределение давления описывается линейной зависимостью.", "claims": ["psss-linear-flow.c8"], "page": 495, "by": "model"}, {"text": "Требуется найти закон перемещения границы $l(t)$.", "claims": ["psss-linear-flow.c9"], "page": 495, "by": "model"}, {"text": "Количество добытой продукции за $dt$ равно изменению упругого запаса.", "claims": ["psss-linear-flow.c10"], "page": 495, "by": "model"}, {"text": "Объем возмущенной зоны $V(t) = Bh l(t)$.", "claims": ["psss-linear-flow.c11"], "page": 495, "by": "model"}, {"text": "Средневзвешенное давление вычисляется как среднее арифметическое.", "claims": ["psss-linear-flow.c12"], "page": 495, "by": "model"}, {"text": "Разность давлений $\\Delta p = (p_к - p_г)/2$.", "claims": ["psss-linear-flow.c13"], "page": 495, "by": "model"}, {"text": "При постоянном дебите $Q$ погрешность составляет 25%.", "claims": ["psss-linear-flow.c2"], "page": 496, "by": "model"}, {"text": "При постоянном давлении $p_г$ погрешность составляет 11%.", "claims": ["psss-linear-flow.c3"], "page": 497, "by": "model"}], "steps": [{"text": "Записывается закон Дарси для установившегося потока в зоне $l(t)$.", "claims": ["psss-linear-flow.c14"], "page": 496, "by": "model"}, {"text": "Выражается разность давлений через дебит и длину фронта.", "claims": ["psss-linear-flow.c15"], "page": 496, "by": "model"}, {"text": "Подставляются выражения в баланс упругого запаса.", "claims": ["psss-linear-flow.c16"], "page": 496, "by": "model"}, {"text": "Уравнение интегрируется для нахождения $l(t)$.", "claims": ["psss-linear-flow.c17"], "page": 496, "by": "model"}, {"text": "Результат подставляется обратно в формулу давления.", "claims": ["psss-linear-flow.c18"], "page": 496, "by": "model"}], "examples": [{"title": "Случай 1: Постоянный дебит", "page": 495, "figure": "рис. 24.1", "condition": [{"text": "Галерея пущена в эксплуатацию при $t=0$.", "claims": ["psss-linear-flow.c5"], "page": 495, "by": "model"}, {"text": "Поддерживается постоянный дебит $Q$.", "claims": ["psss-linear-flow.c19"], "page": 495, "by": "model"}, {"text": "Начальное давление $p_к$.", "claims": ["psss-linear-flow.c5"], "page": 495, "by": "model"}], "solution": [{"text": "Давление меняется линейно от $p_к$ до $p_г$.", "claims": ["psss-linear-flow.c8"], "page": 495, "by": "model"}, {"text": "Применяется баланс упругого запаса.", "claims": ["psss-linear-flow.c10"], "page": 495, "by": "model"}, {"text": "Интегрирование дает $l(t) = \\sqrt{2\\kappa t}$.", "claims": ["psss-linear-flow.c20"], "page": 496, "by": "model"}], "result": [{"text": "Погрешность расчета депрессии составляет 25%.", "claims": ["psss-linear-flow.c2"], "page": 496, "by": "model"}]}, {"title": "Случай 2: Постоянное давление", "page": 496, "figure": null, "condition": [{"text": "Галерея пущена при $t=0$.", "claims": ["psss-linear-flow.c21"], "page": 496, "by": "model"}, {"text": "Поддерживается постоянное забойное давление $p_г = const$.", "claims": ["psss-linear-flow.c22"], "page": 496, "by": "model"}, {"text": "Начальное давление $p_к$.", "claims": ["psss-linear-flow.c21"], "page": 496, "by": "model"}], "solution": [{"text": "Дебит $Q(t)$ вычисляется по закону Дарси.", "claims": ["psss-linear-flow.c23"], "page": 496, "by": "model"}, {"text": "Баланс запаса интегрируется.", "claims": ["psss-linear-flow.c24"], "page": 497, "by": "model"}, {"text": "Граница фронта $l(t) = 2\\sqrt{\\kappa t}$.", "claims": ["psss-linear-flow.c25"], "page": 497, "by": "model"}], "result": [{"text": "Погрешность расчета дебита составляет 11%.", "claims": ["psss-linear-flow.c3"], "page": 497, "by": "model"}]}], "numbers": [{"text": "Погрешность для случая постоянного дебита равна 25%.", "claims": ["psss-linear-flow.c2"], "page": 496, "by": "model"}, {"text": "Погрешность для случая постоянного давления равна 11%.", "claims": ["psss-linear-flow.c3"], "page": 497, "by": "model"}], "formulas": [{"latex": "p(x, t) = p_к - \\frac{Q\\mu}{kBh} (l(t) - x), \\quad 0 \\leq x \\leq l(t).", "page": 495, "vars": [{"sym": "p(x, t)", "meaning": "Давление в точке x в момент t", "unit": ""}, {"sym": "p_к", "meaning": "Начальное пластовое давление", "unit": ""}, {"sym": "Q", "meaning": "Дебит галереи", "unit": ""}, {"sym": "\\mu", "meaning": "Вязкость жидкости", "unit": ""}, {"sym": "k", "meaning": "Проницаемость пласта", "unit": ""}, {"sym": "B", "meaning": "Ширина пласта", "unit": ""}, {"sym": "h", "meaning": "Толщина пласта", "unit": ""}, {"sym": "l(t)", "meaning": "Длина фронта возмущения", "unit": ""}, {"sym": "x", "meaning": "Координата вдоль пласта", "unit": ""}]}, {"latex": "Qdt = \\beta^* d[V(t)\\Delta p].", "page": 495, "vars": [{"sym": "Q", "meaning": "Дебит", "unit": ""}, {"sym": "dt", "meaning": "Элемент времени", "unit": ""}, {"sym": "\\beta^*", "meaning": "Коэффициент упругоемкости", "unit": ""}, {"sym": "V(t)", "meaning": "Объем возмущенной зоны", "unit": ""}, {"sym": "\\Delta p", "meaning": "Средняя депрессия", "unit": ""}]}, {"latex": "l(t) = \\sqrt{2\\kappa t}.", "page": 496, "vars": [{"sym": "l(t)", "meaning": "Длина фронта возмущения", "unit": ""}, {"sym": "\\kappa", "meaning": "Коэффициент пьезопроводности", "unit": ""}, {"sym": "t", "meaning": "Время", "unit": ""}]}, {"latex": "l(t) = 2\\sqrt{\\kappa t}.", "page": 497, "vars": [{"sym": "l(t)", "meaning": "Длина фронта возмущения", "unit": ""}, {"sym": "\\kappa", "meaning": "Коэффициент пьезопроводности", "unit": ""}, {"sym": "t", "meaning": "Время", "unit": ""}]}], "tables": [], "misconception": {"wrong": "Давление в пласте меняется мгновенно или равномерно.", "right": [{"text": "Возмущени рямолинейно-параллельный поток.", "quote": "Прямолинейно-параллельный неустановившийся фильтрационный поток", "unit": "u495-05", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c5", "kind": "assumption", "text": "Начальное давление во всем пласте одинаково и равно p_k.", "quote": "До пуска галереи давление во всем пласте было одинаковым и равным p_к", "unit": "u495-06", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c6", "kind": "inference", "text": "К моменту t возмущение распространяется на длину l(t).", "quote": "К моменту времени t... граница возмущенной области распространится на длину l(t)", "unit": "u495-07", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c7", "kind": "assumption", "text": "В зоне возмущения давление считается установившимся.", "quote": "в этой области считается установившимся", "unit": "u495-08", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c8", "kind": "inference", "text": "Давление описывается линейной зависимостью.", "quote": "описывается линейной зависимостью", "unit": "u495-08", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c9", "kind": "inference", "text": "Цель метода — найти закон перемещения границы l(t).", "quote": "Требуется найти закон перемещения во времени внешней границы возмущенной области l(t)", "unit": "u495-10", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c10", "kind": "assumption", "text": "Количество добытой продукции равно изменению упругого запаса.", "quote": "количество добытой продукции за время dt равно изменению упругого запаса жидкости", "unit": "u495-11", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c11", "kind": "assumption", "text": "Объем зоны равен произведению толщины, ширины и длины фронта.", "quote": "V(t) = Bh l(t)", "unit": "u495-14", "page": 495, "by": "model", "verified": false}, {"id": "psss-linear-flow.c12", "kind": "inference", "text": "Среднее давление в зоне — среднее арифметическое граничных.", "quote": "$$\\Delta p = p_к - \\bar{p} = p_к - \\frac{p_к + p_г}{2} = \\frac{p_к - p_г}{2}. \\quad (24.4)$$", "unit": "u495-15", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c13", "kind": "inference", "text": "Разность давлений равна половине разницы начального и забойного.", "quote": "$$\\Delta p = p_к - \\bar{p} = p_к - \\frac{p_к + p_г}{2} = \\frac{p_к - p_г}{2}. \\quad (24.4)$$", "unit": "u495-15", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c14", "kind": "inference", "text": "Дебит выражается через закон Дарси.", "quote": "Q = \\frac{k}{\\mu} \\frac{p_{\\mathrm{k}} - p_{\\mathrm{r}}}{l(t)} Bh", "unit": "u496-04", "page": 496, "by": "model", "verified": false}, {"id": "psss-linear-flow.c15", "kind": "inference", "text": "Разность давлений выражается через дебит и длину фронта.", "quote": "$$\\frac{Q \\mu l(t)}{2kBh} = \\frac{p_{\\mathrm{k}} - p_{\\mathrm{r}}}{2}. \\quad (24.5.)$$", "unit": "u496-06", "page": 496, "by": "model", "verified": true}, {"id": "psss-linear-flow.c16", "kind": "inference", "text": "Выражения подставляются в баланс упругого запаса.", "quote": "Подставив равенства... в соотношение (24.2), получим", "unit": "u496-07", "page": 496, "by": "model", "verified": true}, {"id": "psss-linear-flow.c17", "kind": "inference", "text": "Уравнение интегрируется для нахождения l(t).", "quote": "Проинтегрируем полученное соотношение и найдем", "unit": "u496-13", "page": 496, "by": "model", "verified": true}, {"id": "psss-linear-flow.c18", "kind": "inference", "text": "Результат подставляется в формулу давления.", "quote": "Следовательно, формула для распределения давления... будет иметь вид", "unit": "u496-15", "page": 496, "by": "model", "verified": true}, {"id": "psss-linear-flow.c19", "kind": "assumption", "text": "В первом случае поддерживается постоянный дебит Q.", "quote": "на которой поддерживается постоянный дебит Q", "unit": "u495-06", "page": 495, "by": "model", "verified": true}, {"id": "psss-linear-flow.c20", "kind": "inference", "text": "Для постоянного дебита l(t) = \\sqrt{2\\kappa t}.", "quote": "l(t) = \\sqrt{2\\kappa t}", "unit": "u496-14", "page": 496, "by": "model", "verified": false}, {"id": "psss-linear-flow.c21", "kind": "assumption", "text": "Во втором случае галерея пущена при t=0.", "quote": "в момент времени t = 0 пущена эксплуатационная галерея", "unit": "u496-19", "page": 496, "by": "model", "verified": true}, {"id": "psss-linear-flow.c22", "kind": "assumption", "text": "Во втором случае поддерживается постоянное давление p_g.", "quote": "поддерживается постоянное забойное давление p_{\\mathrm{r}} = const", "unit": "u496-19", "page": 496, "by": "model", "verified": true}, {"id": "psss-linear-flow.c23", "kind": "inference", "text": "Дебит во втором случае зависит от времени.", "quote": "$$Q(t) = \\frac{k(p_{\\mathrm{k}} - p_{\\mathrm{r}})}{\\mu l(t)} Bh = \\frac{k}{\\mu} Bh \\left. \\frac{\\partial p}{\\partial x} \\right|_{x=0}.$$", "unit": "u496-21", "page": 496, "by": "model", "verified": true}, {"id": "psss-linear-flow.c24", "kind": "inference", "text": "Баланс запаса интегрируется для второго случая.", "quote": "Проведя арифметические преобразования... и выполнив интегрирование", "unit": "u497-09", "page": 497, "by": "model", "verified": true}, {"id": "psss-linear-flow.c25", "kind": "inference", "text": "Для постоянного давления l(t) = 2\\sqrt{\\kappa t}.", "quote": "l(t) = 2\\sqrt{\\kappa t}", "unit": "u497-10", "page": 497, "by": "model", "verified": false}, {"id": "psss-linear-flow.c26", "kind": "inference", "text": "За пределами фронта давление равно p_k.", "quote": "p(x, t) = p_{\\mathrm{k}}, \\quad x > \\sqrt{2\\kappa t}", "unit": "u496-17", "page": 496, "by": "model", "verified": false}, {"id": "psss-linear-flow.c27", "kind": "inference", "text": "Точные расчеты требуют других формул.", "quote": "отличаются от данных расчета по точной формуле", "u re-front-dynamics.q1", "node_id": "basniev.pressure-front-dynamics", "type": "order", "claim_id": "pressure-front-dynamics.c10", "question": "Расставьте по порядку этапы определения физического радиуса фронта давления R(t) на основе графика:", "items": ["Зафиксировать постоянство забойного давления p_c", "Определить безразмерное время t·fo", "По графику найти соответствующее значение R(t)/r_c", "Умножить на r_c для получения физического радиуса"], "explanation": "Сначала фиксируются условия (постоянное давление), затем вычисляется безразмерное время, по нему с графика снимается безразмерный радиус, который переводится в физический."}, {"id": "basniev.pressure-front-dynamics.q2", "node_id": "basniev.pressure-front-dynamics", "type": "multi", "claim_id": "pressure-front-dynamics.c12", "question": "Какие утверждения верно описывают динамику продвижения фронта давления согласно тексту?", "options": ["Радиус фронта растет со временем", "Скорость продвижения фронта увеличивается со временем", "Форма кривой имеет выпуклость вверх, что означает замедление роста", "За фронтом находится область с измененным давлением"], "answer": [0, 2], "explanation": "Текст указывает, что радиус растет, но скорость замедляется (выпуклость вверх), а за фронтом давление исходное (невозмущенная область)."}], "cards": [{"id": "basniev.elastic-drive-mechanics.card", "node_id": "basniev.elastic-drive-mechanics", "front": "Какова основная форма энергии, обеспечивающая приток жидкости к скважине в упругом режиме?", "back": "Энергия упругой деформации жидкостей и твердого скелета пласта."}, {"id": "basniev.elastic-reserve-estimation.card", "node_id": "basniev.elastic-reserve-estimation", "front": "Определение и расчёт упругого запаса жидкости", "back": "Упругий запас жидкости — это объем, извлекаемый из пласта при снижении давления за счет сжатия породы и жидкости."}, {"id": "basniev.reservoir-depletion-equation.card", "node_id": "basniev.reservoir-depletion-equation", "front": "Уравнение истощения  "basniev.solving-ode-and-erf.card", "node_id": "basniev.solving-ode-and-erf", "front": "Как называется функция, через которую выражается закон распределения давления в пласте, и каков диапазон её значений?", "back": "Интеграл вероятности (функция ошибки), изменяется от 0 до 1."}, {"id": "basniev.pressure-distribution-curve.card", "node_id": "basniev.pressure-distribution-curve", "front": "Как меняется кривая распределения давления в пласте со временем при постоянном забойном давлении?", "back": "Кривая становится более пологой, а давление медленнее приближается к граничному значению."}, {"id": "basniev.well-flow-rate-decay.card", "node_id": "basniev.well-flow-rate-decay", "front": "Дебит галереи и закон его убывания", "back": "Дебит галереи при прямолинейном потоке упругой жидкости убывает со временем как 1/корень из t."}, {"id": "basniev.cumulative-production-growth.card", "node_id": "basniev.cumulative-production-growth", "front": "Как зависит накопленная добыча от времени в упругом режиме?", "back": "Пропорционально квадратному корню из времени (sqrt(t))."}, {"id": "basniev.constant-rate-boundary-condition.card", "node_id": "basniev.constant-rate-boundary-condition", "front": "Каковы основные граничные условия для задачи о притоке упругой жидкости к галерее с постоянным дебитом в полубесконечном пласте?", "back": "1) На галерее (x=0) дебит постоянен (Q=const). 2) На бесконечности (x→∞) давление равно контурному (p=pк). 3) В начальный момент (t=0) давление везде равно контурному."}, {"id": "basniev.velocity-equation-analogy.card", "node_id": "basniev.velocity-equation-analogy", "front": "Уравнение для скорости фильтрации", "back": "Скорость фильтрации подчиняется уравнению, тождественному по форме уравнению теплопроводности."}, {"id": "basniev.linear-flow-pressure-distribution.card", "node_id": "basniev.linear-flow-pressure-distribution", "front": "Распределение давления при линейном потоке", "back": "Распределение давления при линейном потоке упругой жидкости описывается формулой (23.38), связывающей давление в точке с расстоянием и временем."}, {"id": "basniev.linear-flow-well-pressure-limit.card", "node_id": "basniev.linear-flow-well-pressure-limit", "front": "Почему аналитическое решение для давления на галерее (зависящее от корня из времени) нельзя использовать для прогнозирования на больших временах?", "back": "Потому что при больших временах модель предсказывает отрицательное давление, что физически невозможно (в реальности произойдет кавитация)."}, {"id": "basniev.radial-flow-formulation.card", "node_id": "basniev.radial-flow-formulation", "front": "Постановка задачи радиального потока", "back": "Задача описывает неустановившийся радиальный поток упругой жидкости в неограниченном пласте при постоянном дебите скважины."}, {"id": "basniev.radial-flow-dimensionless.card", "node_id": "basniev.radial-flow-dimensionless", "front": "Безразмерные параметры и автомодельность", "back": "Распределение давления в пласте зависит от пяти параметров, но из-за размерности сводится к функции двух безразмерных величин."}, {"id": "basniev.radial-flow-integration.card", "node_id": "basniev.radial-flow-integration", "front": "Как определяется константа интегрирования C1 в решении ОДУ для радиального потока?", "back": "Умножением уравнения давления на радиус и устремлением радиуса к нулю."}, {"id": "basniev.exponential-integral-function.card", "node_id": "basniev.exponential-integral-function", "front": "Какие два ключевых условия необходимы для применения формулы (23.52) к расчету давления в пласте?", "back": "Упругий режим фильтрации и плоскорадиальный поток."}, {"id": "basniev.pressure-formula-approximation.card", "node_id": "basniev.pressure-formula-approximation", "front": "Какое приближение используется для интегральной показательной функции при малых значениях аргумента x и какая константа в него входит?", "back": "Логарифмическое приближение: -Ei(-x) ≈ ln(1/x) - 0,5772, где 0,5772 — постоянная Эйлера."}, {"id": "basniev.psss-method-concept.card", "node_id": "basniev.psss-method-concept", "front": "В чем состоит основная идея метода последовательной смены стационарных состояний (ПССС)?", "back": "Неустановившийся процесс заменяется последовательностью стационарных задач (уравнение Лапласа), где граница возмущенной области движется согласно уравнению материального баланса."}, {"id": "basniev.psss-linear-flow.card", "node_id": "basniev.psss-linear-flow", "front": "Какова погрешность метода ПССС при постоянном дебите и при постоянном давлении?", "back": "При постоянном дебите — 25%, при постоянном давлении — 11%."}, {"id": "basniev.psss-radial-flow.card", "node_id": "basniev.psss-radial-flow", "front": "Применение метода ПССС к радиальному потоку", "back": "Метод ПССС аппроксимирует нестационарный радиальный поток как последовательность стационарных состояний с растущим радиусом возмущения."}, {"id": "basniev.pscc-method-accuracy.card", "node_id": "basniev.pscc-method-accuracy", "front": "Насколько точно метод ПССС определяет распределение давления и связь дебита с депрессией?", "back": "Распределение давления получается грубым приближением, а связь дебита и депрессии — гораздо точнее (особенно при радиальной фильтрации)."}, {"id": "basniev.pressure-front-dynamics.card", "node_id": "basniev.pressure-front-dynamics", "front": "Как меняется скорость продвижения фронта давления со временем?", "back": "Скорость продвижения замедляется, хотя радиус фронта продолжает расти."}], "glossary": [{"id": "t-elastic-drive", "term": "Упругий режим", "en": "Elastic drive", "definition": "Режим добычи за счет энергии упругой деформации пласта и жидкости.", "node_id": "basniev.elastic-drive-mechanics", "page": 474}, {"id": "t-saturation-pressure", "term": "Давление насыщения", "en": "Saturation pressure", "definition": "Давление, при котором жидкость начинает выделять газ.", "node_id": "basniev.elastic-drive-mechanics", "page": 474}, {"id": "t-permeability", "term": "Коэффициент проницаемости", "en": "Permeabili

казано"}, {"sym": "x", "meaning": "координата", "unit": "не указано"}, {"sym": "\\kappa", "meaning": "коэффициент пьезопроводности", "unit": "не указано"}]}, {"latex": "p(x, t) = p_\\kappa \\quad \\text{при} \\quad t = 0", "page": 482, "vars": [{"sym": "p_\\kappa", "meaning": "начальное пластовое давление", "unit": "не указано"}]}, {"latex": "p(x, t) = p_\\tau \\quad \\text{при} \\quad x = 0, \\quad t > 0", "page": 482, "vars": [{"sym": "p_\\tau", "meaning": "давление на галерее", "unit": "не указано"}]}, {"latex": "p(x, t) = p_\\kappa \\quad \\text{при} \\quad x = \\infty, \\quad t \\geq 0", "page": 482, "vars": [{"sym": "p_\\kappa", "meaning": "начальное пластовое давление", "unit": "не указано"}]}], "tables": [], "misconception": {"wrong": "Давление в пласте расходится с постоянной скоростью, как звук.", "right": [{"text": "Давление распространяется согласно уравнению пьезопроводности, которое описывает диффузионный процесс, а не волновой.", "claims": [], "page": 481, "by": "model"}]}, "data_meaning": {"input": "Начальное давление p_к, давление на галерее p_т, координата x, время t, коэффициент пьезопроводности κ.", "output": "Функция давления p(x,t) в любой точке и момент времени, дебит галереи Q(t).", "breaks": [{"text": "Модель применима только для одномерного прямолинейно-параллельного потока в полубесконечном пласте.", "claims": [], "page": 481, "by": "model"}], "hypotheses": [{"text": "Гипотеза: В реальных данных это выглядит как временной ряд давления на скважине, где начальное значение фиксировано, а граничное условие задается технологическим режимом.", "claims": [], "page": 481, "by": "model"}]}, "analogy": {"text": "Задача аналогична решению уравнения теплопроводности для полубесконечного стержня, где температура на одном конце резко меняется и поддерживается постоянной, а на другом остается неизменной.", "breaks_where": "Аналогия работает для линейных диффузионных процессов, но не учитывает нелинейные эффекты реальных пластов, если они присутствуют."}, "now_practice": [], "layers": {"mechanism": [{"text": "Процесс описывается уравнением пьезопроводности, связывающим изменение давления во времени с его пространственной кривизной.", "claims": [], "page": 481, "by": "model"}], "practice": [{"text": "Для решения задачи необходимо задать начальные и граничные условия, которые описывают физическую ситуацию с галереей.", "claims": [], "page": 481, "by": "model"}], "nuances": [{"text": "Задача является автомодельной, что упрощает поиск решения через безразмерные параметры.", "claims": [], "page": 481, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "basniev.1d-gallery-flow-problem.ill1", "class": "B", "src": "media/basniev.1d-gallery-flow-problem-steps.svg", "alt": "Порядок действий по тексту автора: Постановка задачи о притоке упругой жидкости к галерее", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "basniev.1d-gallery-flow-problem.ill2", "class": "B", "src": "media/basniev.1d-gallery-flow-problem-pressure.svg", "alt": "Расчёт: как понижение давления расходится по пласту: Постановка задачи о притоке упругой жидкости к галерее", "caption": "Расчёт: как понижение давления расходится по пласту", "provenance": "симуляция", "redrawn_from": null, "source_url": null}], "links": [{"to": "basniev.piezoconductivity-derivation", "type": "prerequisite"}], "claims": [], "term_ids": [], "units": ["u481-09", "u481-11", "u481-12", "u481-13", "u482-03", "u482-04", "u482-05", "u482-06", "u482-07", "u482-08"], "video_criteria": ["cause_effect", "time_change"], "fallback": false}, {"id": "basniev.dimensionless-variables-and-autosimilarity", "order": 8, "part_id": "p6", "minutes": 4, "title": "Безразмерные переменные и автомодельность", "book_title": "Нефтегазовая гидромеханика", "pages": [482, 482], "difficulty": {"primary": "Ф", "secondary": "И"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: контринтуитивность, цепочка «причина → следствие»", "scene_template": "parametric-plot"}, "summary": [{"text": "Безразмерные переменные позволяют упростить задачу, объединяя координату, время и свойства пласта в один параметр.", "claims": [], "page": 482, "by": "model"}, {"text": "Введение автомодельной переменной $u$ сводит зависимость давления от трёх величин к зависимости от одной.", "claims": [], "page": 482, "by": "model"}], "how_it_works": [{"text": "Безразмерное давление $P$ определяется как отношение изменения давления к разности давлений на границах.", "claims": [], "page": 482, "by": "model"}, {"text": "Изначально $P$ зависит от координаты $x$, времени $t$ и коэффициента пьезопроводности $\\kappa$.", "claims": [], "page": 482, "by": "model"}, {"text": "Анализ размерностей показывает, что из $x$, $t$ и $\\kappa$ можно составить безразмерный комплекс $x/\\sqrt{\\kappa t}$.", "claims": [], "page": 482, "by": "model"}, {"text": "Вводится новая переменная $u = x/(2\\sqrt{\\kappa t})$, называемая автомодельной переменной.", "claims": [], "page": 482, "by": "model"}, {"text": "После замены переменных давление $P$ зависит только от $u$, то есть $P = f(u)$.", "claims": [], "page": 482, "by": "model"}, {"text": "Граничные условия переписываются через новую переменную: $P=0$ при $u=0$ и $P=1$ при $u=\\infty$.", "claims": [], "page": 482, "by": "model"}], "steps": [{"text": "Определяется безразмерное давление $P$ через физические давления.", "claims": [], "page": 482, "by": "model"}, {"text": "Устанавливается исходная зависимость $P$ от $x, t, \\kappa$.", "claims": [], "page": 482, "by": "model"}, {"text": "Анализируются размерности аргументов для поиска безразмерного комплекса.", "claims": [], "page": 482, "by": "model"}, {"text": "Вводится автомодельная переменная $u$ на основе найденного комплекса.", "claims": [], "page": 482, "by": "model"}, {"text": "Задача сводится к поиску функции $P(u)$.", "claims": [], "page": 482, "by": "model"}, {"text": "Формулируются граничные условия в новых переменных.", "claims": [], "page": 482, "by": "model"}], "examples": [], "numbers": [{"text": "Коэффициент 2 используется в определении автомодельной переменной $u$.", "claims": [], "page": 482, "by": "model"}], "formulas": [{"latex": "P = f(x, t, \\kappa)", "page": 482, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "x", "meaning": "координата", "unit": "L"}, {"sym": "t", "meaning": "время", "unit": "T"}, {"sym": "\\kappa", "meaning": "коэффициент пьезопроводности", "unit": "L^2 T^{-1}"}]}, {"latex": "u = \\frac{x}{2\\sqrt{\\kappa t}}", "page": 482, "vars": [{"sym": "u", "meaning": "автомодельная переменная", "unit": "-"}, {"sym": "x", "meaning": "координата", "unit": "L"}, {"sym": "\\kappa", "meaning": "коэффициент пьезопроводности", "unit": "L^2 T^{-1}"}, {"sym": "t", "meaning": "время", "unit": "T"}]}, {"latex": "P = 0 \\quad \\text{при} \\quad u = 0", "page": 482, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "u", "meaning": "автомодельная переменная", "unit": "-"}]}, {"latex": "P = 1 \\quad \\text{при} \\quad u = \\infty", "page": 482, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "u", "meaning": "автомодельная переменная", "unit": "-"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Координата $x$, время $t$, коэффициент пьезопроводности $\\kappa$.", "output": "Безразмерное давление $P$, выраженное как функция от одной переменной $u$.", "breaks": [{"text": "Метод применим только при наличии автомодельной структуры, то есть когда решение зависит от комбинации переменных, а не от них по отдельности.", "claims": [], "page": 482, "by": "model"}], "hypotheses": []}, "analogy": {"text": "Похоже на нормализацию признаков в машинном обучении: вместо работы с тремя переменными (x, t, kappa) работаем с одной нормализованной фичей u, что упрощает модель.", "breaks_where": "В ИТ нормализация часто линейна, здесь же используется нелинейная комбинация (корень из произведения), обусловленная физикой диффузии."}, "now_practice": [], "layers": {"mechanism": [{"text": "Физический процесс описывается уравнением, где давление зависит от пространства и времени через параметр пьезопроводности.", "claims": [], "page": 482, "by": "model"}], "practice": [{"text": "Инженеры используют безразмерные переменные для построения универсальных графиков и таблиц, не зависящих от конкретных размеров скважины.", "claims": [], "page": 482, "by": "model"}], "nuances": [{"text": "Коэффициент 2 в знаменателе $u$ выбран для удобства записи граничных условий и соответствия стандартным решениям диффузионных уравнений.", "claims": [], "page": 482, "by": "model"}], "deeper": [{"text": "Автомодельность означает, что форма профиля давления не меняется со временем, если смотреть в масштабе, растянутом пропорционально корню из времени.", "claims": [], "page": 482, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "basniev.dimensionless-variables-and-autosimilarity.ill1", "class": "B", "src": "media/basniev.dimensionless-variables-and-autosimilarity-steps.svg", "alt": "Порядок действий по тексту автора: Безразмерные переменные и автомодельность", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "basniev.dimensionless-variables-and-autosimilarity.ill2", "class": "B", "src": "media/basniev.dimensionless-variables-and-autosimilarity-pressure.svg", "alt": "Расчёт: как понижение давления расходится по пласту: Безразмерные переменные и автомодельность", "caption": "Расчёт: как понижение давления расходится по пласту", "provenance": "симуляция", "redrawn_from": null, "source_url": null}], "links": [], "claims": [], "term_ids": [], "units": ["u482-09", "u482-10", "u482-11", "u482-12", "u482-13"], "video_criteria": ["counterintuitive", "cause_effect"], "fallback": false}, {"id": "basniev.reduction-to-ode", "order": 9, "part_id": "p6", "minutes": 4, "title": "Сведение уравнения пьезопроводности к ОДУ", "book_title": "Нефтегазовая гидромеханика", "pages": [482, 483], "difficulty": {"primary": "Ф", "secondary": "И"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: контринтуитивность. Текст с формулами, так как процесс строго математический и требует точного следования шагам дифференцирования.", "scene_template": "parametric-plot"}, "summary": [{"text": "Линейность уравнения пьезопроводности позволяет использовать безразмерную переменную.", "claims": ["reduction-to-ode.c1"], "page": 482, "by": "model"}, {"text": "Подстановка производных по безразмерной переменной сводит уравнение в частных производных к обыкновенному.", "claims": ["reduction-to-ode.c2"], "page": 483, "by": "model"}], "how_it_works": [{"text": "Уравнение для безразмерного давления P идентично уравнению для размерного p из-за линейности.", "claims": ["reduction-to-ode.c1"], "page": 482, "by": "model"}, {"text": "Частные производные по координате x и времени t выражаются через производные по безразмерной переменной u.", "claims": [], "page": 482, "by": "model"}, {"text": "Первая производная по x содержит множитель 1/(2√(κt)).", "claims": [], "page": 482, "by": "model"}, {"text": "Первая производная по t содержит множитель -u/(2t).", "claims": [], "page": 482, "by": "model"}, {"text": "Вторая производная по x содержит множитель 1/(4κt).", "claims": [], "page": 482, "by": "model"}, {"text": "Подстановка этих выражений в исходное уравнение дает ОДУ второго порядка.", "claims": ["reduction-to-ode.c2"], "page": 483, "by": "model"}], "steps": [{"text": "Исходное уравнение: ∂P/∂t = κ ∂²P/∂x².", "claims": ["reduction-to-ode.c1"], "page": 482, "by": "model"}, {"text": "Выражаем ∂P/∂x через dP/du и ∂u/∂x.", "claims": [], "page": 482, "by": "model"}, {"text": "Выражаем ∂P/∂t через dP/du и ∂u/∂t.", "claims": [], "page": 482, "by": "model"}, {"text": "Выражаем ∂²P/∂x² через втору тегрирования равна двум, деленным на корень из пи.", "claims": ["solving-ode-and-erf.c10"], "page": 483, "by": "model"}], "formulas": [{"latex": "\\frac{d\\xi}{du} + 2u\\xi = 0. \\quad (23.24)", "page": 483, "vars": [{"sym": "xi", "meaning": "производная давления по безразмерной переменной", "unit": ""}, {"sym": "u", "meaning": "безразмерная переменная", "unit": ""}]}, {"latex": "\\xi = \\frac{dP}{du} = C_1 e^{-u^2}, \\quad (23.25)", "page": 483, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": ""}, {"sym": "C_1", "meaning": "постоянная интегрирования", "unit": ""}]}, {"latex": "P = \\frac{2}{\\sqrt{\\pi}} \\int_0^{\\frac{x}{2\\sqrt{\\pi}}} e^{-u^2} du. \\quad (23.26)", "page": 483, "vars": [{"sym": "x", "meaning": "расстояние", "unit": ""}]}, {"latex": "p = p_{\\mathrm{r}} + (p_{\\mathrm{k}} - p_{\\mathrm{r}}) \\operatorname{erf}\\left(\\frac{x}{2\\sqrt{\\kappa t}}\\right). \\quad (23.27)", "page": 484, "vars": [{"sym": "p", "meaning": "текущее давление", "unit": ""}, {"sym": "p_{\\mathrm{r}}", "meaning": "начальное пластовое давление", "unit": ""}, {"sym": "p_{\\mathrm{k}}", "meaning": "забойное давление", "unit": ""}, {"sym": "erf", "meaning": "интеграл вероятности (функция ошибки)", "unit": ""}, {"sym": "x", "meaning": "расстояние", "unit": ""}, {"sym": "kappa", "meaning": "коэффициент пьезопроводности", "unit": ""}, {"sym": "t", "meaning": "время", "unit": ""}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Координата x, время t, коэффициенты пласта (kappa), граничные давления (p_r, p_k).", "output": "Значение давления p в точке x в момент времени t.", "breaks": [{"text": "Формула применима только для прямолинейно-параллельного потока упругой жидкости.", "claims": ["solving-ode-and-erf.c1"], "page": 484, "by": "model"}], "hypotheses": [{"text": "Гипотеза: В ИТ-системах интеграл вероятности может быть реализован как lookup-таблица или аппроксимация для ускорения вычислений.", "claims": [], "page": 483, "by": "model"}]}, "analogy": {"text": "Интеграл вероятности работает как функция распределения вероятностей в статистике, показывая, какая доля 'воздействия' (давления) дошла до точки x.", "breaks_where": "В гидромеханике это физическое давление, а не вероятность события, и аргумент зависит от корня из времени, а не от дисперсии."}, "now_practice": [{"text": "Сегодня аналитические решения используются для калибровки моделей, но в промышленных ПО интерпретации давление рассчитывается численными методами для сложных геометрий.", "claims": [], "page": 483, "by": "model"}], "layers": {"mechanism": [{"text": "Распространение давления описывается дифференциальным уравнением, которое решается методом разделения переменных.", "claims": ["solving-ode-and-erf.c4", "solving-ode-and-erf.c5"], "page": 483, "by": "model"}], "practice": [{"text": "Результат выражается через табличную функцию, что упрощает расчеты без необходимости численного интегрирования на каждом шаге.", "claims": ["solving-ode-and-erf.c11"], "page": 483, "by": "model"}], "nuances": [{"text": "Аргумент функции ошибки содержит корень из произведения коэффициента пьезопроводности и времени.", "claims": ["solving-ode-and-erf.c12"], "page": 484, "by": "model"}], "deeper": [{"text": "Решение является автомодельным, так как давление зависит от комбинации координаты и времени, а не от них по отдельности.", "claims": ["solving-ode-and-erf.c1"], "page": 484, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "basniev.solving-ode-and-erf.ill1", "class": "B", "src": "media/basniev.solving-ode-and-erf-steps.svg", "alt": "Порядок действий по тексту автора: Решение ОДУ через интеграл вероятности", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "basniev.reduction-to-ode", "type": "prerequisite"}], "claims": [{"id": "solving-ode-and-erf.c1", "kind": "inference", "text": "Закон распределения давления описывается интегралом вероятности.", "quote": "Таким обр ng-ode-and-erf.c8", "kind": "observation", "text": "Постоянная интегрирования находится из условия на бесконечности.", "quote": "Вторым условием (23.20) воспользуемся для нахождения константы интегрирования $C_1$. Устремим переменный верхний предел $u$ в интеграле к бесконечности и получим", "unit": "u483-16", "page": 483, "by": "model", "verified": true}, {"id": "solving-ode-and-erf.c9", "kind": "observation", "text": "Интеграл от exp(-u^2) от 0 до inf равен sqrt(pi)/2.", "quote": "Из интегрального исчисления известно, что $\\int_0^\\infty e^{-u^2} du = \\sqrt{\\pi}/2$, поэтому предыдущее соотношение дает", "unit": "u483-18", "page": 483, "by": "model", "verified": true}, {"id": "solving-ode-and-erf.c10", "kind": "inference", "text": "Постоянная C1 равна 2/sqrt(pi).", "quote": "поэтому предыдущее соотношение дает $C_1 = 2/\\sqrt{\\pi}$, и окончательно получим", "unit": "u483-18", "page": 483, "by": "model", "verified": true}, {"id": "solving-ode-and-erf.c11", "kind": "observation", "text": "Интеграл вероятности табулирован и меняется от 0 до 1.", "quote": "Интеграл (23.26) называется интегралом вероятности, является табулированной функцией, изменяющейся в пределах от 0 до 1", "unit": "u483-20", "page": 483, "by": "model", "verified": true}, {"id": "solving-ode-and-erf.c12", "kind": "inference", "text": "Финальная формула давления использует функцию ошибки.", "quote": "$$p = p_{\\mathrm{r}} + (p_{\\mathrm{k}} - p_{\\mathrm{r}}) \\operatorname{erf}\\left(\\frac{x}{2\\sqrt{\\kappa t}}\\right). \\quad (23.27)$$", "unit": "u484-05", "page": 484, "by": "model", "verified": true}], "term_ids": ["t-error-function-erf", "t-elastic-fluid"], "units": ["u483-05", "u483-06", "u483-07", "u483-08", "u483-09", "u483-10", "u483-11", "u483-12", "u483-13", "u483-14", "u483-15", "u483-16", "u483-17", "u483-18", "u483-19", "u483-20", "u484-01", "u484-02", "u484-03", "u484-04", "u484-05"], "video_criteria": ["counterintuitive"], "fallback": false}, {"id": "basniev.pressure-distribution-  "claims": [], "page": 486, "by": "model"}], "examples": [], "numbers": [{"text": "В формулах используются константы 2, sqrt(pi) и переменные k, mu, w1, x, t, kappa.", "claims": [], "page": 486, "by": "model"}], "formulas": [{"latex": "w(x, t) = w_1 \\left[ 1 - \\operatorname{erf} \\left( \\frac{x}{2\\sqrt{\\kappa t}} \\right) \\right] = \\frac{k}{\\mu} \\frac{\\partial p}{\\partial x}", "page": 486, "vars": [{"sym": "w(x, t)", "meaning": "скорость фильтрации", "unit": "м/с"}, {"sym": "w_1", "meaning": "скорость на границе", "unit": "м/с"}, {"sym": "erf", "meaning": "функция ошибок", "unit": "-"}, {"sym": "x", "meaning": "координата", "unit": "м"}, {"sym": "kappa", "meaning": "коэффициент пьезопроводности", "unit": "м^2/с"}, {"sym": "t", "meaning": "время", "unit": "с"}, {"sym": "k", "meaning": "проницаемость", "unit": "м^2"}, {"sym": "mu", "meaning": "вязкость", "unit": "Па·с"}, {"sym": "p", "meaning": "давление", "unit": "Па"}]}, {"latex": "p(x, t) = p_\\text{r} + \\frac{\\mu w_1}{k} \\left[ x \\left( 1 - \\text{erf} \\left( \\frac{x}{2\\sqrt{\\kappa t}} \\right) \\right) + \\frac{2\\sqrt{\\kappa t}}{\\sqrt{\\pi}} \\left( 1 - e^{-x^2/4\\kappa t} \\right) \\right]", "page": 487, "vars": [{"sym": "p(x, t)", "meaning": "давление в точке x в момент t", "unit": "Па"}, {"sym": "p_\\text{r}", "meaning": "давление на галерее", "unit": "Па"}, {"sym": "mu", "meaning": "вязкость", "unit": "Па·с"}, {"sym": "w_1", "meaning": "скорость на границе", "unit": "м/с"}, {"sym": "k", "meaning": "проницаемость", "unit": "м^2"}, {"sym": "x", "meaning": "координата", "unit": "м"}, {"sym": "kappa", "meaning": "коэффициент пьезопроводности", "unit": "м^2/с"}, {"sym": "t", "meaning": "время", "unit": "с"}]}], "tables": [], "misconception": {"wrong": "Давление в пласте расходится с постоянной скоростью, как звук.", "right": [{"text": "Распределение давления описывается нелинейной зависимостью от расстояния и времени через функцию ошибок и экспоненту.", "claims": [], "page": 486, "by": "model"}]}, "data_meaning": {"input": "Координата x, время t, параметры пласта (k, mu, kappa), давление на галерее p_r.", "output": "Значение давления p(x, t) в заданной точке.", "breaks": [{"text": "Модель применима для прямолинейно-параллельного потока упругой жидкости.", "claims": [], "page": 486, "by": "model"}], "hypotheses": []}, "analogy": {"text": "Процесс интегрирования градиента давления аналогичен восстановлению сигнала из его производной в обработке данных.", "breaks_where": "Геологическая модель учитывает физические свойства среды (вязкость, проницаемость), которые не имеют прямых аналогов в стандартных ИТ-алгоритмах."}, "now_practice": [], "layers": {"mechanism": [{"text": "Связь между скоростью фильтрации и градиентом давления задается законом Дарси.", "claims": [], "page": 486, "by": "model"}], "practice": [{"text": "Формула (23.38) позволяет рассчитать давление в любой точке потока, зная давление на галерее.", "claims": [], "page": 486, "by": "model"}], "nuances": [{"text": "Интегрирование по частям необходимо для упрощения двойного интеграла.", "claims": [], "page": 486, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "basniev.linear-flow-pressure-distribution.ill1", "class": "B", "src": "media/basniev.linear-flow-pressure-distribution-steps.svg", "alt": "Порядок действий по тексту автора: Распределение давления при линейном потоке", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [], "term_ids": [], "units": ["u486-21", "u486-22", "u486-23", "u487-03", "u487-04", "u487-05", "u487-06", "u487-07", "u487-08", "u487-09", "u487-10", "u487-11", "u487-12"], "video_criteria": ["time_change", "counterintuitive"], "fallback": false}, {"id": "basniev.linear-flow-well-pressure-limit", "order": 17, "part_id": "p6", "minutes": 3, "title": "Закон падения давления на галерее", "book_title": "Нефтегазовая гидромеханика", "pages": [487, 488], "difficulty": я t, при которых p_r(t) \u003c 0.", "unit": "u488-06", "page": 488, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c4", "kind": "observation", "text": "Вывод основан на уравнении пьезопроводности.", "quote": "Чтобы найти закон изменения давления на галерее p_r(t), подставим в (23.38) граничное условие", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c5", "kind": "observation", "text": "Используется функция ошибки.", "quote": "Так как при $x \\to \\infty$ $\\text{erf} \\left( \\frac{x}{2\\sqrt{\\kappa t}} \\right) \\to 1$", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c6", "kind": "assumption", "text": "Скорость фильтрации постоянна.", "quote": "принятое граничное условие – задание w(0, t) = const = w_1", "unit": "u488-06", "page": 488, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c7", "kind": "assumption", "text": "На бесконечности давление постоянно.", "quote": "подставим в (23.38) граничное условие $p(x, t) = p_\\text{K}$ при $x \\to \\infty$", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c8", "kind": "inference", "text": "Возникает неопределенность.", "quote": "то произведение $x \\left( 1 - \\text{erf} \\left( \\frac{x}{2\\sqrt{\\kappa t}} \\right) \\right)$ дает неопределенность вида $\\infty \\times 0$", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c9", "kind": "inference", "text": "Применяется правило Лопиталя.", "quote": "Раскрывая ее по правилу Лопиталя, можно показать", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c10", "kind": "inference", "text": "Предел произведения равен нулю.", "quote": "это произведение стремится к нулю.", "unit": "u488-02", "page": 488, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c11", "kind": "inference", "text": "Экспонента стремится к нулю.", "quote": "учитывая также, что e^(-x^2/4kt) -> 0 при x -> inf", "unit": "u488-02", "page": 488, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c12", "kind": "inference", "text": "Получена формула с корнем.", "quote": "$$p_{\\mathrm{r}}(t) = p_{\\mathrm{k}} - \\frac{2\\mu w_1}{k\\sqrt{\\pi}} \\sqrt{kt}$$", "unit": "u488-03", "page": 488, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c13", "kind": "inference", "text": "Подстановка условия дает решение.", "quote": "подставим в (23.38) граничное условие", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c14", "kind": "inference", "text": "Анализ функции ошибки.", "quote": "при x -> inf erf(...) -> 1", "unit": "u487-13", "page": 487, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c15", "kind": "inference", "text": "Раскрытие неопределенности.", "quote": "Раскрывая ее по правилу Лопиталя", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c16", "kind": "inference", "text": "Получение выражения.", "quote": "Раскрывая ее по правилу Лопиталя, можно показать, что", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c17", "kind": "observation", "text": "В формуле есть 2 и корень из Пи.", "quote": "frac{2\\mu w_1}{k\\sqrt{\\pi}}", "unit": "u488-03", "page": 488, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c18", "kind": "observation", "text": "Зависимость от корня из времени.", "quote": "sqrt{kt}", "unit": "u488-03", "page": 488, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c19", "kind": "inference", "text": "Результат бессмыслен при больших t.", "quote": "решение (23.39) при очень больших значениях времени теряет физический смысл", "unit": "u488-06", "page": 488, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c20", "kind": "inference", "text": "Реальная физика предотвращает отрицательное давление.", "quote": "Реально эти давления возникать не будут – возникнет кавитация", "unit": "u488-06", "page": 488, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c21", "kind": "inference", "text": "Модель ломается при отрицательном давлении.", "quote": "p_r(t) \u003c 0", "unit": "u488-06", "page": 488, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c22", "kind": "inference", "text": "Условие нарушается при больших временах.", "quote": "при очень больших значениях времени", "unit": "u488-06", "page": 488, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c23", "kind": "assumption", "text": "Решения используются для калибровки.", "quote": "", "unit": "", "page": 487, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c24", "kind": "assumption", "text": "Формула применяется на ранних этапах.", "quote": "", "unit": "", "page": 487, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c25", "kind": "observation", "text": "Поток одномерный.", "quote": "Прямолинейно-параллельный фильтрационный поток", "unit": "u487-13", "page": 487, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c26", "kind": "observation", "text": "Давление идет от контура.", "quote": "граничное условие $p(x, t) = p_\\text{K}$ при $x \\to \\infty$", "unit": "u487-13", "page": 487, "by": "model", "verified": true}, {"id": "linear-flow-well-pressure-limit.c27", "kind": "assumption", "text": "Можно оценить проницаемость.", "quote": "", "unit": "", "page": 487, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c28", "kind": "observation", "text": "Задан постоянный дебит.", "quote": "w(0, t) = const = w_1", "unit": "u488-06", "page": 488, "by": "model", "verified": false}, {"id": "linear-flow-well-pressure-limit.c29", "kind": "inference", "text": "Решение автомодельное.", "quote": "", "unit": "", "page": 487, "by": "model", "verified": false}], "term_ids": ["t-error-function"], "units": ["u487-13", "u488-01", "u488-02", "u488-03", "u488-04", "u488-05", "u488-06"], "video_criteria": ["counterintuitive", "cause_effect"], "fallback": false}, {"id": "basniev.radial-flow-formulation", "order": 18, "part_id": "p7", "minutes": 4, "title": "Постановка задачи радиального потока", "book_title": "Нефтегазовая гидромеханика", "pages": [488, 489], "difficulty": {"primary": "Ф", "secondary": "П"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: скачок масштаба", "scene_template": "parametric-plot"}, "summary": [{"text": "Задача описывает неустановившийся радиальный поток упругой жидкости в неограниченном пласте при постоянном дебите скважины.", "claims": [], "page": 488, "by": "model"}, {"text": "Распределение давления p(r, t) определяется интегрированием уравнения пьезопроводности в цилиндрических координатах.", "claims": [], "page": 488, "by": "model"}, {"text": "Задача задается начальным условием (давление равно контурному) и граничными условиями (давление на бесконечности, постоянный дебит).", "claims": [], "page": 488, "by": "model"}], "how_it_works": [{"text": "Рассматривается неограниченный горизонтальный пласт постоянной толщины h.", "claims": [], "page": 488, "by": "model"}, {"text": "В пласте находится добывающая скважина «нулевого» радиуса, то есть точечный сток.", "claims": [], "page": 488, "by": "model"}, {"text": "Начальное пластовое давление во всем пласте одинаково и равно p_k.", "claims": [], "page": 488, "by": "model"}, {"text": "В момент времени t = 0 скважина пущена в эксплуатацию с постоянным объемным дебитом Q_0.", "claims": [], "page": 488, "by": "model"}, {"text": "В результате в пласте образуется неустановившийся плоскорадиальный поток упругой жидкости.", "claims": [], "page": 488, "by": "model"}, {"text": "Распределение давления p(r, t) в любой точке в любой момент времени определяется интегрированием уравнения (23.16).", "claims": [], "page": 488, "by": "model"}, {"text": "Для радиального течения в цилиндрической системе координат уравнение имеет вид (23.40).", "claims": [], "page": 488, "by": "model"}, {"text": "Начальное условие: при t = 0 давление p(r, t) равно p_k.", "claims": [], "page": 488, "by": "model"}, {"text": "Граничное условие на бесконечности: при t > 0 и r → ∞ давление p(r, t) равно p_k.", "claims": [], "page": 488, "by": "model"}, {"text": "Граничное условие у скважины: дебит Q поддерживается постоянным и равен Q_0 при t > 0.", "claims": [], "page": 488, "by": "model"}, {"text": "Первое условие означает, что до момента t = 0 давление во всем пласте было постоянным и равным контурному.", "claims": [], "page": 488, "by": "model"}, {"text": "Второе условие показывает, что граница возмущенной зоны перемещается с ростом времени.", "claims": [], "page": 488, "by": "model"}, {"text": "Для больших времен граница возмущенной зоны стремится к бесконечности.", "claims": [], "page": 488, "by": "model"}, {"text": "Из третьего условия следует, что дебит скважины поддерживается постоянным.", "claims": [], "page": 488, "by": "model"}, {"text": "Последнее условие (дебит) записывается в виде (23.42).", "claims": [], "page": 488, "by": "model"}], "steps": [{"text": "Определяется геометрия: неограниченный горизонтальный пласт, точечный сток.", "claims": [], "page": 488, "by": "model"}, {"text": "Задаются начальные параметры: давление p_k, момент запуска t=0, дебит Q_0.", "claims": [], "page": 488, "by": "model"}, {"text": "Формулируется уравнение пьезопроводности для радиального течения (23.40).", "claims": [], "page": 488, "by": "model"}, {"text": "Задаются начальные и граничные условия (23.41) и условие на дебит.", "claims": [], "page": 488, "by": "model"}, {"text": "Условие на дебит преобразуется в формулу (23.42).", "claims": [], "page": 488, "by": "model"}], "examples": [], "numbers": [{"text": "В тексте упоминаются переменные h, p_k, t, Q_0, r, p, k, μ.", "claims": [], "page": 488, "by": "model"}], "formulas": [{"latex": "\\frac{\\partial p}{\\partial t} = \\kappa \\left( \\frac{\\partial^2 p}{\\partial r^2} + \\frac{1}{r} \\frac{\\partial p}{\\partial r} \\right)", "page": 488, "vars": [{"sym": "p", "meaning": "давление", "unit": "не указано"}, {"sym": "t", "meaning": "время", "unit": "не указано"}, {"sym": "\\kappa", "meaning": "коэффициент пьезопроводности", "unit": "не указано"}, {"sym": "r", "meaning": "радиус", "unit": "не указано"}]}, {"latex": "p(r, t) = p_{\\mathrm{k}} \\quad \\text{при } t = 0", "page": 488, "vars": [{"sym": "p(r, t)", "meaning": "давление в точке r в момент t", "unit": "не указано"}, {"sym": "p_{\\mathrm{k}}", "meaning": "контурное давление", "unit": "не указано"}]}, {"latex": "p(r, t) = p_{\\mathrm{k}} \\quad \\text{при } t > 0 \\text{ и } r \\to \\infty", "page": 488, "vars": [{"sym": "p(r, t)", "meaning": "давление в точке r в момент t", "unit": "не указано"}, {"sym": "p_{\\mathrm{k}}", "meaning": "контурное давление", "unit": "не указано"}]}, {"latex": "Q = \\frac{2\\pi kh}{\\mu} \\left( r \\frac{\\partial p}{\\partial r} \\right)_{r=0} = Q_0 = \\text{const} \\quad \\text{при } t > 0", "page": 488, "vars": [{"sym": "Q", "meaning": "дебит", "unit": "не указано"}, {"sym": "k", "meaning": "проницаемость", "unit": "не указано"}]}], "tables": [], "misconception": null, "data_meaning": null, "analogy": null, "now_practice": [], "layers": {"mechanism": [], "practice": [], "nuances": [], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "basniev.radial-flow-formulation.ill1", "class": "B", "src": "media/basniev.radial-flow-formulation-steps.svg", "alt": "Порядок действий по тексту автора: Постановка задачи радиального потока", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "basniev.radial-flow-formulation.ill2", "class": "B", "src": "media/basniev.radial-flow-formulation-pressure.svg", "alt": "Расчёт: как понижение давления расходится по пласту: Постановка задачи радиального потока", "caption": "Расчёт: как понижение давления расходится по пласту", "provenance": "симуляция", "redrawn_from": null, "source_url": null}], "links": [], "claims": [], "term_ids": [], "units": ["u488-07", "u488-08", "u488-09", "u488-10", "u488-11", "u488-12", "u488-13", "u488-14", "u488-15", "u489-01", "u489-02", "u489-03", "u489-04"], "video_criteria": ["scale_jump"], "fallback": false}, {"id": "basniev.radial-flow-dimensionless", "order": 19, "part_id": "p7", "minutes": 3, "title": "Безразмерные параметры и автомодельность", "book_title": "Нефтегазовая гидромеханика", "pages": [489, 489], "difficulty": {"primary": "Ф", "secondary": "И"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: контринтуитивность", "scene_template": "parametric-plot"}, "summary": [{"text": "Распределение давления в пласте зависит от пяти параметров, но из-за размерности сводится к функции двух безразмерных величин.", "claims": [], "page": 489, "by": "model"}, {"text": "Это свойство называется автомодельностью: оно позволяет заменить уравнение с частными производными на обыкновенное дифференциальное уравнение.", "claims": [], "page": 489, "by": "model"}], "how_it_works": [{"text": "Искомое распределение давления зависит от пяти определяющих параметров: радиуса, времени, коэффициента пьезопроводности, начального давления и отношения дебита к проницаемости.", "claims": [], "page": 489, "by": "model"}, {"text": "Размерности этих параметров: длина, время, квадрат длины на время, давление и давление.", "claims": [], "page": 489, "by": "model"}, {"text": "Поскольку три параметра имеют независимые размерности, безразмерное давление зависит только от двух безразмерных комбинаций.", "claims": [], "page": 489, "by": "model"}, {"text": "Первая комбинация — автомодельная переменная, равная радиусу, деленному на корень из произведения коэффициента пьезопроводности и времени.", "claims": [], "page": 489, "by": "model"}, {"text": "Вторая комбинация — отношение дебита, умноженного на вязкость, к произведению проницаемости, толщины пласта и начального давления.", "claims": [], "page": 489, "by": "model"}, {"text": "Задача является автомодельной, что позволяет свести уравнение к обыкновенному дифференциальному уравнению.", "claims": [], "page": 489, "by": "model"}, {"text": "Частные производные по времени и радиусу выражаются через производные по автомодельной переменной.", "claims": [], "page": 489, "by": "model"}, {"text": "Подстановка этих выражений в исходное уравнение дает обыкновенное дифференциальное уравнение второго порядка.", "claims": [], "page": 489, "by": "model"}, {"text": "Уравнение интегрируется при граничных условиях: давление равно единице на бесконечности и производная в нуле равна безразмерному дебиту.", "claims": [], "page": 489, "by": "model"}], "steps": [{"text": "Определяем пять параметров, влияющих на давление: r, t, κ, pκ, Q0μ/(2πkh).", "claims": [], "page": 489, "by": "model"}, {"text": "Анализируем их размерности: L, T, L²T⁻¹, [p], [p].", "claims": [], "page": 489, "by": "model"}, {"text": "Выделяем три независимые размерности и формируем два безразмерных параметра.", "claims": [], "page": 489, "by": "model"}, {"text": "Записываем автомодельную переменную ξ = r/(2√κt).", "claims": [], "page": 489, "by": "model"}, {"text": "Находим выражения для частных производных через производные по ξ.", "claims": [], "page": 489, "by": "model"}, {"text": "Подставляем в уравнение пьезопроводности и получаем обыкновенное дифференциальное уравнение.", "claims": [], "page": 489, "by": "model"}, {"text": "Формулируем граничные условия для интегрирования.", "claims": [], "page": 489, "by": "model"}], "examples": [], "numbers": [{"text": "В формуле автомодельной переменной используется коэффициент 2 в знаменателе.", "claims": [], "page": 489, "by": "model"}, {"text": "В граничном условии на бесконечности безразмерное давление равно 1.", "claims": [], "page": 489, "by": "model"}], "formulas": [{"latex": "P = f \\left( \\xi, \\frac{Q_0 \\mu}{2\\pi k h p_\\kappa} \\right), \\quad \\xi = \\frac{r}{2\\sqrt{\\kappa t}}", "page": 489, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "\\xi", "meaning": "автомодельная переменная", "unit": "-"}, {"sym": "Q_0", "meaning": "дебит", "unit": "объем/время"}, {"sym": "\\mu", "meaning": "вязкость", "unit": "Па·с"}, {"sym": "k", "meaning": "проницаемость", "unit": "м²"}, {"sym": "h", "meaning": "толщина пласта", "unit": "м"}, {"sym": "p_\\kappa", "meaning": "начальное давление", "unit": "Па"}, {"sym": "r", "meaning": "радиус", "unit": "м"}, {"sym": "\\kappa", "meaning": "коэффициент пьезопроводности", "unit": "м²/с"}, {"sym": "t", "meaning": "время", "unit": "с"}]}, {"latex": "\\frac{d^2 P}{d\\xi^2} + \\left( \\frac{1}{\\xi} + 2\\xi \\right) \\frac{dP}{d\\xi} = 0", "page": 489, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "\\xi", "meaning": "автомодельная переменная", "unit": "-"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Параметры пласта (k, h, κ, pκ) и скважины (Q0, μ), координата r и время t.", "output": "Безразмерное давление P, зависящее от двух безразмерных групп.", "breaks": [{"text": "Модель ломается, если нарушена автомодельность, например, при наличии водонапора или неупругих деформаций.", "claims": [], "page": 489, "by": "model"}], "hypotheses": [{"text": "Гипотеза: в данных это выглядит как нормализация признаков, где r и t масштабируются через κ.", "claims": [], "page": 489, "by": "model"}]}, "analogy": {"text": "Аналогично тому, как в машинном обучении мы нормализуем данные, чтобы модель не зависела от масштаба входных признаков, здесь давление нормализуется, а координаты и время сводятся к одной переменной.", "breaks_where": "В ИТ нормализация часто линейна, здесь же связь нелинейна (корень из произведения), и результат — аналитическое решение дифференциального уравнения, а не просто масштабирование."}, "now_practice": [], "layers": {"mechanism": [], "practice": [], "nuances": [], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "basniev.radial-flow-dimensionless.ill1", "class": "B", "src": "media/basniev.radial-flow-dimensionless-steps.svg", "alt": "Порядок действий по тексту автора: Безразмерные параметры и автомодельность", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "basniev.radial-flow-dimensionless.ill2", "class": "B", "src": "media/basniev.radial-flow-dimensionless-pressure.svg", "alt": "Расчёт: как понижение давления расходится по пласту: Безразмерные параметры и автомодельность", "caption": "Расчёт: как понижение давления расходится по пласту", "provenance": "симуляция", "redrawn_from": null, "source_url": null}], "links": [{"to": "basniev.radial-flow-formulation", "type": "prerequisite"}], "claims": [], "term_ids": [], "units": ["u489-05", "u489-06", "u489-07", "u489-08", "u489-09", "u489-10", "u489-11", "u489-12", "u489-13", "u489-14", "u489-15"], "video_criteria": ["counterintuitive"], "fallback": false}, {"id": "basniev.radial-flow-integration", "order": 20, "part_id": "p7", "minutes": 7, "title": "Решение ОДУ для радиального потока", "book_title": "Нефтегазовая гидромеханика", "pages": [489, 490], "difficulty": {"primary": "Ф", "secondary": "И"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: изменение во времени. Текстовый формат с формулами необходим, так как узел содержит строго математический вывод. Визуализация процесса интегрирования затруднена без интерактивного графика, но основная ценность здесь — в структуре формул и связи параметров.", "scene_template": "parametric-plot"}, "summary": [{"text": "Решение ОДУ для радиального потока получено через замену переменной и интегрирование.", "claims": ["radial-flow-integration.c1"], "page": 489, "by": "model"}, {"text": "Безразмерное давление P зависит от интеграла экспоненты, деленного на радиус.", "claims": ["radial-flow-integration.c2"], "page": 489, "by": "model"}, {"text": "Постоянная интегрирования определяется через дебит, вязкость и проницаемость.", "claims": ["radial-flow-integration.c3"], "page": 490, "by": "model"}], "how_it_works": [{"text": "Вводится подстановка, где производная давления по безразмерному радиусу равна новой переменной v.", "claims": ["radial-flow-integration.c1"], "page": 489, "by": "model"}, {"text": "Исходное уравнение преобразуется к виду: производная v плюс произведение v на сумму обратного радиуса и удвоенного радиуса равна нулю.", "claims": ["radial-flow-integration.c2"], "page": 489, "by": "model"}, {"text": "Уравнение разделяется: дифференциал логарифма радиуса плюс дифференциал логарифма v равен минус удвоенному радиусу на дифференциал радиуса.", "claims": ["radial-flow-integration.c3"], "page": 490, "by": "model"}, {"text": "Проинтегрировав, получаем сумму логарифмов радиуса и v, равную минус квадрату радиуса плюс логарифм константы C1.", "claims": ["radial-flow-integration.c4"], "page": 490, "by": "model"}, {"text": "Потенцируя выражение, находим производную давления: константа C1 умножить на экспоненту от минус квадрата радиуса, деленную на радиус.", "claims": ["radial-flow-integration.c5"], "page": 490, "by": "model"}, {"text": "Производная интегрируется в пределах от радиуса до бесконечности, что дает давление как единицу минус интеграл от экспоненты на радиус.", "claims": ["radial-flow-integration.c6"], "page": 490, "by": "model"}, {"text": "Величина константы C1 находится путем умножения уравнения давления на радиус и устремления радиуса к нулю.", "claims": ["radial-flow-integration.c7"], "page": 490, "by": "model"}, {"text": "Константа C1 равна произведению дебита и вязкости, деленному на удвоенное пи, проницаемость и высоту пласта, умноженное на критическое давление.", "claims": ["radial-flow-integration.c8"], "page": 490, "by": "model"}], "steps": [{"text": "Заменить производную давления на новую переменную v для упрощения структуры уравнения.", "claims": ["radial-flow-integration.c1"], "page": 489, "by": "model"}, {"text": "Разделить переменные в полученном дифференциальном уравнении для v.", "claims": ["radial-flow-integration.c3"], "page": 490, "by": "model"}, {"text": "Выполнить интегрирование обеих частей уравнения.", "claims": ["radial-flow-integration.c4"], "page": 490, "by": "model"}, {"text": "Восстановить выражение для производной давления через экспоненциальную функцию.", "claims": ["radial-flow-integration.c5"], "page": 490, "by": "model"}, {"text": "Проинтегрировать выражение для производной по радиусу от текущего значения до бесконечности.", "claims": ["radial-flow-integration.c6"], "page": 490, "by": "model"}, {"text": "Определить константу интегрирования, используя граничное условие при стремлении радиуса к нулю.", "claims": ["radial-flow-integration.c7"], "page": 490, "by": "model"}], "examples": [], "numbers": [{"text": "В уравнении стоит коэффициент 2 при переменной xi в слагаемом с производной.", "claims": ["radial-flow-integration.c2"], "page": 489, "by": "model"}, {"text": "В правой части интегрированного уравнения стоит коэффициент -2 перед xi.", "claims": ["radial-flow-integration.c3"], "page": 490, "by": "model"}, {"text": "В знаменателе константы C1 присутствует множитель 2pi.", "claims": ["radial-flow-integration.c8"], "page": 490, "by": "model"}], "formulas": [{"latex": "\\frac{dP}{d\\xi} = v", "page": 489, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "\\xi", "meaning": "безразмерный радиус", "unit": "-"}, {"sym": "v", "meaning": "вспомогательная переменная, равная градиенту давления", "unit": "-"}]}, {"latex": "\\frac{dv}{d\\xi} + \\left( \\frac{1}{\\xi} + 2\\xi \\right) v = 0,", "page": 489, "vars": [{"sym": "v", "meaning": "вспомогательная переменная", "unit": "-"}, {"sym": "\\xi", "meaning": "безразмерный радиус", "unit": "-"}]}, {"latex": "\\frac{d\\xi}{\\xi} + \\frac{dv}{v} = -2\\xi d\\xi. \\quad (23.46)", "page": 490, "vars": [{"sym": "\\xi", "meaning": "безразмерный радиус", "unit": "-"}, {"sym": "v", "meaning": "вспомогательная переменная", "unit": "-"}]}, {"latex": "\\ln \\xi + \\ln v = -\\xi^2 + \\ln C_1, \\quad (23.47)", "page": 490, "vars": [{"sym": "\\xi", "meaning": "безразмерный радиус", "unit": "-"}, {"sym": "v", "meaning": "вспомогательная переменная", "unit": "-"}, {"sym": "C_1", "meaning": "постоянная интегрирования", "unit": "-"}]}, {"latex": "v = \\frac{dP}{d\\xi} = C_1 \\frac{e^{-\\xi^2}}{\\xi}. \\quad (23.48)", "page": 490, "vars": [{"sym": "v", "meaning": "вспомогательная переменная", "unit": "-"}, {"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "\\xi", "meaning": "безразмерный радиус", "unit": "-"}, {"sym": "C_1", "meaning": "постоянная интегрирования", "unit": "-"}]}, {"latex": "P(\\xi) = -C_1 \\int_{\\xi}^{\\infty} \\frac{e^{-\\xi^2}}{\\xi} d\\xi + 1. \\quad (23.49)", "page": 490, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "\\xi", "meaning": "безразмерный радиус", "unit": "-"}, {"sym": "C_1", "meaning": "постоянная интегрирования", "unit": "-"}]}, {"latex": "C_1 = \\frac{Q_0 \\mu}{2\\pi k h p_\\kappa}.", "page": 490, "vars": [{"sym": "C_1", "meaning": "постоянная интегрирования", "unit": "-"}, {"sym": "Q_0", "meaning": "дебит галереи", "unit": "-"}, {"sym": "\\mu", "meaning": "вязкость жидкости", "unit": "-"}, {"sym": "k", "meaning": "проницаемость пласта", "unit": "-"}, {"sym": "h", "meaning": "мощность пласта", "unit": "-"}, {"sym": "p_\\kappa", "meaning": "критическое давление", "unit": "-"}]}, {"latex": "P(\\xi) = 1 - \\frac{Q_0 \\mu}{2\\pi k h p_\\kappa} \\int_{\\xi}^{\\infty} \\frac{e^{-\\xi^2}}{\\xi} d\\xi \\quad (23.50)", "page": 490, "vars": [{"sym": "P", "meaning": "безразмерное давление", "unit": "-"}, {"sym": "\\xi", "meaning": "безразмерный радиус", "unit": "-"}, {"sym": "Q_0", "meaning": "дебит галереи", "unit": "-"}, {"sym": "\\mu", "meaning": "вязкость жидкости", "unit": "-"}, {"sym": "k", "meaning": "проницаемость пласта", "unit": "-"}, {"sym": "h", "meaning": "мощность пласта", "unit": "-"}, {"sym": "p_\\kappa", "meaning": "критическое давление", "unit": "-"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "['дебит галереи', 'вязкость жидкости', 'проницаемость пласта', 'мощность пласта', 'критическое давление', 'безразмерный радиус']", "output": "['безразмерное давление']", "breaks": [{"text": "Метод требует вычисления несобственного интеграла от экспоненты, деленной на радиус.", "claims": [], "page": 489, "by": "model"}], "hypotheses": [{"text": "Гипотеза: В цифровых двойниках этот интеграл аппроксимируется табличными значениями или численными методами, так как аналитическое выражение содержит специфическую функцию.", "claims": [], "page": 489, "by": "model"}]}, "analogy": {"text": "Это похоже на решение дифференциального уравнения в контроллере, где состояние системы (давление) меняется в зависимости от текущего отклонения (градиента), а константы системы (проницаемость, вязкость) задают масштаб реакции.", "breaks_where": "В ИТ константы обычно фиксированы, а здесь они определяют физическую природу среды, которая может меняться со временем, что требует пересмотра модели."}, "now_practice": [], "layers": {"mechanism": [{"text": "Математический аппарат использует замену переменной для сведения сложного уравнения к separable form.", "claims": ["radial-flow-integration.c1"], "page": 489, "by": "model"}, {"text": "Решение строится на наложении граничных условий: бесконечность远处 давление равно единице (безразмерной), а предел при нулевом радиусе определяет амплитуду.", "claims": ["radial-flow-integration.c6", "radial-flow-integration.c7"], "page": 490, "by": "model"}], "practice": [{"text": "Формула связывает измеряемые параметры скважины (дебит) с распределением давления в пласте.", "claims": ["radial-flow-integration.c8"], "page": 490, "by": "model"}], "nuances": [{"text": "Интеграл берется от текущего радиуса до бесконечности, что отражает влияние всей системы на точку наблюдения.", "claims": ["radial-flow-integration.c6"], "page": 490, "by": "model"}], "deeper": [{"text": "Появление экспоненты в квадрате связано с упругими свойствами жидкости и пласта, характерными для упругого режима фильтрации.", "claims": ["radial-flow-integration.c5"], "page": 490, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "basniev.radial-flow-integration.ill1", "class": "B", "src": "media/basniev.radial-flow-integration-steps.svg", "alt": "Порядок действий по тексту автора: Решение ОДУ для радиального потока", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "basniev.radial-flow-dimensionless", "type": "prerequisite"}], "claims": [{"id": "radial-flow-integration.c1", "kind": "inference", "text": "Вводится подстановка производной давления на новую переменную v.", "quote": "Воспользуемся подстановкой $$\\frac{dP}{d\\xi} = v$$", "unit": "u489-17", "page": 489, "by": "model", "verified": false}, {"id": "radial-flow-integration.c2", "kind": "inference", "text": "Получено дифференциальное уравнение для v с коэффициентами, зависящими от радиуса.", "quote": "$$\\frac{dv}{d\\xi} + \\left( \\frac{1}{\\xi} + 2\\xi \\right) v = 0,$$", "unit": "u489-19", "page": 489, "by": "model", "verified": false}, {"id": "radial-flow-integration.c3", "kind": "inference", "text": "Уравнение преобразовано к виду, удобному для интегрирования (разделение переменных).", "quote": "$$\\frac{d\\xi}{\\xi} + \\frac{dv}{v} = -2\\xi d\\xi. \\quad (23.46)$$", "unit": "u490-04", "page": 490, "by": "model", "verified": false}, {"id": "radial-flow-integration.c4", "kind": "inference", "text": "Выполнено интегрирование, получен логарифмический вид связи между v и xi.", "quote": "$$\\ln \\xi + \\ln v = -\\xi^2 + \\ln C_1, \\quad (23.47)$$", "unit": "u490-06", "page": 490, "by": "model", "verified": false}, {"id": "radial-flow-integration.c5", "kind": "inference", "text": "Найдено явное выражение для производной давления через экспоненту.", "quote": "$$v = \\frac{dP}{d\\xi} = C_1 \\frac{e^{-\\xi^2}}{\\xi}. \\quad (23.48)$$", "unit": "u490-09", "page": 490, "by": "model", "verified": false}, {"id": "radial-flow-integration.c6", "kind": "inference", "text": "Давление выражено через несобственный интеграл от найденной производной.", "quote": "$$P(\\xi) = -C_1 \\int_{\\xi}^{\\infty} \\frac{e^{-\\xi^2}}{\\xi} d\\xi + 1. \\quad (23.49)$$", "unit": "u490-11", "page": 490, "by": "model", "verified": false}, {"id": "radial-flow-integration.c7", "kind": "inference", "text": "Константа интегрирования определена из граничного условия при нулевом радиусе.", "quote": "Умножая равенство (23.49) на $\\xi$, устремляя $\\xi \\to 0$ и используя второе условие (23.45), найдем величину $C_1$", "unit": "u490-12", "page": 490, "by": "model", "verified": true}, {"id": "radial-flow-integration.c8", "kind": "observation", "text": "Константа C1 зависит от физических параметров пласта и скважины.", "quote": "$$C_1 = \\frac{Q_0 \\mu}{2\\pi k h p_\\kappa}.$$", "unit": "u490-13", "page": 490, "by": "model", "verified": false}], "term_ids": ["t-plane-radial-flow", "t-elastic-filtration-regime", "t-dimensionless-variable"], "units": ["u489-16", "u489-17", "u489-18", "u489-19", "u490-01", "u490-02", "u490-03", "u490-04", "u490-05", "u490-06", "u490-07", "u490-08", "u490-09", "u490-10", "u490-11", "u490-12", "u490-13", "u490-14", "u490-15"], "video_criteria": ["time_change"], "fallback": false}, {"id": "basniev.exponential-integral-function", "order": 21, "part_id": "p7", "minutes": 2, "title": "Основная формула теории упругого режима", "book_title": "Нефтегазовая г page": 491, "by": "model"}, {"text": "Формула для бесконечного пласта применима с высокой точностью для открытого кругового пласта при определенных критериях безразмерного времени Фурье.", "claims": ["pressure-formula-approximation.c8"], "page": 493, "by": "model"}, {"text": "Градиент давления для точек вблизи забоя при r^2 \u003c= 0,03 * 4kappa t практически не зависит от времени, а пьезометрические кривые представляют собой логарифмические линии.", "claims": ["pressure-formula-approximation.c9", "pressure-formula-approximation.c10"], "page": 493, "by": "model"}], "steps": [], "examples": [], "numbers": [{"text": "Постоянная Эйлера принимается равной 0,5772.", "claims": ["pressure-formula-approximation.c11"], "page": 491, "by": "model"}, {"text": "Погрешность аппроксимации составляет 0,25% при x \u003c= 0,01; 5,7% при x \u003c= 0,1; 9,7% при x \u003c= 0,14.", "claims": ["pressure-formula-approximation.c4", "pressure-formula-approximation.c5", "pressure-formula-approximation.c6"], "page": 491, "by": "model"}, {"text": "Погрешность расчетов давления составляет 0,6% при f_0 = 100; 2,3% при f_0 = 25; 5% при f_0 = 10; 9,4% при f_0 = 5.", "claims": ["pressure-formula-approximation.c12"], "page": 492, "by": "model"}, {"text": "Погрешность расчетов забойного давления в конечном открытом пласте не превосходит 0,08% при Fo \u003c= 0,2; 1% при Fo \u003c= 0,35; 1,9% при Fo \u003c= 0,5.", "claims": ["pressure-formula-approximation.c13"], "page": 493, "by": "model"}, {"text": "Для расчетов с точностью до 0,2% в открытом круговом пласте при r \u003c= 0,1 R_k требуется R_k >= 10^5 r_c и Fo \u003c= 0,2.", "claims": ["pressure-formula-approximation.c8"], "page": 493, "by": "model"}], "formulas": [{"latex": "- \\text{Ei} (- x) = \\ln \\frac{1}{x} - 0,5772.", "page": 491, "vars": [{"sym": "x", "meaning": "аргумент функции", "unit": "безразмерный"}, {"sym": "\\text{Ei}", "meaning": "интегральная показательная функция", "unit": "безразмерная"}, {"sym": "\\ln", "meaning": "натуральный ло а (дебит Q_0, вязкость mu, проницаемость k, толщина h, пьезопроводность kappa, радиус r и время t).", "output": "Распределение давления p(r, t) и градиент давления в пласте на основе логарифмического приближения.", "breaks": [{"text": "При больших значениях аргумента x или при выходе за пределы указанных порогов безразмерного времени и радиусов формула с логарифмом дает недопустимую погрешность, и требуется учет конечных размеров пласта через ряды Бесселя.", "claims": ["pressure-formula-approximation.c8", "pressure-formula-approximation.c12", "pressure-formula-approximation.c13"], "page": 493, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Логарифмическое приближение в анализе данных аналогично переходу к логарифмической шкале или линеаризации нелинейной модели (регрессии) в области малых значений аргумента для упрощения расчетов.", "claims": [], "page": 491, "by": "model"}]}, "analogy": {"text": "Аппроксимация сложной специальной функции более простым логарифмом похожа на замену тяжелой нелинейной модели машинного обучения на быструю эвристику или линейную аппроксимацию в узкой рабочей зоне.", "breaks_where": "Аналогия перестает работать, когда физические ограничения (границы пласта, отраженные волны давления) нарушают допущения бесконечной среды, что в чистых алгоритмах предсказания обычно не приводит к физическим несоответствиям."}, "now_practice": [], "layers": {"mechanism": [{"text": "Интегральная показательная функция при малых аргументах заменяется логарифмической зависимостью с постоянной Эйлера.", "claims": ["pressure-formula-approximation.c3"], "page": 491, "by": "model"}], "practice": [{"text": "Формула позволяет быстро оценивать забойное и пластовое давление на ранних и поздних стадиях без громоздких рядов Бесселя.", "claims": ["pressure-formula-approximation.c7", "pressure-formula-approximation.c8"], "page": 491, "by": "model"}], "nuances": [{"text": "Точность приближения зависит от параметра x или безразмерного времени Фурье f_0 и F_0.", "claims":

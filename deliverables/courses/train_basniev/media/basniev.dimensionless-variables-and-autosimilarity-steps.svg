<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" role="img" aria-label="Схема шагов: Безразмерные переменные и автомодельность"><style>
.bg{fill:#ffffff}.box{fill:#eef3f1;stroke:#56625d;stroke-width:1.2}.obs{fill:#e3f1e8;stroke:#2c8350}.inf{fill:#e4ecf7;stroke:#2f65a8}
.ass{fill:#f7e6ee;stroke:#b83a72}.t{font:14px system-ui,sans-serif;fill:#17211e}.s{font:12px system-ui,sans-serif;fill:#56625d}
.h{font:600 15px system-ui,sans-serif;fill:#17211e}.ar{stroke:#0c6b6b;stroke-width:2;fill:none;marker-end:url(#a)}.ax{stroke:#56625d;stroke-width:1}
.c1{stroke:#0c6b6b;stroke-width:2.2;fill:none}.c2{stroke:#9c6c12;stroke-width:2.2;fill:none}.c3{stroke:#b23a3a;stroke-width:2.2;fill:none}
.tag{font:11px ui-monospace,monospace;fill:#56625d}
@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="640" height="412" rx="10"/><text x="20" y="26" class="h">Безразмерные переменные и автомодельность</text><rect class="box" x="20" y="40" width="600" height="34" rx="8"/><text x="34" y="62" class="h">1</text><text x="58" y="62" class="t">Определяется безразмерное давление $P$ через физические давления.</text><path class="ar" d="M320 76 L320 94"/><rect class="box" x="20" y="98" width="600" height="34" rx="8"/><text x="34" y="120" class="h">2</text><text x="58" y="120" class="t">Устанавливается исходная зависимость $P$ от $x, t, \kappa$.</text><path class="ar" d="M320 134 L320 152"/><rect class="box" x="20" y="156" width="600" height="52" rx="8"/><text x="34" y="178" class="h">3</text><text x="58" y="178" class="t">Анализируются размерности аргументов для поиска безразмерного</text><text x="58" y="196" class="t">комплекса.</text><path class="ar" d="M320 210 L320 228"/><rect class="box" x="20" y="232" width="600" height="34" rx="8"/><text x="34" y="254" class="h">4</text><text x="58" y="254" class="t">Вводится автомодельная переменная $u$ на основе найденного комплекса.</text><path class="ar" d="M320 268 L320 286"/><rect class="box" x="20" y="290" width="600" height="34" rx="8"/><text x="34" y="312" class="h">5</text><text x="58" y="312" class="t">Задача сводится к поиску функции $P(u)$.</text><path class="ar" d="M320 326 L320 344"/><rect class="box" x="20" y="348" width="600" height="34" rx="8"/><text x="34" y="370" class="h">6</text><text x="58" y="370" class="t">Формулируются граничные условия в новых переменных.</text><text x="630" y="404" text-anchor="end" class="tag">схема · по тексту книги</text></svg>
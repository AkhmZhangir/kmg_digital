@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="760" height="264" rx="10"/><text x="20" y="26" class="h">Накопленная добыча и её рост</text><text x="20" y="54" class="s">наблюдение (что видно в данных)</text><text x="420" y="54" class="s">вывод (интерпретация)</text><rect class="obs" x="20" y="66" width="320" height="32" rx="8"/><text x="32" y="86" class="t">Рост добычи со временем замедляется.</text><rect class="obs" x="20" y="108" width="320" height="32" rx="8"/><text x="32" y="128" class="t">Начальный рост добычи быстрый.</text><rect class="obs" x="20" y="150" width="320" height="32" rx="8"/><text x="32" y="170" class="t">Поздний рост добычи медленный.</text><rect class="inf" x="420" y="66" width="320" height="50" rx="8"/><text x="432" y="86" class="t">Накопленная добыча равна интегралу</text><text x="432" y="104" class="t">дебита.</text><rect class="inf" x="420" y="126" width="320" height="50" rx="8"/><text x="432" y="146" class="t">Дебит в упругом режиме зависит от</text><text x="432" y="164" class="t">времени.</text><path class="ar" d="M346 126.0 L414 126.0"/><rect class="ass" x="20" y="198" width="720" height="32" rx="8"/><text x="32" y="218" class="t">Допущение: Давление в галерее постоянно.</text><text x="750" y="256" text-anchor="end" class="tag">схема · наблюдение отделено от вывода</text></svg>
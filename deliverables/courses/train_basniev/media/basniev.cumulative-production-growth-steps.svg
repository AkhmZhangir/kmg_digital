</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="640" height="278" rx="10"/><text x="20" y="26" class="h">Накопленная добыча и её рост</text><rect class="box" x="20" y="40" width="600" height="34" rx="8"/><text x="34" y="62" class="h">1</text><text x="58" y="62" class="t">Зафиксировать дебит Q(t) в момент времени t.</text><path class="ar" d="M320 76 L320 94"/><rect class="box" x="20" y="98" width="600" height="34" rx="8"/><text x="34" y="120" class="h">2</text><text x="58" y="120" class="t">Проинтегрировать дебит от 0 до t для получения объема.</text><path class="ar" d="M320 134 L320 152"/><rect class="box" x="20" y="156" width="600" height="34" rx="8"/><text x="34" y="178" class="h">3</text><text x="58" y="178" class="t">Применить аналитическое решение для упругого режима.</text><path class="ar" d="M320 192 L320 210"/><rect class="box" x="20" y="214" width="600" height="34" rx="8"/><text x="34" y="236" class="h">4</text><text x="58" y="236" class="t">Получить зависимость объема от sqrt(t).</text><text x="630" y="270" text-anchor="end" class="tag">схема · по тексту книги</text></svg>
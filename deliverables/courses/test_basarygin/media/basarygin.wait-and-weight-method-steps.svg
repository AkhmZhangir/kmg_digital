<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 502" role="img" aria-label="Схема шагов: Метод ожидания и веса: одноэтапное глушение"><style>
.bg{fill:#ffffff}.box{fill:#eef3f1;stroke:#56625d;stroke-width:1.2}.obs{fill:#e3f1e8;stroke:#2c8350}.inf{fill:#e4ecf7;stroke:#2f65a8}
.ass{fill:#f7e6ee;stroke:#b83a72}.t{font:14px system-ui,sans-serif;fill:#17211e}.s{font:12px system-ui,sans-serif;fill:#56625d}
.h{font:600 15px system-ui,sans-serif;fill:#17211e}.ar{stroke:#0c6b6b;stroke-width:2;fill:none;marker-end:url(#a)}.ax{stroke:#56625d;stroke-width:1}
.c1{stroke:#0c6b6b;stroke-width:2.2;fill:none}.c2{stroke:#9c6c12;stroke-width:2.2;fill:none}.c3{stroke:#b23a3a;stroke-width:2.2;fill:none}
.tag{font:11px ui-monospace,monospace;fill:#56625d}
@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="640" height="502" rx="10"/><text x="20" y="26" class="h">Метод ожидания и веса: одноэтапное глушение</text><rect class="box" x="20" y="40" width="600" height="52" rx="8"/><text x="34" y="62" class="h">1</text><text x="58" y="62" class="t">Перекрывают скважину и начинают приготовление бурового раствора</text><text x="58" y="80" class="t">необходимой плотности.</text><path class="ar" d="M320 94 L320 112"/><rect class="box" x="20" y="116" width="600" height="52" rx="8"/><text x="34" y="138" class="h">2</text><text x="58" y="138" class="t">Создают циркуляцию в скважине после приготовления утяжеленного</text><text x="58" y="156" class="t">раствора.</text><path class="ar" d="M320 170 L320 188"/><rect class="box" x="20" y="192" width="600" height="52" rx="8"/><text x="34" y="214" class="h">3</text><text x="58" y="214" class="t">Поддерживают постоянное давление на штуцере при наборе необходимой</text><text x="58" y="232" class="t">скорости циркуляции.</text><path class="ar" d="M320 246 L320 264"/><rect class="box" x="20" y="268" width="600" height="52" rx="8"/><text x="34" y="290" class="h">4</text><text x="58" y="290" class="t">Регулируют штуцер для достижения целевого давления в кольцевом</text><text x="58" y="308" class="t">пространстве.</text><path class="ar" d="M320 322 L320 340"/><rect class="box" x="20" y="344" width="600" height="52" rx="8"/><text x="34" y="366" class="h">5</text><text x="58" y="366" class="t">Обеспечивают снижение давления в бурильных трубах по запланированному</text><text x="58" y="384" class="t">графику.</text><path class="ar" d="M320 398 L320 416"/><rect class="box" x="20" y="420" width="600" height="52" rx="8"/><text x="34" y="442" class="h">6</text><text x="58" y="442" class="t">Прекращают циркуляцию и закрывают штуцер при достижении раствором</text><text x="58" y="460" class="t">промывочных отверстий долота.</text><text x="630" y="494" text-anchor="end" class="tag">схема · по тексту книги</text></svg>
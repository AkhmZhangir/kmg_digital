жин на нефть и газ используются для составления литологического разреза скважины", "unit": "u090-03", "page": 90, "by": "model", "verified": true}, {"id": "gis-interpretation-tasks.c2", "kind": "observation", "text": "По ГИС выделяют коллекторы, оценивают характер насыщения, эффективную толщину, пористость и нефтегазонасыщение.", "quote": "выделения и оценки характера насыщения коллекторов в разрезе, определения эффективной толщины, коэффициентов пористости и нефтегазонасыщения", "unit": "u090-03", "page": 90, "by": "model", "verified": true}, {"id": "gis-interpretation-tasks.c3", "kind": "observation", "text": "ГИС позволяет оценивать коэффициенты проницаемости и глинистости продуктивных коллекторов.", "quote": "а также оценки коэффициентов проницаемости и глинистости продуктивных коллекторов.", "unit": "u090-03", "page": 90, "by": "model", "verified": true}, {"id": "gis-interpretation-tasks.c4", "kind": "inference", "text": "Литологический разрез обычно составляют качественной интерпретацией признаков пород на главных диаграммах комплекса ГИС.", "quote": "Первая из перечисленных задач решается обычно методами качественной интерпретации путем применения признаков основных типов пород на главных диаграммах геофизического комплекса.", "unit": "u090-04", "page": 90, "by": "model", "verified": true}, {"id": "gis-interpretation-tasks.c5", "kind": "inference", "text": "Для простых коллекторов с межзерновой пористостью выделение, насыщение и толщину определяют качественной интерпретацией.", "quote": "Выделение, оценка характера насыщения коллекторов и определение их эффективной толщины проводятся для простейшего случая коллекторов с межзерновой пористостью также на основании качественной интерпретации", "unit": "u090-04", "page": 90, "by": "model", "verified": true}, {"id": "gis-interpretation-tasks.c6", "kind": "inference", "text": "Для сложных коллекторов используют количественную интерпретацию через коэффициенты пористости, глинистости, нефтегазонасыщения или параметр $P_п$.", "quote": "а для более сложных — методами количественной интерпретации через оценку коэффициентов пористости, глинистости, нефтегазонасыщения, либо параметра насыщения $P_п$.", "unit": "u090-04", "page": 90, "by": "model", "verified": true}, {"id": "gis-interpretation-tasks.c7", "kind": "inference", "text": "Промышленная оценка коллекторов опирается на количественные значения пористости, нефтегазонасыщения и проницаемости для подсчета запасов и проектирования разработки.", "quote": "Промышленная оценка коллекторов базируется на количественных определениях пористости, нефтегазонасыщения, проницаемости, используемых при проведении подсчетов запасов и проектировании разработки месторождений.", "unit": "u090-04", "page": 90, "by": "model", "verified": true}, {"id": "gis-interpretation-tasks.c8", "kind": "observation", "text": "В эксплуатационных скважинах ГИС позволяет отслеживать продвижение водонефтяного и газожидкостного контактов при разработке.", "quote": "По данным, полученным в эксплуатационных скважинах, кроме указанных задач, по геофизическим материалам устанавливается характер продвижения водонефтяного (ВНК) и газожидкостного (ГЖК) контактов в процессе разработки месторождения.", "unit": "u090-05", "page": 90, "by": "model", "verified": true}], "term_ids": ["t-lithological-section", "t-qualitative-interpretation", "t-quantitative-interpretation", "t-intergranular-porosity-reservoir", "t-saturation-parameter-pn", "t-oil-water-contact-owc", "t-gas-liquid-contact-glc"], "units": ["u090-03", "u090-04", "u090-05"], "video_criteria": [], "fallback": false}, {"id": "latyshova.mud-drilling-invasion-zone", "order": 2, "part_id": "p2", "minutes": 2, "title": "Проникновение фильтрата бурового раствора в пласт", "book_title": "§ 17. УСЛОВИЯ ВСКРЫТИЯ РАЗРЕЗОВ СКВАЖИН И ИХ ВЛИЯНИЕ НА КОМПЛЕКС ГЕОФИЗИЧЕСКИХ ИССЛЕДОВАНИЙ", "pages": [90, 90], "difficulty": {"primary": "М", "secondary": "П"}, "threshold": true, "format": {"primary": "short", "reason": "Тип «механизм, процесс»; критерии видеоёмкости: невидимое становится видимым, цепочка «причина → следствие». Изменение диаметра ствола скважины при взаимодействии бурового раствора с разными породами наиболее наглядно объясняется короткой видеоанимацией или интерактивной схемой пласта.", "scene_template": "process-1d"}, "summary": [{"text": "Вскрытие межзерновых коллекторов на глинистом растворе приводит к образованию зон проникновения фильтрата и глинистой корки ($d_c \u003c d_a$). Параметры бурового раствора и свойства пород определяют диаметр скважины и качество интерпретации геофизических данных.", "claims": ["mud-drilling-invasion-zone.c3", "mud-drilling-invasion-zone.c7", "mud-drilling-invasion-zone.c8", "mud-drilling-invasion-zone.c9", "mud-drilling-invasion-zone.c10"], "page": 90, "by": "model"}], "how_it_works": [{"text": "Тип промывочной жидкости существенно влияет на достоверность геофизических исследований скважин. К промывочным жидкостям относятся глинистые растворы, техническая вода и нефильтрующиеся растворы. Глинистый раствор применяют наиболее широко при бурении скважин.", "claims": ["mud-drilling-invasion-zone.c3", "mud-drilling-invasion-zone.c4", "mud-drilling-invasion-zone.c5"], "page": 90, "by": "model"}, {"text": "При вскрытии межзерновых коллекторов глинистым раствором возникают зоны проникновения фильтрата. На стенках скважины формируется глинистая корка, уменьшающая её диаметр относительно номинального до $d_c \u003c d_a$.", "claims": ["mud-drilling-invasion-zone.c7"], "page": 90, "by": "model"}, {"text": "В плотных сцементированных породах диаметр скважины равен номинальному ($d_c = d_a$). В глинах, сланцах и аргиллитах диаметр скважины увеличивается из-за разбухания и вымывания частиц. В трещиноватых породах, карстах и солях диаметр также увеличивается ($d_c > d_a$).", "claims": ["mud-drilling-invasion-zone.c8", "mud-drilling-invasion-zone.c9", "mud-drilling-invasion-zone.c10"], "page": 90, "by": "model"}], "steps": [{"text": "1. Заполнение скважины промывочной жидкостью (глинистым раствором, технической водой или нефильтрующимся раствором).", "claims": ["mud-drilling-invasion-zone.c4", "mud-drilling-invasion-zone.c5"], "page": 90, "by": "model"}, {"text": "2. Проявление реакций горных пород разреза на тип используемого раствора.", "claims": ["mud-drilling-invasion-zone.c2"], "page": 90, "by": "model"}, {"text": "3. Формирование зоны проникновения фильтрата и глинистой корки ($d_c \u003c d_a$) в межзерновых коллекторах.", "claims": ["mud-drilling-invasion-zone.c7"], "page": 90, "by": "model"}], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": null, "data_meaning": {"input": "Тип и параметры промывочной жидкости, номинальный диаметр долота $d_a$, фактический диаметр скважины $d_c$.", "output": "Интерпретированные зоны проникновения фильтрата в коллекторах и участки сужения или расширения ствола скважины.", "breaks": [{"text": "Интерпретация данных искажается при изменениях параметров промывочной жидкости в процессе бурения.", "claims": ["mud-drilling-invasion-zone.c3"], "page": 90, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Алгоритмы автоматической обработки данных ГИС должны адаптироваться к типу промывочной жидкости.", "claims": ["mud-drilling-invasion-zone.c3", "mud-drilling-invasion-zone.c6"], "page": 90, "by": "model"}]}, "analogy": {"text": "Проникновение фильтрата бурового раствора похоже на промежуточный прокси-сервер, изменяющий проходящий трафик данных.", "breaks_where": "Фильтрат образует реальную физическую зону в породе и глинистую корку, меняя геометрию и физику среды измерения."}, "now_practice": [{"text": "Сегодня учет влияния промывочной жидкости и кавернометрии выполняется автоматически в ПО интерпретации.", "claims": ["mud-drilling-invasion-zone.c3", "mud-drilling-invasion-zone.c6"], "page": 90, "by": "model"}], "layers": {"mechanism": [{"text": "Фильтрат глинистого раствора отжимается в межзерновой коллектор, образуя зону проникновения и глинистую корку ($d_c \u003c d_a$).", "claims": ["mud-drilling-invasion-zone.c7"], "page": 90, "by": "model"}], "practice": [{"text": "Выбор комплекса геофизических методов и способы интерпретации ориентируют на параметры промывочной жидкости.", "claims": ["mud-drilling-invasion-zone.c1", "mud-drilling-invasion-zone.c3", "mud-drilling-invasion-zone.c6"], "page": 90, "by": "model"}], "nuances": [{"text": "В глинах диаметр растет от разбухания, а в солях и карстах — от растворения и разрушения ($d_c > d_a$).", "claims": ["mud-drilling-invasion-zone.c9", "mud-drilling-invasion-zone.c10"], "page": 90, "by": "model"}], "deeper": [{"text": "В плотных сцементированных породах размыв отсутствует, поэтому фактический диаметр равен номинальному ($d_c = d_a$).", "claims": ["mud-drilling-invasion-zone.c8"], "page": 90, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "latyshova.mud-drilling-invasion-zone.ill1", "class": "B", "src": "media/latyshova.mud-drilling-invasion-zone-steps.svg", "alt": "Порядок действий по тексту автора: Проникновение фильтрата бурового раствора в пласт", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.gis-interpretation-tasks", "type": "prerequisite"}], "claims": [{"id": "mud-drilling-invasion-zone.c1", "kind": "observation", "text": "Для исследования скважин района применяется оптимальный геофизический комплекс.", "quote": "Для исследования скважин в данном районе и в пределах изучаемого геологического объекта должен применяться оптимальный, соответствующий условиям района комплекс геофизических исследований.", "unit": "u090-07", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c2", "kind": "observation", "text": "Состав методов оптимального комплекса обусловлен особенностями геологического разреза.", "quote": "Состав методов оптимального комплекса зависит от особенностей разреза (терригенный, карбонатный, гидрохимический и др.).", "unit": "u090-08", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c3", "kind": "observation", "text": "Тип и параметры промывочной жидкости влияют на комплекс методов и их интерпретацию.", "quote": "На комплекс применяемых методов и способы их интерпретации также существенно влияют условия бурения скважин и в первую очередь тип и параметры промывочной жидкости", "unit": "u090-08", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c4", "kind": "observation", "text": "Промывочные жидкости делятся на глинистые растворы, техническую воду и нефильтрующиеся растворы.", "quote": "Промывочными жидкостями являются глинистые растворы, техническая вода и нефильтрующиеся растворы.", "unit": "u090-08", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c5", "kind": "observation", "text": "Глинистый раствор служит наиболее широко применяемой промывочной жидкостью.", "quote": "Глинистый раствор — наиболее широко применяемая в настоящее время промывочная жидкость", "unit": "u090-09", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c6", "kind": "inference", "text": "Признаки выделения коллекторов по геофизическим данным рассчитывают исходя из использования глинистого раствора.", "quote": "основные признаки выделения в разрезе литологических разностей, в том числе коллекторов, по геофизическим данным формулируются в расчете на применение глинистого раствора", "unit": "u090-09", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c7", "kind": "observation", "text": "При бурении на глинистом растворе в межзерновых коллекторах создаются зоны проникновения фильтрата и глинистые корки ($d_c \u003c d_a$).", "quote": "К особенностям вскрытия разрезов на глинистом растворе относятся образование в межзерновых коллекторах зон проникновения фильтрата раствора и глинистых корок на стенках скважины $d_c \u003c d_a$.", "unit": "u090-10", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c8", "kind": "observation", "text": "В плотных сцементированных породах диаметр скважины совпадает с номинальным ($d_c = d_a$).", "quote": "В плотных, сцементированных породах диаметр скважины остается равным номинальному ($d_c = d_a$).", "unit": "u090-10", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c9", "kind": "observation", "text": "В глинах, сланцах и аргиллитах диаметр скважины увеличивается из-за разбухания и вымывания частиц.", "quote": "В глинах, глинистых сланцах, аргиллитах за счет разбухания глинистых частиц и вымывания их струей бурового раствора диаметр скважины увеличивается.", "unit": "u090-10", "page": 90, "by": "model", "verified": true}, {"id": "mud-drilling-invasion-zone.c10", "kind": "observation", "text": "Диаметр скважины увеличивается ($d_c > d_a$) в трещиноватых породах, карстах и растворимых солях.", "quote": "В трещиноватых разрушенных породах, зонах развития карста и растворимых каменных и калийных солях диаметр скважины также может увеличиваться ($d_c > d_a$).", "unit": "u090-10", "page": 90, "by": "model", "verified": true}], "term_ids": ["t-clay-based-drilling-mud", "t-mud-filtrate", "t-mud-cake", "t-nominal-hole-diameter", "t-actual-wellbore-diameter"], "units": ["u090-07", "u090-08", "u090-09", "u090-10"], "video_criteria": ["invisible_visible", "cause_effect"], "fallback": false, "videos": [{"src": "media/shorts-caliper.mp4", "captions": "media/shorts-caliper.vtt", "title": "Почему скважина местами уже долота", "format": "shorts", "passport": "media/shorts-caliper.passport.md"}]}, {"id": "latyshova.mud-filtration-density-impact", "order": 3, "part_id": "p2", "minutes": 3, "title": "Влияние водоотдачи и плотности раствора на ГИС", "book_title": "§ 17. УСЛОВИЯ ВСКРЫТИЯ РАЗРЕЗОВ СКВАЖИН И ИХ ВЛИЯНИЕ НА КОМПЛЕКС ГЕОФИЗИЧЕСКИХ ИССЛЕДОВАНИЙ", "pages": [90, 91], "difficulty": {"primary": "М", "secondary": "И"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «механизм, процесс»; критерии видеоёмкости: цепочка «причина → следствие». Тема отлично подходит для интерактивного симулятора: пользователь меняет плотность и водоотдачу раствора и видит в реальном времени разрастание зоны проникновения и искажение кривых ГИС.", "scene_template": "process-1d"}, "summary": [{"text": "Водоотдача и плотность глинистого раствора напрямую определяют качество геофизических исследований скважин.", "claims": ["mud-filtration-density-impact.c1"], "page": 90, "by": "model"}, {"text": "Высокие водоотдача и плотность приводят к глубокому проникновению фильтрата и намыву толстой глинистой корки.", "claims": ["mud-filtration-density-impact.c4", "mud-filtration-density-impact.c6"], "page": 90, "by": "model"}, {"text": "Оптимальные условия ГИС достигаются при водоотдаче 4—8 см³/ч и бурении на равновесии.", "claims": ["mud-filtration-density-impact.c2", "mud-filtration-density-impact.c8"], "page": 90, "by": "model"}], "how_it_works": [{"text": "Параметры глинистого раствора — водоотдача, плотность и минерализация фильтрата — управляют условиями ГИС. Водоотдача служит главным показателем качества раствора.", "claims": ["mud-filtration-density-impact.c1"], "page": 90, "by": "model"}, {"text": "При оптимальной водоотдаче (4—8 см³/ч) глубина проникновения фильтрата и толщина глинистой корки минимальны. Это обеспечивает надежную электрометрию неизмененной части пласта.", "claims": ["mud-filtration-density-impact.c2", "mud-filtration-density-impact.c3"], "page": 90, "by": "model"}, {"text": "При высокой водоотдаче (20 см³/ч) глубокое проникновение мешает индукционному зонду и большим зондам оценивать продуктивность. Толстая корка экранирует малоглубинные методы ГГМ, МБК и ЯМР.", "claims": ["mud-filtration-density-impact.c4"], "page": 90, "by": "model"}, {"text": "Плотность раствора задает скважинное давление и репрессию — превышение давления над пластовым. С ростом плотности увеличивается репрессия и глубина проникновения фильтрата.", "claims": ["mud-filtration-density-impact.c5", "mud-filtration-density-impact.c6"], "page": 90, "by": "model"}, {"text": "Увеличение плотности раствора действует на геофизику аналогично росту водоотдачи. Лучшие условия дает бурение на равновесии при нулевой репрессии.", "claims": ["mud-filtration-density-impact.c7", "mud-filtration-density-impact.c8"], "page": 91, "by": "model"}], "steps": [{"text": "Рост плотности или водоотдачи бурового раствора увеличивает репрессию давления в скважине.", "claims": ["mud-filtration-density-impact.c5", "mud-filtration-density-impact.c6"], "page": 90, "by": "model"}, {"text": "Фильтрат раствора глубоко отжимает пластовый флюид, а на стенке образуется толстая глинистая корка.", "claims": ["mud-filtration-density-impact.c4", "mud-filtration-density-impact.c6"], "page": 90, "by": "model"}, {"text": "Глубинные зонды электрометрии и малоглубинные методы теряют доступ к неизмененным характеристикам коллектора.", "claims": ["mud-filtration-density-impact.c3", "mud-filtration-density-impact.c4"], "page": 90, "by": "model"}], "examples": [], "numbers": [{"text": "Оптимальная водоотдача глинистого раствора составляет от 4 до 8 см³/ч.", "claims": ["mud-filtration-density-impact.c2"], "page": 90, "by": "model"}, {"text": "При высокой водоотдаче в 20 см³/ч условия геофизических исследований становятся крайне неблагоприятными.", "claims": ["mud-filtration-density-impact.c4"], "page": 90, "by": "model"}, {"text": "Бурение на равновесии проводится при репрессии $\\Delta p \\approx 0$.", "claims": ["mud-filtration-density-impact.c8"], "page": 91, "by": "model"}], "formulas": [{"latex": "\\Delta p = p_c - p_{пл}", "page": 90, "vars": [{"sym": "\\Delta p", "meaning": "превышение скважинного давления над пластовым (репрессия)", "unit": "Па"}, {"sym": "p_c", "meaning": "давление в скважине", "unit": "Па"}, {"sym": "p_{пл}", "meaning": "пластовое давление на заданной глубине", "unit": "Па"}]}], "tables": [], "misconception": {"wrong": "Показания каротажа отражают исключительно неизмененную породу и не зависят от режима бурения.", "right": [{"text": "Высокая водоотдача и плотность раствора создают глубокое проникновение и толстую корку, маскирующие естественные свойства пласта.", "claims": ["mud-filtration-density-impact.c4", "mud-filtration-density-impact.c6"], "page": 90, "by": "model"}]}, "data_meaning": {"input": "Водоотдача раствора (см³/ч), плотность $\\delta_p$, скважинное $p_c$ и пластовое $p_{пл}$ давление, показания ГИС (ГГМ, МБК, ЯМР, индукционный зонд).", "output": "Оценка параметров неизмененной зоны коллектора и его продуктивности.", "breaks": [{"text": "При водоотдаче 20 см³/ч или высокой репрессии фильтрат уходит глубоко в пласт, делая показания глубинного и малоглубинного каротажа недостоверными.", "claims": ["mud-filtration-density-impact.c4", "mud-filtration-density-impact.c6"], "page": 90, "by": "model"}], "hypotheses": [{"text": "Гипотеза: показатели водоотдачи и плотности раствора можно использовать в алгоритмах ML как весовые коэффициенты доверия к геофизическим фичам.", "claims": [], "page": 90, "by": "model"}]}, "analogy": {"text": "Раствор с высокой водоотдачей действует как мутное защитное стекло: малоглубинные приборы не «видят» пласт сквозь корку (грязь на стекле), а глубинные приборы размываются фильтратом (туманом в воздухе).", "breaks_where": "Фильтрат вытесняет реальный пластовый флюид из пор, физически меняя состав среды, а не просто создавая оптическую преграду."}, "now_practice": [{"text": "В современной практике искажения от зоны проникновения и корки компенсируются путем комплексного цифрового моделирования в ПО интерпретации.", "claims": [], "page": 90, "by": "model"}], "layers": {"mechanism": [{"text": "Репрессия давления продавливает жидкую фазу раствора в поры, откладывая глинистые частицы на стенке скважины.", "claims": ["mud-filtration-density-impact.c5", "mud-filtration-density-impact.c6"], "page": 90, "by": "model"}], "practice": [{"text": "Для качественного каротажа поддерживают водоотдачу 4—8 см³/ч и минимизируют репрессию вплоть до нулевой.", "claims": ["mud-filtration-density-impact.c2", "mud-filtration-density-impact.c8"], "page": 90, "by": "model"}], "nuances": [{"text": "Высокая водоотдача (20 см³/ч) блокирует одновременно глубинные индукционные и малоглубинные приборы (ГГМ, МБК, ЯМР).", "claims": ["mud-filtration-density-impact.c4"], "page": 90, "by": "model"}], "deeper": [{"text": "Влияние плотности раствора дублирует эффект водоотдачи, так как оба фактора увеличивают объем проникшего фильтрата.", "claims": ["mud-filtration-density-impact.c6", "mud-filtration-density-impact.c7"], "page": 90, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "latyshova.mud-filtration-density-impact.ill1", "class": "B", "src": "media/latyshova.mud-filtration-density-impact-steps.svg", "alt": "Порядок действий по тексту автора: Влияние водоотдачи и плотности раствора на ГИС", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.mud-drilling-invasion-zone", "type": "prerequisite"}], "claims": [{"id": "mud-filtration-density-impact.c1", "kind": "observation", "text": "Водоотдача выступает главным показателем качества глинистого раствора, и снижение водоотдачи улучшает раствор.", "quote": "Водоотдача - основной показатель качества глинистого раствора; чем ниже водоотдача, тем лучше раствор.", "unit": "u090-11", "page": 90, "by": "model", "verified": true}, {"id": "mud-filtration-density-impact.c2", "kind": "observation", "text": "Оптимальная водоотдача составляет 4—8 см³/ч, создавая минимальное проникновение и толщину корки.", "quote": "При оптимальной водоотдаче (4—8 см³/ч) условия изучения разреза геофизическими методами наиболее благоприятны, поскольку в этом случае глубина проникновения и толщина глинистой корки в коллекторах являются минимальными.", "unit": "u090-11", "page": 90, "by": "model", "verified": true}, {"id": "mud-filtration-density-impact.c3", "kind": "inference", "text": "Минимальное проникновение позволяет точно исследовать неизмененный коллектор электрометрией и малоглубинными методами (ГГМ, МБК, ЯМР).", "quote": "Это обеспечивает надежное определение параметров неизмененной части коллектора методами электрометрии и коллекторских свойств пласта методами с высокой вертикальной разрешающей способностью и малой глубинностью (ГГМ, МБК, ЯМР).", "unit": "u090-11", "page": 90, "by": "model", "verified": true}, {"id": "mud-filtration-density-impact.c4", "kind": "observation", "text": "Водоотдача 20 см³/ч создает неблагоприятные условия, мешая оценивать продуктивность глубинными и малоглубинными методами.", "quote": "При высокой водоотдаче (20 см³/ч) условия изучения разреза и прежде всего коллекторов геофизическими методами становятся крайне неблагоприятными: глубокое проникновение не позволяет оценивать продуктивность коллектора наиболее глубинными методами электрометрии", "unit": "u090-11", "page": 90, "by": "model", "verified": true}, {"id": "mud-filtration-density-impact.c5", "kind": "observation", "text": "Плотность раствора определяет скважинное давление и его превышение (репрессию) над пластовым.", "quote": "Плотность $\\delta_p$ глинистого раствора определяет величину давления в скважине $p$ и превышение его (репрессию) $\\Delta p$ над пластовым $p_{пл}$ на заданной глубине ($\\Delta p = p_c - p_{пл}$).", "unit": "u090-12", "page": 90, "by": "model", "verified": true}, {"id": "mud-filtration-density-impact.c6", "kind": "inference", "text": "Рост плотности раствора увеличивает скважинное давление и репрессию, углубляя проникновение фильтрата в пласт.", "quote": "Чем больше $\\delta_p$, тем больше $p_c$ и $\\Delta p$, и тем глубже происходит проникновение фильтрата глинистого раствора в коллекторы.", "unit": "u090-12", "page": 90, "by": "model", "verified": true}, {"id": "mud-filtration-density-impact.c7", "kind": "inference", "text": "Увеличение плотности раствора оказывает на геофизику аналогичный эффект, что и рост водоотдачи.", "quote": "Следовательно, увеличение $\\delta_p$ раствора для промысловой геофизики означает примерно то же, что увеличение водоотдачи.", "unit": "u091-01", "page": 91, "by": "model", "verified": true}, {"id": "mud-filtration-density-impact.c8", "kind": "assumption", "text": "Наилучшие условия геофизических исследований достигаются при бурении на равновесии с минимальной репрессией.", "quote": "Оптимальные условия для проведения геофизических исследований - бурение с минимальным $\\Delta p$ или \"на равновесии\", когда $\\Delta p \\approx 0$.", "unit": "u091-01", "page": 91, "by": "model", "verified": true}], "term_ids": ["t-fluid-loss", "t-overbalance"], "units": ["u090-11", "u090-12", "u091-01"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "latyshova.mud-salinity-impact", "order": 4, "part_id": "p2", "minutes": 2, "title": "Влияние минерализации промывочной жидкости на электрокаротаж", "book_title": "§ 17. УСЛОВИЯ ВСКРЫТИЯ РАЗРЕЗОВ СКВАЖИН И ИХ ВЛИЯНИЕ НА КОМПЛЕКС ГЕОФИЗИЧЕСКИХ ИССЛЕДОВАНИЙ", "pages": [91, 91], "difficulty": {"primary": "И", "secondary": "Н"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». Концептуальный объяснительный текст с логическими связями подходит для текстуально-структурированного формата с графиками контрастности.", "scene_template": "tool-in-well"}, "summary": [{"text": "Минерализация фильтрата раствора $\\rho_ф$ неоднозначно влияет на геофизические методы каротажа.", "claims": ["mud-salinity-impact.c1"], "page": 91, "by": "model"}, {"text": "Рост минерализации ухудшает работу СП и микрозондов, но облегчает оценку продуктивности разноглубинными методами.", "claims": ["mud-salinity-impact.c4", "mud-salinity-impact.c5"], "page": 91, "by": "model"}], "how_it_works": [{"text": "Геофизики связывают минерализация C фильтрата глинистого раствора с его удельным сопротивлением $\\rho_ф$.", "claims": ["mud-salinity-impact.c1"], "page": 91, "by": "model"}, {"text": "Типичное бурение выполняется на пресном растворе, при котором $\\rho_ф > \\rho_п$.", "claims": ["mud-salinity-impact.c2"], "page": 91, "by": "model"}, {"text": "При пресном растворе коллекторы выделяют отрицательными аномалиями СП и положительными приращениями микрозондов.", "claims": ["mud-salinity-impact.c3"], "page": 91, "by": "model"}, {"text": "При повышении минерализации $\\rho_ф$ приближается к сопротивлению пластовой воды $\\rho_п$.", "claims": ["mud-salinity-impact.c4"], "page": 91, "by": "model"}, {"text": "Это резко снижает эффективность выделения коллекторов методами СП и микрозондов.", "claims": ["mud-salinity-impact.c4"], "page": 91, "by": "model"}, {"text": "Также существенно уменьшается эффективность индукционного метода для изучения разреза в целом.", "claims": ["mud-salinity-impact.c4"], "page": 91, "by": "model"}, {"text": "Однако приближение $\\rho_ф$ к $\\rho_п$ улучшает оценку продуктивности разноглубинной электрометрией.", "claims": ["mud-salinity-impact.c5"], "page": 91, "by": "model"}, {"text": "При равенстве $\\rho_ф = \\rho_п$ в продуктивных коллекторах возникает только понижающее проникновение ($\\rho_п \u003c \\rho_пп$).", "claims": ["mud-salinity-impact.c6"], "page": 91, "by": "model"}, {"text": "В водоносных пластах при этом условии выполняется соотношение $\\rho_п \\approx \\rho_пп$.", "claims": ["mud-salinity-impact.c6"], "page": 91, "by": "model"}], "steps": [], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": {"wrong": "Высокая минерализация промывочной жидкости одинаково ухудшает любые геофизические измерения.", "right": [{"text": "Сокращение контраста между $\\rho_ф$ и $\\rho_п$ ухудшает методы СП и микрозонды, но облегчает определение продуктивности коллектора.", "claims": ["mud-salinity-impact.c4", "mud-salinity-impact.c5", "mud-salinity-impact.c6"], "page": 91, "by": "model"}]}, "data_meaning": {"input": "Удельное сопротивление фильтрата раствора $\\rho_ф$, удельное сопротивление пластовой воды $\\rho_п$, кривые СП, микрозондов и разноглубинных электрокаротажей.", "output": "Выделенные пласты-коллекторы и оценка их продуктивности (нефтенасыщенности/водонасыщенности).", "breaks": [{"text": "При $\\rho_ф \\approx \\rho_п$ классические признаки коллектора на кривых СП и микрозондов исчезают.", "claims": ["mud-salinity-impact.c4"], "page": 91, "by": "model"}], "hypotheses": [{"text": "Гипотеза: при выравнивании $\\rho_ф$ и $\\rho_п$ модели машинного обучения на основе только СП дают высокие ошибки классификации коллекторов.", "claims": [], "page": 91, "by": "model"}]}, "analogy": {"text": "Изменение контрастности изображения при настройке яркости. Если яркость объекта ($\\rho_ф$) совпадает с фоном ($\\rho_п$), силуэт (СП) пропадает, но проявляется структура внутренних дефектов.", "breaks_where": "Физика процесса основана на электрохимических и диффузионных потенциалах, а не на оптическом поглощении света."}, "now_practice": [], "layers": {"mechanism": [{"text": "Соотношение минерализаций фильтрата и пластовой воды определяет электрический контраст в прискважинной зоне.", "claims": ["mud-salinity-impact.c1", "mud-salinity-impact.c2", "mud-salinity-impact.c6"], "page": 91, "by": "model"}], "practice": [{"text": "При выборе типа бурового раствора учитывают баланс между четкостью выделения пласта и возможностью оценки его насыщения.", "claims": ["mud-salinity-impact.c3", "mud-salinity-impact.c5"], "page": 91, "by": "model"}], "nuances": [{"text": "Уравнение $\\rho_ф = \\rho_п$ создает зоны понижающего проникновения в нефтяных пластах ($\\rho_п \u003c \\rho_пп$).", "claims": ["mud-salinity-impact.c6"], "page": 91, "by": "model"}], "deeper": [{"text": "Индукционный метод теряет эффективность изучения разреза с ростом минерализации промывочной жидкости.", "claims": ["mud-salinity-impact.c4"], "page": 91, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "latyshova.mud-salinity-impact.ill1", "class": "B", "src": "media/latyshova.mud-salinity-impact-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Влияние минерализации промывочной жидкости на электрокаротаж", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.mud-drilling-invasion-zone", "type": "prerequisite"}], "claims": [{"id": "mud-salinity-impact.c1", "kind": "observation", "text": "Минерализация фильтрата глинистого раствора связывается геофизиками с его удельным сопротивлением $\\rho_ф$ и неоднозначно влияет на эффективность геофизических методов.", "quote": "Минерализация С фильтрата глинистого раствора, которую геофизики обычно связывают с удельным сопротивлением фильтрата $\\rho_ф$, неоднозначно влияет на эффективность различных геофизических методов.", "unit": "u091-02", "page": 91, "by": "model", "verified": true}, {"id": "mud-salinity-impact.c2", "kind": "observation", "text": "Для большинства районов наиболее типично бурение на пресном глинистом растворе, где $\\rho_ф > \\rho_п$.", "quote": "Наиболее типично для большинства районов бурение на пресном глинистом растворе ($\\rho_ф > \\rho_п$)", "unit": "u091-02", "page": 91, "by": "model", "verified": true}, {"id": "mud-salinity-impact.c3", "kind": "observation", "text": "При пресном растворе коллекторы и малоглинистые породы выделяются отрицательными аномалиями СП и положительными приращениями микрозондов.", "quote": "для которого характерно выделение коллекторов и пород с низкой глинистостью отрицательными аномалиями на диаграмме СП, и выделение коллекторов по положительным приращениям на диаграммах микрозондов.", "unit": "u091-02", "page": 91, "by": "model", "verified": true}, {"id": "mud-salinity-impact.c4", "kind": "observation", "text": "С ростом минерализации и приближением $\\rho_ф$ к $\\rho_п$ резко снижается эффективность СП и микрозондов, а также ухудшается эффективность индукционного метода.", "quote": "С ростом минерализации глинистого раствора и приближением величины $\\rho_ф$ к величине $\\rho_п$ резко снижается эффективность методов СП и микрозондов как средств выделения коллектора, а также существенно уменьшается эффективность индукционного метода для изучения разреза в целом.", "unit": "u091-02", "page": 91, "by": "model", "verified": true}, {"id": "mud-salinity-impact.c5", "kind": "inference", "text": "Приближение $\\rho_ф$ к $\\rho_п$ создает благоприятные условия для оценки продуктивности коллектора разноглубинной электрометрией.", "quote": "Одновременно приближение $\\rho_ф$, к $\\rho_п$ создает более благоприятные условия для оценки продуктивности коллектора по комплексу разноглубинных методов электрометрии", "unit": "u091-03", "page": 91, "by": "model", "verified": true}, {"id": "mud-salinity-impact.c6", "kind": "observation", "text": "При $\\rho_ф = \\rho_п$ в продуктивных коллекторах формируется только понижающее проникновение ($\\rho_п \u003c \\rho_пп$), а в водоносных — $\\rho_п \\approx \\rho_пп$.", "quote": "поскольку при $\\rho_ф = \\rho_п$ в продуктивных коллекторах формируются зоны только понижающего проникновения ($\\rho_п \u003c \\rho_пп$), а в водоносных — $\\rho_п \\approx \\rho_пп$.", "unit": "u091-03", "page": 91, "by": "model", "verified": true}], "term_ids": ["t-mud-filtrate-resistivity", "t-formation-water-resistivity", "t-spontaneous-potential-sp-log", "t-microlog"], "units": ["u091-02", "u091-03"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "latyshova.alternative-drilling-fluids", "order": 5, "part_id": "p2", "minutes": 3, "title": "Особенности ГИС при бурении на воде и нефильтрующихся растворах", "book_title": "§ 17. УСЛОВИЯ ВСКРЫТИЯ РАЗРЕЗОВ СКВАЖИН И ИХ ВЛИЯНИЕ НА КОМПЛЕКС ГЕОФИЗИЧЕСКИХ ИССЛЕДОВАНИЙ", "pages": [91, 91], "difficulty": {"primary": "И", "secondary": "Н"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: контринтуитивность. Раздел содержит четкое правило принятия решений (матрицу применимости методов ГИС в зависимости от типа бурового раствора), идеальное для интерактивной блок-схемы или короткого структурированного текста.", "scene_template": "tool-in-well"}, "summary": [{"text": "Тип промывочной жидкости определяет применимость методов каротажа и глубину проникновения фильтрата в пласт.", "claims": ["alternative-drilling-fluids.c1", "alternative-drilling-fluids.c4"], "page": 91, "by": "model"}, {"text": "Бурение на воде формирует глубокие зоны проникновения, полностью блокируя оценку насыщения электрометрией.", "claims": ["alternative-drilling-fluids.c1", "alternative-drilling-fluids.c2"], "page": 91, "by": "model"}, {"text": "Нефильтрующиеся растворы на непроводящей основе исключают прямой электрический контакт, оставляя доступными индукционный, ядерные и акустические методы.", "claims": ["alternative-drilling-fluids.c4", "alternative-drilling-fluids.c5", "alternative-drilling-fluids.c6"], "page": 91, "by": "model"}], "how_it_works": [{"text": "При бурении на технической воде с глинистыми породами образуется раствор с предельно высокой водоотдачей.", "claims": ["alternative-drilling-fluids.c1"], "page": 91, "by": "model"}, {"text": "Глубокая зона проникновения делает неэффективными микрозонды и каверномер для выделения коллекторов.", "claims": ["alternative-drilling-fluids.c2"], "page": 91, "by": "model"}, {"text": "Высокоминерализованная вода применяется оправданно лишь в пластах солей для защиты от растворения и кавернообразования.", "claims": ["alternative-drilling-fluids.c3"], "page": 91, "by": "model"}, {"text": "Нефильтрующиеся растворы (ИБР, ВИЭР) имеют бесконечно высокое удельное сопротивление и не образуют глинистую корку.", "claims": ["alternative-drilling-fluids.c4", "alternative-drilling-fluids.c6"], "page": 91, "by": "model"}, {"text": "Из-за отсутствия электрического контакта из электрометрии при нефильтрующемся растворе работает исключительно индукционный зонд.", "claims": ["alternative-drilling-fluids.c5"], "page": 91, "by": "model"}, {"text": "Малая глубина проникновения нефильтрующегося раствора создает оптимальные условия для ядерных и акустических методов.", "claims": ["alternative-drilling-fluids.c4", "alternative-drilling-fluids.c6"], "page": 91, "by": "model"}], "steps": [], "examples": [], "numbers": [], "formulas": [{"latex": "\\rho_п \\rightarrow \\infty, \\quad \\delta_p = 0", "page": 91, "vars": [{"sym": "\\rho_п", "meaning": "Удельное электрическое сопротивление промывочной жидкости (раствора)", "unit": "Ом·м"}, {"sym": "\\delta_p", "meaning": "Толщина глинистой корки / проникновение фильтрата", "unit": "мм"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Тип бурового раствора (техническая вода, высокоминерализованная вода, ИБР, ВИЭР), показатели водоотдачи и удельного электрического сопротивления промывочной жидкости.", "output": "Допустимый набор сенсоров (комплекс ГИС) и маска применимости методов электрометрии.", "breaks": [{"text": "Алгоритмы обработки микрокаверномерии и электрических зондов дают сбой при непроводящей углеводородной основе раствора из-за отсутствия гальванического контакта.", "claims": ["alternative-drilling-fluids.c4", "alternative-drilling-fluids.c5"], "page": 91, "by": "model"}, {"text": "При бурении на воде зоны проникновения слишком глубоки, поэтому классический инференс насыщения по электрическим методам невалиден.", "claims": ["alternative-drilling-fluids.c1", "alternative-drilling-fluids.c2"], "page": 91, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Если в базах данных признак «тип раствора» пропущен, классификатор насыщения будет ошибочно воспринимать отсутствие глинистой корки как отсутствующий или плотный пласт.", "claims": ["alternative-drilling-fluids.c6"], "page": 91, "by": "model"}]}, "analogy": {"text": "Выбор раствора подобен выбору среды передачи сигнала в физическом канале связи (коаксиальный кабель против оптиковолокна): непроводящий раствор полностью изолирует электрический ток, переключая каналы сбора данных исключительно на беспроводные/индукционные и акустические методы.", "breaks_where": "Аналогия ломается в том, что раствор также физически размывает или консервирует стенки скважины (растворение солей), изменяя геометрию самого канала измерения."}, "now_practice": [{"text": "Сегодня ограничение гальванического контакта в диэлектрических растворах обходится применением специализированных каротажных комплексов в процессе бурения (LWD) и высокочастотных индукционных приборов.", "claims": ["alternative-drilling-fluids.c5"], "page": 91, "by": "model"}], "layers": {"mechanism": [{"text": "Высокая водоотдача технической воды порождает глубокое проникновение фильтрата в поры, экранируя естественное насыщение коллектора.", "claims": ["alternative-drilling-fluids.c1", "alternative-drilling-fluids.c2"], "page": 91, "by": "model"}, {"text": "Диэлектрическая основа ИБР и ВИЭР делает гальванический ток нулевым, из-за чего прямое измерение сопротивления становиться невозможным.", "claims": ["alternative-drilling-fluids.c4", "alternative-drilling-fluids.c5"], "page": 91, "by": "model"}], "practice": [{"text": "При бурении на ИБР и ВИЭР традиционный электрический комплекс заменяют на индукционный зонд, а также радиоактивные и акустические приборы.", "claims": ["alternative-drilling-fluids.c5", "alternative-drilling-fluids.c6"], "page": 91, "by": "model"}, {"text": "Для предупреждения образования огромных каверн в соляных толщах бурение проводят на растворах с максимальной минерализацией солей.", "claims": ["alternative-drilling-fluids.c3"], "page": 91, "by": "model"}], "nuances": [{"text": "Отсутствие глинистой корки при нефильтрующихся растворах лишает интерпретатора стандартного косвенного признака коллектора.", "claims": ["alternative-drilling-fluids.c6"], "page": 91, "by": "model"}], "deeper": []}, "book_tasks": [], "illustrations": [{"id": "latyshova.alternative-drilling-fluids.ill1", "class": "B", "src": "media/latyshova.alternative-drilling-fluids-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Особенности ГИС при бурении на воде и нефильтрующихся растворах", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.mud-drilling-invasion-zone", "type": "prerequisite"}], "claims": [{"id": "alternative-drilling-fluids.c1", "kind": "observation", "text": "При бурении на технической воде разрезов с глинистыми породами образуется раствор с очень высокой водоотдачей и глубокими зонами проникновения.", "quote": "Если в разрезе есть глины и глинистые породы, при бурении на воде возникает подобие глинистого раствора с очень высокой водоотдачей.", "unit": "u091-04", "page": 91, "by": "model", "verified": true}, {"id": "alternative-drilling-fluids.c2", "kind": "inference", "text": "Глубокие зоны проникновения исключают оценку насыщения геофизическими методами и сводят к минимуму эффективность микрозондов и каверномера.", "quote": "В этом случае в связи с образованием глубоких зон проникновения оценка характера насыщения коллекторов геофизическими методами, как правило, исключена, а эффективность микрозондов и каверномера как средств выделения коллектора крайне низка.", "unit": "u091-04", "page": 91, "by": "model", "verified": true}, {"id": "alternative-drilling-fluids.c3", "kind": "inference", "text": "Применение воды высокой минерализации обосновано только при прохождении мощных пластов солей для предотвращения кавернообразования.", "quote": "Бурение на воде высокой минерализации, близкой к минерализации насыщенного раствора, оправдано только при наличии разреза с мощными пластами каменных и калийных солей", "unit": "u091-04", "page": 91, "by": "model", "verified": true}, {"id": "alternative-drilling-fluids.c4", "kind": "observation", "text": "Нефильтрующиеся растворы на непроводящей основе имеют бесконечно высокое сопротивление и минимальное проникновение в пласт.", "quote": "Для ГИС важнейшими их особенностями являются огромное удельное сопротивление ($\\rho_п \\rightarrow \\infty$, $\\delta_p = 0$) и отсутствие (или очень малое) проникновения в коллекторы.", "unit": "u091-05", "page": 91, "by": "model", "verified": true}, {"id": "alternative-drilling-fluids.c5", "kind": "inference", "text": "Отсутствие электрического контакта с породой при нефильтрующихся растворах оставляет применимым только индукционный зонд из электрометрии.", "quote": "Из этих особенностей растворов вытекают ограничения использования геофизического комплекса методов только теми, где не требуется прямого электрического контакта с породой. Из методов электрометрии применим только индукционный зонд.", "unit": "u091-05", "page": 91, "by": "model", "verified": true}, {"id": "alternative-drilling-fluids.c6", "kind": "inference", "text": "Отсутствие глинистых корок блокирует традиционные методы выделения коллекторов, но создает благоприятные условия для ядерных и акустических методов.", "quote": "Отсутствие глинистых корок не позволяет использовать традиционные методы выделения коллекторов. В то же время создаются благоприятные условия для изучения характера насыщения последних геофизическими методами средней и малой глубинности (например, ядерными и акустическими).", "unit": "u091-05", "page": 91, "by": "model", "verified": true}], "term_ids": ["t-lime-bitumen-mud", "t-invert-emulsion-water-mud", "t-induction-log-probe"], "units": ["u091-04", "u091-05"], "video_criteria": ["counterintuitive"], "fallback": false}, {"id": "latyshova.reservoir-lithology-pore-types", "order": 6, "part_id": "p3", "minutes": 3, "title": "Типы разрезов и структура порового пространства коллекторов", "book_title": "§ 18. ТИПЫ ИЗУЧАЕМЫХ РАЗРЕЗОВ И КОЛЛЕКТОРОВ", "pages": [91, 91], "difficulty": {"primary": "Ф", "secondary": "П"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: скачок масштаба. Концептуальная классификация типов пород и видов пустотного пространства лучше всего подходит для четкого текстового структурирования с таблицами или схемами морфологии пор.", "scene_template": "parametric-plot"}, "summary": [{"text": "Разрезы горных пород разделяются по литологии на терригенные, карбонатные, гидрохимические, смешанные и вулканогенные, а их коллекторы — по морфологии порового пространства на межзерновые, трещинные, кавернозно-трещинные и смешанные типы.", "claims": ["reservoir-lithology-pore-types.c1", "reservoir-lithology-pore-types.c3"], "page": 91, "by": "model"}, {"text": "В терригенном разрезе преобладают межзерновые коллекторы (с различной глинистостью и типом цемента), а в карбонатном — кавернозно-трещинные и смешанные типы с вторичными порами и карстовыми пустотами.", "claims": ["reservoir-lithology-pore-types.c4", "reservoir-lithology-pore-types.c6", "reservoir-lithology-pore-types.c7"], "page": 91, "by": "model"}], "how_it_works": [{"text": "Основными типами разреза являются терригенный, карбонатный и гидрохимический. Встречаются также смешанные типы (терригенно-карбонатные, карбонатно-гидрохимические, терригенно-гидрохимические) и вулканогенные разрезы.", "claims": ["reservoir-lithology-pore-types.c1"], "page": 91, "by": "model"}, {"text": "Вулканогенные разрезы занимают особое положение: по вещественному составу они близки к терригенным, а по структуре порового пространства — к карбонатным (за исключением карстовых образований).", "claims": ["reservoir-lithology-pore-types.c2"], "page": 91, "by": "model"}, {"text": "По морфологии порового пространства коллекторы классифицируют на межзерновые, трещинные, кавернозно-трещинные и смешанные (например, трещинно-межзерновые, кавернозно-межзерново-трещинные, карстово-кавернозные).", "claims": ["reservoir-lithology-pore-types.c3"], "page": 91, "by": "model"}, {"text": "В терригенном разрезе преобладают межзерновые коллекторы. С геофизической точки зрения их делят на высокопористые и низкопористые, а также на чистые (слабоглинистые) и глинистые.", "claims": ["reservoir-lithology-pore-types.c4", "reservoir-lithology-pore-types.c5"], "page": 91, "by": "model"}, {"text": "Глинистые межзерновые коллекторы классифицируют по характеру распределения глинистого материала на породы с рассеянной, слоистой и гнездовидной глинистостью. Отдельно выделяют породы с неактивным (карбонатным или силикатным) цементом.", "claims": ["reservoir-lithology-pore-types.c6"], "page": 91, "by": "model"}, {"text": "В карбонатном разрезе наряду с межзерновыми распространены кавернозно-трещинные и смешанные коллекторы. Высокопористые карбонатные коллекторы часто содержат долю вторичных пор выщелачивания и перекристаллизации.", "claims": ["reservoir-lithology-pore-types.c4", "reservoir-lithology-pore-types.c7"], "page": 91, "by": "model"}, {"text": "Высокопродуктивную группу в карбонатах образуют трещинно-кавернозно-межзерновые коллекторы с крупными карстовыми пустотами и полостями выщелачивания. При этом чистые трещинные коллекторы могут встречаться в карбонатных, терригенных и вулканогенных породах.", "claims": ["reservoir-lithology-pore-types.c7", "reservoir-lithology-pore-types.c8"], "page": 91, "by": "model"}], "steps": [], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": {"wrong": "Коллекторы во всех типах пород устроены одинаково и представляют собой простые межзерновые сита.", "right": [{"text": "Структура порового пространства существенно различается: в терригенных породах преобладают межзерновые поры, а в карбонатных и вулканогенных — сложные смешанные структуры с кавернами, трещинами и карстовыми пустотами.", "claims": ["reservoir-lithology-pore-types.c2", "reservoir-lithology-pore-types.c4", "reservoir-lithology-pore-types.c7"], "page": 91, "by": "model"}]}, "data_meaning": {"input": "Данные геофизических исследований скважин (ГИС), описывающие литологию и характер порового пространства.", "output": "Классификация типа разреза (терригенный, карбонатный, вулканогенный) и типа коллектора (межзерновой, трещинный, кавернозный) с учетом характера глинистости.", "breaks": [{"text": "Алгоритмы, обученные только на межзерновых терригенных коллекторах, дают сбой на карбонатных и вулканогенных разрезах из-за наличия трещин и каверн вторичного происхождения.", "claims": ["reservoir-lithology-pore-types.c2", "reservoir-lithology-pore-types.c4", "reservoir-lithology-pore-types.c7"], "page": 91, "by": "model"}], "hypotheses": [{"text": "Гипотеза: Для устойчивой работы ML-модели литографический тип разреза и тип глинистости (слоистая, рассеянная, гнездовидная) должны выступать ключевыми категориальными фичами.", "claims": ["reservoir-lithology-pore-types.c1", "reservoir-lithology-pore-types.c6"], "page": 91, "by": "model"}]}, "analogy": {"text": "Структуру порового пространства можно сравнить со структурой хранения данных: межзерновой коллектор похож на однородный массив фиксированного размера (плоская таблица), а трещинно-кавернозный — на сложный граф или гибридное хранилище с нерегулярными связями и крупными BLOB-объектами (кавернами).", "breaks_where": "Аналогия ломается при изменении давления: фильтрация флюида в реальной породе подчиняется законам гидродинамики фильтрации, а не вызовам API."}, "now_practice": [], "layers": {"mechanism": [{"text": "Морфология порового пространства определяет тип фильтрации флюида: от регулярных межзерновых пор до сложных трещинно-кавернозных систем выщелачивания.", "claims": ["reservoir-lithology-pore-types.c3", "reservoir-lithology-pore-types.c7"], "page": 91, "by": "model"}], "practice": [{"text": "При интерпретации терригенного разреза необходимо разделять тип глинистости (рассеянная, слоистая, гнездовидная), так как она меняет геофизические отклики.", "claims": ["reservoir-lithology-pore-types.c5", "reservoir-lithology-pore-types.c6"], "page": 91, "by": "model"}], "nuances": [{"text": "Вулканогенный разрез совмещает химический состав терригенных пород со сложной кавернозно-трещинной структурой карбонатов.", "claims": ["reservoir-lithology-pore-types.c2"], "page": 91, "by": "model"}], "deeper": [{"text": "Вторичные процессы (выщелачивание, перекристаллизация, карстообразование) создают высокопродуктивные пустотные пространства крупного объема.", "claims": ["reservoir-lithology-pore-types.c7"], "page": 91, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "latyshova.reservoir-lithology-pore-types.ill1", "class": "B", "src": "media/latyshova.reservoir-lithology-pore-types-links.svg", "alt": "Карта шага: на что он опирается и куда ведёт: Типы разрезов и структура порового пространства коллекторов", "caption": "Карта шага: на что он опирается и куда ведёт", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.gis-interpretation-tasks", "type": "prerequisite"}], "claims": [{"id": "reservoir-lithology-pore-types.c1", "kind": "observation", "text": "Основными типами разреза являются терригенный, карбонатный и гидрохимический, а также смешанные типы и вулканогенные разрезы.", "quote": "В качестве основных типов разреза рассматривают терригенный, карбонатный и гидрохимический.", "unit": "u091-07", "page": 91, "by": "model", "verified": true}, {"id": "reservoir-lithology-pore-types.c2", "kind": "observation", "text": "Вулканогенные разрезы по вещественному составу близки к терригенным, а по структуре порового пространства — к карбонатным.", "quote": "вулканогенные, которые по вещественному составу близки к терригенным, а по структуре порового пространства коллекторов — к карбонатным (за исключением карстовых образований).", "unit": "u091-07", "page": 91, "by": "model", "verified": true}, {"id": "reservoir-lithology-pore-types.c3", "kind": "observation", "text": "По морфологии порового пространства коллекторы делятся на межзерновые, трещинные, кавернозно-трещинные и смешанные типы.", "quote": "По морфологии порового пространства коллекторы разделяют на межзерновые, трещинные, кавернозно-трещинные и смешанные типы.", "unit": "u091-08", "page": 91, "by": "model", "verified": true}, {"id": "reservoir-lithology-pore-types.c4", "kind": "observation", "text": "В терригенном разрезе преобладают межзерновые коллекторы, а в карбонатном — межзерновые, кавернозно-трещинные и смешанные.", "quote": "В терригенном разрезе преобладают межзерновые коллекторы, в карбонатном наряду с межзерновыми - кавернозно-трещинные и смешанные.", "unit": "u091-08", "page": 91, "by": "model", "verified": true}, {"id": "reservoir-lithology-pore-types.c5", "kind": "observation", "text": "В терригенных межзерновых коллекторах с геофизической точки зрения выделяют высокопористые, низкопористые, чистые и глинистые породы.", "quote": "С геофизической точки зрения в терригенном разрезе среди межзерновых коллекторов выделяют высокопористые и низкопористые; чистые (слабоглинистые) и глинистые.", "unit": "u091-09", "page": 91, "by": "model", "verified": true}, {"id": "reservoir-lithology-pore-types.c6", "kind": "observation", "text": "Глинистые коллекторы разделяются по характеру распределения глинистого материала на породы с рассеянной, слоистой и гнездовидной глинистостью.", "quote": "Последние в свою очередь разделяют по характеру распределения глинистого материала на коллекторы с рассеянной, слоистой и гнездовидной глинистостью.", "unit": "u091-09", "page": 91, "by": "model", "verified": true}, {"id": "reservoir-lithology-pore-types.c7", "kind": "observation", "text": "В карбонатном разрезе высокопродуктивную группу составляют трещинно-кавернозно-межзерновые коллекторы с крупными пустотами и полостями карстового типа.", "quote": "Особую группу составляют высокопродуктивные трещинно-кавернозно-межзерновые коллекторы с наличием крупных пустот и полостей выщелачивания карстового типа.", "unit": "u091-09", "page": 91, "by": "model", "verified": true}, {"id": "reservoir-lithology-pore-types.c8", "kind": "observation", "text": "Трещинные коллекторы встречаются в карбонатных, терригенных и вулканогенных породах.", "quote": "Трещинные коллекторы встречаются в карбонатных, терригенных и вулканогенных породах.", "unit": "u091-09", "page": 91, "by": "model", "verified": true}], "term_ids": ["t-terrigenous-section", "t-carbonate-section", "t-vuggy-fractured-reservoir"], "units": ["u091-07", "u091-08", "u091-09"], "video_criteria": ["scale_jump"], "fallback": false}, {"id": "latyshova.gis-methods-classification-by-task", "order": 7, "part_id": "p3", "minutes": 3, "title": "Деление комплекса ГИС по решаемым геологическим задачам", "book_title": "§ 18. ТИПЫ ИЗУЧАЕМЫХ РАЗРЕЗОВ И КОЛЛЕКТОРОВ", "pages": [91, 92], "difficulty": {"primary": "Пр", "secondary": "И"}, "threshold": true, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет. Концептуальная классификация методов ГИС по задачам лучше всего воспринимается в виде структурированного текста с наглядными выжимками для IT-специалистов.", "scene_template": "step-flow"}, "summary": [{"text": "Стандартный комплекс ГИС делят на четыре группы по решаемым геологическим задачам.", "claims": ["gis-methods-classification-by-task.c1", "gis-methods-classification-by-task.c2"], "page": 91, "by": "model"}, {"text": "Группы определяют выделение коллекторов, измерение пористости, глинистости и оценку продуктивности.", "claims": ["gis-methods-classification-by-task.c2"], "page": 91, "by": "model"}], "how_it_works": [{"text": "Первая группа методов выделяет коллекторы с межзерновой пористостью.", "claims": ["gis-methods-classification-by-task.c2", "gis-methods-classification-by-task.c3"], "page": 91, "by": "model"}, {"text": "Микрозонды и каверномер фиксируют фильтрующие интервалы с глинистой коркой при бурении на глинистом растворе.", "claims": ["gis-methods-classification-by-task.c3"], "page": 91, "by": "model"}, {"text": "Ядерно-магнитный метод выделяет породы с эффективной пористостью.", "claims": ["gis-methods-classification-by-task.c4"], "page": 91, "by": "model"}, {"text": "Вторую группу образуют гамма-гамма-метод, акустический и нейтронные методы для определения пористости.", "claims": ["gis-methods-classification-by-task.c5"], "page": 91, "by": "model"}, {"text": "Они одинаково применимы при бурении на глинистом растворе, технической воде и нефильтрующихся растворах.", "claims": ["gis-methods-classification-by-task.c5"], "page": 91, "by": "model"}, {"text": "Третья группа оценивает глинистость с помощью методов собственных потенциалов (СП) и естественной радиоактивности (ГМ).", "claims": ["gis-methods-classification-by-task.c6"], "page": 91, "by": "model"}, {"text": "Метод СП дифференцирует терригенный разрез по относительной глинистости ηг.", "claims": ["gis-methods-classification-by-task.c7"], "page": 92, "by": "model"}, {"text": "В карбонатном разрезе СП определяет относительное содержание нерастворимого остатка ηн.", "claims": ["gis-methods-classification-by-task.c7"], "page": 92, "by": "model"}, {"text": "СП применим на глинистом растворе и воде при условии ρф > ρн.", "claims": ["gis-methods-classification-by-task.c7"], "page": 92, "by": "model"}, {"text": "Гамма-метод (ГМ) дифференцирует терригенный разрез по объемной глинистости kг.", "claims": ["gis-methods-classification-by-task.c8"], "page": 92, "by": "model"}, {"text": "В карбонатном разрезе ГМ определяет объемное содержание нерастворимого остатка kн.", "claims": ["gis-methods-classification-by-task.c8"], "page": 92, "by": "model"}, {"text": "ГМ применим во всех скважинах независимо от типа раствора и наличия обсадки.", "claims": ["gis-methods-classification-by-task.c8"], "page": 92, "by": "model"}], "steps": [{"text": "Стандартный комплекс ГИС разделяют по четырем геологическим задачам.", "claims": ["gis-methods-classification-by-task.c1", "gis-methods-classification-by-task.c2"], "page": 91, "by": "model"}, {"text": "Первая группа идентифицирует пласты-коллекторы в разрезе.", "claims": ["gis-methods-classification-by-task.c3", "gis-methods-classification-by-task.c4"], "page": 91, "by": "model"}, {"text": "Вторая и третья группы измеряют пористость и глинистость пород.", "claims": ["gis-methods-classification-by-task.c5", "gis-methods-classification-by-task.c6"], "page": 91, "by": "model"}, {"text": "Четвертая группа выполняет оценку продуктивности пластов.", "claims": ["gis-methods-classification-by-task.c2"], "page": 91, "by": "model"}], "examples": [], "numbers": [], "formulas": [{"latex": "\\rho_{\\text{ф}} > \\rho_{\\text{н}}", "page": 92, "vars": [{"sym": "\\rho_{\\text{ф}}", "meaning": "Удельное сопротивление фильтрата бурового раствора", "unit": "Ом·м"}, {"sym": "\\rho_{\\text{н}}", "meaning": "Удельное сопротивление пластовой воды", "unit": "Ом·м"}]}], "tables": [], "misconception": {"wrong": "Гамма-каротаж измеряет глинистость напрямую.", "right": [{"text": "Гамма-метод измеряет естественную радиоактивность пород.", "claims": ["gis-methods-classification-by-task.c6", "gis-methods-classification-by-task.c8"], "page": 91, "by": "model"}, {"text": "По этим измерениям терригенный разрез дифференцируют по объемной глинистости kг.", "claims": ["gis-methods-classification-by-task.c8"], "page": 92, "by": "model"}]}, "data_meaning": {"input": "Каротажные кривые (СП, ГК, АК, НК, ГГК, ЯМК, микрозонды, каверномер) и удельное сопротивление фильтрата раствора ρф.", "output": "Интервалы коллекторов, коэффициенты пористости, показатели глинистости (ηг, kг) или нерастворимого остатка (ηн, kн).", "breaks": [{"text": "Применение СП для оценки глинистости ломается, если не соблюдается условие ρф > ρн.", "claims": ["gis-methods-classification-by-task.c7"], "page": 92, "by": "model"}], "hypotheses": [{"text": "Гипотеза: в машинном обучении группы методов ГИС формируют изолированные блоки признаков (feature subset) под конкретные целевые переменные.", "claims": [], "page": 91, "by": "model"}]}, "analogy": {"text": "Комплекс ГИС аналогичен набору специализированных микросервисов или мультисенсорному ансамблю: каждый датчик решает строго свою задачу целевой классификации.", "breaks_where": "Аналогия ломается, так как физические условия работы датчиков ГИС ограничены средой (типом раствора и соотношением ρф > ρн)."}, "now_practice": [{"text": "Сегодня комплексирование данных ГИС и выделение интервалов обычно выполняется в специализированном ПО интерпретации.", "claims": [], "page": 91, "by": "model"}], "layers": {"mechanism": [{"text": "Разделение ГИС на группы основано на физической связи между измеряемым параметром и геологическим свойством породы.", "claims": ["gis-methods-classification-by-task.c1", "gis-methods-classification-by-task.c2"], "page": 91, "by": "model"}], "practice": [{"text": "Для оценки пористости применяются ГГМ, АК и НК при любом типе бурового раствора.", "claims": ["gis-methods-classification-by-task.c5"], "page": 91, "by": "model"}], "nuances": [{"text": "Метод СП эффективен для определения глинистости только при выполнении физического условия ρф > ρн.", "claims": ["gis-methods-classification-by-task.c7"], "page": 92, "by": "model"}, {"text": "Гамма-метод применим в обсаженных скважинах и при любом типе раствора.", "claims": ["gis-methods-classification-by-task.c8"], "page": 92, "by": "model"}], "deeper": [{"text": "В карбонатных разрезах СП и ГМ оценивают не глинистость, а нерастворимый остаток ηн и kн.", "claims": ["gis-methods-classification-by-task.c7", "gis-methods-classification-by-task.c8"], "page": 92, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "latyshova.gis-methods-classification-by-task.ill1", "class": "B", "src": "media/latyshova.gis-methods-classification-by-task-steps.svg", "alt": "Порядок действий по тексту автора: Деление комплекса ГИС по решаемым геологическим задачам", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.gis-interpretation-tasks", "type": "prerequisite"}, {"to": "latyshova.reservoir-lithology-pore-types", "type": "prerequisite"}], "claims": [{"id": "gis-methods-classification-by-task.c1", "kind": "observation", "text": "Современный стандартный комплекс ГИС делят по характеру решаемых задач на четыре группы методов.", "quote": "Современный стандартный комплекс геофизических методов, используемых для изучения разрезов скважин при большом разнообразии их физической сущности, по характеру решаемых задач можно разделить на группы методов:", "unit": "u091-10", "page": 91, "by": "model", "verified": true}, {"id": "gis-methods-classification-by-task.c2", "kind": "observation", "text": "Группы методов ГИС включают выделение коллекторов, определение пористости, определение глинистости и оценку продуктивности.", "quote": "1) выделения коллекторов (межзерновых); 2) определения пористости; 3) определения глинистости; 4) оценки продуктивности.", "unit": "u091-10", "page": 91, "by": "model", "verified": true}, {"id": "gis-methods-classification-by-task.c3", "kind": "observation", "text": "Микрозонды и каверномер определяют фильтрующие интервалы с глинистой коркой при бурении на глинистом растворе.", "quote": "В первую группу входят микрозонды и каверномер, позволяющие установить в разрезах скважин фильтрующие интервалы — коллекторы с межзерновой пористостью, на которых образуется глинистая корка при бурении на глинистом растворе.", "unit": "u091-10", "page": 91, "by": "model", "verified": true}, {"id": "gis-methods-classification-by-task.c4", "kind": "observation", "text": "Ядерно-магнитный метод выделяет породы с эффективной пористостью.", "quote": "К этой же группе относится ядерно-магнитный метод, выделяющий в разрезе породы с эффективной пористостью.", "unit": "u091-10", "page": 91, "by": "model", "verified": true}, {"id": "gis-methods-classification-by-task.c5", "kind": "observation", "text": "Гамма-гамма, акустический и нейтронные методы определяют пористость и применимы в скважинах с глинистым раствором, водой и нефильтрующимися растворами.", "quote": "Группу методов пористости составляют гамма-гамма-метод, акустический и нейтронные методы; они в одинаковой степени применимы И", "secondary": "Ф"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: цепочка «причина → следствие». Формат подходит для текстово-графического разбора с интерактивным комплексированием методов сопротивления и пористости.", "scene_template": "tool-in-well"}, "summary": [{"text": "Петрофизический параметр Pн связывает геофизические свойства породы с коэффициентом нефтегазонасыщения коллектора.", "claims": ["fluid-saturation-resistivity-parameter.c1"], "page": 92, "by": "model"}, {"text": "Для оценки продуктивности комплексируют методы сопротивления и методы пористости.", "claims": ["fluid-saturation-resistivity-parameter.c3", "fluid-saturation-resistivity-parameter.c5"], "page": 92, "by": "model"}], "how_it_works": [{"text": "Главным параметром оценки продуктивности является параметр насыщения Pн.", "claims": ["fluid-saturation-resistivity-parameter.c1"], "page": 92, "by": "model"}, {"text": "Порода считается нефтегазосодержащей при значении Pн = ρн/ρн > 1.", "claims": ["fluid-saturation-resistivity-parameter.c2"], "page": 92, "by": "model"}, {"text": "Значение ρн в числителе определяют методами сопротивления.", "claims": ["fluid-saturation-resistivity-parameter.c3"], "page": 92, "by": "model"}, {"text": "Знаменатель рассчитывают методами пористости при известном удельном сопротивлении воды.", "claims": ["fluid-saturation-resistivity-parameter.c3"], "page": 92, "by": "model"}, {"text": "Методы сопротивления обязательно комплексируют с методами пористости.", "claims": ["fluid-saturation-resistivity-parameter.c5"], "page": 92, "by": "model"}], "steps": [{"text": "Измеряют удельное сопротивление неизмененной части пласта зондами с разными радиусами.", "claims": ["fluid-saturation-resistivity-parameter.c4"], "page": 92, "by": "model"}, {"text": "Определяют параметры пористости пласта и удельное сопротивление пластовой воды.", "claims": ["fluid-saturation-resistivity-parameter.c3"], "page": 92, "by": "model"}, {"text": "Рассчитывают или оценивают значение параметра насыщения Pн.", "claims": ["fluid-saturation-resistivity-parameter.c3", "fluid-saturation-resistivity-parameter.c5"], "page": 92, "by": "model"}, {"text": "Сопоставляют Pн с пороговым значением 1 для оценки наличия углеводородов.", "claims": ["fluid-saturation-resistivity-parameter.c2"], "page": 92, "by": "model"}, {"text": "Оценивают радиальное изменение сопротивления и проникновение фильтрата электрическими методами.", "claims": ["fluid-saturation-resistivity-parameter.c6"], "page": 92, "by": "model"}], "examples": [], "numbers": [{"text": "При Pн > 1 порода классифицируется как нефте- или газосодержащая.", "claims": ["fluid-saturation-resistivity-parameter.c2"], "page": 92, "by": "model"}], "formulas": [{"latex": "P_н = \\frac{\\rho_н}{\\rho_{н\\rho}} > 1", "page": 92, "vars": [{"sym": "P_н", "meaning": "параметр насыщения", "unit": "безразмерная величина"}, {"sym": "\\rho_н", "meaning": "удельное сопротивление неизмененной части пласта (числитель)", "unit": "Ом·м"}, {"sym": "\\rho_{н\\rho}", "meaning": "знаменатель выражения, определяемый по пористости и сопротивлению воды", "unit": "Ом·м"}]}], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Оценка нефтегазонасыщения требует комплексирования методов сопротивления и пористости.", "claims": ["fluid-saturation-resistivity-parameter.c3", "fluid-saturation-resistivity-parameter.c5"], "page": 92, "by": "model"}, {"text": "Нефтесодержащей является порода с параметром насыщения Pн > 1.", "claims": ["fluid-saturation-resistivity-parameter.c2"], "page": 92, "by": "model"}]}, "data_meaning": {"input": "Данные БЭЗ, экранированных и индукционных зондов с разным радиусом исследования, данные методов пористости и удельное сопротивление пластовой воды.", "output": "Оценка удельного сопротивления неизмененной части пласта и параметр насыщения Pн.", "breaks": [{"text": "Метод ломается, если неизвестно удельн

": ["laminated-reservoir-effective-thickness.c8"], "page": 104, "by": "model"}], "solution": [{"text": "Для решения необходимо определить относительную глинистость пачки, используя уравнение (63) с заданными значениями сопротивлений, а затем применить формулу (64).", "claims": ["laminated-reservoir-effective-thickness.c4", "laminated-reservoir-effective-thickness.c6"], "page": 102, "by": "model"}], "result": [{"text": "Итоговое значение эффективной толщины определяется после подстановки χ_cn в формулу (64).", "claims": ["laminated-reservoir-effective-thickness.c6"], "page": 102, "by": "model"}]}], "numbers": [{"text": "В примере рассматривается пачка общей толщиной 18 м с сопротивлениями 38 Ом·м, 2,2 Ом·м и 25 Ом·м. В другом случае упоминается пачка толщиной 28 м.", "claims": ["laminated-reservoir-effective-thickness.c7", "laminated-reservoir-effective-thickness.c8"], "page": 103, "by": "model"}], "formulas": [{"latex": "1 / \\rho_ {\\mathrm{n}} = \\chi_ {\\mathrm{cn}} / \\rho_ {\\mathrm{cn}} + (1 - \\chi_ {\\mathrm{cn}}) / \\rho_ {\\mathrm{nm}}", "page": 102, "vars": [{"sym": "ρ_n", "meaning": "удельное сопротивление пачки", "unit": "u102-01"}, {"sym": "χ_cn", "meaning": "относительная глинистость", "unit": "u102-01"}, {"sym": "ρ_cn", "meaning": "удельное сопротивление глины", "unit": "u102-01"}, {"sym": "ρ_nm", "meaning": "удельное сопротивление чистого коллектора", "unit": "u102-01"}]}, {"latex": "h_{sp} = h_n (1 - \\chi_{cn})", "page": 102, "vars": [{"sym": "h_sp", "meaning": "эффективная толщина пачки", "unit": "u102-04"}, {"sym": "h_n", "meaning": "общая толщина пачки", "unit": "u102-04"}]}], "tables": [], "misconception": {"wrong": "Тонкие прослои коллектора всегда можно выделить, если использовать приборы с высокой разрешающей способностью.", "right": [{"text": "Существуют пачки с настолько тонким чередованием слоев, что даже методы с максимальной разрешающей способностью не могут их разделить. В таких случаях эффективная толщина определяется только расчетны r-effective-thickness.c5"], "page": 102, "by": "model"}], "nuances": [{"text": "Присутствие глинистого цемента в плотных породах может искажать показания методов, что требует учета при выборе параметров.", "claims": ["laminated-reservoir-effective-thickness.c2"], "page": 101, "by": "model"}], "deeper": [{"text": "Использование палеток (рис. 72) позволяет учитывать влияние зоны проникновения на результаты измерений.", "claims": ["laminated-reservoir-effective-thickness.c6"], "page": 102, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "latyshova.laminated-reservoir-effective-thickness.ill1", "class": "B", "src": "media/latyshova.laminated-reservoir-effective-thickness-links.svg", "alt": "Карта шага: на что он опирается и куда ведёт: Расчет эффективной толщины неоднородных и слоистых пластов", "caption": "Карта шага: на что он опирается и куда ведёт", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.effective-thickness-and-fluid-contacts", "type": "prerequisite"}], "claims": [{"id": "laminated-reservoir-effective-thickness.c1", "kind": "observation", "text": "В мощном пласте эффективная толщина равна общей толщине минус сумма толщин неколлекторов.", "quote": "эффективная толщина h,ф определяется как разность толщин всего пласта h и суммы толщин прослоев неколлектора Σhпл: h,ф = h - Σhпл.", "unit": "u101-08", "page": 101, "by": "model", "verified": true}, {"id": "laminated-reservoir-effective-thickness.c2", "kind": "observation", "text": "Неколлекторы выделяются по микрозондам и низким значениям пористости.", "quote": "выделяются повышенными показаниями микрозондов, низкими значениями kп \u003c kп* при показаниях ГМ", "unit": "u101-08", "page": 101, "by": "model", "verified": true}, {"id": "laminated-reservoir-effective-thickness.c3", "kind": "observation", "text": "В тонкослоистых пачках прослои не выделяются, расчет ведется по интегральным характеристикам.", "quote": "отдельные прослои неколлекторов не выделя 3-01", "u104-01", "u104-03"], "video_criteria": ["scale_jump", "cause_effect"], "fallback": false}, {"id": "latyshova.terrigenous-reservoir-identification", "order": 21, "part_id": "p5", "minutes": 5, "title": "Выделение терригенных коллекторов по комплексу ГИС", "book_title": "Терригенный разрез", "pages": [104, 105], "difficulty": {"primary": "Пр", "secondary": "И"}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет. Текст с элементами визуального анализа диаграмм лучше всего подходит для объяснения процедуры интерпретации, так как требует сопоставления графиков и расчетных констант.", "scene_template": "step-flow"}, "summary": [{"text": "Выделение терригенных коллекторов основано на комплексном анализе данных ГИС, где физические свойства пород (сопротивление, плотность, акустическое время) используются как косвенные признаки для оценки пористости и проницаемости.", "claims": ["terrigenous-reservoir-identification.c1"], "page": 104, "by": "model"}, {"text": "Для определения коллекторов применяются граничные значения (пороги) параметров, полученные из уравнений среднего времени или плотностных моделей, что позволяет отсечь плотные прослои.", "claims": ["terrigenous-reservoir-identification.c2"], "page": 104, "by": "model"}], "how_it_works": [{"text": "В терригенном разрезе коллекторы выделяются по комплексу методов: акустическому (АК), гамма-гамма методу (ГГМ) и данным гидродинамических исследований (ГДК).", "claims": ["terrigenous-reservoir-identification.c3"], "page": 104, "by": "model"}, {"text": "Акустический метод использует время прохождения волны (ΔТ) для оценки пористости. Граничное значение ΔТгр позволяет отделить коллектор от плотных пород, используя константы для скелета (ΔТск) и флюида (ΔТф).", "claims": ["terrigenous-reservoir-identification.c4"], "page": 104, "by": "model"}, {"text": "Плотностной метод (ГГМ) измеряет объемную плотность (δп). Коллекторы выделяются при сравнении измеренной плотности с константами плотности скелета (δск) и флюида (δф) при заданном пороге пористости (kn,гр).", "claims": ["terrigenous-reservoir-identification.c5"], "page": 105, "by": "model"}], "steps": [{"text": "1. Анализ кривых ГИС (КС, ГМ, НГМ, АК) для выявления характера изменения свойств пласта. 2. Применение граничных значений (например, ΔТгр или kn,гр) для классификации интервалов как коллекторов. 3. Учет влияния плотных прослоев, которые могут составлять до 20% толщины пачки.", "claims": ["terrigenous-reservoir-identification.c6", "terrigenous-reservoir-identification.c7"], "page": 104, "by": "model"}], "examples": [{"title": "Расчет по акустическому методу", "page": 104, "figure": "рис. 74", "condition": [{"text": "Даны константы: ΔТск = 170 мкс/м, ΔТф = 580 мкс/м.", "claims": ["terrigenous-reservoir-identification.c8"], "page": 104, "by": "model"}], "solution": [{"text": "Использование уравнения среднего времени для определения граничного значения ΔТгр, соответствующего пористости коллектора.", "claims": ["terrigenous-reservoir-identification.c9"], "page": 104, "by": "model"}], "result": [{"text": "Определение интервалов, где ΔТ превышает ΔТгр, классифицируемых как коллекторы.", "claims": ["terrigenous-reservoir-identification.c10"], "page": 104, "by": "model"}]}], "numbers": [{"text": "Среднее удельное сопротивление пачки составляет 7,3 Ом·м. Плотные прослои занимают не более 20% от общей толщины.", "claims": ["terrigenous-reservoir-identification.c11"], "page": 104, "by": "model"}], "formulas": [{"latex": "\\Delta T_{гр}", "page": 104, "vars": [{"sym": "\\Delta T_{ex}", "meaning": "время в скелете", "unit": "мкс/м"}, {"sym": "\\Delta T_{\\phi \\mathrm{II}}", "meaning": "время в флюиде", "unit": "мкс/м"}]}], "tables": [], "misconception": {"wrong": "Каротажная кривая — это и есть порода, а не косвенное измерение.", "right": [{"text": "Кривые ГИС являются косвенными измерениями физических полей, которые требуют интерпретации через физические модели (например, уравнение я процедуры, так как она требует понимания логики совмещения кривых, а не простого перечисления фактов.", "scene_template": "step-flow"}, "summary": [{"text": "Метод нормализации диаграмм — это графический способ выделения коллекторов и оценки их продуктивности путем совмещения кривых электрического сопротивления и пористости.", "claims": ["logging-normalization-method.c1"], "page": 107, "by": "model"}, {"text": "В неколлекторах и водоносных пластах кривые принудительно совмещаются, а их последующее расхождение указывает на наличие углеводородов.", "claims": ["logging-normalization-method.c2"], "page": 107, "by": "model"}], "how_it_works": [{"text": "Метод заключается в наложении кривой удельного электрического сопротивления (ρn) фокусированного метода большой глубинности на кривую пористости (НМ, акустический метод или ГГМ).", "claims": ["logging-normalization-method.c1", "logging-normalization-method.c2"], "page": 107, "by": "model"}, {"text": "Для совмещения кривых в неколлекторах и водоносных коллекторах преобразуют масштаб одной из диаграмм, например, переводя линейный масштаб в логарифмический.", "claims": ["logging-normalization-method.c3", "logging-normalization-method.c4"], "page": 107, "by": "model"}, {"text": "Условие применимости: достаточная глубинность электрического метода для исследования неизмененной части водоносного коллектора и однородный минеральный состав пород.", "claims": ["logging-normalization-method.c2", "logging-normalization-method.c5"], "page": 107, "by": "model"}, {"text": "Расхождение кривых в интервале коллектора является признаком его продуктивности или наличия проникновения фильтрата глинистого раствора.", "claims": ["logging-normalization-method.c6"], "page": 107, "by": "model"}], "steps": [{"text": "1. Выбрать кривую сопротивления (ρn) и кривую пористости. 2. Привести их к единому масштабу. 3. Совместить кривые в интервалах неколлекторов. 4. Выделить зоны расхождения как продуктивные интервалы.", "claims": ["logging-normalization-method.c1", "logging-normalization-method.c4", "logging-normalization-method.c6"], "page": 107, "by": "model"}], "examples": [{"title": "Пример 54", "page": 107, "figure": "рис. 76", "condition": [{"text": "Карбонатные отложения, необходимо выделить нефтеносный межзерновой коллектор, определить ВНК и эффективную толщину (hφ).", "claims": ["logging-normalization-method.c7"], "page": 107, "by": "model"}], "solution": [{"text": "Сравнили кривые ρn (БК-3, индукционный метод) и НГМ. Границу ВНК провели на глубине 1083 м. Общую толщину 13,5 м уменьшили на 4,5 м (толщина прослоев неколлекторов).", "claims": ["logging-normalization-method.c8", "logging-normalization-method.c9"], "page": 107, "by": "model"}], "result": [{"text": "Эффективная толщина коллектора hφ = 9 м.", "claims": ["logging-normalization-method.c9"], "page": 107, "by": "model"}]}], "numbers": [{"text": "В примере 54 граница ВНК определена на глубине 1083 м. Общая толщина продуктивных отложений составила 13,5 м, эффективная толщина hφ = 9 м после вычета 4,5 м неколлекторов.", "claims": ["logging-normalization-method.c8", "logging-normalization-method.c9"], "page": 107, "by": "model"}], "formulas": [{"latex": "\\rho_{\\mathrm{n}} = 0,05 \\mathrm{OM} \\cdot \\mathrm{M}; t^{0} = 20^{\\circ} \\mathrm{C}; \\rho_{\\mathrm{p}} = 1,2 \\div 1,3 \\mathrm{OM} \\cdot \\mathrm{M}; \\delta_{\\mathrm{p}} = 1,2 \\mathrm{t} / \\mathrm{cm}^{3}", "page": 106, "vars": [{"sym": "\\rho_{\\mathrm{n}}", "meaning": "удельное электрическое сопротивление", "unit": "Ом·м"}]}], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Высокое сопротивление может быть обусловлено как наличием нефти, так и особенностями литологии или отсутствием проникновения, поэтому требуется нормализация с методами пористости.", "claims": ["logging-normalization-method.c6"], "page": 107, "by": "model"}]}, "data_meaning": {"input": "Кривые электрического сопротивления и методы пористости (НМ, ГГМ, акустика).", "output": "Интервалы продуктивных коллекторов и положение ВНК.", "breaks": [{"text": "Метод ломается при неоднородном минеральном составе пород, так как нарушается условие совмещения кривых в неколлекторах.", "claims": ["logging-normalization-method.c5"], "page": 107, "by": "model"}], "hypotheses": [{"text": "Гипотеза: нормализация — это ручной аналог приведения признаков (feature scaling) к единому распределению для поиска аномалий в данных.", "claims": [], "page": 105, "by": "model"}]}, "analogy": {"text": "Нормализация похожа на приведение двух графиков к одной шкале (например, Z-score normalization), чтобы увидеть отклонения от базовой линии.", "breaks_where": "В ИТ нормализация данных обычно математически строгая, тогда как здесь она выполняется графически для визуального поиска расхождений."}, "now_practice": [{"text": "Сегодня подобные процедуры совмещения кривых выполняются автоматически в специализированном ПО для петрофизической интерпретации, а не графически на бумажных планшетах.", "claims": ["logging-normalization-method.c1"], "page": 107, "by": "model"}], "layers": {"mechanism": [{"text": "Сопоставление физических полей разной природы (электрического и ядерно-физического) через подбор масштаба.", "claims": ["logging-normalization-method.c2"], "page": 107, "by": "model"}], "practice": [{"text": "Использование метода для оперативного выделения коллекторов при бурении на любом типе раствора.", "claims": ["logging-normalization-method.c3"], "page": 107, "by": "model"}], "nuances": [{"text": "Необходимость исключения прослоев неколлекторов из общей толщины пласта для получения эффективной толщины.", "claims": ["logging-normalization-method.c9"], "page": 107, "by": "model"}], "deeper": [{"text": "Метод позволяет работать даже при наличии проникновения фильтрата, если глубинность электрического метода достаточна.", "claims": ["logging-normalization-method.c2"], "page": 107, "by": "model"}]}, "book_tasks": [{"number": "107", "text": "На основании диаг rue}, {"id": "logging-normalization-method.c5", "kind": "assumption", "text": "Метод лучше работает при однородном составе пород.", "quote": "Наиболее четкие результаты способ нормализации дает при однородном минеральном составе пород в исследуемом разрезе.", "unit": "u107-04", "page": 107, "by": "model", "verified": true}, {"id": "logging-normalization-method.c6", "kind": "inference", "text": "Расхождение кривых — признак продуктивности.", "quote": "Расхождение кривых  \\( \\rho_{n} \\)  и кривых какого-либо метода пористости является признаком продуктивного коллектора", "unit": "u107-02", "page": 107, "by": "model", "verified": true}, {"id": "logging-normalization-method.c7", "kind": "observation", "text": "Задача примера 54 — выделить нефтеносный коллектор.", "quote": "Выделить интервалы нефтеносного межзернового коллектора в карбонатных отложениях; определить положение ВНК и величину  \\( h_{\\varphi} \\)  продуктивных коллекторов", "unit": "u107-05", "page": 107, "by": "model", "verified": true}, {"id": "logging-normalization-method.c8", "kind": "observation", "text": "ВНК определен на глубине 1083 м.", "quote": "Границу ВНК проводим на глубине 1083м", "unit": "u107-06", "page": 107, "by": "model", "verified": true}, {"id": "logging-normalization-method.c9", "kind": "observation", "text": "Эффективная толщина составила 9 м.", "quote": "находим, что  \\( h_{\\varphi} = 13,5 - 4,5 = 9м \\)", "unit": "u107-10", "page": 107, "by": "model", "verified": true}], "term_ids": ["t-log-normalization"], "units": ["u105-07", "u105-08", "u105-09", "u106-01", "u107-02", "u107-03", "u107-04", "u107-05", "u107-06", "u107-10", "u108-10"], "video_criteria": ["invisible_visible", "cause_effect"], "fallback": false}, {"id": "latyshova.carbonate-cutoff-porosity", "order": 24, "part_id": "p7", "minutes": 4, "title": "Определение граничной пористости карбонатных коллекторов", "book_title": "Карбонатный разрез", "pages": [107, 108], "difficulty": {"primary": "Ф", "secondary": "Н"}, "th аметр скважины ($d_c$) становится больше номинального ($d_a$)?", "options": ["В плотных сцементированных породах", "В глинах и аргиллитах из-за разбухания", "В зонах развития карста", "В межзерновых коллекторах при использовании глинистого раствора"], "answer": [1, 2], "explanation": "Разбухание глин и растворение солей или карстовых пород приводит к увеличению диаметра скважины."}, {"id": "latyshova.mud-filtration-density-impact.q2", "node_id": "latyshova.mud-filtration-density-impact", "type": "single", "claim_id": "mud-filtration-density-impact.c7", "question": "Почему увеличение плотности бурового раствора считается нежелательным для качества геофизических исследований?", "options": ["Оно делает раствор слишком прозрачным для радиоактивных методов.", "Оно увеличивает репрессию, что ведет к более глубокому проникновению фильтрата в пласт.", "Оно приводит к быстрому износу бурового долота.", "Оно снижает электропроводность пласта, искажая данные электрометрии."], "answer": 1, "explanation": "Рост плотности увеличивает скважинное давление (репрессию), что способствует более глубокому проникновению фильтрата, аналогично высокой водоотдаче."}, {"id": "latyshova.mud-filtration-density-impact.q3", "node_id": "latyshova.mud-filtration-density-impact", "type": "cloze", "claim_id": "mud-filtration-density-impact.c8", "question": "Заполните пропуск в описании идеальных условий для ГИС", "text": "Для получения наиболее достоверных данных о пласте рекомендуется проводить бурение на {{1}}, при котором репрессия давления стремится к нулю.", "answers": [["равновесии"]], "explanation": "Бурение на равновесии (репрессия около 0) минимизирует проникновение фильтрата в пласт, что является идеальным условием для геофизических исследований."}, {"id": "latyshova.mud-salinity-impact.q2", "node_id": "latyshova.mud-salinity-impact", "type": "order", "claim_id": "mud-salinity-impact.c4", "question": "Расставьте по порядку этапы изменения эффективности методов при росте минерализации раствора:", "items": ["Рост минерализации раствора", "Приближение ρф к ρп", "Снижение эффективности СП и микрозондов"], "explanation": "Рост минерализации напрямую ведет к сближению сопротивлений, что в свою очередь делает методы СП и микрозондов менее эффективными."}, {"id": "latyshova.mud-salinity-impact.q3", "node_id": "latyshova.mud-salinity-impact", "type": "multi", "claim_id": "mud-salinity-impact.c5", "question": "Какие последствия наступают при приближении сопротивления фильтрата (ρф) к сопротивлению пластовой воды (ρп)?", "options": ["Улучшается выделение коллекторов методами СП", "Облегчается оценка продуктивности коллектора разноглубинной электрометрией", "Снижается эффективность индукционного метода", "Исчезают признаки коллектора на кривых микрозондов"], "answer": [1, 2, 3], "explanation": "Приближение ρф к ρп ухудшает работу СП и микрозондов, но делает условия для оценки продуктивности более благоприятными."}, {"id": "latyshova.alternative-drilling-fluids.q1", "node_id": "latyshova.alternative-drilling-fluids", "type": "multi", "claim_id": "alternative-drilling-fluids.c2", "question": "Почему бурение на технической воде затрудняет оценку коллекторских свойств пласта?", "options": ["Из-за образования слишком тонкой глинистой корки, которую не видит каверномер.", "Из-за формирования глубоких зон проникновения фильтрата в пласт.", "Из-за низкой эффективности микрозондов при выделении коллекторов.", "Из-за того, что вода обладает бесконечно высоким электрическим сопротивлением."], "answer": [1, 2], "explanation": "Глубокое проникновение фильтрата экранирует пласт, а микрозонды теряют свою эффективность как средства выделения коллектора."}, {"id": "latyshova.alternative-drilling-fluids.q2", "node_id": "latyshova.alternative-drilling-fluids", "type": "calc", "claim_id": "alternative-drilling-fluids.c4", "question": "При использовании нефильтрующихся растворов на непроводящей основе, какова теоретическая глубина проникновения фильтрата в пласт (в метрах)?", "answer": 0, "tolerance": 0.01, "unit": "м", "explanation": "Согласно тексту, для нефильтрующихся растворов характерно отсутствие или очень малое проникновение в коллекторы, что математически выражается как 0."}, {"id": "latyshova.alternative-drilling-fluids.q3", "node_id": "latyshova.alternative-drilling-fluids", "type": "single", "claim_id": "alternative-drilling-fluids.c5", "question": "Какой метод электрометрии остается применимым при использовании нефильтрующихся растворов на непроводящей основе?", "options": ["Боковой каротаж", "Микрозондирование", "Индукционный каротаж", "Метод потенциалов самопроизвольной поляризации"], "answer": 2, "explanation": "Индукционный метод не требует прямого электрического контакта с породой, в отличие от гальванических методов, которые не работают в диэлектрических растворах."}, {"id": "latyshova.reservoir-lithology-pore-types.q1", "node_id": "latyshova.reservoir-lithology-pore-types", "type": "single", "claim_id": "reservoir-lithology-pore-types.c2", "question": "Почему при анализе вулканогенных разрезов нельзя использовать алгоритмы, настроенные исключительно на терригенные породы?", "options": ["Из-за различий в химическом составе пород", "Из-за наличия в вулканогенных породах сложных кавернозно-трещинных структур, нехарактерных для терригенных", "Из-за отсутствия в вулканогенных породах межзерновой пористости", "Из-за того, что вулканогенные породы всегда являются глинистыми"], "answer": 1, "explanation": "Вулканогенные породы по структуре порового пространства близки к карбонатным, поэтому требуют учета трещин и каверн, которые отсутствуют в простых терригенных коллекторах."}, {"id": "latyshova.reservoir-lithology-pore-types.q3", "node_id": "latyshova.reservoir-lithology-pore-types", "type": "order", "claim_id": "reservoir-lithology-pore-types.c3", "question": "Расставьте типы коллекторов по морфологии порового пространства в соответствии с текстом:", "items": ["Межзерновые", "Трещинные", "Кавернозно-трещинные", "Смешанные"], "explanation": "Данный порядок соответствует перечислению типов коллекторов по морфологии порового пространства в тексте шага."}, {"id": "latyshova.gis-methods-classification-by-task.q1", "node_id": "latyshova.gis-methods-classification-by-task", "type": "order", "claim_id": "gis-methods-classification-by-task.c2", "question": "Расставьте группы методов ГИС в порядке их перечисления в тексте:", "items": ["Выделение коллекторов", "Определение пористости", "Определение глинистости", "Оценка продуктивности"], "explanation": "Текст последовательно классифицирует методы по четырем задачам: от выделения коллекторов до оценки продуктивности."}, {"id": "latyshova.gis-methods-classification-by-task.q2", "node_id": "latyshova.gis-methods-classification-by-task", "type": "multi", "claim_id": "gis-methods-classification-by-task.c8", "question": "Выберите верные утверждения о гамма-методе (ГМ):", "options": ["ГМ можно использовать только в необсаженных скважинах.", "ГМ позволяет оценивать содержание нерастворимого остатка в карбонатных породах.", "ГМ применим независимо от типа бурового раствора.", "ГМ измеряет пористость пород напрямую."], "answer": [1, 2], "explanation": "ГМ универсален в плане типа раствора и обсадки, а также используется для оценки глинистости (в терригенных) или нерастворимого остатка (в карбонатных породах)."}, {"id": "latyshova.fluid-saturation-resistivity-parameter.q2", "node_id": "latyshova.fluid-saturation-resistivity-parameter", "type": "single", "claim_id": "fluid-saturation-resistivity-parameter.c5", "question": "Почему для оценки нефтегазонасыщения недостаточно использовать только методы сопротивления?", "options": ["Методы сопротивления не позволяют измерить удельное сопротивление пласта.", "Для расчета параметра насыщения Pн необходимо знать пористость пласта, которую определяют другими методами.", "Методы сопротивления работают только в лабораторных условиях на керне.", "Параметр Pн всегда равен 1, поэтому измерения сопротивления избыточны."], "answer": 1, "explanation": "Методы сопротивления дают только числитель формулы, а для определения знаменателя необходимо комплексирование с методами пористости."}, {"id": "latyshova.fluid-saturation-resistivity-parameter.q3", "node_id": "latyshova.fluid-saturation-resistivity-parameter", "type": "cloze", "claim_id": "fluid-saturation-resistivity-parameter.c2", "question": "Заполните пропуск в условии продуктивности пласта", "text": "Порода классифицируется как нефте- или газосодержащая, если значение параметра насыщения Pн {{1}} 1.", "answers": [["превышает", "больше", ">"]], "explanation": "Согласно тексту, условием нефтегазонасыщения является Pн > 1."}, {"id": "latyshova.gis-complex-reservoir-characterization.q1", "node_id": "latyshova.gis-complex-reservoir-characterization", "type": "cloze", "claim_id": "gis-complex-reservoir-characterization.c6", "question": "Заполните пропуск", "text": "Если фильтрат бурового раствора проник в пласт на большую глубину, для уточнения данных необходимо провести {{1}} нейтронных исследований после обсадки скважины.", "answers": [["повторные", "повторных"]], "explanation": "При глубоком проникновении фильтрата повторные измерения позволяют получить более достоверные данные после того, как скважина обсажена."}, {"id": "latyshova.gis-complex-reservoir-characterization.q2", "node_id": "latyshova.gis-complex-reservoir-characterization", "type": "order", "claim_id": "gis-complex-reservoir-characterization.c7", "question": "Расставьте по порядку этапы выявления газонасыщенных интервалов при глубоком проникновении:", "items": ["Бурение скважины и возникновение зоны проникновения фильтрата", "Обсадка скважины", "Проведение повторных нейтронных исследований", "Расформирование зоны проникновения и фиксация газонасыщенности"], "explanation": "Повторные исследования проводятся после обсадки, чтобы зафиксировать изменения в зоне проникновения, которые происходят со временем."}, {"id": "latyshova.gis-complex-reservoir-characterization.q3", "node_id": "latyshova.gis-complex-reservoir-characterization", "type": "multi", "claim_id": "gis-complex-reservoir-characterization.c3", "question": "Почему для определения глинистости пласта рекомендуется использовать комплекс методов (ГГМ, НМ, АК) вместо одного?", "options": ["Каждый из этих методов по отдельности не обладает чувствительностью к глинистости", "Методы обладают перекрестной чувствительностью, и их совместный анализ повышает точность", "Один метод может быть неисправен, поэтому нужно дублирование", "Комплексирование позволяет исключить влияние параметров бурового раствора на результат"], "answer": [1], "explanation": "Методы пористости содержат косвенные сведения о глинистости, и их совместное использование позволяет более точно интерпретировать эти данные."}, {"id": "latyshova.lithological-column-construction-procedure.q1", "node_id": "latyshova.lithological-column-construction-procedure", "type": "multi", "claim_id": "lithological-column-construction-procedure.c2", "question": "Почему для определения литологии породы рекомендуется использовать совокупность признаков с нескольких диаграмм, а не одну?", "options": ["Одна диаграмма не позволяет определить границы пластов.", "Физические признаки разных пород часто совпадают на одной диаграмме.", "Точность определения литологии растет при увеличении числа используемых физических признаков.", "Геофизические методы не работают по отдельности."], "answer": [1, 2], "explanation": "Использование нескольких признаков повышает точность и помогает различать породы, имеющие схожие показатели на отдельных диаграммах."}, {"id": "latyshova.lithological-column-construction-procedure.q2", "node_id": "latyshova.lithological-column-construction-procedure", "type": "single", "claim_id": "lithological-column-construction-procedure.c4", "question": "Что необходимо сделать, если при построении разреза полностью отсутствуют данные о минералогическом составе пород?", "options": ["Прекратить построение разреза до получения данных лабораторного анализа.", "Построить условную колонку по физическим признакам и уточнить её по образцам из скважины.", "Использовать только одну наиболее точную геофизическую диаграмму.", "Присвоить всем пластам усредненные характеристики известных пород региона."], "answer": 1, "explanation": "При нехватке данных сначала создается условная колонка, которая затем верифицируется петрофизическими исследованиями образцов."}, {"id": "latyshova.qualitative-gis-response-matrix.q1", "node_id": "latyshova.qualitative-gis-response-matrix", "type": "single", "claim_id": "qualitative-gis-response-matrix.c3", "question": "Почему пластичные глины могут быть ошибочно приняты за проницаемые коллекторы при анализе кавернограммы?", "options": ["Из-за высокого естественного гамма-излучения, характерного для обоих типов пород.", "Из-за сужения ствола скважины, которое имитирует образование глинистой корки.", "Из-за резкого снижения удельного сопротивления, характерного для нефтенасыщенных пластов.", "Из-за отсутствия реакции на нейтронные методы каротажа."], "answer": 1, "explanation": "Пластичные глины вызывают сужение ствола скважины (dc \u003c dn), что визуально совпадает с признаком наличия глинистой корки у коллекторов."}, {"id": "latyshova.qualitative-gis-response-matrix.q2", "node_id": "latyshova.qualitative-gis-response-matrix", "type": "cloze", "question": "Заполните пропуск в описании признаков глин:", "text": "Чистые глины на диаграммах ГИС выделяются максимальными показаниями гамма-метода и СП, а также наличием {{1}}.", "answers": [["каверн", "кавернозности", "увеличения диаметра скважины"]], "explanation": "Согласно тексту, глины характеризуются наличием каверн, где диаметр скважины больше номинального (dc > dn).", "claim_id": "qualitative-gis-response-matrix.c1"}, {"id": "latyshova.qualitative-gis-response-matrix.q3", "node_id": "latyshova.qualitative-gis-response-matrix", "type": "order", "claim_id": "qualitative-gis-response-matrix.c8", "question": "Расставьте типы пород по возрастанию диаметра скважины (dc) относительно номинального (dn):", "items": ["Пластичные глины (сужение)", "Плотные карбонаты (равенство)", "Чистые глины (каверна)"], "explanation": "Пластичные глины дают сужение (dc \u003c dn), плотные карбонаты — равенство (dc = dn), а чистые глины — каверны (dc > dn)."}, {"id": "latyshova.complex-lithology-interpretation.q1", "node_id": "latyshova.complex-lithology-interpretation", "type": "order", "claim_id": "complex-lithology-interpretation.c3", "question": "Расставьте по порядку этапы влияния осложняющих факторов на интерпретацию ГИС:", "items": ["Наличие глинистости или гипса в породе", "Изменение показаний стандартных методов ГИС", "Возникновение неоднозначности при выделении коллектора"], "explanation": "Глинистость и загипсованность искажают физические параметры, что приводит к ошибкам в определении коллекторских свойств."}, {"id": "latyshova.complex-lithology-interpretation.q2", "node_id": "latyshova.complex-lithology-interpretation", "type": "multi", "claim_id": "complex-lithology-interpretation.c2", "question": "Почему для сложных терригенно-карбонатных разрезов недостаточно только электрических методов?", "options": ["Электрические методы не работают при наличии флюидов разной минерализации", "Сложные разрезы требуют количественной интерпретации и учета геологических данных", "Электрические методы не позволяют определить пористость в карбонатных породах", "Необходим учет только данных кавернометрии"], "answer": [0, 1], "explanation": "Сложные разрезы характеризуются неоднородностью состава и насыщения, что требует комплексного количественного подхода, а не только электрических измерений."}, {"id": "latyshova.complex-lithology-interpretation.q3", "node_id": "latyshova.complex-lithology-interpretation", "type": "calc", "claim_id": "complex-lithology-interpretation.c7", "question": "Чему равно произведение диаметра скважины (м) на сопротивление (Ом·м) согласно данным рис. 68?", "answer": 0.3, "tolerance": 0.01, "unit": "м*Ом*м", "explanation": "Произведение 0,25 м на 1,2 Ом·м равно 0,3."}, {"id": "latyshova.direct-reservoir-indicators.q1", "node_id": "latyshova.direct-reservoir-indicators", "type": "calc", "claim_id": "direct-reservoir-indicators.c6", "question": "Во сколько раз максимально может увеличиться толщина глинистой корки при ухудшении качества бурового раствора по сравнению с хорошими условиями?", "answer": 4.0, "tolerance": 0.1, "unit": "раз", "explanation": "В хороших условиях толщина корки составляет 1 см, а при ухудшении достигает 4 см, что в 4 раза больше."}, {"id": "latyshova.direct-reservoir-indicators.q2", "node_id": "latyshova.direct-reservoir-indicators", "type": "single", "claim_id": "direct-reservoir-indicators.c8", "question": "Почему при бурении на технической воде становится сложно выделить коллектор по прямым признакам?", "options": ["Техническая вода слишком сильно нагревает пласт, искажая показания зондов.", "При использовании технической воды на стенках скважины практически не образуются признаки, фиксируемые микрозондами и каверномером.", "Техническая вода полностью вымывает коллектор, делая его невидимым для приборов.", "Микрозонды не работают в скважинах, заполненных водой, из-за высокого давления."], "answer": 1, "explanation": "Согласно тексту, при бурении на технической воде прямые признаки коллектора на диаграммах микрозондов и кавернограммах обычно отсутствуют."}, {"id": "latyshova.direct-reservoir-indicators.q3", "node_id": "latyshova.direct-reservoir-indicators", "type": "cloze", "claim_id": "direct-reservoir-indicators.c12", "question": "Заполните пропуск в описании методов исследования коллекторов", "text": "Если разовые замеры не дают четких признаков, применяют {{1}} методы, наблюдая за формированием или расформированием зоны проникновения во времени.", "answers": [["динамические"]], "explanation": "Динамические методы позволяют отследить изменения в зоне проникновения во времени, что помогает выявить коллектор, когда статические замеры неэффективны."}, {"id": "latyshova.reservoir-cutoff-determination.q1", "node_id": "latyshova.reservoir-cutoff-determination", "type": "cloze", "claim_id": "reservoir-cutoff-determination.c2", "question": "Заполните пропуск в описании процесса классификации пород", "text": "Основным критерием, позволяющим разделить породу на коллектор и неколлектор, является граничное значение {{1}}.", "answers": [["коэффициента проницаемости", "проницаемости"]], "explanation": "Согласно тексту, именно граничное значение проницаемости (kₚₚ*) является главным критерием для классификации пород."}, {"id": "latyshova.reservoir-cutoff-determination.q2", "node_id": "latyshova.reservoir-cutoff-determination", "type": "order", "claim_id": "reservoir-cutoff-determination.c6", "question": "Расставьте по порядку этапы определения эффективной толщины пласта", "items": ["Определение минимального рентабельного дебита для региона", "Расчет граничной проницаемости по гидродинамической формуле", "Пересчет критической проницаемости в пороговые значения пористости или глинистости", "Определение геофизических отсечек на основе петрофизических связей", "Нанесение пороговых значений на каротажные диаграммы для выделения коллекторов"], "explanation": "Процесс идет от экономических требований к гидродинамике, затем через петрофизические связи к геофизическим параметрам."}, {"id": "latyshova.reservoir-cutoff-determination.q3", "node_id": "latyshova.reservoir-cutoff-determination", "type": "multi", "claim_id": "reservoir-cutoff-determination.c15", "question": "В каких случаях методы пористости предпочтительнее методов глинистости при выделении эффективной толщины?", "options": ["При наличии неактивного силикатного цемента", "При работе с терригенным разрезом без цемента", "При наличии неактивного карбонатного цемента", "Когда необходимо использовать метод ЯМР с ИСФ менее 1%"], "answer": [0, 2], "explanation": "Текст прямо указывает, что при наличии неактивного силикатного или карбонатного цемента прямые связи с глинистостью перестают работать, и нужно использовать методы пористости."}, {"id": "latyshova.fluid-saturation-crossplots.q1", "node_id": "latyshova.fluid-saturation-crossplots", "type": "multi", "claim_id": "fluid-saturation-crossplots.c2", "question": "Почему для оценки характера насыщения недостаточно измерить только удельное сопротивление пласта?", "options": ["Высокое сопротивление может быть вызвано не только нефтью, но и изменением пористости породы.", "Удельное сопротивление не зависит от наличия углеводородов в порах.", "Изменение минерализации пластовых вод сильно искажает показания сопротивления.", "Метод сопротивления работает только в лабораторных условиях, а не в скважине."], "answer": [0, 2], "explanation": "Высокое сопротивление — неоднозначный показатель, так как на него влияют как пористость, так и состав воды, поэтому требуется комплексный анализ."}, {"id": "latyshova.fluid-saturation-crossplots.q2", "node_id": "latyshova.fluid-saturation-crossplots", "type": "calc", "claim_id": "fluid-saturation-crossplots.c12", "question": "Если граница между коллектором и неколлектором проходит по значению коэффициента водонасыщенности kn,ср = 17 %, то какой тип породы будет при kn = 15 %?", "answer": 0, "tolerance": 0, "unit": "тип породы", "explanation": "Так как 15 % меньше критического значения 17 %, порода классифицируется как неколлектор."}, {"id": "latyshova.fluid-saturation-crossplots.q3", "node_id": "latyshova.fluid-saturation-crossplots", "type": "single", "claim_id": "fluid-saturation-crossplots.c4", "question": "В каком случае использование параметра насыщения Pн становится обязательным при анализе?", "options": ["Когда пористость пласта остается постоянной на всем интервале.", "Когда наблюдаются значительные изменения пористости в пределах пласта.", "Когда пласт полностью заполнен пресной водой.", "Когда необходимо определить только глубину залегания пласта."], "answer": 1, "explanation": "При больших изменениях пористости диапазоны сопротивлений перекрываются, поэтому для корректной оценки необходимо использовать параметр насыщения."}, {"id": "latyshova.critical-saturation-parameters-clean-reservoir.q1", "node_id": "latyshova.critical-saturation-parameters-clean-reservoir", "type": "single", "claim_id": "critical-saturation-parameters-clean-reservoir.c4", "question": "Почему в диапазоне значений Pn от Pn* до Pn** оценка характера насыщения пласта считается неоднозначной?", "options": ["В этой области прибор ГИС не может точно измерить параметры из-за высокой минерализации воды.", "Пласт в этом диапазоне дает смесь нефти и воды, что не позволяет однозначно классифицировать его как чисто нефтяной или чисто водный.", "Лабораторные данные для этого диапазона всегда отсутствуют из-за сложности проведения экспериментов.", "В этой области фазовая проницаемость нефти становится равной нулю."], "answer": 1, "explanation": "В области двухфазного течения пласт одновременно отдает и нефть, и воду, поэтому однозначный вывод о характере насыщения невозможен."}, {"id": "latyshova.critical-saturation-parameters-clean-reservoir.q2", "node_id": "latyshova.critical-saturation-parameters-clean-reservoir", "type": "cloze", "claim_id": "critical-saturation-parameters-clean-reservoir.c2", "question": "Заполните пропуск в описании методов определения критических значений", "text": "Статистический метод определения порогов требует наличия данных опробования и применим преимущественно на {{1}} стадиях разведки, в то время как петрофизический метод позволяет прогнозировать продуктивность с самого начала.", "answers": [["поздних", "завершающих"]], "explanation": "Статистический метод требует накопления большого объема данных испытаний, поэтому он эффективен только на поздних этапах."}, {"id": "latyshova.critical-saturation-parameters-clean-reservoir.q3", "node_id": "latyshova.critical-saturation-parameters-clean-reservoir", "type": "order", "claim_id": "critical-saturation-parameters-clean-reservoir.c7", "question": "Расставьте интервалы водонасыщения (kn) в порядке возрастания их значений согласно петрофизическому анализу:", "items": ["Интервал однофазного течения нефти", "Интервал двухфазного течения нефти и воды", "Интервал однофазного течения воды"], "explanation": "По мере роста водонасыщения (kn) подвижность нефти падает, а воды растет, переходя от чисто нефтяного притока к смеси, а затем к чистой воде."}, {"id": "latyshova.critical-saturation-parameters-clayey-reservoir.q1", "node_id": "latyshova.critical-saturation-parameters-clayey-reservoir", "type": "order", "claim_id": "critical-saturation-parameters-clayey-reservoir.c6", "question": "Расставьте по порядку этапы определения характера насыщения глинистого коллектора:", "items": ["Выбор семейства графиков Pn=f(kn) для конкретного значения αСП", "Нанесение точки с измеренными значениями Pn и αСП на график", "Определение принадлежности точки к области нефтеносности, водоносности или переходной зоны"], "explanation": "Оценка насыщения требует сначала выбрать модель для текущей глинистости, затем нанести данные и интерпретировать положение точки."}, {"id": "latyshova.critical-saturation-parameters-clayey-reservoir.q2", "node_id": "latyshova.critical-saturation-parameters-clayey-reservoir", "type": "multi", "claim_id": "critical-saturation-parameters-clayey-reservoir.c2", "question": "Почему при оценке глинистых коллекторов недостаточно использовать только параметр насыщения Pn?", "options": ["Глинистость напрямую влияет на фазовые проницаемости и электропроводность", "Параметр насыщения Pn всегда равен единице в глинистых породах", "Одно и то же значение Pn может соответствовать разным типам насыщения при разной глинистости", "Геофизический параметр αСП является единственным показателем пористости"], "answer": [0, 2], "explanation": "Глинистость искажает связь между сопротивлением и насыщением, поэтому она выступает как необходимый корректирующий параметр."}, {"id": "latyshova.critical-saturation-parameters-clayey-reservoir.q3", "node_id": "latyshova.critical-saturation-parameters-clayey-reservoir", "type": "calc", "claim_id": "critical-saturation-parameters-clayey-reservoir.c7", "question": "Используя данные для αСП=1,0, вычислите разность между критическим коэффициентом водонасыщенности для водоносного коллектора (kn**) и критическим коэффициентом для начала промышленной нефтеносности (kn,sp).", "answer": 22.0, "tolerance": 0.1, "unit": "%", "explanation": "Разность составляет 80% - 58% = 22%."}, {"id": "latyshova.saturation-interpretation-tasks.q1", "node_id": "latyshova.saturation-interpretation-tasks", "type": "calc", "claim_id": "saturation-interpretation-tasks.c1", "question": "Сколько всего рисунков с диаграммами каротажа упоминается в тексте для выполнения практических заданий?", "answer": 7, "tolerance": 0, "unit": "рисунков", "explanation": "В тексте перечислены номера 14, 46, 58, 67, 68, 73 и 76, что в сумме дает 7 источников данных."}, {"id": "latyshova.saturation-interpretation-tasks.q2", "node_id": "latyshova.saturation-interpretation-tasks", "type": "single", "claim_id": "saturation-interpretation-tasks.c4", "question": "Почему в тонкослоистых коллекторах определение характера насыщения затруднено?", "options": ["Из-за слишком высокой скорости бурения в таких породах", "Из-за эффекта усреднения показаний прибором, который не может разрешить отдельные прослои", "Из-за отсутствия в таких породах пластовых вод", "Из-за того, что автоматизированные алгоритмы не работают с тонкослоистыми структурами"], "answer": 1, "explanation": "Прибор не может разрешить тонкие прослои отдельно, поэтому выдает усредненное значение, маскирующее реальные свойства продуктивных зон."}, {"id": "latyshova.effective-thickness-and-fluid-contacts.q1", "node_id": "latyshova.effective-thickness-and-fluid-contacts", "type": "cloze", "claim_id": "effective-thickness-and-fluid-contacts.c8", "question": "Заполните пропуск", "text": "При наличии переходной зоны ВНК определяется путем построения графика зависимости удельного сопротивления от глубины, при этом предполагается, что изменение сопротивления происходит по {{1}} закону.", "answers": [["линейному", "линейным"]], "explanation": "Текст прямо указывает на использование линейной интерполяции удельного сопротивления в переходной зоне."}, {"id": "latyshova.effective-thickness-and-fluid-contacts.q2", "node_id": "latyshova.effective-thickness-and-fluid-contacts", "type": "order", "claim_id": "effective-thickness-and-fluid-contacts.c8", "question": "Расставьте по порядку этапы определения ВНК в переходной зоне:", "items": ["Определение границ зоны (кровли и подошвы)", "Определение удельных сопротивлений ρншах и ρвп", "Построение графика ρп = f(H) как линейной функции", "Нахождение точки, соответствующей критерию ρп,пр, и проведение контакта"], "explanation": "Данная последовательность действий описана в тексте как алгоритм для работы с переходной зоной."}, {"id": "latyshova.effective-thickness-and-fluid-contacts.q3", "node_id": "latyshova.effective-thickness-and-fluid-contacts", "type": "multi", "claim_id": "effective-thickness-and-fluid-contacts.c10", "question": "Почему в обсаженных скважинах при определении ГНК требуются повторные замеры нейтронными методами?", "options": ["Для подтверждения завершения расформирования зоны проникновения", "Чтобы исключить влияние высокой проницаемости коллектора", "Для стабилизации показаний прибора во времени", "Для автоматического расчета эффективной толщины"], "answer": [0, 2], "explanation": "Повторные замеры проводятся до стабилизации показаний, что свидетельствует о завершении расформирования зоны проникновения."}, {"id": "latyshova.laminated-reservoir-effective-thickness.q1", "node_id": "latyshova.laminated-reservoir-effective-thickness", "type": "multi", "claim_id": "laminated-reservoir-effective-thickness.c2", "question": "Какие признаки указывают на то, что слой является неколлектором?", "options": ["Повышенные показания микрозондов", "Низкие значения пористости (kп \u003c kп*)", "Высокие значения пористости", "Отсутствие глинистого цемента"], "answer": [0, 1], "explanation": "Согласно тексту, неколлекторы определяются именно по повышенным показаниям микрозондов и низким значениям пористости."}, {"id": "latyshova.laminated-reservoir-effective-thickness.q2", "node_id": "latyshova.laminated-reservoir-effective-thickness", "type": "calc", "claim_id": "laminated-reservoir-effective-thickness.c7", "question": "Какова общая толщина пачки, упомянутой в примере с сопротивлениями 38, 2.2 и 25 Ом·м?", "answer": 18, "tolerance": 0, "unit": "м", "explanation": "В тексте прямо указано, что общая толщина пачки с данными сопротивлениями составляет 18 метров."}, {"id": "latyshova.laminated-reservoir-effective-thickness.q3", "node_id": "latyshova.laminated-reservoir-effective-thickness", "type": "single", "claim_id": "laminated-reservoir-effective-thickness.c3", "question": "Почему в некоторых случаях для расчета эффективной толщины применяют интегральные характеристики вместо прямого вычитания толщин прослоев?", "options": ["Потому что приборы имеют слишком низкую точность измерения сопротивления", "Потому что прослои настолько тонкие, что не выделяются даже методами с высокой разрешающей способностью", "Потому что это быстрее, чем ручной подсчет каждого прослоя", "Потому что методы с высокой разрешающей способностью не работают в глинистых породах"], "answer": 1, "explanation": "Интегральные характеристики используются, когда прослои неразличимы приборами из-за их крайне малой толщины."}, {"id": "latyshova.terrigenous-reservoir-identification.q1", "node_id": "latyshova.terrigenous-reservoir-identification", "type": "single", "claim_id": "terrigenous-reservoir-identification.c12", "question": "Почему для оценки пористости и проницаемости в терригенных породах недостаточно просто измерить сопротивление или плотность?", "options": ["Потому что данные ГИС являются лишь косвенными признаками, требующими интерпретации через физические модели.", "Потому что приборы ГИС не способны измерять физические свойства напрямую.", "Потому что сопротивление и плотность не связаны с пористостью породы.", "Потому что современные методы требуют только прямого анализа керна."], "answer": 0, "explanation": "Данные ГИС — это косвенные измерения физических полей, которые необходимо пересчитывать в свойства породы с помощью физических моделей."}, {"id": "latyshova.terrigenous-reservoir-identification.q2", "node_id": "latyshova.terrigenous-reservoir-identification", "type": "cloze", "question": "Заполните пропуск в описании процесса выделения коллекторов", "text": "Для отделения коллекторов от плотных пород в акустическом методе используется граничное значение {{1}}, которое рассчитывается с учетом констант скелета и флюида.", "answers": [["ΔТгр", "ΔТ гр", "времени ΔТгр"]], "explanation": "Граничное значение времени прохождения волны ΔТгр позволяет классифицировать интервалы как коллекторы.", "claim_id": "terrigenous-reservoir-identification.c1"}, {"id": "latyshova.terrigenous-reservoir-identification.q3", "node_id": "latyshova.terrigenous-reservoir-identification", "type": "order", "claim_id": "terrigenous-reservoir-identification.c6", "question": "Расставьте этапы выделения коллекторов по комплексу ГИС в правильном порядке", "items": ["Анализ кривых ГИС для выявления характера изменения свойств пласта", "Применение граничных значений параметров для классификации интервалов", "Учет влияния плотных прослоев для уточнения эффективной толщины"], "explanation": "Сначала проводится первичный анализ данных, затем классификация по порогам, и в конце — корректировка с учетом геологических особенностей (плотных прослоев)."}, {"id": "latyshova.carbonate-logging-features.q1", "node_id": "latyshova.carbonate-logging-features", "type": "order", "claim_id": "carbonate-logging-features.c2", "question": "Расставьте по порядку процессы, приводящие к затруднению интерпретации карбонатных коллекторов:", "items": ["Низкая пористость карбонатных пород", "Глубокое проникновение фильтрата промывочной жидкости", "Маскировка истинного сопротивления пласта", "Соизмеримость сопротивлений продуктивного коллектора и неколлектора"], "explanation": "Низкая пористость провоцирует глубокое проникновение фильтрата, что искажает замеры сопротивления и делает их похожими для разных типов пород."}, {"id": "latyshova.carbonate-logging-features.q2", "node_id": "latyshova.carbonate-logging-features", "type": "multi", "claim_id": "carbonate-logging-features.c3", "question": "Почему методы СП (самопроизвольной поляризации) и ГМ (гамма-методы) часто оказываются неэффективными в карбонатных разрезах?", "options": ["Из-за слишком высокой глинистости карбонатных пород", "Из-за отсутствия связи между коллекторскими свойствами и содержанием глинистого материала", "Из-за того, что методы СП и ГМ работают только в терригенных породах", "Из-за слабой корреляции между глинистостью и эффективностью методов"], "answer": [1, 3], "explanation": "Эффективность этих методов в терригенных породах основана на связи глинистости с коллекторскими свойствами, которая в карбонатах отсутствует."}, {"id": "latyshova.logging-normalization-method.q2", "node_id": "latyshova.logging-normalization-method", "type": "single", "claim_id": "logging-normalization-method.c5", "question": "Почему при неоднородном минеральном составе пород метод нормализации диаграмм может давать неверные результаты?", "options": ["Потому что приборы ГИС не могут работать в неоднородных породах", "Потому что нарушается условие совмещения кривых в неколлекторах", "Потому что логарифмический масштаб применим только к однородным породам", "Потому что электрическое сопротивление всегда равно нулю в неоднородных породах"], "answer": 1, "explanation": "Метод основан на принудительном совмещении кривых в неколлекторах; если состав пород меняется, это условие перестает выполняться корректно."}, {"id": "latyshova.logging-normalization-method.q3", "node_id": "latyshova.logging-normalization-method", "type": "cloze", "claim_id": "logging-normalization-method.c2", "question": "Заполните пропуск", "text": "В методе нормализации диаграмм кривые сопротивления и пористости принудительно совмещаются в интервалах неколлекторов, а их последующее {{1}} указывает на наличие углеводородов.", "answers": [["расхождение", "отклонение"]], "explanation": "Именно расхождение кривых, которые ранее были совмещены в неколлекторах, сигнализирует о наличии продуктивного пласта."}, {"id": "latyshova.carbonate-cutoff-porosity.q1", "node_id": "latyshova.carbonate-cutoff-porosity", "type": "cloze", "claim_id": "carbonate-cutoff-porosity.c3", "question": "Заполните пропуск", "text": "Критическое значение пористости (kn*) не является фиксированным числом, так как оно напрямую зависит от {{1}} порового пространства конкретного типа породы.", "answers": [["структуры"]], "explanation": "Текст подчеркивает, что kn* меняется в широких пределах именно из-за различий в структуре пор."}, {"id": "latyshova.carbonate-cutoff-porosity.q2", "node_id": "latyshova.carbonate-cutoff-porosity", "type": "order", "claim_id": "carbonate-cutoff-porosity.c7", "question": "Расставьте по порядку этапы определения критической пористости (kn*):", "items": ["Выбор графика зависимости kn,cn = f(kn) для конкретного типа отложений", "Определение на графике точки, где остаточная водонасыщенность равна 70%", "Принятие соответствующего значения пористости за критический порог kn*", "Использование полученного значения для выделения эффективных коллекторов"], "explanation": "Алгоритм основан на поиске пористости, соответствующей заданному уровню водонасыщенности на специфической для породы кривой."}, {"id": "latyshova.carbonate-cutoff-porosity.q3", "node_id": "latyshova.carbonate-cutoff-porosity", "type": "multi", "claim_id": "carbonate-cutoff-porosity.c6", "question": "Что из перечисленного верно относительно граничного значения пористости (kn*)?", "options": ["Чем меньше размер пор в породе, тем выше должно быть значение kn*", "Значение kn* всегда одинаково для всех типов карбонатных коллекторов", "Использование неверного kn* приводит к ошибкам в расчете эффективной толщины пласта", "Метод определения kn* через водонасыщенность применим только для карбонатов"], "answer": [0, 2], "explanation": "Граничное значение растет при переходе к тонкозернистым породам, а выбор порога напрямую влияет на точность оценки эффективной толщины."}], "cards": [{"id": "latyshova.gis-interpretation-tasks.card", "node_id": "latyshova.gis-interpretation-tasks", "front": "Какие две основные группы методов интерпретации данных ГИС существуют?", "back": "Качественная (для литологии и простых коллекторов) и количественная (для оценки параметров сложных коллекторов и подсчета запасов)."}, {"id": "latyshova.mud-drilling-invasion-zone.card", "node_id": "latyshova.mud-drilling-invasion-zone", "front": "Как тип промывочной жидкости влияет на интерпретацию данных ГИС?", "back": "Тип жидкости определяет условия вскрытия пласта (зоны проникновения, изменение диаметра скважины), что требует адаптации методов интерпретации для получения достоверных результатов."}, {"id": "latyshova.mud-filtration-density-impact.card", "node_id": "latyshova.mud-filtration-density-impact", "front": "Как водоотдача и плотность бурового раствора влияют на качество ГИС?", "back": "Высокие значения водоотдачи и плотности увеличивают репрессию и глубину проникновения фильтрата, что искажает показания приборов и затрудняет оценку свойств пласта."}, {"id": "latyshova.mud-salinity-impact.card", "node_id": "latyshova.mud-salinity-impact", "front": "Как минерализация промывочной жидкости влияет на выбор методов каротажа?", "back": "Высокая минерализация (ρф ≈ ρп) затрудняет выделение коллекторов методами СП и микрозондов, но облегчает оценку их продуктивности разноглубинной электрометрией."}, {"id": "latyshova.alternative-drilling-fluids.card", "node_id": "latyshova.alternative-drilling-fluids", "front": "Как тип промывочной жидкости влияет на выбор методов ГИС?", "back": "Тип жидкости определяет наличие электрического контакта и глубину проникновения, что диктует выбор между гальваническими (вода) и индукционными/ядерными/акустическими (нефильтрующиеся) методами."}, {"id": "latyshova.reservoir-lithology-pore-types.card", "node_id": "latyshova.reservoir-lithology-pore-types", "front": "В чем главное различие между терригенными и карбонатными коллекторами с точки зрения структуры пор?", "back": "В терригенных преобладают межзерновые поры, а в карбонатных — сложные системы из трещин, каверн и карстовых пустот."}, {"id": "latyshova.gis-methods-classification-by-task.card", "node_id": "latyshova.gis-methods-classification-by-task", "front": "На какие четыре группы делят стандартный комплекс ГИС по решаемым задачам?", "back": "Выделение коллекторов, определение пористости, определение глинистости и оценка продуктивности."}, {"id": "latyshova.fluid-saturation-resistivity-parameter.card", "node_id": "latyshova.fluid-saturation-resistivity-parameter", "front": "Что определяет параметр насыщения Pн и как он связан с продуктивностью пласта?", "back": "Pн связывает геофизические свойства с нефтегазонасыщением; при Pн > 1 порода считается нефтегазосодержащей."}, {"id": "latyshova.gis-complex-reservoir-characterization.card", "node_id": "latyshova.gis-complex-reservoir-characterization", "front": "Почему методы ГИС требуют комплексного применения?", "back": "Методы ГИС дают косвенную информацию, обладают перекрестной чувствительностью и требуют адаптации под конкретный разрез и тип бурового раствора."}, {"id": "latyshova.lithological-column-construction-procedure.card", "node_id": "latyshova.lithological-column-construction-procedure", "front": "Каков алгоритм действий при построении литологического разреза скважины, если прямые данные о составе пород отсутствуют?", "back": "Сначала определяют границы пластов, затем строят условную колонку по физическим признакам, которую уточняют по результатам исследования образцов (керна или бокового грунтоноса)."}, {"id": "latyshova.qualitative-gis-response-matrix.card", "node_id": "latyshova.qualitative-gis-response-matrix", "front": "Как интерпретатор ГИС определяет тип породы и флюид?", "back": "Путем сопоставления комплекса физических признаков (ГК, СП, сопротивление, кавернометрия) со справочными профилями и учета влияния глинистости и переходных разностей."}, {"id": "latyshova.complex-lithology-interpretation.card", "node_id": "latyshova.complex-lithology-interpretation", "front": "Почему для сложных литологических разрезов недостаточно качественного анализа диаграмм ГИС?", "back": "Из-за влияния глинистости, гипса и неоднородности состава требуется количественная интерпретация с привлечением априорных геологических данных."}, {"id": "latyshova.direct-reservoir-indicators.card", "node_id": "latyshova.direct-reservoir-indicators", "front": "Что является прямым признаком коллектора при бурении на качественном глинистом растворе?", "back": "Сужение диаметра скважины (глинистая корка), наличие зоны проникновения и положительное приращение на микрозондах."}, {"id": "latyshova.reservoir-cutoff-determination.card", "node_id": "latyshova.reservoir-cutoff-determination", "front": "Какова логическая цепочка перехода от экономики к выделению коллектора на каротажной диаграмме?", "back": "Рентабельный дебит → коэффициент продуктивности → критическая проницаемость → пороговая пористость/глинистость → геофизические отсечки."}, {"id": "latyshova.fluid-saturation-crossplots.card", "node_id": "latyshova.fluid-saturation-crossplots", "front": "Почему для оценки характера насыщения коллектора используют комплекс методов сопротивления и пористости?", "back": "Потому что удельное сопротивление зависит не только от насыщения флюидом, но и от пористости и минерализации воды, поэтому для однозначного вывода необходим комплексный анализ."}, {"id": "latyshova.critical-saturation-parameters-clean-reservoir.card", "node_id": "latyshova.critical-saturation-parameters-clean-reservoir", "front": "Что определяют критические значения Pn и kn в петрофизическом анализе?", "back": "Они разделяют пласт на зоны по характеру притока: чистая нефть/газ, смесь с водой и промышленный/непромышленный приток."}, {"id": "latyshova.critical-saturation-parameters-clayey-reservoir.card", "node_id": "latyshova.critical-saturation-parameters-clayey-reservoir", "front": "Почему для оценки характера насыщения глинистых коллекторов недостаточно знать только параметр насыщения Pn?", "back": "Потому что глинистость влияет на фазовые проницаемости и электропроводность, поэтому одно и то же значение Pn при разной глинистости может соответствовать разным типам насыщения."}, {"id": "latyshova.saturation-interpretation-tasks.card", "node_id": "latyshova.saturation-interpretation-tasks", "front": "Почему для определения характера насыщения коллектора недостаточно анализа только одного параметра (например, сопротивления)?", "back": "Из-за неоднозначности: высокое сопротивление может быть вызвано не только углеводородами, но и литологией, глинистостью или низкой пористостью."}, {"id": "latyshova.effective-thickness-and-fluid-contacts.card", "node_id": "latyshova.effective-thickness-and-fluid-contacts", "front": "Как определяется эффективная толщина пласта при наличии переходной зоны?", "back": "Через интервал от кровли до уровня контакта, определяемого линейной интерполяцией сопротивлений в переходной зоне."}, {"id": "latyshova.laminated-reservoir-effective-thickness.card", "node_id": "latyshova.laminated-reservoir-effective-thickness", "front": "Как рассчитывается эффективная толщина пласта, если его прослои слишком тонкие для раздельного выделения приборами?", "back": "Через расчет относительной глинистости на основе интегральных характеристик (удельных сопротивлений пачки, глин и коллектора)."}, {"id": "latyshova.terrigenous-reservoir-identification.card", "node_id": "latyshova.terrigenous-reservoir-identification", "front": "Что является основой выделения терригенных коллекторов по данным ГИС?", "back": "Комплексный анализ косвенных физических параметров (сопротивление, плотность, акустическое время) с применением граничных значений (порогов)."}, {"id": "latyshova.carbonate-logging-features.card", "node_id": "latyshova.carbonate-logging-features", "front": "Почему интерпретация карбонатных коллекторов сложнее, чем терригенных?", "back": "Из-за высокой гетерогенности, слабой связи свойств с глинистостью и глубокого проникновения фильтрата в низкопористые породы."}, {"id": "latyshova.logging-normalization-method.card", "node_id": "latyshova.logging-normalization-method", "front": "В чем заключается суть метода нормализации диаграмм ГИС?", "back": "Графическое совмещение кривых сопротивления и пористости в неколлекторах для выявления продуктивных интервалов по их расхождению."}, {"id": "latyshova.carbonate-cutoff-porosity.card", "node_id": "latyshova.carbonate-cutoff-porosity", "front": "Почему нельзя использовать одно и то же значение критической пористости (kn*) для всех карбонатных коллекторов?", "back": "Потому что kn* зависит от структуры порового пространства, которая уникальна для каждого типа породы."}], "glossary": [{"id": "t-lithological-section", "term": "Литологический разрез", "en": "Lithological section", "definition": "Сводное описание последовательности горных пород в разрезе скважины по данным каротажа.", "node_id": "latyshova.gis-interpretation-tasks", "page": 90}, {"id": "t-qualitative-interpretation", "term": "Качественная интерпретация", "en": "Qualitative interpretation", "definition": "Способ анализа диаграмм ГИС по характерным визуальным признакам пород и коллекторов без точного численного расчета параметров.", "node_id": "latyshova.gis-interpretation-tasks", "page": 90}, {"id": "t-quantitative-interpretation", "term": "Количественная интерпретация", "en": "Quantitative interpretation", "definition": "Расчет численных значений физических коэффициентов коллектора (пористости, глинистости, насыщения, проницаемости).", "node_id": "latyshova.gis-interpretation-tasks", "page": 90}, {"id": "t-intergranular-porosity-reservoir", "term": "Коллектор с межзерновой пористостью", "en": "Intergranular porosity reservoir", "definition": "Простой тип коллектора, пустотное пространство которого образовано зазорами между зернами породы.", "node_id": "latyshova.gis-interpretation-tasks", "page": 90}, {"id": "t-saturation-parameter-pn", "term": "Параметр насыщения $P_п$", "en": "Saturation parameter Pn", "definition": "Геофизический параметр, используемый при количественной интерпретации сложных коллекторов.", "node_id": "latyshova.gis-interpretation-tasks", "page": 90}, {"id": "t-oil-water-contact-owc", "term": "Водонефтяной контакт (ВНК)", "en": "Oil-water contact (OWC)", "definition": "Граница раздела между нефтяной и водяной частями пласта в процессе разработки.", "node_id": "latyshova.gis-interpretation-tasks", "page": 90}, {"id": "t-gas-liquid-contact-glc", "term": "Газожидкостный контакт (ГЖК)", "en": "Gas-liquid contact (GLC)", "definition": "Граница раздела между газовой и жидкой (нефть/вода) фазами в пласте.", "node_id": "latyshova.gis-interpretation-tasks", "page": 90}, {"id": "t-clay-based-drilling-mud", "term": "Глинистый раствор", "en": "Clay-based drilling mud", "definition": "Наиболее широко применяемая промывочная жидкость при бурении скважин.", "node_id": "latyshova.mud-drilling-invasion-zone", "page": 90}, {"id": "t-mud-filtrate", "term": "Фильтрат раствора", "en": "Mud filtrate", "definition": "Жидкая фаза бурового раствора, проникающая в поры пласта-коллектора.", "node_id": "latyshova.mud-drilling-invasion-zone", "page": 90}, {"id": "t-mud-cake", "term": "Глинистая корка", "en": "Mud cake", "definition": "Осадок глинистых частиц на стенках скважины в зоне фильтрации, уменьшающий диаметр скважины ($d_c \u003c d_a$).", "node_id": "latyshova.mud-drilling-invasion-zone", "page": 90}, {"id": "t-nominal-hole-diameter", "term": "Номинальный диаметр скважины ($d_a$)", "en": "Nominal hole diameter", "definition": "Диаметр бурового долота.", "node_id": "latyshova.mud-drilling-invasion-zone", "page": 90}, {"id": "t-actual-wellbore-diameter", "term": "Фактический диаметр скважины ($d_c$)", "en": "Actual wellbore diameter", "definition": "Реальный диаметр ствола скважины, измеряемый при каротаже.", "node_id": "latyshova.mud-drilling-invasion-zone", "page": 90}, {"id": "t-fluid-loss", "term": "Водоотдача", "en": "Fluid loss", "definition": "Основной показатель качества глинистого раствора, измеряемый объемом отфильтрованной жидкости в единицу времени.", "node_id": "latyshova.mud-filtration-density-impact", "page": 90}, {"id": "t-overbalance", "term": "Репрессия", "en": "Overbalance", "definition": "Превышение давления бурового раствора в скважине над пластовым давлением.", "node_id": "latyshova.mud-filtration-density-impact", "page": 90}, {"id": "t-mud-filtrate-resistivity", "term": "Удельное сопротивление фильтрата глинистого раствора ($\\rho_ф$)", "en": "Mud filtrate resistivity", "definition": "Электрическое сопротивление жидкой фазы бурового раствора, проникающей в пласт.", "node_id": "latyshova.mud-salinity-impact", "page": 91}, {"id": "t-formation-water-resistivity", "term": "Удельное сопротивление пластовой воды ($\\rho_п$)", "en": "Formation water resistivity", "definition": "Электрическое сопротивление минерализованной воды, естественным образом насыщающей поры породы.", "node_id": "latyshova.mud-salinity-impact", "page": 91}, {"id": "t-spontaneous-potential-sp-log", "term": "Метод СП", "en": "Spontaneous Potential (SP) log", "definition": "Метод каротажа, измеряющий естественные электрические поля в скважине.", "node_id": "latyshova.mud-salinity-impact", "page": 91}, {"id": "t-microlog", "term": "Микрозонды", "en": "Microlog", "definition": "Малоглубинные электрические зонды для детального исследования прискважинной зоны.", "node_id": "latyshova.mud-salinity-impact", "page": 91}, {"id": "t-lime-bitumen-mud", "term": "ИБР", "en": "Lime-bitumen mud", "definition": "Известково-битумный раствор на углеводородной непроводящей основе.", "node_id": "latyshova.alternative-drilling-fluids", "page": 91}, {"id": "t-invert-emulsion-water-mud", "term": "ВИЭР", "en": "Invert emulsion water mud", "definition": "Инвертный водоэмульсионный раствор на углеводородной основе.", "node_id": "latyshova.alternative-drilling-fluids", "page": 91}, {"id": "t-induction-log-probe", "term": "Индукционный зонд", "en": "Induction log probe", "definition": "Прибор электрометрии, не требующий прямого гальванического контакта со стенкой скважины.", "node_id": "latyshova.alternative-drilling-fluids", "page": 91}, {"id": "t-terrigenous-section", "term": "Терригенный разрез", "en": "Terrigenous section", "definition": "Разрез, сложенный обломочными породами, в котором преобладают межзерновые коллекторы.", "node_id": "latyshova.reservoir-lithology-pore-types", "page": 91}, {"id": "t-carbonate-section", "term": "Карбонатный разрез", "en": "Carbonate section", "definition": "Разрез, сложенный карбонатными породами (известняками, доломитами) с высокой долей кавернозности и трещиноватости.", "node_id": "latyshova.reservoir-lithology-pore-types", "page": 91}, {"id": "t-vuggy-fractured-reservoir", "term": "Кавернозно-трещинный коллектор", "en": "Vuggy-fractured reservoir", "definition": "Коллектор, пустотное пространство которого сформировано сочетанием каверн (пустот) и трещин.", "node_id": "latyshova.reservoir-lithology-pore-types", "page": 91}, {"id": "t-spontaneous-potential-sp", "term": "Метод собственных потенциалов (СП)", "en": "Spontaneous Potential (SP)", "definition": "Геофизический метод, используемый для дифференциации разреза по относительной глинистости или нерастворимому остатку.", "node_id": "latyshova.gis-methods-classification-by-task", "page": 91}, {"id": "t-gamma-ray-logging-gr", "term": "Гамма-метод (ГМ)", "en": "Gamma Ray Logging (GR)", "definition": "Геофизический метод регистрации естественной радиоактивности пород для оценки объемной глинистости или нерастворимого остатка.", "node_id": "latyshova.gis-methods-classification-by-task", "page": 91}, {"id": "t-saturation-parameter", "term": "Параметр насыщения", "en": "Saturation parameter", "definition": "Петрофизический параметр Pн, связывающий геофизические свойства породы с коэффициентом нефтегазонасыщения.", "node_id": "latyshova.fluid-saturation-resistivity-parameter", "page": 92}, {"id": "t-lateral-electrical-sounding", "term": "Боковое электрическое зондирование", "en": "Lateral electrical sounding", "definition": "Электрический метод каротажа с зондами разной длины для изучения удельного сопротивления пласта по радиусу.", "node_id": "latyshova.fluid-saturation-resistivity-parameter", "page": 92}, {"id": "t-well-log-integration", "term": "Комплексирование методов ГИС", "en": "Well log integration", "definition": "Совместное использование нескольких геофизических методов для повышения точности характеристики пласта.", "node_id": "latyshova.gis-complex-reservoir-characterization", "page": 92}, {"id": "t-flushed-zone-invasion-zone", "term": "Зона проникновения", "en": "Flushed zone / Invasion zone", "definition": "Область пласта вокруг скважины, измененная проникновением фильтрата бурового раствора.", "node_id": "latyshova.gis-complex-reservoir-characterization", "page": 92}, {"id": "t-time-lapse-logging-repeat-logging", "term": "Повторные исследования", "en": "Time-lapse logging / Repeat logging", "definition": "Повторные геофизические измерения в скважине для наблюдения динамических процессов в пласте.", "node_id": "latyshova.gis-complex-reservoir-characterization", "page": 92}, {"id": "t-conditional-lithology-log", "term": "Условная колонка расчленения разреза", "en": "Conditional lithology log", "definition": "Первичная схема деления разреза скважины на интервалы на основе геофизических признаков до получения результатов анализа образцов пород.", "node_id": "latyshova.lithological-column-construction-procedure", "page": 92}, {"id": "t-evaporite-deposits", "term": "Гидрохимические отложения", "en": "Evaporite deposits", "definition": "Породы хемогенного происхождения (гипс, ангидрит, каменная и калийные соли), диагностируемые по характерным физическим константам в комплексах ГИС.", "node_id": "latyshova.complex-lithology-interpretation", "page": 94}, {"id": "t-micro-logs", "term": "Микрозонды (ГМЗ, ПМЗ)", "en": "Micro-logs", "definition": "Малогабаритные каротажные зонды (микроградиент-зонды и микропотенциал-зонды) на прижимающемся башмаке для исследования прискважинной зоны.", "node_id": "latyshova.direct-reservoir-indicators", "page": 96}, {"id": "t-time-lapse-logging-repeat-logging-x", "term": "Метод повторных замеров", "en": "Time-lapse logging / Repeat logging", "definition": "Динамический метод ГИС, заключающийся в многократных измерениях одним методом во времени для отслеживания изменения зоны проникновения.", "node_id": "latyshova.direct-reservoir-indicators", "page": 96}, {"id": "t-permeability-cut-off", "term": "Граничное значение проницаемости (k*ₚₚ)", "en": "Permeability cut-off", "definition": "Критический порог коэффициента проницаемости, выше которого порода относится к классу «коллектор», а ниже — к «неколлектору».", "node_id": "latyshova.reservoir-cutoff-determination", "page": 96}, {"id": "t-commercial-flow-rate", "term": "Рентабельный дебит", "en": "Commercial flow rate", "definition": "Приток нефти или газа из скважины, превышающий экономически оправданный нижний предел для данного региона.", "node_id": "latyshova.reservoir-cutoff-determination", "page": 96}, {"id": "t-productivity-index", "term": "Коэффициент продуктивности (η)", "en": "Productivity index", "definition": "Отношение дебита скважины к депрессии на пласт и эффективной толщине.", "node_id": "latyshova.reservoir-cutoff-determination", "page": 96}, {"id": "t-free-fluid-index-ffi", "term": "Индекс свободного флюида (ИСФ)", "en": "Free fluid index (FFI)", "definition": "Параметр метода ЯМР, характеризую malization", "definition": "Графический метод сопоставления кривых сопротивления и пористости для выделения коллекторов.", "node_id": "latyshova.logging-normalization-method", "page": 105}, {"id": "t-cut-off-porosity", "term": "Критическое значение пористости (kn*)", "en": "Cut-off porosity", "definition": "Минимальное значение пористости, ниже которого порода не обладает достаточными фильтрационными свойствами для признания её коллектором.", "node_id": "latyshova.carbonate-cutoff-porosity", "page": 107}]}</script>

: "Для оценки Pн измеряют сопротивление породы методами сопротивления и определяют знаменатель методами пористости при известном сопротивлении воды.", "quote": "Оценка величины Pн = ρн/Рнρ, должна проводиться методами сопротивления (ρн - числитель выражения) и пористости при известном удельном сопротивлении воды (Рн ρн = ρн - знаменатель выражения).", "unit": "u092-03", "page": 92, "by": "model", "verified": true}, {"id": "fluid-saturation-resistivity-parameter.c4", "kind": "observation", "text": "Удельное сопротивление неизмененной части пласта оценивают с помощью БЭЗ, экранированных и индукционных зондов с разными радиусами исследования.", "quote": "В связи с этим методами оценки продуктивности являются боковое электрическое зондирование, экранированные и индукционные зонды с разными радиусами исследования, позволяющие определить или при качественной интерпретации оценить удельное сопротивление неизмененной части пласта.", "unit": "u092-03", "page": 92, "by": "model", "verified": true}, {"id": "fluid-saturation-resistivity-parameter.c5", "kind": "inference", "text": "Методы сопротивления должны комплексироваться с методами пористости для определения параметра Pн.", "quote": "Методы сопротивления должны комплексироваться с методами пористости для определения (или оценки) ρн.", "unit": "u092-03", "page": 92, "by": "model", "verified": true}, {"id": "fluid-saturation-resistivity-parameter.c6", "kind": "observation", "text": "Электрические методы позволяют установить изменение удельного сопротивления по радиусу и характер проникновения фильтрата.", "quote": "Все это также должно сочетаться с электрическими методами, позволяющими установить изменение удельного сопротивления в пласте по радиусу и характер проникновения фильтрата в коллектор.", "unit": "u092-03", "page": 92, "by": "model", "verified": true}], "term_ids": ["t-saturation-parameter", "t-lateral-electrical-sounding"], "units": ["u092-03"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "latyshova.gis-complex-reservoir-characterization", "order": 9, "part_id": "p3", "minutes": 2, "title": "Комплексирование методов ГИС для детальной характеристики пласта", "book_title": "§ 18. ТИПЫ ИЗУЧАЕМЫХ РАЗРЕЗОВ И КОЛЛЕКТОРОВ", "pages": [92, 92], "difficulty": {"primary": "Пр", "secondary": "Н"}, "threshold": false, "format": {"primary": "data", "reason": "Тип «процедура»; критерии видеоёмкости: изменение во времени. Тема объясняет комплексирование взаимосвязанных физических методов, что оптимально представлять в виде интерактивной концептуальной схемы.", "scene_template": "step-flow"}, "summary": [{"text": "Методы геофизических исследований скважин (ГИС) несут косвенную информацию, поэтому требуют комплексного применения.", "claims": ["gis-complex-reservoir-characterization.c1", "gis-complex-reservoir-characterization.c4"], "page": 92, "by": "model"}, {"text": "Для надежного построения литологического разреза необходим полный комплекс исследований.", "claims": ["gis-complex-reservoir-characterization.c9"], "page": 92, "by": "model"}], "how_it_works": [{"text": "Каждый метод ГИС имеет более широкую сферу применения, чем предполагает стандартизированная классификация.", "claims": ["gis-complex-reservoir-characterization.c1"], "page": 92, "by": "model"}, {"text": "Ядерно-магнитный каротаж (ЯМР) в терригенных и карбонатных пластах, а также СП и ГМ дают информацию о пористости.", "claims": ["gis-complex-reservoir-characterization.c2"], "page": 92, "by": "model"}, {"text": "Методы определения пористости ГГМ, НМ и АК при совместном использовании показывают глинистость.", "claims": ["gis-complex-reservoir-characterization.c3"], "page": 92, "by": "model"}, {"text": "Практически все методы пористости и глинистости содержат косвенные сведения о параметрах коллектора.", "claims": ["gis-complex-reservoir-characterization.c4"], "page": 92, "by": "model"}, {"text": "При малом проникновении микрозонды показывают продуктивность, а ГГМ и НМ — газонасыщенность породы.", "claims": ["gis-complex-reservoir-characterization.c5"], "page": 92, "by": "model"}, {"text": "При глубоком проникновении фильтрата нейтронные измерения проводят повторно уже после обсадки скважины.", "claims": ["gis-complex-reservoir-characterization.c6"], "page": 92, "by": "model"}, {"text": "Повторный каротаж выявляет газонасыщенные пласты по мере расформирования зоны проникновения.", "claims": ["gis-complex-reservoir-characterization.c7"], "page": 92, "by": "model"}, {"text": "Для точности интерпретации необходим контроль параметров промывочной жидкости и репрессии при бурении.", "claims": ["gis-complex-reservoir-characterization.c8"], "page": 92, "by": "model"}, {"text": "Комплекс ГИС должен строго соответствовать изучаемому геологическому разрезу и типу бурового раствора.", "claims": ["gis-complex-reservoir-characterization.c9"], "page": 92, "by": "model"}], "steps": [{"text": "Подбор комплекса методов ГИС под особенности геологического разреза и бурового раствора.", "claims": ["gis-complex-reservoir-characterization.c9"], "page": 92, "by": "model"}, {"text": "Обеспечение оптимальных параметров промывочной жидкости и репрессии на пласт при бурении.", "claims": ["gis-complex-reservoir-characterization.c8"], "page": 92, "by": "model"}, {"text": "Проведение повторных нейтронных исследований после обсадки скважины при наличии глубоких проникновений.", "claims": ["gis-complex-reservoir-characterization.c6", "gis-complex-reservoir-characterization.c7"], "page": 92, "by": "model"}], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": {"wrong": "Каждый геофизический метод измеряет только одно жестко закрепленное физическое свойство породы.", "right": [{"text": "Методы ГИС обладают перекрестной чувствительностью и дают информацию о пористости, глинистости и насыщении в комплексе.", "claims": ["gis-complex-reservoir-characterization.c1", "gis-complex-reservoir-characterization.c3"], "page": 92, "by": "model"}]}, "data_meaning": {"input": "Диаграммы ЯМР, СП, ГМ, ГГМ, НМ, АК, микрозондов, параметры раствора и повторные каротажи.", "output": "Детальный литологический разрез с оценкой пористости, глинистости и газонасыщенности.", "breaks": [{"text": "Точность искажается при глубоком проникновении фильтрата или несоблюдении параметров бурового раствора.", "claims": ["gis-complex-reservoir-characterization.c6", "gis-complex-reservoir-characterization.c8"], "page": 92, "by": "model"}], "hypotheses": [{"text": "Гипотеза: алгоритмы интерпретации ГИС должны учитывать динамику расформирования зоны проникновения во времени.", "claims": ["gis-complex-reservoir-characterization.c7"], "page": 92, "by": "model"}]}, "analogy": {"text": "Ансамбль сенсоров (Sensor Fusion) в машинном обучении. Каждый метод — это физический датчик с шумом и чувствительностью к нескольким фичам сразу.", "breaks_where": "В отличие от стандартных ансамблей данных, физические свойства зоны проникновения динамически меняются со временем."}, "now_practice": [{"text": "Сегодня комплексный инференс параметров пласта и моделирование зон проникновения выполняются в специализированном ПО.", "claims": ["gis-complex-reservoir-characterization.c7", "gis-complex-reservoir-characterization.c9"], "page": 92, "by": "model"}], "layers": {"mechanism": [{"text": "Физические свойства пород влияют сразу на несколько геофизических полей при каротаже.", "claims": ["gis-complex-reservoir-characterization.c2", "gis-complex-reservoir-characterization.c3", "gis-complex-reservoir-characterization.c5"], "page": 92, "by": "model"}], "practice": [{"text": "При глубоком проникновении проводят повторный нейтронный каротаж после обсадки скважины.", "claims": ["gis-complex-reservoir-characterization.c6", "gis-complex-reservoir-characterization.c7"], "page": 92, "by": "model"}], "nuances": [{"text": "Качество построения литологического разреза критически зависит от параметров промывочной жидкости и репрессий.", "claims": ["gis-complex-reservoir-characterization.c8"], "page": 92, "by": "model"}], "deeper": [{"text": "Состав комплекса ГИС обязан строго адаптироваться под тип бурового раствора и разреза.", "claims": ["gis-complex-reservoir-characterization.c9"], "page": 92, "by": "model"}]}, "book_tasks": [{"number": "86", "text": "Диаграммы каких методов геофизических исследований необходимо иметь, чтобы дать заключение о продуктивности коллекторов, выделяемых на основании рис. 14?\n87. Какими геофизическими методами желательно дополнить комплекс диаграмм, приведенных на рис. 24 и 74? Какие задачи должны решать эти методы?\n88. Какие методы геофизического комплекса требуется использовать, чтобы дать однозначное заключение об участке разреза, представленного на рис. 47?\n89. Какими методами необходимо дополнить комплекс диаграмм, представленных на рис. 58, для однозначной характеристики выделенного участка разреза?", "figure": "рис. 14", "page": 92, "ocr_bad": false}], "illustrations": [{"id": "latyshova.gis-complex-reservoir-characterization.ill1", "class": "B", "src": "media/latyshova.gis-complex-reservoir-characterization-steps.svg", "alt": "Порядок действий по тексту автора: Комплексирование методов ГИС для детальной характеристики пласта", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "latyshova.gis-complex-reservoir-characterization.ill2", "class": "B", "src": "media/latyshova.gis-complex-reservoir-characterization-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Комплексирование методов ГИС для детальной характеристики пласта", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.fluid-saturation-resistivity-parameter", "type": "prerequisite"}, {"to": "latyshova.gis-methods-classification-by-task", "type": "prerequisite"}], "claims": [{"id": "gis-complex-reservoir-characterization.c1", "kind": "observation", "text": "Сфера применения отдельных методов ГИС шире стандартной классификации.", "quote": "Сфера применения каждого из перечисленных методов шире, чем это предусмотрено данной классификацией.", "unit": "u092-04", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c2", "kind": "observation", "text": "Методы ЯМР, СП и ГМ способны давать сведения о пористости пластов.", "quote": "Так, диаграмма ЯМР в терригенном и карбонатном разрезах, диаграммы СП, ГМ - в терригенном, несут информацию о пористости;", "unit": "u092-04", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c3", "kind": "observation", "text": "Методы пористости ГГМ, НМ и АК при комплексировании предоставляют данные о глинистости.", "quote": "методы пористости ГГМ, НМ, АК содержат сведения о глинистости, особенно при комплексном использовании диаграмм этих методов;", "unit": "u092-04", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c4", "kind": "inference", "text": "Методы пористости и глинистости косвенно характеризуют свойства коллектора.", "quote": "практически все методы пористости и глинистости несут косвенную информацию о коллекторе", "unit": "u092-04", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c5", "kind": "observation", "text": "Микрозонды оценивают продуктивность, а ГГМ и НМ характеризуют газонасыщенность при неглубоком проникновении.", "quote": "в условиях неглубокого проникновения диаграммы микрозондов дают сведения о продуктивности, диаграммы ГГМ и НМ - о газонасыщенности породы", "unit": "u092-04", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c6", "kind": "inference", "text": "Глубокое проникновение требует повторных нейтронных исследований в обсаженной скважине.", "quote": "При наличии глубоких проникновений геофизические измерения нейтронными методами проводят в виде повторных исследований после обсадки скважины.", "unit": "u092-04", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c7", "kind": "inference", "text": "Повторные исследования помогают выявить газовые интервалы при расформировании зоны проникновения.", "quote": "Это позволяет установить газонасыщенные интервалы по мере расформирования в них зоны проникновения.", "unit": "u092-04", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c8", "kind": "assumption", "text": "Надежность строения литологического разреза требует соблюдения параметров раствора и репрессий при бурении.", "quote": "для надежного построения литологического разреза по геофизическим данным требуется соблюдение оптимальных параметров промывочной жидкости, репрессий на пласты в процессе бурения", "unit": "u092-05", "page": 92, "by": "model", "verified": true}, {"id": "gis-complex-reservoir-characterization.c9", "kind": "assumption", "text": "Литологическое построение требует полного комплекса ГИС, соответствующего разрезу и типу бурового раствора.", "quote": "проведение в скважинах полного комплекса геофизических исследований, соответствующего изучаемому разрезу и типу бурового раствора.", "unit": "u092-05", "page": 92, "by": "model", "verified": true}], "term_ids": ["t-well-log-integration", "t-flushed-zone-invasion-zone", "t-time-lapse-logging-repeat-logging"], "units": ["u092-04", "u092-05", "u092-07"], "video_criteria": ["time_change"], "fallback": false}, {"id": "latyshova.lithological-column-construction-procedure", "order": 10, "part_id": "p4", "minutes": 2, "title": "Порядок построения литологического разреза скважины", "book_title": "§ 19. СОСТАВЛЕНИЕ ЛИТОЛОГИЧЕСКОГО РАЗРЕЗА СКВАЖИНЫ ПО ДАННЫМ КОМПЛЕКСА ОСНОВНЫХ ГЕОФИЗИЧЕСКИХ МЕТОДОВ", "pages": [92, 92], "difficulty": {"primary": "Пр", "secondary": "Р"}, "threshold": true, "format": {"primary": "data", "reason": "Тип «процедура»; критериев видеоёмкости нет. Процедурный характер составления разреза и этапность решений делают подходящим текстовое пошаговое руководство с интерактивной блок-схемой.", "scene_template": "step-flow"}, "summary": [{"text": "Построение литологического разреза скважины состоит из двух основных операций.", "claims": ["lithological-column-construction-procedure.c1"], "page": 92, "by": "model"}, {"text": "Сначала определяют границы пластов, затем оценивают их литологические характеристики.", "claims": ["lithological-column-construction-procedure.c1"], "page": 92, "by": "model"}], "how_it_works": [{"text": "Построение разреза скважины включает определение границ пластов и оценку их литологической характеристики.", "claims": ["lithological-column-construction-procedure.c1"], "page": 92, "by": "model"}, {"text": "Границы и толщины отдельных пластов выделяют по диаграммам геофизических методов.", "claims": ["lithological-column-construction-procedure.c5"], "page": 92, "by": "model"}, {"text": "Литологическую характеристику пород оценивают по совокупности признаков с нескольких диаграмм.", "claims": ["lithological-column-construction-procedure.c2"], "page": 92, "by": "model"}, {"text": "Точность определения литологии растет при увеличении числа установленных физических признаков.", "claims": ["lithological-column-construction-procedure.c2"], "page": 92, "by": "model"}, {"text": "Физические признаки пород часто оказываются общими для совершенно разных геологических отложений.", "claims": ["lithological-column-construction-procedure.c3"], "page": 92, "by": "model"}, {"text": "При нехватке данных сначала создают условную колонку расчленения разреза по физическим признакам.", "claims": ["lithological-column-construction-procedure.c4"], "page": 92, "by": "model"}, {"text": "Затем условную колонку уточняют по образцам пород из бурения или бокового грунтоноса.", "claims": ["lithological-column-construction-procedure.c4"], "page": 92, "by": "model"}], "steps": [{"text": "Шаг 1. Определение границ и толщин отдельных пластов по диаграммам геофизических методов.", "claims": ["lithological-column-construction-procedure.c1", "lithological-column-construction-procedure.c5"], "page": 92, "by": "model"}, {"text": "Шаг 2. Выделение комплекса физических признаков породы по совокупности каротажных диаграмм.", "claims": ["lithological-column-construction-procedure.c2"], "page": 92, "by": "model"}, {"text": "Шаг 3. Составление условной колонки расчленения разреза при отсутствии данных о составе пород.", "claims": ["lithological-column-construction-procedure.c4"], "page": 92, "by": "model"}, {"text": "Шаг 4. Уточнение разреза по результатам петрофизического исследования образцов из бурения или бокового грунтоноса.", "claims": ["lithological-column-construction-procedure.c4"], "page": 92, "by": "model"}], "examples": [], "numbers": [], "formulas": [], "tables": [], "misconception": {"wrong": "Каротажная кривая — это и есть порода, а не косвенное измерение.", "right": [{"text": "Геофизические методы дают лишь физические признаки, которые часто совпадают у разных отложений.", "claims": ["lithological-column-construction-procedure.c3"], "page": 92, "by": "model"}, {"text": "Поэтому без прямой информации о породе сначала строят условную колонку, требующую уточнения по керну.", "claims": ["lithological-column-construction-procedure.c4"], "page": 92, "by": "model"}]}, "data_meaning": {"input": "Диаграммы комплекса геофизических методов (каротажные кривые).", "output": "Литологический разрез скважины или условная колонка расчленения разреза по физическим признакам.", "breaks": [{"text": "Различные породы могут иметь одинаковые физические признаки на геофизических диаграммах.", "claims": ["lithological-column-construction-procedure.c3"], "page": 92, "by": "model"}], "hypotheses": [{"text": "Гипотеза: в машинном обучении это аналогично мультимодальной классификации с недостатком размеченных данных.", "claims": [], "page": 92, "by": "model"}]}, "analogy": {"text": "Построение разреза похоже на мультисенсорный инференс, где физические признаки выступают фичами, а о y": "model", "verified": true}], "term_ids": [], "units": ["u092-12", "u093-01", "u093-02", "u093-03"], "video_criteria": ["invisible_visible"], "fallback": false}, {"id": "latyshova.complex-lithology-interpretation", "order": 12, "part_id": "p4", "minutes": 3, "title": "Составление литологического разреза сложных отложений", "book_title": "§ 19. СОСТАВЛЕНИЕ ЛИТОЛОГИЧЕСКОГО РАЗРЕЗА СКВАЖИНЫ ПО ДАННЫМ КОМПЛЕКСА ОСНОВНЫХ ГЕОФИЗИЧЕСКИХ МЕТОДОВ", "pages": [94, 95], "difficulty": {"primary": "Р", "secondary": "Н"}, "threshold": false, "format": {"primary": "cards", "reason": "Тип «распознавание»; критерии видеоёмкости: цепочка «причина → следствие». Формат интерактивного тренажёра с разбором неоднозначных интервалов на каротажных диаграммах идеально подходит для тренировки распознавания литотипов и принятия решений в условиях неопределённости.", "scene_template": "feature-gallery"}, "summary": [{"text": "Составление литологического разреза сложных отложений требует количественной интерпретации комплекса ГИС и привлечения априорных геологических сведений.", "claims": ["complex-lithology-interpretation.c2"], "page": 95, "by": "model"}, {"text": "Простые терригенные разрезы можно интерпретировать одними электрическими методами, но высокая глинистость, гипс и соли резко осложняют задачу.", "claims": ["complex-lithology-interpretation.c1", "complex-lithology-interpretation.c3"], "page": 95, "by": "model"}], "how_it_works": [{"text": "В простых терригенных разрезах с незначительным содержанием карбонатов породы выделяют электрическими методами.", "claims": ["complex-lithology-interpretation.c1"], "page": 95, "by": "model"}, {"text": "Сложные разрезы сочетают терригенные и карбонатные породы.", "claims": ["complex-lithology-interpretation.c2"], "page": 95, "by": "model"}, {"text": "Они содержат флюиды разной минерализации и обладают разной пористостью.", "claims": ["complex-lithology-interpretation.c2"], "page": 95, "by": "model"}, {"text": "Для построения таких разрезов необхо it": "Ом·м"}]}], "tables": [{"caption": "", "page": 94, "markdown": "|  странства установить трудно из-за глубокого проникновения. Могут обладать как межзерновой, так и трещиной пористостью |  |  |  |  |  |  |   |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n|  Глинистые известняки, мергели. Могут обладать как межзерновой, так и трещиной пористостью | - | Отсутствие проникновения | максимальные | - | максимальные, резко меняющиеся | Средние или максимальные | Средние, но выше, чем в песчаных коллекторах  |\n|  Ангидриты, чистые плотные кристаллические известняки | максимальное | Отсутствие проникновения | минимальные | d_{c} = d_{a} | То же | минимальные | Максимальные  |\n|  Гипсы, сильно загипсованные породы | То же | То же | То же | То же | То же | То же | Минимальные  |\n|  Галит (каменная соль) | - | - | - | d_{c} = d_{a} при предельном насыщении раствора солью | минимальные при d_{c} » d_{a}. | Очень низкие | Показания меняются с изменением диаметра скважины от средних до очень высоких  |\n|  Калийные соли | - | - | - | То же | То же | Аномально высокие | То же  |", "ocr_fixes": []}], "misconception": null, "data_meaning": {"input": "Диаграммы комплекса методов ГИС (электрические, акустический, НГМ, рассеянное гамма-излучение) и априорная геологическая информация.", "output": "Литологическая колонка разреза скважины с выделенными коллекторами, плотными пластами и солями.", "breaks": [{"text": "Высокая глинистость меняет показания геофизических методов и искажает выделение коллектора.", "claims": ["complex-lithology-interpretation.c3"], "page": 95, "by": "model"}, {"text": "Загипсованность пород снижает показания НГМ, вызывая неопределённость при выделении пластов.", "claims": ["complex-lithology-interpretation.c3"], "page": 95, "by": "model"}], "hypotheses": [{"text": "Гипотеза: многопараметрическая неоднозначность при выделении коллекторов сложных разрезов снижается за счёт совместной инверсии данных сенсоров и геостатистических ограничений.", "claims": ["complex-lithology-interpretation.c2"], "page": 95, "by": "model"}]}, "analogy": {"text": "Интерпретация сложного разреза по комплексу ГИС аналогична мультимодальной классификации в машинном обучении: если для простых классов достаточно одного признака (сопротивления), то для пересекающихся классов требуется ансамбль разнородных сенсоров и априорное правило (геологический контекст).", "breaks_where": "Аналогия ломается при сильном искажении физических сигналов глиной или гипсом, когда нелинейный шум в данных разрушает прямые классификационные границы без специального физического моделирования."}, "now_practice": [{"text": "Сегодня совместный анализ комплексных диаграмм ГИС и выявление неоднозначных интервалов выполняются автоматизированно в специализированном ПО интерпретации.", "claims": ["complex-lithology-interpretation.c2"], "page": 95, "by": "model"}], "layers": {"mechanism": [{"text": "В терригенных разрезах литология определяется электрическими методами, а в гидрохимических — по физическим константам акустических и гамма-методов.", "claims": ["complex-lithology-interpretation.c1", "complex-lithology-interpretation.c4"], "page": 95, "by": "model"}], "practice": [{"text": "При наличии смешанных терригенно-карбонатных пород с разным типом пористости обязательно применяется количественная интерпретация с привлечением геологических данных.", "claims": ["complex-lithology-interpretation.c2"], "page": 95, "by": "model"}], "nuances": [{"text": "Глинистость и загипсованность пород вызывают искажения кривых (например, снижают показания НГМ), что создаёт интервалы с неоднозначной интерпретацией.", "claims": ["complex-lithology-interpretation.c3"], "page": 95, "by": "model"}], "deeper": [{"text": "Разделение солей и плотных карбонатов производится по характерным сочетаниям кавернометрии (d_c = d_a) и аномалиям гамма-методов.", "claims": ["complex-lithology-interpretation.c5", "complex-lithology-interpretation.c6"], "page": 94, "by": "model"}]}, "book_tasks": [{"number": "90", "text": "Построить литологическую колонку на основании диаграмм комплекса методов, приведенных на рис. 14, 58. Дать объяснение, какие группы методов дают информацию о границах плотных пород, коллекторов, глин. Какие методы позволяют выделить интервалы повышенной пористости? Какие методы дают возможность судить о продуктивности выделенных коллекторов? Какими исследованиями необходимо располагать, чтобы точно установить, имеются ли в разрезе газоносные коллекторы?\n91. Построить литологическую колонку на основании диаграмм комплекса методов, изображенных на рис. 68. Отметить интервалы, в которых интерпретация не является однозначной.", "figure": "рис. 14", "page": 95, "ocr_bad": false}], "illustrations": [{"id": "latyshova.complex-lithology-interpretation.ill1", "class": "B", "src": "media/latyshova.complex-lithology-interpretation-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Составление литологического разреза сложных отложений", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "complex-lithology-interpretation.c1", "kind": "observation", "text": "Для терригенного разреза со слаборазвитыми карбонатами разрез составляется по электрическим методам.", "quote": "Например для терригенного разреза, в котором плотные, слабоглинистые карбонатные разности пород имеют подчиненное значение, задача может быть достаточно хорошо решена с помощью одних лишь электрических методов.", "unit": "u095-02", "page": 95, "by": "model", "verified": true}, {"id": "complex-lithology-interpretation.c2", "kind": "inference", "text": "Сложные разрезы с чередованием различных пород и типов насыщения требуют количественной интерпретации и привлечения геологических данных.", "quote": "построение разреза и особенно выделение коллектора можно осуществить лишь на основании количественной интерпретации геофизических данных с привлечением геологических сведений о характере разреза.", "unit": "u095-05", "page": 95, "by": "model", "verified": true}, {"id": "complex-lithology-interpretation.c3", "kind": "observation", "text": "Высокая глинистость меняет показания методов, а загипсованность уменьшает показания НГМ, что затрудняет выделение коллекторов.", "quote": "При этом, если содержание глинистого материала велико, то могут резко измениться показания и других методов, что вызовет затруднение в выделении такого коллектора. Загипсованность пород приводит к уменьшению показаний НГМ.", "unit": "u095-01", "page": 95, "by": "model", "verified": true}, {"id": "complex-lithology-interpretation.c4", "kind": "observation", "text": "В гидрохимических отложениях породы выделяются по характерным константам методами рассеянного гамма-излучения и акустическим.", "quote": "При построении разрезов скважин, вскрывающих гидрохимические отложения, большую роль играют методы рассеянного гамма-излучения и акустический, которые позволяют выделить гипсы, ангидриты, известняки и соли по характерным для них константам", "unit": "u095-06", "page": 95, "by": "model", "verified": true}, {"id": "complex-lithology-interpretation.c5", "kind": "observation", "text": "Ангидриты и плотные известняки характеризуются минимальными показаниями каротажей и номинальным диаметром d_c = d_a.", "quote": "Ангидриты, чистые плотные кристаллические известняки | максимальное | Отсутствие проникновения | минимальные | d_{c} = d_{a}", "unit": "u094-01", "page": 94, "by": "model", "verified": true}, {"id": "complex-lithology-interpretation.c6", "kind": "observation", "text": "Калийные соли проявляются аномально высокими показаниями отдельных геофизических методов.", "quote": "Калийные соли | - | - | - | То же | То же | Аномально высокие | То же", "unit": "u094-01", "page": 94, "by": "model", "verified": true}, {"id": "complex-lithology-interpretation.c7", "kind": "observation", "text": "На рис. 68 представлен комплекс диаграмм ГИС для терригенно-карбонатного разреза с параметрами d_r = 0,25 м и p_p = 1,2 Ом·м.", "quote": "Рис.68. Комплекс диаграмм методов ГИС по участку терригенно-карбонатного разреза:  \\( d_{r}=0,25m \\) ;  \\( p_{p}=1,2 \\)  Ом·м при температуре пласта", "unit": "u095-04", "page": 95, "by": "model", "verified": true}], "term_ids": ["t-evaporite-deposits"], "units": ["u094-01", "u095-01", "u095-02", "u095-04", "u095-05", "u095-06", "u095-08"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "latyshova.direct-reservoir-indicators", "order": 13, "part_id": "p5", "minutes": 4, "title": "Прямые признаки и выявление коллекторов", "book_title": "Терригенный разрез", "pages": [96, 96], "difficulty": {"primary": "И", "secondary": "М"}, "threshold": true, "format": {"primary": "short", "reason": "Тип «косвенное измерение»; критерии видеоёмкости: невидимое становится видимым, изменение во времени. Тема содержит логические алгоритмы сопоставления кривых ГИС и граничные физические условия, что оптимально усваивается через структурированный текст с правилами логического инференса.", "scene_template": "tool-in-well"}, "summary": [{"text": "Геофизическое выделение коллектора основано на его отличии от вмещающих пород по проницаемости, пористости и глинистости.", "claims": ["direct-reservoir-indicators.c1"], "page": 96, "by": "model"}, {"text": "Прямые качественные признаки фиксируют сам факт фильтрации флюида в порах по глинистой корке, показаниям микрозондов и наличию зоны проникновения.", "claims": ["direct-reservoir-indicators.c2", "direct-reservoir-indicators.c3", "direct-reservoir-indicators.c4"], "page": 96, "by": "model"}], "how_it_works": [{"text": "Коллектор отличается от пород-неколлекторов значениями проницаемости, пористости и глинистости. Геофизические признаки пласта-коллектора делят на прямые качественные и косвенные количественные.", "claims": ["direct-reservoir-indicators.c1", "direct-reservoir-indicators.c2"], "page": 96, "by": "model"}, {"text": "Прямые признаки подтвеждают фильтрацию воды, нефти, газа или фильтрата бурового раствора в порах породы. При качественном глинистом растворе с низкой водоотдачей образуется глинистая корка.", "claims": ["direct-reservoir-indicators.c3", "direct-reservoir-indicators.c4"], "page": 96, "by": "model"}, {"text": "Образование корки ведет к сужению диаметра скважины (dᵢ \u003c dₙ). На диаграмме микрозондов появляется положительное приращение (ρₙГМЗ \u003c ρₙПМЗ) при низких абсолютных значениях.", "claims": ["direct-reservoir-indicators.c4"], "page": 96, "by": "model"}, {"text": "В пласте возникает зона проникновения фильтрата с радиальным градиентом сопротивления. Наличие градиента фиксируют по данным БЭЗ и разноглубинных фокусированных зондов.", "claims": ["direct-reservoir-indicators.c4", "direct-reservoir-indicators.c9"], "page": 96, "by": "model"}, {"text": "Для экранированных зондов градиент виден визуально: при повышающем проникновении ρₙМБК > ρₙБК, а при понижающем ρₙМБК \u003c ρₙБК.", "claims": ["direct-reservoir-indicators.c10"], "page": 96, "by": "model"}, {"text": "При ухудшении глинистого раствора толщина корки возрастает с 1 см до 3-4 см. Из-за толстой корки микрометоды ломаются, а тонкие неколлекторы не выделяются.", "claims": ["direct-reservoir-indicators.c6", "direct-reservoir-indicators.c7"], "page": 96, "by": "model"}, {"text": "Повышение минерализации раствора ухудшает качественные кривые микрозондов. При бурении на технической воде прямые признаки на кавернограмме и микрозондах обычно отсутствуют.", "claims": ["direct-reservoir-indicators.c8"], "page": 96, "by": "model"}, {"text": "Если отдельный замер не дает признаков, применяют динамические методы. Заведомо наблюдают формирование или расформирование зоны проникновения во времени методами повторных замеров или двух растворов.", "claims": ["direct-reservoir-indicators.c12"], "page": 96, "by": "model"}, {"text": "В обсаженных скважинах повторные нейтронные замеры помогают находить газовые и сложные коллекторы при расформировании зоны проникновения.", "claims": ["direct-reservoir-indicators.c13"], "page": 96, "by": "model"}], "steps": [{"text": "Оценить качество бурового раствора (водоотдачу и минерализацию) для определения применимости микрометодов.", "claims": ["direct-reservoir-indicators.c4", "direct-reservoir-indicators.c6", "direct-reservoir-indicators.c8"], "page": 96, "by": "model"}, {"text": "Сравнить фактический диаметр скважины с номинальным по кавернограмме (поиск сужения dᵢ \u003c dₙ за счет глинистой корки).", "claims": ["direct-reservoir-indicators.c4"], "page": 96, "by": "model"}, {"text": "Проверить наличие положительного приращения показаний микрозондов (ρₙГМЗ \u003c ρₙПМЗ).", "claims": ["direct-reservoir-indicators.c4"], "page": 96, "by": "model"}, {"text": "Сопоставить показания зондов разной глубинности (БЭЗ, БК/МБК, разноглубинные зонды) для выявления радиального градиента сопротивления.", "claims": ["direct-reservoir-indicators.c9", "direct-reservoir-indicators.c10"], "page": 96, "by": "model"}, {"text": "При отсутствии четких градиентов применить динамические наблюдения (метод повторных замеров или метод двух растворов).", "claims": ["direct-reservoir-indicators.c11", "direct-reservoir-indicators.c12", "direct-reservoir-indicators.c13"], "page": 96, "by": "model"}], "examples": [], "numbers": [{"text": "Толщина глинистой корки hᵣₓ в хороших условиях составляет ≤ 1 см, а при ухудшении качества раствора и высокой водоотдаче достигает 3-4 см.", "claims": ["direct-reservoir-indicators.c6"], "page": 96, "by": "model"}], "formulas": [{"latex": "\\frac{\\rho_{10}}{\\rho_{пп}} = \\frac{P_{н10} \\cdot \\rho_ф}{P_н \\cdot \\rho_п}", "page": 96, "vars": [{"sym": "\\rho_{10}", "meaning": "Удельное электрическое сопротивление зоны проникновения", "unit": "Ом·м"}, {"sym": "\\rho_{пп}", "meaning": "Удельное сопротивление неизмененной части пласта", "unit": "Ом·м"}, {"sym": "P_{н10}", "meaning": "Параметр насыщения зоны проникновения", "unit": "безразм."}, {"sym": "P_н", "meaning": "Параметр насыщения неизмененной части пласта", "unit": "безразм."}, {"sym": "\\rho_ф", "meaning": "Удельное сопротивление фильтрата бурового раствора", "unit": "Ом·м"}, {"sym": "\\rho_п", "meaning": "Удельное сопротивление пластовой воды", "unit": "Ом·м"}]}], "tables": [], "misconception": {"wrong": "Если по данным ГИС нет радиального градиента сопротивления, то пласт гарантированно является неколлектором.", "right": [{"text": "Отсутствие градиента сопротивления не отрицает коллектор. При определенных соотношениях насыщения и сопротивлений фильтрата и воды сопротивление зоны проникновения может совпасть с сопротивлением пласта.", "claims": ["direct-reservoir-indicators.c5", "direct-reservoir-indicators.c11"], "page": 96, "by": "model"}]}, "data_meaning": {"input": "Кривые кавернометрии (dᵢ), микрозондов (ГМЗ, ПМЗ), бокового каротажа (БК, МБК), БЭЗ, временные серии повторных нейтронных замеров.", "output": "Разметка интервалов пласта на коллекторы и неколлекторы по прямым признакам фильтрации.", "breaks": [{"text": "При толщине корки 3-4 см сигналы микрозондов искажаются, а тонкие неколлекторные прослои маскируются.", "claims": ["direct-reservoir-indicators.c6", "direct-reservoir-indicators.c7"], "page": 96, "by": "model"}, {"text": "При высокой минерализации раствора или бурении на технической воде прямые признаки на микрокаротаже и кавернограмме исчезают.", "claims": ["direct-reservoir-indicators.c8"], "page": 96, "by": "model"}], "hypotheses": [{"text": "Гипотеза: автоматические классификаторы коллекторов без учета параметров бурового раствора дают фатальные ошибки на участках, пробуренных на технической воде.", "claims": ["direct-reservoir-indicators.c8"], "page": 96, "by": "model"}]}, "analogy": {"text": "Прямой признак коллектора — это как флаг активности (feature flag) в логировании: факт образования глинистой корки физически подтверждает, что в пористую среду проникает флюид (система пропускает трафик). Метод повторных замеров аналогичен мониторингу временных рядов (change detection), когда статическая картина не дает сигнала.", "breaks_where": "Аналогия ломается, если флюид не проникает из-за равенства давлений или если толстая корка искажает сам сенсор (физическое загрязнение датчика)."}, "now_practice": [{"text": "Сегодня сопоставление разноглубинных зондов и выделение приращений микрозондов выполняются автоматически в специализированном ПО интерпретации ГИС, но качество вычислений по-прежнему зависит от контроля параметров бурового раствора.", "claims": ["direct-reservoir-indicators.c4", "direct-reservoir-indicators.c8"], "page": 96, "by": "model"}], "layers": {"mechanism": [{"text": "Промывочный раствор под давлением отфильтровывается в пористый пласт. Глинистые частицы остаются на стенке скважины, образуя корку и сужая ее диаметр.", "claims": ["direct-reservoir-indicators.c4"], "page": 96, "by": "model"}], "practice": [{"text": "Интерпретатор ищет сужение скважины по кавернограмме и расхождение кривых микрозондов (ГМЗ и ПМЗ) для первичного выделения коллекторов.", "claims": ["direct-reservoir-indicators.c4"], "page": 96, "by": "model"}], "nuances": [{"text": "Если корка слишком толстая (3-4 см) или раствор минерализован, микрокаротаж теряет чувствительность и может маскировать плотные прослои.", "claims": ["direct-reservoir-indicators.c6", "direct-reservoir-indicators.c7", "direct-reservoir-indicators.c8"], "page": 96, "by": "model"}], "deeper": [{"text": "В сложных случаях используют временной фактор: методы повторных замеров или двух растворов фиксируют динамику расформирования зоны проникновения.", "claims": ["direct-reservoir-indicators.c12", "direct-reservoir-indicators.c13"], "page": 96, "by": "model"}]}, "book_tasks": [], "illustrations": [{"id": "latyshova.direct-reservoir-indicators.ill1", "class": "B", "src": "media/latyshova.direct-reservoir-indicators-steps.svg", "alt": "Порядок действий по тексту автора: Прямые признаки и выявление коллекторов", "caption": "Порядок действий по тексту автора", "provenance": "схема", "redrawn_from": null, "source_url": null}, {"id": "latyshova.direct-reservoir-indicators.ill2", "class": "B", "src": "media/latyshova.direct-reservoir-indicators-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Прямые признаки и выявление коллекторов", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [], "claims": [{"id": "direct-reservoir-indicators.c1", "kind": "observation", "text": "Выделение коллектора геофизическими методами опирается на его отличие от пород-неколлекторов по проницаемости, пористости и глинистости.", "quote": "Предпосылкой выделения коллектора геофизическими методами [3, 5] является его отличие от вмещающих пород-неколлекторов по проницаемости, пористости, глинистости.", "unit": "u096-03", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c2", "kind": "observation", "text": "Признаки коллектора разделяются на прямые качественные и косвенные количественные.", "quote": "Признаки коллектора делятся на прямые качественные и косвенные количественные.", "unit": "u096-03", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c3", "kind": "observation", "text": "Прямые признаки указывают на то, что в порах коллектора возможна фильтрация воды, нефти, газа и фильтрата бурового раствора.", "quote": "Прямые признаки указывают на возможность фильтрации в порах коллектора воды, нефти, газа и фильтрата бурового раствора.", "unit": "u096-04", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c4", "kind": "observation", "text": "При бурении на качественном глинистом растворе с малой водоотдачей прямыми признаками коллектора служат сужение диаметра скважины, приращение на микрозондах и наличие зоны проникновения.", "quote": "сужение диаметра за счет образования глинистой корки (dᵢ \u003c dₙ); положительные приращения на диаграмме микрозондов (ρₙГМЗ \u003c ρₙПМЗ) при невысоких значениях их показаний; наличие зоны проникновения или радиального градиента сопротивления", "unit": "u096-04", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c5", "kind": "inference", "text": "Наличие зоны проникновения не является обязательным признаком продуктивного коллектора из-за возможного равенства сопротивлений zones.", "quote": "Последний признак не является обязательным, поскольку в продуктивных коллекторах могут создаваться условия, при которых ρₘ ≈ ρₘ.", "unit": "u096-04", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c6", "kind": "observation", "text": "При плохом растворе с высокой водоотдачей толщина глинистой корки возрастает до 3-4 см (в хороших условиях ≤ 1 см), а разница показаний микрозондов сперва растет, а затем убывает.", "quote": "возрастает глинистая корка на поверхности коллектора (hᵣₓ ≤ 1 см в хороших условиях и достигает 3-4 см при плохом растворе). При этом разница в показаниях микрозондов сначала возрастает, а потом убывает.", "unit": "u096-05", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c7", "kind": "observation", "text": "Большая толщина корки блокирует исследование микрометодами и маскирует тонкие прослои неколлекторов.", "quote": "При больших значениях толщины глинистой корки исключается возможность исследования промытой зоны микрометодами; тонкие прослои неколлекторов в коллекторе (глин и плотных пластов) перестают выделяться, так как корка покрывает и эти прослои.", "unit": "u096-05", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c8", "kind": "observation", "text": "Минерализация раствора портит диаграммы микрозондов, а при бурении на технической воде прямые признаки коллектора на микрозондах и кавернограмме практически отсутствуют.", "quote": "При возрастании минерализации раствора корки на стенках коллекторов образуются, но качественные диаграммы микрозондов практически не получаются. При бурении на технической воде признаки коллекторов на диаграммах микрозондов и кавернограммах обычно отсутствуют", "unit": "u096-05", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c9", "kind": "observation", "text": "Радиальный градиент сопротивления устанавливают по интерпретации БЭЗ и диаграммам разноглубинных фокусированных зондов.", "quote": "Наличие радиального градиента сопротивления (повышающего или понижающего проникновения фильтрата глинистого раствора) устанавливают при интерпретации БЭЗ и диаграмм разноглубинных фокусированных зондов.", "unit": "u096-07", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c10", "kind": "observation", "text": "Для экранированных зондов радиальное изменение сопротивления определяется по соотношению показаний МБК и БК.", "quote": "при повышающем проникновении ρₙМБК > ρₙБК, при понижающем ρₙМБК \u003c ρₙБК.", "unit": "u096-08", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c11", "kind": "inference", "text": "Отсутствие замеченного градиента сопротивления не исключает коллектор, так как сопротивления зон могут совпадать.", "quote": "Отсутствие заметного градиента сопротивления не является признаком, отрицающим коллектор. Этот случай может соответствовать такому сочетанию коэффициентов насыщения в зоне проникновения и неизменной части пласта", "unit": "u096-09", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c12", "kind": "observation", "text": "При невозможности выделения коллектора разовыми замерами применяются динамические наблюдения за зоной проникновения во времени (повторные замеры или метод двух растворов).", "quote": "проводят наблюдение процессов формирования или расформирования зоны проникновения во времени каким-нибудь одним методом (БЭЗ, комплекс фокусированных зондов) с неизменными условиями в скважине — метод повторных замеров — или при смене скважинных условий — метод двух растворов.", "unit": "u096-10", "page": 96, "by": "model", "verified": true}, {"id": "direct-reservoir-indicators.c13", "kind": "observation", "text": "Повторные замеры нейтронными методами в обсаженных скважинах выявляют газовые и сложные коллекторы при расформировании зоны проникновения.", "quote": "Такие наблюдения в обсаженных скважинах с использованием нейтронных методов направлены на обнаружение газовых коллекторов в процессе расформирования зоны проникновения. Эти исследования широко применяются также и для выявления сложных коллекторов.", "unit": "u096-10", "page": 96, "by": "model", "verified": true}], "term_ids": ["t-micro-logs", "t-time-lapse-logging-repeat-logging-x"], "units": ["u096-03", "u096-04", "u096-05", "u096-06", "u096-07", "u096-08", "u096-09", "u096-10"], "video_criteria": ["invisible_visible", "time_change"], "fallback": false}, {"id": "latyshova.reservoir-cutoff-determination", "order": 14, "part_id": "p5", "minutes": 6, "title": "Определение кондиционных пределов и эффективной толщины", "book_title": "Терригенный разрез", "pages": [96, 97], "difficulty": {"primary": "Ф", "secondary": "Пр"}, "threshold": true, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: цепочка «причина → следствие». Для усвоения процедуры поиска граничных значений подходит интерактивная блок-схема и пошаговый калькулятор, позволяющий пройти путь от заданного экономического дебита до отсечек на каротажных диаграммах.", "scene_template": "parametric-plot"}, "summary": [{"text": "Главным критерием отнесения породы к коллектору является граничное значение коэффициента проницаемости, вычисляемое на основе минимального рентабельного дебита скважины. По петрофизическим связям критическую проницаемость пересчитывают в пороговые геофизические параметры, с помощью которых разрез разделяют на коллектор и неколлектор и вычисляют эффективную толщину.", "claims": ["reservoir-cutoff-determination.c2", "reservoir-cutoff-determination.c5", "reservoir-cutoff-determination.c11", "reservoir-cutoff-determination.c13"], "page": 96, "by": "model"}], "how_it_works": [{"text": "Главный критерий разделения пород на коллектор и неколлектор — граничное значение коэффициента проницаемости kₚₚ*.", "claims": ["reservoir-cutoff-determination.c2"], "page": 96, "by": "model"}, {"text": "Если проницаемость породы kₚₚ > kₚₚ*, её относят к классу «коллектор».", "claims": ["reservoir-cutoff-determination.c3"], "page": 96, "by": "model"}, {"text": "При kₚₚ ≤ kₚₚ* породу относят к классу «неколлектор».", "claims": ["reservoir-cutoff-determination.c3"], "page": 96, "by": "model"}, {"text": "Критическая проницаемость зависит от свойств флюидов и коллектора, а также от минимального рентабельного дебита в районе.", "claims": ["reservoir-cutoff-determination.c2", "reservoir-cutoff-determination.c5"], "page": 96, "by": "model"}, {"text": "Рентабельным считают дебит, превышающий экономически установленный нижний предел для данного района.", "claims": ["reservoir-cutoff-determination.c5"], "page": 96, "by": "model"}, {"text": "По величине рентабельного дебита рассчитывают коэффициент продуктивности коллектора η.", "claims": ["reservoir-cutoff-determination.c6", "reservoir-cutoff-determination.c7"], "page": 96, "by": "model"}, {"text": "Значение kₚₚ* рассчитывают по формуле с учетом продуктивности η, вязкости флюида μ, радиуса скважины rс и радиуса контура питания Rк.", "claims": ["reservoir-cutoff-determination.c8", "reservoir-cutoff-determination.c9"], "page": 97, "by": "model"}, {"text": "Для перехода к эффективной толщине используют методы пористости или методы глинистости.", "claims": ["reservoir-cutoff-determination.c10"], "page": 97, "by": "model"}, {"text": "По корреляционным связям находим пороговую пористость kн* или пороговую глинистость ηгл*, соответствующие kₚₚ*.", "claims": ["reservoir-cutoff-determination.c11"], "page": 97, "by": "model"}, {"text": "Затем по связям с каротажными параметрами определяют критические значения ΔJнт*, ΔТ*, αСП* и другие.", "claims": ["reservoir-cutoff-determination.c12"], "page": 97, "by": "model"}, {"text": "Отложив эти пороги на каротажных диаграммах, разрез разделяют на коллектор и неколлектор.", "claims": ["reservoir-cutoff-determination.c13"], "page": 97, "by": "model"}, {"text": "В терригенном разрезе при зависимости свойств от глинистости применяют методы СП и ГМ.", "claims": ["reservoir-cutoff-determination.c14"], "page": 97, "by": "model"}, {"text": "При наличии неактивного силикатного или карбонатного цемента используют методы пористости (ΔJнт*, ΔТ*, δн*).", "claims": ["reservoir-cutoff-determination.c15"], "page": 97, "by": "model"}, {"text": "Для однозначного выделения эффективной мощностей применяется метод ЯМР при значениях ИСФ более 1 %.", "claims": ["reservoir-cutoff-determination.c16"], "page": 97, "by": "model"}], "steps": [{"text": "1. Задают минимальный рентабельный дебит Q для региона и вычисляют коэффициент продуктивности коллектора η = Qₙ / (Δp · hₙφ).", "claims": ["reservoir-cutoff-determination.c5", "reservoir-cutoff-determination.c6", "reservoir-cutoff-determination.c7"], "page": 96, "by": "model"}, {"text": "2. Рассчитывают граничную проницаемость k*ₚₚ по формуле k*ₚₚ = (μη / 2π) · ln(Rк / rс).", "claims": ["reservoir-cutoff-determination.c8", "reservoir-cutoff-determination.c9"], "page": 97, "by": "model"}, {"text": "3. Используя петрофизические связи kпр = f(kгл) или kпр = f(kн), находят пороговые значения глинистости ηгл* (kгл*) или пористости kн*.", "claims": ["reservoir-cutoff-determination.c11"], "page": 97, "by": "model"}, {"text": "4. По связям каротажных параметров с пористостью и глинистостью определяют геофизические отсечки: ΔJнт*, ΔТ*, αСП*.", "claims": ["reservoir-cutoff-determination.c12"], "page": 97, "by": "model"}, {"text": "5. Наносят граничные значения на каротажные кривые разреза и выделяют пласты коллекторов для расчета эффективной толщины hэф.", "claims": ["reservoir-cutoff-determination.c13", "reservoir-cutoff-determination.c14", "reservoir-cutoff-determination.c15"], "page": 97, "by": "model"}], "examples": [], "numbers": [{"text": "Для нефтеносных коллекторов граничное значение коэффициента проницаемости kₚₚ* лежит в пределах (1-10) · 10³ мкм².", "claims": ["reservoir-cutoff-determination.c4"], "page": 96, "by": "model"}, {"text": "Для газоносных коллекторов критическое значение проницаемости kₚₚ* находится в пределах (0,1-1) · 10³ мкм².", "claims": ["reservoir-cutoff-determination.c4"], "page": 96, "by": "model"}, {"text": "При использовании метода ЯМР для выделения коллекторов критическое значение индекса свободного флюида (ИСФ) составляет более 1 %.", "claims": ["reservoir-cutoff-determination.c16"], "page": 97, "by": "model"}], "formulas": [{"latex": "k^*_{\\text{пр}} = (\\mu\\eta/2\\pi)\\ln(R_\\text{к}/r_\\text{с})", "page": 97, "vars": [{"sym": "k^*_{\\text{пр}}", "meaning": "граничное или критическое значение коэффициента проницаемости", "unit": "мкм²"}, {"sym": "\\mu", "meaning": "вязкость жидкости или газа в пластовых условиях", "unit": "Па·с"}, {"sym": "\\eta", "meaning": "коэффициент продуктивности коллектора", "unit": "м³/Па·сут·м"}, {"sym": "R_\\text{к}", "meaning": "радиус контура питания скважины", "unit": "м"}, {"sym": "r_\\text{с}", "meaning": "радиус скважины", "unit": "м"}]}], "tables": [], "misconception": null, "data_meaning": {"input": "Экономический показатель минимального рентабельного дебита Q, гидродинамические параметры (депрессия Δp, вязкость μ, радиусы rс и Rк), данные каротажей (СП, ГМ, НТ, АК, плотностной, ЯМР) и калибровочные связи kпр = f(kн), kпр = f(kгл), αСП = f(ηгл).", "output": "Граничные отсечки (cut-offs) геофизических параметров (αСП*, ΔJнт*, ΔТ*, δн*) и бинарная разметка интервалов разреза («коллектор» / «неколлектор») с итоговой эффективной толщиной hэф.", "breaks": [{"text": "М", "claims": [], "page": 96, "by": "model"}, {"text": "о", "claims": [], "page": 96, "by": "model"}, {"text": "д", "claims": [], "page": 96, "by": "model"}, {"text": "е", "claims": ull, "source_url": null}], "links": [{"to": "latyshova.direct-reservoir-indicators", "type": "prerequisite"}], "claims": [{"id": "reservoir-cutoff-determination.c1", "kind": "observation", "text": "К косвенным количественным признакам относятся критические значения проницаемости, пористости, глинистости и геофизические параметры, отражающие их изменение.", "quote": "К ним относятся критические значения проницаемости (kₚₚ), пористости (kₙ), глинистости (Cᵣₓ, kᵣₓ, ηᵣₓ) и геофизические параметры, отражающие изменение kₙ и kₚₚ (ΔJₙᵧ, ΔJᵧ, αCₙ и др.).", "unit": "u096-12", "page": 96, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c2", "kind": "observation", "text": "Основной критерий классификации породы на коллектор и неколлектор — граничное значение коэффициента проницаемости.", "quote": "Основным критерием, позволяющим относить породу к классам \"коллектор\" и \"неколлектор\", является граничное или критическое значение коэффициента проницаемости kₚₚ = k*ₚₚ.", "unit": "u096-13", "page": 96, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c3", "kind": "observation", "text": "Породу относят к коллектору при kₚₚ > kₚₚ*, и к неколлектору при kₚₚ ≤ kₚₚ*.", "quote": "Если kₚₚ > kₚₚ*, породу относят к классу \"коллектор\", если kₚₚ ≤ kₚₚ* - \"неколлектор\".", "unit": "u096-13", "page": 96, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c4", "kind": "observation", "text": "Критическая проницаемость лежит в диапазоне (1-10) · 10³ мкм² для нефти и (0,1-1) · 10³ мкм² для газа.", "quote": "Для нефтеносных коллекторов оно лежит в пределах (1-10) · 10³ мкм², для газовых - (0,1-1) · 10³ мкм².", "unit": "u096-13", "page": 96, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c5", "kind": "observation", "text": "Рентабельным считают дебит выше установленного нижнего предела для района.", "quote": "Рентабельным считают дебит нефти Qₙ или газа Qᵣ, значение которого выше нижнего предела Qₙ, Qᵣ рентабельного дебита для данного района.", "unit": "u096-14", "page": 96, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c6", "kind": "observation", "text": "По минимальному рентабельному дебиту Q определяют коэффициент продуктивности коллектора η.", "quote": "1. По величине минимального рентабельного дебита Q (в м³/сут) определяют коэффициент продуктивности коллектора (в м³/Па·сут·м)", "unit": "u096-15", "page": 96, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c7", "kind": "observation", "text": "Формула коэффициента продуктивности содержит депрессию Δp и эффективную толщину h.", "quote": "где Δp — депрессия в Па, при которой получен дебит Qₙ; h - эффективная толщина коллектора, давшего этот приток (в м).", "unit": "u096-17", "page": 96, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c8", "kind": "observation", "text": "Граничная проницаемость рассчитывается по формуле зависимости от продуктивности, вязкости и радиусов.", "quote": "2. Зная η, рассчитывают соответствующее значение", "unit": "u097-01", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c9", "kind": "observation", "text": "В формулу входят радиусы скважины и контура питания, а также вязкость флюида в пластовых условиях.", "quote": "где rс, Rк - соответственно радиусы скважины и контура питания скважины; μ - вязкость жидкости или газа в пластовых условиях.¹", "unit": "u097-03", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c10", "kind": "observation", "text": "Для определения эффективной толщины применяются методы пористости или методы глинистости.", "quote": "Далее для определения эффективной толщины могут использоваться два пути - либо методы пористости, либо методы глинистости.", "unit": "u097-04", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c11", "kind": "observation", "text": "По корреляционным связям от kпр* переходят к пороговым значениям пористости kн* или глинистости ηгл*.", "quote": "3. При использовании методов пористости требуется иметь корреляционные связи вида ΔJнт = f (kн), методов глинистости - kпр = f (kгл или ηгл), по которым находятся значения kн* либо ηгл* (kгл*), соответствующие kпр*.", "unit": "u097-05", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c12", "kind": "observation", "text": "По связям каротажных параметров с пористостью находят пороговые геофизические значения ΔJнт*, ΔТ*, αСП*.", "quote": "4. Далее, используя упоминавшиеся ранее связи вида ΔJнт = f (kн), ΔТ = f (kн), αСП = (ηгл) и др., по величине kн находят ΔJнт*, ΔТ*, αСП* и т.д.", "unit": "u097-06", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c13", "kind": "observation", "text": "Нанеся отсечки геофизических параметров на диаграммы, получают разделение разреза на коллектор и неколлектор.", "quote": "5. Отложив на диаграммах соответствующих методов ΔJнт*, ΔТ*, αСП*, получают уровень критических значений параметра, который разделяет распознаваемые пласты в разрезе на классы \"коллектор\" и \"неколлектор\".", "unit": "u097-07", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c14", "kind": "observation", "text": "В терригенном разрезе при зависимости свойств от глинистости используют методы СП и ГМ.", "quote": "В терригенном разрезе, где пористость и проницаемость коллекторов зависят от глинистости, для определения hэф используют данные методов СП и ГМ (αСП* и ΔJ*).", "unit": "u097-08", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c15", "kind": "observation", "text": "При наличии неактивного силикатного или карбонатного цемента необходимо использовать методы пористости.", "quote": "Если в таком разрезе имеются пласты, содержащие неактивный силикатный или карбонатный цемент, для определения hэф необходимо использовать методы пористости (ΔJнт*, ΔТ*, δн*).", "unit": "u097-08", "page": 97, "by": "model", "verified": true}, {"id": "reservoir-cutoff-determination.c16", "kind": "observation", "text": "Для однозначного выделения эффективной мощности целесообразно применять ЯМР при значениях ИСФ более 1 %.", "quote": "Для однозначного выделения эффективной мощности целесообразно также применять метод ЯМР по величине значений ИСФ более 1 %.", "unit": "u097-08", "page": 97, "by": "model", "verified": true}], "term_ids": ["t-permeability-cut-off", "t-commercial-flow-rate", "t-productivity-index", "t-free-fluid-index-ffi"], "units": ["u096-11", "u096-12", "u096-13", "u096-14", "u096-15", "u096-16", "u096-17", "u097-01", "u097-02", "u097-03", "u097-04", "u097-05", "u097-06", "u097-07", "u097-08"], "video_criteria": ["cause_effect"], "fallback": false}, {"id": "latyshova.fluid-saturation-crossplots", "order": 15, "part_id": "p5", "minutes": 6, "title": "Оценка характера насыщения и фазового состава флюида", "book_title": "Терригенный разрез", "pages": [97, 98], "difficulty": {"primary": "Н", "secondary": "И"}, "threshold": false, "format": {"primary": "long", "reason": "Тип «неопределённость, решение»; критерии видеоёмкости: цепочка «причина → следствие», контринтуитивность. текст с графическими примерами и формулами оптимален для объяснения методов интерпретации диаграмм каротажа", "scene_template": "decision-scale"}, "summary": [{"text": "Оценка характера насыщения коллектора выполняется через параметр насыщения Pн, связывающий удельное сопротивление пласта и его водонасыщенность.", "claims": ["fluid-saturation-crossplots.c1"], "page": 97, "by": "model"}, {"text": "Для точного анализа применяется комплекс методов сопротивления и пористости, а также данные о качестве пластовой воды.", "claims": ["fluid-saturation-crossplots.c2"], "page": 97, "by": "model"}], "how_it_works": [{"text": "Параметр насыщения Pн определяется как отношение удельного сопротивления неизмененной части пласта ρн к сопротивлению того же пласта в водонасыщенном состоянии ρвн.", "claims": ["fluid-saturation-crossplots.c1"], "page": 97, "by": "model"}, {"text": "Сопротивление пласта в водонасыщенном состоянии ρвн получают косвенно через пористость, переведенную в параметр пористости.", "claims": ["fluid-saturation-crossplots.c2"], "page": 97, "by": "model"}, {"text": "В чистых высокопористых межзерновых коллекторах с постоянными свойствами воды характер насыщения оценивают по сопротивлению ρн или кажущемуся сопротивлению.", "claims": ["fluid-saturation-crossplots.c3"], "page": 97, "by": "model"}, {"text": "При больших изменениях пористости диапазон ρвн перекрывается, поэтому используют параметр насыщения и сопоставление диаграмм методов сопротивления и пористости.", "claims": ["fluid-saturation-crossplots.c4"], "page": 97, "by": "model"}, {"text": "Используются три способа сопоставления: графики ρн = f(kн), зависимости ρн от параметров пористости или нормализация (наложение диаграмм).", "claims": ["fluid-saturation-crossplots.c5"], "page": 97, "by": "model"}, {"text": "Области на графиках делятся на неколлекторы, зону безводной нефти, двухфазную область нефти с водой и область воды.", "claims": ["fluid-saturation-crossplots.c6"], "page": 98, "by": "model"}], "steps": [{"text": "Измерение удельного сопротивления неизмененной части пласта ρн и параметров пористости.", "claims": ["fluid-saturation-crossplots.c2"], "page": 97, "by": "model"}, {"text": "Расчет параметра насыщения Pн или коэффициента водонасыщения kн.", "claims": ["fluid-saturation-crossplots.c7"], "page": 98, "by": "model"}, {"text": "Нанесение полученных точек на графики сопоставления или сравнение с критическими значениями Pн,кр и kн,кр.", "claims": ["fluid-saturation-crossplots.c8"], "page": 98, "by": "model"}], "examples": [{"title": "Пример 46", "page": 98, "figure": "рис. 69", "condition": [{"text": "Коллектор имеет ρn = 20 Ом·м и kn = 25 %.", "claims": ["fluid-saturation-crossplots.c9"], "page": 98, "by": "model"}], "solution": [  "kind": "observation", "text": "При больших изменениях пористости диапазоны ρвн перекрываются, требуя использования параметра насыщения.", "quote": "в межзерновых коллекторах при больших изменениях пористости, а следовательно, и значений ρвн... диапазоны изменения ρвн и ρвн могут в значительной степени перекрываться. В связи с этим для оценки характера насыщения таких коллекторов требуется использовать величину параметра насыщения", "unit": "u097-11", "page": 97, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c5", "kind": "observation", "text": "Процедура базируется на сопоставлении диаграмм методов сопротивления и пористости разными способами.", "quote": "процедура определения характера насыщения базируется на сопоставлении диаграмм методов сопротивления и пористости, которое проводят разными способами", "unit": "u097-11", "page": 97, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c6", "kind": "observation", "text": "Выделяются области неколлекторов, безводной нефти, двухфазная область и область воды.", "quote": "I – область безводной нефти; II – двухфазная область нефти с водой; III – область воды; IV – кривые ρn = f(kn) для коллекторов с разной глинистостью", "unit": "u098-02", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c7", "kind": "inference", "text": "Значение Pн или kн рассчитывается по формулам или графикам.", "quote": "Вычисленное для данного пласта значение Pn или соответствующее ему значение kn, установленное по зависимости Pn = f(kn) для изучаемого коллектора, сравнивают с критическими значениями этих параметров Pn,xp и kn,xp.", "unit": "u098-10", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c8", "kind": "observation", "text": "Характер насыщения определяется нанесением точки с координатами ρн и kн на систему графиков.", "quote": "Характер насыщения коллектора может быть определен нанесением точки с координатами ρn и kn на систему графиков", "unit": "u098-05", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c9", "kind": "observation", "text": "Пример 46: ρn = 20 Ом·м, kn = 25 %.", "quote": "Пример 46. Определить характер насыщения коллектора в разрезе нефтяного месторождения, для которого ρn = 20 Ом·м, kn = 25 %.", "unit": "u098-06", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c10", "kind": "inference", "text": "По результатам примера 46 коллектор дает безводную нефть.", "quote": "Построив точку с указанными координатами, определяем, что коллектор даст при испытании безводную нефть.", "unit": "u098-06", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c11", "kind": "inference", "text": "Пример 47 определяет типы пород по ρn и kn.", "quote": "Ответ: а) неколлектор; б) коллектор нефтеносный; в) коллектор, который при испытании даст нефть с водой.", "unit": "u098-07", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c12", "kind": "observation", "text": "Граница коллектор - неколлектор соответствует kn,ср.", "quote": "4 – граница «коллектор - неколлектор», соответствующая kn,cp", "unit": "u098-02", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c13", "kind": "observation", "text": "С уменьшением kн графики 1 и 2 сближаются и сливаются в области неколлекторов.", "quote": "С уменьшением kn графики 1 и 2 сближаются и сливаются в единый ρno = f(kn) в области неколлекторов", "unit": "u098-05", "page": 98, "by": "model", "verified": true}, {"id": "fluid-saturation-crossplots.c14", "kind": "observation", "text": "Зависимости построены на основе совместного анализа кривых Pн от kн и фазовых проницаемостей.", "quote": "Зависимости ρn* = f(kn) и ρn** = f(kn) построены на основе совместного анализа кривых Pn = f(kn) для разных классов коллекторов", "unit": "u098-05", "page": 98, "by": "model", "verified": true}], "term_ids": [], "units": [  и относительной фазовой проницаемости, позволяя прогнозировать продуктивность с начала разведки.", "claims": ["critical-saturation-parameters-clean-reservoir.c3"], "page": 99, "by": "model"}, {"text": "В области двухфазного течения (Pn* > Pn > Pn**) оценка характера насыщения считается неоднозначной, так как пласт дает смесь нефти и воды.", "claims": ["critical-saturation-parameters-clean-reservoir.c4", "critical-saturation-parameters-clean-reservoir.c5"], "page": 99, "by": "model"}], "steps": [{"text": "Для петрофизического анализа строят зависимости относительной фазовой проницаемости от водонасыщения для систем нефть-вода или газ-вода.", "claims": ["critical-saturation-parameters-clean-reservoir.c6"], "page": 99, "by": "model"}, {"text": "На графике выделяют интервалы: однофазное течение нефти, двухфазное течение нефти с водой и однофазное течение воды.", "claims": ["critical-saturation-parameters-clean-reservoir.c7"], "page": 99, "by": "model"}, {"text": "Критические точки Pn,кр и kn,кр определяют как точку пересечения кривых относительной фазовой проницаемости, соответствующую заданному соотношению нефти и воды.", "claims": ["critical-saturation-parameters-clean-reservoir.c8"], "page": 99, "by": "model"}], "examples": [{"title": "Пример 49", "page": 99, "figure": "рис. 70", "condition": [{"text": "Коллектор характеризуется зависимостями относительной фазовой проницаемости и Pn=f(kn).", "claims": ["critical-saturation-parameters-clean-reservoir.c9"], "page": 99, "by": "model"}], "solution": [{"text": "По кривым определены критические точки водонасыщения: kn*=30%, kn,кр=56%, kn**=80%. По связи Pn=f(kn) найдены соответствующие им Pn*=10, Pn,кр=3, Pn**=1,5.", "claims": ["critical-saturation-parameters-clean-reservoir.c9"], "page": 99, "by": "model"}], "result": [{"text": "Установлены пороговые значения для классификации притока: Pn*=10, Pn,кр=3, Pn**=1,5.", "claims": ["critical-saturation-parameters-clean-reservoir.c9"], "page": 99, "by": "model"}]}], "numbers": [ saturation-interpretation-tasks.c2"], "page": 100, "by": "model"}], "how_it_works": [{"text": "Характер насыщения устанавливается через анализ удельного сопротивления пласта и его сопоставление с удельным сопротивлением пластовых вод. Важную роль играет знание свойств бурового раствора и процессов в зоне проникновения.", "claims": ["saturation-interpretation-tasks.c3"], "page": 100, "by": "model"}, {"text": "Для тонкослоистых коллекторов определение насыщения затруднено из-за усреднения показаний приборов, что требует учета геометрии пластов и их фильтрационных свойств.", "claims": ["saturation-interpretation-tasks.c4"], "page": 100, "by": "model"}], "steps": [{"text": "Процедура включает визуальный анализ кривых каротажа, идентификацию коллекторов, оценку их сопротивления и сопоставление с опорными данными по пластовым водам для выявления нефтенасыщенных зон.", "claims": ["saturation-interpretation-tasks.c1", "saturation-interpretation-tasks.c3"], "page": 100, "by": "model"}], "examples": [], "numbers": [{"text": "В заданиях используются данные с диаграмм, представленных на рисунках 14, 46, 58, 67, 68, 73 и 76.", "claims": ["saturation-interpretation-tasks.c1", "saturation-interpretation-tasks.c2", "saturation-interpretation-tasks.c3", "saturation-interpretation-tasks.c4"], "page": 100, "by": "model"}], "formulas": [], "tables": [], "misconception": {"wrong": "Высокое сопротивление всегда означает нефть.", "right": [{"text": "Высокое сопротивление может быть обусловлено не только наличием углеводородов, но и литологическими особенностями, например, низкой пористостью или отсутствием проводящих минералов, что требует комплексного анализа.", "claims": ["saturation-interpretation-tasks.c2", "saturation-interpretation-tasks.c3"], "page": 100, "by": "model"}]}, "data_meaning": {"input": "Комплекс диаграмм каротажа (сопротивление, пористость, ГК).", "output": "Классификация интервала: продуктивный (нефть/газ) или водоносный.", "breaks": [{"text": "Неоднозначность возника в.", "claims": ["saturation-interpretation-tasks.c3"], "page": 100, "by": "model"}]}, "book_tasks": [{"number": "92", "text": "Определить характер насыщения коллекторов, выделяемых на основании комплекса диаграмм, приведенных на рис. 67 и 76.", "figure": "рис. 67", "page": 100, "ocr_bad": false}, {"number": "93", "text": "Определить характер насыщения коллекторов по диаграммам, представленным на рис. 14 и 68. Объяснить причины неоднозначностей сделанного заключения и способа их устранения.", "figure": "рис. 14", "page": 100, "ocr_bad": false}, {"number": "94", "text": "Определить характер насыщения коллекторов, выделяемых на основании диаграмм рис. 58 и 46. Объяснить, какими методами устанавливается характеристика удельного сопротивления пластовых", "figure": "рис. 58", "page": 100, "ocr_bad": false}], "illustrations": [{"id": "latyshova.saturation-interpretation-tasks.ill1", "class": "B", "src": "media/latyshova.saturation-interpretation-tasks-signal.svg", "alt": "Что наблюдаем и что из этого выводим: Практика оценки характера насыщения по каротажу", "caption": "Что наблюдаем и что из этого выводим", "provenance": "схема", "redrawn_from": null, "source_url": null}], "links": [{"to": "latyshova.critical-saturation-parameters-clean-reservoir", "type": "prerequisite"}], "claims": [{"id": "saturation-interpretation-tasks.c1", "kind": "observation", "text": "Определение характера насыщения коллекторов выполняется на основе комплекса диаграмм.", "quote": "Определить характер насыщения коллекторов, выделяемых на основании комплекса диаграмм, приведенных на рис. 67 и 76.", "unit": "u100-12", "page": 100, "by": "model", "verified": true}, {"id": "saturation-interpretation-tasks.c2", "kind": "inference", "text": "Существуют причины неоднозначности заключения, требующие объяснения и устранения.", "quote": "Объяснить причины неоднозначностей сделанного заключения и способа их устранения.", "unit": "u100-13", "page": 100, "by": "model", "verified": true}, {"id": "saturation-interpretation-tasks.c3", "kind": "observation", "text": "Характеристика удельного сопротивления пластовых вод играет ключевую роль в решении задачи.", "quote": "Объяснить, какими методами устанавливается характеристика удельного сопротивления пластовых вод и какую роль она играет при решении поставленной задачи.", "unit": "u100-14", "page": 100, "by": "model", "verified": false}, {"id": "saturation-interpretation-tasks.c4", "kind": "observation", "text": "Определение насыщения тонкослоистых коллекторов затруднено.", "quote": "Установить характер насыщения тонкослоистого коллектора, выделяемого на основании диаграмм, приведенных на рис. 73. Объяснить, в чем трудность определения положения продуктивных и водоносных коллекторов в разрезе исследуемой скважины.", "unit": "u100-16", "page": 100, "by": "model", "verified": true}], "term_ids": [], "units": ["u100-12", "u100-13", "u100-14", "u100-15", "u100-16"], "video_criteria": [], "fallback": false}, {"id": "latyshova.effective-thickness-and-fluid-contacts", "order": 19, "part_id": "p5", "minutes": 4, "title": "Определение эффективной толщины и межфлюидных контактов", "book_title": "Определение эффективной толщины h_эф продуктивного коллектора", "pages": [100, 101], "difficulty": {"primary": "Пр", "secondary": "П"}, "threshold": true, "format": {"primary": "long", "reason": "Тип «процедура»; критерии видеоёмкости: невидимое становится видимым, изменение во времени. Текст, так как процедура требует пошагового описания логики интерпретации данных ГИС.", "scene_template": "step-flow"}, "summary": [{"text": "Эффективная толщина продуктивного коллектора определяется как интервал, насыщенный нефтью или газом, с учетом характера насыщения и наличия переходных зон.", "claims": ["effective-thickness-and-fluid-contacts.c1", "effective-thickness-and-fluid-contacts.c2"], "page": 100, "by": "model"}, {"text": "Для выделения контактов используются методы геофизических исследований скважин (ГИС), включая анализ сопротивлений и нейтронные методы.", "claims": ["effective-thickness-and-fluid-contacts.c3", "effective-thickness-and-fluid-contacts.c4"], "page": 100, "by": "model"}], "how_it_works": [{"text": "Для однородных пластов толщина определяется по стандартным правилам границ пласта. Если пласт неоднороден по насыщению (зона ВНК или ГВК), продуктивной считается только часть, насыщенная углеводородами.", "claims": ["effective-thickness-and-fluid-contacts.c5", "effective-thickness-and-fluid-contacts.c6"], "page": 101, "by": "model"}, {"text": "При отсутствии переходной зоны ВНК принимается за подошву пласта высокого сопротивления. При наличии переходной зоны используется линейная интерполяция удельного сопротивления между зоной предельного нефтенасыщения и водоносной частью.", "claims": ["effective-thickness-and-fluid-contacts.c7", "effective-thickness-and-fluid-contacts.c8"], "page": 101, "by": "model"}, {"text": "Положение ГНК устанавливается нейтронными методами. В обсаженных скважинах требуются повторные замеры до стабилизации показаний, что подтверждает завершение расформирования зоны проникновения.", "claims": ["effective-thickness-and-fluid-contacts.c9", "effective-thickness-and-fluid-contacts.c10"], "page": 101, "by": "model"}], "steps": [{"text": "Для определения ВНК в переходной зоне: 1) определяют границы зоны (кровля и подошва); 2) находят удельные сопротивления ρншах и ρвп; 3) строят график ρп = f(H) как линейную функцию; 4) находят точку, соответствующую принятому критерию ρп,пр, и проводят через неё контакт.", "claims": ["effective-thickness-and-fluid-contacts.c8"], "page": 101, "by": "model"}], "examples": [{"title": "Определение ГНК", "page": 101, "figure": "рис. 71", "condition": [{"text": "Использование стационарных нейтронных методов в обсаженной скважине.", "claims": ["effective-thickness-and-fluid-contacts.c9"], "page": 101, "by": "model"}], "solution": [{"text": "Проведение повторных замеров до стабилизации повышенных показаний нейтронного метода (НМ), что свидетельствует о ра ve-thickness-and-fluid-contacts.c4", "kind": "observation", "text": "Продуктивная часть ограничена контактами.", "quote": "К такому типу относят коллекторы, расположенные в зоне водонефтяного или газоводяного контактов.", "unit": "u100-19", "page": 100, "by": "model", "verified": true}, {"id": "effective-thickness-and-fluid-contacts.c5", "kind": "inference", "text": "Эффективная толщина — это интервал от кровли до контакта.", "quote": "Эффективная толщина таких объектов определяется интервалом между кровлей коллектора и уровнем ВНК или ГВК.", "unit": "u101-01", "page": 101, "by": "model", "verified": true}, {"id": "effective-thickness-and-fluid-contacts.c6", "kind": "observation", "text": "При отсутствии переходной зоны контакт — это подошва высокого сопротивления.", "quote": "В случае четкой границы воды с нефтью без переходной зоны контакт определяют как подошву пласта высокого сопротивления", "unit": "u101-01", "page": 101, "by": "model", "verified": true}, {"id": "effective-thickness-and-fluid-contacts.c7", "kind": "observation", "text": "При наличии переходной зоны используются данные БЭЗ или индукционного зонда.", "quote": "При наличии переходной зоны ВНК выделяют следующим образом: 1) по диаграммам больших зондов БЭЗ или индукционного зонда определяют нижнюю границу зоны предельного нефтегазонасыщения", "unit": "u101-02", "page": 101, "by": "model", "verified": true}, {"id": "effective-thickness-and-fluid-contacts.c8", "kind": "inference", "text": "В переходной зоне сопротивление меняется линейно.", "quote": "полагая линейным закон изменения ρп в переходной зоне, проводят график ρп = f (Н)", "unit": "u101-02", "page": 101, "by": "model", "verified": true}, {"id": "effective-thickness-and-fluid-contacts.c9", "kind": "observation", "text": "ГНК определяют нейтронными методами.", "quote": "Положение ГНК устанавливают по диаграммам стационарных нейтронных методов", "unit": "u101-03", "page": 101, "by": "model", "verified": true}, {"id": "effective-thickness-and-fluid-contacts.c10", "kind": "observation", "text": "Повторные замеры в обсаженной скважине требуют стабилизации.", "quote": "Повторные замеры в обсаженной скважине проводят по специальной программе до стабилизации повышенных показаний НМ во времени", "unit": "u101-03", "page": 101, "by": "model", "verified": true}, {"id": "effective-thickness-and-fluid-contacts.c11", "kind": "observation", "text": "Время расформирования зоны зависит от проницаемости.", "quote": "Время, необходимое для полного расформирования зоны тем больше, чем меньше проницаемость коллектора", "unit": "u101-07", "page": 101, "by": "model", "verified": true}], "term_ids": ["t-oil-water-contact", "t-gas-oil-contact"], "units": ["u100-17", "u100-18", "u100-19", "u101-01", "u101-02", "u101-03", "u101-05", "u101-06", "u101-07"], "video_criteria": ["invisible_visible", "time_change"], "fallback": false}, {"id": "latyshova.laminated-reservoir-effective-thickness", "order": 20, "part_id": "p5", "minutes": 6, "title": "Расчет эффективной толщины неоднородных и слоистых пластов", "book_title": "Определение эффективной толщины h_эф продуктивного коллектора", "pages": [101, 104], "difficulty": {"primary": "Ф", "secondary": "Пр"}, "threshold": false, "format": {"primary": "interactive", "reason": "Тип «формализм, модель»; критерии видеоёмкости: скачок масштаба, цепочка «причина → следствие». Текст с формулами лучше всего подходит для объяснения математического формализма, так как позволяет детально разобрать логику вывода параметров и условия их применимости.", "scene_template": "parametric-plot"}, "summary": [{"text": "Эффективная толщина пласта рассчитывается как разность общей толщины и суммы толщин неколлекторов. В тонкослоистых пачках, где прослои неразличимы приборами, применяются расчетные методы на основе интегральных характеристик.", "claims": ["laminated-reservoir-effective-thickness.c1", "laminated-reservoir-effective-thickness.c2"], "page": 101, "by": "model"}], "how_it_works": [{"text": "В мощных

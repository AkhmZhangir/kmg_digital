<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img" aria-label="Схема «сигнал → вывод»: Практика оценки характера насыщения по каротажу"><style>
.bg{fill:#ffffff}.box{fill:#eef3f1;stroke:#56625d;stroke-width:1.2}.obs{fill:#e3f1e8;stroke:#2c8350}.inf{fill:#e4ecf7;stroke:#2f65a8}
.ass{fill:#f7e6ee;stroke:#b83a72}.t{font:14px system-ui,sans-serif;fill:#17211e}.s{font:12px system-ui,sans-serif;fill:#56625d}
.h{font:600 15px system-ui,sans-serif;fill:#17211e}.ar{stroke:#0c6b6b;stroke-width:2;fill:none;marker-end:url(#a)}.ax{stroke:#56625d;stroke-width:1}
.c1{stroke:#0c6b6b;stroke-width:2.2;fill:none}.c2{stroke:#9c6c12;stroke-width:2.2;fill:none}.c3{stroke:#b23a3a;stroke-width:2.2;fill:none}
.tag{font:11px ui-monospace,monospace;fill:#56625d}
@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="760" height="236" rx="10"/><text x="20" y="26" class="h">Практика оценки характера насыщения по каротажу</text><text x="20" y="54" class="s">наблюдение (что видно в данных)</text><text x="420" y="54" class="s">вывод (интерпретация)</text><rect class="obs" x="20" y="66" width="320" height="68" rx="8"/><text x="32" y="86" class="t">Определение характера насыщения</text><text x="32" y="104" class="t">коллекторов выполняется на основе</text><text x="32" y="122" class="t">комплекса диаграмм.</text><rect class="obs" x="20" y="144" width="320" height="50" rx="8"/><text x="32" y="164" class="t">Определение насыщения тонкослоистых</text><text x="32" y="182" class="t">коллекторов затруднено.</text><rect class="inf" x="420" y="66" width="320" height="68" rx="8"/><text x="432" y="86" class="t">Существуют причины неоднозначности</text><text x="432" y="104" class="t">заключения, требующие объяснения и</text><text x="432" y="122" class="t">устранения.</text><path class="ar" d="M346 105.0 L414 105.0"/><text x="750" y="228" text-anchor="end" class="tag">схема · наблюдение отделено от вывода</text></svg>
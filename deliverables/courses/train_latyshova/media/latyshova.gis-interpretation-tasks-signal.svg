<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-label="Схема «сигнал → вывод»: Основные задачи интерпретации данных ГИС"><style>
.bg{fill:#ffffff}.box{fill:#eef3f1;stroke:#56625d;stroke-width:1.2}.obs{fill:#e3f1e8;stroke:#2c8350}.inf{fill:#e4ecf7;stroke:#2f65a8}
.ass{fill:#f7e6ee;stroke:#b83a72}.t{font:14px system-ui,sans-serif;fill:#17211e}.s{font:12px system-ui,sans-serif;fill:#56625d}
.h{font:600 15px system-ui,sans-serif;fill:#17211e}.ar{stroke:#0c6b6b;stroke-width:2;fill:none;marker-end:url(#a)}.ax{stroke:#56625d;stroke-width:1}
.c1{stroke:#0c6b6b;stroke-width:2.2;fill:none}.c2{stroke:#9c6c12;stroke-width:2.2;fill:none}.c3{stroke:#b23a3a;stroke-width:2.2;fill:none}
.tag{font:11px ui-monospace,monospace;fill:#56625d}
@media (prefers-color-scheme:dark){.bg{fill:#172020}.box{fill:#1f2a28;stroke:#9aa8a3}.obs{fill:#143424}.inf{fill:#14253a}.ass{fill:#3a1a2a}
.t,.h{fill:#e5ecE9}.s,.tag{fill:#9aa8a3}.ar{stroke:#52c3bf}.ax{stroke:#9aa8a3}.c1{stroke:#52c3bf}.c2{stroke:#ddaa4c}.c3{stroke:#ec8080}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c6b6b"/></marker></defs><rect class="bg" width="760" height="410" rx="10"/><text x="20" y="26" class="h">Основные задачи интерпретации данных ГИС</text><text x="20" y="54" class="s">наблюдение (что видно в данных)</text><text x="420" y="54" class="s">вывод (интерпретация)</text><rect class="obs" x="20" y="66" width="320" height="68" rx="8"/><text x="32" y="86" class="t">Данные ГИС поисковых, разведочных и</text><text x="32" y="104" class="t">эксплуатационных скважин применяют для</text><text x="32" y="122" class="t">составления литологического разреза.</text><rect class="obs" x="20" y="144" width="320" height="68" rx="8"/><text x="32" y="164" class="t">По ГИС выделяют коллекторы, оценивают</text><text x="32" y="182" class="t">характер насыщения, эффективную толщину,</text><text x="32" y="200" class="t">пористость и нефтегазонасыщение.</text><rect class="obs" x="20" y="222" width="320" height="68" rx="8"/><text x="32" y="242" class="t">ГИС позволяет оценивать коэффициенты</text><text x="32" y="260" class="t">проницаемости и глинистости продуктивных</text><text x="32" y="278" class="t">коллекторов.</text><rect class="obs" x="20" y="300" width="320" height="68" rx="8"/><text x="32" y="320" class="t">В эксплуатационных скважинах ГИС</text><text x="32" y="338" class="t">позволяет отслеживать продвижение</text><text x="32" y="356" class="t">водонефтяного и газожидкостного</text><rect class="inf" x="420" y="66" width="320" height="68" rx="8"/><text x="432" y="86" class="t">Литологический разрез обычно составляют</text><text x="432" y="104" class="t">качественной интерпретацией признаков</text><text x="432" y="122" class="t">пород на главных диаграммах комплекса</text><rect class="inf" x="420" y="144" width="320" height="68" rx="8"/><text x="432" y="164" class="t">Для простых коллекторов с межзерновой</text><text x="432" y="182" class="t">пористостью выделение, насыщение и</text><text x="432" y="200" class="t">толщину определяют качественной</text><rect class="inf" x="420" y="222" width="320" height="68" rx="8"/><text x="432" y="242" class="t">Для сложных коллекторов используют</text><text x="432" y="260" class="t">количественную интерпретацию через</text><text x="432" y="278" class="t">коэффициенты пористости, глинистости,</text><rect class="inf" x="420" y="300" width="320" height="68" rx="8"/><text x="432" y="320" class="t">Промышленная оценка коллекторов</text><text x="432" y="338" class="t">опирается на количественные значения</text><text x="432" y="356" class="t">пористости, нефтегазонасыщения и</text><path class="ar" d="M346 222.0 L414 222.0"/><text x="750" y="402" text-anchor="end" class="tag">схема · наблюдение отделено от вывода</text></svg>